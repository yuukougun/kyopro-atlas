  - id: suffix-array
    title: Suffix Array と LCP 配列
    aliases: [接尾辞配列, SA, LCP 配列, SA-IS, Kasai 法, suffix_array, lcp_array, 異なる部分文字列の数]
    type: technique
    level: 黄
    level_evidence: "abc433_g (2060)、abc213_f (2215)、abc272_f (2238)、abc452_g (2255)。abc362_g (1625) は別解。ACL の suffix_array・lcp_array で手軽に使えるので、水色でも使えると注記する（設計書 §4.3）"
    kind: [文字列, データ構造]
    prerequisites: [string-basics, binary-search]
    related: [sparse-table, monotonic-stack, rolling-hash, trie, z-algorithm, suffix-automaton, run-length-encoding]
    summary: "全接尾辞を辞書順に並べた添字の列（SA）と、隣どうしの最長共通接頭辞の配列（LCP）を作る。異なる部分文字列の数、任意の2接尾辞の LCP（LCP 配列の区間最小）、パターンの出現回数、全ペアの LCP の和が求まり、ACL の suffix_array・lcp_array で使える。"
    signs:
      - {type: phrase, text: "異なる部分文字列の個数"}
      - {type: phrase, text: "全接尾辞どうしの LCP の和"}
      - {type: phrase, text: "回転したものどうしの辞書順の大小を数える"}
      - {type: phrase, text: "部分文字列を辞書順に並べたときの K 番目"}
      - {type: constraint, text: "|S| ≤ 5×10^5 程度で全部分文字列を扱う"}
    acl: [suffix_array, lcp_array]
    frequency: B
    sections:
      - "SA と LCP 配列の定義（ACL の suffix_array・lcp_array。lcp の長さは n−1）"
      - "ACL があれば水色でも使える：異なる部分文字列の数＝N(N+1)/2−Σlcp"
      - "任意2接尾辞の LCP は LCP 配列の区間最小（Sparse Table）"
      - "パターンの出現回数：SA 上の二分探索で範囲を求める"
      - "全ペアの LCP の和：LCP 配列の上の単調スタック"
      - "複数の文字列を連結するときの区切り（vector<int> と大きな値）"
      - "回転どうしの比較：S+S+T+T の SA"
      - "部分文字列の辞書順 K 番目（発展）"
      - "自作するなら：ダブリング O(N log^2 N) → O(N log N) → SA-IS"
    merged_keys: []
    visual: "接尾辞を辞書順に並べた表と、隣どうしの LCP を棒グラフで並べた図（任意2接尾辞の LCP＝間の棒の最小）"
    problems:
      - {id: practice2_i, role: example, summary: "異なる部分文字列の個数を N(N+1)/2−ΣLCP で求める（ACL の練習問題）"}
      - {id: abc213_f, role: example, summary: "各 i について Σ_j LCP(S[i:], S[j:]) を求める。SA と LCP 配列の上で単調スタックを使う"}
      - {id: abc362_g, role: practice, summary: "S の中の各 T_i の出現回数。SA 上の二分探索で範囲を求める（Aho–Corasick でも解ける）"}
      - {id: abc433_g, role: practice, summary: "文字を後ろに足していくゲーム。SA と LCP で、いまの文字列を接頭辞に持つ接尾辞の範囲を扱う"}
      - {id: abc272_f, role: practice, summary: "S の回転と T の回転の組で S 側が辞書順以下のものの数。S+S+T+T の SA で並べて数える"}
      - {id: abc452_g, role: practice, summary: "条件を満たす連続部分列の種類数。ランレングスで言い換えて異なる部分文字列の数え上げに帰着する（Suffix Automaton でも解ける）"}
    sources: ["08-string-geo §4.5 suffix-array", "08-string-geo §2.2（文字列の早見表）", "08-string-geo §5 suffix-array", "ACL document_ja/string.md・appendix.md（suffix_array・lcp_array）"]

