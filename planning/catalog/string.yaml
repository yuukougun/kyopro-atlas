    frequency_evidence: "recent 1（abc452_d）・前提として 1 ページに届く（直接 1）・古い ABC 2 問"
    sections:
      - {title: "貪欲な照合：できるだけ左で拾うのが最善な理由", anchor: greedy-matching}
      - {title: "次の出現位置の表 nxt[i][c]（後ろから作る・番兵 N）", anchor: next-occurrence}
      - {title: "文字ごとの位置のリストと lower_bound による代用", anchor: position-lists}
      - {title: "辞書順最小の部分列（残りで足りる範囲の最小の文字を選ぶ）", anchor: lexicographically-smallest, level: 水}
      - {title: "繰り返した文字列の部分列（文字ごとの累積個数で位置を飛ばす）", anchor: repeated-string, level: 青}
    merged_keys: [subsequence-next-table]
    visual: {kind: static, priority: 2, text: "後ろから nxt の表を埋め、T の各文字で表を引いて右へ跳ぶ様子の図"}
    problems:
      - {id: abc452_d, role: example, representative: true, summary: "S の部分文字列のうち、T を部分列として含まないものの数を求める。", approach: "各位置から各文字の次の出現位置を前計算し、始点ごとに数える"}
      - {id: abc324_e, role: practice, summary: "S_i と S_j をこの順につないだ文字列が T を部分列として含む組 (i, j) の数を求める。", approach: "S_i で T の先頭から、S_j で末尾から何文字照合できるかを求め、個数の累積で数える"}
      - {id: typical90_f, role: practice, summary: "長さ K の部分列のうち、辞書順で最小のものを求める。", approach: "先頭から、残りで K 文字取れる範囲の最小の文字を次の出現位置の表で選ぶ（節 lexicographically-smallest）"}
      - {id: abc346_f, role: practice, summary: "S を N 回並べた文字列に、T の各文字を k 回ずつ並べた文字列が部分列として入る最大の k を求める。", approach: "k を二分探索し、文字ごとの累積個数で位置を飛ばして照合する（節 repeated-string）"}
      - {id: arc081_c, role: challenge, summary: "A の部分列でない最短の文字列のうち、辞書順で最小のものを求める。", approach: "次の出現位置の表で後ろから最短の長さの DP をし、前から復元する（DP の側は subsequence-dp）"}
    problems_note: null
    sources: ["08-string-geo §4.1 subsequence-matching", "08-string-geo §5 subsequence-matching", "00-curriculum §3.2 優先度 B（部分列の判定と次の出現位置の表）", "02-dp subsequence-dp（nxt の表との関係）"]

  - id: rolling-hash
    chapter: ハッシュ
    title: ローリングハッシュ
    nav_title: null
    aliases: [ロリハ, 多項式ハッシュ, Rabin-Karp, 文字列のハッシュ, 部分文字列のハッシュ, ハッシュのセグ木, rolling hash]
    type: technique
    level: 水
    level_evidence: "abc141_e (1459)・abc284_f (1575) で水。abc319 以降は、Z・Manacher でも解ける入口が abc398_f (1033)・abc430_e (1109) と基礎の帯に、セグ木に載せる型が abc331_f (1666) と青にある。ハッシュが本体の水の問題は abc319 より前にしかないので古い根拠も使い、水のままにした（open_issues）"
    kind: [文字列, ハッシュ・乱択]
    prerequisites: [mod-arithmetic, prefix-sum, string-basics]
    related: [hash-safety, hashing-for-sets, z-algorithm, palindrome#manacher, suffix-array, segment-tree-monoids, binary-search-answer, convolution-ntt#string-matching, method-comparison#strings]
    summary: "文字列を B 進数の値（mod p）とみなし、接頭辞のハッシュから任意の部分文字列のハッシュを O(1) で取り出して、部分文字列どうしの一致を確率的に判定する。二分探索と組めば LCP や辞書順の比較もできる。"
    signs:
      - {type: phrase, text: "部分文字列どうしが等しいかを大量に判定する"}
      - {type: phrase, text: "重ならずに 2 回現れる部分文字列の最大の長さ"}
      - {type: phrase, text: "1 文字の更新と、区間が回文か（一致するか）のクエリ"}
      - {type: constraint, text: "N ≤ 10^5〜10^6 で、任意の 2 区間の一致判定が Q ≤ 2×10^5 回"}
    acl: [segtree]
    verify: []
    frequency: B
    frequency_evidence: "recent 0・前提として 1 ページに届く（直接 1）・古い ABC 7 問"
    sections:
      - {title: "多項式ハッシュと部分文字列の取り出し（h[r] − h[l]·B^(r−l)）", anchor: polynomial-hash}
      - {title: "なぜ衝突しにくいか（0 でない多項式の根は次数以下）", anchor: collision-bound}
      - {title: "推奨する設計：mod 2^61−1 と実行時に乱択した基数（理由は hash-safety）", anchor: recommended-design}
      - {title: "連結のハッシュと逆向きのハッシュ（回文判定）", anchor: concat-and-reverse}
      - {title: "ハッシュ＋二分探索：LCP・辞書順の比較・最長の繰り返し", anchor: hash-lcp-binary-search}
      - {title: "セグ木に載せるハッシュ：（ハッシュ, B^長さ）の組で更新ありの一致・回文判定", anchor: hash-segment-tree, level: 青}
      - {title: "ハッシュで代用できる場面とできない場面（Z・Manacher・SA・畳み込みとの使い分け）", anchor: when-to-use}
      - {title: "実装の落とし穴（文字を 0 にしない・負の余り・積のオーバーフロー・長さをそろえる）", anchor: pitfalls}
    merged_keys: [hash-lcp-binary-search, hash-segment-tree]
    visual: {kind: static, priority: 2, text: "接頭辞のハッシュの表から引き算で部分文字列のハッシュを取り出す図と、セグ木の節点に（ハッシュ, 長さ）を書いて左を右の長さぶんずらして足す図"}
    problems:
      - {id: abc141_e, role: example, representative: true, summary: "重ならずに 2 回以上現れる部分文字列の最大の長さを求める（N ≤ 5000）。", approach: "長さを二分探索し、長さ固定の部分文字列のハッシュに重複があるかを調べる"}
      - {id: abc331_f, role: example, summary: "1 文字の更新と、区間が回文かの質問に答える。", approach: "前向きと後ろ向きのハッシュ（長さ付き）をセグ木に載せる（節 hash-segment-tree）"}
      - {id: abc398_f, role: practice, summary: "S の後ろに文字を足して作れる最短の回文を求める。", approach: "最長の回文接尾辞を、前向きと後ろ向きのハッシュの一致で求める（Manacher・Z でも解ける）"}
      - {id: abc430_e, role: practice, summary: "A を何回回転すると B に一致するかを求める。", approach: "A+A の中で B を最初に見つける（Z・KMP でも解ける）"}
      - {id: abc284_f, role: practice, summary: "T が「S の先頭 i 文字＋S の反転＋S の残り」の形になる S と i を求める。", approach: "区切り位置ごとに部分文字列の一致を O(1) で判定する（Z でも解ける。例題は z-algorithm）"}
      - {id: typical90_au, role: challenge, summary: "（執筆時に確かめる）", approach: "色の決まり方を言い換えて「ずらした文字列の一致」に帰着し、ハッシュで判定する（Z でも解ける）"}
      - {id: abc150_f, role: challenge, summary: "b が、a の巡回シフトの各要素を x で XOR したものになる (k, x) をすべて求める。", approach: "隣接 XOR の列にして文字列検索に落とす"}
      - {id: abc135_f, role: challenge, summary: "t を繰り返した文字列が、s を繰り返した文字列に含まれる最大の回数を求める。", approach: "一致位置をハッシュで求め、遷移の閉路を判定する"}
    problems_note: null
    sources: ["08-string-geo §4.2 rolling-hash・hash-lcp-binary-search・hash-segment-tree", "08-string-geo §4.2 の表（ハッシュで代用できる場面とできない場面）", "08-string-geo §4.2 hash-safety（推奨する設計）", "08-string-geo §5", "05-ds segment-tree-monoids（abc331_f を共有）"]

  - id: hashing-for-sets
    chapter: ハッシュ
    title: 集合・多重集合のハッシュ
    nav_title: null
    aliases: [Zobrist hashing, 集合のハッシュ, 多重集合のハッシュ, XOR ハッシュ, 和のハッシュ, 乱択ハッシュ, 並べ替えて一致するか]
    type: technique
    level: 水
    level_evidence: "abc367_f (1540, 2024)・abc424_f (1521, 2025)・abc250_e (1421)。応用 abc238_g (2254)、発展 abc455_g (3092, 2026)"
    kind: [ハッシュ・乱択, 累積和・差分]
    prerequisites: [prefix-sum, bit-operations]
    related: [rolling-hash, hash-safety, randomized, fenwick-tree, prime-exponent-vector, parity]
    summary: "値ごとに独立な 64 ビットの乱数を割り当て、集合は XOR、多重集合は和で表すと、2 つの集合が等しいかを順序に関係なく O(1) で比べられる。累積と組めば、区間どうしが並べ替えで一致するかも判定できる。"
    signs:
      - {type: phrase, text: "先頭 x 項の集合と先頭 y 項の集合が等しいか"}
      - {type: phrase, text: "2 つの区間を並べ替えると一致するか（多重集合として等しいか）"}
      - {type: phrase, text: "区間内の各値が偶数個（3 の倍数個）か・区間の積が平方数（立方数）か"}
      - {type: constraint, text: "N, Q ≤ 2×10^5 で区間の多重集合を毎回比べる"}
    acl: []
    verify: []
    frequency: B
    frequency_evidence: "recent 1（abc455_g）・前提として届くページなし・古い ABC 4 問"
    sections:
      - {title: "値ごとに乱数を割り当てる理由（値そのものを足すと {1, 4} と {2, 3} が衝突する）", anchor: random-values}
      - {title: "集合は XOR、多重集合は和（XOR は同じ値 2 個で打ち消す）", anchor: xor-vs-sum}
      - {title: "接頭辞・区間のハッシュ（集合の接頭辞は初めて出た値だけ入れる）", anchor: prefix-hash}
      - {title: "BIT と組んで点の更新に対応する", anchor: with-fenwick}
      - {title: "衝突確率と乱数の作り方（mt19937_64）", anchor: collision-and-rng}
      - {title: "各値が偶数個・k の倍数個かの判定（指数 mod k を乱数で符号化）", anchor: multiplicity-mod-k, level: 黄}
    merged_keys: [set-hashing]
    visual: {kind: static, priority: 2, text: "値ごとの乱数の表と、先頭からの XOR（和）の累積の表。区間のハッシュは両端の差で得る図"}
    problems:
      - {id: abc250_e, role: example, summary: "数列 a の先頭 x 項と b の先頭 y 項が集合として等しいかの質問に答える。", approach: "値ごとの乱数の XOR（初めて出た値だけ入れる）の累積で比べる"}
      - {id: abc367_f, role: example, representative: true, summary: "A の区間と B の区間が並べ替えで一致するかの質問に答える。", approach: "値ごとの乱数の和（多重集合のハッシュ）の累積で比べる"}
      - {id: abc424_f, role: practice, summary: "円周上に弦を順に加え、既存の弦と交わるなら加えないとき、各弦を加えるかを答える。", approach: "円を切り開いて区間にし、区間内の端点がそろうかを XOR ハッシュと BIT で判定する"}
      - {id: abc238_g, role: practice, summary: "区間の積が立方数かの質問に答える。", approach: "素因数ごとの指数 mod 3 を乱数で符号化したハッシュの累積で判定する（節 multiplicity-mod-k）"}
      - {id: abc455_g, role: challenge, summary: "（執筆時に確かめる）", approach: "区間の条件を、設計したハッシュ（Zobrist・和）の累積の一致に帰着し、尺取りで数える（research/00 §2.3.8 の分類による）"}
    problems_note: null
    sources: ["08-string-geo §4.2 hashing-for-sets", "05-ds §4 hashing-for-sets（08 との境界）", "00-curriculum §4.2 集合のハッシュ", "08-string-geo §6.2（集合の比較）"]

  - id: hash-safety
    chapter: ハッシュ
    title: ハッシュの衝突と安全な設計
    nav_title: null
    aliases: [ハッシュの衝突確率, 誕生日のパラドックス, mod 2^61-1, ハッシュの mod の選び方, anti-hash, ハッシュが落とされる, unordered_map の衝突, カスタムハッシュ, hash collision]
    type: technique
    level: 青
    level_evidence: "固定の mod のハッシュが落ちる例が abc339_f (1716, 2024)、mod 2^64 を狙ったテストが typical90_au（★7）。古くは abc141_e (1459) で固定の mod と基数が衝突した記録がある。abc319 以降で安全な設計が答えを分けた問題は青の帯にあるので、水から青に変えた（design-review §4.2・D2）。水で要る実装の推奨（mod 2^61−1・乱択した基数）は rolling-hash#recommended-design に置く"
    kind: [ハッシュ・乱択]
    prerequisites: [rolling-hash]
    related: [hashing-for-sets, randomized, cpp-math-functions#random, cpp-container-idioms#unordered-map, tree-isomorphism]
    summary: "比べるハッシュの組の数から衝突確率を見積もり、固定のテストでも落ちない mod と基数を選ぶ。mod 10^9 程度の 1 つでは全ペアの比較に耐えないので、mod 2^61−1 と実行時に乱択した基数（値のハッシュなら素数）を使う。"
    signs:
      - {type: phrase, text: "ハッシュ値を set や map に大量に入れて重複を数える"}
      - {type: phrase, text: "1000 桁程度の巨大な数の積や和が一致するかを判定する"}
      - {type: constraint, text: "比べ合うハッシュが 10^5 個以上（組が 5×10^9 以上）"}
    acl: []
    verify: []
    frequency: C
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 2 問"
    sections:
      - {title: "衝突確率の見積もり：比較の回数ではなく組の数（誕生日のパラドックス）", anchor: birthday-bound}
