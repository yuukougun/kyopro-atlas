# 文字列（string）の目次。規則は planning/catalog/README.md、上位の規則は planning/design.md §3〜§5。
# 主な材料：research/08（文字列）、research/05 の hashing-for-sets、research/02 の string-automaton-dp、research/00 §3.2
# research/08 の「その他」（インタラクティブ・乱択・bitset・定数倍）と構文解析は misc へ送る（moved）
field: string
pages:
  - id: string-basics
    title: 文字列の基本操作と辞書順
    aliases: [辞書順, 文字列の比較, 部分文字列と部分列, 文字の一斉置換, 回転（巡回シフト）, 連結して辞書順最小]
    type: technique
    level: 基礎
    level_evidence: "abc042_b (616) 辞書順最小の連結、abc286_c (565) 回転と回文、abc076_c (846)、abc110_c (949) 文字の置換の一貫性。ABC の A〜D で常連"
    kind: [文字列]
    prerequisites: [sorting-techniques]
    related: [lexicographic-greedy, run-length-encoding, subsequence-matching, z-algorithm, exchange-argument, bracket-sequence, parsing, cpp-string-api]
    summary: "辞書順の定義（最初に異なる位置で比べ、片方が尽きたら短い方が小さい）を正確に使い、部分文字列・部分列・回転・文字の一斉置換を扱う基本。文字列の B〜D の多くは、この基本と全探索・比較だけで解ける。"
    signs:
      - {type: phrase, text: "条件を満たす文字列のうち辞書順で最小（最大）のものを出力する"}
      - {type: phrase, text: "文字を一斉に別の文字へ置き換える操作を繰り返して一致させられるか"}
      - {type: phrase, text: "先頭の文字を末尾に移す（回転する）操作を何回か行う"}
      - {type: constraint, text: "|S| ≤ 5000 程度で、回転や置き方を全部試せる"}
    acl: []
    frequency: A
    sections:
      - "辞書順の定義と std::string の比較（接頭辞は短い方が小さい）"
      - "部分文字列（連続）と部分列（連続でなくてよい）の違い"
      - "文字の一斉置換：両方向の対応が一意か（全単射）"
      - "連結して辞書順最小：長さが違えば a+b < b+a で比べる"
      - "回転（巡回シフト）の入口：回転回数の全探索と A+A"
      - "計算量の落とし穴（substr・+・find は長さに比例する）"
    merged_keys: []
    visual: "2つの文字列を先頭から照合し、最初に異なる位置で大小が決まる様子の図（接頭辞が小さいことを空文字との比較で示す）"
    problems:
      - {id: abc042_b, role: example, summary: "同じ長さの文字列を全部つないだ結果を辞書順最小にする。ソートして連結する（長さが違えば a+b<b+a の比較が要る）"}
      - {id: abc286_c, role: practice, summary: "回転（コスト A）と書き換え（コスト B）で回文にする最小コスト。回転回数を全探索する"}
      - {id: abc076_c, role: practice, summary: "? を埋めて T を含む辞書順最小の文字列を作る。T を置く位置を全部試し、残りの ? は a にする"}
      - {id: abc110_c, role: practice, summary: "文字の一斉置換を繰り返して S を T にできるか。文字の対応が両方向に一意かを調べる"}
      - {id: arc097_a, role: practice, summary: "異なる部分文字列の辞書順 K 番目（K≤5）。長さ K 以下の部分文字列だけ列挙すれば足りると気づく"}
    sources: ["08-string-geo §4.1 string-basics", "08-string-geo §2.3（混同されやすいもの）", "08-string-geo §5 string-basics・lexicographic-greedy（arc097_a）"]

  - id: subsequence-matching
    title: 部分列の判定と次の出現位置の表
    aliases: [部分列判定, 次の出現位置, nxt 配列, 部分列オートマトン, 序列自動機, 部分列として含むか]
    type: technique
    level: 水
    level_evidence: "typical90_f（★5）。貪欲な部分列判定だけなら基礎帯（abc452_d 903、abc324_e 1153）。応用は abc346_f (1840)、arc081_c (2072)"
    kind: [文字列]
    prerequisites: [string-basics, binary-search]
    related: [subsequence-dp, lexicographic-greedy, lcs, dp-kth-lexicographic]
    summary: "T が S の部分列かは、S を左から見て T の文字をできるだけ早く拾う貪欲で判定できる。各位置から各文字が次に現れる位置の表を作れば、多数の判定・辞書順最小の部分列・部分列でない最短の文字列に使える。"
    signs:
      - {type: phrase, text: "T を部分列として含むか（連続でなくてよい）"}
      - {type: phrase, text: "長さ K の部分列のうち辞書順で最小のもの"}
      - {type: phrase, text: "S の部分列として現れない最短の文字列"}
      - {type: phrase, text: "S を何回も繰り返した文字列の部分列として入るか"}
      - {type: constraint, text: "|S| ≤ 10^5〜10^6、文字は英小文字で 26×(N+1) の表が持てる"}
    acl: []
    frequency: B
    sections:
      - "貪欲な照合：できるだけ左で拾うのが最善な理由"
      - "次の出現位置の表 nxt[i][c]（後ろから作る・番兵 N）"
      - "文字ごとの位置のリストと lower_bound による代用"
      - "辞書順最小の部分列（残りで足りる範囲の最小の文字を選ぶ）"
      - "部分列でない最短の文字列（後ろからの DP）（青）"
      - "繰り返した文字列の部分列（文字ごとの累積個数で位置を飛ばす）（青）"
      - "部分列の数え上げは DP へ（部分列 DP）"
    merged_keys: [subsequence-next-table]
    visual: "後ろから nxt の表を埋め、T の各文字で表を引いて右へ跳ぶ様子の図"
    problems:
      - {id: abc452_d, role: example, summary: "T を部分列として含まない部分文字列の数。各位置から各文字の次の出現位置を前計算し、始点ごとに数える"}
      - {id: typical90_f, role: example, summary: "長さ K の部分列の辞書順最小。先頭から、残りで K 文字取れる範囲の最小の文字を次の出現位置の表で選ぶ"}
      - {id: abc324_e, role: practice, summary: "S_i+S_j が T を部分列に含む組の数。S_i で T の先頭から、S_j で末尾から何文字照合できるかを求めて数える"}
      - {id: abc346_f, role: practice, summary: "S を N 回並べた中に、T の各文字を k 回ずつ並べたものが部分列で入る最大の k。k を二分探索し、文字ごとの累積個数で照合する"}
      - {id: arc081_c, role: challenge, summary: "A の部分列でない最短の文字列のうち辞書順最小。次の出現位置の表で後ろから DP し、前から復元する"}
    sources: ["08-string-geo §4.1 subsequence-matching", "08-string-geo §5 subsequence-matching", "00-curriculum §3.2 優先度 B（部分列の判定と次の出現位置の表）", "02-dp subsequence-dp（nxt の表との関係）"]

  - id: rolling-hash
    title: ローリングハッシュ
    aliases: [ロリハ, 多項式ハッシュ, Rabin-Karp, 文字列のハッシュ, 部分文字列のハッシュ, ハッシュのセグ木]
    type: technique
    level: 水
    level_evidence: "abc141_e (1459)、abc284_f (1575)、typical90_au（★7。考察込み）。別解として abc430_e (1109)。更新ありのセグ木版は abc331_f (1666) で青"
    kind: [文字列, ハッシュ・乱択]
    prerequisites: [mod-arithmetic, prefix-sum, string-basics]
    related: [hash-safety, z-algorithm, palindrome, suffix-array, hashing-for-sets, segment-tree-monoids, binary-search-answer, string-queries-ds]
    summary: "文字列を B 進数の値（mod p）とみなし、接頭辞のハッシュから任意の部分文字列のハッシュを O(1) で取り出して、部分文字列どうしの一致を確率的に判定する。二分探索と組めば LCP や辞書順の比較、セグ木に載せれば更新ありの一致・回文判定もできる。"
    signs:
      - {type: phrase, text: "部分文字列どうしが等しいかを大量に判定する"}
      - {type: phrase, text: "重ならずに2回現れる部分文字列の最大の長さ（長さで二分探索）"}
      - {type: phrase, text: "1文字の更新と、区間が回文か（一致するか）のクエリ"}
      - {type: constraint, text: "N ≤ 10^5〜10^6 で、任意の2区間の一致判定が Q ≤ 2×10^5 回"}
    acl: [segtree]
    frequency: B
    sections:
      - "多項式ハッシュと部分文字列の取り出し（h[r] − h[l]·B^(r−l)）"
      - "なぜ衝突しにくいか（0 でない多項式の根は次数以下）"
      - "連結のハッシュと逆向きのハッシュ（回文判定）"
      - "ハッシュ＋二分探索：LCP・辞書順の比較・最長の繰り返し"
      - "セグ木に載せるハッシュ：（ハッシュ, B^長さ）の組で更新ありの一致・回文判定（青）"
      - "ハッシュで代用できる場面とできない場面（Z・Manacher・SA・畳み込みとの使い分け）"
      - "実装の落とし穴（文字を 0 にしない・負の余り・積のオーバーフロー・長さをそろえる）"
    merged_keys: [hash-lcp-binary-search, hash-segment-tree]
    visual: "接頭辞のハッシュの表から引き算で部分文字列のハッシュを取り出す図と、セグ木の節点に（ハッシュ, 長さ）を書いて左を右の長さぶんずらして足す図"
    problems:
      - {id: abc141_e, role: example, summary: "重ならずに2回現れる部分文字列の最大長（N≤5000）。長さを二分探索し、長さ固定の部分文字列のハッシュに重複があるかを調べる"}
      - {id: abc284_f, role: example, summary: "T＝S の前半＋S の反転＋S の後半となる S と位置を探す。区切り位置ごとに部分文字列の一致を O(1) で判定する"}
      - {id: abc331_f, role: example, summary: "1文字の更新と、区間が回文かのクエリ。前向きと後ろ向きのハッシュ（長さ付き）をセグ木に載せる"}
      - {id: abc398_f, role: practice, summary: "後ろに文字を足して最短の回文を作る。最長の回文接尾辞を前向き・後ろ向きのハッシュの一致で求める"}
      - {id: abc430_e, role: practice, summary: "A を何回回転すると B になるか。A+A の中で B を最初に見つける（Z・KMP でも解ける）"}
      - {id: typical90_au, role: challenge, summary: "色の決まり方を言い換えて「ずらした文字列の一致」に帰着し、ハッシュで判定する（Z でも解ける）"}
      - {id: abc150_f, role: challenge, summary: "b が a の巡回シフトを x で XOR したものになる (k, x) の列挙。隣接 XOR の列にして文字列検索に落とす"}
      - {id: abc135_f, role: challenge, summary: "t の繰り返しが s の繰り返しに含まれる最大回数。一致位置をハッシュで求め、遷移の閉路を判定する"}
    sources: ["08-string-geo §4.2 rolling-hash・hash-lcp-binary-search・hash-segment-tree", "08-string-geo §4.2 の表（ハッシュで代用できる場面とできない場面）", "08-string-geo §5", "05-ds segment-tree-monoids（abc331_f を共有）"]

  - id: hash-safety
    title: ハッシュの衝突と安全な設計（mod の選び方・ハック対策）
    aliases: [ハッシュの衝突確率, 誕生日のパラドックス, mod 2^61−1, anti-hash, ハッシュが落とされる, unordered_map の衝突, カスタムハッシュ]
    type: technique
    level: 水
    level_evidence: "ハッシュを使う水の問題から必要（abc141_e 1459 で固定の mod・基数がテストに衝突した記録）。固定の mod で値を比べて落ちる例が abc339_f (1716)"
    kind: [ハッシュ・乱択]
    prerequisites: [rolling-hash]
    related: [hashing-for-sets, randomized, cpp-random-chrono, stl-containers, tree-isomorphism]
    summary: "ハッシュの衝突確率は比べ合うハッシュの組の数で決まり、mod 10^9 程度を1つ使うだけでは全ペアの比較に耐えない。mod 2^61−1 と実行時に乱択した基数を使い、mod 2^64 の自然なオーバーフローや固定の mod に頼らないことで、事前に用意されたテストでも落ちない設計にする。"
    signs:
      - {type: phrase, text: "ハッシュ値を set や map に大量に入れて重複を数える"}
      - {type: phrase, text: "1000 桁程度の巨大な数の積や和が一致するかを判定する"}
      - {type: phrase, text: "unsigned long long の自然なオーバーフローに任せたハッシュで WA になる"}
      - {type: constraint, text: "比べ合うハッシュが 10^5 個以上（組が 5×10^9 以上）"}
    acl: []
    frequency: B
    sections:
      - "衝突確率の見積もり：比較の回数ではなく組の数（誕生日のパラドックス）"
      - "mod 2^64 が破られる理由（Thue–Morse 列。奇数のどの基数でも長さ 1024 で衝突する）"
      - "推奨する設計：mod 2^61−1・乱択した基数・除算を使わない剰余"
      - "多項式ハッシュは基数を、値のハッシュは mod（素数）を乱択する（abc339_f）"
      - "AtCoder で狙われる条件（事前に固定されたテストと、誰でも使う固定の選択）"
      - "二重ハッシュとの比較"
      - "unordered_map への攻撃と、乱数を混ぜたカスタムハッシュ"
    merged_keys: []
    visual: "比べるハッシュの個数と衝突確率の関係を、mod 約 10^9 と 2^61−1 で比べるグラフ"
    problems:
      - {id: abc339_f, role: example, summary: "最大1000桁の A_i×A_j＝A_k となる組を数える。値を mod で比べるハッシュで、固定の 2^61−1 や 2^64 が落とされ、mod を乱択すべき例"}
      - {id: typical90_au, role: example, summary: "ずらした文字列の一致をハッシュで判定する問題。作問者の解説が、mod 2^64 ではどの基数でも衝突するテストを作れると明記している"}
      - {id: abc141_e, role: practice, summary: "長さの二分探索とハッシュの問題で、固定の mod・基数がテストに衝突し、基数を変えて回避した記録がある"}
    sources: ["08-string-geo §4.2 hash-safety（衝突確率の表・mod 2^64 の導出・推奨する設計）", "08-string-geo §1.3（自分で確かめたこと）", "08-string-geo §6.3（ハッシュの衝突確率）", "09-cpp cpp-random-chrono"]

  - id: hashing-for-sets
    title: 集合・多重集合のハッシュ（Zobrist hashing）
    aliases: [Zobrist hashing, 集合のハッシュ, 多重集合のハッシュ, XOR ハッシュ, 和のハッシュ, 乱択ハッシュ, 並べ替えて一致するか]
    type: technique
    level: 水
    level_evidence: "abc250_e (1421)、abc424_f (1521)、abc367_f (1540)。応用 abc238_g (2254)、発展 abc455_g (3092)"
    kind: [ハッシュ・乱択, 累積和・差分]
    prerequisites: [prefix-sum, bit-operations]
    related: [rolling-hash, hash-safety, randomized, fenwick-tree, prime-exponent-vector, parity]
    summary: "値ごとに独立な 64 ビットの乱数を割り当て、集合は XOR、多重集合は和でハッシュにすると、順序に関係なく2つの集合が等しいかを O(1) で比べられる。接頭辞や区間の累積と組めば、区間どうしが並べ替えで一致するかや、各値が偶数個かの判定に使える。"
    signs:
      - {type: phrase, text: "先頭 x 項の集合と先頭 y 項の集合が等しいか"}
      - {type: phrase, text: "2つの区間を並べ替えると一致するか（多重集合として等しいか）"}
      - {type: phrase, text: "区間内の各値が偶数個（3 の倍数個）か・区間の積が平方数（立方数）か"}
      - {type: constraint, text: "N, Q ≤ 2×10^5 で区間の多重集合を毎回比べる"}
    acl: []
    frequency: B
    sections:
      - "値ごとに乱数を割り当てる理由（値そのものを足すと {1, 4} と {2, 3} が衝突する）"
      - "集合は XOR、多重集合は和（XOR は同じ値2個で打ち消す）"
      - "接頭辞・区間のハッシュ（集合の接頭辞は初めて出た値だけ入れる）"
      - "各値が偶数個・k の倍数個かの判定（指数 mod k を乱数で符号化）（黄）"
      - "衝突確率と乱数の作り方（mt19937_64）"
      - "BIT と組んで点の更新に対応する"
    merged_keys: [set-hashing]
    visual: "値ごとの乱数の表と、先頭からの XOR（和）の累積の表。区間のハッシュは両端の差で得る図"
    problems:
      - {id: abc250_e, role: example, summary: "数列 a の先頭 x 項と b の先頭 y 項の集合が等しいか。値ごとの乱数の XOR（初めて出たときだけ入れる）の累積で比べる"}
      - {id: abc367_f, role: example, summary: "A の区間と B の区間が並べ替えで一致するか。値ごとの乱数の和（多重集合のハッシュ）の累積で比べる"}
      - {id: abc424_f, role: practice, summary: "円周に弦を加え、既存の弦と交わるなら加えない。円を切り開いて区間にし、区間内の端点がそろうかを XOR ハッシュと BIT で判定する"}
      - {id: abc238_g, role: challenge, summary: "区間の積が立方数か。素因数ごとの指数 mod 3 を乱数で符号化したハッシュの累積で判定する"}
      - {id: abc455_g, role: challenge, summary: "区間の条件を、設計したハッシュの累積の一致に帰着して数える（発展）"}
    sources: ["08-string-geo §4.2 hashing-for-sets", "05-ds §4 hashing-for-sets（08 との境界）", "00-curriculum §4.2 集合のハッシュ", "08-string-geo §6.2（集合の比較）"]

  - id: z-algorithm
    title: Z-algorithm（各位置からの最長共通接頭辞）
    aliases: [Z 法, Z 配列, Z function, 拡張 KMP, z_algorithm, 巡回シフト, A+A の技]
    type: technique
    level: 水
    level_evidence: "abc430_e (1109)、abc141_e (1459)、abc284_f (1575)。応用は abc257_g (2078)、abc343_g (2114)。パターン検索は ACL の z_algorithm で足りるので Z を水、KMP を青にする（設計書 §4.3）"
    kind: [文字列]
    prerequisites: [string-basics]
    related: [kmp, rolling-hash, suffix-array, palindrome, dp-sequence-partition, bit-dp]
    summary: "Z 配列 z[i]（S と S[i:] の最長共通接頭辞の長さ）を O(N) で求め、P＋区切り＋T の Z 配列でパターンの全出現を決定的に見つける。A+A の中で B を探す回転の検索や周期の判定にも使え、ACL の z_algorithm で書ける。"
    signs:
      - {type: phrase, text: "各位置から、文字列の先頭と何文字一致するか"}
      - {type: phrase, text: "A を何回回転すると B になるか（円環状の文字列の一致）"}
      - {type: phrase, text: "T を S の接頭辞の連結で表す最小の個数"}
      - {type: phrase, text: "パターンの全出現位置"}
      - {type: constraint, text: "|S|, |T| ≤ 10^6 で、決定的に O(N) で照合したい"}
    acl: [z_algorithm]
    frequency: B
    sections:
      - "Z 配列の定義と、P＋区切り＋T によるパターン検索"
      - "なぜ O(N) か：Z-box の内側は値をコピーでき、比較のたびに右端が進む"
      - "ACL の z_algorithm（z[0]＝n の流儀・vector<int> にして区切りに −1）"
      - "巡回シフト：A+A の中で B を探す（回転 N 回を二重に数えない）"
      - "周期の判定：p が周期 ⇔ z[p]＝N−p"
      - "S＋区切り＋T で各位置から S の接頭辞が何文字続くか（DP の材料）（黄）"
