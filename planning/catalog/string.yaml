# 文字列（string）の目次（第2版）。規則は planning/catalog/README.md、上位の規則は planning/design.md §3〜§5 と planning/design-review.md。
# 主な材料：research/08（文字列）、research/05 の hashing-for-sets、research/02 の string-automaton-dp、research/00 §3.2・§2.3.8
# research/08 の「その他」（インタラクティブ・乱択・bitset・定数倍）と構文解析はほかの分野へ送った（moved）。fft-string-matching は math の convolution-ntt の節へ送った（design-review §3）
# 節の anchor は、統合した調査の key に当たる節では key と同じ名前にした（例：rolling-hash#hash-segment-tree、kmp#string-period、palindrome#manacher）
field: string
pages:
  - id: string-basics
    chapter: 文字列の基本
    title: 文字列の基本操作と辞書順
    nav_title: null
    aliases: [辞書順, 文字列の比較, 文字の一斉置換, 文字列の回転, 連結して辞書順最小, lexicographical order]
    type: technique
    level: 基礎
    level_evidence: "abc042_b (616) 辞書順最小の連結、abc286_c (565) 回転と回文、abc076_c (846)、abc110_c (949) 文字の置換の一貫性。ABC の A〜D で常連"
    kind: [文字列]
    prerequisites: [sorting-techniques]
    related: [lexicographic-greedy, run-length-encoding, subsequence-matching, z-algorithm#cyclic-shift, exchange-argument, subsequence-and-substring, bracket-sequence, parsing, cpp-string-api]
    summary: "辞書順の最小・回転・文字の一斉置換を問う文字列の問題を、定義に沿った全探索と比較で解く。辞書順は最初に異なる位置の文字で決まり、片方が尽きたら短い方が小さい。"
    signs:
      - {type: phrase, text: "条件を満たす文字列のうち辞書順で最小（最大）のものを出力する"}
      - {type: phrase, text: "文字を一斉に別の文字へ置き換える操作を繰り返して一致させられるか"}
      - {type: phrase, text: "先頭の文字を末尾に移す（回転する）操作を何回か行う"}
      - {type: constraint, text: "|S| ≤ 5000 程度で、回転や置き方を全部試せる"}
    acl: []
    verify: []
    frequency: A
    frequency_evidence: "recent 0・前提として 13 ページに届く（直接 7）・古い ABC 4 問"
    sections:
      - {title: "辞書順の定義と std::string の比較（接頭辞は短い方が小さい）", anchor: lexicographic-order}
      - {title: "部分文字列（連続）と部分列（連続でなくてよい）の違い", anchor: substring-vs-subsequence}
      - {title: "文字の一斉置換：両方向の対応が一意か（全単射）", anchor: character-mapping}
      - {title: "連結して辞書順最小：長さが違えば a+b < b+a で比べる", anchor: concat-order}
      - {title: "回転（巡回シフト）の入口：回転回数の全探索と A+A", anchor: rotation}
      - {title: "計算量の落とし穴（substr・+・find は長さに比例する）", anchor: cost-pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "2 つの文字列を先頭から照合し、最初に異なる位置で大小が決まる様子の図（接頭辞が小さいことを空文字との比較で示す）"}
    problems:
      - {id: abc042_b, role: example, representative: true, summary: "同じ長さの文字列をすべてつないだ結果のうち、辞書順で最小のものを求める。", approach: "ソートして連結する（長さが違えば a+b < b+a の比較が要る）"}
      - {id: abc286_c, role: practice, summary: "先頭を末尾へ移す操作（コスト A）と 1 文字の書き換え（コスト B）で、文字列を回文にする最小のコストを求める。", approach: "回転回数を全探索し、それぞれ書き換えの数を数える"}
      - {id: abc076_c, role: practice, summary: "? を埋めて T を部分文字列に含む文字列のうち、辞書順で最小のものを求める。", approach: "T を置く位置を全部試し、残りの ? は a にする"}
      - {id: abc110_c, role: practice, summary: "文字を一斉に置き換える操作を繰り返して、S を T にできるかを判定する。", approach: "文字の対応が両方向に一意か（全単射か）を調べる"}
      - {id: arc097_a, role: practice, summary: "S の異なる部分文字列のうち、辞書順で K 番目（K ≤ 5）のものを求める。", approach: "長さ K 以下の部分文字列だけ列挙すれば足りる"}
    problems_note: null
    sources: ["08-string-geo §4.1 string-basics", "08-string-geo §2.3（混同されやすいもの）", "08-string-geo §5 string-basics・lexicographic-greedy（arc097_a）"]

  - id: subsequence-matching
    chapter: 文字列の基本
    title: 部分列の判定と次の出現位置の表
    nav_title: null
    aliases: [部分列判定, 次の出現位置, nxt 配列, 部分列オートマトン, 序列自動機, 部分列として含むか, subsequence automaton]
    type: technique
    level: 基礎
    level_evidence: "貪欲な照合と次の出現位置の表は abc452_d (903, 2026)・abc324_e (1153, 2023) と基礎の帯で出る。辞書順最小の部分列は typical90_f（★5、水）、繰り返した文字列の部分列は abc346_f (1840, 2024) で青。abc319 以降に水の根拠がないので、水から基礎に変え、応用を水・青の節にした（design-review §4.2・D2）"
    kind: [文字列]
