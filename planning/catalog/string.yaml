      - "N の約数の周期を数える：約数ごとに数えて包除（メビウス）"
      - "照合オートマトン（状態×文字→次の状態）を表に埋める"
      - "Z との使い分け（ACL に KMP はなく、周期は z_algorithm でも判定できる）"
