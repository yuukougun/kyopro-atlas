# 整数論・代数（担当 E）。材料は research/06（整数論・代数）と research/00 §3.2 の math 向けの項目。
# 第2版（2026-10-21）：design-review §1〜§4 に従って形式を改め、統合を受けた
#   受けた統合：dp-matrix-power（と dp-doubling）→ matrix-power、dp-convolution → online-convolution、
#   xor-path（と cycle-basis-xor）→ xor-basis、fft-string-matching → convolution-ntt、
#   discrete-log・primitive-root・mod-sqrt → multiplicative-order（題名「位数・原始根・離散対数」）
# 並び順がナビゲーションの順。同じ分野の前提は前に置いた（proof-patterns は GCD の章の末尾、
# multiplicative-function は floor-quotient-enum の後）。章の中はおおむね レベルの低い順 → 発展の概要 の順。
field: math
pages:
  # ── 1. 式と整数の基本（記法そのものは start の notation が持ち主。設計書 §4.2）──
  - id: sigma-manipulation
    chapter: 式と整数の基本
    title: Σ の変形
    aliases: [シグマの変形, 和の順序交換, 総和の変形, 二重和, 添字の付け替え, order of summation]
    type: technique
    level: 基礎
    level_evidence: "abc172_d (963) で Σ K·d(K) を約数ごとの和に入れ替え、abc471_e (990, 2026) で Σ_{i≠j} A_i A_j を (ΣA)² − ΣA² に直す。abc356_e (1506) は値でまとめ直す応用"
    kind: [考察, 数え上げ]
    prerequisites: []
    related: [notation, contribution, linearity-of-expectation, harmonic-sum, floor-quotient-enum]
    summary: "二重和の順序交換・添字の範囲の書き換え・付け替え・線形性で、Σ の式を計算しやすい形に変える。同じ和を別の順で計算して計算量を下げる式変形の土台になる。"
    signs:
      - {type: phrase, text: "全ての組 (i, j)（i < j）について〜を足した和を求める"}
      - {type: shape, text: "Σ_{i=1}^{N} Σ_{j=i}^{N} f(i, j) のように、内側の和の範囲が外側の添字で決まる二重和"}
      - {type: shape, text: "Σ_{K=1}^{N} K × (K の約数の個数) のように、約数・倍数の関係で書き換えられる和"}
    acl: []
    verify: []
    frequency: A
    frequency_evidence: "recent 2（abc455_f・abc471_e）・前提として 7 ページに届く（直接 3）・古い ABC 3 問"
    sections:
      - {title: "Σ の線形性と分解（定数を外に出す・和を分ける）", anchor: linearity}
      - {title: "二重和の順序交換と添字の範囲（i ≤ j ≤ N を j の側から見る）", anchor: swap-order}
      - {title: "添字の付け替え（i → N − i、k = i + j、約数 d と倍数）", anchor: reindex}
      - {title: "値でまとめ直す（同じ値になる添字の個数を掛ける）", anchor: group-by-value}
      - {title: "よく使う和の公式と Σ_{i≠j} a_i a_j = (Σa)² − Σa²", anchor: formulas}
      - {title: "空の和は 0・空の積は 1 と境界", anchor: empty-sum}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "二重和を格子の表にして、行ごとの和と列ごとの和を見比べる図"}
    problems:
      - {id: abc172_d, role: example, representative: true, summary: "1 以上 N 以下の各 K について K × (K の約数の個数) を求め、その総和を出力する（N ≤ 10^7）。", approach: "Σ_K K·d(K) を約数 d ごとの和に入れ替え、d の倍数の和として O(N) で数える"}
      - {id: abc230_e, role: practice, summary: "Σ_{i=1}^{N} ⌊N/i⌋ を求める（N ≤ 10^12）。", approach: "同じ商になる i を区間にして O(√N)。値でまとめ直す例として本文で参照する（例題は floor-quotient-enum）"}
      - {id: abc471_e, role: practice, summary: "（執筆時に確かめる）", approach: "Σ_{i≠j} A_i A_j = (ΣA)² − ΣA² の式変形と二項係数で数える（research/00 §2.3.8 の分類）"}
      - {id: abc356_e, role: practice, summary: "長さ N の数列の全ての組 i < j について ⌊max(A_i, A_j) / min(A_i, A_j)⌋ を足した和を求める（A_i ≤ 10^6）。", approach: "値ごとの個数の累積和を作り、倍数で区切って値ごとに数え直す（調和級数）"}
    problems_note: null
    sources: ["06-math-nt §4.1", "06-math-nt §5.1", "06-math-nt §7.6", "01-basics §4.L", "01-basics §5", "00-curriculum §2.3.8（abc471_e）"]

