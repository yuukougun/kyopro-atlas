      - {id: abc432_c, role: practice, summary: "大小2種類の飴を配る方法についての条件を調べる（詳細は執筆時に確かめる）。", approach: "必要条件を式にし、切り上げの割り算で境界を求める"}
      - {id: abc048_b, role: practice, summary: "a 以上 b 以下の整数のうち x で割り切れるものの個数を求める（0 ≤ a ≤ b ≤ 10^18）。", approach: "f(b) − f(a − 1)。a = 0 の境界に注意する"}
      - {id: abc084_c, role: practice, summary: "駅を順に結ぶ列車がそれぞれ一定の間隔で発車するとき、各駅から出発して終点に着く最も早い時刻を求める。", approach: "次の発車時刻を切り上げの割り算で求めてシミュレーションする"}
