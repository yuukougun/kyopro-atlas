      - {title: "mod p の掃き出し（ピボットで割る＝逆元）", anchor: mod-p}
      - {title: "mod 2 の掃き出しは XOR、bitset で速くする", anchor: mod-2}
      - {title: "ランクと解の個数 p^(n − rank)", anchor: rank}
      - {title: "実数の掃き出し（部分ピボット選択と誤差）", anchor: real}
