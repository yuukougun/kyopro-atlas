      - {id: abc313_d, role: example, representative: true, summary: "インタラクティブ。隠された 0/1 の列を、K 個の位置を指定してその和の偶奇を聞く質問（N 回まで）から復元する（K は奇数）。", approach: "質問の答えを mod 2 の連立方程式とみて解く（K + 1 個の位置を巡回させて差を取る）"}
      - {id: abc128_c, role: practice, summary: "N 個のスイッチと M 個の電球があり、各電球はつながったスイッチのうち ON の個数の偶奇が決まった値のときに点く。全ての電球が点くスイッチの状態の数を求める（N, M ≤ 10）。", approach: "bit 全探索で足りるが、mod 2 の連立方程式として見る入門"}
      - {id: abc366_g, role: challenge, summary: "N 頂点の単純無向グラフの各頂点に 1 以上 2^60 未満の整数を書き、次数 1 以上の全ての頂点で隣接頂点の値の XOR が 0 になるようにできるかを判定し、例を示す。", approach: "bit ごとに mod 2 の連立方程式を立てて解空間を求め、どの頂点も 0 にならないように組み合わせる"}
      - {id: yahoo_procon2019_qual_e, role: challenge, summary: "N × M の 0/1 行列で、行の集合と列の集合の組のうち、交わる部分の和が奇数になるものの個数を 998244353 で割った余りで求める。", approach: "行列の mod 2 のランク r から (2^N − 2^(N−r))·2^(M−1) と数える"}
    problems_note: "練習が abc128_c だけで、ほかの候補は黄〜発展の帯（力試し）。問題の補充で青の帯の練習を探す"
    sources: ["06-math-nt §4.6", "06-math-nt §5.6", "06-math-nt §6.2", "06-math-nt §6.6"]

