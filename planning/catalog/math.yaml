  # ── 6. 行列と線形代数 ──
  - id: matrix-power
    chapter: 行列と線形代数
    title: 行列累乗
    aliases: [行列の累乗, matrix exponentiation, 行列累乗 DP, 遷移行列, 隣接行列の累乗, min-plus 行列, "(max,+) 行列", 半環の行列]
    type: technique
    level: 青
    level_evidence: "abc458_f (1744, 2026)・abc456_f (1888, 2026)・abc305_g (1989) で遷移を行列にして累乗・積を取る形が青に出る。abc204_f (2044)・abc199_f (2065)・abc256_g (2250) は黄。第1版の黄（必須の ABC は 2000 前後以上）から、2026 年の2問を根拠に青にした（design-review §3）。DP の行列累乗（dp-matrix-power）を統合"
    kind: [線形代数・行列, DP, ダブリング・分割統治]
    prerequisites: [mod-pow, dp-state-design]
    related: [doubling, geometric-series-mod, linear-recurrence-fast, segment-tree-monoids#matrix, warshall-floyd, string-automaton-dp, broken-profile-dp, dp-speedup-overview, dynamic-dp]
    summary: "状態が毎回同じ線形の遷移 v' = Av で変わるとき、K 回後の A^K v を行列の繰り返し二乗法で O(n³ log K) で求める。DP の遷移や、足し算と掛け算を min と + に替えた行列にも使える。"
    signs:
      - {type: constraint, text: "状態数 n ≤ 100 程度で、繰り返しの回数 K が 10^9〜10^18"}
      - {type: phrase, text: "漸化式の第 N 項（N ≤ 10^18）"}
      - {type: phrase, text: "グラフでちょうど K 歩の経路の数・K 本の辺を使う最短路"}
      - {type: phrase, text: "長さ 10^18 の文字列のうち、禁止された部分文字列を含まないものの数"}
      - {type: phrase, text: "幅の小さい盤を長く伸ばしたときの敷き詰め方の数"}
      - {type: shape, text: "dp[t+1] の各成分が dp[t] の成分の線形結合で、係数が t によらない"}
    acl: []
    verify: [matrix_product, pow_of_matrix]
    frequency: A
    frequency_evidence: "recent 3（abc456_f・abc458_f・abc469_g）・前提として 3 ページに届く（直接 3）・古い ABC 6 問"
    sections:
      - {title: "漸化式・状態の遷移を行列で書く（定数項を状態に入れる）", anchor: write-as-matrix}
      - {title: "行列の積と繰り返し二乗法（積の向き・単位行列・n³ log K の見積もり・mod の掛け算のあふれ）", anchor: fast-power}
      - {title: "隣接行列の K 乗と長さ K の経路の数", anchor: adjacency-power}
      - {title: "DP の遷移を行列にする（照合の状態・末尾の数文字・グリッドの境界の状態）", anchor: dp-transition}
      - {title: "(min,+)・(max,+) などの半環の行列と単位元・零元", anchor: semiring}
      - {title: "累乗でなく合成として使う（アフィン変換の積）", anchor: composition}
      - {title: "ダブリングで遷移を合成する（行列にすると大きすぎるとき・桁を倍々に伸ばす）", anchor: doubling-transition, level: 黄}
      - {title: "プロファイル DP の遷移行列と状態数の見積もり", anchor: profile-dp, level: 黄}
    merged_keys: [semiring-matrix, adjacency-matrix-power, dp-matrix-power, dp-doubling]
    visual: {kind: static, priority: 2, text: "漸化式をベクトルに行列を掛ける図で表し、A² が2歩の経路数になることと、行列を2乗していく繰り返し二乗を示す図"}
    problems:
      - {id: dp_r, role: example, summary: "N 頂点の有向グラフ（隣接行列で与えられる）で、長さ K の有向パス（同じ辺を何度通ってもよい）の総数を 10^9+7 で割った余りで求める（N ≤ 50、K ≤ 10^18）。", approach: "隣接行列の K 乗の全成分の和"}
      - {id: abc305_g, role: example, representative: true, summary: "a と b からなる長さ N の文字列のうち、与えられた M 個の文字列をどれも部分文字列に含まないものの個数を 998244353 で割った余りで求める（N ≤ 10^18）。", approach: "禁止文字列は短いので末尾の数文字を状態にし、遷移行列を累乗する"}
      - {id: abc199_f, role: example, summary: "N 頂点 M 辺のグラフで、辺を1本一様に選んで両端の値をその平均に置き換える操作を K 回行ったあとの、各頂点の値の期待値を mod 10^9+7 で求める（N ≤ 100、K ≤ 10^9）。", approach: "1回の操作で期待値が線形に変わるので、その行列を K 乗する"}
      - {id: abc189_e, role: practice, summary: "平面上の N 個の点に回転・反転の操作を M 回行うとき、「A 回目の操作の後の点 B の座標」を Q 個のクエリについて答える。", approach: "各操作を 3×3 のアフィン変換の行列にし、積を前計算する（累乗ではなく合成）"}
      - {id: math_and_algorithm_aw, role: practice, summary: "K × N の盤（K は小さく、N は大きい）を 1 × 2 のドミノで敷き詰める方法の数を求める。", approach: "列の埋まり方 2^K 通りを状態にした遷移行列を累乗する"}
      - {id: abc458_f, role: practice, summary: "長さ N（≤ 10^9）の文字列のうち、与えられた K 個の文字列をどれも部分文字列に含まないものの個数を求める（詳細は執筆時に確かめる）。", approach: "Aho-Corasick の状態の遷移を行列とみてダブリング（累乗）する（string の string-automaton-dp の例題）"}
      - {id: abc456_f, role: practice, summary: "（執筆時に確かめる）", approach: "各日の遷移を (min,+) の行列で表し、区間の行列の積をセグメント木で求める（ds の segment-tree-monoids の例題）"}
      - {id: abc204_f, role: practice, summary: "H × W（H ≤ 6、W ≤ 10^12）の部屋に 1×1 と 1×2 の畳を敷き詰める方法の数を 998244353 で割った余りで求める。", approach: "列のはみ出しを bit で持つ状態の遷移を行列にして累乗する"}
      - {id: abc009_4, role: practice, summary: "A_{n} = (C_1 AND A_{n−1}) XOR … XOR (C_K AND A_{n−K}) で定まる数列の第 M 項を求める（M ≤ 10^9）。", approach: "AND を掛け算、XOR を足し算とみた行列の累乗"}
      - {id: abc256_g, role: challenge, summary: "正 N 角形の辺の上に等間隔に並べた石を白黒に塗るとき、どの辺の上の白い石の個数も等しくなる塗り方の数を求める（N は非常に大きい）。", approach: "白の個数と頂点の色を固定し、辺ごとの遷移を 2×2 行列にして N 乗する"}
      - {id: typical90_e, role: challenge, summary: "使える数字が限られた N 桁（N ≤ 10^18）の正の整数のうち、B の倍数であるものの個数を求める。", approach: "桁数を倍にする遷移の合成（ダブリング）で余りの分布を求める"}
    problems_note: "abc236_g（max-min の行列のダブリング）は research/03 では kmjp の記事で確かめているが、research/06 §7.5 で未確認とした問題なので入れていない。tdpc_house は練習の枠の都合で外した"
    sources: ["06-math-nt §4.6", "06-math-nt §5.6", "06-math-nt §6.2", "06-math-nt §7.2", "03-graph §4.H", "03-graph §5.2", "02-dp §4.J（dp-matrix-power・dp-doubling）", "02-dp §5.1", "08-string-geo §5（string-automaton-dp：abc305_g・abc458_f）", "00-curriculum §2.3.8（abc456_f・abc458_f）", "01-basics §5"]

