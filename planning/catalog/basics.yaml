field: basics
pages:
  # ---------------------------------------------------------------- A. 方針を立てる
  - id: complexity-estimation
    chapter: 方針を立てる
    title: 計算量の見積もり（制約から手法を逆算する）
    aliases: [計算量, オーダー, 制約から考える, TLE の見積もり, ならし計算量, 償却計算量, 定数倍]
    type: technique
    level: 基礎
    level_evidence: "全分野の前提。見積もりそのものが問われる例は typical90_bc（★2）・typical90_bt（★4）・abc196_d（1277）。ならし計算量は hhkb2020_c（352）・abc278_d（559）"
    kind: [全探索]
    prerequisites: []
    related: [reverse-index-constraints, harmonic-sum, two-pointers, cpp-performance]
    summary: "制約の大きさから許される計算量を逆算し、使える手法の候補を絞る。C++ なら 1 秒に 10^8〜数×10^8 回を目安に、ループの回数・log の数・定数倍・メモリを見積もる。"
    signs:
      - {type: constraint, text: "N ≤ 8 / 20 / 40 / 400 / 5000 / 2×10^5 / 10^18 のような制約の大きさ"}
      - {type: constraint, text: "実行時間制限が 5 秒など長い（重めの全探索が想定されている）"}
      - {type: constraint, text: "Q ≤ 2×10^5 個のクエリ（1 回あたり O(log N) 以下が必要）"}
      - {type: phrase, text: "while の中に for があって入れ子に見えるが、各要素は一度しか動かない"}
    acl: []
    frequency: A
    sections:
      - "制約 → 許される計算量 → 疑う手法の表"
      - "見積もりの手順（ループの回数・log の数・定数倍・メモリ）"
      - "ならし計算量（ポインタが戻らない・各要素が一度入って一度出る）"
      - "調和級数の計算量（倍数の列挙。詳しくは整数論の調和級数のページ）"
      - "候補の数で見積もる（階乗・ベル数・約数の個数の最大）"
      - "定数倍（配列と set・map の差、メモリの連続性、bitset）（水）"
      - "複数テストケースは合計（ΣN）で見積もる"
    merged_keys: [amortized-analysis, constant-factor]
    visual: "静的な図：制約の数直線に許される計算量と手法を並べた帯図と、N = 2×10^5 での各計算量の演算回数の棒グラフ"
    problems:
      - {id: typical90_bc, role: example, summary: "100 個から 5 個選ぶ組合せ（約 7.5×10^7 通り）を全部調べて積の余りを数える。定数倍まで見積もって全探索で間に合うと判断する"}
      - {id: hhkb2020_c, role: practice, summary: "数を 1 つずつ追加するたびに、まだ現れていない最小の非負整数を出力する。答えのポインタは戻らないので全体で線形（ならし計算量）"}
      - {id: abc278_d, role: practice, summary: "全体への一括代入と一点の加算・取得のクエリ。一括代入の時刻を覚え、触った要素だけ遅れて更新する"}
      - {id: typical90_bt, role: practice, summary: "小さいグリッドで山を避ける最長の閉路を探す。経路の通り数を見積もったうえでバックトラックで全部試す"}
      - {id: abc196_d, role: practice, summary: "H×W ≤ 16 のマス目を 1×2 と 1×1 の畳で敷き詰める方法を数える。置き方を DFS で全部試しても間に合う規模だと見積もる"}
    sources: ["01-basics §4.A", "01-basics §5", "01-basics §6.1", "01-basics §6.4", "08-string-geo §4.9", "00-curriculum §3.2"]

  # ---------------------------------------------------------------- B. 全探索
  - id: brute-force
    chapter: 全探索
    title: 全探索の設計（何を全探索するか）
    aliases: [全列挙, 工夫した全探索, 総当たり, 候補が少ない, 盤面の全探索, ポリオミノ]
    type: technique
    level: 基礎
    level_evidence: "arc096_a（291）・abc085_c（584）・abc051_b（784）・abc112_c（1147）。最近も abc469_d（1102、候補を 2 つに絞る）。盤面を動かす全探索は abc307_c（1307）・abc322_d（1310）で水（節に印）"
    kind: [全探索]
    prerequisites: [complexity-estimation]
    related: [bit-full-search, fix-variable, small-graph-brute-force, divisor-count-bound]
    summary: "何を全探索するかを選び直して通り数を減らす。いくつか決めれば残りが計算で決まる、答えの候補の側を試す、小さい次元だけを試して残りを速く求める、などの型がある。"
    signs:
      - {type: phrase, text: "変数が 2〜3 個で、いくつか決めれば残りが計算で決まる"}
      - {type: phrase, text: "答えの候補（暗証番号・中心の座標など）が N によらず少ない"}
      - {type: constraint, text: "一方の次元だけ極端に小さい（H ≤ 8 など）"}
      - {type: constraint, text: "K ≤ 10^12 で約数を扱う（約数の個数は最大 6720）"}
      - {type: phrase, text: "小さい盤面を回転・平行移動して重ねる・敷き詰める"}
    acl: []
    frequency: A
    sections:
      - "何を全探索するか（2 つ決めて 3 つ目を計算する）"
      - "決めてから整合性を確かめる"
      - "候補が少ないことに気づく（答えの側・小さい次元・約数の個数・log 回の収束）"
      - "片側を全探索して残りを速く求める（貪欲・二分探索・累積和）"
      - "盤面を動かして全部試す（回転・平行移動）（水）"
    merged_keys: [small-search-space, grid-brute-force]
    visual: "静的な図：3 重ループと「2 つ決めて 3 つ目を計算」のループ回数の比較と、探索の対象を入れ替えたときの通り数の表"
    problems:
      - {id: abc085_c, role: example, summary: "1 万円・5 千円・千円札が合計 N 枚で Y 円になるか。2 種類の枚数を決めれば 3 種類目が決まる"}
      - {id: sumitb2019_d, role: practice, summary: "数字列から作れる 3 桁の暗証番号の種類数。番号の候補 1000 通りの側を全探索して作れるか判定する"}
      - {id: typical90_bk, role: practice, summary: "グリッドから行と列を選ぶ。H ≤ 8 の行の選び方を全探索し、列はまとめて数える"}
      - {id: abc469_d, role: practice, summary: "考える候補を 2 つに絞ってから数える最近の D（00 §2.3.8 の分類。内容は執筆時に確かめる）"}
      - {id: abc112_c, role: practice, summary: "ピラミッドの中心座標 101×101 通りを全探索し、高さを決めて情報と矛盾しないか確かめる"}
      - {id: abc307_c, role: practice, summary: "2 枚のシートを平行移動の全組合せで重ね、切り出した結果が目標と一致するか調べる"}
      - {id: abc322_d, role: challenge, summary: "3 つのポリオミノを回転と平行移動の全組合せで置き、4×4 をちょうど埋められるか判定する"}
    sources: ["01-basics §4.A", "01-basics §4.B", "01-basics §5", "01-basics §7.5", "00-curriculum §2.3.8"]

  - id: bit-full-search
    chapter: 全探索
    title: bit 全探索と順列全探索
    aliases: [ビット全探索, 部分集合の全列挙, 2^N 全探索, 3 進全探索, 順列全探索, next_permutation, N! 全探索]
    type: technique
    level: 基礎
    level_evidence: "bit 全探索は abc182_c（292）・abc128_c（805）・abc197_c（809）・abc147_c（977）、drken の ABC 16 問の中央値 642。順列全探索は abc145_c（340）・abc150_c（422）・abc232_c（685）・abc371_c（849）。片側を bit で決めて残りを貪欲にする型は abc100_d（1331）・abc159_e（1450）で水（節に印）"
    kind: [全探索, ビット演算]
    prerequisites: [brute-force, bit-operations]
    related: [recursive-enumeration, meet-in-the-middle, bit-dp, small-graph-brute-force]
    summary: "N ≤ 20 程度なら部分集合 2^N 通りを整数の各 bit で表して全部試し、N ≤ 8〜10 なら順列 N! 通りを next_permutation で全部試す。片側だけ全探索して残りを貪欲で決める型が水で頻出する。"
    signs:
      - {type: constraint, text: "N ≤ 15〜20 で各要素を「選ぶ／選ばない」"}
      - {type: constraint, text: "N ≤ 8〜10 で並び順・割り当て・頂点の対応を決める"}
      - {type: phrase, text: "スイッチの on/off、区切る／区切らない"}
      - {type: phrase, text: "各要素が 3 択（N ≤ 12 程度なら 3^N 通り）"}
      - {type: phrase, text: "グラフの同型判定（頂点の対応を全部試す）"}
    acl: []
    frequency: A
    sections:
      - "bit 全探索の書き方（mask の i ビット目で要素 i を選ぶ）"
      - "k 進の全探索（3^N）"
      - "決めてから整合性を確かめる型"
      - "片側を bit で決めて残りは貪欲（水）"
      - "順列全探索と next_permutation（昇順から始める・重複要素）"
      - "落とし穴（1 << 31 のあふれ・== と & の優先順位）"
    merged_keys: [permutation-search]
    visual: "静的な図：0〜2^N−1 を 2 進表記で縦に並べた表と、next_permutation が次の順列を作る手順の図"
    problems:
      - {id: abc182_c, role: example, summary: "各桁を残すか消すかを bit で全探索し、3 の倍数にできる最小の消去数を求める"}
      - {id: abc145_c, role: example, summary: "N ≤ 8 個の町を回る全順序について経路長の平均を求める（順列全探索）"}
      - {id: abc232_c, role: practice, summary: "2 つのグラフが頂点の付け替えで一致するかを、8! 通りの対応を全部試して判定する"}
      - {id: abc128_c, role: practice, summary: "スイッチの on/off 2^N 通りを試し、すべての電球が点く組合せを数える"}
      - {id: abc147_c, role: practice, summary: "誰が正直者かを 2^N 通り仮定し、証言と矛盾しない場合の正直者の最大人数を求める"}
      - {id: abc100_d, role: practice, summary: "評価の符号の向き 8 通りを全探索し、各向きで大きい順に M 個取る（片側を全探索して残りは貪欲）"}
      - {id: abc159_e, role: challenge, summary: "横の切れ目 2^(H−1) 通りを全探索し、縦の切れ目は左から貪欲に入れて最小回数を求める"}
    sources: ["01-basics §4.B", "01-basics §5", "01-basics §7.1", "01-basics §7.5"]

  - id: recursive-enumeration
    chapter: 全探索
    title: 再帰による全列挙（バックトラック・組分け）
    aliases: [DFS による全列挙, バックトラック, 枝刈り, グループ分けの全列挙, 集合分割, ベル数]
    type: technique
    level: 水
    level_evidence: "abc161_d（991）・abc114_c（1045）は緑だが、abc236_d（1190）・abc310_d（1368）・abc345_d（1419）・abc390_d（1607）と水に多い。drken の「再帰関数（ビット全探索困難）」ABC 10 問の中央値 1018。最近も abc473_d（838）"
    kind: [全探索]
    prerequisites: [bit-full-search]
    related: [bit-dp, memoized-recursion, brute-force, cpp-recursive-lambda]
    summary: "部分的に決めた状態から 1 つずつ決めていく再帰で、条件を満たす数・組分け・敷き詰めを全部列挙する。組分けは「まだ組のない最小番号の人から決める」と同じ分け方を二度数えない。"
    signs:
      - {type: phrase, text: "条件を満たす数・列を小さい順にすべて作る"}
      - {type: constraint, text: "N ≤ 10〜12 人を組・グループに分ける（ベル数 B12 ≈ 4.2×10^6）"}
      - {type: constraint, text: "2N ≤ 16 人を 2 人組に分ける（(2N−1)!! 通り）"}
      - {type: phrase, text: "タイルの敷き詰め・パズルを途中で打ち切りながら試す"}
    acl: []
    frequency: A
    sections:
      - "生成型（桁を 1 つずつ足す）"
      - "組分け型（最小番号から決めて重複を防ぐ）"
      - "ペア分け型"
      - "敷き詰め型（左上の空きマスから置く）"
      - "枝刈りと計算量の見積もり（葉の数 × 1 本あたり）"
      - "状態を戻し忘れない（バックトラック）"
    merged_keys: []
    visual: "静的な図：組分けの再帰木（最小番号から決めると同じ分け方が一度だけ現れる）"
    problems:
      - {id: abc161_d, role: example, summary: "隣り合う桁の差が 1 以下の数の K 番目を、桁数の小さい順に生成して求める"}
      - {id: abc310_d, role: example, summary: "N ≤ 10 人を T チームに分ける方法のうち、仲の悪い組が同じチームにならないものを数える（最小番号から決めて重複を防ぐ）"}
      - {id: abc473_d, role: practice, summary: "DFS（再帰）による全列挙で解く最近の D（00 §2.3.8 の分類。内容は執筆時に確かめる）"}
      - {id: abc114_c, role: practice, summary: "7, 5, 3 だけからなり 3 種類すべてを含む N 以下の数を、桁を 1 つずつ足す再帰で数える"}
      - {id: abc236_d, role: practice, summary: "2N 人を 2 人組に分ける全通りを再帰で列挙し、組ごとの値の XOR の最大を求める"}
      - {id: abc345_d, role: practice, summary: "N 枚のタイルで H×W を覆えるか。左上の空きマスから置き方を試すバックトラック"}
      - {id: abc390_d, role: challenge, summary: "N ≤ 12 個の袋の分け方（ベル数通り）を全列挙し、グループの和の XOR が何種類あるか数える"}
    sources: ["01-basics §4.B", "01-basics §5", "01-basics §6.4", "00-curriculum §2.3.8"]

  - id: meet-in-the-middle
    chapter: 全探索
    title: 半分全列挙
    aliases: [Meet in the Middle, 半分全探索, 折半全列挙]
    type: technique
    level: 水
    level_evidence: "abc184_f（1423）・typical90_ay（★5）・abc271_f（1669）・agc026_c（1836）。黄に abc300_g（2343）、最近は abc464_f（2225）で道具として使われる"
    kind: [全探索, 二分探索]
    prerequisites: [bit-full-search, binary-search, sorting-techniques]
    related: [two-pointers, knapsack-01, subset-sum]
    summary: "N ≤ 40 程度の部分集合の問題を前半と後半に分け、それぞれ 2^(N/2) 通りを列挙してから、ソートと二分探索（または尺取り）で組み合わせる。"
    signs:
      - {type: constraint, text: "N ≤ 40 で部分集合を選ぶ（2^N は無理だが 2^(N/2) は間に合う）"}
      - {type: phrase, text: "2 つの独立な選択を組み合わせて条件を満たす"}
      - {type: phrase, text: "グリッドの経路で、対角線までの歩数が短い"}
    acl: []
    frequency: B
    sections:
      - "前半・後半を列挙して突き合わせる（ソート＋二分探索・尺取り）"
      - "ちょうど K 個などの制約は個数ごとに分けて持つ"
      - "グリッドの経路を対角線で分ける（青）"
      - "「片側を全探索して残りは貪欲」との違い"
      - "値の範囲が小さければナップサック DP"
    merged_keys: []
    visual: "静的な図：前半・後半の部分和リストを並べ、後半をソートして前半の各値の相手を二分探索で探す図"
    problems:
      - {id: abc184_f, role: example, summary: "N ≤ 40 個から選ぶ和で T 以下の最大値。半分ずつ部分和を列挙し、ソートと二分探索で組み合わせる"}
      - {id: typical90_ay, role: example, summary: "N ≤ 40 個からちょうど K 個、合計 P 以下となる選び方を数える。個数ごとに分けて列挙して二分探索する"}
      - {id: abc271_f, role: practice, summary: "グリッドの左上から右下への経路で XOR が 0 になるものを数える。対角線で分けて両側から列挙し突き合わせる"}
      - {id: agc026_c, role: practice, summary: "2N 文字を赤青に塗り、赤を左から読んだ列と青を右から読んだ列が一致する塗り方を数える。前半の塗り方を列挙して後半と突き合わせる"}
      - {id: abc300_g, role: challenge, summary: "p 以下の素数だけを素因数にもつ N 以下の数を数える。素数を 2 組に分けて積を列挙し、尺取りで組み合わせる"}
    sources: ["01-basics §4.B", "01-basics §5", "01-basics §6.3"]

  # ---------------------------------------------------------------- 並べる・圧縮する
  - id: sorting-techniques
    chapter: ソートと座標圧縮
    title: ソートで考える（並べ替え・比較関数）
    aliases: [ソート, 比較関数, 安定ソート, ペアのソート]
    type: technique
    level: 基礎
    level_evidence: "abc121_c（360）・typical90_n（★3）・abc308_c（605）・abc187_d（650）。drken の「考察：ソート」ABC 49 問の中央値 127"
    kind: [ソート・座標圧縮, 貪欲]
    prerequisites: []
    related: [exchange-argument, greedy-basics, cpp-comparators, cpp-algorithms-classic]
    summary: "並べ替えてよい問題では、ソートすると貪欲の順番が決まり、二分探索や尺取りが使えるようになる。比較関数は狭義の弱順序（<= を書かない）にし、比率は掛け算で比べる。"
    signs:
      - {type: phrase, text: "順番を自由に並べ替えてよい"}
      - {type: phrase, text: "安い順・効果の大きい順に取る"}
      - {type: phrase, text: "2 つの集合を 1 対 1 に対応させて距離の和を最小化する"}
      - {type: phrase, text: "成功率などの比率の大小で並べる"}
    acl: []
    frequency: A
    sections:
      - "ソートで貪欲の順が決まる"
      - "2 つの列を 1 対 1 に対応させる（両方ソートして順に組む）"
      - "比較関数の要件（狭義の弱順序）"
      - "比率は掛け算で比べる・同点の順序（stable_sort）"
    merged_keys: []
    visual: "静的な図：2 つの列の対応を線で結び、両方ソートすると交差が消える図"
    problems:
      - {id: abc121_c, role: example, summary: "安い店から順に必要な本数を買う最小費用（ソートして貪欲）"}
      - {id: typical90_n, role: practice, summary: "小学生と学校を 1 対 1 に割り当てて距離の和を最小化する。両方ソートして順に対応させる"}
      - {id: abc308_c, role: practice, summary: "成功率の降順・番号の昇順に並べる。比率は掛け算で比べて誤差を避ける"}
      - {id: abc187_d, role: practice, summary: "各町の効果 2A + B が独立に決まるので、大きい順に選んで必要な町の最小数を求める"}
    sources: ["01-basics §4.G", "01-basics §5", "01-basics §7.5"]

  - id: coordinate-compression
    chapter: ソートと座標圧縮
    title: 座標圧縮
    aliases: [座圧, 値の圧縮, 離散化]
    type: technique
    level: 基礎
    level_evidence: "abc213_c（481）・abc113_c（878）・abc188_d（933）・abc036_c（956 参考値）。データ構造と組む形は typical90_ac（★5）"
    kind: [ソート・座標圧縮]
    prerequisites: [sorting-techniques, binary-search]
    related: [stl-containers, fenwick-tree, event-sort, imos]
    summary: "値を sort・unique・lower_bound で 0〜K−1 の番号に置き換え、大小関係だけを残したまま配列の添字にできるようにする。BIT・セグ木・いもす法と組んで使う。"
    signs:
      - {type: constraint, text: "値は 10^9 まであるが、個数は 2×10^5 以下"}
      - {type: phrase, text: "大小関係（順位）だけが重要"}
