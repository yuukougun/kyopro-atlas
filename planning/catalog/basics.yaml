  - id: imos
    chapter: 累積和といもす法
    title: いもす法
    aliases: [imos 法, 差分配列, difference array, 2 次元いもす法, 階差, 隣接差, 等差数列の区間加算]
    type: technique
    level: 基礎
    level_evidence: "abc183_d（662）・abc221_d（832）・abc188_d（933）・abc014_3（1276 参考値）。最近も abc462_d（798）。drken の「いもす法」ABC 8 問の中央値 1264。2 次元は typical90_ab（★4）。隣接差で見る基本形（typical90_bl ★3・abc369_c 323・abc466_e 1027）を difference-sequence から戻した（design-review §4.2）"
