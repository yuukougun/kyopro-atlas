    frequency: B
    frequency_evidence: "recent 1（abc469_e）・前提として届くページなし・古い ABC 5 問"
    sections:
      - {title: "平均の言い換え（x を引いた和の符号で判定する）", anchor: average}
      - {title: "比 Σa / Σb の言い換え（a_i − x·b_i）", anchor: ratio}
      - {title: "判定を累積和・貪欲で行う", anchor: simple-check}
      - {title: "「濃度の高い順に K 個」が誤りである理由", anchor: greedy-pitfall}
      - {title: "中央値の言い換え（x 以上を +1、未満を −1）と偶数個のときの不等号", anchor: median, level: 青}
      - {title: "判定を DP・DAG の最長路・全域木で行う", anchor: dp-check, level: 青}
      - {title: "領域の中央値（2 次元累積和）", anchor: median-2d, level: 青}
      - {title: "全区間の中央値の中央値（転倒数で数える）", anchor: median-of-medians, level: 黄}
      - {title: "実数の精度と分母 0", anchor: precision}
      - {title: "Dinkelbach 法", anchor: dinkelbach, level: 発展}
    merged_keys: [fractional-programming, median-binary-search]
    visual: {kind: static, priority: 2, text: "各要素を a_i − x·b_i に置き換え、x を動かすと選ぶものの組が入れ替わる様子のグラフと、数列を x 以上 → +1・未満 → −1 に塗り替えた図"}
    problems:
      - {id: abc469_e, role: example, representative: true, summary: "（執筆時に確かめる）", approach: "連続部分列の平均の最大化に帰着し、答え a を二分探索して、各要素から a を引いた累積和で和が 0 以上の区間があるか判定する（research/00 §2.3.8 の分類）"}
      - {id: abc203_d, role: example, summary: "N×N の池から K×K の区画を選ぶとき、区画の中央値の最小値を求める。", approach: "「中央値 ≤ x ⇔ x 以下の個数が一定数以上」と言い換え、2 次元累積和で判定して x を二分探索する"}
      - {id: abc324_f, role: example, summary: "DAG の経路で（美しさの和）/（コストの和）の最大値を求める。", approach: "x を決めて辺の重みを b − x·c にし、最長路が 0 以上かを DP で判定する"}
      - {id: abc034_d, role: practice, summary: "N 個の食塩水から K 個を選んで混ぜたときの濃度の最大値を求める。", approach: "濃度 x を決め、「食塩 − x × 重さ」の大きい順に K 個取って判定する"}
