    chapter: 二分探索の応用
    title: 平均・中央値の最大化
    aliases: [平均の最大化, 比の最大化, 中央値の最大化, 分数計画, 濃度の最大化, 中央値の二分探索, 中央値の中央値, fractional programming, Dinkelbach]
    type: technique
