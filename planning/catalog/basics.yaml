# 基本テクニック（basics）の目次。第2版（2026-10-21）。規則は planning/catalog/README.md、決定は planning/design-review.md。
# 章は同じ分野の前提がナビゲーションで前に来る順（03-catalog 指摘19・30）：
#   計算量と bit 演算 → 全探索 → ソートと二分探索 → 累積和といもす法 → 尺取り法とランレングス圧縮
#   → 二分探索の応用 → 凸と三分探索 → 貪欲 → 周期とダブリング → 再帰と分割統治
field: basics
pages:
  # ---------------------------------------------------------------- 計算量と bit 演算
  - id: complexity-estimation
    chapter: 計算量と bit 演算
    title: 計算量の見積もり
    aliases: [計算量, オーダー, 制約から手法を逆算する, 制約から考える, TLE の見積もり, ならし計算量, 償却計算量, 定数倍, time complexity, amortized analysis]
    type: technique
    level: 基礎
    level_evidence: "全分野の前提。見積もりそのものが問われる例は typical90_bc（★2）・typical90_bt（★4）・abc196_d（1277）。ならし計算量は hhkb2020_c（352）・abc278_d（559）"
    kind: [計算量]
    prerequisites: []
    related: [reverse-index-constraints, harmonic-sum, two-pointers, cpp-io#tle-causes]
    summary: "制約の大きさから許される計算量を逆算し、使える手法の候補を絞る。C++ なら 1 秒に 10^8〜数×10^8 回を目安に、ループの回数・log の数・定数倍・メモリを見積もる。"
    signs:
      - {type: constraint, text: "N ≤ 8 / 20 / 40 / 400 / 5000 / 2×10^5 / 10^18 のような制約の大きさ"}
      - {type: constraint, text: "実行時間制限が 5 秒など長い（重めの全探索が想定されている）"}
      - {type: constraint, text: "Q ≤ 2×10^5 個のクエリ（1 回あたり O(log N) 以下が必要）"}
      - {type: constraint, text: "テストケースが T 個あり、N の総和が 2×10^5 以下"}
      - {type: shape, text: "while の中に for があって入れ子に見えるが、各要素は一度しか動かない"}
    acl: []
    frequency: A
    frequency_evidence: "recent 0・前提として 79 ページに届く（直接 4）・古い ABC 2 問"
    sections:
      - {title: "制約 → 許される計算量 → 疑う手法の表", anchor: constraint-table}
      - {title: "見積もりの手順（ループの回数・log の数・定数倍・メモリ）", anchor: how-to-estimate}
      - {title: "ならし計算量（ポインタが戻らない・各要素が一度入って一度出る）", anchor: amortized}
      - {title: "調和級数の計算量（倍数の列挙。詳しくは整数論の調和級数のページ）", anchor: harmonic-series}
      - {title: "候補の数で見積もる（階乗・ベル数・約数の個数の最大）", anchor: count-candidates}
      - {title: "定数倍（配列と set・map の差・メモリの連続性・bitset）", anchor: constant-factor, level: 水}
      - {title: "複数テストケースは合計（ΣN）で見積もる", anchor: multiple-testcases}
    merged_keys: [amortized-analysis, constant-factor]
    visual: {kind: static, priority: 2, text: "制約の数直線に許される計算量と手法を並べた帯図と、N = 2×10^5 での各計算量の演算回数の棒グラフ"}
    problems:
      - {id: typical90_bc, role: example, representative: true, summary: "最大 100 個の整数から 5 個を選ぶ組合せのうち、積の余りが条件を満たすものを数える。", approach: "組合せは約 7.5×10^7 通り。定数倍まで見積もって全探索で間に合うと判断する"}
      - {id: hhkb2020_c, role: practice, summary: "数を 1 つずつ追加するたびに、まだ現れていない最小の非負整数を出力する。", approach: "答えのポインタは戻らないので全体で線形（ならし計算量）"}
      - {id: abc278_d, role: practice, summary: "全体への一括代入・一点への加算・一点の取得のクエリを処理する。", approach: "一括代入の時刻を覚え、触った要素だけ遅れて更新する（ならし計算量）"}
      - {id: typical90_bt, role: practice, summary: "小さいグリッドで、山のマスを避けて同じマスを通らずに戻ってくる最長の経路を求める。", approach: "経路の通り数を見積もったうえで、バックトラックで全部試す"}
      - {id: abc196_d, role: practice, summary: "H×W ≤ 16 のマス目を 1×2 と 1×1 の畳で敷き詰める方法の数を求める。", approach: "置き方を DFS で全部試しても間に合う規模だと見積もる"}
    sources: ["01-basics §4.A", "01-basics §5", "01-basics §6.1", "01-basics §6.4", "08-string-geo §4.9", "00-curriculum §3.2"]

  - id: bit-operations
    chapter: 計算量と bit 演算
    title: bit 演算の基本と XOR の性質
    aliases: [ビット演算, bitwise operations, popcount, submask, 最下位ビット, XOR の打ち消し]
    type: technique
    level: 基礎
    level_evidence: "abc213_a（33）・abc269_c（384）・abc356_d（886）・abc121_d（1164）"
    kind: [ビット演算]
    prerequisites: []
    related: [bitwise-independence, bit-full-search, cpp-math-functions#bit-functions, xor-basis, subset-enumeration-dp#submask-loop]
    summary: "XOR の打ち消し（x xor x = 0）、a + b = (a xor b) + 2(a and b)、0〜n の XOR の周期などで式を簡単にする。部分集合の部分集合は s = (s − 1) & m で列挙できる。"
    signs:
      - {type: phrase, text: "XOR・AND・OR が問題文に出る"}
      - {type: phrase, text: "自分以外の XOR・同じ値で打ち消す"}
      - {type: phrase, text: "2 進表記の 1 の個数"}
      - {type: constraint, text: "N ≤ 18 程度で、集合とその部分集合の組をすべて調べる（全体で 3^N）"}
    acl: []
    frequency: A
    frequency_evidence: "recent 1（abc476_g）・前提として 45 ページに届く（直接 13）・古い ABC 4 問"
    sections:
      - {title: "AND・OR・XOR・シフトと演算子の優先順位", anchor: operators}
      - {title: "XOR の性質（打ち消し・a + b との関係・0〜n の XOR）", anchor: xor-properties}
      - {title: "popcount・最下位ビット", anchor: popcount}
      - {title: "部分集合の部分集合の列挙（3^N）", anchor: submask}
      - {title: "落とし穴（1 << 31 のあふれ・符号付きの右シフト）", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "2 進表記を桁ごとにそろえた AND・OR・XOR の表と、submask を (s−1)&m で列挙する手順"}
    problems:
      - {id: abc269_c, role: example, representative: true, summary: "N の 2 進表記で 1 が立っている bit だけを使って表せる整数を、すべて昇順に出力する。", approach: "部分集合の部分集合の列挙"}
      - {id: abc213_a, role: practice, summary: "A xor C = B となる C を求める。", approach: "XOR は同じ値で打ち消せるので C = A xor B"}
      - {id: abc356_d, role: practice, summary: "0 から N までの各 k について popcount(k AND M) を足した値を求める。", approach: "bit ごとに 1 が立つ k の個数を数える"}
      - {id: abc121_d, role: practice, summary: "A 以上 B 以下の整数をすべて XOR した値を求める。", approach: "0 から n までの XOR が 4 周期で決まることを使う"}
    sources: ["01-basics §4.K", "01-basics §5", "01-basics §6.4"]

  - id: bitwise-independence
    chapter: 計算量と bit 演算
    title: bit ごとに独立に考える
    aliases: [bit ごとの寄与, 桁ごとに見る, bit ごとに分解, 上位ビットから決める, XOR の和, bitwise decomposition]
    type: technique
    level: 水
    level_evidence: "abc147_d（1205）・arc098_b（1404）・abc117_d（1423）・abc129_e（1547）と水に集まる。abc319 以降は abc365_e（1102）が基礎の帯にあるが 1 問だけなので下げない（規則1）。上位ビットで分けて再帰する abc281_f（1714）は青（節に印）。drken の「各桁ごとに見る」ABC 11 問の中央値 1423"
    kind: [ビット演算, 考察]
    prerequisites: [bit-operations, contribution]
    related: [xor-basis, binary-trie, digit-dp, reformulation]
    summary: "XOR・AND・OR の結果は bit ごとに独立に決まるので、bit ごとに 0 と 1 の個数を数えて 2^k を掛けて足す。最大化・最小化は上の bit から決め、繰り上がりで bit が干渉する足し算には使えない。"
    signs:
      - {type: phrase, text: "全ペア・全区間の XOR の総和"}
      - {type: phrase, text: "AND・OR・XOR の最大化・最小化"}
      - {type: phrase, text: "x を選んで max(a_i xor x) を最小化する"}
      - {type: phrase, text: "a + b = a xor b（繰り上がりがない）"}
      - {type: constraint, text: "A_i < 2^30〜2^60 で、全ペア（N ≤ 2×10^5）の値を集計する"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 5 問"
    sections:
      - {title: "bit ごとの寄与（0 の個数 × 1 の個数 × 2^k）", anchor: per-bit-contribution}
      - {title: "区間の XOR は累積 XOR の 0・1 の個数で", anchor: range-xor}
      - {title: "上の bit から決める貪欲（上限は桁 DP の考え方）", anchor: top-down}
      - {title: "上位ビットで 2 つに分けて再帰する", anchor: split-by-top-bit, level: 青}
      - {title: "足し算では使えない理由（繰り上がり）", anchor: addition}
    merged_keys: [bitwise-decomposition]
    visual: {kind: static, priority: 2, text: "数を 2 進表記で縦に並べ、bit ごとの 0 と 1 の個数から寄与を足していく図"}
    problems:
      - {id: abc147_d, role: example, representative: true, summary: "N 個の整数のすべてのペアについて、XOR の総和を求める。", approach: "bit ごとに 0 と 1 の個数の積で寄与を数える"}
      - {id: abc365_e, role: practice, summary: "長さ 2 以上のすべての区間について、区間の XOR の総和を求める。", approach: "bit ごとに累積 XOR の 0・1 の個数で数える"}
      - {id: abc117_d, role: practice, summary: "K 以下の非負整数 X で、Σ(X xor A_i) の最大値を求める。", approach: "上の bit から、K を超えない範囲で 1 にするかを決める（桁 DP でも解ける）"}
      - {id: abc129_e, role: practice, summary: "a + b ≤ L かつ a + b = a xor b となる非負整数の組 (a, b) の数を求める。", approach: "同じ bit に 1 が重ならないと言い換え、上の桁から数える"}
      - {id: abc281_f, role: challenge, summary: "x を選んで max(a_i xor x) を最小化する。", approach: "上位ビットから、0 と 1 が混在する桁でグループを 2 つに分けて再帰する"}
    sources: ["01-basics §4.K", "01-basics §5", "00-curriculum §3.2", "00-curriculum §4.2", "00-curriculum §5.1"]

  # ---------------------------------------------------------------- 全探索
  - id: brute-force
    chapter: 全探索
    title: 全探索の設計
    aliases: [全列挙, 工夫した全探索, 総当たり, 何を全探索するか, 候補が少ない, 盤面の全探索, ポリオミノ, brute force]
    type: technique
    level: 基礎
    level_evidence: "arc096_a（291）・abc085_c（584）・abc051_b（784）・abc112_c（1147）。最近も abc469_d（1102、候補を 2 つに絞る）。盤面を動かす全探索は abc307_c（1307）・abc322_d（1310、2023）で水（節に印）"
    kind: [全探索]
    prerequisites: [complexity-estimation]
    related: [bit-full-search, fix-variable, small-graph-brute-force, divisor-count-bound]
    summary: "何を全探索するかを選び直して通り数を減らす。いくつか決めれば残りが計算で決まる、答えの候補の側を試す、小さい次元だけを試して残りを速く求める、などの型がある。"
    signs:
      - {type: phrase, text: "変数が 2〜3 個で、いくつか決めれば残りが計算で決まる"}
      - {type: phrase, text: "答えの候補（暗証番号・中心の座標など）が N によらず少ない"}
      - {type: constraint, text: "一方の次元だけ極端に小さい（H ≤ 8 など）"}
      - {type: constraint, text: "K ≤ 10^12 で約数を扱う（約数の個数は最大 6720）"}
      - {type: phrase, text: "小さい盤面を回転・平行移動して重ねる・敷き詰める"}
    acl: []
    frequency: A
    frequency_evidence: "recent 5（abc451_d・abc469_d・abc474_e・abc476_d・abc480_e）・前提として 71 ページに届く（直接 3）・古い ABC 5 問"
    sections:
      - {title: "何を全探索するか（2 つ決めて 3 つ目を計算する）", anchor: what-to-enumerate}
      - {title: "決めてから整合性を確かめる", anchor: decide-then-check}
      - {title: "候補が少ないことに気づく（答えの側・小さい次元・約数の個数・log 回の収束）", anchor: small-candidates}
      - {title: "片側を全探索して残りを速く求める（貪欲・二分探索・累積和）", anchor: half-enumeration}
      - {title: "盤面を動かして全部試す（回転・平行移動）", anchor: move-board, level: 水}
    merged_keys: [small-search-space, grid-brute-force]
    visual: {kind: static, priority: 2, text: "3 重ループと「2 つ決めて 3 つ目を計算」のループ回数の比較と、探索の対象を入れ替えたときの通り数の表"}
    problems:
      - {id: abc085_c, role: example, representative: true, summary: "1 万円札・5 千円札・千円札が合計 N 枚で Y 円になる組合せがあるか判定し、あれば 1 つ答える。", approach: "2 種類の枚数を決めれば 3 種類目が決まる"}
      - {id: sumitb2019_d, role: practice, summary: "長さ N の数字列から 3 桁を選んで作れる暗証番号の種類数を求める。", approach: "番号の候補 1000 通りの側を全探索し、作れるか判定する"}
      - {id: typical90_bk, role: practice, summary: "グリッドから行と列をいくつか選び、交差するマスがすべて同じ数になるときのマスの数の最大値を求める。", approach: "H ≤ 8 の行の選び方 2^H 通りを全探索し、列はまとめて数える"}
      - {id: abc469_d, role: practice, summary: "（執筆時に確かめる）", approach: "考える候補を 2 つに絞ってから数える（research/00 §2.3.8 の分類）"}
      - {id: abc112_c, role: practice, summary: "いくつかの地点の高さの情報から、ピラミッドの中心座標と高さを特定する。", approach: "中心座標 101×101 通りを全探索し、高さを決めて情報と矛盾しないか確かめる"}
      - {id: abc307_c, role: practice, summary: "2 枚のシートを平行移動して重ね、切り出した結果を目標のシートに一致させられるか判定する。", approach: "平行移動の全組合せを試す"}
      - {id: abc322_d, role: challenge, summary: "3 つのポリオミノを回転と平行移動で置き、4×4 のマス目をちょうど埋められるか判定する。", approach: "回転と平行移動の全組合せを試す"}
    sources: ["01-basics §4.A", "01-basics §4.B", "01-basics §5", "01-basics §7.5", "00-curriculum §2.3.8"]

  - id: bit-full-search
    chapter: 全探索
    title: bit 全探索と順列全探索
    aliases: [ビット全探索, 部分集合の全列挙, 2^N 全探索, 3 進全探索, next_permutation, N! 全探索, bit brute force]
    type: technique
    level: 基礎
    level_evidence: "bit 全探索は abc182_c（292）・abc128_c（805）・abc197_c（809）・abc147_c（977）、drken の ABC 16 問の中央値 642。順列全探索は abc145_c（340）・abc150_c（422）・abc232_c（685）・abc371_c（849、2024）。片側を bit で決めて残りを貪欲にする型は abc100_d（1331）・abc159_e（1450）で水（節に印）"
    kind: [全探索, ビット演算]
    prerequisites: [brute-force, bit-operations]
    related: [recursive-enumeration, meet-in-the-middle, bit-dp, small-graph-brute-force]
    summary: "N ≤ 20 程度なら部分集合 2^N 通りを整数の各 bit で表して全部試し、N ≤ 8〜10 なら順列 N! 通りを next_permutation で全部試す。片側だけを全探索して残りを貪欲で決める型もよく出る。"
    signs:
      - {type: constraint, text: "N ≤ 15〜20 で各要素を「選ぶ／選ばない」"}
      - {type: constraint, text: "N ≤ 8〜10 で並び順・割り当て・頂点の対応を決める"}
      - {type: phrase, text: "スイッチの on/off、区切る／区切らない"}
      - {type: constraint, text: "各要素が 3 択で N ≤ 12 程度（3^N 通り）"}
      - {type: phrase, text: "2 つのグラフが頂点の付け替えで一致するか"}
    acl: []
    frequency: A
    frequency_evidence: "recent 0・前提として 14 ページに届く（直接 6）・古い ABC 10 問"
    sections:
      - {title: "bit 全探索の書き方（mask の i ビット目で要素 i を選ぶ）", anchor: bitmask}
      - {title: "k 進の全探索（3^N）", anchor: base-k}
      - {title: "決めてから整合性を確かめる型", anchor: assume-and-check}
      - {title: "片側を bit で決めて残りは貪欲", anchor: half-greedy, level: 水}
      - {title: "順列全探索と next_permutation（昇順から始める・重複要素）", anchor: permutations}
      - {title: "落とし穴（1 << 31 のあふれ・== と & の優先順位）", anchor: pitfalls}
    merged_keys: [permutation-search]
    visual: {kind: static, priority: 2, text: "0〜2^N−1 を 2 進表記で縦に並べた表と、next_permutation が次の順列を作る手順の図"}
    problems:
      - {id: abc182_c, role: example, representative: true, summary: "整数の各桁を残すか消すかを選び、3 の倍数にするための最小の消去数を求める。", approach: "各桁を残すか消すかを bit で全探索する"}
      - {id: abc145_c, role: practice, summary: "N ≤ 8 個の町をすべて回る順序それぞれについて、経路の長さの平均を求める。", approach: "順列全探索"}
      - {id: abc232_c, role: practice, summary: "2 つのグラフが、頂点の番号の付け替えで一致するか判定する。", approach: "8! 通りの対応を全部試す"}
      - {id: abc128_c, role: practice, summary: "スイッチの on/off の組合せのうち、すべての電球が点くものの数を求める。", approach: "2^N 通りを全部試す"}
      - {id: abc147_c, role: practice, summary: "各人の証言から、正直者の人数としてありうる最大値を求める。", approach: "誰が正直者かを 2^N 通り仮定し、証言と矛盾しないか確かめる"}
      - {id: abc100_d, role: practice, summary: "ケーキを M 個選び、綺麗さ・おいしさ・人気度それぞれの合計の絶対値の和を最大化する。", approach: "符号の向き 8 通りを全探索し、各向きで評価値の大きい順に M 個取る"}
      - {id: abc159_e, role: challenge, summary: "チョコレートを縦横に切り分け、どのブロックも白いマスが K 個以下になるための最小の切る回数を求める。", approach: "横の切れ目 2^(H−1) 通りを全探索し、縦の切れ目は左から貪欲に入れる"}
    sources: ["01-basics §4.B", "01-basics §5", "01-basics §7.1", "01-basics §7.5"]

  - id: recursive-enumeration
    chapter: 全探索
    title: 再帰による全列挙
    aliases: [DFS による全列挙, バックトラック, 枝刈り, 組分けの全列挙, グループ分けの全列挙, 集合分割の全列挙, backtracking]
    type: technique
    level: 水
