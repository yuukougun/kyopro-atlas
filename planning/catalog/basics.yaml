      - {type: phrase, text: "中央値の最大値・最小値"}
      - {type: phrase, text: "全区間の中央値を集めた中央値"}
      - {type: shape, text: "選び方の和の最大化なら解けるが、割り算（平均・比）が入ると直接は最大化できない"}
