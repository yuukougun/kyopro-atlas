      - {id: abc026_d, role: practice, summary: "f(t) = At + B sin(Ctπ) が 100 になる t を、誤差の範囲で求める。", approach: "f が単調増加なので実数の二分探索で求める（反復回数を固定する）"}
      - {id: abc144_e, role: challenge, summary: "メンバーと料理の組合せと修行の配分を決め、チームの所要時間の最大値を最小化する。", approach: "組合せはソートで決め、上限 x を二分探索して必要な修行回数で判定する"}
      - {id: abc246_g, role: challenge, summary: "木の上の 2 人のゲームで、双方が最適に動いたときの結果の値を求める。", approach: "答えを決め打ちし、木 DP で達成できるかを判定する"}
