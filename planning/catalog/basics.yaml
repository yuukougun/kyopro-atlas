      - {id: abc146_c, role: practice, summary: "A×N + B×(N の桁数) 円の整数 N のうち、X 円以下で買える最大のものを求める。", approach: "値が N について単調なので N を二分探索する"}
      - {id: abc463_d, role: practice, summary: "（執筆時に確かめる）", approach: "答えの二分探索と貪欲な判定（research/00 §2.3.8 の分類）"}
      - {id: abc257_d, role: practice, summary: "ジャンプ台の間を行き来できるようにするための、最小の訓練回数を求める。", approach: "回数 x を決め、ある始点から全部に到達できるかを探索で判定して x を二分探索する"}
      - {id: abc415_e, role: practice, summary: "グリッドの移動でコインが増減するとき、途中で足りなくならないために最初に持つコインの枚数を求める（詳細は執筆時に確かめる）。", approach: "最初の枚数を二分探索し、所持枚数の最大を持つグリッドの DP で可否を判定する"}
