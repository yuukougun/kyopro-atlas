      - {id: abc479_d, role: practice, summary: "（執筆時に確かめる）", approach: "左右からの累積 min を前計算する（research/00 §2.3.8 の分類）"}
      - {id: arc098_a, role: practice, summary: "一列に並んだ人のうち 1 人をリーダーに選ぶとき、向きを変える人数の最小値を求める。", approach: "左側の W の数と右側の E の数を左右からの累積で求める"}
      - {id: abc172_c, role: practice, summary: "2 つの机に積まれた本を上から読むとき、K 分以内に読める最大の冊数を求める。", approach: "累積和と尺取り（または二分探索）"}
      - {id: abc125_c, role: practice, summary: "1 つだけ好きな値に書き換えたときの、全体の最大公約数の最大値を求める。", approach: "左右からの累積 gcd で「1 つ除いた gcd」を求める"}
