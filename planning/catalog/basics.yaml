  - id: prefix-sum
    chapter: 累積和といもす法
    title: 累積和
    aliases: [prefix sum, cumulative sum, 累積 GCD, 累積 XOR, 累積 max, 左右からの累積]
    type: technique
    level: 基礎
    level_evidence: "arc098_a（635）・abc122_c（700）・abc265_d（727）・abc172_c（930）・abc125_c（1197）。drken の「累積和」ABC 45 問の中央値 1037。最近の ABC の D〜G でも累積和は最多の道具の 1 つ（abc479_d 563 ほか。research/00 §2.3.8）"
