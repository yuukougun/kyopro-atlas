      - {id: abc236_e, role: practice, summary: "隣り合う 2 つの少なくとも一方を選ぶとき、選んだ値の平均の最大値と中央値の最大値をそれぞれ求める。", approach: "x を引いた値（中央値は x 以上を +1・未満を −1 にした値）で DP して判定し、x を二分探索する"}
