  - id: binary-search
    chapter: ソートと二分探索
    title: 二分探索
    aliases: [二分法, lower_bound, upper_bound, めぐる式二分探索, partition_point, binary search]
    type: technique
    level: 基礎
    level_evidence: "abc302_d（682）・abc143_d（686）・abc205_d（713）・abc321_d（806、2023）・arc084_a（1096）。drken の「二分探索:lower_bound」ABC 26 問の中央値 917"
    kind: [二分探索]
    prerequisites: [sorting-techniques]
    related: [binary-search-answer, two-pointers, segment-tree-binary-search, ordered-set, interactive]
    summary: "単調な条件の境界を、ok 側と ng 側の不変条件を保ちながら区間を半分ずつ狭めて O(log N) で見つける。ソート済みの列では lower_bound・upper_bound で x 以上の位置や個数を求められる。"
    signs:
      - {type: phrase, text: "ソート済みの列で x 以上の最初の位置・x 以下の個数"}
      - {type: phrase, text: "片方を固定して、もう片方が条件を満たす個数を数える"}
      - {type: phrase, text: "左右で最も近い要素を探す"}
      - {type: constraint, text: "N ≤ 2×10^5 個の値に対して、Q ≤ 2×10^5 個の位置・個数の質問がある"}
    acl: []
    frequency: A
    frequency_evidence: "recent 4（abc457_e・abc476_d・abc480_d・abc480_e）・前提として 26 ページに届く（直接 12）・古い ABC 5 問"
    sections:
      - {title: "めぐる式（ok と ng の不変条件・初期値は判定しない番兵）", anchor: meguru}
      - {title: "lower_bound・upper_bound と個数の数え方", anchor: lower-bound}
      - {title: "片方を固定してもう片方を二分探索する", anchor: fix-one-side}
      - {title: "落とし穴（(ok + ng) / 2 のあふれ・負の数の丸め・set に std::lower_bound）", anchor: pitfalls}
      - {title: "質問で二分探索する（インタラクティブ問題へ）", anchor: interactive}
    merged_keys: []
    visual: {kind: dynamic, priority: 1, text: "ok 側と ng 側を色分けした数直線で 2 本の指が近づくステップ送り（不変条件を常に表示）"}
    problems:
      - {id: abc143_d, role: example, representative: true, summary: "N 本の棒から 3 本を選んで三角形を作れる組の数を求める。", approach: "2 本を固定し、3 本目の長さの上限を二分探索して個数を数える"}
      - {id: abc302_d, role: practice, summary: "2 つの数列から 1 つずつ選び、差が D 以下になる組の和の最大値を求める。", approach: "片方を固定し、もう片方で x + D 以下の最大を二分探索で探す（2 ポインタでも解ける）"}
      - {id: abc205_d, role: practice, summary: "数列に含まれない正の整数のうち、小さい方から K 番目を答えるクエリに答える。", approach: "「x 以下で欠けている個数」の単調性で二分探索する"}
      - {id: abc321_d, role: practice, summary: "主菜と副菜のすべての組について min(A + B, P) の総和を求める。", approach: "B をソートし、A ごとに境界を二分探索して累積和で足す"}
      - {id: arc084_a, role: practice, summary: "上段・中段・下段のパーツを 1 つずつ選び、上段 < 中段 < 下段 となる組合せの数を求める。", approach: "中段を固定し、上段と下段で条件を満たす個数を二分探索で数える"}
      - {id: abc119_d, role: challenge, summary: "数直線上の神社と寺の位置が与えられ、各クエリの地点から神社と寺を 1 つずつ訪れる最短距離を答える。", approach: "左右の最寄りを lower_bound で求めて 4 通りを比べる（番兵を置く）"}
    sources: ["01-basics §4.C", "01-basics §5", "01-basics §6.4"]

