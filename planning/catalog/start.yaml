  - id: notation
    title: 記法と用語の約束
    aliases: [記法, 0-indexed, 1-indexed, 半開区間, 数学の記法, 合同式, 整除, 床関数, 天井関数, Σ の記法]
    type: guide
    level: null
    kind: [案内, 整数論]
    prerequisites: []
    related: [glossary, sigma-manipulation, integer-division, mod-arithmetic, graph-basics, tree-traversal, string-basics, cheatsheet]
    summary: "教材全体で使う記法の約束。計算量の書き方、半開区間、1-indexed と 0-indexed の変換、合同式・整除・floor/ceil・Σ/Π などの数学の記法、グラフ・木・文字列の記号をまとめる。各ページは定義を繰り返さず、ここを参照する。"
    signs: []
    acl: []
    sections:
      - "計算量の書き方（O(N log N) のように書き、log の底は書かない。償却・期待値の計算量はそう明記する）"
      - "区間は半開区間 [l, r) が基本（長さは r − l、空区間は l = r）。閉区間を使うときは明記する"
      - "添字：問題文の 1-indexed と実装の 0-indexed。変換は各ページで明示する"
      - "数と制約の書き方（2×10^5、10^9+7、998244353。N, Q ≤ 2×10^5 の読み方）"
      - "数学の記法（math-notation を統合）：合同式 a ≡ b (mod m) と余り a mod m の区別（C++ の % は負の数で負になる）、整除 a | b、⌊x⌋・⌈x⌉、Σ・Π（空の和は 0、空の積は 1）、gcd・lcm、v_p(n)、二項係数 C(n, k)"
      - "合同式で両辺を割ってよいのは、割る数と m が互いに素のときだけ（逆元が要る）。確認問題：2x ≡ 4 (mod 6) の解"
      - "集合と bit の記法（部分集合 S ⊆ T、補集合、2^N 通り、i ビット目、popcount）"
      - "確率・期待値の記法（P(A)、E[X]、独立）"
      - "グラフの記法（N 頂点 M 辺、有向辺 u → v、辺の重み w、最短距離 dist）"
      - "木の記法（深さ dep、親 par、部分木のサイズ sz、行きがけ番号 in・出る番号 out、根からの累積 S[v]、lca(u, v)、距離 d(u, v)）"
      - "文字列の記法（S[i]、部分文字列 S[l, r)、接頭辞・接尾辞。部分文字列（連続）と部分列（飛び飛び）の区別）"
      - "コード片の約束（long long と書き、マクロと型の別名は使わない。ループは半開区間で書く）"
      - "用語の正規形は用語集に従う（セグ木・Union-Find などの表記。textlint と prh で検査する）"
    merged_keys: [math-notation]
    visual: "手書き：数直線を m ごとに巻き取って時計にする図（合同な数が同じ位置に重なる）、数直線上の floor・ceil の図、半開区間 [l, r) の図（どれも静的な SVG）"
    problems: []
    sources: ["00-curriculum §4.1（記法と用語の約束）", "06-math-nt §4.1（math-notation）", "06-math-nt §7.6", "04-tree §7.5", "design §6.4", "design §6.5"]

  - id: atcoder-system
    title: AtCoder の仕組み
    aliases: [レーティング, パフォーマンス, difficulty の読み方, ABC の形式, ARC の区分, 生成AIのルール, 色]
    type: guide
    level: null
    kind: [案内]
    prerequisites: []
    related: [how-to-use, roadmap, contest-strategy, problem-sets, practice-method]
    summary: "レート・パフォーマンス・色、AtCoder Problems の difficulty（その問題を半々で解けるレート）、ABC の形式・配点・ペナルティ・順位、ARC の区分、練習用コンテスト、生成AIのルールを説明し、この教材のレベルが difficulty の帯で決まることと結びつける。"
    signs: []
    acl: []
    sections:
      - "レーティングとパフォーマンス（1回の成績をレートの尺度にした値。参加回数が少ないと表示レートが低く出る補正）"
      - "色（400刻み）と人数の割合の目安"
      - "difficulty の定義（解ける確率が50%になるレート。傾き ln6/400 のロジスティック曲線を当てはめる）と予測解答時間"
      - "difficulty と教材のレベルの対応（基礎〜1199・水・青・黄・発展 2400〜）と読み方の注意（知識の難しさではなく、その知識を使う問題の難しさ）"
      - "ABC の形式の変遷（4問 → 6問 → 8問 → 現在の7問・100分）、配点、Rated の範囲（〜1999。黄色になると ABC は Unrated になる）"
      - "位置ごとの difficulty（abc400〜abc480）：水 ≒ E、青 ≒ F、黄 ≒ 難しい F と易しい G。隣の位置の難しさが入れ替わる回が約1割ある"
      - "順位の決まり方とペナルティ（得点の合計、同点なら最後の AC の時刻＋誤答1回につき5分）"
      - "ARC・AGC・AHC と ARC の区分（ARC--・ARC・ARC++ の Rated 範囲。レート961 なら ARC-- が Rated）。執筆時に第三者の資料で確かめる"
      - "練習用のコンテスト（ADT・AWC・バーチャル参加）→ 問題集と練習用コンテストの案内"
      - "生成AIのルール（AtCoder生成AI対策ルール 20261014版：開催中の ABC・ARC・AGC は問題文や要約を入力して解法を出させてはいけない。過去問の練習は対象外）と、この教材の解説を使ってよい場面"
    merged_keys: []
    visual: "手書き：位置（A〜G）ごとの difficulty の箱ひげ図と、difficulty の帯と教材のレベルの対応図（research/00 §2.3.3 のデータから作る静的な SVG）"
    problems: []
    sources: ["00-curriculum §4.1（AtCoder の仕組み）", "00-curriculum §2.3.1", "00-curriculum §2.3.2", "00-curriculum §2.3.3", "00-curriculum §2.3.4", "00-curriculum §2.3.5", "00-curriculum §2.2.1", "00-curriculum §6.5.4", "00-curriculum §6.9", "decisions.md（2026-10-21 質問の前に確認した事実）"]

