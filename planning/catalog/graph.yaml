# 目次：グラフ（graph）。担当 C。規則は planning/catalog/README.md、上位の規則は planning/design.md §3〜§5。
# 並び順は research/03 §7.1 の6つのまとまり（基本と探索 → 最短路 → 有向グラフ → 連結性と全域木 → 経路の種類 → フロー）に、
# 横断・その他（グラフの構築・次数の平方分割・彩色数）を最後に足したもの。
# 問題 ID はすべて tools/ap.py で実在を確かめた。要約は調査の裏付け（research/03・04・00 の表）をもとに自分の言葉で書いた。
field: graph
pages:
  # ───────────── 1. 基本と探索 ─────────────
  - id: graph-basics
    chapter: 基本と探索
    title: グラフの表現と用語
    aliases: [グラフの基本, 隣接リスト, 隣接行列, 辺リスト, 次数]
    type: technique
    level: 基礎
    level_evidence: "typical90_bz（★2）・abc284_c (193)。ABC の C〜D で前提として使われる"
    kind: [グラフ探索]
    prerequisites: [complexity-estimation]
    related: [dfs, bfs, grid-graph, graph-modeling]
    summary: "N 頂点 M 辺のグラフを隣接リスト・隣接行列・辺リストのどれで持つかと、次数・パス・連結・木・DAG などの用語をそろえる。アルゴリズムごとに向く表現が決まっている。"
    signs:
      - {type: phrase, text: "N 頂点 M 辺のグラフで、i 番目の辺は頂点 u_i と v_i を結ぶ"}
      - {type: constraint, text: "N, M ≤ 2×10^5 では隣接行列（N^2 要素）は持てない"}
    acl: []
    frequency: A
    sections:
      - "隣接リスト・隣接行列・辺リストとアルゴリズムごとの使い分け"
      - "用語（次数・パスとウォーク・単純グラフ・連結・木・DAG・二部グラフ・補グラフ）"
      - "握手補題（次数の和は 2M）"
      - "落とし穴（1-indexed・無向グラフは両方向に追加・多重辺・重みの和のあふれ）"
    merged_keys: []
    visual: "図：同じグラフを図・隣接リスト・隣接行列・辺リストの4通りで並べ、1本の辺がそれぞれどこに現れるかを色で追う"
    problems:
      - {id: typical90_bz, role: example, summary: "各頂点について番号の小さい隣接頂点を数える（隣接リストの作り方の確認）"}
      - {id: abc284_c, role: practice, summary: "単純無向グラフの連結成分の個数を数える"}
    sources: ["03-graph §4.A（グラフの表現と用語）", "03-graph §5.2 A", "03-graph §6.4（用語集）"]

  - id: dfs
    chapter: 基本と探索
    title: 深さ優先探索（DFS）
    aliases: [深さ優先探索, DFS, バックトラック, 行きがけ順, 帰りがけ順]
    type: technique
    level: 基礎
    level_evidence: "abc315_e (921)・abc284_e (1043)。木の上では abc138_d (920)"
    kind: [グラフ探索]
    prerequisites: [graph-basics]
    related: [bfs, connected-components, cycle-detection, topological-sort, recursive-enumeration, tree-traversal, cpp-recursive-lambda, cpp-stack-depth]
    summary: "行けるところまで進んでから戻る探索で、到達可能性・連結成分・閉路検出・トポロジカル順の土台になる。帰りがけで訪問の印を外すバックトラック型にすると、単純パスを全列挙できる。"
    signs:
      - {type: phrase, text: "すべての単純パス・経路を数える（答えが上限を超えたら打ち切ってよい）"}
      - {type: phrase, text: "依存関係をたどり、帰りがけ順に処理する"}
      - {type: constraint, text: "N ≤ 10 程度で経路を全部列挙できる"}
    acl: []
    frequency: A
    sections:
      - "一度訪れた頂点は二度と訪れない型（O(N+M)）"
      - "バックトラック型（帰りがけで印を外す）"
      - "行きがけ順と帰りがけ順"
      - "非再帰の DFS と再帰の深さ"
      - "BFS・Union-Find との使い分け"
    merged_keys: []
    visual: "図：再帰の呼び出しスタックとグラフを並べ、行きがけ番号・帰りがけ番号が付いていく様子。バックトラック型では印を外す瞬間を色で示す（余裕があれば動く図）"
    problems:
      - {id: abc315_e, role: example, summary: "本1を読むのに必要な本を、依存関係の DFS の帰りがけ順で列挙する"}
      - {id: abc378_d, role: practice, summary: "グリッドで同じマスを通らない長さ K の経路を、バックトラックで数える"}
      - {id: typical90_bt, role: practice, summary: "小さいグリッドで最長の閉路を DFS の全探索で求める"}
      - {id: abc284_e, role: practice, summary: "頂点1からの単純パスを上限まで数える。帰りがけで訪問の印を外す"}
    sources: ["03-graph §4.A（深さ優先探索）", "03-graph §5.2 A"]

  - id: bfs
    chapter: 基本と探索
    title: 幅優先探索（BFS）と無重み最短路
    aliases: [幅優先探索, BFS, 無重み最短路, 多始点 BFS, 経路復元]
    type: technique
    level: 基礎
    level_evidence: "abc211_d (755)・abc168_d (804)・abc151_d (959)・abc007_3 (1024)。多始点は abc383_c (750)・agc033_a (1159)"
    kind: [グラフ探索, 最短路]
    prerequisites: [graph-basics, stack-techniques]
    related: [dfs, zero-one-bfs, dijkstra, grid-graph, state-space-search, shortest-path-dag, extended-dijkstra]
    summary: "始点に近い順に頂点を確定させる探索で、辺の重みがすべて等しいグラフの最短距離を O(N+M) で求める。発見したときの親を記録すれば経路を復元でき、全始点を最初にキューへ入れれば多始点の最短距離になる。"
    signs:
      - {type: phrase, text: "最小の手数・回数を求める（1回の移動のコストがすべて同じ）"}
      - {type: phrase, text: "一番近い〇〇までの距離・複数の場所から同時に広がる"}
      - {type: phrase, text: "最短経路を1つ出力する・次に進む頂点を答える"}
      - {type: constraint, text: "N, M ≤ 2×10^5、またはマスの数 H×W ≤ 10^6 程度"}
    acl: []
    frequency: A
    sections:
      - "最初に見つけた距離が最短になる理由"
      - "印は push のときに付ける・dist を −1 で初期化して訪問済みの印を兼ねる"
      - "経路復元（発見したときの親を記録して終点からたどる）"
      - "多始点 BFS（超始点から距離0の辺を張るのと同じ）"
      - "重みが 1 と 2 なら辺を割る・重み付きなら 01-BFS かダイクストラ"
    merged_keys: [multi-source-bfs, path-restoration]
    visual: "動く図：キューの中身と距離の層（同心円状の色分け）を同時に見せるステップ送り。push するときに印を付けることを強調する"
    problems:
      - {id: abc007_3, role: example, summary: "迷路の最短手数を求める。グリッド BFS の基本形"}
      - {id: abc383_c, role: practice, summary: "加湿器から D 歩以内のマスを、全加湿器を始点にした BFS で数える"}
      - {id: abc168_d, role: practice, summary: "部屋1への最短経路で次に進む部屋（BFS の親）を各部屋について出力する"}
      - {id: abc160_d, role: practice, summary: "近道が1本ある直線状のグラフで、全点対の距離ごとの組数を数える"}
      - {id: abc151_d, role: practice, summary: "迷路の2マス間の最短距離の最大値を、全マスから BFS して求める"}
      - {id: agc033_a, role: practice, summary: "黒マスが周囲に広がる回数を、全黒マスを始点にした BFS で求める"}
      - {id: abc460_d, role: challenge, summary: "マスの塗り替えの繰り返しを、多始点 BFS（8近傍）の距離と偶奇で調べる"}
    sources: ["03-graph §4.A（幅優先探索・多始点 BFS）", "03-graph §4.B（ダイクストラ法の経路復元）", "03-graph §5.2 A", "00-curriculum §2.3.8（abc460_d）"]

  - id: grid-graph
    chapter: 基本と探索
    title: グリッドグラフ
    aliases: [グリッド BFS, 迷路, 盤面の探索, 4近傍, 8近傍]
    type: technique
    level: 基礎
    level_evidence: "abc325_c (400)・abc351_d (974)・abc088_d (999)。障害物の連結で判定する応用は abc413_g (1723)"
    kind: [グラフ探索]
    prerequisites: [bfs, dfs]
    related: [connected-components, zero-one-bfs, union-find-connectivity, bipartite-graph, max-flow]
    summary: "マスを頂点、隣り合うマスを辺とみなして BFS・DFS・Union-Find をそのまま使う。(i, j) の1次元化、番兵、止まるマスの扱い、市松模様で二部グラフになることなどの小技をまとめる。"
    signs:
      - {type: phrase, text: "H×W のマス目を上下左右（8方向）に移動する・壁や障害物がある"}
      - {type: constraint, text: "H, W ≤ 2000 程度（マスの数が 4×10^6 程度まで）"}
      - {type: phrase, text: "H, W が巨大で障害物が少ない（障害物どうしのつながりを考える）"}
    acl: []
    frequency: A
    sections:
      - "4近傍・8近傍と dx・dy の配列"
      - "(i, j) を i×W+j に1次元化する・外周に番兵を置く"
      - "止まるマス・境界のマスの数え方"
      - "市松模様で二部グラフになる（フロー・マッチングへの入口）"
      - "障害物どうしの8近傍の連結で通れるかを判定する（青）"
    merged_keys: []
    visual: "図：(i, j) と頂点番号 i×W+j の対応表と dx・dy の矢印。市松模様の色分けで二部グラフになることも示す"
    problems:
      - {id: abc325_c, role: example, summary: "8方向に隣接する '#' の塊の個数を数える"}
      - {id: abc351_d, role: practice, summary: "磁石の隣で止まるグリッドで、到達できるマスの数の最大値を求める（境界のマスの扱い）"}
      - {id: abc088_d, role: practice, summary: "最短経路に使わない白マスを黒く塗れる最大数を、最短距離から逆算する"}
      - {id: typical90_l, role: practice, summary: "マスを赤く塗るクエリと2マスの連結判定のクエリを Union-Find で処理する"}
      - {id: abc413_g, role: challenge, summary: "巨大なグリッドで通れるかを、障害物どうしの8近傍の連結（双対）で判定する"}
    sources: ["03-graph §4.A（グリッドグラフ）", "03-graph §5.2 A"]

