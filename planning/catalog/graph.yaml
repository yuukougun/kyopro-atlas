    signs:
      - {type: phrase, text: "H×W のマス目を上下左右（8 方向）に移動する・壁や障害物がある"}
      - {type: constraint, text: "H, W ≤ 2000 程度（マスの数が 4×10^6 程度まで）"}
      - {type: phrase, text: "H, W が巨大で、障害物の数だけが少ない"}
    acl: []
    frequency: A
    frequency_evidence: "recent 2（abc453_d・abc460_d）・前提として届くページなし・古い ABC 4 問"
    sections:
      - {title: "4 近傍・8 近傍と dx・dy の配列", anchor: neighbors}
      - {title: "(i, j) を i×W+j に 1 次元化する・外周に番兵を置く", anchor: flatten}
      - {title: "止まるマス・境界のマスの数え方", anchor: boundary-cells}
      - {title: "市松模様で二部グラフになる（フロー・マッチングへの入口）", anchor: checkerboard}
      - {title: "障害物どうしの 8 近傍の連結で通れるかを判定する", anchor: obstacle-dual, level: 青}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "(i, j) と頂点番号 i×W+j の対応表と dx・dy の矢印。市松模様の色分けで二部グラフになることも示す"}
    problems:
      - {id: abc325_c, role: example, representative: true, summary: "8 方向に隣接する '#' をひとまとまりとみなしたとき、まとまりの個数を求める", approach: "8 近傍の DFS・BFS か Union-Find で成分を数える"}
      - {id: abc351_d, role: practice, summary: "磁石の隣のマスに入ると動けなくなるグリッドで、あるマスから行けるマスの数の最大値を求める", approach: "止まるマスは行き止まりとして BFS し、成分ごとに隣接する止まるマスを数え直す"}
      - {id: abc088_d, role: practice, summary: "迷路で、スタートからゴールへ行ける状態を保ったまま黒く塗れる白マスの最大数を求める", approach: "最短距離を BFS で求め、白マスの数から最短路のマス数を引く"}
      - {id: typical90_l, role: practice, summary: "マスを赤く塗るクエリと、2 マスが赤いマスだけでつながっているかを問うクエリに答える", approach: "隣の赤マスと Union-Find で併合する"}
      - {id: abc413_g, role: challenge, summary: "障害物のある巨大なグリッドで、左上から右下へ行けるかを判定する", approach: "障害物と外周を頂点にし、8 近傍で隣り合う障害物どうしの連結で道がふさがれるかを調べる（双対）"}
    sources: ["03-graph §4.A（グリッドグラフ）", "03-graph §5.2 A"]

  - id: connected-components
