# 目次：グラフ（graph）。担当 C。規則は planning/catalog/README.md（第2版）、上位の規則は planning/design.md §3〜§5 と planning/design-review.md。
# 第2版（2026-10-21）：design-review §4.2 の C の行に従って直した。
#   - state-space-search を extended-dijkstra（題名「状態を頂点にする」）に、biconnected-components を lowlink（題名「橋・関節点・二重連結成分」）に統合した
#   - shortest-path-overview は guide の method-comparison へ、xor-path は math の xor-basis へ、reachability-bitset は misc の bitset-speedup へ送った（moved）
#   - graph-modeling は hub にした。bellman-ford のポテンシャルの節は dijkstra の節（水）に移した
#   - 章は「基本と探索 → 最短路 → 有向グラフ → 連結性と全域木 → 探索木と次数の性質 → フロー・マッチング」。1ページだけの章「経路の種類」と「横断・その他」をなくした
# 問題 ID はすべて tools/ap.py で実在を確かめた。summary は問いだけ（手法名なし）、approach は執筆者向けの方針。問いが調査の記載から分からないものは summary を「（執筆時に確かめる）」にした。
field: graph
pages:
  # ───────────── 1. 基本と探索 ─────────────
  - id: graph-basics
    chapter: 基本と探索
    title: グラフの表現と用語
    aliases: [グラフの基本, 隣接リスト, 隣接行列, 辺リスト, 次数, adjacency list, graph representation]
    type: technique
    level: 基礎
    level_evidence: "typical90_bz（★2）・abc284_c (193)。ABC の C〜D で前提として使われる"
    kind: [グラフ探索]
    prerequisites: []
    related: [complexity-estimation, dfs, bfs, grid-graph, graph-modeling]
    summary: "N 頂点 M 辺のグラフを隣接リスト・隣接行列・辺リストのどれで持つかを選び、次数・パス・連結・木・DAG などの用語をそろえる。アルゴリズムごとに向く表現が決まっている。"
    signs:
      - {type: phrase, text: "グラフが N×N の 0/1 の表（隣接行列）で与えられる"}
      - {type: constraint, text: "N ≤ 2×10^5 では N^2 の隣接行列を持てない（N ≤ 2000 程度なら持てる）"}
    acl: []
    frequency: A
    frequency_evidence: "recent 0・前提として 84 ページに届く（直接 5）・古い ABC 1 問"
    sections:
      - {title: "隣接リスト・隣接行列・辺リストとアルゴリズムごとの使い分け", anchor: representations}
      - {title: "用語（次数・パスとウォーク・単純グラフ・連結・木・DAG・二部グラフ・補グラフ）", anchor: terms}
      - {title: "握手補題（次数の和は 2M）", anchor: handshake}
      - {title: "落とし穴（1-indexed・無向グラフは両方向に追加・多重辺・重みの和のあふれ）", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "同じグラフを図・隣接リスト・隣接行列・辺リストの 4 通りで並べ、1 本の辺がそれぞれどこに現れるかを色で追う"}
    problems:
      - {id: typical90_bz, role: example, representative: true, summary: "各頂点の隣接頂点のうち、自分より番号の小さいものの個数についての条件を満たす頂点を数える", approach: "隣接リストを作り、各頂点の隣を数える（隣接リストの作り方の確認）"}
      - {id: abc284_c, role: practice, summary: "単純無向グラフの連結成分の個数を求める", approach: "DFS・BFS か Union-Find で成分を数える"}
    problems_note: "練習が 1 問。表現そのものが主題の問題は少なく、探索のページの問題で練習する"
    sources: ["03-graph §4.A（グラフの表現と用語）", "03-graph §5.2 A", "03-graph §6.4（用語集）"]

  - id: graph-modeling
    chapter: 基本と探索
    title: グラフへの帰着
    aliases: [グラフに言い換える, モデル化, 何を頂点にするか, 何を辺にするか, グラフの縮約, graph modeling]
    type: hub
    level: null
    kind: [案内, グラフ探索, 考察]
    prerequisites: [graph-basics]
    related: [reformulation, connected-components, bipartite-graph, cycle-detection, extended-dijkstra, difference-constraints, scc, functional-graph]
    summary: "物・値・座標・状態・時刻・剰余などを頂点に、関係・操作・制約を辺にすると、問題が既知のグラフの問題（連結・二部・閉路・最短路）に変わる。自由に行き来できる部分は 1 点に縮約できる。"
    signs: []
    acl: []
    sections:
      - {title: "何を頂点にするか（物・値・座標・状態・時刻・剰余・区間の端点 → 行き先のページの表）", anchor: what-to-vertex}
      - {title: "何を辺にするか（関係・操作・制約・写像）", anchor: what-to-edge}
      - {title: "制約を辺にすると何の問題になるか（二部グラフ・閉路・差分制約）", anchor: constraints-to-edges}
      - {title: "自由に行き来できる部分を 1 点に縮約する（Union-Find・SCC・次数 2 の頂点を消す）", anchor: contraction}
    merged_keys: [graph-contraction]
    visual: {kind: static, priority: 2, text: "点 (x, y) を「x の頂点と y の頂点を結ぶ辺」と見直すなど、言い換えの前後を並べた図"}
    problems:
      - {id: abc377_e, role: practice, summary: "順列 P に対して、すべての i で P_i を P_{P_i} に同時に置き換える操作を K 回行った後の列を求める", approach: "i → P_i の辺で閉路の集まりと見ると、K 回の操作は閉路上を 2^K 歩進むことになる"}
      - {id: abc131_f, role: practice, summary: "平面の点の集合に「長方形の 3 隅があれば残りの 1 隅を足す」操作をくり返すとき、できる操作の最大回数を求める", approach: "x 座標と y 座標を頂点、点を辺にした二部グラフで、成分ごとに (x の数) × (y の数) を足して元の点の数を引く"}
      - {id: abc286_g, role: practice, summary: "無向グラフで、指定された K 本の辺はそれぞれちょうど 1 回、ほかの辺は何回でも通ってよい歩道があるかを判定する", approach: "自由に通れる辺でつながった頂点を 1 点に縮約し、指定の辺だけのグラフでオイラー路の条件を確かめる"}
    sources: ["03-graph §4.H（グラフへの帰着・グラフの縮約）", "03-graph §5.2 H", "03-graph §6.1（逆引き辞典）"]

  - id: dfs
    chapter: 基本と探索
    title: 深さ優先探索（DFS）
    aliases: [深さ優先探索, DFS, depth-first search, 単純パスの列挙]
    type: technique
    level: 基礎
    level_evidence: "abc315_e (921)・abc284_e (1043)。経路の全列挙は abc378_d (587)"
    kind: [グラフ探索]
    prerequisites: [graph-basics]
    related: [bfs, connected-components, cycle-detection, topological-sort, tree-traversal, recursive-enumeration, cpp-lambda#recursive-lambda, cpp-environment#stack-depth]
    summary: "行けるところまで進んでから戻る探索で、到達可能性・連結成分・閉路検出・トポロジカル順の土台になる。帰りがけで訪問の印を外せば単純パスを全列挙できる。"
    signs:
      - {type: phrase, text: "すべての単純パス・経路を数える（答えが上限を超えたら打ち切ってよい）"}
      - {type: phrase, text: "依存関係をたどり、必要なものを先に済ませる順に出力する"}
      - {type: constraint, text: "N ≤ 10 程度で、経路を全部列挙できる"}
    acl: []
    frequency: A
    frequency_evidence: "recent 0・前提として 58 ページに届く（直接 11）・古い ABC 3 問"
    sections:
      - {title: "一度訪れた頂点は二度と訪れない型（O(N+M)）", anchor: visit-once}
      - {title: "バックトラック型（帰りがけで印を外す）", anchor: backtracking}
      - {title: "行きがけ順と帰りがけ順", anchor: pre-post-order}
      - {title: "非再帰の DFS と再帰の深さ", anchor: iterative}
      - {title: "BFS・Union-Find との使い分け", anchor: comparison}
    merged_keys: []
    visual: {kind: dynamic, priority: 2, text: "再帰の呼び出しスタックとグラフを並べ、行きがけ番号・帰りがけ番号が付いていく様子。バックトラック型では印を外す瞬間を色で示す"}
    problems:
      - {id: abc315_e, role: example, representative: true, summary: "本 i を読むには指定された本を先に読む必要があるとき、本 1 を読むために読む本を、読む順に出力する", approach: "依存関係のグラフを本 1 から DFS し、帰りがけ順に出力する"}
      - {id: abc378_d, role: practice, summary: "障害物のあるグリッドで、同じマスを 2 回通らない長さ K の移動経路の数を求める", approach: "始点ごとにバックトラックの DFS で数える"}
      - {id: typical90_bt, role: practice, summary: "小さいグリッドで、同じマスを通らずに出発点へ戻る経路の長さの最大値を求める", approach: "全マスを始点にした DFS の全探索"}
      - {id: abc284_e, role: practice, summary: "頂点 1 から始まる単純パスの数を、10^6 を上限として求める", approach: "バックトラックの DFS で数え、上限に達したら打ち切る"}
    sources: ["03-graph §4.A（深さ優先探索）", "03-graph §5.2 A"]

  - id: bfs
    chapter: 基本と探索
    title: 幅優先探索（BFS）と無重み最短路
    aliases: [幅優先探索, BFS, breadth-first search, 無重み最短路, 多始点 BFS, 最短経路の復元]
    type: technique
    level: 基礎
    level_evidence: "abc211_d (755)・abc168_d (804)・abc151_d (959)・abc007_3 (1024)。多始点は abc383_c (750)・agc033_a (1159)"
    kind: [グラフ探索, 最短路]
    prerequisites: [graph-basics, stack-techniques]
    related: [dfs, zero-one-bfs, dijkstra, grid-graph, shortest-path-dag, extended-dijkstra, complement-graph-bfs]
    summary: "始点に近い順に頂点を確定させる探索で、辺の重みがすべて等しいグラフの最短距離を O(N+M) で求める。親を記録すれば経路を復元でき、全始点をキューに入れれば多始点の距離になる。"
    signs:
      - {type: phrase, text: "最小の手数・回数を求める（1 回の移動のコストがすべて同じ）"}
      - {type: phrase, text: "一番近い〇〇までの距離・複数の場所から同時に広がる"}
      - {type: phrase, text: "最短経路を 1 つ出力する・次に進む頂点を答える"}
      - {type: constraint, text: "N, M ≤ 2×10^5、またはマスの数 H×W ≤ 10^6 程度"}
    acl: []
    frequency: A
    frequency_evidence: "recent 3（abc453_d・abc460_d・abc472_d）・前提として 57 ページに届く（直接 10）・古い ABC 6 問"
    sections:
      - {title: "最初に見つけた距離が最短になる理由", anchor: why-shortest}
      - {title: "印は push のときに付ける・dist を −1 で初期化して訪問済みの印を兼ねる", anchor: mark-on-push}
      - {title: "経路復元（発見したときの親を記録して終点からたどる）", anchor: path-restoration}
      - {title: "多始点 BFS（超始点から距離 0 の辺を張るのと同じ）", anchor: multi-source}
      - {title: "重みが 1 と 2 なら辺を割る・重み付きなら 01-BFS かダイクストラ", anchor: weighted}
    merged_keys: [multi-source-bfs, path-restoration]
    visual: {kind: dynamic, priority: 1, text: "キューの中身と距離の層（同心円状の色分け）を同時に見せるステップ送り。push するときに印を付けることを強調する"}
    problems:
      - {id: abc007_3, role: example, representative: true, summary: "迷路のスタートからゴールまでの最小の移動回数を求める", approach: "グリッドの BFS の基本形"}
      - {id: abc383_c, role: practice, summary: "加湿器のどれかから D 歩以内で行ける床のマスの数を求める", approach: "全加湿器を始点にした多始点 BFS"}
      - {id: abc168_d, role: practice, summary: "各部屋に、部屋 1 へ最短で向かうための道しるべ（次に進む部屋）を置き、その置き方を出力する", approach: "部屋 1 からの BFS で各部屋の親を記録する"}
      - {id: abc160_d, role: practice, summary: "1 列に並ぶ頂点に近道を 1 本足したグラフで、距離が k の頂点の組の数を k ごとに求める", approach: "全頂点から BFS するか、近道を使うかどうかの式で距離を求める"}
      - {id: abc151_d, role: practice, summary: "迷路の 2 マス間の最短距離の最大値を求める", approach: "全マスを始点に BFS する"}
      - {id: agc033_a, role: practice, summary: "黒マスに隣接する白マスを黒にする操作を全体が黒になるまでくり返すとき、操作の回数を求める", approach: "全黒マスを始点にした多始点 BFS の最大距離"}
      - {id: abc460_d, role: challenge, summary: "（執筆時に確かめる）", approach: "多始点 BFS（8 近傍）の距離と、距離の偶奇で塗り替えの様子を調べる"}
    sources: ["03-graph §4.A（幅優先探索・多始点 BFS）", "03-graph §4.B（ダイクストラ法の経路復元）", "03-graph §5.2 A", "00-curriculum §2.3.8（abc460_d）"]

  - id: grid-graph
    chapter: 基本と探索
    title: グリッドグラフ
    aliases: [グリッド BFS, 迷路の探索, 4 近傍, 8 近傍, grid graph]
    type: technique
    level: 基礎
    level_evidence: "abc325_c (400)・abc351_d (974)・abc088_d (999)。障害物の連結で判定する応用は abc413_g (1723)"
