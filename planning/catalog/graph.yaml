  - id: cycle-detection
    chapter: 基本と探索
    title: 閉路の検出と復元
    aliases: [閉路検出, サイクル検出, 有向閉路, 無向閉路, 3色の DFS]
    type: technique
    level: 基礎
    level_evidence: "abc288_c (436)・abc311_c (448)・abc285_d (663)"
    kind: [グラフ探索]
    prerequisites: [dfs, union-find]
    related: [topological-sort, functional-graph, scc, namori-graph, graph-modeling, periodicity]
    summary: "無向グラフでは Union-Find か「親以外の訪問済みの頂点への辺」、有向グラフでは探索中の頂点への辺（3色の DFS）で閉路を見つけ、親をたどって復元する。シミュレーションの周期の検出とは別の話である。"
    signs:
      - {type: phrase, text: "循環している・依存関係が回っている・矛盾があれば −1"}
      - {type: phrase, text: "閉路を1つ見つけて出力せよ"}
    acl: [dsu, scc_graph]
    frequency: B
    sections:
      - "無向グラフ：Union-Find・親以外の訪問済みの頂点への辺（多重辺は辺の番号で除外）"
      - "有向グラフ：3色の DFS（探索中の頂点への辺だけが閉路）"
      - "Kahn 法で残る頂点（すべてが閉路上とは限らない）"
      - "閉路の復元（親をたどる）"
      - "出次数1のグラフでは同じ頂点に2回来るまで進む"
      - "シミュレーションの周期の検出（基本テクニックの章）との違い"
    merged_keys: []
    visual: "図：有向グラフの3色 DFS（未訪問・探索中・完了）。探索中の頂点への辺を見つけた瞬間に、スタックから閉路を切り出す"
    problems:
      - {id: abc285_d, role: example, summary: "名前の変更依頼の有向グラフに閉路があるかで、変更できるかを判定する"}
      - {id: abc288_c, role: practice, summary: "閉路をなくすために消す辺の最小数を、Union-Find で閉路を作る辺を数えて求める"}
      - {id: abc311_c, role: practice, summary: "各頂点から辺が1本出る有向グラフの閉路を1つ見つけて出力する"}
      - {id: abc456_e, role: challenge, summary: "都市と曜日の組を頂点にし（頂点倍化）、閉路の検出で判定する"}
    sources: ["03-graph §4.A（閉路の検出と復元）", "03-graph §5.2 A", "00-curriculum §2.3.8（abc456_e）"]

  - id: bipartite-graph
