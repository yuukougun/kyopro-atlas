    prerequisites: [dijkstra, dp-basics]
    related: [bellman-ford, shortest-path-overview, permutation-search, tsp, graph-construction]
    summary: "経由してよい頂点を1つずつ増やす DP で、全点対の最短距離を O(N^3) で求める。負辺も扱え、辺を1本足したときは O(N^2) で更新できる。"
    signs:
      - {type: constraint, text: "N ≤ 400 程度で全点対の距離が要る"}
      - {type: phrase, text: "辺を1本ずつ追加（削除）するクエリ"}
      - {type: phrase, text: "訪れる地点の順番を全探索する（地点間の距離を前計算する）"}
    acl: []
    frequency: B
    sections:
      - "k を一番外のループにする理由"
      - "初期化（d[i][i] = 0・多重辺・INF のあふれ）と負閉路の判定"
      - "辺の追加を O(N^2) で反映する（削除は逆順の追加に）"
      - "迂回できる辺は不要（青）"
      - "距離表を作ってから順列全探索・bitDP"
    merged_keys: []
    visual: "動く図：距離行列を k ごとに更新する。k 番目の行と列が中継点として光り、i-j のマスが d[i][k]+d[k][j] で更新される"
    problems:
      - {id: abc079_d, role: example, summary: "数字を書き換えるコストの全点対最短路を前計算し、各マスを1に変える最小コストを足す"}
      - {id: abc208_d, role: example, summary: "「経由してよい頂点を k まで増やす」というワーシャルフロイドの意味そのものを問う"}
      - {id: abc073_d, role: practice, summary: "訪問する町（8以下）の順番を順列全探索し、町間の距離は全点対で前計算する"}
      - {id: typical90_ci, role: practice, summary: "未知の辺の長さ X を二分探索し、各 X でワーシャルフロイドを回して条件を数える"}
      - {id: abc375_f, role: practice, summary: "辺の削除クエリを逆順の追加にし、追加1回を O(N^2) で反映する"}
      - {id: abc243_e, role: practice, summary: "迂回路で同じ距離以下にできる辺は消してよい。全点対の距離で判定する"}
      - {id: abc143_e, role: practice, summary: "燃料 L で1回に行ける町の組を全点対で求め、その上でもう一度全点対で給油回数を求める"}
      - {id: abc338_f, role: challenge, summary: "負辺あり（負閉路なし）の全点対最短路を前計算し、訪問した集合で bitDP する"}
    sources: ["03-graph §4.B（ワーシャルフロイド法）", "03-graph §5.2 B"]

  - id: bellman-ford
    chapter: 最短路
    title: ベルマンフォード法と負辺・負閉路
    aliases: [ベルマンフォード, Bellman-Ford, 負閉路検出, SPFA, ポテンシャル, Johnson のアイデア]
    type: technique
    level: 青
    level_evidence: "abc137_e (1740)・abc061_d (1838)・abc404_g (1894)。ポテンシャルで負辺を消す節は水（abc237_e 1208）"
    kind: [最短路]
    prerequisites: [dijkstra]
    related: [difference-constraints, warshall-floyd, min-cost-flow, shortest-path-overview]
    summary: "負の辺があっても、全辺の緩和を N−1 回くり返して単一始点の最短距離を O(NM) で求める。答えに影響するのは始点から届き終点へ行ける負閉路だけであることと、ポテンシャルで負辺を消してダイクストラを使う方法も扱う。"
    signs:
      - {type: phrase, text: "負の重みの辺がある・得点を最大化する（符号を反転すると負辺になる）"}
      - {type: phrase, text: "いくらでも大きくできるなら inf と出力する"}
      - {type: constraint, text: "N, M ≤ 数千（O(NM) が間に合う）"}
      - {type: phrase, text: "負の辺の重みが「高さの差」の形をしている（ポテンシャル）"}
    acl: []
    frequency: B
    sections:
      - "N−1 回で十分な理由"
      - "答えに影響する負閉路だけを判定する（到達可能性で絞る・−∞ を伝える）"
      - "最長路は符号を反転する"
      - "SPFA の注意（最悪の計算量は同じ）"
      - "ポテンシャルで負辺を消してダイクストラ（水）"
    merged_keys: [potential-reweighting]
    visual: "図：反復ごとに dist が更新される様子と、N 回目にも更新される頂点（負閉路の影響を受ける頂点）を赤く塗る図"
    problems:
      - {id: abc137_e, role: example, summary: "ゴールへ行ける正閉路があれば無限。到達可能性で頂点を絞ってから負閉路を判定する"}
      - {id: abc061_d, role: example, summary: "最長路を符号反転で最短路にし、頂点 N に影響する負閉路を判定する"}
      - {id: abc237_e, role: practice, summary: "高さの差で決まる負の辺を、高さをポテンシャルにして非負に直しダイクストラする"}
      - {id: abc404_g, role: practice, summary: "区間和の条件を累積和の差分制約に直し、負辺を含むのでベルマンフォードで解く"}
    sources: ["03-graph §4.B（ベルマンフォード法と負閉路・ポテンシャル）", "03-graph §5.2 B"]

