      - {id: abc451_f, role: practice, summary: "二部グラフの色を相対値で持つ重み付き Union-Find で、成分ごとに少ない方の色を選ぶ"}
      - {id: code_festival_2017_qualb_c, role: challenge, summary: "距離3の頂点の間に辺を足し続けた後の辺の数。二部グラフかどうかで答えが分かれる"}
