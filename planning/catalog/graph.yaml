    summary: "経由してよい頂点を 1 つずつ増やす DP で、全点対の最短距離を O(N^3) で求める。負辺があっても使え、辺を 1 本足したときは O(N^2) で更新できる。"
    signs:
      - {type: constraint, text: "N ≤ 400 程度で全点対の距離が要る"}
      - {type: phrase, text: "辺を 1 本ずつ追加（削除）するたびに、距離についての値を答える"}
      - {type: phrase, text: "訪れる地点の順番を全部試す（地点間の距離が要る）"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 7 問"
    sections:
      - {title: "k を一番外のループにする理由", anchor: k-outer}
      - {title: "初期化（d[i][i] = 0・多重辺・INF のあふれ）と負閉路の判定", anchor: init}
      - {title: "辺の追加を O(N^2) で反映する（削除は逆順の追加に）", anchor: add-edge}
      - {title: "距離表を作ってから順列全探索・bitDP", anchor: with-enumeration}
      - {title: "迂回できる辺は不要", anchor: redundant-edges, level: 青}
    merged_keys: []
    visual: {kind: dynamic, priority: 1, text: "距離行列を k ごとに更新する。k 番目の行と列が中継点として光り、i-j のマスが d[i][k]+d[k][j] で更新される"}
    problems:
      - {id: abc079_d, role: example, summary: "数字 i を j に書き換える費用の表と、壁のマスに書かれた数字が与えられ、すべての数字を 1 にする最小費用を求める", approach: "書き換えの費用の全点対最短路を前計算し、各マスの数字から 1 への距離を足す"}
      - {id: abc208_d, role: example, summary: "経由してよい頂点を k 以下に限ったときの最短距離 f(s, t, k) の総和を求める", approach: "ワーシャルフロイドの k のループの途中の値そのものを足す"}
      - {id: abc375_f, role: example, representative: true, summary: "道路を通行止めにするクエリと、2 都市間の最短距離を問うクエリに答える", approach: "クエリを逆順にして通行止めを道路の追加に直し、追加 1 回を O(N^2) で反映する"}
      - {id: abc073_d, role: practice, summary: "R 個（8 以下）の町を好きな順に訪れるとき、移動距離の総和の最小値を求める", approach: "町間の距離を全点対で前計算し、訪問順を順列全探索する"}
      - {id: typical90_ci, role: practice, summary: "長さが X の辺を含むグラフで、最短距離が P 以下の頂点の組がちょうど K 組になる X の個数を求める", approach: "X について単調なので二分探索し、各 X でワーシャルフロイドを回して組を数える"}
      - {id: abc243_e, role: practice, summary: "連結な重み付きグラフで、全点対の距離を変えずに消せる辺の最大数を求める", approach: "全点対の距離を求め、迂回路で同じ長さ以下にできる辺を数える"}
      - {id: abc143_e, role: practice, summary: "燃料タンクの容量が L の車で町を移動するとき、各クエリの 2 町間の最小の給油回数を求める", approach: "1 回の満タンで行ける町の組を全点対で求め、その上でもう一度全点対で回数を求める"}
      - {id: abc338_f, role: challenge, summary: "負の辺があり負閉路のない有向グラフで、すべての頂点を 1 回以上訪れる歩道の重みの最小値を求める", approach: "全点対の最短距離を前計算し、訪れた頂点の集合で bitDP する"}
    sources: ["03-graph §4.B（ワーシャルフロイド法）", "03-graph §5.2 B"]

  - id: bellman-ford
    chapter: 最短路
    title: ベルマンフォード法
    aliases: [ベルマンフォード, Bellman-Ford, 負閉路検出, SPFA, 負辺のある最短路]
    type: technique
    level: 青
    level_evidence: "abc404_g (1894, 2025)・abc137_e (1740)・abc061_d (1838)"
    kind: [最短路]
    prerequisites: [dijkstra]
    related: [difference-constraints, warshall-floyd, min-cost-flow, method-comparison]
    summary: "負の辺があっても、全辺の緩和を N−1 回くり返して単一始点の最短距離を O(NM) で求める。答えに影響するのは、始点から届き終点へ行ける負閉路だけである。"
    signs:
      - {type: phrase, text: "負の重みの辺がある・得点を最大化する（符号を反転すると負辺になる）"}
      - {type: phrase, text: "いくらでも大きくできるなら inf と出力する"}
      - {type: constraint, text: "N, M ≤ 数千（O(NM) が間に合う）"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として 1 ページに届く（直接 1）・古い ABC 3 問"
    sections:
      - {title: "N−1 回で十分な理由", anchor: why-n-minus-1}
      - {title: "答えに影響する負閉路だけを判定する（到達可能性で絞る・−∞ を伝える）", anchor: relevant-cycles}
      - {title: "最長路は符号を反転する", anchor: longest-path}
      - {title: "SPFA の注意（最悪の計算量は同じ）", anchor: spfa}
      - {title: "負辺があってもダイクストラで済む場合との見分け（ポテンシャル）", anchor: vs-potential}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "反復ごとに dist が更新される様子と、N 回目にも更新される頂点（負閉路の影響を受ける頂点）を赤く塗る図"}
    problems:
      - {id: abc137_e, role: example, representative: true, summary: "辺を通るたびにコインを拾い、終了時に経過時間 × P 枚を払うゲームで、頂点 N で終えるときに残るコインの最大値（いくらでも増やせるなら −1）を求める", approach: "辺の重みを C − P にして符号を反転し、頂点 N へ行ける負閉路だけを判定する"}
      - {id: abc061_d, role: example, summary: "有向グラフで頂点 1 から頂点 N へ進むときのスコアの最大値（いくらでも大きくできるなら inf）を求める", approach: "符号を反転して最短路にし、頂点 N に影響する負閉路を判定する"}
      - {id: abc404_g, role: practice, summary: "数列の区間の和がいくつか指定されているとき、各項が正で条件を満たす数列のうち総和の最小値を求める（なければ −1）", approach: "区間和の条件を累積和の差分制約に直し、負辺を含むのでベルマンフォードで解く"}
    problems_note: "練習が 1 問。負辺の最短路が本体の ABC の問題は少ない（abc319 以降は abc404_g）"
    sources: ["03-graph §4.B（ベルマンフォード法と負閉路）", "03-graph §5.2 B"]

  - id: shortest-path-dag
    chapter: 最短路
    title: 最短路 DAG
    aliases: [最短路木, 最短経路の数え上げ, 最短路に必ず使われる辺, shortest path DAG]
    type: technique
    level: 水
    level_evidence: "abc252_e (1294)・abc051_d (1566)・abc218_f (1753)・abc211_d (755)。abc319 以降で最短路 DAG が本体の水の問題は調査で見つかっていない（辺を消すと距離が変わるかを問う黄の問題は力試しに置いた）"
    kind: [最短路, DP]
    prerequisites: [dijkstra, dp-dag]
    related: [bfs, minimum-spanning-tree, lowlink, warshall-floyd, complement-graph-bfs]
    summary: "始点からの距離 d で d(v) = d(u) + w(u, v) を満たす辺だけを残すと DAG になり、最短路はその上のパスと一対一に対応する。最短路の本数・最短路木・必ず使われる辺が分かる。"
    signs:
      - {type: phrase, text: "最短経路の本数を数える"}
      - {type: phrase, text: "この辺を通らなくても最短距離は変わらないか・最短路に使われない辺"}
      - {type: phrase, text: "始点からの最短距離を保ったまま辺を減らし、全域木を出力する"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 5 問"
    sections:
      - {title: "最短路 DAG の作り方と性質（重み 0 の辺に注意）", anchor: build}
      - {title: "最短路の本数の DP", anchor: count-paths}
      - {title: "最短路木（最小全域木との違い）", anchor: shortest-path-tree}
      - {title: "辺が s-t 最短路に乗る条件（両端からの距離）", anchor: edge-on-path}
      - {title: "辺を消すと距離が変わるか", anchor: edge-removal, level: 黄}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "d(s,u)+w+d(v,t)=d(s,t) を満たす辺だけを太線にし、それが DAG になることと、その上での本数の DP を示す"}
    problems:
      - {id: abc211_d, role: example, summary: "無向グラフで、都市 1 から都市 N への最短経路の本数を求める", approach: "BFS と同時に、距離が 1 小さい頂点からの本数を足し合わせる"}
      - {id: abc252_e, role: example, representative: true, summary: "道路を N−1 本だけ残して、都市 1 から各都市への距離の総和を最小にするとき、残す道路を出力する", approach: "頂点 1 からの最短路木の辺を出力する"}
      - {id: abc051_d, role: practice, summary: "無向グラフで、どの 2 頂点間の最短路にも含まれない辺の数を求める", approach: "全点対の距離を求め、辺 (u, v, w) が d(u, v) = w を満たすかを調べる"}
      - {id: abc218_f, role: practice, summary: "有向グラフの各辺について、その辺だけを除いたときの頂点 1 から頂点 N への最短距離を求める", approach: "最短路 1 本に乗る辺（N−1 本以下）を除くときだけ BFS をやり直す"}
      - {id: abc375_g, role: challenge, summary: "各道路について、その道路だけを通行止めにしたとき都市 1 から都市 N への最短距離が変わるかを判定する", approach: "両端からの距離と最短路の本数で、その辺がすべての最短路に含まれるかを調べる"}
    sources: ["03-graph §4.B（最短路 DAG）", "03-graph §5.2 B"]

  - id: extended-dijkstra
    chapter: 最短路
    title: 状態を頂点にする
    aliases: [状態空間の探索, 状態空間 BFS, 拡張ダイクストラ, 頂点倍化, 頂点倍加, レイヤー化グラフ, 超頂点, 仮想頂点, 補助頂点, 盤面の BFS, state-space search, layered graph, super vertex]
    type: technique
    level: 水
    level_evidence: "abc361_d (1202, 2024)・abc339_d (1276, 2024)・abc184_e (1418)・abc302_f (1430)。abc319 以降の易しい形は abc453_d (1011)・abc463_e (1055)。資源・訪問した集合を持つ型と両端から伸ばす型は青（abc132_e 1625・abc244_f 1661・abc164_e 1877・abc197_f 1945）"
    kind: [最短路, グラフ探索]
    prerequisites: [dijkstra]
    related: [graph-modeling, zero-one-bfs, bit-dp, bit-operations, meet-in-the-middle, segment-tree-graph, union-find-connectivity, time-dependent-dijkstra, modular-shortest-path]
    summary: "元の頂点だけでは次の動きが決まらないとき、向き・残り回数・偶奇・盤面などを組にした状態を頂点にして最短路を求める。グループ内を自由に行き来できるなら、超頂点を足して辺を減らす。"
    signs:
      - {type: phrase, text: "K 回まで無料・スキップできる、手持ちのお金・燃料・体力がある"}
      - {type: phrase, text: "向き・直前の移動・歩数の偶奇や mod で次の移動が変わる"}
      - {type: phrase, text: "同じグループ（色・文字・集合）の中ならどこへでも移動できる"}
      - {type: phrase, text: "盤面・配置を操作して目標の形にする最小回数・2 人（2 つの駒）が同時に動く"}
      - {type: constraint, text: "状態数が 10^6〜10^7 程度に収まる（9! = 362880、60^4 ≈ 1.3×10^7）"}
      - {type: shape, text: "距離を dist[頂点][向き・残り回数・偶奇] のように 2 次元以上で持ちたくなる"}
    acl: []
    frequency: A
    frequency_evidence: "recent 3（abc453_d・abc456_e・abc463_e）・前提として 2 ページに届く（直接 2）・古い ABC 9 問"
    sections:
      - {title: "状態として持つべき情報を決める", anchor: choose-state}
      - {title: "状態数と遷移数の見積もり・状態を整数に詰める（配列で引くか map で持つか）", anchor: state-count}
      - {title: "2 つの位置の組を状態にする", anchor: pair-state}
      - {title: "頂点倍化（層を作り、層の間の辺でコストを表す）", anchor: layered-graph}
      - {title: "偶奇・mod・向きを持つ", anchor: parity-mod-direction}
      - {title: "超頂点・補助頂点で辺の数を減らす", anchor: super-vertex}
      - {title: "超頂点で距離がずれる場合の補正（2 で割る・1 を引く）", anchor: super-vertex-offset}
      - {title: "状態が多すぎるときは重要な点だけのグラフに作り直す", anchor: key-points}
      - {title: "資源を状態に持ち、上限で打ち切る", anchor: resource-state, level: 青}
      - {title: "訪問した集合を持つ（bitDP へのつなぎ）", anchor: visited-set, level: 青}
      - {title: "両端から伸ばす（回文の最短路）", anchor: two-ends, level: 青}
    merged_keys: [super-vertex, state-space-search]
    visual: {kind: static, priority: 2, text: "元のグラフを状態の数だけ層に重ね、層の間の辺を縦の矢印で描く図と、K 点の完全グラフとハブ 1 点の星形を並べて辺の数を比べる図"}
    problems:
      - {id: abc339_d, role: example, representative: true, summary: "障害物のあるグリッドに 2 人がいて、毎回同じ方向へ一斉に動く（動けない人はその場に残る）とき、2 人を同じマスに集める最小の操作回数を求める", approach: "2 人の位置の組（60^4 通り）を状態にした BFS"}
      - {id: abc184_e, role: example, summary: "同じ文字のテレポーターの間を移動できる迷路で、スタートからゴールまでの最小の移動回数を求める", approach: "文字ごとにテレポーターの辺を 1 回だけ展開して BFS する（超頂点と同じ効果）"}
      - {id: abc132_e, role: example, summary: "有向グラフで、辺を 3 本たどる「ケンケンパ」をくり返して頂点 S から頂点 T へ行くとき、ケンケンパの最小回数を求める", approach: "(頂点, 歩数 mod 3) の 3N 頂点で BFS する"}
      - {id: abc453_d, role: practice, summary: "（執筆時に確かめる）", approach: "座標と直前の向きの組を頂点にして BFS する"}
      - {id: abc463_e, role: practice, summary: "（執筆時に確かめる）", approach: "ゲートを使う移動を、仮想の頂点を 2 つ足した辺で表してダイクストラする"}
      - {id: abc361_d, role: practice, summary: "一列に並んだ白と黒の石を、隣り合う 2 個ずつ空きマスへ移す操作で目標の並びにするとき、操作の最小回数を求める", approach: "石の並びを状態にして BFS する"}
      - {id: abc224_d, role: practice, summary: "9 頂点のグラフの 8 頂点に駒が置かれ、空いた頂点へ隣の駒を動かせるとき、すべての駒を目的の頂点へそろえる最小の手数を求める", approach: "駒の配置（9! 通り）を状態にした BFS"}
      - {id: abc302_f, role: practice, summary: "共通の要素をもつ 2 つの集合を和集合に置き換える操作で、1 と M を両方含む集合を作るのに必要な最小の操作回数を求める", approach: "集合と要素を頂点にしたグラフで BFS し、距離を補正して答える"}
      - {id: abc244_f, role: practice, summary: "各頂点を通った回数の偶奇を表す 0/1 列 S のすべてについて、その偶奇になる最短の歩道の長さを求め、総和を答える", approach: "(偶奇のビット列, 今の頂点) を状態にした BFS"}
      - {id: abc164_e, role: challenge, summary: "運賃が銀貨、所要時間が分の路線で、各都市で金貨を銀貨に両替できるとき、都市 1 から各都市への最短時間を求める", approach: "(頂点, 銀貨の枚数) を状態にしたダイクストラで、銀貨は必要な上限で打ち切る"}
      - {id: abc197_f, role: challenge, summary: "各辺に文字が書かれた無向グラフで、頂点 1 から頂点 N への歩道のうち、通った辺の文字列が回文になるものの最短の長さを求める", approach: "両端の頂点の組 (u, v) を状態にし、同じ文字の辺で両側へ同時に伸ばす"}
      - {id: arc061_c, role: challenge, summary: "路線ごとに鉄道会社が決まっており、会社を乗り換えるたびに運賃が 1 かかるとき、駅 1 から駅 N への最小運賃を求める", approach: "(駅, 乗っている会社) を頂点にし、乗り換えをコスト 1 の辺にする"}
    problems_note: "abc348_d（状態が多すぎるので重要な点だけのグラフに作り直す）・zone2021_e（頂点を 2 倍にして上りと下りのコストを分ける）・typical90_bb（超頂点で距離が 2 倍になる）は本文の参照にする（03-catalog 指摘 5）"
    sources: ["03-graph §4.A（状態空間の探索）", "03-graph §4.B（状態を頂点にする・超頂点）", "03-graph §5.2 A・B", "00-curriculum §4.2（超頂点）", "00-curriculum §2.3.8（abc453_d・abc463_e）"]

