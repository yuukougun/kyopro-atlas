  - id: warshall-floyd
    chapter: 最短路
    title: ワーシャルフロイド法
    aliases: [ワーシャルフロイド, Floyd-Warshall, 全点対最短路]
    type: technique
    level: 水
    level_evidence: "abc208_d (1190)・abc073_d (1345)・abc375_f (1546)・abc243_e (1637)・abc143_e (1695)"
