  # ───────────── 2. 最短路 ─────────────
  - id: dijkstra
    chapter: 最短路
    title: ダイクストラ法
    aliases: [ダイクストラ, Dijkstra, 経由点の最短路, 両端からのダイクストラ, 逆向きのグラフ, 最短閉路]
    type: technique
    level: 基礎
    level_evidence: "abc362_d (634)・abc340_d (784)・abc325_e (1093)・abc192_e (1135)。逆向きのグラフ・両端からの最短路は水（abc369_e 1301・abc035_d 1591・soundhound2018_summer_qual_d 1637）"
    kind: [最短路]
    prerequisites: [bfs, stl-containers]
    related: [priority-queue, zero-one-bfs, bellman-ford, shortest-path-overview, extended-dijkstra, time-dependent-dijkstra, shortest-path-dag]
    summary: "辺の重みが非負のグラフで、暫定距離が最小の頂点から順に確定させ、単一始点の最短距離を O((N+M) log N) で求める。逆向きのグラフや、始点と終点の両方からの距離を組み合わせる応用もここで扱う。"
    signs:
      - {type: phrase, text: "非負の重み付きグラフの最短距離・最小コスト（頂点にもコストがある）"}
      - {type: constraint, text: "N, M ≤ 2×10^5 で辺の重みが非負"}
      - {type: phrase, text: "頂点 k を経由する最短路をすべての k について・行きと帰り"}
    acl: []
    frequency: A
    sections:
      - "取り出した頂点の距離が確定する理由"
      - "古い組を読み飛ばす・priority_queue を最小ヒープにする"
      - "頂点の重みを辺に足す・経路復元は BFS と同じ"
      - "密グラフの O(N^2) 版"
      - "負辺で壊れる例（ポテンシャルで直せる場合はベルマンフォードのページ）"
      - "最短閉路（ある頂点を含む閉路の最小の長さ）"
      - "逆向きのグラフと両端からの最短路（水）"
    merged_keys: [reverse-graph-shortest-path, shortest-cycle]
    visual: "動く図：ヒープの中身（(距離, 頂点) の組）と確定済みの頂点の集合を並べたステップ送り。古い組を読み飛ばす場面と、負辺を入れると確定済みの距離が後から縮む反例を見せる"
    problems:
      - {id: abc362_d, role: example, summary: "頂点にも重みがある最短路。辺の重みに行き先の頂点の重みを足してダイクストラする"}
      - {id: abc376_d, role: practice, summary: "頂点1を含む最小の有向閉路を、頂点1からの最短距離と1へ戻る辺で求める"}
      - {id: abc340_d, role: practice, summary: "ステージの解放関係をグラフにして、最短の所要時間を求める"}
      - {id: abc325_e, role: practice, summary: "社用車から電車へ1回だけ乗り換える。(頂点, 乗り換えたか) の2層にするか、両端からの最短距離を組み合わせる"}
      - {id: abc477_e, role: practice, summary: "ダイクストラで求めた距離と、円周上の累積和を組み合わせて答える"}
      - {id: typical90_m, role: practice, summary: "頂点 k を経由する最短路を、頂点1と頂点 N からの2回のダイクストラの和で求める"}
      - {id: abc035_d, role: practice, summary: "行きは元のグラフ、帰りは辺を逆にしたグラフでダイクストラする"}
      - {id: soundhound2018_summer_qual_d, role: challenge, summary: "2種類の通貨の運賃。始点と終点からの最短距離と、後ろからの最小値を組み合わせる"}
    sources: ["03-graph §4.B（ダイクストラ法）", "03-graph §5.2 B（ダイクストラ法・逆向きのグラフ・最短閉路）", "00-curriculum §2.3.8（abc477_e）"]

