      - {id: abc357_f, role: example, representative: true, summary: "2 つの数列への区間加算と、区間の Σ A_i B_i の質問を処理する。", approach: "S＝(長さ, ΣA, ΣB, ΣAB)、F＝(x, y) の加算"}
      - {id: abc322_f, role: example, summary: "0/1 の列の区間反転と、区間で 1 が連続する最大の長さの質問を処理する。", approach: "0 と 1 それぞれの端から続く長さと最長を持ち、反転で入れ替える"}
      - {id: abc332_f, role: practice, summary: "区間内の 1 点を等確率で選んで X に書き換える操作を繰り返した後の、各要素の期待値を答える。", approach: "x → (1 − p)x + pX のアフィン作用（一点取得だけなので双対セグ木でも足りる）"}
      - {id: abc237_g, role: practice, summary: "区間を昇順・降順にソートする操作を繰り返した後の、値 X の位置を求める。", approach: "X との大小で 0/1 の列にし、区間代入・区間和でソートを再現する"}
      - {id: abc371_f, role: practice, summary: "一列に並ぶ人を順に目的地へ動かすときの、総移動回数を求める。", approach: "X_i − i に直して区間代入・区間和と遅延セグ木上の二分探索"}
      - {id: practice2_l, role: practice, summary: "0/1 の列の区間反転と、区間の転倒数の質問を処理する。", approach: "S＝(0 の数, 1 の数, 転倒数)、F＝反転フラグ。反転後の転倒数は 0 の数 × 1 の数 − 転倒数"}
      - {id: abc470_g, role: challenge, summary: "（執筆時に確かめる）", approach: "mex の総和を寄与に言い換え、尺取りと遅延セグ木で数える（research/00 §2.3.8 の分類）"}
      - {id: abc265_g, role: challenge, summary: "0/1/2 の列の区間の転倒数と、区間の値を写像で置き換える操作のクエリを処理する。", approach: "各値の個数と順序対の個数を S、値の写像を F にする"}
    sources: ["05-ds §4.C（lazy-segtree-patterns）", "05-ds §5（lazy-segtree-patterns・lazy-segment-tree）", "00-curriculum §2.3.8（abc470_g）"]

