      - "しきい値でソート（重み w 以下の辺だけで連結か・X 以下の要素の和）"
      - "時間を逆にする（削除を追加に → グラフの章の Union-Find で連結性を扱う）"
      - "答えを 2 時点の差に分ける"
      - "先に全部読んで座標圧縮する"
