    type: technique
    level: 水
    level_evidence: "値を添字にした区間 max の DP は緑〜水（abc339_e 1109・abl_d 1283）、個数と和を載せて境界を探す形は水（abc281_e 1334・abc276_f 1562）。上位 K 個の和の更新は黄（abc287_g 2180）、オンライン強制で動的セグ木が要るのは黄（abc403_g 2028）。abc319 以降の問題は帯の外（abc339_e・abc403_g）なので、水の根拠には古い問題を使った（D2）"
    kind: [データ構造, 区間クエリ, ソート・座標圧縮]
