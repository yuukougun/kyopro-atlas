      - {id: arc188_c, role: challenge, summary: "正直者・嘘つき・混乱の有無について、すべての証言と整合する割り当てを求める。", approach: "混乱の変数を消して 2 変数の XOR の制約に直し、偶奇の Union-Find で持つ"}
    sources: ["05-ds §4.B（weighted-union-find）", "05-ds §5（weighted-union-find）", "05-ds 付録 A", "00-curriculum §2.3.8（abc451_f）"]

