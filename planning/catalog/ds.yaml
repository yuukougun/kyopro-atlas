      - {id: abc177_d, role: practice, summary: "友達どうしを同じ組にしない分け方の最小の組数。最大の連結成分の大きさを求める"}
      - {id: abc206_d, role: practice, summary: "値を一括で置き換える操作で数列を回文にする最小回数。対称な位置の値どうしをつなぎ、併合した回数を数える"}
      - {id: abc157_d, role: practice, summary: "各人について、同じ成分にいて友達でもブロック相手でもない人の数"}
      - {id: practice2_a, role: practice, summary: "辺の追加と、2 頂点が連結かの判定のクエリ（ACL の dsu）"}
      - {id: typical90_l, role: practice, summary: "マスを赤く塗るクエリと、2 マスが赤いマスだけで行き来できるかのクエリ。グリッドのマスを番号にして併合する"}
