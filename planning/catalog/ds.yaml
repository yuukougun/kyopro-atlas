# データ構造（ds）の目次（第2版）。規則は planning/catalog/README.md（第2版）と planning/design-review.md
# 章は research/05 §7.1 の6つ（標準コンテナの応用・スタックとキュー・Union-Find・区間クエリ・クエリ処理の工夫・
# そのほかのデータ構造）。セグメント木の6ページは「基本（水）／セグメント木上の二分探索（水）／値を添字にする（水）／
# 遅延セグメント木（水）／モノイドの設計（青）／遅延セグメント木の載せ方の型（青）」
# verify は Library Checker の問題名（research/05 §7.5）
field: ds
pages:

  # ===== 1. 標準コンテナの応用 =====

  - id: stl-containers
    chapter: 標準コンテナの応用
    title: STL コンテナの使い分け
    aliases: [STL, STL containers, 標準ライブラリのコンテナ, コンテナの計算量]
    type: technique
    level: 基礎
    level_evidence: "容器の使い分けは灰〜緑で必須（abc253_c 518・abc166_e 1062）。上位の手法の部品なので基礎の短いページにする"
    kind: [データ構造, 実装・C++]
    prerequisites: []
    related: [ordered-set, priority-queue, stack-techniques, prefix-sum-counting, cpp-container-idioms]
    summary: "どの操作を速くしたいかで vector・deque・set・map・priority_queue・unordered_map を選ぶ。multiset の erase(x) は同じ値を全部消し、map の [] は要素を作る。"
    signs:
      - {type: phrase, text: "要素の追加・削除と、検索・最小値の取り出しのクエリが混ざる"}
      - {type: shape, text: "j − i = A_i + A_j のように、i だけの式と j だけの式が等しい組 (i, j) を数える"}
      - {type: constraint, text: "N, Q ≤ 2×10^5 で、追加・削除・検索のクエリが来る"}
    acl: []
    verify: [associative_array]
    frequency: A
    frequency_evidence: "recent 0・前提として 72 ページに届く（直接 5）・古い ABC 2 問"
    sections:
      - {title: "操作とコンテナの計算量の早見表", anchor: complexity-table}
      - {title: "選び方（何を速くしたいか）", anchor: choosing}
      - {title: "map で数えながら走査する（→ 累積和と連想配列で区間を数える）", anchor: counting-map}
      - {title: "落とし穴（multiset の erase(x) は全部消す・set に std::lower_bound は O(N)・map の [] は要素を作る・空の size() − 1・イテレータの無効化・unordered_map のハック）", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "操作 × コンテナの計算量の表"}
    problems:
      - {id: abc253_c, role: example, representative: true, summary: "多重集合への追加・個数を指定した削除と、最大値 − 最小値の出力を繰り返す。", approach: "multiset でイテレータを使って 1 個ずつ消す（ヒープ 2 本と個数の表で遅延削除してもよい）"}
      - {id: abc166_e, role: practice, summary: "j − i = A_i + A_j を満たす組 (i, j) の数を求める。", approach: "i + A_i = j − A_j に分け、片側の値の出現回数を map で数えながら走査する"}
      - {id: tessoku_book_bb, role: practice, summary: "名前ごとの点数の登録と参照のクエリを処理する。", approach: "map<string, int>"}
      - {id: tessoku_book_bc, role: practice, summary: "整数の追加・削除と「x 以上で最小の値」のクエリを処理する。", approach: "set の insert・erase・lower_bound"}
    sources: ["05-ds §4.A（stl-containers）", "05-ds §5（stl-containers）", "05-ds §6.4"]

  - id: ordered-set
    chapter: 標準コンテナの応用
    title: set・multiset・map の応用
    aliases: [順序付き集合, ordered set, set::lower_bound, 前後の要素, 番兵, パレート境界]
    type: technique
    level: 基礎
    level_evidence: "lower_bound で前後を取る基本は緑（abc217_d 802・abc370_d 1088・abc241_d 1177）。パレート境界・使える箱の multiset は水の節（abc245_e 1571）、ソート順で隣り合う組は青の節（abc140_e 1873）。最小 XOR の組（abc308_g 2008）は binary-trie へ移した"
    kind: [データ構造]
    prerequisites: [stl-containers]
    related: [interval-set, kth-element, priority-queue, top-k-multiset, binary-trie, mex, hashing-for-sets, binary-search, cpp-container-idioms#iterators]
    summary: "set・multiset・map の lower_bound で「x 以上の最小」「x 未満の最大」を O(log N) で求め、要素の追加・削除と組み合わせる。番兵で端の場合分けを消し、mex や同じ行・列の次の要素も同じ形で求める。"
    signs:
      - {type: phrase, text: "x 以上で最小の値・最も近い値を、追加・削除しながら何度も答える"}
      - {type: phrase, text: "まだ使われていない最小の値（mex）を更新のたびに答える"}
      - {type: phrase, text: "同じ行・同じ列で次にある壁や家を見つけて壊す"}
      - {type: constraint, text: "値が 10^9 まであり、配列の添字にできない"}
    acl: []
    verify: [predecessor_problem, double_ended_priority_queue]
    frequency: A
    frequency_evidence: "recent 2（abc466_f・abc475_e）・前提として 8 ページに届く（直接 6）・古い ABC 8 問"
    sections:
      - {title: "前後の要素（lower_bound とその 1 つ前。番兵で端の場合分けを消す）", anchor: neighbors}
      - {title: "K 番目付近（イテレータを K 歩動かす。K が小さいときだけ）", anchor: near-kth}
      - {title: "まだ出ていない値の set で mex を管理する（→ 題材別の mex）", anchor: mex}
      - {title: "行ごと・列ごとの set（グリッドで次の壁を探し、両方から消す）", anchor: rows-and-columns, level: 水}
      - {title: "パレート境界を map で持つ（支配される点を消す。ならし O(log N)）", anchor: pareto, level: 水}
      - {title: "ソート順で隣り合う組の集合（2 番目に大きい値の寄与。最小 XOR の組は Binary Trie のページ）", anchor: adjacent-pairs, level: 青}
      - {title: "落とし穴（multiset の erase・end と begin の前の参照・イテレータの無効化）", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "数直線上の set の要素と、lower_bound が指す位置・その 1 つ前を矢印で示す"}
    problems:
      - {id: abc217_d, role: example, representative: true, summary: "長さ L の木材の切断と、点 x を含む木片の長さの質問を処理する。", approach: "切れ目を set に入れ（番兵 0 と L）、lower_bound で前後の切れ目を探す"}
      - {id: abc330_e, role: practice, summary: "1 点を書き換えるたびに数列の mex を答える。", approach: "個数 0 の値（N 以下）を set で持ち、最小を取る"}
      - {id: abc370_d, role: practice, summary: "爆弾で上下左右の最も近い壁を壊していくシミュレーションの後に残る壁の数を求める。", approach: "行ごと・列ごとの set を lower_bound で探し、見つけた壁を両方から消す"}
      - {id: abc385_d, role: practice, summary: "軸に平行に移動したときの最終位置と、通過した家の数を求める。", approach: "x ごと・y ごとの set を lower_bound で走査し、見つけた家を両方から消す"}
      - {id: abc241_d, role: practice, summary: "数の追加と「x 以下で大きい方から k 番目」「x 以上で小さい方から k 番目」の質問を処理する（k ≤ 5）。", approach: "multiset の lower_bound からイテレータを k 歩動かす"}
      - {id: abc245_e, role: practice, summary: "チョコレートをすべて、縦横とも収まる別々の箱に入れられるかを判定する。", approach: "縦の大きい順に処理し、使える箱の横幅を multiset に入れて lower_bound で最小のものを使う"}
      - {id: abc140_e, role: challenge, summary: "すべての区間について 2 番目に大きい値を求め、その総和を答える。", approach: "大きい順に位置を set に入れ、左右それぞれ 2 つ先の位置から寄与を数える"}
    sources: ["05-ds §4.A（ordered-set）", "05-ds §5（ordered-set）", "05-ds 付録 A", "00-curriculum §4.2（mex）"]

  - id: priority-queue
    chapter: 標準コンテナの応用
    title: 優先度付きキュー
    aliases: [priority_queue, ヒープ, heap, 二分ヒープ, binary heap, 削除できるヒープ, 遅延削除, erasable heap]
    type: technique
    level: 水
    level_evidence: "容器としては茶（abc234_d 503）。上位 K 個の列挙・遅延削除が水で必須（abc123_d 1489・abc170_e 1502・abc391_f 1554、2025）、青まで続く（abc116_d 1712・abc214_e 1835）。設計書 §4.3 で水"
    kind: [データ構造, 貪欲]
    prerequisites: [stl-containers]
    related: [greedy-priority-queue, kth-value, top-k-multiset, ordered-set, global-offset, dijkstra, cpp-comparators, advanced-ds-catalog]
    summary: "最大（最小）の要素の取り出しと追加を O(log N) で行う。ソートと組む貪欲・上位 K 個の列挙・接頭辞の K 番目に使い、任意の要素の削除は削除予定のヒープで遅らせて行う。"
    signs:
      - {type: phrase, text: "毎回いちばん大きい（小さい）ものを取り出し、新しい候補を入れる"}
      - {type: phrase, text: "接頭辞ごとに K 番目に大きい値を答える"}
      - {type: phrase, text: "グループ間の移動のたびに、各グループの最大値のうちの最小値を答える"}
      - {type: constraint, text: "追加と取り出しが合わせて 2×10^5 回程度"}
    acl: []
    verify: []
    frequency: B
    frequency_evidence: "recent 1（abc471_d）・前提として 3 ページに届く（直接 2）・古い ABC 7 問"
    sections:
      - {title: "何ができるか（push・top・pop。最小を取り出す向きと pair の比較順。書き方は C++ 章）", anchor: what-it-does}
      - {title: "二分ヒープの仕組み（保つ性質「親 ≤ 子」・push で上げる・pop で下げる・heapify は O(N)）", anchor: binary-heap}
      - {title: "使い方の型（ソートと組む貪欲・上位 K 個の列挙・大きさ K のヒープで接頭辞の K 番目）", anchor: patterns}
      - {title: "全体への加算と組む（入れるときに引き、出すときに足す）", anchor: with-offset}
      - {title: "削除できるヒープ（遅延削除：削除予定のヒープの top と一致したら両方から捨てる）", anchor: lazy-deletion}
      - {title: "priority_queue と multiset の使い分け（任意の削除・両端・前後の要素が要るなら multiset）", anchor: vs-multiset}
      - {title: "落とし穴（向きの取り違え・古いエントリを捨て忘れる・空のときの top）", anchor: pitfalls}
    merged_keys: [lazy-deletion]
    visual: {kind: static, priority: 2, text: "二分ヒープの配列と木の対応、push で上げる・pop で下げる経路。本体と削除予定のヒープを並べた図"}
    problems:
      - {id: abc234_d, role: example, summary: "数列の接頭辞ごとに、K 番目に大きい値を答える。", approach: "大きさ K の最小ヒープを保ち、top が答え"}
      - {id: abc123_d, role: example, representative: true, summary: "3 つの数列から 1 つずつ選んだ和のうち、大きい方から K 個を出力する。", approach: "降順にソートし、添字の組を最大ヒープで広げ、重複は set で除く"}
      - {id: abc170_e, role: example, summary: "幼児の転園のたびに、各幼稚園の最強レートのうちの最小値を答える。", approach: "園ごとの multiset と「各園の最大値」の multiset。ヒープなら遅延削除"}
      - {id: abc471_d, role: practice, summary: "（執筆時に確かめる）", approach: "優先度付きキュー（research/00 §2.3.8 の分類）"}
      - {id: abc217_e, role: practice, summary: "末尾への追加・先頭の取り出し・全体のソートのクエリを処理する。", approach: "ソート済みの先頭部分を最小ヒープ、後から来た部分を queue で持つ"}
      - {id: abc391_f, role: practice, summary: "3 つの数列から 1 つずつ選んだ組の評価値のうち、K 番目に大きいものを求める。", approach: "降順ソートで単調にし、最大の組から隣の添字をヒープで広げる（訪問済みを管理する）"}
      - {id: abc116_d, role: practice, summary: "種類数のボーナスつきで K 個の寿司を選ぶときの満足度の最大値を求める。", approach: "入れ替えの候補をヒープで持ち、種類数を変えながら差分を更新する"}
      - {id: abc214_e, role: practice, summary: "各ボールを区間 [L, R] の中の別々の箱に入れられるかを判定する。", approach: "L の順に処理し、入れられるボールの R を最小ヒープで持って R の小さいものから置く"}
    sources: ["05-ds §4.A（priority-queue・lazy-deletion）", "05-ds §5（priority-queue・lazy-deletion）", "05-ds 付録 A（abc391_f）", "00-curriculum §2.3.8（abc471_d）", "01-basics §4.H（greedy-priority-queue）"]

  - id: top-k-multiset
    chapter: 標準コンテナの応用
    title: 上位 K 個の和と中央値の管理
    aliases: [2 つの multiset, 2 つのヒープ, two heaps, 下位 K 個の和, 動的な中央値, running median, Priority Sum Structure]
    type: technique
    level: 水
    level_evidence: "abc306_e（1268）・abc281_e（1334）で必須。易しい形は abc458_d（450、2026、2 つのヒープで中央値）、応用は abc127_f（2003）。abc319 以降で水の帯の問題が見つからないので古い根拠を使った（D2）"
    kind: [データ構造]
    prerequisites: [ordered-set, priority-queue]
    related: [segment-tree-on-values, kth-element, median-absolute, slope-trick, greedy-priority-queue]
    summary: "追加・削除のたびに上位（下位）K 個の和や中央値を O(log N) で答える。小さい方の K 個と残りを 2 つの multiset（ヒープ）に分けて持ち、境界の 1 個を移して分け方を保つ。"
    signs:
      - {type: phrase, text: "1 点を更新するたびに、大きい方から K 個の和を答える"}
      - {type: phrase, text: "幅 M の窓をずらしながら、小さい方から K 個の和を答える"}
      - {type: phrase, text: "数を追加しながら中央値（|x − a_i| の和を最小にする x）を答える"}
      - {type: constraint, text: "Q ≤ 2×10^5 で、更新のたびに上位 K 個の和や中央値を答える"}
    acl: []
    verify: []
    frequency: B
    frequency_evidence: "recent 1（abc458_d）・前提として 1 ページに届く（直接 1）・古い ABC 3 問"
    sections:
      - {title: "2 つに分けて持つ（L＝小さい K 個、R＝残り。L の和を持つ）", anchor: two-sets}
      - {title: "保つ性質（L の個数が K・L の最大 ≤ R の最小）と、境界の 1 個を移して回復する手順", anchor: invariants}
      - {title: "削除・更新（どちらにあるかを見て消してから回復する）", anchor: erase-update}
      - {title: "中央値を保つ（個数の差を 1 以内に。削除がなければヒープ 2 本）と Σ|x − a_i| の更新", anchor: median}
      - {title: "値を添字にした BIT・セグメント木で書く方法（→ 値を添字にする BIT・セグメント木）", anchor: by-index}
      - {title: "落とし穴（同じ値の削除先・multiset の erase・和の更新漏れ）", anchor: pitfalls}
      - {title: "|x − a| + b を足していく関数の最小値（中央値の更新の応用。slope trick の入口）", anchor: absolute-sum-function, level: 黄}
    merged_keys: [top-k-sum]
    visual: {kind: static, priority: 2, text: "数直線上の要素を L（小さい K 個）と R に色分けし、追加・削除で境界の 1 個が移る様子"}
    problems:
      - {id: abc306_e, role: example, representative: true, summary: "数列の 1 点更新のたびに、大きい方から K 個の和を答える。", approach: "上位 K 個と残りを 2 つの multiset で持ち、境界の 1 個を入れ替えて和を差分で更新する"}
      - {id: abc458_d, role: practice, summary: "（執筆時に確かめる）", approach: "小さい半分と大きい半分を 2 つのヒープで持ち、中央値を答える（research/00 §2.3.8 の分類）"}
      - {id: abc281_e, role: practice, summary: "長さ M の各窓で、小さい方から K 個の和を答える。", approach: "窓をずらしながら下位 K 個と残りの 2 つの multiset を調整する（例題は値を添字にする方法）"}
      - {id: arc074_b, role: practice, summary: "長さ 3N の数列から N 個を除き、残りの前半 N 個の和 − 後半 N 個の和を最大にする。", approach: "境界ごとに、前側の上位 N 個の和と後側の下位 N 個の和をヒープで前計算する"}
      - {id: abc127_f, role: challenge, summary: "関数に |x − a| + b を足す更新と、関数の最小値と最小点の質問を処理する。", approach: "中央値を左右 2 つのヒープで保つ（左の最大が中央値）"}
    sources: ["05-ds §4.A（top-k-multiset）", "05-ds §5（top-k-multiset）", "01-basics §4.D（median-absolute の中央値の更新）", "00-curriculum §4.2（上位 K 個の和の管理）", "00-curriculum §5.1"]

  - id: interval-set
    chapter: 標準コンテナの応用
