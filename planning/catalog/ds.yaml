  - id: lazy-segment-tree
    chapter: 区間クエリ
    title: 遅延セグメント木（区間作用・区間取得）
    aliases: [遅延セグ木, 遅延評価セグメント木, lazy segtree, 遅延伝搬, 作用付きモノイド, 双対セグ木, Dual Segment Tree]
