      - {id: abc261_f, role: practice, summary: "色と数の書かれた球の列を、色の違う球の交換にだけコストがかかる隣接交換でソートする最小コストを求める。", approach: "全体の転倒数から色ごとの転倒数を引く"}
      - {id: arc075_c, role: practice, summary: "平均が K 以上の連続部分列の個数を求める。", approach: "A_i − K の累積和で S_l ≤ S_r の組を BIT で数える"}
      - {id: abc479_f, role: challenge, summary: "（執筆時に確かめる）", approach: "操作の回数を隣接 swap の回数に言い換え、転倒数で求める（research/00 §2.3.8 の分類）"}
      - {id: abc380_g, role: challenge, summary: "長さ K の区間を一様に選んでシャッフルした後の転倒数の期待値を求める。", approach: "窓の内外の転倒数を BIT で差分更新し、窓の中はシャッフル後の期待値に置き換える"}
