      - {id: abc281_e, role: example, representative: true, summary: "長さ M の各窓で、小さい方から K 個の和を答える。", approach: "値を座圧した（個数, 和）のセグ木・BIT を窓に合わせて更新し、K 個目の境界を二分探索で探す（2 つの multiset でもよい）"}
      - {id: abl_d, role: practice, summary: "隣り合う要素の差が K 以下であるような部分列の最大の長さを求める。", approach: "値を添字にした dp を区間 max のセグ木で更新する（abc339_e と同じ型）"}
      - {id: abc276_f, role: practice, summary: "先頭 K 枚から 2 枚を復元抽出したときの最大値の期待値を、各 K について求める。", approach: "値で座圧した BIT で「A_K 以下の個数」と「A_K より大きい和」を持つ"}
