    related: [connected-components, union-find-connectivity, minimum-spanning-tree, union-find-applications, weighted-union-find, small-to-large, acl-other-components]
    summary: "要素を互いに素なグループに分けて持ち、2 つのグループの併合と「同じグループか」の判定を、union by size と経路圧縮でならし O(α(N))（実用上は定数）で行う。グループの大きさや個数も数えられる。"
    signs:
      - {type: phrase, text: "辺を追加していきながら、2 頂点が同じグループか・グループの大きさを答える"}
      - {type: phrase, text: "グループを合併する操作と、グループについての質問が交互に来る"}
      - {type: phrase, text: "連結成分の個数・最大の連結成分の大きさ"}
      - {type: constraint, text: "N, Q ≤ 2×10^5 で辺の追加と質問が混ざる"}
    acl: [dsu]
    frequency: A
    sections:
      - "何ができるか（併合と判定。分割・削除はできない）"
      - "保つ性質（各グループは根付き木で、根が代表元。parent は根なら −(サイズ)）"
      - "各操作の手順（find は根までたどって経路圧縮、merge は根どうしを小さい方から大きい方へつなぐ）"
      - "なぜ速いか（union by size だけで深さ log N、経路圧縮と合わせてならし O(α(N))）"
      - "境界（同じグループどうしの併合・自己ループと多重辺・成分数は併合に成功した回数を引く・サイズの積のあふれ）"
