    problems:
      - {id: abc435_e, role: example, summary: "白いマスの列（長さは 10^9 まで）で、区間を黒く塗るたびに白いマスの数を答える。", approach: "白い区間を set で持ち、重なる区間を消して分割する"}
      - {id: abc380_e, role: example, representative: true, summary: "1 列のマスで、同じ色でつながった区間の塗り替えと、色ごとのマスの数の質問を処理する。", approach: "同色の区間の左端を set で持つ（Union-Find・遅延セグ木でもよい）"}
      - {id: abc330_e, role: practice, summary: "1 点を書き換えるたびに数列の mex を答える。", approach: "まだ出ていない値を区間の集合として持ち、最小を mex にする"}
      - {id: abc430_g, role: practice, summary: "区間の各集合への値の追加・削除と、区間の中で要素数が最大の集合の数の質問を処理する。", approach: "値ごとに含まれる区間を set で持ち、遅延セグ木（区間加算・最大とその個数）と組む"}
      - {id: abc255_h, role: challenge, summary: "毎日実がなる木々の区間を収穫する質問ごとに、収穫量を答える。", approach: "最後に収穫した日が同じ区間を map で持ち、ならしで分割・統合する"}
      - {id: abc256_h, role: challenge, summary: "区間の各要素を x で割る・区間代入・区間和のクエリを処理する。", approach: "同じ値の連続区間を map で持ち、割り算で値が速く減ることでならす"}
    sources: ["05-ds §4.A（interval-set）", "05-ds §5（interval-set）", "05-ds §6.2"]

