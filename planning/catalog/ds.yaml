  - id: fenwick-tree
    chapter: 区間クエリ
    title: BIT（Fenwick Tree）
    aliases: [BIT, Binary Indexed Tree, フェニック木, Fenwick Tree, fenwick_tree]
    type: technique
    level: 水
    level_evidence: "道具としては緑〜水（abc185_f 1053・abc340_e 1157）。値で座標圧縮して数える型が水で頻出（abc351_f 1253・abc221_e 1515・abc231_f 1580）、平面走査と組むと青"
    kind: [データ構造, 区間クエリ]
    prerequisites: [prefix-sum, bit-operations]
    related: [segment-tree, inversion-number, kth-element, coordinate-compression, sweep-line-2d, offline-queries, imos]
    summary: "一点への加算と接頭辞の和（したがって区間の和）を、どちらも O(log N) で行う。区間の和は 2 つの接頭辞の差で求めるので演算に逆元が要り（和・XOR は可、min・max は不可）、値を添字にして個数を数える使い方が多い。"
    signs:
      - {type: phrase, text: "一点の値の更新と区間の和の質問が交互に来る"}
      - {type: phrase, text: "i より前にある x 以下の要素の個数"}
      - {type: phrase, text: "座標圧縮した値ごとの個数・和を数えながら走査する"}
      - {type: constraint, text: "N, Q ≤ 2×10^5 で更新があり、累積和を毎回作り直すと間に合わない"}
    acl: [fenwick_tree]
    frequency: A
    sections:
      - "何ができるか（一点加算・接頭辞和。区間和は 2 つの接頭辞の差なので逆元が要る）"
      - "保つ性質（1-indexed で、t[i] は区間 (i − lowbit(i), i] の和。lowbit(i) = i & −i）"
      - "各操作の手順（add は i += lowbit(i) で上へ、sum は i −= lowbit(i) で下へ。線形時間の構築）"
      - "境界（内部は 1-indexed・外部は 0-indexed の半開区間、i = 0 の add は止まらない、ACL は符号なし整数で持つ）"
      - "値を添字にして数える（座標圧縮と組む）"
      - "変種：区間加算・一点取得（差分の BIT）、区間加算・区間和（BIT 2 本）、2 次元 BIT、接頭辞の max（増える更新だけ）"
      - "BIT 上の二分探索（→ k 番目の値を求めるデータ構造）"
      - "使い分け（更新がなければ累積和、min・max や非可換な演算ならセグ木）"
    merged_keys: []
    visual: "動く図：添字を 2 進数で並べ、各箱が覆う区間を横棒で描き、add と sum で通る箱が順に光るステップ送り"
    problems:
      - {id: practice2_b, role: example, summary: "一点加算と区間和のクエリをそのまま処理する（ACL の fenwick_tree）"}
      - {id: abc185_f, role: example, summary: "一点を XOR で更新し、区間の XOR を答える（XOR は自分自身が逆元なので BIT で区間が取れる）"}
      - {id: abc351_f, role: example, summary: "すべての i < j について max(A_j − A_i, 0) の総和。座標圧縮して、自分以下の個数と和を BIT 2 本で数える"}
      - {id: abc340_e, role: practice, summary: "円環に並ぶ箱の玉を取り出して順に配る操作の繰り返し。区間加算・一点取得（差分の BIT）"}
      - {id: abc221_e, role: practice, summary: "先頭 ≤ 末尾となる長さ 2 以上の部分列の個数。座標圧縮した BIT に、個数でなく重みを載せて足す"}
      - {id: abc276_f, role: practice, summary: "先頭 K 枚から 2 枚を復元抽出したときの最大値の期待値を各 K で求める。値で座圧した BIT で個数と和を持つ"}
      - {id: abc231_f, role: practice, summary: "A_i ≥ A_j かつ B_i ≤ B_j となる組 (i, j) の数。A でソートし、B を座圧した BIT で数える（同じ組の扱いに注意）"}
      - {id: arc068_c, role: challenge, summary: "各 d について、d 刻みで止まる列車が通る区間の数。区間を長さの順に入れ、区間加算・一点取得の BIT で d の倍数だけ調べる"}
    sources: ["05-ds §4.C（fenwick-tree）", "05-ds §5（fenwick-tree）", "05-ds §4.F", "05-ds 付録 A"]
    verify: [point_add_range_sum, static_range_sum]

