      - "双対セグ木（区間作用・一点取得。作用が可換なら push は要らない）"
      - "使い分け（一点取得だけなら双対セグ木か差分の BIT、区間加算・区間和だけなら BIT 2 本、条件を満たさない作用は Segment Tree Beats・区間を set で管理）"
    merged_keys: [dual-segment-tree]
    visual: "動く図：各ノードに「値／保留タグ」の 2 段を書き、区間作用でタグが付き、取得のときにタグが子へ降りるステップ送り"
