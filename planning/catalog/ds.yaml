    kind: [データ構造, 区間クエリ]
    prerequisites: [segment-tree, segment-tree-monoids]
    related: [lazy-segtree-patterns, global-offset, fenwick-tree, segment-tree-beats, sqrt-decomposition, interval-set, acl-segtree-template]
    summary: "区間の全要素に写像を作用させる操作（加算・代入・アフィン変換・反転など）と区間の総積の取得を、どちらも O(log N) で行う。作用を保留のタグとしてノードに置き、必要になったときに子へ配る。"
    signs:
