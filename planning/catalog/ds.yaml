      - {id: abc264_d, role: practice, summary: "隣接交換で文字列を atcoder に並べ替える最小回数を求める。", approach: "目標位置への写像に直して転倒数を数える"}
      - {id: abc378_e, role: practice, summary: "すべての区間について区間和 mod M を求め、その総和を答える。", approach: "累積和 mod M の列で前の方が大きい組の数を BIT で数え、M 倍して補正する"}
