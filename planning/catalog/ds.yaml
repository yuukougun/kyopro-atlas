    visual: "静的な図：クエリを右端の順に並べ替えて処理し、元の順に戻して出力する流れ。右端を伸ばしながら各値の最後の出現位置だけに 1 を立てる BIT の変化"
    problems:
      - {id: abc174_f, role: example, summary: "区間内の値の種類数を多数答える。クエリを右端の順に並べ、各値の最後の出現位置だけに 1 を立てた BIT の区間和"}
