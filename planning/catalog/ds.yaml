  - id: monotonic-stack
    chapter: スタックとキュー
    title: 単調スタックとスライド最小値
    aliases: [monotonic stack, 単調 stack, ヒストグラム内最大長方形, sliding window minimum, 単調 deque, 単調キュー, SWAG, Sliding Window Aggregation, Cartesian Tree, デカルト木]
    type: technique
    level: 水
    level_evidence: "「見える数」は緑（abc372_d 901）、直近の大小を使う応用が水〜青（abc359_e 1275・agc005_b 1828）。スライド最小値は ABC では multiset でも書ける（abc352_d 714）が、DP の遷移の高速化で青に出る。Cartesian tree の節は黄（arc189_d 2006・abc311_g 2265）、SWAG は発展"
    kind: [データ構造, 尺取り・スライド窓]
    prerequisites: [stack-techniques]
    related: [two-pointers, segment-tree-binary-search, sparse-table, contribution, dp-segment-tree, divide-and-conquer]
    summary: "各要素について「左（右）で初めて自分より大きい（小さい）要素」を、添字を単調に積んだスタックで全体 O(N) で求める。同じ考え方で幅 K の窓の最小値を deque で O(N) で求め、Cartesian tree も作れる。"
    signs:
      - {type: phrase, text: "左（右）で初めて自分より大きい（小さい）要素の位置"}
      - {type: phrase, text: "各ビルから見えるビルの数・すべての区間の最小値の和"}
      - {type: phrase, text: "長さ K のすべての区間の最小値（最大値）"}
      - {type: shape, text: "dp[i] = min(dp[i−K..i−1]) + c のように、直前 K 個の最小値で決まる遷移"}
      - {type: constraint, text: "N ≤ 2×10^5 で、各要素から左右を見ていくと O(N^2) になる"}
    acl: []
    verify: [queue_operate_all_composite, deque_operate_all_composite]
    frequency: B
    frequency_evidence: "recent 1（abc480_g）・前提として届くページなし・古い ABC 5 問"
    sections:
      - {title: "単調スタックの手順と保つ性質（中の値は単調。各添字は 1 回積まれ 1 回降ろされるので O(N)）", anchor: procedure}
      - {title: "ヒストグラムの最大長方形", anchor: histogram}
      - {title: "i が最大（最小）になる区間の数 (i − L)(R − i) と寄与の数え上げ（同じ値は片側 ≤・片側 <）", anchor: contribution}
      - {title: "見えるビルの数・水位のシミュレーション", anchor: visible}
      - {title: "スライド最小値（単調 deque。末尾から支配される要素を捨て、先頭が窓から出たら捨てる）", anchor: sliding-window-minimum}
      - {title: "DP の遷移の高速化に使う（→ DP の章のセグメント木・スライド最小値による高速化）", anchor: dp-transition}
      - {title: "使い分け（区間の最大値を多数聞くならセグメント木・Sparse Table、窓の最小値は multiset でも書ける）", anchor: choosing}
      - {title: "Cartesian tree（最大値で区間を左右に割る再帰を O(N) で作る）", anchor: cartesian-tree, level: 黄}
      - {title: "SWAG：スタック 2 本で作る総積つきキュー（gcd・行列・一次関数の合成の窓）", anchor: swag, level: 発展}
    merged_keys: [sliding-window-minimum, swag, cartesian-tree]
    visual: {kind: dynamic, priority: 3, text: "棒グラフを左から見ていき、スタックの中身（単調な列）が積まれ・崩れるステップ送り。窓をずらしたときの deque の中身と SWAG の 2 つのスタックは静的な図"}
    problems:
      - {id: abc372_d, role: example, summary: "各ビルについて、右側にある「見える」ビルの数を答える。", approach: "右から見て低いものを降ろしてから積み、スタックの大きさが答え"}
      - {id: abc359_e, role: example, representative: true, summary: "板で仕切られた水槽に左端から水を入れ続けるとき、各区画に初めて水が入る時刻を答える。", approach: "左で最も近い高い板を単調スタックで求め、その位置からの量を累積する"}
      - {id: abc352_d, role: practice, summary: "順列で、連続する値 K 個の位置の最大 − 最小の最小値を求める。", approach: "値の順に位置を並べ、長さ K の窓の最大・最小を deque で求める"}
      - {id: abc435_f, role: practice, summary: "最大値の位置で区間を左右に分けて進む過程の、移動距離の合計の最大値を求める。", approach: "最大値で割る再帰（Cartesian tree）"}
      - {id: donuts_2015_3, role: practice, summary: "行列に並ぶ各人から前方に見える人の数を答える。", approach: "単調スタックの大きさを出力する"}
      - {id: agc005_b, role: practice, summary: "すべての区間の最小値の総和を求める。", approach: "各要素が最小になる範囲を左右で求め、寄与を足す"}
      - {id: tessoku_book_bh, role: practice, summary: "各日について、それより前で株価が高かった最後の日を答える。", approach: "(日, 株価) の単調スタック"}
      - {id: arc189_d, role: challenge, summary: "各スライムから始めて、隣の小さいスライムを吸収し続けたときの最終的な大きさを答える。", approach: "最大値で割る分割統治を Cartesian tree で回す"}
      - {id: abc311_g, role: challenge, summary: "グリッドの長方形領域のうち、(和 × 最小値) の最大値を求める。", approach: "最小値の下限ごとに行のヒストグラムと単調スタックで極大な長方形を調べる"}
    sources: ["05-ds §4.A（monotonic-stack・sliding-window-minimum・swag・cartesian-tree）", "05-ds §5（同）", "05-ds 付録 A", "02-dp §4.J（dp-sliding-window）"]

