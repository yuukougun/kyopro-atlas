    level_evidence: "基本形は水〜青（abc235_e 1304・abc174_f 1495・abc253_f 1756・abc128_e 1840）。abc319 以降の先読みはほかの手法と組む形で青以上（abc477_f 1629・abc453_g 1735・abc356_f 2152）。基本形の最近の根拠がないので、古い根拠で水とした（D2）"
