      - {id: abc253_f, role: example, summary: "行の上書き・列の範囲への加算・1 マスの値の取得のクエリを処理する。", approach: "直前の上書きの時刻を先読みし、区間加算の BIT で「今の値 − その時刻の値」を答える"}
      - {id: abc235_e, role: practice, summary: "グラフに辺を 1 本加えたとき、その辺が最小全域木に使われるかを多数の質問で答える。", approach: "質問の辺を元の辺と混ぜて重み順に処理する"}
      - {id: abc040_d, role: practice, summary: "年 w より後に作られた道路だけで行ける都市の数を、各クエリについて答える。", approach: "道路とクエリを年の降順に並べて併合する"}
      - {id: abc128_e, role: practice, summary: "時間帯ごとに通行止めになる地点があり、各人が最初に止まる地点を答える。", approach: "工事をイベントとして時刻順に処理し、有効な地点を set で持つ"}
