      - {id: abc240_d, role: practice, summary: "同じ数 k のボールが k 個続くと消える筒に順にボールを入れ、毎回のボールの数を答える。", approach: "(値, 連続数) を積む"}
      - {id: abc307_d, role: practice, summary: "中に括弧を含まない (…) を消せるだけ消した後の文字列を求める。", approach: "'(' の位置を積み、')' で対応が取れたら区間を消す"}
      - {id: arc108_b, role: practice, summary: "文字列から fox を消せるだけ消した後の長さを求める。", approach: "積んで末尾が fox なら取り除く"}
      - {id: abc243_d, role: practice, summary: "完全二分木の上下の移動を繰り返した後の頂点の番号を求める（途中の番号は巨大になりうる）。", approach: "子へ行って親へ戻る移動を打ち消して簡約する"}
