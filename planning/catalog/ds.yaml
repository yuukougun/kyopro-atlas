# データ構造（ds）の目次。規則は planning/design.md §3〜§5 と planning/catalog/README.md
# 章立ては research/05 §7.1 の6つ（標準コンテナの応用・スタックとキュー・Union-Find・区間クエリ・
# クエリ処理の工夫・発展的なデータ構造）。形式に節を表す項目がないので、章の区切りはコメントで示す
# verify は Library Checker の問題名（設計書 §3.3 の front matter の項目。research/05 §7.5）
field: ds
pages:

  # ===== 1. 標準コンテナの応用 =====

  - id: stl-containers
    chapter: 標準コンテナの応用
    title: STL コンテナの使い分け
    aliases: [STL, 標準ライブラリのコンテナ, コンテナの計算量, vector, deque, unordered_map]
    type: technique
    level: 基礎
    level_evidence: "容器の使い分けは灰〜緑で必須（abc253_c 518・abc166_e 1062）。上位の手法の部品なので基礎の短いページにする"
    kind: [データ構造, 実装・C++]
    prerequisites: []
    related: [ordered-set, priority-queue, stack-techniques, prefix-sum-counting, cpp-container-idioms, cpp-iterators]
    summary: "どの操作を速くしたいかで vector・deque・set・map・priority_queue・unordered_map を選ぶ。各コンテナの得意・不得意と、multiset の erase や map の [] などの落とし穴をまとめる。"
    signs:
      - {type: phrase, text: "追加・削除・検索・最小値の取り出しが混ざり、どの操作を速くするかで道具が決まる"}
      - {type: phrase, text: "式を i 側と j 側に分け、片側の値を数えながら走査して組の数を数える"}
      - {type: constraint, text: "N, Q ≤ 2×10^5 で、1 回の操作を O(log N) 以下にしたい"}
    acl: []
    frequency: A
    sections:
      - "操作 × コンテナの計算量の早見表"
      - "選び方（何を速くしたいか）"
      - "map で数えながら走査する型（→ 累積和と連想配列で区間を数える）"
      - "落とし穴（multiset の erase(x) は全部消す・set に std::lower_bound は O(N)・map の [] は要素を作る・空の size() − 1・イテレータの無効化・unordered_map のハック）"
      - "C++ の書き方は C++ 章へ"
    merged_keys: []
    visual: "静的な表：操作 × コンテナの計算量"
    problems:
      - {id: abc253_c, role: example, summary: "多重集合への追加・個数を指定した削除と、最大値 − 最小値の出力を繰り返す"}
      - {id: abc166_e, role: practice, summary: "j − i = A_i + A_j を満たす組の数。式を i 側と j 側に分け、片側の値を map で数える"}
      - {id: tessoku_book_bb, role: practice, summary: "名前ごとの点数の登録と参照のクエリを map で処理する"}
      - {id: tessoku_book_bc, role: practice, summary: "整数の追加・削除と「x 以上で最小の値」のクエリを set で処理する"}
    sources: ["05-ds §4.A（stl-containers）", "05-ds §5（stl-containers）", "05-ds §6.4"]
    verify: [associative_array]

  - id: ordered-set
    chapter: 標準コンテナの応用
    title: set・multiset・map の応用（前後の要素・mex・パレート境界）
    aliases: [set, multiset, map, 順序付き集合, lower_bound, 前後の要素, 番兵]
    type: technique
    level: 基礎
    level_evidence: "lower_bound で前後を取る基本は緑（abc217_d 802・abc370_d 1088・abc241_d 1177）。応用は水〜黄（abc245_e 1571・abc140_e 1873・abc308_g 2008）で、節にレベルの印を付ける"
    kind: [データ構造]
    prerequisites: [stl-containers]
    related: [interval-set, kth-element, priority-queue, top-k-multiset, binary-trie, mex, hashing-for-sets, binary-search, cpp-iterators]
    summary: "set・multiset・map の lower_bound で「x 以上の最小」「x 未満の最大」を O(log N) で求め、要素の追加・削除と組み合わせる。番兵、mex の管理、行・列ごとの set、パレート境界などの型を扱う。"
    signs:
      - {type: phrase, text: "x 以上で最小の値・最も近い値を、追加・削除しながら何度も答える"}
      - {type: phrase, text: "まだ使われていない最小の値（mex）を更新のたびに答える"}
      - {type: phrase, text: "同じ行・同じ列で次にある壁や家を見つけて壊す"}
      - {type: constraint, text: "値が 10^9 まであり、配列の添字にできない"}
    acl: []
    frequency: A
    sections:
      - "前後の要素（lower_bound とその 1 つ前。番兵で端の場合分けを消す）"
      - "k 番目付近（イテレータを k 歩動かす。k が小さいときだけ）"
      - "まだ出ていない値の set で mex を管理する（→ 題材別の mex）"
      - "行ごと・列ごとの set（グリッドで次の壁を探し、両方から消す）（水）"
      - "パレート境界を map で持つ（支配される点を消す。ならし O(log N)）（水）"
      - "ソート順で隣り合う組の集合（2 番目に大きい値の寄与・最小の XOR）（青〜黄）"
      - "落とし穴（multiset の erase・end と begin の前の参照・イテレータの無効化）"
    merged_keys: []
    visual: "静的な図：数直線上の set の要素と、lower_bound が指す位置・その 1 つ前（prev）を矢印で示す"
    problems:
      - {id: abc217_d, role: example, summary: "木材の切断と、点 x を含む木片の長さの質問。切れ目を set に入れ（番兵 0 と L）、前後の切れ目を探す"}
      - {id: abc330_e, role: practice, summary: "1 点を書き換えるたびに数列の mex を答える。個数 0 の値を set で持ち、最小を取る"}
      - {id: abc370_d, role: practice, summary: "爆弾で上下左右の最も近い壁を壊すシミュレーション。行ごと・列ごとの set から探して両方から消す"}
      - {id: abc385_d, role: practice, summary: "軸に平行に動いて通過した家の数と最終位置。x ごと・y ごとの set を走査し、見つけた家を両方から消す"}
      - {id: abc241_d, role: practice, summary: "数の追加と「x 以下で大きい方から k 番目」「x 以上で小さい方から k 番目」の質問（k ≤ 5）"}
      - {id: abc245_e, role: practice, summary: "チョコをすべて縦横とも収まる別々の箱に入れられるか。大きい順に処理し、使える箱の幅を multiset で持つ"}
      - {id: abc140_e, role: challenge, summary: "全区間の 2 番目に大きい値の総和。大きい順に位置を set に入れ、左右それぞれ 2 つ先の位置から寄与を数える"}
      - {id: abc308_g, role: challenge, summary: "整数の追加・削除のたびに、2 要素の XOR の最小値を答える。ソート順で隣り合う組の XOR を multiset で持つ"}
    sources: ["05-ds §4.A（ordered-set）", "05-ds §5（ordered-set）", "05-ds 付録 A", "00-curriculum §4.2（mex）"]
    verify: [predecessor_problem, double_ended_priority_queue]

  - id: priority-queue
    chapter: 標準コンテナの応用
    title: 優先度付きキュー（ヒープ）
    aliases: [priority_queue, ヒープ, heap, 二分ヒープ, 削除できるヒープ, 遅延削除, erasable heap]
    type: technique
    level: 水
    level_evidence: "容器としては茶（abc234_d 503）。上位 K 個の列挙・遅延削除が水で必須（abc123_d 1489・abc170_e 1502）、青まで続く（abc116_d 1712・abc214_e 1835）。設計書 §4.3 で水と決定（容器としての使い方は基礎の節）"
    kind: [データ構造, 貪欲]
    prerequisites: [stl-containers]
    related: [greedy-priority-queue, k-best-enumeration, top-k-multiset, ordered-set, global-offset, dijkstra, advanced-ds-catalog]
    summary: "最大（最小）の要素の取り出しと追加を O(log N) で行う二分ヒープ。ソートと組む貪欲・上位 K 個の列挙・接頭辞の K 番目に使い、任意の要素の削除は「削除予定のヒープ」で遅れて行う。"
    signs:
      - {type: phrase, text: "毎回いちばん大きい（小さい）ものを取り出し、新しい候補を入れる"}
      - {type: phrase, text: "接頭辞ごとに K 番目に大きい値を答える"}
      - {type: phrase, text: "グループ間の移動のたびに、各グループの最大値のうちの最小値を答える"}
      - {type: constraint, text: "追加と取り出しが合わせて 2×10^5 回程度"}
    acl: []
    frequency: A
    sections:
      - "容器としての使い方（最大・最小の向き・greater<>・pair の比較順）（基礎）"
      - "二分ヒープの仕組み（保つ性質「親 ≤ 子」・push で上げる・pop で下げる・heapify は O(N)）"
      - "使い方の型（ソートと組む貪欲 → 優先度付きキューを使う貪欲、上位 K 個の列挙 → K 番目までを取り出す、大きさ K のヒープで接頭辞の K 番目）"
      - "全体への加算と組む（入れるときに引き、出すときに足す）"
      - "削除できるヒープ（遅延削除：削除予定のヒープの top と一致したら両方から捨てる）"
      - "priority_queue と multiset の使い分け（任意の削除・両端・前後の要素が要るなら multiset）"
      - "落とし穴（向きの取り違え・古いエントリを捨て忘れる・空のときの top）"
    merged_keys: [lazy-deletion]
    visual: "静的な図：二分ヒープの配列と木の対応、push で上げる・pop で下げる経路。本体と削除予定のヒープを並べた図"
    problems:
      - {id: abc234_d, role: example, summary: "接頭辞ごとに K 番目に大きい値を答える。大きさ K の最小ヒープを保ち、top が答え"}
      - {id: abc123_d, role: example, summary: "3 つの数列から 1 つずつ選んだ和の上位 K 個。添字の組をヒープで広げ、重複を set で除く"}
      - {id: abc170_e, role: example, summary: "転園のたびに、各園の最強レートのうちの最小値を答える。ヒープなら遅延削除（multiset でもよい）"}
      - {id: abc217_e, role: practice, summary: "末尾追加・先頭取り出し・全体ソートのクエリ。ソート済みの部分を最小ヒープ、後から来た部分を queue で持つ"}
      - {id: abc116_d, role: practice, summary: "種類数のボーナスつきで K 個選ぶ満足度の最大化。入れ替えの候補をヒープで持ち、種類数を変えながら差分を更新する"}
      - {id: abc214_e, role: practice, summary: "各ボールを区間 [L, R] の別々の箱に入れられるか。L の順に処理し、R の小さいものから置く"}
    sources: ["05-ds §4.A（priority-queue・lazy-deletion）", "05-ds §5（priority-queue・lazy-deletion）", "05-ds 付録 A", "01-basics §4.H（greedy-priority-queue）"]

  - id: top-k-multiset
    chapter: 標準コンテナの応用
    title: 上位 K 個の和と中央値の管理（2 つの multiset）
    aliases: [2つのヒープ, 2つのmultiset, 中央値の管理, 上位K個の和, 下位K個の和, Priority Sum Structure]
    type: technique
    level: 水
    level_evidence: "abc306_e（1268）・abc281_e（1334）で必須。易しい形は abc458_d（450、2 つのヒープで中央値）、中央値の発展は abc127_f（2003）"
    kind: [データ構造]
    prerequisites: [ordered-set, priority-queue]
    related: [segtree-on-values, kth-element, median-absolute, slope-trick]
    summary: "多重集合を「小さい方の K 個」と「残り」の 2 つの multiset（ヒープ）に分けて持ち、和を差分で更新する。追加・削除・更新のたびに上位（下位）K 個の和や中央値を O(log N) で答えられる。"
    signs:
      - {type: phrase, text: "1 点を更新するたびに、大きい方から K 個の和を答える"}
      - {type: phrase, text: "幅 M の窓をずらしながら、小さい方から K 個の和を答える"}
      - {type: phrase, text: "数を追加しながら中央値（|x − a_i| の和を最小にする x）を答える"}
    acl: []
    frequency: B
    sections:
      - "2 つに分けて持つ（L＝小さい K 個、R＝残り。L の和を持つ）"
      - "保つ性質（L の個数が K・L の最大 ≤ R の最小）と、境界の 1 個を移して回復する手順"
      - "削除・更新（どちらにあるかを見て消してから回復する）"
      - "中央値（個数の差を 1 以内に保つ。削除がなければヒープ 2 本）と |x − a_i| の和"
      - "値の BIT・セグ木で書く別解（→ 値を添字にする BIT・セグ木）"
      - "slope trick への入口（黄・発展 → DP の章）"
      - "落とし穴（同じ値の削除先・multiset の erase・和の更新漏れ）"
    merged_keys: [top-k-sum]
    visual: "静的な図：数直線上の要素を L（小さい K 個）と R に色分けし、追加・削除で境界の 1 個が移る様子"
    problems:
      - {id: abc306_e, role: example, summary: "1 点更新のたびに大きい方から K 個の和を答える。上位 K 個と残りを 2 つの multiset で持ち、境界を入れ替える"}
      - {id: abc281_e, role: example, summary: "長さ M の各窓で、小さい方から K 個の和を答える"}
      - {id: abc458_d, role: practice, summary: "数の追加と中央値の質問。小さい半分と大きい半分を 2 つのヒープで持つ"}
      - {id: arc074_b, role: practice, summary: "3N 個から N 個を除き、前半の和 − 後半の和を最大化する。境界ごとに前側の上位 N 個の和と後側の下位 N 個の和をヒープで求める"}
      - {id: abc127_f, role: challenge, summary: "|x − a| + b を足していく関数の最小値と最小点を答える。中央値を左右 2 つのヒープで持つ"}
    sources: ["05-ds §4.A（top-k-multiset）", "05-ds §5（top-k-multiset）", "00-curriculum §4.2（上位 K 個の和の管理）", "00-curriculum §5.1"]

  - id: interval-set
    chapter: 標準コンテナの応用
    title: 区間を set で管理する
    aliases: [区間をsetで管理, IntervalSet, RangeSet, ODT, 珂朵莉树, 互いに素な区間の集合]
    type: technique
    level: 水
    level_evidence: "単純な塗り・被覆は緑〜水（abc435_e 982・abc330_e 1004・abc380_e 1230）。値つきの区間の分割・統合は黄〜発展（abc430_g 2371・abc255_h 2430・abc256_h 2531）"
    kind: [データ構造]
    prerequisites: [ordered-set]
    related: [union-find-applications, lazy-segment-tree, segment-tree-beats, amortized-analysis, coordinate-compression]
    summary: "互いに重ならない区間を左端をキーにした set・map で持ち、点を含む区間の検索・区間の追加と併合・区間への代入（分割してから中を消す）を、ならし O(log N) で行う。座標が 10^9 でも使える。"
    signs:
      - {type: phrase, text: "区間を塗るたびに、塗られたマスの数や色ごとのマスの数を答える"}
      - {type: phrase, text: "同じ値が連続する塊ごとに考える"}
      - {type: phrase, text: "点 x が覆われているか・x を含む区間はどこか"}
      - {type: constraint, text: "座標が 10^9 まであり、配列や座標圧縮が使いにくい"}
    acl: []
    frequency: B
    sections:
      - "持ち方（左端をキーにした map・両端の番兵の区間）"
      - "x を含む区間の検索（upper_bound の 1 つ前）"
      - "split(x)（区間の分割）を先に書き、代入・削除はその組み合わせで書く"
      - "なぜならしで速いか（新しくできる区間は O(1) 個、消える区間は一度だけ）と、走査だけの操作が混ざると崩れる理由"
      - "応用（mex・塗り分け・和集合の長さ・値ごとの合計の差分更新）"
      - "値つきの区間の分割・統合（黄）"
      - "使い分け（飛ばすだけなら次の空きへ飛ぶ Union-Find、座標が小さく区間和も要るなら遅延セグ木）"
    merged_keys: []
    visual: "静的な図：数直線上の区間の帯が、代入の前後で分割・併合される様子"
    problems:
      - {id: abc435_e, role: example, summary: "区間を黒く塗るたびに白いマスの数を答える（N は 10^9 まで）。白い区間を set で持ち、重なる区間を消す"}
      - {id: abc380_e, role: example, summary: "同じ色でつながった区間の塗り替えと、色ごとのマス数の質問。同色の区間の左端を set で持つ"}
      - {id: abc330_e, role: practice, summary: "1 点を書き換えるたびに数列の mex を答える。まだ出ていない値を区間の集合として持つ"}
      - {id: abc430_g, role: practice, summary: "区間の各集合への値の追加・削除と、区間で要素数が最大の集合の数。値ごとに含まれる区間を set で持つ"}
      - {id: abc255_h, role: challenge, summary: "毎日実がなる木々の区間の収穫量を答える。最後に収穫した日が同じ区間を map で持ち、分割・統合する"}
      - {id: abc256_h, role: challenge, summary: "区間を x で割る・区間代入・区間和のクエリ。同じ値の連続区間を map で持ち、割り算で値が速く減ることでならす"}
    sources: ["05-ds §4.A（interval-set）", "05-ds §5（interval-set）", "05-ds §6.2"]

  - id: global-offset
    chapter: 標準コンテナの応用
    title: 全体への操作を変数で持つ（オフセット・反転フラグ）
    aliases: [全体加算, オフセット, 反転フラグ, 全体に反映させる値を別に持つ, 回転量]
    type: technique
    level: 基礎
    level_evidence: "茶〜緑で頻出（abc278_d 559・abc158_d 610・abc379_d 745・abc212_d 775）"
    kind: [データ構造, クエリ処理の工夫]
    prerequisites: [stl-containers]
    related: [lazy-segment-tree, priority-queue, stack-techniques, amortized-analysis]
    summary: "「全要素に x を足す」「全体を反転する」「全体を回転する」を、要素を書き換えずにオフセット・反転フラグ・先頭位置の変数で表す。入れるときに引き、取り出すときに足すのが基本で、遅延セグ木の遅延評価の入口になる。"
    signs:
      - {type: phrase, text: "全要素に x を足す・全体に代入する操作がクエリに混ざる"}
      - {type: phrase, text: "列全体を反転してから先頭・末尾に追加する"}
      - {type: phrase, text: "配列を回転してから i 番目を参照する"}
      - {type: constraint, text: "Q ≤ 2×10^5 で、全体への操作を毎回 O(N) で行うと間に合わない"}
    acl: []
    frequency: B
    sections:
      - "オフセット（入れるときに引き、出すときに足す）"
      - "反転フラグ（追加する側を入れ替え、最後に向きを直す）"
      - "全体代入と個別の差分（代入のたびに差分の map を空にする。ならし）"
      - "回転は先頭位置の添字で表す"
      - "遅延セグ木の遅延評価とのつながり"
      - "落とし穴（反転中の先頭と末尾の取り違え・向きの直し忘れ・オフセットのあふれ）"
    merged_keys: []
    visual: "静的な図：実際の値＝格納値＋オフセット、を 2 段で並べる"
    problems:
