# C++（cpp）の目次。担当 H。第2版（2026-10-21。design-review §4.1 と §4.2 の H の行に従って直した）
# 規則は planning/catalog/README.md（第2版）、上位の規則は planning/design.md §3〜§5 と planning/design-review.md
# 主な材料：research/09（50項目）、research/00 §3.2 の cpp-extra-pitfalls（guide から moved で受け取った）
#
# 束ね方（第1版から変えていない）：research/09 §7.1 の案 B（11〜15ページ）を出発点に、長くなる「型と初期化」「範囲 for と構造化束縛」
#   「ranges と views」「落とし穴」を分け、入口の C++ の逆引きを含めて20ページにした。
# - research/09 の cpp-idioms（よく見る短い書き方）は単独のページにせず、各書き方を意味の近いページの節に分けた：
#     初期化式付き if・tie・exchange → cpp-structured-bindings、その場で呼ぶラムダ → cpp-lambda、chmax の (a = b, true) → cpp-macros-template-file、
#     " \n"[i == n - 1]・三項演算子・while (cin >> x) → cpp-io、x & -x → cpp-math-functions、c - 'a' → cpp-string-api、
#     max({a, b, c}) → cpp-algorithms、assert → cpp-undefined-behavior。書き方の一覧は cpp-reverse-index が持つので、key はそこに入れた
# - import std（research/09 では環境の節）は、#include と並べて読むものなのでマクロと雛形のページに置いた
# - 自作ライブラリの設計（self-library）は guide の library-design が持ち主。提出前の展開（library-bundling）は C++ の書き方なので
#   cpp-macros-template-file の節に残し、library-design と related で結ぶ
#
# 章（design-review D13）：research/09 §2.2 のサブ分野と §2.3 の前提の連なりから5章にした。同じ分野の前提はすべて前の章か同じ章の前にある
# - 入口の cpp-reverse-index は章を持たない（分野の先頭に章の外で置く。入口だけの1ページの章を作らないため。open_issues を参照）
# - 型と値：型とリテラル → オーバーフローと __int128（§2.3 の「型 → オーバーフロー → __int128」）、初期化、型に依存する数の関数
# - 参照・ラムダ・テンプレート：§2.2 の「構文」。参照（範囲 for）とラムダが後の章の土台になる（§2.3）。C++ の template と
#   雛形（テンプレート）の2つの意味を同じ章で引けるように、マクロと雛形もここに置いた
# - コンテナ・アルゴリズム・ACL：ライブラリを呼ぶ書き方。比較関数・アルゴリズム・ACL はラムダが前提
# - ranges と views：§2.3 の「従来の algorithm → ranges → views → C++23 の views」の後半
# - 入出力・環境・落とし穴：コードを動かすときの事故（入出力の速さと書式、AtCoder と手元の違い、未定義動作）。未定義動作は環境・
#   オーバーフロー・構造化束縛が前提なので最後に置いた
#
# 題名（D11）：第1版のかっこの補足を外し、補足は aliases・summary に回した。表示幅が全角15字を超える2ページだけ nav_title を置いた
# 節（D1）：書き方1つずつを1節にして anchor を付けた。cpp-reverse-index の表から「書き方 → id#anchor」で引き、ほかの分野も related で節を指せる
#   level を持つ節は acl-reading の segtree・lazy_segtree の節（水）だけ（ds の segment-tree・lazy-segment-tree の帯に合わせた。ほかはページと同じ）
# 統合した調査の key の行き先（ほかの分野の related を id#anchor に直すときに使う）：
#   cpp-reading-guide → cpp-reverse-index#how-to-read、cpp-compile-errors → cpp-reverse-index#compile-errors、cpp-idioms → cpp-reverse-index、
#   cpp-version-matrix → cpp-environment#version-matrix、cpp-stack-depth → cpp-environment#stack-depth、
#   cpp-numeric-limits-inf → cpp-types-literals#inf、cpp-floating-point → cpp-types-literals#floating-point、cpp-int128 → cpp-integer-overflow#int128、
#   cpp-ctad → cpp-initialization#ctad、cpp-references → cpp-range-for#references、cpp-optional-tuple → cpp-structured-bindings#pair-tuple、
#   cpp-init-statements → cpp-structured-bindings#if-init、cpp-recursive-lambda → cpp-lambda#recursive-lambda、
#   cpp-namespaces → cpp-macros-template-file#namespaces、cpp-import-std → cpp-macros-template-file#import-std、
#   library-bundling → cpp-macros-template-file#bundling、cpp-iterators → cpp-container-idioms#iterators、cpp-extra-pitfalls → cpp-container-idioms、
#   cpp-struct-operators → cpp-comparators#operator-less、cpp-algorithms-classic → cpp-algorithms、cpp-ranges-algorithms → cpp-algorithms#ranges、
#   cpp-ranges-to → cpp-views-cpp23#ranges-to、cpp-bit-functions → cpp-math-functions#bit-functions、cpp-bitset → cpp-math-functions#bitset、
#   cpp-random-chrono → cpp-math-functions#random、cpp-performance → cpp-io#tle-causes、acl-other-components → acl-reading#components、
#   acl-modint → acl-reading#modint、acl-segtree-template → acl-reading#segtree-args（遅延セグ木は #lazy-segtree-args）、
#   cpp-uninitialized-variables → cpp-undefined-behavior#uninitialized、cpp-dangling → cpp-undefined-behavior#dangling、
#   cpp-debug-build → cpp-undefined-behavior#debug-build
#
# 版の注記（節の title の末尾）：「（C++20）」「（C++23・GCC 14〜）」のように書く。
# - C++17 以降の機能と GCC の拡張にだけ付ける（C++14 以前からある書き方には付けない）
# - GCC の版は GCC 13 以降で差が出るもの（13・14・15・16）だけ書く。規格の版だけのものは GCC 12 以前から使える
# - AtCoder は GCC 15.2・-std=gnu++23。注記に「AtCoder では使えない」とないものはすべて使える
# - ページの cpp_std・gcc_min・atcoder は、そのページの中心の機能が1つに決まるときだけ値を入れる（版の混ざるページは cpp_std・gcc_min を null）。
#   gcc_min は 13・14・15 のときだけ書く。atcoder は中心の書き方が AtCoder で使えるなら true、環境・落とし穴のページは null
# level：その書き方が解説コードで目に入り始める帯の目安（research/09 §7.2。ほとんど基礎）。入口と環境は null
# frequency：持たない（README §5。C++ の書き方は最近の ABC の出題回数では数えられない）
# signs：問題文の言い回し・制約から C++ の知識が要るとわかるものだけ。「コードの見た目」と「症状」からの逆引きは cpp-reverse-index の
#   手書きの表で行い、code_signs は足さない（design-review §4.2・§5）
# aliases：C++ の名前（関数・型・書き方）と英語の名前。手法のページが持ち主の語（dsu・mint・max_right・インタラクティブ・切り上げなど）は置かない。
#   手法のページの別名と同じ関数名は std:: を付けて C++ の関数として区別した（std::lower_bound など）
# problems：置かない（C++ のページは本文の確認問題で確かめる。research/09 §5 の候補は内容が未確認）。理由は各ページの problems_note
# visual：priority 1 は入口の分解図（静的）の1つだけ（design-review §4.2 の枠は0〜1）。動く図は views の基本のステップ送りを 2、ほかを 3 にした
