open_issues:
  - "ページ数は入口を含めて20。上限に収めるため research/09 の cpp-idioms（よく見る短い書き方）を単独のページにせず、各書き方を意味の近いページの節に分け、key は書き方の一覧を持つ cpp-reverse-index に入れた（ファイル先頭の注を参照）。小技を1ページで通読できる形を残したいなら、イディオム集を戻して21ページにする案がある"
  - "C++ 章の逆引きの材料（解説コードの見た目・症状）は signs の phrase・constraint に合わないので signs に入れず、aliases と sections に書いた。signs には問題文から C++ の知識が要るとわかるもの（int に収まらない値、10^6 個の入出力、誤差の許容、小数の入力、深い再帰）だけを入れた。cpp-reverse-index を手書きでなく aliases から一部生成するか、front matter にコードの見た目の項目（例 code_signs）を足すかは、工程6で決めたい"
  - "ACL の modint は、C++ の読み方（.val()・出力・v1.6 での型の変更・< がない）を acl-reading の節に、理論と自作の設計を math の modint（research/06）に分けた。同様に overflow-check（math）と cpp-integer-overflow、integer-division（math）と C++ の / の節、stl-containers（ds）と cpp-container-idioms、hash-safety（string）と unordered_map の節も「書き方と事故は cpp、意味と使いどころは相手」で分けた。相手の catalog と重なりすぎていないか見直しで確かめたい"
  - "acl-reading はページを基礎にし、segtree の引数の節を（水）、lazy_segtree の7つの引数の節を（青）にした。前提は C++ のページだけにし、segment-tree・lazy-segment-tree は related にした（レベルの逆転を避けるため）。各手法ページの ACL の囲みからは acl-reading の節へリンクする想定"
  - "版の注記の決め方（GCC の版は 13〜16 で差が出るものだけ、ページの cpp_std・gcc_min は中心の機能が1つに決まるときだけ）はファイル先頭に書いた。ACL の segtree にラムダを渡す機能（クラス型の非型テンプレート引数）の GCC の版は research/09 §4.3 で 9〜11 と幅があるので、版は C++20 とだけ書いた"
  - "AtCoder の新ジャッジ（2025-10〜）のスタックの上限は research/09 で未確認（2023 年の第三者の確認では 1 GiB）。cpp-environment の執筆時にコードテストで ulimit -s を確かめる方法がないので、「大きいが値は未確認」と書く想定"
  - "設計書 §10.1 の試作の候補「ranges と views（C++）」は cpp-views-basics（遅延評価とパイプ）が相当する。C++23 の views まで含めて試すなら cpp-views-cpp23 も対象にする"
