    visual: "vector の再確保で要素が新しい領域へ移り、古い領域を指す参照が取り残されるステップ送り。priority_queue の pop で先頭の場所に別の要素が入るステップ送り。同じ関数のスタック領域を左右に描き、手元はゴミの値、AtCoder は 0 で埋まっている図（静的）"
