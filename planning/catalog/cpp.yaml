  - id: cpp-undefined-behavior
    title: 未定義動作とダングリング（未初期化・範囲外・見つけ方）
    aliases: [未定義動作, UB, 範囲外アクセス, 未初期化変数, 初期化忘れ, ゴミの値, ダングリング, use-after-free, 参照の無効化, 一時オブジェクトの寿命, "pq.top() の参照", "_GLIBCXX_DEBUG", "_GLIBCXX_ASSERTIONS", "-fsanitize=address", AddressSanitizer, UndefinedBehaviorSanitizer, デバッグ用ビルド, assert]
    type: cpp
    level: 基礎
    level_evidence: "帯に依存しない。答えが合わない原因として灰から起き、ダングリングはダイクストラ（緑）や vector に追加しながらの参照で起きる（research/09 cpp-undefined-behavior・cpp-dangling・cpp-uninitialized-variables）"
    kind: [実装・C++]
    prerequisites: [cpp-environment, cpp-integer-overflow, cpp-structured-bindings]
    related: [cpp-range-for, cpp-comparators, cpp-container-idioms, cpp-macros-template-file, debugging-checklist, stress-testing, dijkstra]
    summary: "規格が結果を決めていない操作（符号付き整数のあふれ・範囲外・未初期化変数・ダングリング）は、最適化の前提に使われて -O2 と -O0、手元と AtCoder で結果を変える。ダングリングの4つの型（pq.top() の参照・再確保・範囲 for の一時オブジェクト・string_view）と、_GLIBCXX_DEBUG・サニタイザで何が見つかるかをまとめる。"
    signs: []
    acl: []
    frequency: A
    cpp_std: null
    gcc_min: null
    atcoder: null
    sections:
      - "未定義動作とは：何が起きてもよく、最適化の前提に使われる（手元と AtCoder、-O0 と -O2 で結果が変わる）"
      - "他の行まで壊す：あふれる式があると、-O2 では正しく書いた別の式の値まで変わる"
      - "配列の範囲外：既定では止まらない"
      - "未初期化変数：手元では不定、AtCoder では -ftrivial-auto-var-init=zero で 0 になる（-Wall は配列の未初期化を警告しない）"
      - "ダングリング①：const auto& [d, v] = pq.top(); pq.pop(); で値が変わる（どの道具でも見つからない。値で受ける）"
      - "ダングリング②：auto& row = g[0]; の後の push_back で再確保され、row が消えた領域を指す"
      - "ダングリング③：範囲 for の一時オブジェクト（for (int v : d.groups()[0]) は C++23・GCC 15〜でだけ安全。変数に受けてから回す）"
      - "ダングリング④：string_view に一時的な string を入れる"
      - "そのほかの未定義動作：比較関数の誤り・型の幅以上のシフト・__builtin_ctz(0)・ループ中のコンテナの変更"
      - "見つける道具と見つけられるもの：-Wall -Wextra・-D_GLIBCXX_ASSERTIONS・-D_GLIBCXX_DEBUG・-fsanitize=address・-fsanitize=undefined"
      - "不具合を探すビルドを cph とは別に用意する（g++-15 -std=gnu++23 -O1 -g -D_GLIBCXX_DEBUG -fsanitize=address,undefined -DLOCAL。遅くなる）"
      - "assert で WA を RE に変えて気づく（AtCoder では NDEBUG が付かない）"
