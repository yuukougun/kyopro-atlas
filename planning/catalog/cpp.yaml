  - id: cpp-environment
    title: AtCoder と手元の C++ 環境（オプション・版の対応・スタック）
    aliases: [AtCoder の C++, コンパイルオプション, GCC 15.2, "-std=gnu++23", "-std=c++23", "-ftrivial-auto-var-init=zero", 言語アップデート, C++ の版, 版の対応表, スタックオーバーフロー, Segmentation fault, "ulimit -s", 深い再帰, 手元と結果が違う]
    type: cpp
    level: null
    level_evidence: "環境の知識で難易度帯に依存しない。深い再帰の事故は、N ≤ 2×10^5 の木を再帰の DFS で回す茶〜緑の問題から起きる（research/09 cpp-environment・cpp-stack-depth）"
    kind: [実装・C++]
    prerequisites: []
    related: [cpp-undefined-behavior, cpp-macros-template-file, acl-reading, cpp-lambda, atcoder-system, dfs]
    summary: "AtCoder の C++（GCC 15.2・-std=gnu++23）と手元の g++ のオプションの違いと、それで結果が変わる場面（未初期化変数・スタックの大きさ・GNU 拡張・ACL の版）をまとめる。C++ の版ごとに GCC のどの版から使えるかの対応表もここに置く。"
    signs:
      - {type: constraint, text: "N ≤ 2×10^5 の木やグラフを再帰の DFS で回す（手元の 8 MiB のスタックでは、一直線の入力で落ちることがある）"}
    acl: []
    frequency: A
    cpp_std: null
    gcc_min: null
    atcoder: null
    sections:
      - "AtCoder と手元のオプションの比較と、AtCoder と同じ条件で試すコマンド（g++-15 -std=gnu++23 -O2 -Wall -Wextra -ftrivial-auto-var-init=zero -march=native -DATCODER -DONLINE_JUDGE）"
      - "-std=gnu++23 と -std=c++23 の違い：GNU 拡張（typeof など）と __int128 の型特性（is_integral_v が gnu モードでだけ true）"
      - "-ftrivial-auto-var-init=zero：AtCoder では未初期化の局所変数・配列が 0 になる（手元に付けるかは好みが分かれる。付けなければ初期化忘れに気づきやすい）"
      - "-march=native と #pragma GCC target：AtCoder では target の指定は要らない"
      - "-DATCODER・-DONLINE_JUDGE：ジャッジでだけ定義されるマクロ（-fmodules・-lstdc++exp は使うときだけ関係する）"
      - "ACL の版：AtCoder は v1.6（modint の val() が int）。手元も v1.6 にそろえる"
      - "再帰の深さとスタック：手元は 8 MiB が多く -O2 でも深さ 2×10^5 で落ちうる、ulimit -s unlimited で広げる、BFS 順や明示的なスタックに書き直す、関数の中の大きな配列もスタックを使う（AtCoder の上限は大きいが新ジャッジの値は未確認）"
      - "プリコンパイル済みヘッダ：作ったときと同じオプションのときだけ使われる（-Winvalid-pch で理由が出る）"
      - "Clang 版（libc++）ではなく GCC 版を選ぶ"
      - "手元と AtCoder で結果が違うときに疑う順（未初期化変数 → 未定義動作 → スタック → ACL の版）"
      - "C++ の版と GCC の対応表（C++17・C++20・C++23・C++26 の機能 × g++-13・AtCoder の GCC 15.2）"
      - "GCC 13 で通らない書き方：deducing this・print・ranges::to（C++23・GCC 14〜）、範囲の書式化・from_range・import std（C++23・GCC 15〜）"
      - "AtCoder で使えないもの：C++26 の機能（views::concat・add_sat。名前 _ の複数宣言だけは警告つきで通る）と GCC 16 からの機能（ranges::starts_with・mdspan・views::indices）"
    merged_keys: [cpp-version-matrix, cpp-stack-depth]
    visual: "AtCoder と手元のコンパイルオプションを左右に並べ、結果に差が出る行に印を付けた比較表（静的）。版の対応表は機能 × 処理系の ○× 表で、版ごとに色を分ける。再帰の深さは、コールスタックが1段ずつ積み上がり上限を超えると落ちるステップ送り"
    problems: []
    sources: ["09-cpp §4.2", "09-cpp §4.3", "09-cpp §4.4", "09-cpp §2.5", "09-cpp §7.7", "decisions.md（AtCoder の C++ 環境、手元の開発環境の更新）"]

