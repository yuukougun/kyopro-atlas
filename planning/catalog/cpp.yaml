  - id: cpp-reverse-index
    title: C++ の逆引き
    aliases: [解説コードの読み方, 解説コードが読めない, モダン C++ の読み方, 書き方から引く, 症状から引く, Segmentation fault, コンパイルエラーの読み方, エラーメッセージ, "required from here"]
    type: guide
    level: null
