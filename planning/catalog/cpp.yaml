  - id: cpp-integer-overflow
    title: 整数のオーバーフローと __int128
    aliases: [オーバーフロー, あふれ, int の掛け算, "1LL * a * b", "1 << 40", 符号なし整数, "v.size() - 1", ssize, "__int128", i128, 128bit 整数, "__builtin_mul_overflow", 積の上限の判定]
    type: cpp
    level: 基礎
    level_evidence: "答えが 2^31 を超える灰〜茶の問題から起きる。__int128 は 10^18 を超えうる積の判定などで茶〜青に散発的に現れる（推定。research/09 cpp-integer-overflow・cpp-int128）"
    kind: [実装・C++]
    prerequisites: [cpp-types-literals]
    related: [cpp-undefined-behavior, overflow-check, integer-root, cpp-math-functions, cpp-algorithms, cpp-views-basics]
    summary: "int どうしの積・1 << k・accumulate の初期値・size() の符号なしなど、型の幅を超えて値が壊れる書き方と直し方をまとめる。64bit を超える中間値は GCC の拡張 __int128 で持てるが、cout で出せない・-std=c++23 では gcd に渡せないなどの制限がある。"
    signs:
      - {type: constraint, text: "A_i ≤ 10^9 を N ≤ 2×10^5 個足す、または2つ掛ける（int に収まらない）"}
    acl: []
    frequency: A
    cpp_std: null
    gcc_min: null
    atcoder: true
    sections:
      - "int どうしの積は int で計算される：long long p = a * b は誤り、1LL * a * b か (long long)a * b"
      - "シフトの幅：1 << 40 は警告が出て 0 になる、1LL << 40"
      - "初期値と推論の型：accumulate(..., 0)・auto x = 0・views::iota(0, n) の i は int"
      - "size() は符号なし：空の v で v.size() - 1 が巨大になる、-1 < v.size() が false、ssize(v)（C++20）か (int)v.size()"
      - "型の違う値を min・max に渡すとコンパイルエラー：min(1, x) → min(1LL, x)・min<long long>(1, x)"
      - "INF + INF・abs(INT_MIN)・INT_MIN / -1"
      - "符号付き整数のあふれは未定義動作：-O2 では正しく書いた別の行の値まで変わる（警告は出ず、-fsanitize=undefined で見つかる）"
      - "__int128：10^18 程度どうしの積を正確に持つ。リテラルはないので (__int128)1 << 100 と書く（GCC の拡張）"
      - "__int128 の入出力：cout << も cin >> もできない、format（C++20・GCC 13〜）・println（C++23・GCC 14〜）か自作の変換で出し、文字列で読んで変換する"
      - "-std=c++23 では is_integral_v<__int128> が false で gcd・abs に渡せない（AtCoder の -std=gnu++23 では渡せる。numeric_limits はどちらでも使える）"
      - "積が上限を超えるかの判定：割り算で比べる考え方は integer-division のページ、C++ では __builtin_mul_overflow（GCC の拡張）も使える、long double は境界で誤りうる"
    merged_keys: [cpp-int128]
    visual: "32bit 整数を時計の文字盤のような円で描き、最大値を超えると負の側へ回り込む様子のステップ送り"
    problems: []
    sources: ["09-cpp §4.35", "09-cpp §4.7", "09-cpp §4.8", "09-cpp §6.3（あふれへの対処）", "decisions.md（gnu++23 と c++23 の __int128）"]

