    related: [cpp-integer-overflow, cpp-initialization, cpp-math-functions, cpp-io, geometry-precision, dijkstra]
    summary: "整数と浮動小数点数の型、リテラルの接尾辞、auto が推論する型、INF の決め方をまとめる。auto x = 0 は int、v.size() は符号なし、1e18 は double になるなど、型が意図とずれて起きる誤りを防ぐ。"
    signs: []
    acl: []
    frequency: A
    cpp_std: null
    gcc_min: null
    atcoder: true
    sections:
      - "整数の型と表せる範囲（int・long long・unsigned・size_t・int64_t）"
      - "リテラルの書き方：1LL・ULL、桁区切り 1'000'000'007、2進 0b1010、size_t の 0uz（C++23）"
      - "auto が推論する型：0 は int、0LL は long long、v.size() は size_t（符号なし）、1e18 は double"
      - "型の別名：using ll = long long と #define ll long long（ll(x) と書けるか）"
      - "キャスト：static_cast<long long>(x)・(long long)x"
      - "INF の決め方：numeric_limits<T>::max()・1LL << 60・0x3f3f3f3f と、INF + INF があふれるか（ライブラリの雛形の値の比較も）"
      - "浮動小数点数の型：double が整数を正確に表せるのは 2^53 まで、x86-64 の long double は仮数部 64bit"
      - "1e18 は double：(long long)1e18 + 1 は正確だが (long long)(1e18 + 1) は丸められる、auto INF = 1e18 も double"
      - "浮動小数点数を == で比べない（誤差を許すか、整数で計算する。小数の入力を整数に直す方法と幾何の誤差は geometry-precision のページ）"
      - "float128_t（<stdfloat>。C++23・GCC 13〜。解説コードではまれ）"
    merged_keys: [cpp-numeric-limits-inf, cpp-floating-point]
    visual: "int・long long・__int128・double が正確に表せる範囲を1本の数直線に並べた図（約 2.1×10^9、約 9.2×10^18、約 1.7×10^38、2^53 ≈ 9.0×10^15）。INF の候補を同じ数直線に置き、INF + INF が型の上限を超えるかを示す（静的）"
    problems: []
