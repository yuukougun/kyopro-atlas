  - "提案（A・B・C・D・E）：related に残っている cpp の調査の key を統合先の節（id#anchor）に直す。cpp-stack-depth → cpp-environment#stack-depth（dp/memoized-recursion・dp/tree-dp・graph/dfs・tree/tree-traversal・misc/parsing）、cpp-recursive-lambda → cpp-lambda#recursive-lambda（basics/recursive-enumeration・basics/recursion-structure・dp/memoized-recursion・graph/dfs・tree/tree-traversal）、cpp-bit-functions → cpp-math-functions#bit-functions（basics/bit-operations）、cpp-performance → cpp-io#tle-causes（basics/complexity-estimation）、cpp-algorithms-classic → cpp-algorithms（basics/sorting-techniques）、cpp-random-chrono → cpp-math-functions#random（misc/randomized）、cpp-bitset → cpp-math-functions#bitset（misc/bitset-speedup）、cpp-iterators → cpp-container-idioms#iterators（ds/ordered-set。ds/stl-containers は cpp-container-idioms と重なるので1つに）、acl-other-components → acl-reading#components（ds/union-find）、acl-segtree-template → acl-reading#segtree-args（ds/segment-tree）・acl-reading#lazy-segtree-args（ds/lazy-segment-tree）、acl-modint → acl-reading#modint（math/modint）、cpp-floating-point → cpp-types-literals#floating-point（math/integer-root）、cpp-int128 → cpp-integer-overflow#int128（math/integer-division。同じページの cpp-integer-overflow と重なるので cpp-integer-overflow#overflow-check の1つにするとよい）。統合したすべての key の行き先はファイル先頭の注にある（2026-10-21：ページの id のまま残っていた graph/dfs・tree/tree-traversal・ds/ordered-set・ds/union-find・ds/segment-tree・ds/lazy-segment-tree・math/modint・math/integer-root・math/integer-division を上の節の id#anchor に直した。ほかは各担当が反映済み）"
  - "提案（I・G）：第2版の guide・string・geometry は cpp をページの id で指している。節まで指すなら次がよい。guide/debugging-checklist：cpp-environment#stack-depth・cpp-io#tle-causes・cpp-undefined-behavior#debug-build・cpp-types-literals#floating-point、guide/reverse-index-constraints：cpp-io#tle-causes、guide/stress-testing：cpp-math-functions#random、guide/library-design：cpp-macros-template-file#bundling・acl-reading#segtree-args、guide/cheatsheet#cpp：cpp-environment#version-matrix・cpp-types-literals#inf、string/hash-safety：cpp-math-functions#random・cpp-container-idioms#unordered-map、geometry/geometry-precision：cpp-types-literals#floating-point"
  - "提案（I）：cpp-reverse-index へ入ってくる道を guide からも張る。guide/debugging-checklist の節 local-vs-judge は「C++ 章の症状からの逆引きへ」とあるので related に cpp-reverse-index#symptoms を、guide/reverse-index-signs の related に cpp-reverse-index を足す。いまは cpp の2ページ（cpp-templates-constexpr → #compile-errors、cpp-undefined-behavior → #symptoms）の related とナビゲーションだけが入口へ向かう"
  - "提案（メイン・C）：ACL の部品名は各手法のページの acl の項目から引く。acl-reading の別名からは、手法のページが持ち主の語（dsu・fenwick_tree・scc_graph・max_right・min_left・modint・mint・modint998244353・modint1000000007・static_modint）を外した。用語の索引（design-review T3）に acl の項目も入れるか、入れないなら scc_graph を graph/scc の別名に足すかを決めてほしい（ほかの部品名は相手のページの別名にすでにある）"
  - "別名の重なり：第1版で手法のページと重なっていた語は C++ 側で直した。比較関数・定数倍（題名に含まれる）、インタラクティブ・切り上げ・負の数の割り算・負の剰余・浮動小数点の誤差・積の上限の判定（手法のページが持ち主）は外し、lower_bound・upper_bound・next_permutation・popcount・bitset・swap は std:: を付け、unordered_map は「unordered_map のハッシュ」、flush は「fflush(stdout)」にした。geometry の提案（浮動小数点の誤差を cpp-types-literals から外す）は受けた。geometry-precision が long double を外したので、long double は cpp-types-literals だけにある。2026-10-21 の時点の catalog で、cpp の題名・別名と重なる語はない"
  - "ACL の segtree にラムダを渡す機能（クラス型の非型テンプレート引数）の GCC の版は research/09 §4.3 で 9〜11 と幅があるので、acl-reading#passing-functions の版は C++20 とだけ書いた"
  - "AtCoder の新ジャッジ（2025-10〜）のスタックの上限は research/09 で未確認（2023 年の第三者の確認では 1 GiB）。cpp-environment の執筆時にコードテストで ulimit -s を確かめる方法がないので、「大きいが値は未確認」と書く想定"
  - "設計書 §10.1 の試作の候補「ranges と views（C++）」は cpp-views-basics（遅延評価とパイプ）が相当する。C++23 の views まで含めて試すなら cpp-views-cpp23 も対象にする。cpp で動く図の priority 2 は cpp-views-basics のパイプのステップ送りだけなので、試作で作るかを決めるとよい"
