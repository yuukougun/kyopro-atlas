# C++（cpp）の目次。担当 H。規則は planning/catalog/README.md、上位の規則は planning/design.md §3〜§5（C++ 章の粒度は §4.1 の 5 と §13 の F）。
# 主な材料：research/09（50項目）、research/00 §3.2 の cpp-extra-pitfalls（guide から moved で受け取った）
#
# 束ね方：research/09 §7.1 の案 B（11〜15ページ）を出発点に、長くなる「型と初期化」「範囲 for と構造化束縛」「ranges と views」
#   「落とし穴」を分け、入口の C++ の逆引きを含めて20ページにした。書き方1つずつを sections の1行にし（執筆時に見出しとアンカーにする）、
#   入口の cpp-reverse-index から「書き方 → ページ#節」で引く。
# - research/09 の cpp-idioms（よく見る短い書き方）は単独のページにせず、各書き方を意味の近いページの節に分けた：
#     初期化式付き if・tie・exchange → cpp-structured-bindings、その場で呼ぶラムダ → cpp-lambda、chmax の (a = b, true) → cpp-macros-template-file、
#     " \n"[i == n - 1]・三項演算子・while (cin >> x) → cpp-io、x & -x → cpp-math-functions、c - 'a' → cpp-string-api、
#     max({a, b, c}) → cpp-algorithms、assert → cpp-undefined-behavior。書き方の一覧は cpp-reverse-index が持つので、key はそこに入れた
# - import std（research/09 では環境の節）は、#include と並べて読むものなのでマクロと雛形のページに置いた
# - 自作ライブラリの設計（self-library）は guide の library-design が持ち主（coordinator の調整）。提出前の展開（library-bundling）は
#   C++ の書き方なので cpp-macros-template-file の節に残し、library-design と related で結ぶ
#
# 版の注記（sections の各行）：「（C++20）」「（C++23・GCC 14〜）」のように書く。
# - C++17 以降の機能と GCC の拡張にだけ付ける（C++14 以前からある書き方には付けない）
# - GCC の版は GCC 13 以降で差が出るもの（13・14・15・16）だけ書く。規格の版だけのものは GCC 12 以前から使える
# - AtCoder は GCC 15.2・-std=gnu++23。注記に「AtCoder では使えない」とないものはすべて使える
# - ページの cpp_std・gcc_min・atcoder は、そのページの中心の機能が1つに決まるときだけ値を入れる（版の混ざるページは cpp_std・gcc_min を null）。
#   gcc_min は 13・14・15 のときだけ書く。atcoder は中心の書き方が AtCoder で使えるなら true、環境・落とし穴のページは null
# level：その書き方が解説コードで目に入り始める帯の目安（research/09 §7.2。ほとんど基礎）。入口と環境は null。ACL のセグ木の節には（水）（青）の印
# frequency：C++ 章では「解説コードで繰り返し見る・事故が繰り返し起きる」ものを A にした
# signs：問題文の言い回し・制約から C++ の知識が要るとわかるものだけを入れた。「コードの見た目」と「症状」は aliases・sections と
#   cpp-reverse-index（手書き）で引く（逆引き辞典の phrase に混ぜないため。open_issues を参照）
# problems：research/09 §5 の候補は内容が未確認なので入れない
