  # ── 型と値 ──
  - id: cpp-types-literals
    chapter: 型と値
    title: 数の型とリテラル
    aliases: [整数の型, long long, LL, ULL, 桁区切り, 2 進リテラル, "0uz", auto の推論, "using ll = long long", static_cast, INF, numeric_limits, LLONG_MAX, INT_MAX, "0x3f3f3f3f", "1LL << 60", double, long double, "1e18", 浮動小数点数の型]
    type: cpp
    level: 基礎
    level_evidence: "どの帯の解説コードにも現れる基本の書き方。INF は最短路・DP の初期値として、小数の扱いは小数の入出力がある問題として灰〜茶から（research/09 cpp-types-literals・cpp-numeric-limits-inf・cpp-floating-point）"
    kind: [実装・C++]
    prerequisites: []
    related: [cpp-integer-overflow, cpp-initialization, cpp-math-functions, cpp-io, geometry-precision, dijkstra]
    summary: "整数・浮動小数点数の型とリテラル、INF の値を、値が収まり意図どおりの型になるように選ぶ。auto x = 0 が int、1e18 が double になるような、型のずれによる誤りを防ぐ。"
    signs: []
    acl: []
    cpp_std: null
    gcc_min: null
    atcoder: true
    sections:
      - {title: "整数の型と表せる範囲（int・long long・unsigned・size_t・int64_t）", anchor: integer-types}
      - {title: "リテラルの書き方：1LL・ULL、桁区切り 1'000'000'007、2 進 0b1010、size_t の 0uz（C++23）", anchor: literals}
      - {title: "auto が推論する型：0 は int、0LL は long long、v.size() は size_t（符号なし）、1e18 は double", anchor: auto-deduction}
      - {title: "型の別名：using ll = long long と #define ll long long（ll(x) と書けるか）", anchor: type-alias}
      - {title: "キャスト：static_cast<long long>(x)・(long long)x", anchor: cast}
      - {title: "INF の決め方：numeric_limits<T>::max()・1LL << 60・0x3f3f3f3f と、INF + INF があふれるか（ライブラリの雛形の値の比較も）", anchor: inf}
      - {title: "浮動小数点数の型：double が整数を正確に表せるのは 2^53 まで、x86-64 の long double は仮数部 64bit", anchor: floating-point}
      - {title: "1e18 は double：(long long)1e18 + 1 は正確だが (long long)(1e18 + 1) は丸められる、auto INF = 1e18 も double", anchor: double-1e18}
      - {title: "浮動小数点数を == で比べない（誤差を許すか、整数で計算する。小数の入力を整数に直す方法と幾何の誤差は geometry-precision のページ）", anchor: float-compare}
      - {title: "float128_t（<stdfloat>。C++23・GCC 13〜。解説コードではまれ）", anchor: float128}
    merged_keys: [cpp-numeric-limits-inf, cpp-floating-point]
    visual: {kind: static, priority: 2, text: "int・long long・__int128・double が正確に表せる範囲を 1 本の数直線に並べた図（約 2.1×10^9、約 9.2×10^18、約 1.7×10^38、2^53 ≈ 9.0×10^15）。INF の候補を同じ数直線に置き、INF + INF が型の上限を超えるかを示す"}
    problems: []
    problems_note: "C++ のページは ABC の問題を置かず、本文の確認問題で確かめる"
    sources: ["09-cpp §4.6", "09-cpp §4.8", "09-cpp §4.39", "09-cpp §6.3（INF）"]

  - id: cpp-integer-overflow
    chapter: 型と値
    title: 整数のオーバーフローと __int128
    nav_title: オーバーフローと __int128
    aliases: [オーバーフロー, integer overflow, あふれ, int の掛け算, "1LL * a * b", "1 << 40", 符号なし整数, "v.size() - 1", ssize, "__int128", i128, 128bit 整数, "__builtin_mul_overflow"]
    type: cpp
    level: 基礎
    level_evidence: "答えが 2^31 を超える灰〜茶の問題から起きる。__int128 は 10^18 を超えうる積の判定などで茶〜青に散発的に現れる（推定。research/09 cpp-integer-overflow・cpp-int128）"
    kind: [実装・C++]
    prerequisites: [cpp-types-literals]
    related: [cpp-undefined-behavior, integer-division, integer-root, cpp-math-functions, cpp-algorithms, cpp-views-basics]
    summary: "int どうしの積・1 << k・size() の符号なしなど、型の幅を超えて値が壊れる書き方を見分けて直す。64 bit を超える中間値は GCC の拡張 __int128 で持てるが、入出力などに制限がある。"
    signs:
      - {type: constraint, text: "A_i ≤ 10^9 を N ≤ 2×10^5 個足す、または 2 つ掛ける（int に収まらない）"}
    acl: []
    cpp_std: null
    gcc_min: null
    atcoder: true
    sections:
      - {title: "int どうしの積は int で計算される：long long p = a * b は誤り、1LL * a * b か (long long)a * b", anchor: int-product}
      - {title: "シフトの幅：1 << 40 は警告が出て 0 になる、1LL << 40", anchor: shift-width}
      - {title: "初期値と推論の型：accumulate(..., 0)・auto x = 0・views::iota(0, n) の i は int", anchor: inferred-int}
      - {title: "size() は符号なし：空の v で v.size() - 1 が巨大になる、-1 < v.size() が false、ssize(v)（C++20）か (int)v.size()", anchor: unsigned-size}
      - {title: "型の違う値を min・max に渡すとコンパイルエラー：min(1, x) → min(1LL, x)・min<long long>(1, x)", anchor: min-max-types}
      - {title: "INF + INF・abs(INT_MIN)・INT_MIN / -1", anchor: edge-values}
      - {title: "符号付き整数のあふれは未定義動作：-O2 では正しく書いた別の行の値まで変わる（警告は出ず、-fsanitize=undefined で見つかる）", anchor: signed-overflow-ub}
      - {title: "__int128：10^18 程度どうしの積を正確に持つ。リテラルはないので (__int128)1 << 100 と書く（GCC の拡張）", anchor: int128}
      - {title: "__int128 の入出力：cout << も cin >> もできない、format（C++20・GCC 13〜）・println（C++23・GCC 14〜）か自作の変換で出し、文字列で読んで変換する", anchor: int128-io}
      - {title: "-std=c++23 では is_integral_v<__int128> が false で gcd・abs に渡せない（AtCoder の -std=gnu++23 では渡せる。numeric_limits はどちらでも使える）", anchor: int128-strict-mode}
      - {title: "積が上限を超えるかの判定：割り算で比べる考え方は integer-division のページ、C++ では __builtin_mul_overflow（GCC の拡張）も使える、long double は境界で誤りうる", anchor: overflow-check}
    merged_keys: [cpp-int128]
    visual: {kind: dynamic, priority: 3, text: "32bit 整数を時計の文字盤のような円で描き、最大値を超えると負の側へ回り込む様子のステップ送り"}
    problems: []
    problems_note: "C++ のページは ABC の問題を置かず、本文の確認問題で確かめる"
    sources: ["09-cpp §4.35", "09-cpp §4.7", "09-cpp §4.8", "09-cpp §6.3（あふれへの対処）", "decisions.md（gnu++23 と c++23 の __int128）"]

