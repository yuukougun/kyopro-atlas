      - "円と格子点：y ごとに x の範囲を整数で求める"
      - "円のつながりを Union-Find で"
      - "最小包含円：候補は2点を直径とする円か3点の外接円（Welzl の乱択も）"
      - "答えで二分探索して判定問題にする（半径・時刻）"
      - "三分探索：凸性の確認・入れ子の三分探索・式の変わり目の時刻を列挙する方法"
      - "外心の計算と退化（3点が一直線上）"
      - "山登り・焼きなましに頼らない（ABC の幾何の最適化は凸性や候補の列挙で解ける）"
    merged_keys: [min-enclosing-circle, geometry-optimization]
    visual: "2円の5つの位置関係を、中心間の距離と半径の和・差で並べた図"
