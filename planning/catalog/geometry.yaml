  - id: convex-hull
    title: 凸包と凸多角形（内外判定・格子点と Pick の定理）
    aliases: [凸包, Andrew のアルゴリズム, monotone chain, Graham scan, 上側凸包, 下側凸包, 内外判定, 凸多角形の内外判定, 交差数判定, Pick の定理, 格子点, 線分上の格子点]
    type: technique
    level: 黄
    level_evidence: "typical90_ao（★7）、agc021_b (2130)、abc341_g (2208)、内外判定 abc296_g (2241)・abc251_g (2468)。発展 abc202_f (2905)、abc356_g (3022)"
    kind: [幾何]
    prerequisites: [geometry-vectors, sorting-techniques, binary-search, gcd-lcm]
    related: [cht, argument-sort, advanced-geometry, monotonic-stack, fractional-binary-search, floor-sum]
    summary: "点を x 座標でソートし、スタックの末尾が凹む間は取り除くことで、全点を囲む最小の凸多角形（凸包）を O(N log N) で作る（Andrew 法）。凸多角形への多数の点の内外判定（1点 O(log N)）と、格子点を頂点とする多角形の面積と格子点の数の関係（Pick の定理）も扱う。"
    signs:
      - {type: phrase, text: "すべての点を囲む最小の凸多角形"}
      - {type: phrase, text: "外側にある点だけが効く"}
      - {type: phrase, text: "区間の平均・傾き・比の最大（累積和の点の上側凸包）"}
      - {type: phrase, text: "多数の点が凸多角形の内部・境界・外部のどこにあるか"}
      - {type: phrase, text: "多角形の内部にある格子点の数"}
      - {type: constraint, text: "N ≤ 2×10^5 点で O(N log N)"}
    acl: []
    frequency: B
    sections:
      - "Andrew 法（monotone chain）：下側と上側を作る"
      - "一直線上の点・重複点・全点が一直線上のときの扱い（外積の不等号の向き）"
      - "比・平均の最大は上側凸包の接線（累積和の点）"
      - "凸包と CHT の双対（点 (a, b) と直線 y＝ax+b）"
      - "凸多角形の内外判定：扇形に分けて二分探索（O(log N)）"
      - "一般の多角形の内外判定（交差数の偶奇）"
      - "格子点：線分上は gcd(|dx|, |dy|)+1、Pick の定理 S＝i＋b/2−1（面積の2倍で整数のまま）"
    merged_keys: [point-in-polygon, lattice-points, polygon-geometry]
    visual: "（動く図の候補）点を x 順に見て、右に曲がる（凹む）ごとにスタックから取り除く Andrew 法のステップ送り"
    problems:
      - {id: typical90_ao, role: example, summary: "凸包を求め、辺上の格子点は gcd、内部の格子点は Pick の定理で数える"}
      - {id: abc341_g, role: example, summary: "各 i から始まる区間の平均の最大。累積和の点の上側凸包をスタックで保ち、傾きの最大を求める"}
      - {id: abc296_g, role: example, summary: "凸多角形に対する多数の点の内外判定。頂点の偏角で辺を二分探索し、整数の外積で判定する"}
      - {id: agc021_b, role: practice, summary: "遠くの一様な点に最も近い穴の確率。凸包上の点だけが正の確率を持ち、外角を 2π で割る"}
      - {id: abc251_g, role: practice, summary: "M 通りに平行移動した凸多角形すべての内部か。辺ごとに外積の最大値を前計算して判定する"}
      - {id: abc202_f, role: challenge, summary: "凸包の面積の2倍が偶数になる点の部分集合の数。凸包の構成に沿った DP（発展）"}
    sources: ["08-string-geo §4.8 convex-hull・point-in-polygon・lattice-points", "00-curriculum §3.2 優先度 B（多角形の面積・内外判定・Pick の定理）", "02-dp cht（双対の関係）", "06-math-nt floor-sum（格子点の数え上げの別解）"]

