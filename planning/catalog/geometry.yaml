      - {type: phrase, text: "すべての点を含む最小の円"}
      - {type: phrase, text: "障害物を避けて通れる円の最大の半径"}
      - {type: phrase, text: "円の内部にある格子点の数"}
      - {type: phrase, text: "答えが実数で、誤差 10^-6 程度まで許される最適化"}
      - {type: constraint, text: "N ≤ 50 程度で、2点・3点で決まる候補を全部試せる"}
    acl: [dsu]
    frequency: B
    sections:
