open_issues:
  - "設計書 §4.1 の 6 に従い research/08 §7.1 の13案を8ページに統合した：多角形の面積・線分の交差・3次元を geometry-vectors の節（面積と交差に水の印）に、点の内外判定・格子点（Pick の定理）を convex-hull に、直線の正規化を geometry-precision に、最小包含円・幾何の最適化を circle-geometry に入れた。多角形の面積（研究では水）を基礎のページの節にしたことと、Pick の定理を凸包のページに置いたことの是非を見直しで確かめたい"
  - "research/00 §2.3.8 の分類から足した問題（abc467_d・abc472_f・abc476_f・abc457_g・abc479_g・abc478_g）は、research/08 の個別の裏付けではなく 00 の分類（第三者の解説で手法だけを確かめたもの）による。要約は手法の名前にとどめたので、執筆時に内容を確かめる"
  - "00 の polygon-geometry（多角形の面積・内外判定・Pick・最近点対・回転キャリパー・最小包含円を束ねた項目）は convex-hull の merged_keys に入れたが、中身は geometry-vectors（面積）・circle-geometry（最小包含円）・advanced-geometry（最近点対・回転キャリパー）にも分かれている"
  - "geometry-precision の直線の正規化は、math の rational-normalization（分数・傾きを既約にして扱う。gcd-lcm の節）と内容が重なる。math は分数一般、geometry は方向・直線の正規化と幾何の例題、という分担を提案する"
  - "manhattan-chebyshev は basics の median-absolute（絶対値の和と中央値）・independence（x と y を独立に）、00 の checkerboard-parity（市松模様）と重なる。幾何の文脈（45度回転・距離の和・斜めの座標）をこちらで扱い、一般論は basics に任せる"
  - "rotation-transform の研究上の前提 matrix-power（黄）はレベルが逆転するので related にした。abc189_e に要るのは 3×3 行列の積だけなので、本文で行列の積を短く説明する"
