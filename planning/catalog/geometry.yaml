    summary: "2円の位置関係は、中心間の距離と半径の和・差を2乗して整数のまま判定できる。実数の位置・半径・時刻の最適化は、最適解が少数の点で決まる（最小包含円は2点か3点）なら候補を列挙し、判定が単調なら答えで二分探索、凸なら三分探索する。"
    signs:
