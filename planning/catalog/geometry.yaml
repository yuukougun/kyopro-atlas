  - id: manhattan-chebyshev
    title: マンハッタン距離と 45 度回転
    nav_title: null
    aliases: [45 度回転, マンハッタン距離, Manhattan distance, チェビシェフ距離, Chebyshev distance, L1 距離, L∞ 距離, "u=x+y, v=x−y", 絶対値を外す, 斜めの番号]
