# 幾何（geometry）の目次（第2版）。規則は planning/catalog/README.md、上位の規則は planning/design.md §3〜§5 と planning/design-review.md。
# 主な材料：research/08（幾何）、research/00 §3.2（多角形・ミンコフスキー和）・§2.3.8（最近の ABC の分類）
# 設計書 §4.1 の 6（ABC での出題が少ないので統合を優先して8ページ前後）に従い、research/08 §7.1 の13案を8ページにまとめた。小さい分野なので章は置かない
# 節の anchor は、統合した調査の key に当たる節では key と同じ名前にした（例：geometry-precision#line-normalization、convex-hull#lattice-points）
field: geometry
pages:
  - id: geometry-vectors
    title: ベクトルと外積
    nav_title: null
    aliases: [外積, 内積, cross product, ccw, 向き判定, 符号付き面積, 多角形の面積, 靴紐公式, shoelace formula, 線分の交差判定, 点と直線の距離, 3 次元の基本, 直方体の共通部分]
    type: technique
    level: 基礎
    level_evidence: "abc181_c (274)・abc224_c (301)・abc266_c (516)・abc361_b (299, 2024)。以降のすべての幾何の土台。多角形の面積と線分の交差は単独の出題が少なく、abc016_4（参考値 1305）・abc472_f (1707, 2026)・abc250_f (2044) のように組み合わせて出るので水の節にした"
    kind: [幾何]
    prerequisites: []
    related: [geometry-precision, argument-sort, convex-hull, prefix-sum, two-pointers]
    summary: "外積 a.x·b.y − a.y·b.x の符号で向き（左・右・一直線上）が、絶対値で平行四辺形の面積が分かる。3 点の一直線判定・凸性・多角形の面積・線分の交差を、整数のまま誤差なく判定できる。"
    signs:
      - {type: phrase, text: "3 点が一直線上にあるか・三角形ができるか"}
      - {type: phrase, text: "左に曲がるか右に曲がるか・四角形が凸か"}
      - {type: phrase, text: "頂点が順に与えられた多角形の面積"}
      - {type: phrase, text: "2 本の線分が交わるか・多角形を線分で切って分かれる個数"}
      - {type: phrase, text: "直方体どうしの共通部分の体積"}
      - {type: constraint, text: "座標が整数で |x|, |y| ≤ 10^9（外積は long long にぎりぎり収まる）"}
      - {type: shape, text: "(x2 − x1)(y3 − y1) − (y2 − y1)(x3 − x1) の符号で場合を分ける"}
    acl: []
    verify: []
    frequency: A
    frequency_evidence: "recent 2（abc467_d・abc472_f）・前提として 7 ページに届く（直接 4）・古い ABC 7 問"
    sections:
      - {title: "外積と内積の意味（符号と大きさ）", anchor: cross-and-dot}
      - {title: "ccw：3 点の回り方・一直線上の判定・凸性の判定", anchor: ccw}
      - {title: "オーバーフローの見積もり（座標 10^9 で外積は 8×10^18、さらに足すなら __int128）", anchor: overflow}
      - {title: "三角形・多角形の面積：座標の公式（面積の 2 倍を整数のまま扱う）", anchor: polygon-area, level: 水}
      - {title: "線分の交差判定（端点で接する・同一直線上の場合）と点と直線の距離", anchor: segment-intersection, level: 水}
      - {title: "3 次元の基本：軸に平行な直方体の共通部分は軸ごとの区間の積", anchor: 3d-geometry}
      - {title: "点の表し方：整数の構造体と std::complex", anchor: point-representation}
    merged_keys: [polygon-area, segment-intersection, 3d-geometry]
    visual: {kind: static, priority: 2, text: "外積の符号と平行四辺形の面積の図と、多角形の面積で原点と各辺の三角形を正負で塗り分けて外側が打ち消し合う図"}
    problems:
      - {id: abc181_c, role: example, representative: true, summary: "N 点の中に一直線上にある 3 点があるかを判定する。", approach: "外積が 0 かで判定する"}
      - {id: abc361_b, role: practice, summary: "2 つの直方体の共通部分の体積が正かを判定する。", approach: "各軸の区間が重なるかで判定する（節 3d-geometry）"}
      - {id: abc224_c, role: practice, summary: "N 点から三角形ができる 3 点の選び方の数を求める。", approach: "外積が 0 でない組を数える"}
      - {id: abc266_c, role: practice, summary: "4 点を順に結んだ四角形が凸かを判定する。", approach: "各頂点で隣り合う辺の外積の符号がそろうかを調べる"}
      - {id: abc016_4, role: practice, summary: "多角形を 1 本の線分で切ったとき、いくつに分かれるかを求める。", approach: "各辺との交差を外積で判定し、交差数/2+1 を答える（節 segment-intersection）"}
      - {id: abc472_f, role: challenge, summary: "（執筆時に確かめる）", approach: "多角形の重心と累積和を組み合わせる（research/00 §2.3.8 の分類による）"}
      - {id: abc250_f, role: challenge, summary: "凸多角形を対角線で切り、片側の面積を全体の 1/4 にできるだけ近づける。", approach: "面積の 2 倍を整数のまま尺取りする（節 polygon-area）"}
      - {id: abc373_g, role: challenge, summary: "2 つの点集合の点を 1 対 1 に線分で結び、どの 2 本も交わらない結び方を求める。", approach: "交差する組をつなぎ替えると長さの和が減る性質を使う"}
    problems_note: null
    sources: ["08-string-geo §4.8 geometry-vectors・segment-intersection・polygon-area・3d-geometry", "08-string-geo §6.3（公式と外積の値の大きさ）", "08-string-geo §5 幾何", "00-curriculum §2.3.8（abc472_f）"]

  - id: geometry-precision
    title: 誤差の扱いと整数での処理
    nav_title: null
    aliases: [浮動小数点の誤差, floating-point error, EPS, 整数化, 桁落ち, 直線の正規化, 方向ベクトルの約分, "ax+by+c=0"]
    type: technique
    level: 水
    level_evidence: "小数入力の整数化は基礎帯（abc169_c 597）。方向・直線の正規化は abc418_e (1282, 2025)・abc248_e (1292) で水（易しい例 abc467_d 928, 2026）。整数化しないと解けない・桁落ちで WA になるのは abc385_f (1905, 2024)・abc191_d (1953)・abc296_g (2241) と青〜黄"
    kind: [幾何, 整数論]
    prerequisites: [geometry-vectors, gcd-lcm]
    related: [cpp-types-literals#floating-point, integer-root#compare-sqrt, binary-search-answer, circle-geometry, argument-sort]
    summary: "幾何の計算をできるだけ整数で行い、誤差による判定の誤りを防ぐ。小数の入力は 10^k 倍し、比較は外積・内積・距離の 2 乗で、傾きや直線は gcd で約分して符号をそろえた組で表し、実数は避けられないときだけ使う。"
    signs:
      - {type: phrase, text: "座標や値が小数第 k 位まで与えられる"}
      - {type: phrase, text: "ちょうど境界上か・整数になるかを判定する"}
      - {type: phrase, text: "K 点以上を通る直線の数・平行な辺の組（台形）の数"}
      - {type: phrase, text: "絶対誤差または相対誤差 10^-6〜10^-9 まで許される"}
      - {type: constraint, text: "座標が 10^9 規模の整数で、傾きや角度を比べる"}
    acl: []
    verify: []
    frequency: B
    frequency_evidence: "recent 1（abc467_d）・前提として 1 ページに届く（直接 1）・古い ABC 7 問"
    sections:
      - {title: "double の精度の目安（仮数 53 ビット・値 10^9 で絶対誤差 10^-7 程度）と桁落ち", anchor: double-precision}
      - {title: "小数の入力を 10^k 倍して整数にする（文字列で読んで整数にする）", anchor: scale-to-integer}
      - {title: "比較は外積・内積・距離の 2 乗で（sqrt・atan2・除算を避ける）", anchor: integer-comparison}
      - {title: "方向・直線の正規化：gcd で約分し、(1, −1) と (−1, 1) を同じにする符号の決め方", anchor: line-normalization}
      - {title: "中点を整数にするために座標を 2 倍する", anchor: double-coordinates}
      - {title: "実数が避けられないとき：long double と、値の大きさに合わせた EPS", anchor: eps}
      - {title: "出力の桁数と、実数の二分探索の打ち切り", anchor: output-and-binary-search}
    merged_keys: [line-normalization]
    visual: {kind: static, priority: 2, text: "数直線上で double が表せる点の間隔が、値が大きいほど広がる図"}
    problems:
      - {id: abc169_c, role: example, summary: "整数と小数第 2 位までの数の積を、小数点以下を切り捨てて求める。", approach: "小数を 100 倍した整数として扱う（節 scale-to-integer）"}
      - {id: abc418_e, role: example, representative: true, summary: "N 点のうち 4 点を頂点とする台形の数を求める。", approach: "2 点の方向を gcd で約分して符号をそろえ、同じ向きの組の数から数える（節 line-normalization）"}
      - {id: abc385_f, role: example, summary: "（執筆時に確かめる）", approach: "隣り合うビルの頂点を結ぶ直線の傾きを比べる。double で計算すると桁落ちで許容誤差を超える（節 double-precision）"}
      - {id: abc467_d, role: practice, summary: "（執筆時に確かめる）", approach: "垂直二等分線の交差と直線の正規化を使う易しい幾何（research/00 §2.3.8 の分類による）"}
      - {id: abc248_e, role: practice, summary: "N 点のうち K 点以上を通る直線の数を求める。", approach: "直線を ax+by+c=0 の既約で符号をそろえた形にして数える"}
      - {id: abc191_d, role: practice, summary: "小数第 4 位までで与えられた円の内部にある格子点の数を求める。", approach: "10^4 倍して整数で判定する"}
      - {id: abc296_g, role: challenge, summary: "凸多角形と多数の点について、各点が内部・境界・外部のどこにあるかを答える。", approach: "double の偏角で行うと境界で誤る。整数の外積で行う（例題は convex-hull）"}
      - {id: abc220_g, role: challenge, summary: "重みの付いた点から 4 点を選んで等脚台形を作るときの、重みの和の最大を求める。", approach: "座標を 2 倍して中点を整数にし、中点と方向でまとめる（節 double-coordinates）"}
    problems_note: null
    sources: ["08-string-geo §4.8 geometry-precision・line-normalization", "08-string-geo §6.3（double の精度）", "06-math-nt rational-normalization", "09-cpp cpp-floating-point", "00-curriculum §2.3.8（abc467_d）"]

