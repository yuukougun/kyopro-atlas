# 題材別（patterns）の目次。担当 I。規則は planning/catalog/README.md（第2版）、上位の規則は planning/design.md と planning/design-review.md。
# - 問題に現れる「対象」（区間・部分列・順列・括弧列など）から引く案内ページ（type: pattern）。手法の説明は各分野のページに任せ、
#   sections に「問われ方 → 使う手法（ページ id）」を並べる。本文ではこれが表の行になり、anchor で行へ直接リンクできるようにする。
# - patterns は level・frequency を持たない（level: null）。節の level も持たない。prerequisites は空か最小限にし、行き先は related に書く。
# - 問題は表の行の代表だけ：例題0〜1・練習0〜3で、ほかのページの problems と重ならないもの（design-review D16）。力試しは置かない。
#   表の各行の問題は、行き先のページの例題・練習を本文から参照する。ほかのページが同じ問題を後から使うときは、題材別の側から外す。
# - 調査の key を持つのは bracket-sequence（research/00・08。README §6 で持ち主は patterns）と mex（research/00 の gap）だけ。ほかの8ページは新しい id。
# - 並び：列の題材（区間・部分列と部分文字列・順列・括弧列・mex・K 番目と中央値）→ 数（XOR・約数と倍数）→ 盤面（グリッド）→ 操作（操作列とクエリ）。
# - 第2版（2026-10-21）：問題を D16 に合わせて減らし（ほかのページと重なる問題を外した）、「部分列と部分文字列」「約数と倍数」を足した（01 指摘15・D16）。
#   統合・改名した id（segment-tree-binary-search・segment-tree-on-values・fractional-binary-search・xor-basis など）と、related に残っていた調査の key を
#   ページの id に直した（03 指摘21）。題名のかっこの補足を別名と summary に回した（D11）。
field: patterns
pages:
  - id: interval
    title: 区間
    aliases: [連続部分列, 部分配列, subarray, 区間の集合, interval]
    type: pattern
    level: null
    kind: [案内, 区間クエリ, 累積和・差分]
    prerequisites: []
    related: [prefix-sum, prefix-sum-counting, two-pointers, contribution, monotonic-stack, dp-sequence-partition, interval-dp, imos, fenwick-tree, segment-tree, lazy-segment-tree, sparse-table, difference-sequence, offline-queries, mo-algorithm, interval-scheduling, interval-set, event-sort, sweep-line-2d, subsequence-and-substring]
    summary: "連続部分列や与えられた区間の集合が出てくる問題で、問われ方から使う手法を引ける。連続部分列を数える・選ぶ、区間に操作して質問する、区間の集合を選ぶ・つなぐ、の3つの型に分ける。"
    signs:
      - {type: phrase, text: "和が K（K の倍数）になる連続部分列の個数"}
      - {type: phrase, text: "すべての連続部分列についての最小値・最大値・2 番目の値の総和"}
      - {type: phrase, text: "N 個の区間 [L_i, R_i] から重ならないように最大何個選べるか"}
      - {type: phrase, text: "区間を塗るたびに、塗られていない長さや個数を答える"}
      - {type: phrase, text: "区間に含まれる異なる値の個数を多数答える"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # 区間は半開区間 [l, r) で考える（長さは r − l、和は S_r − S_l）。区間は O(N²) 個あるので全部を見ずに数える。区間を (l, r) の 2 次元の点とみる
      - {title: "区間の和 → 累積和（prefix-sum）", anchor: sum}
      - {title: "和が K・K の倍数の区間の個数 → 累積和と連想配列（prefix-sum-counting）", anchor: count-by-sum}
      - {title: "伸び縮みで単調な条件 → 尺取り法（two-pointers）", anchor: monotone-window}                   # 和が K 以上、種類数が K 以下など。単調でなければ左端ごとに二分探索
      - {title: "全区間の最小値・最大値の総和 → 寄与と単調スタック（contribution, monotonic-stack）", anchor: sum-over-subarrays}  # 各要素が答えになる区間の数を数える。左右の大きい値・小さい値の位置は単調スタック
      - {title: "全区間の中央値・mex・転倒数 → 題材別の各ページ（kth-and-median, mex, permutation）", anchor: other-statistics}
      - {title: "列を区間に区切る方法の数・最適値 → 区間分割 DP（dp-sequence-partition）", anchor: partition}
      - {title: "縮めながら取り除く・隣どうしを合体させる → 区間 DP（interval-dp）", anchor: shrink-and-merge}
      - {title: "加算をまとめて最後に見る → いもす法（imos）", anchor: batch-add}
      - {title: "更新と質問が交互 → BIT・セグメント木（fenwick-tree, segment-tree, lazy-segment-tree）", anchor: online-updates}  # 区間への一括更新は遅延セグメント木
      - {title: "値が変わらない列の区間の最小値 → Sparse Table（sparse-table）", anchor: static-min}
      - {title: "区間に ±1 する操作の回数・可否 → 差分列への言い換え（difference-sequence）", anchor: difference}   # 差分列で 2 点の操作に言い換える
      - {title: "区間の異なる値の個数・x 以下の個数 → クエリの先読みと BIT、Mo（offline-queries, mo-algorithm）", anchor: offline}
      - {title: "重ならない最大個数・すべてを串刺しにする点の数 → 区間スケジューリング（interval-scheduling）", anchor: scheduling}
      - {title: "区間の和集合・塗りつぶし・残りの長さ → 区間を set で管理（interval-set）", anchor: union}            # 座標が 10^9 なら座標圧縮といもす法も
      - {title: "含まれる・交差する区間の数 → イベントソート・平面走査（event-sort, sweep-line-2d）", anchor: containment}
      - {title: "数列ではなく文字列の連続部分 → 部分列と部分文字列（subsequence-and-substring）", anchor: substrings}
      - {title: "落とし穴", anchor: pitfalls}                                                             # 閉区間と半開区間の混同、空区間の扱い、区間の数 N(N+1)/2 のオーバーフロー
    merged_keys: []
    visual: {kind: static, priority: 2, text: "連続部分列を (l, r) の 2 次元の点として描き、区間の数え上げが三角形の領域の数え上げになる様子を示す図"}
    problems:
      - {id: abc265_d, role: practice, summary: "数列の中で、隣り合う 3 つの区間の和が順に P, Q, R になる位置があるか判定する。", approach: "累積和の値を集合に入れ、x・x+P・x+P+Q・x+P+Q+R がすべてあるかを調べる"}
      - {id: abc189_c, role: practice, summary: "区間を 1 つ選び、区間の長さと区間の最小値の積の最大値を求める。", approach: "左端を固定して右へ伸ばしながら最小値を更新する全探索。N が大きければ単調スタック（ヒストグラムの最大長方形）"}
      - {id: abc457_e, role: practice, summary: "（執筆時に確かめる）", approach: "区間を端点でソートし、左から走査しながら二分探索する（research/00 §2.3.8 の分類）"}
    problems_note: "表の各行の代表問題は行き先のページの例題・練習を本文から参照する。ここには、ほかのページと重ならない3問だけを置いた"
    sources: ["01-basics §4（累積和・いもす法・尺取り法・区間スケジューリング・イベントソート）", "01-basics §6.2", "05-ds §4.A（interval-set・monotonic-stack）", "05-ds §4.C", "05-ds §4.D（offline-queries・mo-algorithm・sweep-line-2d）", "02-dp §4.C（dp-sequence-partition）", "02-dp §4.D", "00-curriculum §4.2（区間の種類数・平面走査・差分列への言い換え）", "00-curriculum §6.2（区間・列）", "00-curriculum §2.3.8（abc457_e）"]

  - id: subsequence-and-substring
    title: 部分列と部分文字列
    aliases: [部分列, 部分文字列, subsequence, substring]
    type: pattern
    level: null
    kind: [案内, 文字列, DP]
    prerequisites: []
    related: [subsequence-matching, dp-state-design, dp-mod-state, subsequence-dp, counting-dedup, dp-phase, lcs, lis, rolling-hash, z-algorithm, suffix-array, palindrome, interval-dp, string-automaton-dp, string-basics, interval]
    summary: "部分列（飛び飛びに選ぶ）と部分文字列（連続する部分）が出てくる問題で、問われ方から使う手法を引ける。判定・選び方の数・異なるものの数・最長の共通部分・種類数の問われ方に分ける。"
    signs:
      - {type: phrase, text: "T が S の部分列か判定する"}
      - {type: phrase, text: "S から何文字か選んで順に並べると T になる選び方の数"}
      - {type: phrase, text: "S の部分列として現れる異なる文字列の個数"}
      - {type: phrase, text: "S の部分文字列の種類数"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # 部分列は順序を保って飛び飛びに選ぶ（2^N 個）、部分文字列は連続（O(N²) 個）。取り違えやすい（method-comparison#similar-names）
      - {title: "T が S の部分列か → 前から貪欲に照合・次の出現位置の表（subsequence-matching）", anchor: is-subsequence}  # 部分列でない最短の文字列、辞書順最小の部分列も
      - {title: "T が部分列として現れる選び方の数 → 照合した文字数を状態にした DP（dp-state-design）", anchor: count-occurrences}
      - {title: "条件を満たす部分列の数 → 末尾の文字や余りを状態にした DP（dp-state-design, dp-mod-state）", anchor: count-with-condition}  # 隣が異なる、和が K の倍数など
      - {title: "異なる部分列の数 → 部分列 DP と代表元の決め方（subsequence-dp, counting-dedup）", anchor: distinct-subsequences}
      - {title: "i < j < k の位置の組の数 → 段階を状態にした DP（dp-phase）", anchor: index-tuples}
      - {title: "最長共通部分列・最長増加部分列 → LCS・LIS（lcs, lis）", anchor: longest}
      - {title: "部分文字列の一致・比較 → ローリングハッシュ・Z（rolling-hash, z-algorithm）", anchor: substring-match}
      - {title: "部分文字列の種類数・K 番目 → Suffix Array（suffix-array）", anchor: distinct-substrings}
      - {title: "回文の部分文字列・部分列 → 回文のページと区間 DP（palindrome, interval-dp）", anchor: palindromes}
      - {title: "T を部分文字列に含まない文字列の数 → 照合の状態を持つ DP（string-automaton-dp）", anchor: avoid-substring}
      - {title: "数列の連続部分列 → 題材別の区間（interval）", anchor: subarrays}
      - {title: "落とし穴", anchor: pitfalls}                                                             # 部分列と部分文字列の取り違え、空の部分列を数えるか、同じ文字列を取り方の数だけ重複して数える
    merged_keys: []
    visual: {kind: static, priority: 2, text: "同じ文字列の上に、部分列（飛び飛びの印）と部分文字列（連続した枠）を並べて描き、違いを示す図"}
    problems:
      - {id: abc211_c, role: example, summary: "文字列 S から 8 文字を選んで順に並べると chokudai になる選び方の数を、10^9+7 で割った余りで求める。", approach: "chokudai の何文字目まで選び終えたかを状態にした DP。S を 1 文字ずつ見て、一致する位置の状態から 1 つ先へ足す"}
      - {id: abc456_d, role: practice, summary: "（執筆時に確かめる）", approach: "末尾の文字ごとに部分列の数を持つ DP（research/00 §2.3.8 の分類）"}
    problems_note: "表の各行の代表問題は行き先のページ（subsequence-matching・subsequence-dp・lcs・lis など）の例題・練習を本文から参照する。abc215_e は裏付けが AtCoder Tags の投票だけなので外した（dp の open_issues と同じ扱い）"
    sources: ["review/01-learner 指摘15", "08-string-geo §4.1（subsequence-matching・subsequence-dp）", "08-string-geo §2.3", "02-dp §4.C（lis・lcs・subsequence-dp・dp-phase）", "02-dp §5（dp-basics の abc211_c）", "00-curriculum §2.3.8（abc456_d）"]

  - id: permutation
    title: 順列と置換
    aliases: [permutation, 置換, 1〜N の順列]
    type: pattern
    level: null
    kind: [案内, 数え上げ, 考察]
    prerequisites: []
    related: [permutation-cycles, construction, inversion-number, permutation-parity, functional-graph, doubling, insertion-dp, inclusion-exclusion, binomial-coefficient, bit-full-search, lis]
    summary: "1〜N の順列が与えられる問題で、問われ方から使う手法を引ける。i → P_i の矢印のサイクル、swap の回数と偶奇、置換の繰り返し、順列の数え上げ、辞書順の問われ方に分ける。"
    signs:
      - {type: phrase, text: "(1, 2, …, N) の順列 P が与えられる"}
      - {type: phrase, text: "任意の 2 要素の swap を繰り返してソートする最小回数"}
      - {type: phrase, text: "隣り合う 2 要素の swap でソートする最小回数"}
      - {type: phrase, text: "ちょうど K 回の swap（10^100 回など）で作れる列"}
      - {type: phrase, text: "置換を K 回（K ≤ 10^18）適用した結果"}
      - {type: phrase, text: "条件を満たす順列の個数"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # i → P_i の矢印はいくつかのサイクルに分かれる（入る辺と出る辺が1本ずつの Functional graph）。逆置換（pos[P_i] = i）と置換の合成
      - {title: "任意の swap でソートする最小回数・手順 → 置換の巡回分解（permutation-cycles, construction）", anchor: any-swap}  # N − サイクルの数。手順の構築
      - {title: "隣接 swap でソートする最小回数 → 転倒数（inversion-number）", anchor: adjacent-swap}
      - {title: "ちょうど K 回の swap で作れるか → 置換の偶奇（permutation-parity）", anchor: swap-parity}          # 3 要素の巡回だけで作れるかも偶奇
      - {title: "置換を K 回適用した結果 → サイクルごとの周期・ダブリング（functional-graph, doubling）", anchor: repeat}
      - {title: "位置と値の両方から引く操作 → 逆置換を同時に持つ", anchor: inverse}                           # 順列と逆置換の 2 つの配列を同時に更新する（題材の性質の節の応用）
      - {title: "条件を満たす順列の数 → 挿入 DP・撹乱順列（insertion-dp, inclusion-exclusion）", anchor: counting}   # 相対順位を状態にする挿入 DP、未確定の数を持つ箱根駅伝 DP、包除原理と撹乱順列
      - {title: "辞書順で何番目・K 番目の順列 → 残りの並べ方の数・順列全探索（binomial-coefficient, bit-full-search）", anchor: lexicographic}  # N ≤ 8 程度なら next_permutation で全探索
      - {title: "増加部分列・いくつの増加部分列に分けるか → LIS（lis）", anchor: increasing}
      - {title: "落とし穴", anchor: pitfalls}                                                             # 任意 swap と隣接 swap の混同、同じ値があるときの偶奇（同じ値の入れ替えで偶奇を調整できる）、1-indexed の順列を 0-indexed に直すときのずれ
    merged_keys: []
    visual: {kind: static, priority: 2, text: "i → P_i の矢印のサイクル図。同じサイクルの 2 要素の swap でサイクルが 2 つに割れ、別のサイクルどうしでは 1 つにつながる様子（置換の巡回分解のページの図と共有してよい）"}
    problems:
      - {id: abc470_d, role: practice, summary: "（執筆時に確かめる）", approach: "位置 → 値と値 → 位置（逆置換）の 2 つの配列を同時に更新しながら操作を処理する（research/00 §2.3.8 の分類）"}
      - {id: abc150_c, role: practice, summary: "長さ N の 2 つの順列 P, Q が、すべての順列を辞書順に並べたときそれぞれ何番目かを求め、その差の絶対値を答える。", approach: "N ≤ 8 なので next_permutation で全順列を列挙して位置を探す"}
    problems_note: "表の各行の代表問題（abc436_e・abc190_f・abc470_f・dp_t・abc367_e など）は行き先のページにあるので本文から参照する"
    sources: ["00-curriculum §4.2（置換の巡回分解・置換の偶奇、転倒数）", "00-curriculum §5.1", "07-math-comb §4.4（permutation-cycles）", "07-math-comb §4.3（derangement）", "05-ds §4.C（inversion-number）", "03-graph §4.C（functional-graph）", "02-dp §4.H", "01-basics §4（順列全探索・ダブリング）", "00-curriculum §2.3.8（abc470_d）"]

  - id: bracket-sequence
    title: 括弧列
    aliases: [正しい括弧列, カッコ列, parentheses, バランスの取れた括弧列, bracket sequence]
    type: pattern
    level: null
    kind: [案内, 文字列, 累積和・差分]
    prerequisites: [prefix-sum]
    related: [stack-techniques, dp-state-design, reflection-principle, lazy-segment-tree, segment-tree-monoids, exchange-argument, greedy-priority-queue, parsing]
    summary: "括弧列が出てくる問題で、判定・数え上げ・区間の判定・並べる順序・価値の最大化の手法を引ける。'(' を +1、')' を −1 とした累積和が途中で負にならず最後に 0 なら正しい、という言い換えが共通の出発点になる。"
    signs:
      - {type: phrase, text: "'(' と ')' からなる文字列が正しい括弧列か判定する"}
      - {type: phrase, text: "? を ( か ) に置き換えて正しい括弧列にする方法の数"}
      - {type: phrase, text: "文字の入れ替えのたびに、区間が正しい括弧列かを答える"}
      - {type: phrase, text: "複数の括弧列を並べて連結し、正しい括弧列にできるか"}
      - {type: phrase, text: "長さ 2N の正しい括弧列の個数"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # ±1 の累積和はいま開いている括弧の数。途中で負にならず最後に 0 ⇔ 正しい括弧列。（累積和の最小値, 合計）の要約は連結しても計算できる（モノイドになる）
      - {title: "1 種類の括弧の判定 → ±1 の累積和（prefix-sum）", anchor: check}
      - {title: "複数種類の括弧・入れ子の構造 → スタック（stack-techniques）", anchor: stack}               # 対応する括弧を取り除き続けた結果も、開き括弧の位置をスタックに積む
      - {title: "? の埋め方の数・条件を満たす括弧列の数 → 開いている数を状態にした DP（dp-state-design）", anchor: counting}  # 長さ 2N の正しい括弧列の数はカタラン数（reflection-principle）
      - {title: "区間が正しい括弧列か（更新あり）→ 累積和の区間加算と区間の最小値（lazy-segment-tree）", anchor: range-check}  # 条件は「区間内の累積和の最小 ≥ 始点の値」かつ「始点と終点の値が等しい」
      - {title: "（合計, 最小値）をセグメント木に載せる → モノイドの設計（segment-tree-monoids）", anchor: monoid}
      - {title: "複数の括弧列を並べる順序 → 要約して 2 組に分けてソート（exchange-argument）", anchor: ordering}  # 合計が増えるものと減るものに分ける
      - {title: "価値が最大の正しい括弧列 → 先頭からの条件に言い換えて優先度付きキュー（greedy-priority-queue）", anchor: max-value}  # 「先頭 2i−1 文字に ( が i 個以上」
      - {title: "数式・入れ子の構造の解析 → 構文解析（parsing）", anchor: parsing}
      - {title: "落とし穴", anchor: pitfalls}                                                             # 複数種類の括弧を累積和だけで判定する、並べる順序を1つの基準でソートする、区間の判定で始点の累積和を引き忘れる
    merged_keys: []
    visual: {kind: static, priority: 2, text: "折れ線（山脈）の図：'(' で上がり ')' で下がる。0 の線を下回る位置で失敗、最後が 0 で成功。連結は折れ線をつなぐ図"}
    problems:
      - {id: abc407_e, role: example, summary: "長さ 2N の数列が与えられ、長さ 2N の正しい括弧列のうち、( を置いた位置の値の和の最大値を求める。", approach: "「先頭 2i−1 文字に ( が i 個以上」と言い換え、先頭から見ながら優先度付きキューで値の大きい位置を 1 つずつ選ぶ貪欲"}
      - {id: abc394_d, role: practice, summary: "3 種類の括弧からなる文字列が、正しい括弧列か判定する。", approach: "開き括弧をスタックに積み、閉じ括弧で種類の対応を確かめる"}
      - {id: abc454_d, role: practice, summary: "（執筆時に確かめる）", approach: "スタックで括弧を含む表現を正規化する（research/00 §2.3.8 の分類）"}
      - {id: abc167_f, role: practice, summary: "N 個の括弧列をすべて好きな順に連結して、正しい括弧列にできるか判定する。", approach: "各列を（累積和の最小値, 合計）に要約し、合計が正のものは最小値の大きい順に、負のものは逆向きに見た条件で並べる貪欲"}
