  - id: mex
    title: mex
    aliases: [minimum excluded, 含まれない最小の非負整数, まだ出ていない最小の値]
    type: pattern
    level: null
    kind: [案内, データ構造, 考察]
    prerequisites: []
    related: [ordered-set, segment-tree-binary-search, interval-set, fix-variable, contribution, two-pointers, lazy-segment-tree, grundy-number, construction]
    summary: "集合に含まれない最小の非負整数 mex を求める・更新する・総和を取る問題で、問われ方から使う手法を引ける。「N 要素の mex は N 以下」「mex ≥ k+1 ⇔ 0〜k をすべて含む」の 2 つの性質から考える。"
    signs:
      - {type: phrase, text: "含まれない最小の非負整数（mex）を答える"}
      - {type: phrase, text: "1 点を書き換えるたびに数列の mex を答える"}
      - {type: phrase, text: "長さ M の全区間の mex の最小値"}
      - {type: phrase, text: "全区間・全パスの mex の総和"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # N 要素の mex は N 以下なので、N より大きい値は無視してよい（出現回数の配列は大きさ N+1 で足りる）。mex ≥ k+1 ⇔ 0〜k をすべて含む
      - {title: "更新のたびに mex を答える → 出現回数 0 の値の set・セグメント木上の二分探索（ordered-set, segment-tree-binary-search）", anchor: online-mex}
      - {title: "値が区間でまとめて入る → 区間を set で管理（interval-set）", anchor: interval-values}
      - {title: "区間・窓の mex の最小値・最大値 → 値を固定して出現位置の間隔を見る（fix-variable）", anchor: window-mex}
      - {title: "全区間・全パスの mex の総和 → mex ≥ k+1 の数を足す主客転倒（contribution, two-pointers, lazy-segment-tree）", anchor: sum-of-mex}  # 区間なら尺取りと遅延セグメント木を組み合わせる
      - {title: "ゲームの局面の値 → Grundy 数（grundy-number）", anchor: grundy}                          # Grundy 数は遷移先の Grundy 数の mex
      - {title: "mex を指定した値にする構築 → 0〜k−1 を入れて k を入れない（construction）", anchor: construction}
      - {title: "落とし穴", anchor: pitfalls}                                                             # 値の上限で打ち切らずに大きすぎる配列を取る、mex が N になる場合を忘れる、多重集合で出現回数を数えずに set から消してしまう
    merged_keys: []
    visual: {kind: static, priority: 2, text: "数直線上に出現する値を塗り、最初の空きのマスを mex として示す図。更新で空きが動く様子を添える"}
    problems:
      - {id: abc194_e, role: example, summary: "長さ N の数列の、長さ M の連続部分列すべてについての mex の最小値を求める。", approach: "値 k を小さい順に固定し、k を含まない長さ M の区間があるかを k の出現位置の間隔で調べる"}
      - {id: abc438_f, role: practice, summary: "木のすべてのパスについての mex の総和を求める。", approach: "mex ≥ k+1 となるパス（0〜k をすべて含むパス）の数を k について足す主客転倒。0〜k を含むパスの端の候補を k を増やしながら更新する"}
    problems_note: "練習の候補はほかのページの例題・練習と重なる（abc330_e・abc368_f・abc470_g など）ので本文から参照する"
    sources: ["00-curriculum §4.2（mex）", "00-curriculum §5.1", "05-ds §4.A（ordered-set・interval-set）", "05-ds §4.C（segtree-binary-search）", "07-math-comb §4.6（grundy-number・grundy-patterns）"]

  - id: kth-and-median
    title: K 番目と中央値
    aliases: [K 番目, 中央値, メディアン, 上位 K 個, median]
    type: pattern
    level: null
    kind: [案内, 二分探索, データ構造]
    prerequisites: []
    related: [kth-value, binary-search-answer, priority-queue, top-k-multiset, kth-element, segment-tree-on-values, ordered-set, balanced-bst, offline-queries, wavelet-matrix, fractional-binary-search, median-absolute, binomial-coefficient, dp-reconstruction, xor-basis]
    summary: "K 番目に小さい値・上位 K 個の和・中央値を問う問題で、データの動き方から手法を引ける。構造で保つか、「x 以下が K 個以上か」で答えを二分探索するか、小さい順に取り出すかを選ぶ。"
    signs:
      - {type: phrase, text: "K 番目に小さい（大きい）値を答える"}
      - {type: phrase, text: "N² 個の積・和・差の中で K 番目"}
      - {type: phrase, text: "値の追加・更新のたびに、大きい方から K 個の和を答える"}
      - {type: phrase, text: "中央値の最大値・最小値"}
      - {type: phrase, text: "Σ|x − a_i| を最小にする x"}
      - {type: phrase, text: "辞書順で K 番目のもの"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # K 番目 ≤ x ⇔ x 以下が K 個以上（個数の単調性）。中央値は「x 以上が半分を超えるか」に言い換えられる。偶数個のときの中央値の定義に注意
      - {title: "候補が多すぎて並べられない → x 以下の個数で答えを二分探索（kth-value, binary-search-answer）", anchor: count-and-search}  # N² 個の積など
      - {title: "値を追加しながら K 番目・上位 K 個 → 優先度付きキュー・2 つの multiset（priority-queue, top-k-multiset）", anchor: streaming}  # K が固定なら K 個を保つ。上位 K 個の和・中央値の更新は 2 つの multiset
      - {title: "追加と削除がある K 番目 → BIT 上の二分探索・値を添字にするセグメント木（kth-element, segment-tree-on-values）", anchor: dynamic}  # k が小さければ multiset から k 歩（ordered-set）、オンラインで値域が大きければ平衡二分探索木（balanced-bst）。method-comparison#containers から参照される
      - {title: "小さい方から K 個の解を列挙 → 優先度付きキューで最小を取り出す（kth-value）", anchor: k-best}
      - {title: "区間の K 番目・x 以下の個数 → クエリの先読みと BIT、Wavelet Matrix（offline-queries, wavelet-matrix）", anchor: range-kth}
      - {title: "中央値・平均の最大化 → 値を引く・±1 にして符号で判定する二分探索（fractional-binary-search）", anchor: maximize-median}
      - {title: "Σ|x − a_i| の最小 → 中央値を選ぶ（median-absolute）", anchor: absolute-sum}             # 更新があれば 2 つのヒープで中央値を保つ（top-k-multiset）
      - {title: "辞書順で K 番目の文字列・順列 → 残りの個数を数えて先頭から決める（binomial-coefficient, dp-reconstruction）", anchor: lexicographic-kth}
      - {title: "XOR で作れる値の K 番目 → XOR 基底（xor-basis）", anchor: xor-kth}
      - {title: "落とし穴", anchor: pitfalls}                                                             # K が 0-indexed か 1-indexed か、同じ値が複数あるときの順位、二分探索の判定が「x 以下」か「x 未満」か
    merged_keys: []
    visual: {kind: static, priority: 2, text: "値を数直線に並べ、x を動かしたときの「x 以下の個数」の階段グラフで、高さ K を初めて超える x が K 番目になる様子を示す図"}
    problems: []
    problems_note: "表の各行の代表問題（abc234_d・abc306_e・abc155_d・abc241_d・abc127_f など）はすべて行き先のページの例題・練習にあり、ほかのページと重ならない問題がない（D16）。本文の表から参照する"
    sources: ["01-basics §4（K 番目の値・中央値の二分探索・絶対値の和と中央値・優先度付きキューで列挙）", "01-basics §7.1", "05-ds §4.A（priority-queue・top-k-multiset・ordered-set）", "05-ds §4.C（kth-element・segtree-on-values）", "05-ds §4.E", "02-dp §4.A（dp-kth-lexicographic）", "07-math-comb §4.2（kth-combination）", "00-curriculum §4.2（上位 K 個の和・分数計画）", "00-curriculum §6.2（K 番目／中央値）"]

  - id: xor
    title: XOR
    aliases: [排他的論理和, ビットごとの排他的論理和, exclusive or]
    type: pattern
    level: null
    kind: [案内, ビット演算, 線形代数・行列]
    prerequisites: [bit-operations]
    related: [bitwise-independence, prefix-sum, fenwick-tree, tree-distance, binary-trie, xor-basis, digit-dp, two-pointers, meet-in-the-middle, nim, grundy-number, hashing-for-sets, hadamard-transform]
    summary: "XOR が出てくる問題で、問われ方から使う手法を引ける。桁ごとに独立で、同じ値どうしで打ち消し合う、という 2 つの性質から、桁ごとの数え上げ・累積 XOR・XOR 基底・Binary Trie・Nim・集合のハッシュへつなぐ。"
    signs:
      - {type: phrase, text: "すべての組・すべての区間の XOR の総和"}
      - {type: phrase, text: "x を選んで XOR の最大値・最小値を求める"}
      - {type: phrase, text: "いくつか選んだ XOR で作れる値・作れる値の個数・K 番目"}
      - {type: phrase, text: "区間の XOR・木のパスの XOR・経路の XOR"}
      - {type: phrase, text: "石を取り合うゲームで、山の石の数の XOR"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # 桁どうしが干渉しない。a xor a = 0、順序を入れ替えてよい。a + b = (a xor b) + 2(a and b)。0 から n までの XOR は n mod 4 で決まる
      - {title: "全ペア・全区間の XOR の和 → 桁ごとに 0 と 1 の個数を数える（bitwise-independence）", anchor: sum-of-xor}
      - {title: "区間の XOR → 累積 XOR、更新があれば BIT（prefix-sum, fenwick-tree）", anchor: range-xor}
      - {title: "木の 2 点間のパスの XOR → 根からの XOR どうしの XOR（tree-distance）", anchor: tree-path}
      - {title: "x を選んで XOR の最大・最小、2 要素の XOR の最小 → 上位ビットから決める・Binary Trie（bitwise-independence, binary-trie）", anchor: choose-x}
      - {title: "選んだ XOR で作れる値・最大値・K 番目 → XOR 基底（xor-basis）", anchor: basis}
      - {title: "グラフの経路の XOR の最小 → 閉路の XOR を基底にする（xor-basis）", anchor: path-xor}       # graph の xor-path は xor-basis の節に統合された
      - {title: "XOR が絡む条件を満たす数の個数 → 桁 DP（digit-dp）", anchor: digit-dp}                    # a + b = a xor b、x ≤ K など
      - {title: "XOR と和が等しい区間の数 → 尺取り法（two-pointers）", anchor: xor-equals-sum}              # どの bit も重ならない条件は区間を縮めても保たれる
      - {title: "小さいグリッドの経路の XOR → 半分全列挙（meet-in-the-middle）", anchor: meet-in-the-middle}
      - {title: "石取りゲーム → Nim・Grundy 数（nim, grundy-number）", anchor: games}                      # Nim は山の XOR が 0 かどうか、独立なゲームの和は Grundy 数の XOR
      - {title: "2 つの集合が一致するか → 乱数の XOR によるハッシュ（hashing-for-sets）", anchor: set-hash}    # 多重集合には和を使う
      - {title: "添字の XOR で畳み込む → アダマール変換（hadamard-transform）", anchor: xor-convolution}
      - {title: "落とし穴", anchor: pitfalls}                                                             # 足し算は繰り上がりで桁が干渉するので桁ごとに分けられない、XOR のハッシュは同じ要素 2 つで打ち消す、C++ で ^ は == より優先順位が低い
    merged_keys: []
    visual: {kind: static, priority: 2, text: "数を 2 進表記で縦に並べ、桁ごとに 0 と 1 の個数を数える図（bit ごとに独立に考えるページの図と共有してよい）"}
    problems:
      - {id: abc171_e, role: example, summary: "N 人（N は偶数）それぞれについて自分以外の全員の値の XOR が与えられるとき、各人の値を求める。", approach: "与えられた値をすべて XOR すると全員の値の XOR になり、それと各人に与えられた値の XOR がその人の値になる（同じ値は打ち消し合う）"}
      - {id: abc197_c, role: practice, summary: "数列をいくつかの連続した区間に区切り、各区間の OR をすべて XOR した値の最小値を求める。", approach: "区切り方 2^(N−1) 通りを bit 全探索する"}
    problems_note: null
    sources: ["01-basics §4（bit 演算の基本と XOR の性質・桁ごとに独立に考える）", "00-curriculum §4.2（bit ごとに独立に考える）", "00-curriculum §6.2（整数）", "06-math-nt §4.6（xor-basis）", "05-ds §4.E（binary-trie）", "08-string-geo §4.5（binary-trie）", "03-graph §4.B（xor-path）", "04-tree §4.4", "07-math-comb §4.6（nim）", "01-basics §5（abc171_e・abc197_c）"]

  - id: divisors-and-multiples
    title: 約数と倍数
    aliases: [約数, 倍数, divisor, multiple]
    type: pattern
    level: null
    kind: [案内, 整数論]
    prerequisites: []
    related: [divisor-enum, divisor-count-bound, harmonic-sum, spf-sieve, prime-factorization, multiplicative-function, divisor-inclusion-exclusion, mobius-function, zeta-mobius-divisor, prime-exponent-vector, gcd-lcm, gcd-properties, floor-quotient-enum, integer-division]
    summary: "約数・倍数・gcd が出てくる問題で、問われ方から使う手法を引ける。約数の列挙、倍数を回して集める調和級数、素因数分解、gcd がちょうど g の数え上げ、約数の個数の上限の問われ方に分ける。"
    signs:
      - {type: constraint, text: "N ≤ 10^12 で、N の約数や素因数を使う"}
      - {type: phrase, text: "1 以上 N 以下のすべての整数について、約数や倍数に関する値の総和を求める"}
      - {type: phrase, text: "gcd がちょうど g になる組・部分集合の個数"}
      - {type: phrase, text: "積がちょうど N になる列の個数"}
      - {type: phrase, text: "積が平方数になる組の個数"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # 約数は √N までの組で列挙できる。10^18 以下でも約数の個数は高々 103680。1〜N の倍数の個数の和は N/1 + N/2 + … = O(N log N)
      - {title: "1 つの数の約数を列挙 → √N までの割り算（divisor-enum）", anchor: enumerate}
      - {title: "約数の個数で計算量を見積もる → 約数の個数の上限（divisor-count-bound）", anchor: count-bound}  # 高度合成数の列挙も
      - {title: "1〜N の各数の約数・倍数を集める → 倍数を回す調和級数（harmonic-sum）", anchor: harmonic}
      - {title: "素因数分解 → 多数なら最小素因数の篩、1 つなら試し割り（spf-sieve, prime-factorization）", anchor: factorize}
      - {title: "約数の個数・約数の和 → 素因数分解の指数から（multiplicative-function）", anchor: divisor-functions}
      - {title: "gcd がちょうど g の組の数 → 倍数で数えて大きい方から引く・メビウス関数（divisor-inclusion-exclusion, mobius-function）", anchor: exact-gcd}
      - {title: "約数・倍数の向きの累積和 → 約数のゼータ変換・メビウス変換（zeta-mobius-divisor）", anchor: zeta}
      - {title: "積が平方数・積がちょうど N → 素因数の指数で考える（prime-exponent-vector）", anchor: products}   # 約数を状態にした DP も（abc461_f。問題は divisor-count-bound の練習にあるので本文から参照する）
      - {title: "差の gcd・区間の gcd の値の種類 → gcd の性質（gcd-lcm, gcd-properties）", anchor: gcd}
      - {title: "⌊N/i⌋ の値ごとにまとめる → floor の値の列挙（floor-quotient-enum）", anchor: floor-sums}
      - {title: "落とし穴", anchor: pitfalls}                                                             # 平方数で √N の約数を二重に数える、i*i のオーバーフロー、0 や 1 の約数・負の数の割り算（integer-division）
    merged_keys: []
    visual: {kind: static, priority: 2, text: "1〜N を並べ、各 d から倍数へ矢印を引いた図（矢印の総数が N/1 + N/2 + … ≈ N log N になる様子）"}
    problems:
      - {id: abc180_c, role: practice, summary: "N 個の品物を何人かで余りなく等しく分けるとき、分けられる人数をすべて小さい順に出力する。", approach: "i ≤ √N の i で割り切れるか調べ、i と N/i を集めてソートする"}
      - {id: typical90_bw, role: practice, summary: "（執筆時に確かめる）", approach: "素因数分解して素因数の個数（重複を含む）k を数え、操作回数は ⌈log₂ k⌉ になる"}
    problems_note: null
    sources: ["review/01-learner 指摘15", "06-math-nt §4.3（divisor-enum・divisor-count-bound・harmonic-sum・prime-exponent-vector）", "06-math-nt §4.4（gcd-properties）", "07-math-comb §4.3（divisor-inclusion-exclusion・zeta-mobius-divisor）", "06-math-nt §5（abc180_c・typical90_bw）"]

  - id: grid
    title: グリッド
    aliases: [マス目, 盤面, H×W, 二次元配列, grid]
    type: pattern
    level: null
    kind: [案内, グラフ探索, DP]
    prerequisites: []
    related: [grid-graph, bfs, zero-one-bfs, extended-dijkstra, union-find, dp-grid, lattice-paths, inclusion-exclusion-dp, prefix-sum-2d, imos, sweep-line-2d, manhattan-chebyshev, coordinate-compression, parity, rotation-transform, brute-force, bipartite-matching, broken-profile-dp, operation-sequence]
    summary: "H×W のマス目が出てくる問題で、問われ方から使う手法を引ける。マスを頂点とする最短路、右・下に進む DP、長方形の累積和、行と列の独立、市松模様の偶奇、45 度回転、盤面の回転へつなぐ。"
    signs:
      - {type: phrase, text: "H×W のマス目で、スタートからゴールへの最小の移動回数"}
      - {type: phrase, text: "右か下にだけ進む経路の数・経路上の値の最大"}
      - {type: phrase, text: "長方形の範囲の和・黒マスの個数を多数答える"}
      - {type: phrase, text: "1×2 のタイル（ドミノ）を敷き詰める・置く"}
      - {type: phrase, text: "盤面を 90 度回転・反転させて一致させる"}
      - {type: phrase, text: "斜めに動く駒・マンハッタン距離・ひし形の範囲"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # マスを頂点・隣り合うマスを辺とするグラフ。(行 + 列) の偶奇の市松模様は二部グラフ。座標は (行, 列) の 0-indexed で書き、x・y との対応を決める
      - {title: "最小の移動回数 → グリッドの BFS・01-BFS（grid-graph, bfs, zero-one-bfs）", anchor: shortest}  # 複数の始点は多始点 BFS（bfs の節）
      - {title: "向き・残り回数などの状態がある・盤面全体が状態 → 状態を頂点にする（extended-dijkstra）", anchor: states}
      - {title: "連結成分・塗りつぶし → DFS・BFS・Union-Find（union-find）", anchor: components}
      - {title: "右か下にだけ進む → グリッドの DP・格子路（dp-grid, lattice-paths）", anchor: right-down}       # 障害物のある巨大なグリッドの経路の数は包除の DP（inclusion-exclusion-dp）
      - {title: "長方形の和・長方形への加算 → 2 次元累積和・2 次元いもす法（prefix-sum-2d, imos）", anchor: rectangles}  # 更新と質問が交互・先読みできるなら平面走査（sweep-line-2d）
      - {title: "行と列を選ぶ・行と列への操作 → 行と列を独立に考える・別々に座標圧縮（manhattan-chebyshev, coordinate-compression）", anchor: rows-cols}  # 最後の操作だけが効く操作は operation-sequence#overwrite
      - {title: "到達・敷き詰めの可否 → 市松模様の偶奇（parity）", anchor: checkerboard}
      - {title: "斜めの移動・マンハッタン距離・ひし形の範囲 → 45 度回転・斜めの座標（manhattan-chebyshev）", anchor: diagonal}  # 斜めの列は r+c・r−c で番号を付ける
      - {title: "盤面の回転・反転・平行移動 → 添字の対応の式・全部試す（rotation-transform, brute-force）", anchor: rotation}
      - {title: "ドミノの配置・隣り合わないマスの選び方 → 二部マッチング・プロファイル DP（bipartite-matching, broken-profile-dp）", anchor: tiling}  # 幅が小さい盤面の塗り方の数はプロファイル DP
      - {title: "落とし穴", anchor: pitfalls}                                                             # 範囲外の判定、H と W の取り違え、行と列の向きと x・y の対応、BFS の距離の初期値と訪問済みの印を付ける時点
    merged_keys: []
    visual: {kind: static, priority: 2, text: "グリッドに市松模様の色を付け、隣り合うマスが必ず違う色であることを示す図（BFS の層の動く図は BFS のページのものを使う）"}
    problems:
      - {id: abc464_e, role: practice, summary: "（執筆時に確かめる）", approach: "長方形の範囲への操作を、後ろから伝播させる 2 次元のいもす法の変形で処理する（research/00 §2.3.8 の分類）"}
      - {id: abc472_d, role: practice, summary: "（執筆時に確かめる）", approach: "すべての始点を最初にキューへ入れる多始点 BFS（research/00 §2.3.8 の分類）"}
    problems_note: "表の各行の代表問題（abc176_d・abc311_e・abc454_e・abc383_c など）は行き先のページにあるので本文から参照する"
