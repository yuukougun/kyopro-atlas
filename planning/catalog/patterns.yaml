  - id: operation-sequence
    title: 操作列とクエリ
    aliases: [クエリの列, 操作の列, 逆順処理, シミュレーション]
    type: pattern
    level: null
    kind: [案内, クエリ処理の工夫, データ構造]
    prerequisites: []
    related: [global-offset, linked-list, stack-techniques, interval-set, union-find-applications, reverse-thinking, union-find-connectivity, offline-queries, mo-algorithm, event-sort, segment-tree, lazy-segment-tree, sqrt-decomposition, persistent-data-structures, root-path-dfs, rollback-union-find, periodicity, doubling]
    summary: "操作やクエリが Q 個続く問題で、問われ方から処理の仕方を引ける。全体の操作を変数で持つ、後ろから見る、削除を逆順の追加にする、先読みして並べ替える、過去の版に戻る、周期で打ち切る、などの型に分ける。"
    signs:
      - {type: phrase, text: "辺や頂点を 1 つずつ削除するたびに、連結成分の数を答える"}
      - {type: phrase, text: "全体に加算する・全体を反転する操作が混ざる"}
      - {type: phrase, text: "過去の状態に戻す・ある時点の状態をコピーする"}
      - {type: phrase, text: "行や列・区間を塗り替える操作の後の最終状態"}
      - {type: phrase, text: "同じ操作を 10^18 回繰り返した後の状態"}
    acl: []
    sections:
      - {title: "題材の性質", anchor: properties}                                                         # 1 回 O(log N) 以下で順に処理するか、まとめて（オフラインで）処理するか。まず「答えをその場で出す必要があるか」「後の操作が前の操作を打ち消すか」を確かめる
      - {title: "全体への加算・反転・回転 → 全体の操作を変数で持つ（global-offset）", anchor: global-ops}     # オフセット・反転フラグ・先頭の位置
      - {title: "列の途中への挿入・削除・付け替え → 配列で持つ連結リスト・deque（linked-list, stack-techniques）", anchor: insert-delete}
      - {title: "区間を塗る・同じ値の区間をつなぐ → 区間を set で管理・次の空きへ飛ぶ Union-Find（interval-set, union-find-applications）", anchor: paint}
      - {title: "後の操作が前の操作を上書きする → 後ろから見る（reverse-thinking）", anchor: overwrite}       # 行・列・区間の塗り替えは、後ろから見てまだ決まっていない場所だけを数える
      - {title: "削除が難しい → 逆順にして追加にする（union-find-connectivity）", anchor: reverse-deletion}  # 辺・頂点の削除と連結性
      - {title: "先読みしてよい → 並べ替えてまとめて処理・Mo・イベントにして走査（offline-queries, mo-algorithm, event-sort）", anchor: offline}
      - {title: "更新と質問が交互で区間を扱う → セグメント木・遅延セグメント木・平方分割（segment-tree, lazy-segment-tree, sqrt-decomposition）", anchor: online}
      - {title: "過去の版に戻る・版をコピーする → 版の木・永続データ構造（persistent-data-structures, root-path-dfs, rollback-union-find）", anchor: versions}  # 版の木は persistent-data-structures が持つ。巻き戻しは root-path-dfs、取り消せる Union-Find は rollback-union-find
      - {title: "同じ操作を非常に多く繰り返す → 周期で打ち切る・操作の合成をダブリング（periodicity, doubling）", anchor: repeat}
      - {title: "落とし穴", anchor: pitfalls}                                                             # クエリの添字が 1-indexed、逆順に処理したときの答えの並べ直し、全体の変数と個別の値に二重に適用する
    merged_keys: []
    visual: {kind: static, priority: 2, text: "クエリの列を時間軸に並べ、逆順処理では右から左へ辺を足していく様子を示す図（Union-Find の動く図はデータ構造のページのものを使う）"}
    problems:
      - {id: abc466_d, role: practice, summary: "（執筆時に確かめる）", approach: "行・列ごとに最後に残る操作だけを管理する（research/00 §2.3.8 の分類）"}
    problems_note: "表の各行の代表問題（abc158_d・abc229_e・abc253_f・abc212_d・abc273_e・abc461_e など）は行き先のページにあるので本文から参照する"
    sources: ["05-ds §4.A（global-offset・linked-list・stack-techniques・interval-set）", "05-ds §4.B（offline-reverse・union-find-next-pointer・rollback-union-find）", "05-ds §4.D（offline-queries・mo-algorithm・sqrt-decomposition・persistent-data-structures）", "03-graph §4.D（union-find-connectivity）", "04-tree §4.17（root-path-dfs）", "01-basics §4（後ろから・逆順に考える・周期性の検出・イベントソート）", "00-curriculum §2.3.8（abc466_d）", "00-curriculum §6.2（ゲーム・操作・その他）"]

