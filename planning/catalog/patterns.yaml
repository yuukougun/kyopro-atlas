  - id: operation-sequence
    title: 操作列とクエリ（逆順処理・先読み）
    aliases: [クエリ, 操作の列, 逆順処理, クエリ先読み, オフライン処理, シミュレーション]
    type: pattern
    level: null
    kind: [案内, クエリ処理の工夫, データ構造]
    prerequisites: []
    related: [global-offset, linked-list, stack-techniques, interval-set, union-find-next-pointer, reverse-thinking, offline-reverse, union-find-connectivity, offline-queries, mo-algorithm, segment-tree, lazy-segment-tree, sqrt-decomposition, root-path-dfs, persistent-data-structures, rollback-union-find, simulation-speedup, doubling, event-sort]
    summary: "操作やクエリが Q 個続く問題の案内。全体への操作を変数で持つ、最後の操作だけが効く、削除を逆順の追加にする、クエリを先読みして並べ替える、過去の版に戻る、周期で打ち切る、などの型を、データ構造と考察のページへ案内する。"
    signs:
      - {type: phrase, text: "Q 個のクエリを順に処理する（Q ≤ 2×10^5）"}
      - {type: phrase, text: "辺や頂点を1つずつ削除するたびに、連結成分の数を答える"}
      - {type: phrase, text: "全体に加算する・全体を反転する操作が混ざる"}
      - {type: phrase, text: "過去の状態に戻す・ある時点の状態をコピーする"}
      - {type: phrase, text: "行や列・区間を塗り替える操作の後の最終状態"}
      - {type: phrase, text: "同じ操作を 10^18 回繰り返した後の状態"}
    acl: []
    sections:
      - "題材の性質：Q 個の操作を1回 O(log N) 以下で処理するか、まとめて（オフラインで）処理するかの2つの道がある。まず「答えをその場で出す必要があるか」「後の操作が前の操作を打ち消すか」を確かめる"
      - "全体への加算・反転・回転 → 全体の操作を変数（オフセット・反転フラグ・先頭の位置）で持つ（global-offset）"
      - "列の途中への挿入・削除・付け替え → 配列で持つ連結リスト（linked-list）。両端だけなら deque（stack-techniques）"
      - "区間を塗る・同じ値の区間をまとめる → 区間を set で管理（interval-set）、次の空きへ飛ぶ Union-Find（union-find-next-pointer）"
      - "後の操作が前の操作を上書きする（行・列・区間の塗り替え）→ 後ろから見て、まだ決まっていない場所だけを数える（reverse-thinking）"
      - "削除が難しい（辺・頂点の削除と連結性）→ 逆順にして追加にする（offline-reverse, union-find-connectivity）"
      - "クエリを先読みしてよい → 並べ替えてまとめて処理する（offline-queries）。区間のクエリは Mo（mo-algorithm）。時刻と位置のイベントにして走査する（event-sort）"
      - "更新と質問が交互で区間を扱う → セグ木・遅延セグ木（segment-tree, lazy-segment-tree）。大小で場合分けが要るなら平方分割（sqrt-decomposition）"
      - "過去の版に戻る・版をコピーする → 版の木を DFS でたどって巻き戻す（root-path-dfs）、永続データ構造（persistent-data-structures）、取り消しのできる Union-Find（rollback-union-find、発展）"
      - "同じ操作を非常に多く繰り返す → 状態の周期を見つけて打ち切る（simulation-speedup）、操作の合成をダブリング（doubling）"
      - "落とし穴：クエリの添字が 1-indexed、逆順に処理したときの答えの並べ直し、全体の変数と個別の値に二重に適用する"
    merged_keys: []
    visual: "クエリの列を時間軸に並べ、逆順処理では右から左へ辺を足していく様子を示す静的な図（Union-Find の動く図はデータ構造のページのものを使う）"
    problems:
      - {id: abc158_d, role: example, summary: "文字列の反転と先頭・末尾への追加のクエリ。反転フラグと deque で、実際には反転しない"}
      - {id: abc229_e, role: example, summary: "頂点を順に消すたびの連結成分の数。逆順に頂点を足して Union-Find で数える"}
      - {id: abc253_f, role: example, summary: "行の上書き・列の範囲への加算・1マスの値の取得のクエリ。クエリを先読みし、答えを「最後の上書き」と「その後の加算」に分けて BIT で数える"}
      - {id: abc212_d, role: practice, summary: "袋への追加・全体への加算・最小値の取り出し。全体への加算をオフセットの変数で持つヒープ"}
      - {id: abc477_d, role: practice, summary: "後の操作が前の操作を覆い隠す操作列の結果を、クエリを逆順に処理して求める"}
      - {id: abc344_e, role: practice, summary: "値の直後への挿入と値の削除を繰り返した最終の列。前と次を連想配列で持つ連結リスト"}
      - {id: abc380_e, role: practice, summary: "同じ色でつながった区間を塗り替えるクエリと、色ごとのマス数のクエリ。区間を set（または Union-Find）でまとめる"}
      - {id: abc461_e, role: practice, summary: "行と列の塗り替えの後の状態。行・列ごとに最後の操作だけを管理し、寄与の差分をクエリ番号を添字にしたセグ木で数える"}
      - {id: abc273_e, role: practice, summary: "末尾への追加・削除・保存・読み込みの後の末尾を答える。各版が親を指す木で持つ"}
      - {id: abc453_g, role: challenge, summary: "数列のコピー・1点更新・区間和のクエリ。クエリを先読みして版の木を作り、オイラーツアーでたどる（オンラインなら永続セグ木）"}
      - {id: abc128_e, role: challenge, summary: "時間帯ごとに通行止めになる地点があり、各人が最初に止まる地点を答える。時刻をずらしてイベントにし、set で管理する"}
    sources: ["05-ds §4.A（global-offset・linked-list・stack-techniques・interval-set）", "05-ds §4.B（offline-reverse・union-find-next-pointer・rollback-union-find）", "05-ds §4.D（offline-queries・mo-algorithm・sqrt-decomposition・persistent-data-structures）", "03-graph §4.D（union-find-connectivity）", "04-tree §4.17（root-path-dfs）", "01-basics §4（後ろから・逆順に考える・周期性の検出・イベントソート）", "00-curriculum §2.3.8（abc477_d・abc461_e）", "00-curriculum §6.2（ゲーム・操作・その他）"]

