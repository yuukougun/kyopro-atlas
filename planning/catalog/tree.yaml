      - {type: phrase, text: "u が v の祖先か・v の子孫のうち深さ d のもの"}
      - {type: phrase, text: "辺の重みの変更と2点間の距離のクエリ"}
    acl: [fenwick_tree, segtree, lazy_segtree]
    frequency: A
