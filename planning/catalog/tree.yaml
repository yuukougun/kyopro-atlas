  - id: euler-tour
    chapter: 木を列にする
    title: オイラーツアー（DFS 順で部分木を区間にする）
    aliases: [オイラーツアー, Euler Tour, 行きがけ順の番号付け, in/out, 木の平坦化, tree flattening, 辺のオイラーツアー]
    type: technique
    level: 青
    level_evidence: "abc202_e (1638)・abc294_g (1702)（設計書 §4.3 で青）。入口は木のいもす法と abc406_f (1470)。黄に abc337_g (2080)"
