# 目次：木（tree）。担当 C。規則は planning/catalog/README.md（第2版）、上位の規則は planning/design.md §3〜§5 と planning/design-review.md。
# 第2版（2026-10-21）：design-review §4.2 の C の行に従って直した。
#   - long-path-decomposition を tree-diameter の節（黄）に統合した。complete-binary-tree を基礎（青の節つき）に、tree-construction を水にした
#   - 「発展」の章をなくし、発展の概要は話題の章へ移した（tree-isomorphism は木全体の形、static-top-tree・dynamic-tree は部分木とパスのクエリ、tree-ratio-greedy はまとめる・分ける）
#   - 章「木を列にする」は「部分木とパスのクエリ」に改めた。complete-binary-tree は基礎になったので木の基礎の章へ移した
# 木 DP・全方位木 DP・二乗の木 DP は dp（設計書 §4.2）。tree は親・深さ・部分木サイズまでを扱い、dp へリンクする。
# 問題 ID はすべて tools/ap.py で実在を確かめた。summary は問いだけ（手法名なし）、approach は執筆者向けの方針。問いが調査の記載から分からないものは summary を「（執筆時に確かめる）」にした。
field: tree
pages:
  # ───────────── 木の基礎 ─────────────
  - id: tree-basics
    chapter: 木の基礎
    title: 木の基本性質と表現
    aliases: [木の定義, 森, 根付き木, 木の性質, 親の番号が自分より小さい入力, tree, forest]
    type: technique
    level: 基礎
    level_evidence: "abc263_b (136)・abc399_c (321)・abc303_e (1113)・abc378_f (1436)。性質を知っていれば解ける問題が灰〜水に多い"
    kind: [木]
    prerequisites: [dfs]
    related: [tree-traversal, namori-graph, functional-graph, tree-degree, connected-components, tree-bipartite]
    summary: "連結で辺が N−1 本・閉路がない・2 点間のパスがちょうど 1 本、の 3 つは同値で、辺を 1 本除くと 2 つに分かれ、1 本足すと閉路が 1 つできる。根の決め方と、辺の値を子の頂点に寄せる小技が多くの問題の出発点になる。"
    signs:
      - {type: phrase, text: "辺を 1 本取り除く・1 本足す・閉路をなくして森にする"}
      - {type: phrase, text: "森として残せる辺の数・消す辺の数"}
    acl: []
    frequency: A
    frequency_evidence: "recent 0・前提として 28 ページに届く（直接 3）・古い ABC 4 問"
    sections:
      - {title: "木の同じ意味の定義と、そこから使える事実の一覧", anchor: definitions}
      - {title: "入力の形（辺のリスト・親の配列・p_i < i）と根の決め方", anchor: input-forms}
      - {title: "辺を 1 本取り除くと 2 つの成分、1 本足すと閉路が 1 つ", anchor: remove-add-edge}
      - {title: "森の連結成分の数 = 頂点数 − 辺数", anchor: forest}
      - {title: "辺の値を子の頂点に寄せる", anchor: edge-to-child}
      - {title: "形の両極端（パスと星）でテストする", anchor: extremes}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "辺を 1 本取り除くと 2 つに分かれ、1 本足すと閉路が 1 つできる様子を切り替えて見せる"}
    problems:
      - {id: abc303_e, role: example, representative: true, summary: "いくつかの星（中心と葉からなる木）をつないで作った木が与えられ、元の星の大きさをすべて求める", approach: "次数 3 以上の頂点は元の星の中心で、頂点数の式から残りの星の個数を逆算する"}
      - {id: abc263_b, role: practice, summary: "親の番号 P_i（P_i < i）で与えられる家系図で、人 N が人 1 の何代後の子孫かを求める", approach: "親を根までたどった回数を数える"}
      - {id: abc399_c, role: practice, summary: "単純無向グラフから辺をいくつか消して森にするとき、消す辺の最小数を求める", approach: "森として残せる辺は N −（連結成分数）本"}
      - {id: abc378_f, role: practice, summary: "木に辺を 1 本足してできる閉路について、閉路上の頂点の次数がすべて 3 になるような足し方の数を求める", approach: "次数 3 の頂点の成分ごとに、接する次数 2 の頂点の組を数える"}
    sources: ["04-tree §2.3（木の基本性質を道具として整理する）", "04-tree §4.1", "04-tree §5.1（tree-basics）"]

  - id: tree-traversal
    chapter: 木の基礎
    title: 根付き木と走査順
    aliases: [木の探索, 行きがけ順, 帰りがけ順, DFS 順, BFS 順, 部分木サイズ, 深さ, preorder, postorder]
    type: technique
    level: 基礎
    level_evidence: "abc270_c (625)・abc213_d (710)・abc309_e (957)・abc146_d (1192) で、根を決めた DFS・BFS と親・深さ・部分木サイズだけで解ける。abc133_e (1505) が水の応用"
    kind: [木, グラフ探索]
    prerequisites: [tree-basics, bfs]
    related: [euler-tour, tree-dp, cpp-environment#stack-depth, cpp-lambda#recursive-lambda]
    summary: "根を決めて DFS か BFS をすると、親・深さ・部分木サイズ・行きがけ順・帰りがけ順が O(N) で求まる。帰りがけ順（または BFS 順の逆）で子の結果を親へ集約するのが木 DP の土台になる。"
    signs:
      - {type: phrase, text: "頂点 1 を根とする根付き木で、部分木の頂点数・和・最大を求める"}
      - {type: phrase, text: "子孫・祖先・訪問順を答える"}
      - {type: phrase, text: "p_i < i（親の番号が自分より小さい）形で木が与えられる"}
    acl: []
    frequency: A
    frequency_evidence: "recent 2（abc459_e・abc479_e）・前提として 25 ページに届く（直接 12）・古い ABC 6 問"
    sections:
      - {title: "親・深さ・部分木サイズを求める", anchor: parent-depth-size}
      - {title: "行きがけ順と帰りがけ順（子から親へ集約する）", anchor: pre-post-order}
      - {title: "BFS 順の逆で再帰を使わずに集約する", anchor: bfs-order}
      - {title: "p_i < i なら番号の逆順で足りる", anchor: parent-index}
      - {title: "再帰の深さ（パス状の木）と非再帰の書き方", anchor: recursion-depth}
      - {title: "一般の木 DP は DP の章へ", anchor: to-tree-dp}
    merged_keys: []
    visual: {kind: dynamic, priority: 2, text: "DFS のスタックの中身・行きがけ番号・帰りがけ番号を同時に表示し、BFS 順（深さ順）と切り替えて比べる"}
    problems:
      - {id: abc213_d, role: example, representative: true, summary: "都市 1 から出発し、未訪問の隣の都市のうち番号最小の所へ進み、なければ来た道を戻る旅で、訪れる都市を順に出力する", approach: "隣接頂点を番号順に並べた DFS で、戻る動きも出力する"}
      - {id: abc270_c, role: practice, summary: "木の 2 頂点 X・Y を結ぶパスの頂点を順に出力する", approach: "X から DFS して親を記録し、Y から親をたどる"}
      - {id: abc333_d, role: practice, summary: "葉を 1 つずつ消す操作で頂点 1 を消すまでの最小の操作回数を求める", approach: "頂点 1 の子ごとの部分木サイズを求め、最大のもの以外を消す"}
      - {id: abc309_e, role: practice, summary: "家系図で、人 x_i から y_i 世代先までの子孫に保険が及ぶとき、保険に入っている人の数を求める", approach: "番号順に「あと何世代まで及ぶか」の最大値を子へ伝える"}
      - {id: abc146_d, role: practice, summary: "木の辺を、各頂点に接する辺の色がすべて異なるように塗るとき、最小の色数と塗り方を出力する", approach: "根から順に、親への辺の色だけを避けて子への辺に色を振る"}
      - {id: abc133_e, role: challenge, summary: "木の頂点を K 色で塗り、距離 2 以下の 2 頂点が異なる色になる塗り方の数を求める", approach: "DFS 順に色を決め、距離 2 以内の処理済みの頂点の数だけ選択肢が減ることを掛け合わせる"}
    sources: ["04-tree §4.2", "04-tree §5.1（tree-traversal）"]

  - id: tree-bipartite
    chapter: 木の基礎
    title: 木の 2 色塗り分けと距離の偶奇
    aliases: [木は二部グラフ, 深さの偶奇, 距離の偶奇, tree bipartition]
    type: technique
    level: 基礎
    level_evidence: "abc209_d (686)・典型 90 問 026（★4）。辺の重みの偶奇で塗る abc126_d (1279) は練習、ゲームと組む最近の応用は力試しに置いた"
    kind: [木]
    prerequisites: [tree-traversal, bipartite-graph]
    related: [tree-distance, parity]
    summary: "木は閉路がないので深さの偶奇で必ず 2 色に塗れ、2 点の距離の偶奇は深さの和の偶奇で分かる。多い方の色が N/2 個以上あることや、色の違う組の数を使う問題に効く。"
    signs:
      - {type: phrase, text: "距離の偶奇・2 人が同時に動いて出会う場所"}
      - {type: phrase, text: "辺の重みの偶奇で頂点を塗り分ける"}
      - {type: phrase, text: "独立集合を N/2 個以上選ぶ・二部グラフのまま辺を足す"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 3 問"
    sections:
      - {title: "深さの偶奇で塗る（重みがあるなら重みの偶奇で）", anchor: by-depth}
      - {title: "距離の偶奇は深さだけで分かる", anchor: distance-parity}
      - {title: "多い方の色は N/2 個以上", anchor: majority-color}
      - {title: "色の違う組の数（二部グラフのまま足せる辺）", anchor: cross-pairs}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "深さの偶奇で色分けした木。2 点を選ぶと距離と色の組み合わせが表示される"}
    problems:
      - {id: abc209_d, role: example, representative: true, summary: "木の上で 2 人が別々の町から同時に同じ速さで向かい合って進むとき、出会う場所が町か道路かを各質問に答える", approach: "2 点の距離の偶奇で決まり、偶奇は深さの和で分かる"}
      - {id: typical90_z, role: practice, summary: "N 頂点の木から、どの 2 つも隣り合わない頂点をちょうど N/2 個選んで出力する", approach: "2 色に塗ると多い方の色は N/2 個以上あり、同じ色どうしは隣接しない"}
      - {id: abc126_d, role: practice, summary: "辺に長さがある木の頂点を白と黒に塗り、同じ色の 2 頂点の距離がすべて偶数になるようにする", approach: "辺の長さが偶数なら同じ色、奇数なら違う色として DFS で塗る"}
      - {id: abc398_e, role: challenge, summary: "木に、奇数長の閉路ができないように辺を交互に足していき、足せなくなった方が負けるゲームで、先手と後手のどちらで勝つかを選んで対戦する", approach: "色の違う頂点の組のうち辺のない組の数の偶奇で手番を選ぶ"}
    sources: ["04-tree §4.3", "04-tree §5.1（tree-bipartite）"]

  - id: tree-distance
    chapter: 木の基礎
    title: 木の上の距離
    aliases: [木の距離, 根からの累積, XOR 距離, 追いかけっこ, 2 点からの距離, distance on a tree]
    type: technique
    level: 基礎
    level_evidence: "1 点からの距離は abc070_d (1182)。2 点からの比較は abc148_f (1457)、根からの XOR は abc201_e (1694)・arc045_c (2022)"
    kind: [木]
    prerequisites: [tree-traversal]
    related: [lca, tree-path, tree-diameter, xor]
    summary: "木では 2 点間のパスが一意なので、重み付きでも DFS 1 回で 1 点からの距離が求まる。2 点からの距離を比べる型と、根からの累積値で 2 点間の値を表す型（XOR なら LCA がいらない）がある。"
    signs:
      - {type: phrase, text: "頂点 K を経由する最短距離"}
      - {type: phrase, text: "2 人の追いかけっこ・どちらが先に着くか"}
      - {type: phrase, text: "パス上の辺の重みの XOR"}
    acl: []
    frequency: B
    frequency_evidence: "recent 1（abc451_e）・前提として 3 ページに届く（直接 2）・古い ABC 3 問"
    sections:
      - {title: "1 点からの距離（ダイクストラはいらない）", anchor: from-one}
      - {title: "2 点からの距離を比べる", anchor: from-two}
      - {title: "根からの累積値で 2 点間を表す（XOR は LCA が不要、和は LCA が要る）", anchor: root-prefix}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "2 点からの距離を色の濃淡で塗り、どちらに近いかの境目（パスの中点）を見せる"}
    problems:
      - {id: abc070_d, role: example, representative: true, summary: "重み付きの木で、頂点 K を経由して x_j から y_j へ行く最短距離を Q 個の質問に答える", approach: "K から全頂点への距離を 1 回の DFS で前計算し、2 つの距離の和で答える"}
      - {id: abc148_f, role: practice, summary: "木の上の鬼ごっこで、逃げる側は捕まるまでを長く、鬼は短くしようとするとき、捕まるまでの鬼の手数を求める", approach: "2 人それぞれからの距離を求め、逃げる側が先に着ける頂点のうち鬼から最も遠い所を探す"}
      - {id: abc201_e, role: practice, summary: "重み付きの木で、すべての頂点の組についてパス上の辺の重みの XOR を足した値を求める", approach: "根からの XOR を前計算し、ビットごとに 0 と 1 の個数の積を足す"}
      - {id: arc045_c, role: challenge, summary: "重み付きの木で、パス上の辺の重みの XOR がちょうど X になる頂点の組の数を求める", approach: "根からの XOR どうしの XOR なので、値ごとの個数から数える"}
    sources: ["04-tree §4.4", "04-tree §5.1（tree-distance）"]

  - id: tree-imos
    chapter: 木の基礎
    title: 木の上の累積和・いもす法
    aliases: [木上のいもす法, 部分木加算, パス加算, 木上の累積和, prefix sums on a tree]
    type: technique
    level: 基礎
    level_evidence: "根の向きを自分で決める応用が abc187_e (1358)。部分木への一括加算の基本形 abc138_d (920) は調査で未確認とされたので外した。パスへの加算は LCA を使うので青の節"
    kind: [木, 累積和・差分]
    prerequisites: [tree-traversal, imos]
    related: [euler-tour, lca, tree-path]
    summary: "部分木への加算をまとめて受けてから値を出力するなら、部分木の根に印を置いて根から下へ累積する。パスへの加算は端点と LCA に印を置いて葉から上へ累積し、途中で値を聞かれるならオイラーツアーを使う。"
    signs:
      - {type: phrase, text: "部分木の全頂点に x を加算するクエリがたくさん来て、最後に全頂点の値を出力する"}
      - {type: phrase, text: "辺のどちら側かの頂点すべてに加算する"}
      - {type: phrase, text: "多数のパスに沿って +1 し、各辺・各頂点を通った回数を求める"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 3 問"
    sections:
      - {title: "部分木への加算（根から下へ累積する）", anchor: subtree-add}
      - {title: "辺の片側への加算を子の部分木への加算に直す", anchor: edge-side}
      - {title: "根から y 世代までに及ぶ値を伝える", anchor: depth-limited}
      - {title: "途中で値を聞かれるならオイラーツアーと BIT", anchor: online-queries}
      - {title: "パスへの加算（LCA に印を置いて葉から上へ累積する）", anchor: path-add, level: 青}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "印をつける段階と、根から下へ（または葉から上へ）累積する段階を並べ、配列のいもす法と対比する"}
    problems:
      - {id: abc187_e, role: example, summary: "木の辺 i = (a_i, b_i) について「a_i から b_i を通らずに行ける頂点すべてに x を足す」型のクエリを処理した後の、各頂点の値を求める", approach: "辺の片側への加算を「子の部分木へ加算」か「全体へ加算して子の部分木から引く」に直して累積する"}
      - {id: abc222_e, role: practice, summary: "木の上を決まった順に移動するとき、辺を赤と青に塗り分けて、赤の辺を通った回数と青の辺を通った回数の差がちょうど K になる塗り方の数を求める", approach: "各辺を通る回数を数え、部分和 DP で数える"}
    problems_note: "練習が 1 問で、帯の中の例題がない。基本形の abc138_d（920）は調査（research/09）で未確認とされたので外した（research/03・04 には裏付けがある。台帳で確かめられれば例題に戻す）"
    sources: ["04-tree §4.5", "04-tree §5.1（tree-imos）"]

