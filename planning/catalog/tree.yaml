    sources: ["04-tree §4.7", "04-tree §5.1（tree-degree）", "07-math-comb §4.4（cayley-pruefer）"]

  # ───────────── L2 木全体の形 ─────────────
  - id: tree-diameter
    chapter: 木全体の形
    title: 木の直径と最遠点
