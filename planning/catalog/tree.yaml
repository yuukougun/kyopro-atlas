# 目次：木（tree）。担当 C。規則は planning/catalog/README.md、上位の規則は planning/design.md §3〜§5。
# 並び順は research/04 §2.1 の層の順（L1 木の基礎 → L2 木全体の形 → L3 パス → L4 木を列にする → L5 まとめる・分ける → L6 発展）。
# ただし steiner-subtree（指定頂点を結ぶ最小の部分木）は本体が基礎なので L1 の tree-imos の後に置いた。
# 木 DP・全方位木 DP・二乗の木 DP は dp（設計書 §4.2）。tree は親・深さ・部分木サイズまでを扱い、dp へリンクする。
# 問題 ID はすべて tools/ap.py で実在を確かめた。要約は調査の裏付け（research/04・00 の表）をもとに自分の言葉で書いた。
field: tree
pages:
  # ───────────── L1 木の基礎 ─────────────
  - id: tree-basics
    chapter: 木の基礎
    title: 木の基本性質と表現
    aliases: [木の定義, 森, 根付き木, 木の性質, 親の番号が自分より小さい入力]
    type: technique
    level: 基礎
    level_evidence: "abc263_b (136)・abc399_c (321)・abc303_e (1113)・abc378_f (1436)。性質を知っていれば解ける問題が灰〜水に多い"
    kind: [木]
    prerequisites: [graph-basics, dfs]
    related: [tree-traversal, namori-graph, tree-degree, connected-components, tree-bipartite]
    summary: "連結で辺が N−1 本・閉路がない・2点間のパスがちょうど1本、が同じことと、辺を1本取り除く（足す）と何が起きるかなど、解くときに使える木の性質をまとめる。根の決め方や辺の値を子に寄せる小技もここに置く。"
    signs:
      - {type: phrase, text: "N 頂点 N−1 辺の連結グラフ・どの2頂点の間にもちょうど1つの経路"}
      - {type: phrase, text: "p_i < i（親の番号が自分より小さい）形で木が与えられる"}
      - {type: phrase, text: "辺を1本取り除く・1本足す・閉路をなくして森にする"}
    acl: []
    frequency: A
    sections:
      - "木の同じ意味の定義と、そこから使える事実の一覧"
      - "入力の形（辺のリスト・親の配列・p_i < i）と根の決め方"
      - "辺を1本取り除くと2つの成分、1本足すと閉路が1つ"
      - "森の連結成分の数 = 頂点数 − 辺数"
      - "辺の値を子の頂点に寄せる"
      - "形の両極端（パスと星）でテストする"
    merged_keys: []
    visual: "図：辺を1本取り除くと2つに分かれ、1本足すと閉路が1つできる様子を切り替えて見せる"
    problems:
      - {id: abc303_e, role: example, summary: "次数3以上の頂点は元の星の中心しかありえないことと頂点数の式から、星の大きさごとの個数を逆算する"}
      - {id: abc263_b, role: practice, summary: "親の番号を根までたどった回数（深さ）を数える"}
      - {id: abc399_c, role: practice, summary: "森として残せる辺は N −（連結成分数）本なので、それ以外を消す本数を数える"}
      - {id: abc378_f, role: practice, summary: "辺を1本足してできる閉路の条件を次数で言い換え、次数3の頂点の成分ごとに、接する次数2の頂点の組を数える"}
    sources: ["04-tree §2.3（木の基本性質を道具として整理する）", "04-tree §4.1", "04-tree §5.1（tree-basics）"]

  - id: tree-traversal
    chapter: 木の基礎
