    related: [segment-tree, lazy-segment-tree, tree-imos, lca, hld, small-to-large, mo-algorithm]
    summary: "DFS の行きがけ順に番号 in[v] を振り、子孫を回り終えた時点の番号 out[v] を記録すると、v の部分木が列の区間 [in[v], out[v]) になり、部分木の和や加算を BIT・セグ木の区間クエリで扱える。辺の重みを子の部分木への加算と見れば、根からのパスも扱える。"
