      - "部分木の補集合は2つの区間"
      - "根からのパスを区間で扱う（辺の重みを子の部分木に配る）"
      - "逆元がない演算・パスへの一括更新は HL 分解（発展）"
      - "木上の Mo（データ構造の章）"
    merged_keys: [euler-tour-path]
    visual: "動く図：木と DFS 順の列を上下に並べ、頂点を選ぶとその部分木が列の区間として光る"
    problems:
      - {id: abc406_f, role: example, summary: "辺で分けた片側は子の部分木なので、部分木の和を DFS 順と BIT で更新しながら求める"}
      - {id: abc202_e, role: example, summary: "深さ d の頂点を DFS 順の番号で並べ、部分木の区間に入る個数を二分探索で数える"}
      - {id: abc294_g, role: example, summary: "根からの距離を DFS 順の列に持ち、辺の重みの変更を子の部分木への区間加算にする。2点間の距離は LCA と組み合わせる"}
      - {id: abc240_e, role: practice, summary: "葉に DFS 順で番号を振ると、各頂点の部分木の葉が連続した区間になる"}
