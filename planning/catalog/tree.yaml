      - "行きがけ順と帰りがけ順（子から親へ集約する）"
      - "BFS 順の逆で再帰を使わずに集約する"
      - "p_i < i なら番号の逆順で足りる"
      - "再帰の深さ（パス状の木）と非再帰の書き方"
      - "一般の木 DP は DP の章へ"
    merged_keys: []
    visual: "図：DFS のスタックの中身・行きがけ番号・帰りがけ番号を同時に表示し、BFS 順（深さ順）と切り替えて比べる（余裕があれば動く図）"
    problems:
      - {id: abc213_d, role: example, summary: "隣接頂点を番号の小さい順に回る DFS で、戻る動きも含めた訪問順を出力する"}
      - {id: abc270_c, role: practice, summary: "片方の端点から DFS して親を記録し、2点間のパスを復元する"}
      - {id: abc333_d, role: practice, summary: "頂点1の子ごとの部分木サイズを求め、最大のものだけを残す"}
      - {id: abc309_e, role: practice, summary: "親の番号が自分より小さい入力なので、番号順に「あと何世代まで保険が及ぶか」の最大値を子へ伝える"}
      - {id: abc146_d, role: practice, summary: "根から順に、親へ向かう辺の色だけを避けて子への辺に色を振ると、最大次数の色数で塗れる"}
      - {id: abc133_e, role: challenge, summary: "DFS 順に色を決め、距離2以内で処理済みの頂点の数だけ選択肢が減ることを掛け合わせる"}
    sources: ["04-tree §4.2", "04-tree §5.1（tree-traversal）"]

  - id: tree-bipartite
    chapter: 木の基礎
    title: 木の2色塗り分けと距離の偶奇
    aliases: [木は二部グラフ, 深さの偶奇, 距離の偶奇, 2彩色]
