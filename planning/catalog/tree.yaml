      - {id: typical90_ai, role: challenge, summary: "指定頂点を DFS 順に並べ、隣り合う2点（最後と最初も）の距離の和の半分を必要な辺の数として答える"}
    sources: ["04-tree §4.25", "04-tree §5.1（steiner-subtree）"]

