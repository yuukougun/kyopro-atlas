    type: technique
    level: 基礎
    level_evidence: "abc270_c (625)・abc213_d (710)・abc309_e (957)・abc146_d (1192) で、根を決めた DFS・BFS と親・深さ・部分木サイズだけで解ける。abc133_e (1505) が水の応用"
    kind: [木, グラフ探索]
