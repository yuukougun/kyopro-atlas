      - {id: abc361_e, role: example, summary: "全都市を回る最短距離は「辺の重みの総和の2倍 − 直径」"}
      - {id: typical90_c, role: practice, summary: "辺を1本足してできる閉路の長さは「パスの長さ + 1」なので、直径 + 1 が答え"}
      - {id: abc019_4, role: practice, summary: "距離を質問できる対話形式で、任意の点からの最遠点を探し、そこからもう一度最遠点を探す"}
      - {id: abc447_f, role: practice, summary: "次数の条件つきの最長パスを、パスの最も浅い頂点で場合分けし、子の長さの上位2つから求める"}
      - {id: abc401_f, role: practice, summary: "直径の両端からの距離で各頂点の離心数を求め、2つの木をつないだ直径の全組の和をソートと累積和で数える"}
