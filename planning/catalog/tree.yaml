      - {id: abc267_f, role: example, representative: true, summary: "木の頂点 u から距離がちょうど k の頂点を 1 つ答える質問に Q 回答える（なければ −1）", approach: "最も遠い点は直径の端点なので、端点を根にした木で k 個上の祖先を求める"}
