      - {type: phrase, text: "独立集合を N/2 個以上選ぶ・二部グラフのまま辺を足す"}
    acl: []
    frequency: B
    sections:
      - "深さの偶奇で塗る（重みがあるなら重みの偶奇で）"
      - "距離の偶奇は LCA なしで深さだけで分かる"
      - "多い方の色は N/2 個以上"
      - "色の違う組の数（二部グラフのまま足せる辺）"
    merged_keys: []
    visual: "図：深さの偶奇で色分けした木。2点を選ぶと距離と色の組み合わせが表示される"
    problems:
      - {id: abc209_d, role: example, summary: "2点の距離の偶奇で出会う場所（町か道路）が決まり、偶奇は深さの和で分かる"}
      - {id: typical90_z, role: practice, summary: "2色に塗ると多い方の色は N/2 個以上あり、同じ色どうしは隣接しないので独立集合になる"}
      - {id: abc398_e, role: practice, summary: "色の違う頂点の組のうち辺のない組の数の偶奇で、先手と後手のどちらを選ぶかを決める"}
      - {id: abc126_d, role: practice, summary: "辺の重みが偶数なら同じ色、奇数なら違う色という規則で DFS しながら塗る"}
    sources: ["04-tree §4.3", "04-tree §5.1（tree-bipartite）"]

  - id: tree-distance
    chapter: 木の基礎
    title: 木の上の距離（1点・2点から／根からの累積）
    aliases: [木の距離, 根からの累積, XOR 距離, 追いかけっこ]
    type: technique
    level: 基礎
    level_evidence: "1点からの距離は abc070_d (1182)。2点からの比較は abc148_f (1457)、根からの XOR は abc201_e (1694)・arc045_c (2022)"
    kind: [木]
    prerequisites: [tree-traversal]
    related: [lca, tree-path, tree-diameter, xor-path]
    summary: "木では2点間のパスが一意なので、重み付きでも DFS 1回で1点からの距離が求まる。2点からの距離を比べる型と、根からの累積値で2点間の値を表す型（XOR なら LCA がいらない）を扱う。"
    signs:
      - {type: phrase, text: "頂点 K を経由する最短距離"}
      - {type: phrase, text: "2人の追いかけっこ・どちらが先に着くか"}
      - {type: phrase, text: "パス上の辺の重みの XOR"}
    acl: []
    frequency: B
    sections:
      - "1点からの距離（ダイクストラはいらない）"
      - "2点からの距離を比べる"
      - "根からの累積値で2点間を表す（XOR は LCA が不要、和は LCA が要る）"
    merged_keys: []
    visual: "図：2点からの距離を色の濃淡で塗り、どちらに近いかの境目（パスの中点）を見せる"
    problems:
      - {id: abc070_d, role: example, summary: "経由点 K から全頂点への距離を1回の DFS で前計算し、各クエリを2つの距離の和で答える"}
      - {id: abc148_f, role: practice, summary: "2人それぞれからの距離を求め、逃げる側が先に着ける頂点のうち鬼から最も遠い所までの手数を求める"}
      - {id: abc201_e, role: practice, summary: "根からの XOR を前計算すると2点間の XOR はその XOR になり、全組の和はビットごとに数える"}
      - {id: arc045_c, role: challenge, summary: "2点間の XOR は根からの XOR どうしの XOR なので、値ごとの個数から XOR が X になるパスを数える"}
    sources: ["04-tree §4.4", "04-tree §5.1（tree-distance）"]

