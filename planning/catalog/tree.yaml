    kind: [木]
    prerequisites: [tree-traversal, bipartite-graph]
    related: [tree-distance, parity]
    summary: "木は閉路がないので深さの偶奇で必ず2色に塗れ、2点の距離の偶奇は深さの和の偶奇で分かる。多い方の色が N/2 個以上あることや、色の違う組の数を使う問題に効く。"
    signs:
      - {type: phrase, text: "距離の偶奇・2人が同時に動いて出会う場所"}
