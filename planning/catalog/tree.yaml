    merged_keys: []
    visual: "図：印をつける段階と、根から下へ（または葉から上へ）累積する段階を並べ、配列のいもす法と対比する"
    problems:
      - {id: abc138_d, role: example, summary: "部分木への加算を根の頂点に印として足しておき、最後に根から下へ累積する"}
      - {id: abc187_e, role: practice, summary: "辺の片側への加算を「子の部分木へ加算」か「全体へ加算して子の部分木から引く」に直して累積する"}
      - {id: abc222_e, role: practice, summary: "決まった順に移動したときに各辺を通る回数を数え、赤と青の差がちょうど K になる塗り方を部分和 DP で数える"}
    sources: ["04-tree §4.5", "04-tree §5.1（tree-imos）"]

