  - id: lis
    chapter: 列の DP
    title: 最長増加部分列（LIS）
    aliases: [LIS, 最長増加部分列, Longest Increasing Subsequence, 最長減少部分列, Dilworth の定理, 増加列への最小分割]
    type: technique
    level: 水
    level_evidence: "基本形（二分探索で O(N log N)）が必要な問題は abc134_e (1320)・典型90 060 (★5) から現れ、応用（各要素が LIS に入るか・木の上・1回の変更）は abc354_f (1639)・abc006_4 (1696)・abc165_f (1843)・abc360_g (1982) と青に集まる。Dilworth の定理は abc457_g (1928)・abc476_g (2477)。最近も abc468_f (1693、LIS の発展)などが続く"
    kind: [DP, 二分探索]
    prerequisites: [dp-basics, binary-search]
    related: [dp-segment-tree, dp-dimension-reduction, inline-dp, lcs, root-path-dfs, dilworth-path-cover, manhattan-chebyshev]
    summary: "列から順序を保って選ぶ増加列の最長を、L[k]＝長さ k の増加列の末尾として取り得る最小値、を二分探索で更新して O(N log N) で求める。値を添字にしたセグ木で dp[x] = max(dp[<x]) + 1 とすれば、重み付きや数え上げにも広げられる。"
    signs:
      - {type: constraint, text: "N ≤ 2×10^5 で「部分列」「単調増加」"}
      - {type: phrase, text: "最小で何本の増加（減少）列に分けられるか・何色で塗れるか"}
      - {type: phrase, text: "抜いて差し込む操作の最小回数（N − LIS）"}
      - {type: phrase, text: "箱・円を入れ子にできる最大個数"}
    acl: [segtree]
    frequency: A
    sections:
      - "二分探索版（L が単調になる理由・狭義は lower_bound、広義は upper_bound）"
      - "セグ木版（重み付き・各要素で終わる最長・数え上げ）"
      - "復元（直前の要素を記録する）"
      - "各要素が LIS に含まれうるか（前後から2回求める）（青）"
      - "2次元の入れ子（一方は昇順・もう一方は降順に並べる）（青）"
      - "1か所だけ変更できる LIS・木の上の LIS（青）"
      - "Dilworth の定理（増加列への最小分割数＝最長減少部分列の長さ）（青）"
    merged_keys: [dilworth]
    visual: "値を1つずつ入れ、L のどこが置き換わるかをハイライトするステップ送り（O(N^2) の表との対比）。点を並べ、減少列の各点が別々の増加列に入るしかないことを示す図"
    problems:
      - {id: abc134_e, role: example, summary: "同じ色が狭義増加になるよう塗る最小の色数。広義の非増加部分列の最長に言い換える（Dilworth の定理）"}
      - {id: typical90_bh, role: example, summary: "左からの LIS と右からの LIS を各位置で合わせ、山型の最長部分列を求める"}
      - {id: abc354_f, role: practice, summary: "前後からの LIS の長さの和で、各要素がある LIS に含まれうるかを判定する"}
      - {id: dp_q, role: practice, summary: "重み付きの LIS。高さを添字にしたセグ木で、低い花からの美しさの最大を取る"}
      - {id: abc006_4, role: practice, summary: "カードを抜いて差し込む操作の最小回数を N − LIS に言い換える"}
      - {id: abc165_f, role: practice, summary: "木の根から各頂点へのパスの LIS。DFS で LIS の配列の1か所の変更を記録し、戻るときに元に戻す"}
      - {id: abc457_g, role: practice, summary: "座標を45度回転して上か右にしか動けない形にし、必要な台数を増加列への最小分割数（最長減少部分列の長さ）で求める"}
      - {id: abc360_g, role: practice, summary: "1か所だけ値を変えてよいときの LIS。「変更済みか」を状態に足す"}
      - {id: abc476_g, role: challenge, summary: "popcount の列を狭義増加の部分列に塗り分ける最小色数を、最長の広義減少部分列の長さとして求める"}
      - {id: tdpc_target, role: challenge, summary: "円の入れ子を区間の包含に直してソートし、LIS で最長の鎖を求める"}
    sources: ["02-dp §4.C（lis）", "02-dp §5.1", "00-curriculum §4.2（Dilworth の定理）", "00-curriculum §2.3.8（abc457_g・abc468_f・abc476_g）", "04-tree §4.17（root-path-dfs：abc165_f）"]

