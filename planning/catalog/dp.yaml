      - {id: arc130_d, role: challenge, summary: "木の各頂点に 1〜N を 1 つずつ書き、どの頂点も隣接する頂点すべてより大きいか、すべてより小さいようにする方法の数を求める。", approach: "部分木の中での順位を状態にして合わせる"}
