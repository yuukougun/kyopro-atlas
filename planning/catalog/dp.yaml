    prerequisites: [subset-sum, knapsack-01]
    related: [divide-and-conquer, dp-dimension-reduction]
    summary: "数え上げの部分和 DP の更新 dp'[s] = dp[s] + dp[s − a] は、s の小さい方から dp[s] = dp'[s] − dp[s − a] と逆に解けるので、要素を1つ取り除いた状態に戻せる。max や min の DP は戻せないので、前後からの DP のマージや分割統治を使う。"
    signs:
      - {type: phrase, text: "要素の追加と削除のクエリのたびに、和が K になる選び方の数を答える"}
