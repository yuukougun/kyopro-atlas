      - {id: abc209_f, role: practice, summary: "木を切る順番でコストが最小になる順序の数。隣どうしの大小関係の列に言い換えて EDPC T と同じ形にする"}
      - {id: abc309_g, role: practice, summary: "|p_i − i| ≥ X の順列の数。包除で違反する位置を選び、近い位置の値の使用状況を bit で持つ"}
      - {id: tdpc_string, role: practice, summary: "同じ文字が隣り合わない並べ方の数。文字を種類ごとに挿入し、隣り合う同じ文字の組の数を状態にする"}
      - {id: abc282_g, role: challenge, summary: "2つの順列で、隣り合う大小関係が一致する位置の数が K になる組。2つの相対順位を状態にする"}
      - {id: abc267_g, role: challenge, summary: "A_i < A_{i+1} がちょうど K 回の並べ方。値の小さい順に挿入して、増える回数を数える"}
    sources: ["02-dp §4.H（insertion-dp・hakone-ekiden-dp・connected-component-dp）", "02-dp §5.1", "00-curriculum §2.3.8（abc468_g・abc473_g）"]

