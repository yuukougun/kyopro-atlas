      - {id: arc026_3, role: practice, summary: "区間を照らす蛍光灯を選び、区間全体を照らすときの費用の最小を求める。", approach: "右端までの最小をセグメント木で取る（節 interval-cover）"}
      - {id: abc410_g, role: challenge, summary: "（執筆時に確かめる）", approach: "円上の弦の入れ子の深さを、セグメント木の区間最大で求める DP"}
    sources: ["02-dp §4.J（dp-segment-tree・dp-sliding-window）", "02-dp §5.1", "05-ds §4.C（segtree-on-values：abc339_e）", "05-ds §4.A（sliding-window-minimum）"]

  - id: inline-dp
    chapter: DP の高速化
    title: インライン DP
    aliases: [in-place DP, Inline DP, 配列を使い回して一括更新, 遅延セグ木 DP]
    type: technique
    level: 青
    level_evidence: "abc271_e (1402)・abc372_f (1722、2024)・abc203_e (1750)・abc353_g (1765)・abc038_d (1804 参考値)。EDPC W は遅延セグメント木で一括更新する典型。2026 年に abc480_g (2100、DP と遅延セグメント木と単調スタック)"
    kind: [DP, 区間クエリ]
    prerequisites: [dp-segment-tree, lazy-segment-tree, knapsack-01]
    related: [dp-dimension-reduction, lazy-segment-tree-patterns, global-offset#offset, lis, monotonic-stack#dp-transition]
    summary: "dp[i][*] から dp[i+1][*] へほとんどの値がそのまま写るとき、配列を 1 本だけ持って変わる場所だけを書き換える。一律の加算や区間加算は遅延セグメント木で、全体の平行移動は添字のずらしで表す。"
    signs:
      - {type: shape, text: "dp[i][*] から dp[i+1][*] で変わる場所が少ない"}
      - {type: shape, text: "遷移で dp 全体に一律の加算・平行移動が入る"}
      - {type: shape, text: "区間 [l, r] の右端 r で、l 以降の位置の dp にまとめて加算する"}
    acl: [lazy_segtree]
    frequency: B
    frequency_evidence: "recent 1（abc480_g）・前提として届くページなし・古い ABC 5 問"
    sections:
      - {title: "2 次元の表で考えてから、行ごとに変わる場所を書き出す", anchor: diff-per-row}
      - {title: "変わる場所だけを更新する（辺を 1 本ずつ緩和する）", anchor: update-changes}
      - {title: "全体のシフトを添字のずらしで表す", anchor: global-shift}
      - {title: "区間加算と区間最大を遅延セグメント木で（区間の右端で加算する）", anchor: lazy-segment-tree}
      - {title: "単調スタックと組み合わせる", anchor: with-monotonic-stack, level: 黄}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "2 次元の表で各行の変化したセルだけを色付けし、1 本の配列（セグメント木）の上書きに置き換える図"}
    problems:
      - {id: abc271_e, role: example, summary: "辺の番号の列 E が与えられ、その部分列の順に辺をたどって都市 1 から都市 N へ行く経路の長さの最小を求める。", approach: "辺を列の順に 1 本ずつ緩和し、配列を作り直さない（節 update-changes）"}
      - {id: dp_w, role: example, summary: "長さ N の 0/1 列の得点が、各区間 [l, r] に 1 が含まれれば a を足す形で決まるとき、得点の最大を求める。", approach: "最後に 1 を置いた位置を添字にし、区間の右端で遅延セグメント木の区間加算をする（節 lazy-segment-tree）"}
      - {id: abc372_f, role: example, representative: true, summary: "円環状の N 頂点と追加の M 本（≤ 50）の辺がある有向グラフで、頂点 1 から K 回移動する方法の数を求める。", approach: "全体のシフトを添字のずらしで表し、追加の辺の端だけ更新する（節 global-shift）"}
      - {id: abc203_e, role: practice, summary: "白いポーンが 1 行ずつ進み、黒いポーンのある列へは斜めにだけ進めるとき、最後の行で到達できる列の数を求める。", approach: "黒いポーンのある行だけ、到達可能な列の集合を更新する"}
      - {id: tdpc_target, role: practice, summary: "数直線上に中心を持つ円の集合から、入れ子の鎖になるように選べる円の個数の最大を求める。", approach: "LIS の配列を 1 本だけ持って上書きしていく（lis の力試しにもある）"}
      - {id: abc480_g, role: challenge, summary: "（執筆時に確かめる）", approach: "DP の遷移を遅延セグメント木と単調スタックでまとめて更新する（research/00 §2.3.8 の分類。節 with-monotonic-stack）"}
    sources: ["02-dp §4.J（inline-dp）", "02-dp §5.1", "00-curriculum §2.3.8（abc480_g）"]

  - id: dynamic-dp
    chapter: DP の高速化
    title: 動的 DP
    aliases: [Dynamic DP, DDP, 遷移行列のセグメント木]
    type: overview
    level: 発展
    level_evidence: "abc246_h (2677)：部分列の数え上げ DP の遷移を行列にしてセグメント木に載せ、1 文字の書き換えのたびに答える。abc456_f (1888、2026) は (min,+) 行列をセグメント木に載せて区間の積を取る形で、1 点更新のたびに求め直す動的 DP の代表ではないので、ds の segment-tree-monoids の行列の節の例題にした（design-review §3）"
    kind: [DP, 線形代数・行列, 区間クエリ]
    prerequisites: [matrix-power, segment-tree-monoids]
    related: [segment-tree, static-top-tree, subsequence-dp]
    summary: "列の各位置の遷移を小さな行列にしてセグメント木に載せると、1 点の書き換えのたびに DP の答えを O(S^3 log N) で求め直せる。行列の積は非可換なので、掛ける向きを最初に決める。"
    signs:
      - {type: phrase, text: "DP をする列に 1 点更新のクエリが来て、そのたびに DP の答えを求める"}
      - {type: phrase, text: "列の区間 [l, r] だけで DP をしたときの答えを、クエリごとに求める"}
    acl: [segtree]
    verify: [point_set_range_composite]
    frequency: C
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 1 問"
    sections:
      - {title: "何ができるか（1 点更新と区間の DP の答え）", anchor: what-it-does}
      - {title: "遷移を行列にしてセグメント木に載せる（ACL の segtree の S を行列にする）", anchor: matrix-on-segment-tree}
      - {title: "積の向きと単位行列", anchor: order-and-identity}
      - {title: "木の上の動的 DP（Static Top Tree へ）", anchor: on-trees}
      - {title: "ライブラリでの検証（Library Checker の point_set_range_composite が土台）", anchor: verify}
    merged_keys: []
    visual: {kind: static, priority: 3, text: "各位置の遷移行列を葉に置き、区間の行列の積を上へ集めるセグメント木の図"}
    problems:
      - {id: abc246_h, role: example, representative: true, summary: "0・1・? からなる文字列の 1 文字を書き換えるクエリのたびに、? を 0 か 1 に置き換えてできる文字列の部分列として現れうる、空でない文字列の種類数を答える。", approach: "部分列の数え上げ DP の遷移を行列にしてセグメント木に載せる"}
    problems_note: "発展の概要。ABC で動的 DP が想定解の問題は abc246_h のほかに見つかっていない。区間の行列の積を取るだけの abc456_f は ds の segment-tree-monoids の節 matrix の例題（1 点更新を足すと動的 DP になる、と本文で参照する）"
    sources: ["02-dp §4.J（dynamic-dp）", "05-ds §4.C（dynamic-dp）", "05-ds §5（dynamic-dp）", "00-curriculum §2.3.8（abc456_f）"]

  - id: cht
    chapter: DP の高速化
    title: Convex Hull Trick と Li Chao Tree
    aliases: [CHT, 傾き最適化, 斜率优化, 李超线段树, 直線の最小値]
    type: overview
    level: 発展
    level_evidence: "ABC で CHT が想定解・主要解の問題は 2019〜2026 年の F/G/Ex で abc289_g (2109)・abc228_h (2729) の 2 問だけ（kmjp 氏の解説 425 本と AtCoder Tags で確認）。Li Chao Tree が必須の ABC は見つからない。設計書 §4.3 で発展に決定"
    kind: [DP, データ構造]
    prerequisites: [dp-basics, convex-hull]
    related: [dp-segment-tree, segment-tree, monge, alien-dp, dp-speedup-overview]
    summary: "dp[i] = min_j (dp[j] + a_j·x_i + b_j) のように遷移が一次関数の最小になる DP を、下側の包絡線を持って速くする。単調なら deque、そうでなければ Li Chao Tree を使う。"
    signs:
      - {type: shape, text: "遷移のコストが i と j の積の項を 1 つだけ含む（(h_i − h_j)^2 など）"}
      - {type: phrase, text: "直線を追加しながら、任意の x での最小値・最大値を答える"}
    acl: []
    verify: [line_add_get_min, segment_add_get_min]
    frequency: C
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 2 問"
    sections:
      - {title: "遷移を直線の最小値に変形する", anchor: lines}
      - {title: "下側の包絡線と不要な直線（傾きもクエリも単調なら deque）", anchor: lower-envelope}
      - {title: "クエリが単調でないとき（二分探索）", anchor: non-monotone-queries}
      - {title: "Li Chao Tree（区間の真ん中で勝つ直線を残す）", anchor: li-chao-tree}
      - {title: "落とし穴：交点の比較は掛け算で（__int128）・最小と最大の取り違え・同じ傾き", anchor: pitfalls}
      - {title: "ライブラリでの検証（Library Checker の line_add_get_min・segment_add_get_min）", anchor: verify}
    merged_keys: [li-chao-tree]
    visual: {kind: dynamic, priority: 2, text: "遷移元ごとの直線を平面に描き、下側の包絡線だけが答えになることと、不要な直線が消える様子のステップ送り"}
    problems:
      - {id: dp_z, role: example, representative: true, summary: "足場を前から順に跳んで進み、i から j へ跳ぶと (h_j − h_i)^2 + C のコストがかかるとき、最後の足場までのコストの和の最小を求める。", approach: "遷移を直線の最小値に変形して CHT で求める"}
      - {id: abc289_g, role: practice, summary: "客ごとの購買意欲と商品ごとの価値から、価格に応じて買う客が決まるとき、商品ごとに売上（価格×買う人数）の最大を求める。", approach: "買う人数ごとの売上が価格の一次関数になるので、CHT で最大を取る"}
      - {id: abc228_h, role: practice, summary: "数列の値を 1 増やすたびに要素ごとの費用がかかるとき、増やした費用と「値の種類数 × X」の和の最小を求める。", approach: "ソート後の DP の遷移が一次関数の最小になる"}
    sources: ["02-dp §4.K（cht・li-chao-tree）", "02-dp §2.5", "02-dp §5.1"]

  - id: monge
    chapter: DP の高速化
    title: Monge 性による DP の高速化
    aliases: [Monge, 四角不等式, 四辺形不等式, Quadrangle Inequality, monotone minima, 分割統治 DP, Divide and Conquer DP, SMAWK, LARSCH, Knuth-Yao, "Knuth's optimization", "(max,+) 畳み込み", "min-plus 畳み込み", DP の凸性]
    type: overview
    level: 発展
    level_evidence: "Monge 性を使う ABC は abc348_g (2559)・abc355_g (2991)・abc383_g (3026) と G/Ex のみ（2024 年）。abc373_f (2018) は monotone minima でも解ける。2026 年に abc458_g (2831、(max,+) 畳み込み)。Knuth-Yao・SMAWK・LARSCH が必須の ABC は見つからない。同じ系統で単独では薄いので 1 枚にまとめた（設計書 §4.1）"
    kind: [DP, ダブリング・分割統治]
    prerequisites: [dp-sequence-partition, divide-and-conquer]
    related: [interval-dp, alien-dp, cht, slope-trick, ternary-search#convexity, knapsack-01, dp-speedup-overview]
    summary: "コスト c(i, j) が Monge なら各行の最小値を取る位置が単調になり、分割統治（monotone minima）や Knuth-Yao で区間分割 DP・区間 DP を速くできる。凸な列どうしの合成も速い。"
    signs:
      - {type: shape, text: "区間分割 DP のコストが c(a, c) + c(b, d) ≤ c(a, d) + c(b, c) を満たす（区間を広げるほど増え方が大きい）"}
      - {type: shape, text: "最適な区切り位置 opt(i) が i について単調に動く"}
      - {type: phrase, text: "区間から k 個選ぶときの最大値を、すべての k について求める"}
      - {type: constraint, text: "N ≤ 10^5 の列を K（数十）個の区間に分ける"}
    acl: []
    verify: [min_plus_convolution_convex_arbitrary, min_plus_convolution_convex_convex]
    frequency: B
    frequency_evidence: "recent 1（abc458_g）・前提として 1 ページに届く（直接 1）・古い ABC 4 問"
    sections:
      - {title: "Monge 性の定義と確かめ方", anchor: definition}
      - {title: "monotone minima（分割統治で O(N log N)）", anchor: monotone-minima}
      - {title: "SMAWK・LARSCH（O(N)・オンラインに決まる DP）", anchor: smawk-larsch}
      - {title: "Knuth-Yao（区間 DP の分割点の範囲を絞って O(N^2)）", anchor: knuth-yao}
      - {title: "DP の値の凸性（個数について凸な答え）", anchor: dp-convexity}
      - {title: "凸な列どうしの (max,+) 畳み込み（差分のマージ）", anchor: convex-max-plus-convolution}
      - {title: "ライブラリでの検証（Library Checker の min_plus_convolution_convex_arbitrary など）", anchor: verify}
    merged_keys: [monotone-minima, smawk-larsch, knuth-yao, convex-max-plus-convolution, dp-convexity]
    visual: {kind: static, priority: 3, text: "コスト行列を色で塗り、各行の最小値の位置が右下へ単調に並ぶことを示す図。2 つの凸な列の差分を大きい順にマージする図"}
    problems:
      - {id: abc348_g, role: example, representative: true, summary: "N 個の組 (A_i, B_i) からちょうど k 個を選ぶときの「A の和 − B の最大」の最大を、k = 1〜N のすべてについて求める。", approach: "B の昇順に並べ、分割統治と凹な列のマージで求める"}
      - {id: abc383_g, role: practice, summary: "長さ K の区間を重ならないように i 個選ぶときの和の最大を、すべての i について求める。", approach: "凹な列どうしを分割統治で合成する（節 convex-max-plus-convolution）"}
      - {id: abc458_g, role: practice, summary: "（執筆時に確かめる）", approach: "答えの二分探索と、(max,+) 畳み込みを使う DP（research/00 §2.3.8 の分類。節 convex-max-plus-convolution）"}
    sources: ["02-dp §4.K（monge・monotone-minima・smawk-larsch・knuth-yao・convex-max-plus-convolution・dp-convexity）", "02-dp §2.5", "02-dp §5.1", "00-curriculum §2.3.8（abc458_g）"]

