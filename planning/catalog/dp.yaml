    acl: []
    frequency: B
    sections:
      - "足し算の更新は引き算で戻せる（ループの向きは追加と逆）"
      - "戻せない DP（max・min・OR）"
      - "前後からの DP をマージする"
      - "分割統治でオフラインに処理する（黄）"
    merged_keys: [undo-dp]
    visual: "追加の更新（大きい方から足す）と削除の更新（小さい方から引く）を同じ配列の上で並べるステップ送り"
    problems:
      - {id: abc321_f, role: example, summary: "箱への追加・削除のたびに、和が K になる選び方の数を答える。削除は追加の逆向きの更新で戻す"}
      - {id: abc441_f, role: practice, summary: "max のナップサックは戻せないので、前後からの DP を保存し、i を除いた最適値をマージで求める"}
      - {id: arc070_b, role: practice, summary: "各カードを除いた部分和で不要かを判定する。戻す DP か前後からの DP のマージで解く"}
    sources: ["02-dp §4.B（knapsack-undo）", "02-dp §5.1", "00-curriculum §4.2（戻す DP）"]

