      - "leading zero を区別するとき"
      - "2進の桁 DP（XOR・AND）"
      - "割る数を全探索して桁 DP を繰り返す"
      - "落とし穴：N 自身を含むか・0 を数えるか"
    merged_keys: []
    visual: "N の桁を並べ、「ここで初めて N より小さい数字を選ぶ」分岐を木で描き、一致したままの道が1本だけであることを示すステップ送り"
