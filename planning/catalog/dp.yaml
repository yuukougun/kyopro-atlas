  - id: dp-dimension-reduction
    chapter: DP の考え方
    title: DP の状態の削減（値と添字の入れ替え・上限での打ち切り）
    aliases: [状態の削減, 次元の削減, 状態の圧縮, 値と添字の入れ替え, キーと値を入れ替える, 添字と値を逆に, 上限で打ち切る]
    type: technique
    level: 青
    level_evidence: "drken 氏は abc325_f の解説で、DP の値を使って状態を表すこの手法を青 diff あたりの典型と書いている。該当は abc410_e (1077)・abc219_d (1085) の緑から abc364_e (1496)・abc315_f (1674)・abc325_f (1769)・abc376_f (2089)・abc203_f (2252) と広がる。入口の EDPC E は易しい"
    kind: [DP]
    prerequisites: [dp-state-design, knapsack-01]
    related: [dp-mod-state, lis, inline-dp, meet-in-the-middle]
    summary: "表が大きすぎるときに状態を減らす3つの型：使い終わった段の配列を使い回す、範囲を上限で打ち切る、ほかの添字から決まる量や支配される量を値の側に回す（値と添字の入れ替え）。どれを添字に残すかは、範囲が小さい量で決める。"
    signs:
      - {type: constraint, text: "重さの上限 W ≤ 10^9 で、価値の総和が 10^5 程度"}
      - {type: phrase, text: "2つの量の両方を添字にすると表が大きすぎる（片方を値の最小・最大に回す）"}
      - {type: phrase, text: "目標以上は同じ扱いでよい（上限で打ち切る）"}
      - {type: phrase, text: "ペナルティが指数的に増える（見るべき範囲は log 程度）"}
    acl: []
    frequency: B
    sections:
      - "段の使い回し（2本・1本の配列に）"
      - "上限で打ち切る（目標以上をまとめる・log 回で十分）"
      - "値と添字の入れ替え（同じ添字なら値が良い方が常に良いとき）"
      - "どれを添字に残すか（範囲が小さい量を選ぶ）"
      - "落とし穴：打ち切りの遷移を忘れる・復元が要るのに表を捨てる・入れ替えた後の答えの取り出し"
    merged_keys: [dp-swap-key-value]
    visual: "3つの量 (a, b, c) の立方体の表から c を値に回して平面の表にする図。「重さ→価値の最大」と「価値→重さの最小」の表を並べ、同じ情報を持つことを示す"
    problems:
      - {id: dp_e, role: example, summary: "重さの上限が大きく価値の総和が小さいナップサック。価値を添字に、その価値を作る最小の重さを値にする"}
      - {id: abc364_e, role: example, summary: "甘さとしょっぱさの両方を添字にすると大きいので、しょっぱさを値（最小）に回す"}
      - {id: abc410_e, role: practice, summary: "体力と魔力の両方を添字にせず、残り体力ごとに残せる魔力の最大を値に持つ"}
      - {id: abc315_f, role: practice, summary: "スキップのペナルティが指数的に増えるので、スキップの回数は数十まで見れば足りる"}
      - {id: abc325_f, role: practice, summary: "2種類のセンサーの個数を両方は添字にせず、片方の個数を値（最小）にする"}
      - {id: abc376_f, role: practice, summary: "指示の直後は指定された手の位置が決まるので、状態はもう一方の手の位置だけでよい"}
      - {id: abc203_f, role: challenge, summary: "相手の操作回数（log 回まで）を添字、自分が抜く本数の最小を値にする"}
    sources: ["02-dp §4.A（dp-dimension-reduction・dp-swap-key-value）", "02-dp §5.1", "02-dp §5.3", "02-dp §7.2"]

  - id: dp-reconstruction
    chapter: DP の考え方
    title: DP の復元（選び方の出力・辞書順 K 番目）
    aliases: [DP の復元, 経路復元, DP 復元, DP テーブルからの復元, 辞書順最小の復元, 辞書順 K 番目]
    type: technique
    level: 水
    level_evidence: "選び方を1つ出力させる問題は abc271_d (886)・典型90 056 (★5)・EDPC F から。辞書順最小の復元は abc146_f (1545)・abc369_f (1618)・arc081_c (2072)。research/00 は EDPC F を根拠に基礎（DP の基本の節）を提案したが、出力の形の工夫が要る問題が水から多いので水の単独ページにした"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [dp-order, lcs, path-restoration, lexicographic-greedy, kth-combination, subsequence-dp]
    summary: "最適値だけでなく選び方そのものを出力するために、完成した表を終端から「どの遷移で最適値になったか」を見て逆にたどる。辞書順最小なら後ろからの DP を作って先頭から貪欲に決め、辞書順 K 番目なら後ろからの個数を数えて先頭から決める。"
    signs:
      - {type: phrase, text: "選び方（経路・操作列）を1つ出力せよ"}
      - {type: phrase, text: "条件を満たすものが複数あれば辞書順最小のものを出力せよ"}
      - {type: phrase, text: "辞書順で K 番目のものを出力せよ（K は 10^18 程度）"}
    acl: []
    frequency: B
    sections:
      - "表を残して終端から逆にたどる・遷移元を記録しておく"
      - "最適な遷移が複数あるときの選び方"
      - "辞書順最小の復元（後ろからの DP と前からの貪欲）（青）"
      - "辞書順 K 番目を数え上げで決める（個数が K を超えたら打ち切る）"
      - "落とし穴：使い回した表では辿れない・辿った順の逆転・数え上げの溢れ"
    merged_keys: [dp-kth-lexicographic, dp-restoration]
    visual: "完成した表を終端から逆にたどり、最適値を与えた遷移を光らせるステップ送り。先頭の候補ごとに「その先の個数」を棒グラフにし、K がどの棒に入るかで1文字ずつ決める図"
    problems:
      - {id: abc271_d, role: example, summary: "カードの表裏を選んで和を S にし、その選び方を出力する。可否 DP の表を後ろから辿る"}
      - {id: typical90_bd, role: example, summary: "毎日 A か B を選んで合計を S にし、その選び方を出力する"}
      - {id: abc202_d, role: practice, summary: "a が A 個・b が B 個の文字列の辞書順 K 番目。先頭を a にした場合の個数と K を比べて決める"}
      - {id: dp_f, role: practice, summary: "LCS の表を終端から辿って共通部分列を1つ出力する"}
      - {id: abc146_f, role: practice, summary: "最短手数で辞書順最小の出目の列。ゴールから逆に、届く最も手前のマスを決める"}
      - {id: abc369_f, role: practice, summary: "右・下に移動して集めるコインの最大と、その経路を出力する"}
      - {id: arc081_c, role: challenge, summary: "部分列として現れない最短の文字列のうち辞書順最小のもの。後ろから DP して前から貪欲に復元する"}
    sources: ["02-dp §4.A（dp-reconstruction・dp-kth-lexicographic）", "02-dp §5.1", "00-curriculum §4.2（DP の復元）"]

