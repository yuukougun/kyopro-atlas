# 動的計画法（dp）の目次。規則は planning/catalog/README.md、上位の規則は設計書（planning/design.md）§3〜§5
# 並び順がナビゲーションの順。章の区切りは下のコメントで示す（catalog の形式に章の欄がないため。open_issues を参照）
#   第1章 DP の考え方 / 第2章 列の DP / 第3章 状態の形で分かれる DP / 第4章 DP の高速化
# 確率・期待値・ゲームの DP と包除 DP は comb が持ち主（設計書 §4.2）。dp の各ページからは related でリンクする
field: dp
pages:

  # ── 第1章 DP の考え方 ──────────────────────────────

  - id: dp-basics
    chapter: DP の考え方
    title: DP の基本（状態・遷移・配る DP と貰う DP）
    aliases: [動的計画法, DP, 漸化式, 配る DP, 貰う DP, 配るDP, 貰うDP, push 型, pull 型]
    type: technique
    level: 基礎
    level_evidence: "状態1次元・遷移が定数個の DP をそのまま問う問題は abc245_c (403)・abc240_c (464)・abc211_c (559)・abc129_c (796)・abc099_c (1101) と灰〜緑に集中する。配る・貰うの使い分けが効くのは水（abc179_d 1251）で、その先は dp-prefix-sum へつなぐ"
    kind: [DP]
    prerequisites: [complexity-estimation, brute-force]
    related: [memoized-recursion, dp-dag, dp-state-design, dp-prefix-sum, dp-speedup-overview, greedy-basics, expected-value-dp, game-dp]
    summary: "途中の状況（状態）ごとに最良値や場合の数を1回だけ求めて表に残し、全探索で何度も現れる同じ部分問題をまとめる手法。状態・遷移・初期値・答えの取り出し方の4つを決めれば書ける。"
    signs:
      - {type: phrase, text: "〜の最小値・最大値を求めよ（前から順に1つずつ選んでいく）"}
      - {type: phrase, text: "〜の方法の数を 998244353 で割った余り"}
      - {type: phrase, text: "ちょうど X にできるか（可否の判定）"}
      - {type: constraint, text: "N ≤ 10^5 程度で、各位置の選択肢が数通り（全探索だと K^N 通り）"}
    acl: []
    frequency: A
    sections:
      - "状態・遷移・初期値・答えの4つを決める"
      - "最適化・数え上げ・可否判定を同じ骨組みで書く（演算と単位元・到達できない状態の表し方）"
      - "配る DP と貰う DP（どちらも各遷移を1回ずつ使う）"
      - "貰う形にすると遷移元が区間になり、累積和でまとめられる（水）"
      - "貪欲で解けないことの確かめ方（反例から DP へ）"
      - "DP の型の地図（列・区間・集合・桁・木・順列、確率・期待値・ゲームの DP、高速化）"
      - "落とし穴：到達できない状態の INF に足して溢れる・mod の取り忘れ・添字のずれ"
    merged_keys: [dp-push-pull]
    visual: "全探索の木と DP の表を並べ、同じ状態が合流して1回の計算で済む様子のステップ送り。同じ表の上に、配る（矢印を出す）と貰う（矢印を集める）を色違いで描く"
    problems:
      - {id: dp_a, role: example, summary: "1つ前か2つ前の足場から跳ぶ最小コスト。配る形と貰う形の両方で書く"}
      - {id: abc240_c, role: practice, summary: "毎回 a_i か b_i 進んで、ちょうど X に着けるか（可否判定の基本形）"}
      - {id: dp_b, role: practice, summary: "Frog 1 の跳び方が K 通りに増えた形"}
      - {id: abc129_c, role: practice, summary: "壊れた段を避けて1段か2段ずつ上る方法の数（数え上げの基本形）"}
      - {id: abc099_c, role: practice, summary: "1円・6^k 円・9^k 円の引き出しで N 円にする最小回数（貪欲では解けない）"}
    sources: ["02-dp §4.A（dp-basics・dp-push-pull）", "02-dp §2.1", "02-dp §2.3", "02-dp §5.1", "02-dp §5.3", "02-dp §6.3"]

  - id: memoized-recursion
    chapter: DP の考え方
    title: メモ化再帰
    aliases: [メモ化, 再帰 DP, トップダウン DP, map でメモ化, map DP, 疎な DP]
    type: technique
    level: 基礎
    level_evidence: "素直なメモ化の abc340_c (528)・abc275_d (606) が基礎（どちらも map で到達する値だけを持つ）。計算順が自明でない・状態がまばらな問題は abc357_e (1295)・abc300_e (1354)・abc350_e (1385) と水に続くが、メモ化そのものは基礎の道具として扱う"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [dp-order, dp-dag, cpp-recursive-lambda, cpp-stack-depth, digit-dp-advanced, game-dp, expected-value-dp, probability-dp, dp-with-cycles]
    summary: "漸化式を再帰関数のまま書き、計算済みの値を覚えて使い回す DP の書き方。計算順序を考えなくてよく、実際に訪れる状態だけを計算するので、⌊N/2⌋ や ⌊N/3⌋ しか現れないようなまばらな状態に強い。"
    signs:
      - {type: constraint, text: "N ≤ 10^18 で、⌊N/2⌋・⌊N/3⌋ のような値しか現れない"}
      - {type: phrase, text: "計算の順番が分かりにくい（値の大小で移る・ゲームの局面・依存関係が DAG）"}
      - {type: phrase, text: "f(n) が f(⌊n/k⌋) などで再帰的に定義されている"}
    acl: []
    frequency: A
    sections:
      - "再帰とメモの書き方（未計算の印と答えの値の衝突を避ける）"
      - "ボトムアップとの使い分け（速さ・スタック・高速化の載せやすさ）"
      - "到達する状態だけを持つ（map でメモ化・現れる値の個数の見積もり）"
      - "落とし穴：再帰が深いとスタックが溢れる・閉路があると止まらない・自己ループは移項してから書く"
    merged_keys: [dp-map-sparse]
    visual: "再帰の呼び出し木を描き、メモに当たった呼び出しを灰色にして枝が刈られる様子を見せる。N → ⌊N/2⌋・⌊N/3⌋ の木で同じ値が合流する図"
    problems:
      - {id: abc340_c, role: example, summary: "N を半分に割り続けるときの総コスト。現れる値が少ないので map でメモ化する"}
      - {id: abc275_d, role: practice, summary: "f(k) = f(⌊k/2⌋) + f(⌊k/3⌋) を map でメモ化して求める"}
      - {id: dp_g, role: practice, summary: "DAG の最長路。メモ化再帰なら計算順序を考えずに済む"}
      - {id: abc357_e, role: practice, summary: "関数グラフで各頂点から到達できる頂点の数。サイクルを先に処理し、残りをメモ化再帰で数える"}
      - {id: abc300_e, role: practice, summary: "サイコロを振って積が N になる確率。到達しうる値（2・3・5 の積）だけをメモ化する"}
      - {id: abc380_f, role: challenge, summary: "カードの所在と手番を状態にした2人ゲームの勝敗を、メモ化再帰で判定する"}
    sources: ["02-dp §4.A（memoized-recursion・dp-map-sparse）", "02-dp §5.1", "02-dp §5.3"]

  - id: dp-dag
    chapter: DP の考え方
    title: DAG 上の DP
    aliases: [DAG DP, DAG の最長路, 最長路, 経路の数え上げ, トポロジカル順の DP]
    type: technique
    level: 基礎
    level_evidence: "DAG 上の DP そのものは基礎（EDPC G・abc232_d 539・abc211_d 755）。graph の調査（03）の dag-dp も基礎。DAG だと気づく・作る型は水（abc188_e 1170・abc357_e 1295・abc139_e 1528・abc335_e 1540）"
    kind: [DP, グラフ探索]
    prerequisites: [dp-basics, topological-sort]
    related: [dp-order, memoized-recursion, shortest-path-dag, scc, functional-graph, reachability-bitset, dp-decision-binary-search]
    summary: "閉路のない有向グラフ（DAG）では、トポロジカル順に DP すれば最長路や経路の数が O(N+M) で求まる。どの DP も「状態を頂点・遷移を辺とする DAG の上の最短路・最長路・数え上げ」と見られる。"
    signs:
      - {type: phrase, text: "番号の小さい頂点から大きい頂点へだけ辺がある（u < v）"}
      - {type: phrase, text: "値が増える向きにしか移動できない・右か下にしか動けない"}
      - {type: phrase, text: "最長の経路の長さ・経路の本数・最短経路の本数"}
      - {type: phrase, text: "依存関係に従って順に決める（閉路があれば −1）"}
    acl: []
    frequency: B
    sections:
      - "DP は DAG 上の最短路・最長路・数え上げ"
      - "順序の作り方（Kahn 法・DFS の帰りがけ順の逆・メモ化再帰・問題の性質から）"
      - "DAG だと気づく・作る（値の順・距離の層・同じ値の頂点をまとめる）（水）"
      - "最短路の本数（距離が確定した順に配る）"
      - "閉路があるとき（SCC で縮約する・最短路に切り替える）"
    merged_keys: [dag-dp]
    visual: "DP の表と同じ構造のグラフを並べ、列の DP やグリッドの DP が DAG の特別な場合であることを示す図"
    problems:
      - {id: dp_g, role: example, summary: "閉路のない有向グラフの最長路。トポロジカル順に回すか、メモ化再帰で求める"}
      - {id: abc211_d, role: practice, summary: "BFS で距離が1増える辺だけからなる DAG の上で、最短路の本数を数える"}
      - {id: abc139_e, role: practice, summary: "総当たり戦の最少日数。試合を頂点、順序の制約を辺にした依存関係を順に処理する（閉路があれば不可能）"}
      - {id: abc335_e, role: practice, summary: "値が減らないパスの得点の最大。同じ値の隣接頂点をまとめてから、値の順に DP する"}
    sources: ["02-dp §4.A（dp-dag）", "03-graph §4.C（topological-sort の DAG 上の DP の節）", "03-graph §5.2（dag-dp）", "02-dp §5.1"]

  - id: dp-order
    chapter: DP の考え方
    title: DP の計算順序（依存関係の順・後ろから解く）
    aliases: [計算順序, ループの順番, 後ろから DP, 逆順 DP, トポロジカル順]
    type: technique
    level: 水
    level_evidence: "後ろから・値の順・トポロジカル順に計算しないと解けない問題が abc188_e (1170)・abc266_e (1227)・abc197_e (1379)・abc146_f (1545)・abc341_f (1604)・abc195_e (1609) と水〜青に集まる"
    kind: [DP]
    prerequisites: [dp-basics, dp-dag]
    related: [memoized-recursion, interval-dp, bit-dp, dp-reconstruction, reverse-thinking, expected-value-dp, game-dp]
    summary: "dp[x] を計算する時点で、依存する値がすべて確定している順に状態を回す。添字の昇順だけでなく、後ろから・値の順・区間の長さ順・集合の包含順・木の帰りがけ順などを、依存関係の向きから選ぶ。"
    signs:
      - {type: phrase, text: "終わりの状態の値が分かっている（ゲームの終局・残り回数 0・ゴールでの期待値 0）"}
      - {type: phrase, text: "値の小さい（大きい）方へしか移れない"}
      - {type: phrase, text: "i 番目以降で最適に行動したときの値を考えると漸化式が立つ"}
    acl: []
    frequency: A
    sections:
      - "依存グラフと計算順序の原則（閉路があれば DP にならない）"
      - "典型の順序（添字・逆順・値の順・区間の長さ順・集合の昇順・木の帰りがけ順）"
      - "後ろから解くサイン（終わりの値が分かっている・辞書順最小の復元）"
      - "期待値 DP・ゲーム DP の計算順序（数え上げ・確率・ゲームの章へ）"
      - "落とし穴：2重ループの内外の順・逆順の境界・配る形で未確定の値を配る"
    merged_keys: []
    visual: "状態の依存グラフを描き、添字順・逆順・値の順・区間の長さ順・集合の包含順・木の帰りがけ順の6つを同じ図式で並べる"
    problems:
      - {id: abc188_e, role: example, summary: "番号の小さい町から大きい町へだけ道がある。後ろから「そこから行ける町の最高の売値」を埋める"}
      - {id: abc266_e, role: practice, summary: "振り直せるサイコロで出目の期待値の最大。残り回数の少ない方から決める"}
      - {id: abc197_e, role: practice, summary: "色の小さい順にボールを回収する。各色を終えた位置（左端か右端）を状態にする"}
      - {id: abc146_f, role: practice, summary: "最短手数で辞書順最小の出目の列。ゴールから逆に、届く最も手前のマスを決める"}
      - {id: abc341_f, role: practice, summary: "駒は値の小さい隣の頂点にしか移らない。値の小さい頂点から順に、各頂点でナップサックを解く"}
    sources: ["02-dp §4.A（dp-order）", "02-dp §5.1", "02-dp §5.3"]

  - id: dp-state-design
    chapter: DP の考え方
    title: DP の状態の設計（何を覚えれば十分か）
    aliases: [状態設計, DP の状態, 直前を状態に持つ, 環状 DP, 円環 DP, 括弧列の DP, カッコ列の DP]
    type: technique
    level: 水
    level_evidence: "直前の選択・on/off・個数を1次元足す型は abc306_d (596)・abc303_d (778)・abc312_d (964) と基礎。何を覚えれば十分かを見抜く・情報を圧縮する型が abc322_e (1193)・abc307_e (1240)・abc232_e (1380)・abc359_d (1381)・abc265_e (1531)・abc175_e (1554) と水に集まる"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [dp-dimension-reduction, dp-mod-state, dp-phase, bit-dp, bracket-sequence, string-automaton-dp, dp-counting-dedup]
    summary: "過去の選び方そのものではなく、残りの選び方と評価に影響する要約（直前の値・on/off・個数・末尾の数文字・開き括弧の数など）だけを状態に持つ。要約が同じなら将来の最適な選び方も同じなので、まとめても答えは変わらない。"
    signs:
      - {type: phrase, text: "隣り合う〜が異なる・同じことを連続して〜しない"}
      - {type: phrase, text: "直前の選択でコストが変わる・モードが切り替わる"}
      - {type: phrase, text: "円形に並んでいる（最後と最初も隣り合う）"}
      - {type: phrase, text: "'(' と ')' と '?' の列から正しい括弧列を作る方法の数"}
      - {type: constraint, text: "制約の一部だけが小さい（K ≤ 5、末尾の K ≤ 10 文字、文字の種類 26）"}
    acl: []
    frequency: A
    sections:
      - "将来に効く要約だけを持てば合流できる理由"
      - "典型の要約（直前の値・on/off・偶奇・個数・上限で打ち切った値・末尾の数文字）"
      - "括弧列の DP（開き括弧の残り数を状態にする）"
      - "環状の列（1か所で切り、最初の状態を固定して DP を回す）"
      - "状態数の見積もり（(P+1)^K・2^K）"
      - "落とし穴：最適値だけを持って状態を潰しすぎる"
    merged_keys: [dp-cyclic, bracket-dp]
    visual: "過去の選び方の木と、将来に効く要約でまとめた状態の表を並べ、同じ要約の枝が合流する図。括弧列を開き括弧の数の折れ線として描き、0 未満に潜らない経路を数える図"
    problems:
      - {id: dp_c, role: example, summary: "同じ活動を2日続けない幸福度の最大。前日の活動を状態に足す"}
      - {id: abc306_d, role: example, summary: "料理を順に食べるか選び、お腹の状態2通りを状態にして美味しさの和を最大化する"}
      - {id: abc312_d, role: practice, summary: "'?' を '(' か ')' に置き換えて正しい括弧列にする方法の数。開き括弧の残り数を状態にする"}
      - {id: abc322_e, role: practice, summary: "K（≤ 5）個の能力値を目標値 P で打ち切ったベクトルを状態にした最小コスト"}
      - {id: abc307_e, role: practice, summary: "円形に並ぶ人に隣と異なる整数を配る方法の数。最初の人と同じ値かどうかを状態にする"}
      - {id: abc232_e, role: practice, summary: "行・列が目的地と一致するかの4状態にまとめて、K 手の経路の数を数える"}
      - {id: abc359_d, role: practice, summary: "末尾 K−1 文字を bit で状態に持ち、長さ K の回文を含まない埋め方を数える"}
      - {id: abc175_e, role: practice, summary: "グリッドの経路で、今の行で拾った個数を状態にして価値の和を最大化する"}
      - {id: abc345_e, role: challenge, summary: "隣が同じ色にならない部分列の価値の最大。遷移元の上位2つ（色が異なる）だけを持って速くする"}
    sources: ["02-dp §4.A（dp-state-design・dp-cyclic）", "02-dp §4.C（bracket-dp）", "02-dp §5.1", "02-dp §5.3", "08-string-geo §4.1（bracket-sequence）"]

  - id: dp-mod-state
    chapter: DP の考え方
    title: 余り・個数を状態に持つ DP
    aliases: [余りを状態に, mod DP, 倍数の数え上げ, 平均が整数]
    type: technique
    level: 水
    level_evidence: "abc220_d (664)・abc281_d (1031) の基礎から、abc262_d (1213)・abc135_d (1334)・arc060_a (1583) と水に集まり、abc195_e (1609)・abc207_e (1820) が青"
    kind: [DP, 整数論]
    prerequisites: [dp-state-design, mod-arithmetic]
    related: [digit-dp, subset-sum, knapsack-01, dp-sequence-partition, game-dp]
    summary: "条件が「和や積が M の倍数」「平均が整数」のときは、和そのものではなく M で割った余りを状態に持てば足りる。平均は選ぶ個数を外側で固定するか、各値から平均を引いて「和が 0」に直す。"
    signs:
      - {type: phrase, text: "和（積）が M の倍数になる選び方の数"}
      - {type: phrase, text: "平均が整数になる・平均がちょうど A になる選び方の数"}
      - {type: phrase, text: "'?' を埋めた数を M で割った余りが r になるものの数"}
      - {type: constraint, text: "M ≤ 1000 程度、N ≤ 100 程度"}
    acl: []
    frequency: B
    sections:
      - "余りを状態にしてよい理由（足し算・掛け算と mod が両立する）"
      - "個数も状態に持つ（K 個選んで和が D の倍数）"
      - "平均の扱い（個数を外側で固定する・平均を引いて和 0 にする）"
      - "後ろから余りごとの勝敗を決めるゲーム（青）"
      - "落とし穴：C++ の % が負になる・状態の mod と答えの mod の混同"
    merged_keys: []
    visual: "和の数直線を M ごとに折り返して円にし、状態が M 個にまとまる図"
    problems:
      - {id: abc281_d, role: example, summary: "K 個選んで和が D の倍数になるときの和の最大。個数と和の余りを状態にする"}
      - {id: abc262_d, role: example, summary: "平均が整数になる選び方の数。選ぶ個数 k を外側で固定し、個数と和の k での余りを状態にする"}
      - {id: abc220_d, role: practice, summary: "先頭2つを足すか掛けて1桁にする操作の結果が k になる数。下1桁を状態にする"}
      - {id: abc135_d, role: practice, summary: "'?' を埋めた数のうち 13 で割って 5 余るものの数"}
      - {id: arc060_a, role: practice, summary: "平均がちょうど A になる選び方の数。各値から A を引いて和を 0 にする"}
      - {id: abc195_e, role: practice, summary: "2人ゲームの勝敗を後ろから、7 で割った余りごとに決める"}
