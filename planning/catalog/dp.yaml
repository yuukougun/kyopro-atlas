      - {id: abc464_g, role: practice, summary: "（執筆時に確かめる）", approach: "隣り合わない k 個を選ぶ和の最大を、すべての k について求める。選択を取り消せる優先度付きキューの貪欲で解く（節 undoable-greedy）"}
