    signs:
      - {type: constraint, text: "N ≤ 300〜500 で O(N^3) が通る"}
      - {type: phrase, text: "隣り合うものを合体させる・消す操作のコストの最小"}
      - {type: phrase, text: "列の両端から交互に取っていく"}
      - {type: phrase, text: "括弧の対応・回文"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として 1 ページに届く（直接 1）・古い ABC 7 問"
    sections:
      - {title: "長さ順に埋める理由（l を昇順に回すと困ること）", anchor: by-length}
      - {title: "分割点型（最後に行う操作で区間を 2 つに割る）", anchor: split-point}
      - {title: "両端型（左端か右端を取る）", anchor: ends}
      - {title: "最後に残す・最後に消すものを決める型", anchor: last-operation}
      - {title: "端の相手で分ける数え上げ（二項係数で操作の順序を混ぜる）", anchor: pair-with-left-end}
    merged_keys: []
    visual: {kind: dynamic, priority: 2, text: "上三角の表を対角線（区間の長さ）ごとに埋めるステップ送り。区間を分割点で 2 つに割る木の図"}
    problems:
      - {id: dp_n, role: example, summary: "隣り合うスライムを合体させるたびに大きさの和のコストがかかるとき、全部を 1 匹にするコストの最小を求める。", approach: "最後に合体する境目で分ける"}
      - {id: typical90_s, role: example, representative: true, summary: "2N 個の数の列から隣り合う 2 つを取り除く操作を繰り返して全部消すとき、取り除く 2 つの差の絶対値の和の最小を求める。", approach: "外側の 2 つを最後に取る場合と、分割する場合に分ける"}
      - {id: dp_l, role: practice, summary: "数列の両端から交互に 1 つずつ取る 2 人ゲームで、両者が最適に取るときの先手の得点 − 後手の得点を求める。", approach: "残った区間ごとに得点差の最大を求める（例題は comb の minimax）"}
      - {id: tdpc_iwi, role: practice, summary: "i と w からなる文字列から、連続する 'iwi' を取り除く操作を繰り返すとき、操作回数の最大を求める。", approach: "区間を全部消せるかを判定する区間 DP"}
      - {id: abc217_f, role: practice, summary: "2N 人の列から、仲の良い隣り合う 2 人を取り除く操作を N 回行う方法の数を求める。", approach: "左端と組む相手で分け、二項係数で順番を混ぜる（節 pair-with-left-end）"}
      - {id: abc163_e, role: practice, summary: "活発度 A_i の幼児を並べ替えて、各幼児の移動距離×活発度の和の最大を求める。", approach: "活発度の大きい順に左端か右端へ並べ、残った区間を状態にする（例題は exchange-argument-dp）"}
      - {id: abc325_g, role: challenge, summary: "文字列に 2 種類の削除の操作（連続する 'of' を消す・ある文字の後ろの K 文字までを消す）を好きなだけ行ったときの、長さの最小を求める。", approach: "区間の先頭の文字を最後にどう消すかで分ける"}
    sources: ["02-dp §4.D（interval-dp）", "02-dp §5.1", "02-dp §2.4"]

