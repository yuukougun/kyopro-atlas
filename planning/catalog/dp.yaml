    visual: {kind: static, priority: 2, text: "集合 S の部分集合 T を (T − 1) & S で列挙する様子と、Σ 2^|S| = 3^N になる理由（各要素が 3 状態）の図"}
    problems:
      - {id: dp_u, role: example, summary: "N 羽のうさぎをいくつかのグループに分け、同じグループになった組ごとの得点の和を最大化する。", approach: "各集合をその部分集合と残りに分ける"}
      - {id: abc187_f, role: example, representative: true, summary: "N 頂点（≤ 18）のグラフの辺を取り除き、各連結成分の中がすべて辺で結ばれるようにするときの、連結成分の数の最小を求める。", approach: "完全グラフになる部分集合を前計算し、部分集合の部分集合を列挙する"}
      - {id: abc310_d, role: practice, summary: "N 人を T 個のチームに分ける方法のうち、仲の悪い組が同じチームにならないものの数を求める。", approach: "番号最小の未所属者を含むチームから決める（3^N でも全探索でも解ける）"}
      - {id: typical90_as, role: practice, summary: "平面上の N 点を K 個のグループに分け、各グループ内の 2 点間の距離の最大の、全グループでの最大を最小化する。", approach: "各部分集合の直径を前計算し、部分集合の部分集合を列挙する"}
      - {id: abc321_g, role: challenge, summary: "部品の端子を電線でランダムにつないだときの、連結成分の個数の期待値を求める。", approach: "連結成分になる部分集合ごとに、その集合がちょうど 1 つの成分になる場合の数を数える"}
    sources: ["02-dp §4.E（subset-enumeration-dp）", "02-dp §5.1", "00-curriculum §3.2（kadane-and-submask）"]

  - id: broken-profile-dp
    chapter: 状態の形で分かれる DP
    title: プロファイル DP
    aliases: [Broken Profile DP, 插頭 DP, フロンティア法, 連結性 DP, スライド bitDP, 敷き詰めの DP]
    type: technique
    level: 黄
    level_evidence: "行ごとの配置パターンを状態にする基本形は abc113_d (1597) にあるが、マス単位の境界状態や圧縮が必要なのは typical90_w (★7)・abc204_f (2044)・abc379_g (2304、2024)。連結性を持つものは TDPC S・abc296_h (2822) で発展"
    kind: [DP, ビット演算]
    prerequisites: [bit-dp]
    related: [matrix-power#profile-dp, dp-grid, grid#tiling]
    summary: "幅の小さいグリッドを 1 マスずつ進め、まだ処理していない部分に影響する境界の情報だけを bit で持って、敷き詰め方や塗り方を数える。取り得る状態だけに圧縮すると状態がさらに減る。"
    signs:
      - {type: constraint, text: "グリッドの短い辺 ≤ 6〜14"}
      - {type: phrase, text: "タイル・ドミノの敷き詰め方の数"}
      - {type: phrase, text: "隣り合わないように置く・隣と異なる色で塗る方法の数"}
      - {type: phrase, text: "黒マスが連結になる塗り方"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 4 問"
    sections:
      - {title: "1 行ずつ進める（行の配置パターンを状態に）", anchor: row-by-row}
      - {title: "1 マスずつ進める（境界の折れ線を状態に）", anchor: cell-by-cell}
      - {title: "取り得る状態だけを列挙して番号を付ける（圧縮）", anchor: compress}
      - {title: "長さが巨大なら行列累乗と組み合わせる", anchor: with-matrix-power}
      - {title: "連結性を持つ（フロンティア法）", anchor: connectivity, level: 発展}
    merged_keys: []
    visual: {kind: dynamic, priority: 3, text: "走査線（折れ線の境界）を 1 マスずつ進め、境界上の bit が書き換わる様子のステップ送り（静的な図で代えてよい）"}
    problems:
      - {id: abc113_d, role: example, summary: "高さ H・縦線 W 本のあみだくじで、横線どうしが端点を共有しないように横線を引き、1 番左の縦線から下りると K 番目に着くものの数を求める。", approach: "1 段ごとの横線のパターンを状態にして下へ進む（節 row-by-row）"}
      - {id: abc379_g, role: example, representative: true, summary: "1・2・3 と '?' からなるグリッドの '?' を 1〜3 で埋め、隣り合うマスの数がすべて異なるようにする方法の数を求める（H×W ≤ 200）。", approach: "1 マスずつ進め、確定済みの境界を状態にし、取り得る状態だけに圧縮する"}
      - {id: typical90_w, role: practice, summary: "H×W の盤の空いたマスに、互いに隣接（8 近傍）しないようにキングを置く方法の数を求める。", approach: "1 マスずつ進め、直前の W+1 マスの状態を圧縮して持つ"}
      - {id: abc204_f, role: practice, summary: "H×W（H ≤ 6、W ≤ 10^12）の部屋に 1×1 と 1×2 の畳を敷き詰める方法の数を求める。", approach: "列のはみ出しを bit で持つ状態を行列にして累乗する（節 with-matrix-power）"}
      - {id: tdpc_grid, role: challenge, summary: "H×W（H ≤ 6）のグリッドを白黒に塗り、左上と右下が黒マスだけを通ってつながるようにする方法の数を求める。", approach: "境界上の連結の状態を持つ（節 connectivity）"}
      - {id: abc296_h, role: challenge, summary: "白黒のグリッドで、白マスをいくつか黒に塗って黒マス全体を連結にするときの、塗るマスの数の最小を求める。", approach: "境界上の連結成分を状態にする（節 connectivity）"}
    sources: ["02-dp §4.E（broken-profile-dp）", "02-dp §5.1"]

  - id: digit-dp
    chapter: 状態の形で分かれる DP
    title: 桁 DP
    aliases: [Digit DP, smaller フラグ, 未満フラグ, leading zero]
    type: technique
    level: 水
    level_evidence: "abc154_e (1298)・abc135_d (1334)・abc465_e (1417、2026)・abc117_d (1423)・abc336_e (1538、2024)・abc129_e (1547)・abc155_e (1569) と水に集中し、abc319 以降の 2 問も水。AtCoder Tags の Digit-DP は水 7・黄 5・青 1 と分かれるので、応用を黄の別ページにした（設計書 §4.1）"
    kind: [DP, 数え上げ]
    prerequisites: [dp-state-design, mod-arithmetic]
    related: [digit-dp-advanced, dp-mod-state, bitwise-independence#top-down, string-automaton-dp]
    summary: "N 以下の整数のうち条件を満たすものの個数や総和を、上の桁から決め、それまでの桁が N と一致しているかのフラグと問題の情報を状態にして求める。計算量は桁数に比例する。"
    signs:
      - {type: constraint, text: "N ≤ 10^18、または N が 10^4 桁の文字列"}
      - {type: phrase, text: "N 以下で条件を満たす整数の個数・総和"}
      - {type: phrase, text: "各桁の和・0 でない桁の数"}
      - {type: phrase, text: "K 以下の X について、XOR や AND の条件を満たすものを数える・最大化する"}
    acl: []
    frequency: A
    frequency_evidence: "recent 2（abc465_e・abc466_g）・前提として 1 ページに届く（直接 1）・古い ABC 6 問"
    sections:
      - {title: "N と一致しているかのフラグ（一致したままの道は 1 本だけ）", anchor: tight-flag}
      - {title: "問題の情報を状態に足す（桁和の余り・個数）", anchor: extra-state}
      - {title: "leading zero を区別するとき", anchor: leading-zero}
      - {title: "2 進の桁 DP（XOR・AND）", anchor: binary}
      - {title: "割る数を全探索して桁 DP を繰り返す", anchor: fix-divisor}
      - {title: "落とし穴：N 自身を含むか・0 を数えるか", anchor: pitfalls}
    merged_keys: []
    visual: {kind: dynamic, priority: 1, text: "N の桁を並べ、「ここで初めて N より小さい数字を選ぶ」分岐を木で描き、N と一致したままの道が 1 本だけであることを示すステップ送り"}
    problems:
      - {id: dp_s, role: example, summary: "1 以上 K 以下（K は最大 10^4 桁）の整数のうち、各桁の和が D の倍数になるものの個数を求める。", approach: "K と一致しているかのフラグと、桁和の余りを状態にする"}
      - {id: abc154_e, role: example, representative: true, summary: "1 以上 N 以下（N < 10^100）の整数のうち、0 でない数字がちょうど K 個のものの個数を求める。", approach: "N と一致しているかのフラグと、0 でない桁の数を状態にする"}
      - {id: abc135_d, role: practice, summary: "数字と '?' からなる文字列の '?' を埋めてできる整数のうち、13 で割って 5 余るものの数を求める。", approach: "上の桁から余りを状態に持つ（上限のフラグは要らない。例題は dp-mod-state）"}
      - {id: abc465_e, role: practice, summary: "（執筆時に確かめる）", approach: "使った数字の集合と 3 で割った余りを状態にした桁 DP（research/00 §2.3.8 の分類）"}
      - {id: abc117_d, role: practice, summary: "0 以上 K 以下の整数 X のうち、Σ (X xor A_i) を最大にするときの最大値を求める。", approach: "2 進の上の桁から、K と一致しているかのフラグで決める（節 binary）"}
      - {id: abc336_e, role: practice, summary: "N 以下（N ≤ 10^14）の正の整数のうち、各桁の和で割り切れるものの個数を求める。", approach: "桁和を固定して、桁和と余りを状態にした桁 DP を繰り返す（節 fix-divisor）"}
      - {id: abc129_e, role: practice, summary: "2 進数で与えられた L について、a + b ≤ L かつ a + b = a xor b を満たす非負整数の組 (a, b) の個数を求める。", approach: "2 進の桁ごとに a・b のビットを決める（節 binary）"}
    sources: ["02-dp §4.F（digit-dp）", "02-dp §5.1", "02-dp §2.4", "00-curriculum §2.3.8（abc465_e）"]

  - id: digit-dp-advanced
    chapter: 状態の形で分かれる DP
    title: 桁 DP の応用
    aliases: [繰り上がりの DP, 上限と下限の桁 DP, 複数の数の桁 DP]
    type: technique
    level: 黄
    level_evidence: "abc208_e (2024)・abc317_f (2072)・abc182_f (2121)・abc235_f (2129)・abc194_f (2197)・abc172_f (2216) と黄に集まる。青では abc231_e (1740)・arc123_c (1827)。abc319 以降の根拠は見つかっていない（古い問題で決めた）"
    kind: [DP, 数え上げ]
    prerequisites: [digit-dp]
    related: [memoized-recursion, bit-dp, dp-mod-state]
    summary: "桁 DP を、2 つ以上の数を同時に決める・下の桁からの繰り上がりを状態にする・種類の少ない状態を map や bit で持つ、などに広げる。上限と下限の両方があるときはフラグを 2 つ持つ。"
    signs:
      - {type: phrase, text: "2 つ以上の数を同時に決める（a + b = a xor b・3 つの数の xor）"}
      - {type: phrase, text: "支払いとお釣りの枚数の最小"}
      - {type: phrase, text: "使った数字の種類数・指定の数字を全部含む数"}
      - {type: phrase, text: "L ≤ x ≤ y ≤ R の組を数える（上限と下限の両方）"}
    acl: []
    frequency: B
    frequency_evidence: "recent 1（abc466_g）・前提として届くページなし・古い ABC 8 問"
    sections:
      - {title: "複数の数を同時に決める（フラグを並べる）", anchor: multiple-numbers}
      - {title: "上限と下限の両方（2 つのフラグ）", anchor: lower-and-upper}
      - {title: "下の桁からの繰り上がりを状態にする", anchor: carry}
      - {title: "状態の種類が少ないことを使う（桁の積を map で・数字の集合を bit で）", anchor: sparse-states}
      - {title: "個数と総和を同時に持つ（総和 += 個数×桁の値）", anchor: count-and-sum}
    merged_keys: []
    visual: {kind: static, priority: 3, text: "複数の数の桁を縦に並べ、各数のフラグを並べて持つ図。繰り上がりを下の桁から運ぶ図"}
    problems:
      - {id: abc231_e, role: example, summary: "各額面が次の額面を割り切る硬貨で X 円を払い、お釣りを受け取るときの、やり取りする硬貨の枚数の最小を求める。", approach: "下の桁から繰り上がりの有無を状態にする（節 carry）"}
      - {id: abc208_e, role: example, representative: true, summary: "N 以下（N ≤ 10^18）の正の整数のうち、各桁の積が K 以下のものの個数を求める。", approach: "積の種類が少ないので map で状態を持つ（節 sparse-states）"}
      - {id: abc317_f, role: practice, summary: "N 以下の正の整数の組 (X1, X2, X3) のうち、X1 xor X2 xor X3 = 0 で、各 Xi が A_i の倍数になるものの個数を求める。", approach: "各数の余りとフラグを並べて持つ（節 multiple-numbers）"}
      - {id: abc235_f, role: practice, summary: "N 以下（N < 10^10000）の正の整数のうち、指定された数字をすべて含むものの総和を求める。", approach: "使った数字の集合を状態にし、個数と総和を同時に持つ（節 count-and-sum）"}
      - {id: abc194_f, role: practice, summary: "16 進数で N 以下の正の整数のうち、異なる数字がちょうど K 種類のものの個数を求める。", approach: "N と一致している間は使った数字の集合、一致しなくなったら種類数だけを状態にする"}
      - {id: abc138_f, role: challenge, summary: "L ≤ x ≤ y ≤ R で、y mod x = y xor x を満たす整数の組 (x, y) の個数を求める。", approach: "上限と下限のフラグを両方持ち、最上位ビットが立ったかも状態にする（節 lower-and-upper）"}
    sources: ["02-dp §4.F（digit-dp-advanced）", "02-dp §5.1"]

  - id: tree-dp
    chapter: 状態の形で分かれる DP
    title: 木 DP
    aliases: [Tree DP, 部分木の DP, 木の上の DP]
    type: technique
    level: 水
    level_evidence: "部分木の値を子から集める基本形は typical90_bu (★5)・abc239_e (1084)・abc447_f (1480、2026)・abc133_e (1505)。abc319 以降も abc348_e (1347)・abc447_f が水にあり、abc359_g (2099) が黄。子ごとの得を大きい順に取る型は abc259_f (1961) の青、応用は abc369_g (2055)・abc246_g (2313)。根を動かした差分（全方位の入口）は abc220_f (1304)・abc348_e (1347) と水なので、全方位木 DP（青）からこのページの節に移した（design-review §4.2）。独立集合型（EDPC P）は基本形として水に含め、AtCoder Tags の投票だけが裏付けの abc387_f は根拠から外した"
    kind: [DP, 木]
    prerequisites: [dp-basics, tree-traversal]
    related: [rerooting, tree-dp-square, small-to-large#subtree-merge, tree-diameter, tree-centroid, binary-search-answer#dp-check, cpp-environment#stack-depth, static-top-tree]
    summary: "根を決めると各頂点の部分木は互いに交わらない小問題になるので、部分木ごとの値を子の値から帰りがけ順に求める。頂点自身の選択（白黒・選ぶか）を状態に足すのが基本形である。"
    signs:
      - {type: phrase, text: "木の各頂点を塗る・選ぶ（隣り合う頂点に条件がある）"}
      - {type: phrase, text: "木の辺を選ぶ（次数の上限つき）"}
      - {type: phrase, text: "部分木ごとの値（部分木の上位 K 個など）"}
      - {type: phrase, text: "木の各頂点からほかの全頂点への距離の総和"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として 4 ページに届く（直接 4）・古い ABC 10 問"
    sections:
      - {title: "帰りがけ順に子から集める（再帰なしなら BFS 順の逆）", anchor: postorder}
      - {title: "頂点の選択を状態に足す（独立集合型）", anchor: vertex-states}
      - {title: "子の値の積・和（数え上げ）", anchor: product-of-children}
      - {title: "根から下へ配る", anchor: top-down}
      - {title: "根を動かした差分（全方位の入口）", anchor: reroot-difference}
      - {title: "子ごとの「得」を大きい順に取る", anchor: greedy-children, level: 青}
      - {title: "二分探索と組み合わせて判定にする", anchor: with-binary-search, level: 黄}
      - {title: "部分木の情報をデータ構造で持ってマージする（マージテク）", anchor: tree-dp-merge, level: 黄}
      - {title: "落とし穴：再帰の深さ・親への逆流・根の選び方", anchor: pitfalls}
    merged_keys: [tree-dp-merge]
    visual: {kind: dynamic, priority: 2, text: "葉から根へ値が集まるステップ送り。各頂点の横に dp の組（選ぶ・選ばない）を表示し、親で掛け合わせる式を見せる。根を隣へ移すと距離の和がどれだけ変わるかの図"}
    problems:
      - {id: dp_p, role: example, summary: "N 頂点の木の各頂点を白か黒に塗り、黒どうしが隣り合わないようにする方法の数を求める。", approach: "頂点ごとに白・黒の 2 状態を持つ（節 vertex-states）"}
      - {id: abc220_f, role: example, summary: "N 頂点の木の各頂点について、ほかのすべての頂点への距離の総和を求める。", approach: "根を子へ移すと和が N − 2×（子の部分木のサイズ）だけ変わる（節 reroot-difference）"}
      - {id: abc447_f, role: example, representative: true, summary: "（執筆時に確かめる）", approach: "次数の条件つきの最長パスを、パスの最も浅い頂点で場合分けし、子の長さの上位 2 つから求める（直径の木 DP と同じ形）"}
      - {id: typical90_bu, role: practice, summary: "a か b が書かれた木の辺をいくつか切り、どの連結成分にも a と b の両方が含まれるようにする方法の数を求める。", approach: "根側の成分の中身（a だけ・b だけ・両方）の 3 状態で持つ"}
      - {id: abc239_e, role: practice, summary: "根付き木の各頂点に値があり、頂点 v の部分木に含まれる値の大きい方から K 番目（K ≤ 20）を答えるクエリに答える。", approach: "子の上位 20 個をまとめて求める"}
      - {id: abc348_e, role: practice, summary: "頂点に重み C_i のついた木で、Σ C_i × d(v, i) を最小にする頂点 v での値を求める。", approach: "根を動かした差分で全頂点の値を求める（重み付き重心でも解ける。節 reroot-difference）"}
      - {id: abc133_e, role: practice, summary: "N 頂点の木を K 色で塗り、距離 2 以内の頂点どうしが異なる色になる塗り方の数を求める。", approach: "根から順に、選べる色の数を掛けていく（節 top-down）"}
      - {id: abc259_f, role: practice, summary: "木の辺をいくつか選び、各頂点 i に接する選んだ辺が d_i 本以下になるようにするときの、辺の重みの和の最大を求める。", approach: "親との辺を使うかで分け、子の得の大きい順に取る（節 greedy-children）"}
      - {id: abc359_g, role: challenge, summary: "各頂点に色がついた木で、同じ色の頂点の組すべてについての距離の総和を求める。", approach: "部分木ごとの色の集計を、小さい方から大きい方へ合わせる（節 tree-dp-merge）"}
      - {id: abc246_g, role: challenge, summary: "根から駒を子へ進めていく人と、先回りして頂点の値を 0 にしていく人の 2 人ゲームで、両者が最適に行動したときの、駒を止めた頂点の値を求める。", approach: "答えを二分探索で決め打ちし、木 DP で達成できるかを判定する（節 with-binary-search）"}
    sources: ["02-dp §4.G（tree-dp・tree-dp-merge）", "02-dp §4.G（rerooting：根の移動の差分で済む場合）", "02-dp §5.1", "02-dp §7.2", "04-tree §4.11（tree-diameter：abc447_f）", "04-tree §4.20（small-to-large）"]

  - id: rerooting
    chapter: 状態の形で分かれる DP
    title: 全方位木 DP
    aliases: [Rerooting, ReRooting DP, 換根 DP]
    type: technique
    level: 青
    level_evidence: "一般の全方位木 DP が必要な問題は abc222_f (1934)・abc160_f (2048)・abc223_g (2351)。根の移動の差分で済む距離の和（abc220_f 1304 など）は水なので木 DP のページの節に移し、このページには使い分けの節（when-to-use）だけを残した（design-review §4.2）。abc319 以降で一般の全方位木 DP が要る ABC は確かめられていない（research/02 が根拠に挙げた 2024 年の G は、research/04 がオイラーツアーの問題としているので外した。open_issues 参照）"
    kind: [DP, 木]
    prerequisites: [tree-dp, prefix-sum]
    related: [tree-diameter#eccentricity, tree-edge-contribution#edge-pairs, centroid-decomposition]
    summary: "すべての頂点を根としたときの木 DP の値を、下向きの値と親側の部分木の値を 2 回の DFS で求めて O(N) で出す。兄弟を除いた合成は左右からの累積で作るので逆元が要らない。"
    signs:
      - {type: phrase, text: "すべての頂点について、その頂点を根（起点）としたときの値"}
      - {type: phrase, text: "各頂点から最も遠い頂点までの距離（頂点や辺の重みつき）"}
      - {type: shape, text: "根を v としたときの木 DP の値を、すべての v について求めたい（N 回の木 DP は O(N^2)）"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 4 問"
    sections:
      - {title: "根を隣へ移すと変わるのは親側の部分木だけ", anchor: what-changes}
      - {title: "一般の枠組み（子の値の合成と「根を付ける」操作を分ける）", anchor: framework}
      - {title: "自分以外の兄弟の合成（左右からの累積）", anchor: exclude-self}
      - {title: "使い分け（最遠点は直径の性質で、距離の総和は根の移動の差分で済む）", anchor: when-to-use}
      - {title: "落とし穴：親側の値から自分自身の寄与を除き忘れる", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "根を隣の頂点へ移すとき変わるのは親側の部分木の値だけであることを、色分けした木で示す図"}
    problems:
      - {id: dp_v, role: example, summary: "木の各頂点 v について、v を含み黒の頂点が連結になる塗り方の数を M で割った余りを求める（M は素数とは限らない）。", approach: "左右からの累積で 1 つを除いた積を作る（逆元を使わない。節 exclude-self）"}
      - {id: abc222_f, role: example, representative: true, summary: "辺と頂点に費用がある木で、各頂点から出発してほかの頂点へ観光に行くときの費用の最大を、すべての出発点について求める。", approach: "子からの値に頂点の費用を足して合成する全方位木 DP"}
      - {id: abc160_f, role: practice, summary: "木の各頂点 k について、k に 1 を書き、書いた頂点に隣接する頂点へ 2, 3, … と順に書いていく方法の数を求める。", approach: "部分木のサイズの多項係数を、全方位木 DP で全頂点について求める"}
      - {id: tdpc_tree, role: practice, summary: "木の辺を、描いた辺がつねに連結になるように 1 本ずつ描く順番の数を求める。", approach: "すべての根について木 DP する（全方位でも書ける）"}
    problems_note: "abc319 以降で一般の全方位木 DP が要る ABC は research で確かめられていない（abc348_e は根を動かした差分で済むので木 DP のページの節に置いた）。工程 8b の前の問題の補充で探す"
    sources: ["02-dp §4.G（rerooting）", "02-dp §5.1", "02-dp §7.2"]

