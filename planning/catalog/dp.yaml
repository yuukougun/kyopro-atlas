# 動的計画法（dp）の目次（第2版）。規則は planning/catalog/README.md、上位の規則は設計書（planning/design.md）§3〜§5 と見直しへの対応（planning/design-review.md）
# 並び順がナビゲーションの順。章は各ページの chapter（DP の考え方 / 列の DP / 状態の形で分かれる DP / DP の高速化）
# 持ち主がほかの分野のもの（設計書 §4.2・design-review §4.2）：確率・期待値・ゲームの DP と包除 DP と数え上げの重複の除き方は comb、照合オートマトン上の DP は string、
# 行列累乗と畳み込みは math、答えの決め打ちと判定の DP は basics、bitset による高速化は misc。dp の各ページからは related でリンクする
# 節の anchor は、統合した調査の key に当たる節では key と同じにした（ほかの分野が key で指していたら id#key に直せる）
field: dp
pages:

  # ── 第1章 DP の考え方 ──────────────────────────────

  - id: dp-basics
    chapter: DP の考え方
    title: DP の基本
    aliases: [動的計画法, DP, Dynamic Programming, 漸化式, 配る DP, 貰う DP, push 型, pull 型]
    type: technique
    level: 基礎
    level_evidence: "状態 1 次元・遷移が定数個の DP をそのまま問う問題は abc245_c (403)・abc240_c (464)・abc211_c (559)・abc129_c (796)・abc099_c (1101) と灰〜緑に集中する。配る・貰うの使い分けが効くのは水（abc179_d 1251）で、その先は dp-prefix-sum へつなぐ"
    kind: [DP]
    prerequisites: [brute-force]
    related: [memoized-recursion, dp-dag, dp-state-design, dp-prefix-sum, dp-speedup-overview, greedy-basics#when-greedy-fails, expected-value-dp, game-basics#game-dp]
    summary: "全探索で同じ部分問題が何度も現れるとき、状態ごとの最良値や場合の数を表に 1 回だけ求めて使い回す。状態・遷移・初期値・答えの取り出し方の 4 つを決めれば書ける。"
    signs:
      - {type: phrase, text: "前から順に 1 つずつ選んでいくときの、〜の最小値・最大値"}
      - {type: phrase, text: "ちょうど X にできるか（可否の判定）"}
      - {type: constraint, text: "N ≤ 10^5 程度で、各位置の選択肢が数通り（全探索だと K^N 通り）"}
      - {type: shape, text: "dp[i] が dp[i−1]・dp[i−2] など定数個の前の状態から決まる"}
    acl: []
    frequency: A
    frequency_evidence: "recent 0・前提として 63 ページに届く（直接 19）・古い ABC 6 問"
    sections:
      - {title: "状態・遷移・初期値・答えの 4 つを決める", anchor: four-parts}
      - {title: "最適化・数え上げ・可否判定を同じ骨組みで書く（演算と単位元・到達できない状態の表し方）", anchor: three-kinds}
      - {title: "配る DP と貰う DP（どちらも各遷移を 1 回ずつ使う）", anchor: dp-push-pull}
      - {title: "貰う形にすると遷移元が区間になる（累積和でまとめる高速化へ）", anchor: pull-to-prefix-sum, level: 水}
      - {title: "貪欲で解けないことの確かめ方（反例から DP へ）", anchor: greedy-counterexample}
      - {title: "DP の型の地図（列・区間・集合・桁・木・順列・確率・ゲーム・高速化）", anchor: map}
      - {title: "落とし穴：到達できない状態の INF に足して溢れる・mod の取り忘れ・添字のずれ", anchor: pitfalls}
    merged_keys: [dp-push-pull]
    visual: {kind: dynamic, priority: 1, text: "全探索の木と DP の表を並べ、同じ状態が合流して 1 回の計算で済む様子のステップ送り。同じ表の上に、配る（矢印を出す）と貰う（矢印を集める）を色違いで描く"}
    problems:
      - {id: dp_a, role: example, representative: true, summary: "1 つ先か 2 つ先の足場へ跳ぶたびに高さの差のコストがかかるとき、最後の足場までのコストの和の最小を求める。", approach: "dp[i]＝足場 i までの最小コスト。配る形と貰う形の両方で書く"}
      - {id: abc240_c, role: practice, summary: "毎回 a_i か b_i だけ進むとき、N 回後にちょうど座標 X に着けるかを判定する。", approach: "到達できる座標の可否 DP（可否判定の基本形）"}
      - {id: dp_b, role: practice, summary: "1〜K 個先の足場へ跳べるときの、最後の足場までのコストの和の最小を求める。", approach: "Frog 1 の遷移が K 通りに増えた dp[i]"}
      - {id: abc129_c, role: practice, summary: "壊れた段を踏まずに 1 段か 2 段ずつ上って N 段目に着く方法の数を求める。", approach: "数え上げの基本形（遷移元の和を取る）"}
      - {id: abc099_c, role: practice, summary: "1 円・6^k 円・9^k 円を引き出して合計ちょうど N 円にする最小の回数を求める。", approach: "dp[n]＝n 円にする最小の回数。貪欲では解けない例"}
    sources: ["02-dp §4.A（dp-basics・dp-push-pull）", "02-dp §2.1", "02-dp §2.3", "02-dp §5.1", "02-dp §5.3", "02-dp §6.3"]

  - id: memoized-recursion
    chapter: DP の考え方
    title: メモ化再帰
    aliases: [メモ化, Memoization, 再帰 DP, トップダウン DP, map でメモ化, 疎な DP]
    type: technique
    level: 基礎
    level_evidence: "素直なメモ化の abc340_c (528)・abc275_d (606) が基礎（どちらも map で到達する値だけを持つ）。計算順が自明でない・状態がまばらな問題は abc357_e (1295)・abc300_e (1354)・abc350_e (1385) と水に続くが、メモ化そのものは基礎の道具として扱う"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [dp-order, dp-dag, cpp-lambda#recursive-lambda, cpp-environment#stack-depth, digit-dp-advanced, game-basics#game-dp, expected-value-dp#self-loop, probability-dp, expectation-linear-equations#cycle]
    summary: "漸化式を再帰関数のまま書き、計算済みの値を覚えて使い回す。計算順序を考えなくてよく、⌊N/2⌋ のようにまばらにしか現れない状態だけを計算できる。"
    signs:
      - {type: constraint, text: "N ≤ 10^18 で、⌊N/2⌋・⌊N/3⌋ のような値しか現れない"}
      - {type: phrase, text: "f(n) が f(⌊n/k⌋) などで再帰的に定義されている"}
      - {type: shape, text: "dp[x] が x より小さい値の dp で決まるが、どの値が現れるかを前もって列挙しにくい"}
    acl: []
    frequency: B
    frequency_evidence: "recent 1（abc470_e）・前提として 8 ページに届く（直接 2）・古い ABC 6 問"
    sections:
      - {title: "再帰とメモの書き方（未計算の印と答えの値の衝突を避ける）", anchor: write-memo}
      - {title: "ボトムアップとの使い分け（速さ・スタック・高速化の載せやすさ）", anchor: vs-bottom-up}
      - {title: "到達する状態だけを持つ（map でメモ化・現れる値の個数の見積もり）", anchor: dp-map-sparse}
      - {title: "落とし穴：再帰が深いとスタックが溢れる・閉路があると止まらない・自己ループは移項してから書く", anchor: pitfalls}
    merged_keys: [dp-map-sparse]
    visual: {kind: static, priority: 2, text: "再帰の呼び出し木で、メモに当たった呼び出しを灰色にして枝が刈られる様子。N → ⌊N/2⌋・⌊N/3⌋ の木で同じ値が合流する図"}
    problems:
      - {id: abc340_c, role: example, representative: true, summary: "黒板の整数 x（≥ 2）を ⌊x/2⌋ と ⌈x/2⌉ に書き換えるたびに x 円払う操作を、2 以上の数がなくなるまで続けたときの支払いの総額を求める。", approach: "f(x) = x + f(⌊x/2⌋) + f(⌈x/2⌉)。現れる値が少ないので map でメモ化する"}
      - {id: abc275_d, role: practice, summary: "f(0) = 1、f(k) = f(⌊k/2⌋) + f(⌊k/3⌋) で定まる f(N) を求める（N ≤ 10^18）。", approach: "map でメモ化する"}
      - {id: dp_g, role: practice, summary: "閉路のない有向グラフで、最長の有向路の長さを求める。", approach: "メモ化再帰なら計算順序を考えずに済む（例題は dp-dag）"}
      - {id: abc357_e, role: practice, summary: "各頂点から出る辺がちょうど 1 本の有向グラフで、u から v へ到達できる組 (u, v) の個数を求める。", approach: "サイクルを先に処理し、残りをメモ化再帰で数える"}
      - {id: abc300_e, role: practice, summary: "1〜6 の目のサイコロを振って出た目を掛けていくとき、積がちょうど N になる確率を求める（mod 998244353）。", approach: "到達しうる値（2・3・5 の積）だけをメモ化する。1 の目の自己ループは移項する"}
      - {id: abc380_f, role: challenge, summary: "2 人の手札と場のカードを使う 2 人ゲームで、両者が最適に行動したときの勝者を求める。", approach: "カードの所在（3 か所）と手番を状態にしたメモ化再帰"}
    sources: ["02-dp §4.A（memoized-recursion・dp-map-sparse）", "02-dp §5.1", "02-dp §5.3"]

  - id: dp-dag
    chapter: DP の考え方
    title: DAG 上の DP
    aliases: [DAG DP, DP on DAG, DAG の最長路, 経路の数え上げ, トポロジカル順の DP]
    type: technique
    level: 基礎
    level_evidence: "DAG 上の DP そのものは基礎（EDPC G・abc232_d 539・abc211_d 755）。graph の調査（03）の dag-dp も基礎。DAG だと気づく・作る型は水（abc188_e 1170・abc357_e 1295・abc139_e 1528・abc335_e 1540）で、節に置く"
    kind: [DP, グラフ探索]
    prerequisites: [dp-basics, topological-sort]
    related: [dp-order, memoized-recursion, shortest-path-dag, scc#dp-on-dag, functional-graph, bitset-speedup#reachability]
    summary: "閉路のない有向グラフで、最長路や経路の数をトポロジカル順の DP で O(N+M) で求める。どの DP も、状態を頂点・遷移を辺とする DAG の上の計算と見られる。"
    signs:
      - {type: phrase, text: "番号の小さい頂点から大きい頂点へだけ辺がある（u < v）"}
      - {type: phrase, text: "値が増える向きにしか移動できない"}
      - {type: phrase, text: "有向グラフの最長の経路の長さ・経路の本数・最短経路の本数"}
      - {type: phrase, text: "依存関係に従って順に決める（閉路があれば −1）"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として 1 ページに届く（直接 1）・古い ABC 6 問"
    sections:
      - {title: "DP は DAG 上の最短路・最長路・数え上げ", anchor: dp-as-dag}
      - {title: "順序の作り方（Kahn 法・DFS の帰りがけ順の逆・メモ化再帰・問題の性質から）", anchor: ordering}
      - {title: "DAG だと気づく・作る（値の順・距離の層・同じ値の頂点をまとめる）", anchor: find-dag, level: 水}
      - {title: "最短路の本数（距離が確定した順に配る）", anchor: count-shortest-paths}
      - {title: "閉路があるとき（SCC で縮約する・最短路に切り替える）", anchor: with-cycles}
    merged_keys: [dag-dp]
    visual: {kind: static, priority: 2, text: "DP の表と同じ構造のグラフを並べ、列の DP やグリッドの DP が DAG の特別な場合であることを示す図"}
    problems:
      - {id: dp_g, role: example, representative: true, summary: "閉路のない有向グラフで、最長の有向路の長さを求める。", approach: "トポロジカル順に回すか、メモ化再帰で求める"}
      - {id: abc211_d, role: practice, summary: "無向グラフで、頂点 1 から頂点 N への最短路の本数を求める（mod 10^9+7）。", approach: "BFS で距離が 1 増える辺だけからなる DAG の上で数える"}
      - {id: abc139_e, role: practice, summary: "総当たり戦で各選手が試合をする相手の順番が決まっているとき、全試合を終える最少の日数を求める（不可能なら −1）。", approach: "試合を頂点、順序の制約を辺にした依存関係を順に処理する（閉路があれば不可能）"}
      - {id: abc335_e, role: practice, summary: "頂点に整数が書かれたグラフで、書かれた値が減らないように頂点 1 から N へ進むパスのうち、通った値の種類数の最大を求める。", approach: "同じ値の隣接頂点をまとめてから、値の小さい順に DP する"}
    sources: ["02-dp §4.A（dp-dag）", "03-graph §4.C（topological-sort の DAG 上の DP の節）", "03-graph §5.2（dag-dp）", "02-dp §5.1"]

  - id: dp-order
    chapter: DP の考え方
    title: DP の計算順序
    aliases: [計算順序, ループの順番, 後ろから DP, 逆順 DP]
    type: technique
    level: 水
    level_evidence: "後ろから・値の順・依存関係の順に計算しないと解けない問題が abc188_e (1170)・abc266_e (1227)・abc197_e (1379)・abc146_f (1545)・abc341_f (1604)・abc195_e (1609) と水〜青に集まる。abc319 以降の根拠は abc341_f (1604) の 1 問だけで、帯を変える根拠にはならない（古い問題で決めた）"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [dp-dag, memoized-recursion, interval-dp, bit-dp, dp-reconstruction, reverse-thinking#decide-from-back, expected-value-dp#order, game-basics#win-lose]
    summary: "dp[x] を計算する時点で、依存する値がすべて確定している順に状態を回す。添字の昇順に限らず、後ろから・値の順・区間の長さ順・集合の包含順などを依存の向きから選ぶ。"
    signs:
      - {type: phrase, text: "値の小さい（大きい）方へしか移れない"}
      - {type: phrase, text: "ゴールに着いたら終わり・残り回数が 0 になったら終わり（終わりの値が分かっている）"}
      - {type: shape, text: "dp[i] が dp[j]（j > i）から決まる（i 番目以降で最適に行動したときの値）"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として 11 ページに届く（直接 3）・古い ABC 6 問"
    sections:
      - {title: "依存グラフと計算順序の原則（閉路があれば DP にならない）", anchor: dependency}
      - {title: "典型の順序（添字・逆順・値の順・区間の長さ順・集合の昇順・木の帰りがけ順）", anchor: typical-orders}
      - {title: "後ろから解くサイン（終わりの値が分かっている・辞書順最小の復元）", anchor: backward}
      - {title: "期待値 DP・ゲーム DP の計算順序（確率・期待値・ゲームの章へ）", anchor: expectation-and-games}
      - {title: "落とし穴：2 重ループの内外の順・逆順の境界・配る形で未確定の値を配る", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "状態の依存グラフを描き、添字順・逆順・値の順・区間の長さ順・集合の包含順・木の帰りがけ順の 6 つを同じ図式で並べる"}
    problems:
      - {id: abc188_e, role: example, summary: "番号の小さい町から大きい町へだけ道がある国で、ある町で金を買い、そこから行ける別の町で売るときの利益の最大を求める。", approach: "後ろから「そこから行ける町の最高の売値」を埋める"}
      - {id: abc197_e, role: example, representative: true, summary: "数直線上の色付きのボールを、色の番号の小さい順に全部回収して原点に戻るときの、移動距離の最小を求める。", approach: "各色を回収し終えた位置（その色の左端か右端）を状態にし、色の順に DP する"}
      - {id: abc266_e, role: practice, summary: "最大 N 回まで振り直せるサイコロで、最後に出た目を得点にするとき、得点の期待値の最大を求める。", approach: "残り回数の少ない方から、振り直すかどうかと期待値を決める"}
      - {id: abc146_f, role: practice, summary: "1〜M マス進めるすごろくで、止まってはいけないマスを避けて最短手数でゴールする出目の列のうち、辞書順最小のものを求める。", approach: "ゴールから逆に、届く最も手前のマスを決める（例題は dp-reconstruction）"}
      - {id: abc341_f, role: practice, summary: "グラフの頂点に置いた駒を 1 つ取り除き、重みの和が元の頂点より小さい隣接頂点の集合に 1 つずつ置く操作の、最大の回数を求める。", approach: "駒は重みの小さい頂点にしか移らない。重みの小さい頂点から順に、各頂点でナップサックを解く"}
    sources: ["02-dp §4.A（dp-order）", "02-dp §5.1", "02-dp §5.3"]

  - id: dp-state-design
    chapter: DP の考え方
    title: DP の状態の設計
    aliases: [状態設計, DP の状態, 直前を状態に持つ, 末尾の数文字を状態に持つ, 環状 DP, 円環 DP, 括弧列の DP]
    type: technique
    level: 水
    level_evidence: "直前の選択・on/off・個数を 1 次元足す型は abc306_d (596)・abc303_d (778)・abc312_d (964) と基礎。何を覚えれば十分かを見抜く・情報を圧縮する型が abc322_e (1193)・abc307_e (1240)・abc232_e (1380)・abc359_d (1381)・abc122_d (1533)・abc175_e (1554) と水に集まり、abc319 以降も abc322_e・abc359_d が水の入口にある。末尾の数文字を状態にする型（abc122_d・abc359_d）は照合オートマトン上の DP（string）の簡易版を受けたもの（design-review §4.2）"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [dp-dimension-reduction, dp-mod-state, dp-phase, bit-dp, bracket-sequence#counting, string-automaton-dp, palindrome#avoid-k-palindrome, counting-dedup#in-dp, binary-search-answer#dp-check]
    summary: "過去の選び方そのものではなく、将来の選び方と評価に影響する要約（直前の値・個数・末尾の数文字・開き括弧の数など）だけを状態に持つ。要約が同じ状態は同一視しても答えが変わらない。"
    signs:
      - {type: phrase, text: "隣り合う〜が異なる・同じことを連続して〜しない"}
      - {type: phrase, text: "直前の選択でコストが変わる・モードが切り替わる"}
      - {type: phrase, text: "長さ K の回文・特定の短い文字列を部分文字列に含まない文字列の数"}
      - {type: phrase, text: "円形に並んでいる（最後と最初も隣り合う）"}
      - {type: phrase, text: "'(' と ')' と '?' の列から正しい括弧列を作る方法の数"}
      - {type: constraint, text: "制約の一部だけが小さい（K ≤ 5、末尾の K ≤ 10 文字、文字の種類 26）"}
    acl: []
    frequency: A
    frequency_evidence: "recent 4（abc456_d・abc457_f・abc462_f・abc464_d）・前提として 20 ページに届く（直接 9）・古い ABC 10 問"
    sections:
      - {title: "将来に効く要約だけを持てば合流できる理由", anchor: why-summary-works}
      - {title: "典型の要約（直前の値・on/off・偶奇・個数・上限で打ち切った値）", anchor: typical-summaries}
      - {title: "末尾の数文字を状態にする（禁止された並び・回文を避ける）", anchor: last-characters}
      - {title: "括弧列の DP（開き括弧の残り数を状態にする）", anchor: bracket-dp}
      - {title: "環状の列（1 か所で切り、最初の状態を固定して DP を回す）", anchor: dp-cyclic}
      - {title: "状態数の見積もり（(P+1)^K・2^K・末尾の数文字の組の数）", anchor: state-count}
      - {title: "落とし穴：最適値だけを持って状態を潰しすぎる", anchor: pitfalls}
    merged_keys: [dp-cyclic, bracket-dp]
    visual: {kind: static, priority: 2, text: "過去の選び方の木と、将来に効く要約でまとめた状態の表を並べ、同じ要約の枝が合流する図。括弧列を開き括弧の数の折れ線として描き、0 未満に潜らない経路を数える図"}
    problems:
      - {id: dp_c, role: example, summary: "N 日間、毎日 3 つの活動から 1 つを選んで幸福度を得るとき、同じ活動を 2 日続けない場合の幸福度の和の最大を求める。", approach: "前日の活動を状態に足す"}
      - {id: abc359_d, role: example, representative: true, summary: "A・B・? からなる文字列の ? を A か B に置き換える方法のうち、長さ K（≤ 10）の回文を部分文字列に含まないものの数を求める。", approach: "末尾 K−1 文字を bit で状態に持つ（節 last-characters）"}
      - {id: abc122_d, role: example, summary: "A・C・G・T からなる長さ N の文字列のうち、AGC を部分文字列に含まず、隣り合う 2 文字を 1 回入れ替えても AGC が現れないものの数を求める。", approach: "直前の 3 文字を状態にする（照合オートマトン上の DP の簡易版。節 last-characters）"}
      - {id: abc306_d, role: practice, summary: "解毒の料理と毒の料理を順に食べるか選び、死なずに食べた料理のおいしさの和の最大を求める。", approach: "お腹の状態（健康・不調）の 2 通りを状態にする"}
      - {id: abc312_d, role: practice, summary: "'('・')'・'?' からなる文字列の '?' を置き換えて、正しい括弧列にする方法の数を求める。", approach: "開き括弧の残り数を状態にする（節 bracket-dp）"}
      - {id: abc322_e, role: practice, summary: "K（≤ 5）個のパラメータをすべて P 以上にするように開発案を選ぶときの、費用の最小を求める。", approach: "各パラメータを P で打ち切ったベクトルを状態にする"}
      - {id: abc307_e, role: practice, summary: "円形に並ぶ N 人に 0〜M−1 の整数を、隣り合う人どうしが異なるように配る方法の数を求める。", approach: "最初の人と同じ値かどうかを状態にする（節 dp-cyclic）"}
      - {id: abc232_e, role: practice, summary: "H×W の盤でルークを K 回動かして、指定のマスから指定のマスへ移動させる方法の数を求める。", approach: "行・列が目的地と一致するかの 4 状態にまとめる"}
      - {id: abc345_e, role: challenge, summary: "色と価値のついたボールの列からちょうど K 個を取り除き、残った列で隣り合う色がすべて異なるようにするときの、残った価値の和の最大を求める。", approach: "遷移元の上位 2 つ（色が異なる）だけを持って速くする"}
    sources: ["02-dp §4.A（dp-state-design・dp-cyclic）", "02-dp §4.C（bracket-dp・string-automaton-dp の簡易版）", "02-dp §5.1", "02-dp §5.3", "08-string-geo §4.1（bracket-sequence）", "08-string-geo §4.6（string-automaton-dp の簡易版）"]

  - id: dp-mod-state
    chapter: DP の考え方
    title: 余り・個数を状態に持つ DP
    aliases: [余りを状態に, mod DP, 倍数の数え上げ, 平均が整数]
    type: technique
    level: 水
    level_evidence: "abc220_d (664)・abc281_d (1031) の基礎から、abc262_d (1213)・abc135_d (1334)・arc060_a (1583) と水に集まり、abc195_e (1609)・abc207_e (1820) が青。abc319 以降の根拠は見つかっていないので、古い問題で決めた"
    kind: [DP, 整数論]
    prerequisites: [dp-state-design, mod-arithmetic]
    related: [digit-dp, subset-sum, knapsack-01, dp-sequence-partition, game-basics#state-design]
    summary: "「和が M の倍数」「平均が整数」のような条件は、和そのものではなく M で割った余りを状態に持てば数えられる。平均は選ぶ個数を外側で固定するか、各値から平均を引いて和 0 に直す。"
    signs:
      - {type: phrase, text: "和（積）が M の倍数になる選び方の数"}
      - {type: phrase, text: "平均が整数になる・平均がちょうど A になる選び方の数"}
      - {type: phrase, text: "'?' を埋めた数を M で割った余りが r になるものの数"}
      - {type: constraint, text: "M ≤ 1000 程度、N ≤ 100 程度"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 6 問"
    sections:
      - {title: "余りを状態にしてよい理由（足し算・掛け算と mod が両立する）", anchor: why-remainder}
      - {title: "個数も状態に持つ（K 個選んで和が D の倍数）", anchor: with-count}
      - {title: "平均の扱い（個数を外側で固定する・平均を引いて和 0 にする）", anchor: average}
      - {title: "後ろから余りごとの勝敗を決めるゲーム", anchor: game-by-remainder, level: 青}
      - {title: "落とし穴：C++ の % が負になる・状態の mod と答えの mod の混同", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 3, text: "和の数直線を M ごとに折り返して円にし、状態が M 個にまとまる図"}
    problems:
      - {id: abc281_d, role: example, summary: "N 個の整数からちょうど K 個を選び、和が D の倍数になるときの和の最大を求める。", approach: "個数と和の D での余りを状態にする"}
      - {id: abc262_d, role: example, representative: true, summary: "数列の空でない部分集合のうち、要素の平均が整数になるものの数を求める。", approach: "選ぶ個数 k を外側で固定し、個数と和の k での余りを状態にする"}
      - {id: abc220_d, role: practice, summary: "0〜9 の数列の先頭 2 つを、和か積の 1 の位に置き換える操作を繰り返すとき、最後に残る値が各 k になる操作の仕方の数を求める。", approach: "下 1 桁を状態にする"}
      - {id: abc135_d, role: practice, summary: "数字と '?' からなる文字列の '?' を埋めてできる整数のうち、13 で割って 5 余るものの数を求める。", approach: "上の桁から、13 での余りを状態にする"}
      - {id: arc060_a, role: practice, summary: "N 枚のカードから 1 枚以上を選び、書かれた数の平均がちょうど A になる選び方の数を求める。", approach: "各値から A を引いて和を 0 にする（または個数と和を状態にする）"}
      - {id: abc195_e, role: practice, summary: "数字列を先頭から順に、決められた手番の人がその数字か 0 を末尾に付けていき、最後にできた数が 7 の倍数かで勝敗が決まる 2 人ゲームの勝者を求める。", approach: "後ろから「余りが r のとき勝てるか」を、手番の人に応じて or と and で埋める（節 game-by-remainder）"}
    problems_note: "abc319 以降で余りを状態にする DP が主役の問題は research に見当たらない（abc465_e は桁 DP の練習に置いた）。工程 8b の前の問題の補充で探す"
    sources: ["02-dp §4.A（dp-mod-state）", "02-dp §5.1"]

  - id: dp-phase
    chapter: DP の考え方
    title: フェーズを状態に持つ DP
    aliases: [耳 DP, 段階を状態に持つ DP, 最大部分配列和, Kadane, "Kadane's algorithm"]
    type: technique
    level: 青
    level_evidence: "「区間の外・中・後」などの段階を状態にする問題は abc211_c (559) の基本形から、abc104_d (1739)・abc159_f (1876)・abc360_g (1982)・yahoo_procon2019_qual_d (1998) と青に多い。abc319 以降では abc466_e (1027) のように易しい E にも出るが、段階の切り替えを設計させる問題は青"
    kind: [DP]
    prerequisites: [dp-state-design]
    related: [subsequence-dp, string-automaton-dp, dp-sequence-partition, difference-sequence, lis]
    summary: "区間を 1 つ選ぶ・何文字目まで集めたか、のように各位置でいまどの段階にいるかを状態に持つ。区間の両端を全探索する代わりに段階の切り替えを遷移にして、O(N^2) を O(N) にする。"
    signs:
      - {type: phrase, text: "区間を 1 つ選んで、その中だけ操作する（1 回だけ変更できる）"}
      - {type: phrase, text: "部分列として 'ABC' などが何個含まれるか（'?' を埋めた全通りの和）"}
      - {type: phrase, text: "連続する部分列の和の最大"}
      - {type: shape, text: "区間 [l, r) の両端を全探索すると O(N^2) になり、各位置の扱いが「区間の前・中・後」で変わる"}
    acl: []
    frequency: B
    frequency_evidence: "recent 1（abc466_e）・前提として届くページなし・古い ABC 4 問"
    sections:
      - {title: "最大部分配列和（Kadane）：区間を 1 つ選ぶ最も簡単な例", anchor: kadane}
      - {title: "段階の数え方（区間の外側にも段階がある）", anchor: counting-phases}
      - {title: "何文字目まで集めたか（部分列として現れる回数を数える）", anchor: matched-prefix}
      - {title: "区間の反転・変更を段階の切り替えで表す", anchor: flip-interval}
      - {title: "落とし穴：同じ位置で段階をいくつ進めてよいか", anchor: pitfalls}
    merged_keys: [kadane-and-submask]
    visual: {kind: static, priority: 2, text: "列の下に「段階 0 → 1 → 2」の帯を描き、各位置でどの段階にいるかを状態遷移図にする"}
    problems:
      - {id: typical90_h, role: example, summary: "文字列から部分列として 'atcoder' を取り出す方法の数を求める。", approach: "何文字目まで集めたかを段階として持つ"}
      - {id: abc159_f, role: example, representative: true, summary: "数列のすべての区間 [L, R] について、その中で和がちょうど S になる部分列の個数を求め、その総和を出す。", approach: "区間の左端を「まだ始めていない・始めた」の段階で持つ"}
      - {id: abc466_e, role: practice, summary: "（執筆時に確かめる）", approach: "区間の反転を切り替えの点 2 つに言い換え、置いた点の数を段階として持つ（research/00 §2.3.8 の分類）"}
      - {id: abc104_d, role: practice, summary: "A・B・C・? からなる文字列の ? を埋めた全通りについて、部分列として現れる 'ABC' の個数の総和を求める。", approach: "A・AB・ABC まで集めた数を状態にする"}
      - {id: yahoo_procon2019_qual_d, role: practice, summary: "数直線上を歩く経路を自由に選ぶとき、各区間を通った回数を目標の個数 A_i に合わせるための追加・削除の回数の最小を求める。", approach: "通らない・偶数回・奇数回…の 5 段階を状態にする（耳 DP の名の由来）"}
    sources: ["02-dp §4.C（dp-phase）", "02-dp §5.1", "08-string-geo §4.1（subsequence-dp：照合位置の DP）", "00-curriculum §3.2（kadane-and-submask）", "00-curriculum §4.2（差分列への言い換え：abc466_e）"]

  - id: dp-reconstruction
    chapter: DP の考え方
    title: DP の復元
    aliases: [DP 復元, 選び方の出力, DP テーブルからの復元, 辞書順最小の復元]
    type: technique
    level: 水
    level_evidence: "選び方を 1 つ出力させる問題は abc271_d (886)・typical90_bd (★5)・EDPC F から。辞書順最小の復元は abc146_f (1545)・arc081_c (2072)、経路の復元は abc369_f (1618、2024。abc319 以降はこの 1 問で、水と青の境目)。research/00 は EDPC F を根拠に基礎（DP の基本の節）を提案したが、出力の形の工夫が要る問題が水から多いので水の単独ページにした"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [dp-order, lcs, bfs#path-restoration, lexicographic-greedy#kth, binomial-coefficient#kth, subsequence-dp]
    summary: "最適値だけでなく選び方そのものを出力するとき、完成した表を終端から逆にたどって最適な遷移を復元する。辞書順最小は後ろからの DP と前からの貪欲で、辞書順 K 番目は個数を数えて先頭から決める。"
    signs:
      - {type: phrase, text: "選び方（経路・操作列）を 1 つ出力せよ"}
      - {type: phrase, text: "条件を満たすものが複数あれば辞書順最小のものを出力せよ"}
      - {type: phrase, text: "辞書順で K 番目のものを出力せよ（K は 10^18 程度）"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 4 問"
    sections:
      - {title: "表を残して終端から逆にたどる・遷移元を記録しておく", anchor: trace-back}
      - {title: "最適な遷移が複数あるときの選び方", anchor: ties}
      - {title: "辞書順最小の復元（後ろからの DP と前からの貪欲）", anchor: lexicographic-min}
      - {title: "辞書順 K 番目を数え上げで決める（個数が K を超えたら打ち切る）", anchor: dp-kth-lexicographic}
      - {title: "落とし穴：使い回した表では辿れない・辿った順の逆転・数え上げの溢れ", anchor: pitfalls}
    merged_keys: [dp-kth-lexicographic, dp-restoration]
    visual: {kind: static, priority: 2, text: "完成した表を終端から逆にたどり、最適値を与えた遷移を強調する図。先頭の候補ごとに「その先の個数」を棒グラフにし、K がどの棒に入るかで 1 文字ずつ決める図"}
    problems:
      - {id: abc271_d, role: example, summary: "N 枚のカードの表か裏を選んで書かれた数の和をちょうど S にできるかを判定し、できるなら表裏の選び方を 1 つ出力する。", approach: "可否 DP の表を後ろから辿る"}
      - {id: typical90_bd, role: example, summary: "N 日間、毎日 A_i か B_i のどちらかを買って合計をちょうど S にする選び方を 1 つ出力する。", approach: "可否 DP の表を残し、終端から逆にたどる"}
      - {id: abc146_f, role: example, representative: true, summary: "1〜M マス進めるすごろくで、止まってはいけないマスを避けて最短手数でゴールする出目の列のうち、辞書順最小のものを求める。", approach: "ゴールから逆に、届く最も手前のマスを決める（後ろからの DP と前からの貪欲）"}
      - {id: abc202_d, role: practice, summary: "a が A 個・b が B 個からなる文字列のうち、辞書順で K 番目のものを求める。", approach: "先頭を a にした場合の個数（二項係数）と K を比べて 1 文字ずつ決める"}
      - {id: dp_f, role: practice, summary: "2 つの文字列の最長共通部分列を 1 つ出力する。", approach: "LCS の表を終端から辿る（例題は lcs）"}
      - {id: abc369_f, role: practice, summary: "グリッドを右か下にだけ進んでコインを集めるとき、集める枚数の最大と、そのときの経路を求める。", approach: "コインの位置で LIS 型の DP をし、直前のコインを記録して復元する"}
      - {id: arc081_c, role: challenge, summary: "文字列 A の部分列として現れない最短の文字列のうち、辞書順最小のものを求める。", approach: "次の出現位置の表で後ろから DP し、前から貪欲に復元する"}
    sources: ["02-dp §4.A（dp-reconstruction・dp-kth-lexicographic）", "02-dp §5.1", "00-curriculum §4.2（DP の復元）"]

  - id: dp-prefix-sum
    chapter: DP の考え方
    title: 累積和・いもす法による DP の高速化
    aliases: [累積和 DP, いもす法 DP, 累積和で遷移をまとめる]
    type: technique
    level: 水
    level_evidence: "abc222_d (865)・abc178_d (875)・abc253_e (1073) の緑から現れ、abc179_d (1251)・abc183_e (1288)・abc442_f (1295、2026、累積 min で遷移) で典型になる。応用は abc130_e (1676)・abc207_e (1820)・abc311_f (1984)・abc132_f (2143)・abc265_f (2290)。前提が多くのページから参照される基本の道具なので、ナビゲーションでは「DP の考え方」の章の末尾に置く（03-19）"
    kind: [DP, 累積和・差分]
    prerequisites: [dp-basics, imos]
    related: [dp-segment-tree, inline-dp, prefix-sum-2d, dp-sequence-partition, insertion-dp, dp-grid, dp-speedup-overview]
    summary: "遷移元が連続した範囲の和になる DP を、前の段の累積和で 1 回 O(1) にする。遷移先が範囲なら、いもす法で差分に書いておき後で累積する。"
    signs:
      - {type: phrase, text: "各人に 0〜a_i 個を配る方法の数（上限つきの配り方）"}
      - {type: constraint, text: "N ≤ 100、K ≤ 10^5 程度で、O(NK) は通るが O(NK^2) は通らない"}
      - {type: shape, text: "dp[i] = Σ_{j=i−R}^{i−L} dp[j] のように、遷移元が連続した範囲の和"}
      - {type: shape, text: "dp[i] から i+L〜i+R の範囲へ同じ値を配る"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として 6 ページに届く（直接 3）・古い ABC 11 問"
    sections:
      - {title: "貰う形と累積和・配る形といもす法", anchor: pull-and-push}
      - {title: "同じ段の累積和（上限つきの配り方）", anchor: same-row}
      - {title: "区間の和集合・方向ごとの累積（縦・横・斜め）", anchor: directional}
      - {title: "遷移元が接頭辞なら累積 min・累積 max でもよい", anchor: prefix-min}
      - {title: "余りごとの累積", anchor: by-remainder, level: 青}
      - {title: "2 次元の累積", anchor: two-dimensional, level: 青}
      - {title: "落とし穴：累積和を更新しながら使う順番・区間の端・mod の差が負になる", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "dp 配列の下に累積和の配列を並べ、区間の和が 2 つの値の差で取れる様子の図"}
    problems:
      - {id: dp_m, role: example, summary: "N 人の子どもに K 個の飴を、i 番目の子には 0〜a_i 個ずつ、余さず配る方法の数を求める。", approach: "前の段の累積和で、区間からの遷移を O(1) にする"}
      - {id: abc179_d, role: example, representative: true, summary: "いくつかの区間の和集合に含まれる歩幅で、マス 1 からマス N まで進む方法の数を求める。", approach: "区間ごとに累積和の差を足す（貰う形）"}
      - {id: abc178_d, role: practice, summary: "各項が 3 以上の整数で、総和が S になる数列の個数を求める。", approach: "累積和で遷移をまとめる"}
      - {id: typical90_ap, role: practice, summary: "各桁が 1〜9 で桁の和が K になる正の整数のうち、9 の倍数の個数を求める。", approach: "直前 9 項の和を累積和で取る"}
      - {id: abc253_e, role: practice, summary: "長さ N・各項が 1〜M で、隣り合う項の差の絶対値が K 以上の数列の個数を求める。", approach: "遷移元が 2 つの区間になり、累積和で速くする"}
      - {id: abc442_f, role: practice, summary: "グリッドのマスを塗り替えて、各行の左側に並ぶ白の個数が下の行ほど減る形にするときの、塗り替えの最小数を求める。", approach: "上の行の白の個数を状態にし、累積 min で遷移する（節 prefix-min）"}
      - {id: tdpc_semiexp, role: practice, summary: "1 番目と N 番目の駅には止まり、K 駅以上連続しては止まらない停車駅の選び方の数を求める。", approach: "累積和（と余事象）で遷移をまとめる"}
      - {id: abc207_e, role: practice, summary: "数列をいくつかの区間に区切り、k 番目の区間の和が k で割り切れるようにする方法の数を求める。", approach: "区間の番号ごとに余りの累積を持つ（節 by-remainder）"}
      - {id: abc265_f, role: challenge, summary: "N 次元の格子点で、与えられた 2 点からのマンハッタン距離がともに D 以下の点の個数を求める。", approach: "斜め方向の累積和で遷移する"}
    sources: ["02-dp §4.J（dp-prefix-sum）", "02-dp §5.1", "02-dp §5.3", "02-dp §7.2"]

  # ── 第2章 列の DP ──────────────────────────────

  - id: knapsack-01
    chapter: 列の DP
    title: ナップサック DP
    aliases: [0-1 ナップサック, ナップサック, ナップザック, Knapsack Problem, 0-1 Knapsack, 個数制限なしナップサック, 個数無制限ナップサック, Unbounded Knapsack, 個数制限付きナップサック, 多重ナップサック, コイン問題, 配列の使い回し, 1 次元化]
    type: technique
    level: 基礎
    level_evidence: "基本形は abc344_d (854)・abc317_d (929)・abc219_d (1085) と緑。応用は arc073_b (1477)・abc364_e (1496)・abc145_e (1528)・abc341_f (1604)・abc054_d (1655)・abc169_f (1698) と水〜青。個数制限付きの二進分解・スライド最小値が必須の ABC は見つからない（青の節にとどめる）。区間の品物だけのナップサック（abc426_g 2119、黄）は、基礎のページの節を青までにする規則で basics の分割統治のページへ送った（design-review §4.2）"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [subset-sum, dp-dimension-reduction, meet-in-the-middle#vs-knapsack, knapsack-undo, exchange-argument-dp, tree-dp-square, greedy-basics, divide-and-conquer#range-knapsack]
    summary: "品物を 1 つずつ「選ぶ・選ばない」で分け、重さの合計ごとに価値の最大を求める。1 次元の配列で書くと、ループの向きで 0-1（大きい方から）と個数制限なし（小さい方から）が分かれる。"
    signs:
      - {type: phrase, text: "重さの合計が W 以下で価値の和の最大"}
      - {type: phrase, text: "同じものを何度でも使える（硬貨・魔法）"}
      - {type: phrase, text: "各品物は B_i 個まで使える"}
      - {type: constraint, text: "N ≤ 100〜5000、W ≤ 10^4〜10^5（O(NW) が通る）"}
    acl: []
    frequency: A
    frequency_evidence: "recent 1（abc461_f）・前提として 5 ページに届く（直接 5）・古い ABC 13 問"
    sections:
      - {title: "dp[i][w] の意味（「以下」と「ちょうど」で初期値と答えが変わる）", anchor: meaning}
      - {title: "配列の使い回しとループの向き（0-1 は大きい方から、個数制限なしは小さい方から）", anchor: dp-rolling-array}
      - {title: "個数制限なし（数え上げでは品物と和のループの内外で組合せと列が分かれる）", anchor: knapsack-unbounded}
      - {title: "多次元の重さ・上限で打ち切る・グループから 1 つ選ぶ", anchor: variants}
      - {title: "計算量で解法を切り替える（重さ・価値・N のどれが小さいか）", anchor: choose-by-size, level: 水}
      - {title: "個数制限付き（素朴な展開・二進分解・余りごとのスライド最小値）", anchor: knapsack-bounded, level: 青}
    merged_keys: [knapsack-unbounded, knapsack-bounded, dp-rolling-array]
    visual: {kind: dynamic, priority: 1, text: "品物×重さの表を 1 行ずつ埋めるステップ送り（選ぶ＝斜め、選ばない＝真下の矢印）。1 次元配列を右から・左から更新する矢印を並べ、同じ段で書き換えた値を読むかどうかで 0-1 と個数制限なしが分かれることを示す"}
    problems:
      - {id: dp_d, role: example, representative: true, summary: "重さと価値が決まった N 個の品物から、重さの合計が W 以下になるように選ぶときの価値の和の最大を求める。", approach: "dp[i][w]＝i 番目までの品物で重さ w のときの価値の最大"}
      - {id: abc286_d, role: practice, summary: "A_i 円硬貨が B_i 枚（≤ 50）ずつあるとき、ちょうど X 円を払えるかを判定する。", approach: "使う枚数を全部試す素朴な個数制限付きの可否 DP"}
      - {id: abc344_d, role: practice, summary: "N 個の袋からそれぞれ高々 1 つの文字列を選んで順に連結し、文字列 T を作るときの費用の最小を求める。", approach: "作った T の接頭辞の長さを状態にし、袋ごとに 1 つ選ぶ（グループから 1 つ選ぶ型）"}
      - {id: abc317_d, role: practice, summary: "選挙区ごとに議席数と、議席を取るのに鞍替えさせる必要がある人数が決まっているとき、議席の過半数を取るための鞍替えの人数の最小を求める。", approach: "選挙区を取るか捨てるかの 0-1 ナップサック（議席数を重さに）"}
      - {id: abc153_e, role: practice, summary: "体力 H のモンスターに、ダメージと消費魔力が決まった魔法を何度でも使って体力を 0 以下にするときの、消費魔力の最小を求める。", approach: "個数制限なしのナップサックで、H で打ち切る"}
      - {id: abc219_d, role: practice, summary: "たこ焼きとたい焼きの個数が決まった弁当を選び、それぞれ X 個以上・Y 個以上にするときの弁当の個数の最小を求める。", approach: "量を上限で打ち切る 2 次元のナップサック"}
      - {id: abc032_d, role: challenge, summary: "N 個の品物の 0-1 ナップサックを、N・重さ・価値のどれか 1 つだけが小さい 3 種類の制約で解く。", approach: "N が小さければ半分全列挙、重さが小さければ重さの DP、価値が小さければ価値の DP に切り替える"}
      - {id: abc373_f, role: challenge, summary: "品物 i を k 個選ぶと価値が k·v_i − k^2 になるとき、重さの合計が W 以下での価値の和の最大を求める。", approach: "重さの余りごとに分けると最適な遷移元が単調になる"}
    sources: ["02-dp §4.B（knapsack-01・knapsack-unbounded・knapsack-bounded）", "02-dp §4.A（dp-rolling-array）", "02-dp §5.1", "02-dp §5.3", "02-dp §6.2（ナップサックの解法の切り替え）"]

  - id: subset-sum
    chapter: 列の DP
    title: 部分和 DP
    aliases: [部分和, 部分和問題, Subset Sum, 部分和の数え上げ]
    type: technique
    level: 基礎
    level_evidence: "abc240_c (464)・abc204_d (832)・abc271_d (886)・abc274_d (916)・TDPC A が基礎。数え上げの応用は abc222_e (1491)・abc216_f (1541)・arc060_a (1583) が水、abc169_f (1698) が青（節）。bitset による高速化（黄：arc070_b 2015・agc020_c 2259）は、基礎のページの節を青までにする規則で misc の bitset による高速化のページの節へ送った（design-review §4.2）"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [knapsack-01, knapsack-undo, meet-in-the-middle, bitset-speedup#subset-sum-shift, dp-mod-state, exchange-argument-dp]
    summary: "いくつか選んで作れる和の集合や、和が S になる選び方の数を、和を添字にした DP で求める。2 グループへの分け方や ± の符号の付け方も、部分和に言い換えて解ける。"
    signs:
      - {type: phrase, text: "いくつか選んで和をちょうど S にできるか・その選び方の数"}
      - {type: phrase, text: "2 つのグループに分けて差（遅い方）を最小にする"}
      - {type: phrase, text: "各要素に + か − を付けて和を K にする"}
      - {type: constraint, text: "N ≤ 100、値の総和 ≤ 10^5 程度"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として 1 ページに届く（直接 1）・古い ABC 7 問"
    sections:
      - {title: "可否・数え上げ・最大の 3 つの形", anchor: three-forms}
      - {title: "典型の言い換え（2 グループに分ける・± の和・x と y が独立）", anchor: reformulations}
      - {title: "最大値を固定するためにソートしてから数える", anchor: sort-then-count, level: 水}
      - {title: "全部分集合についての和（含む部分集合の数を重みにする）", anchor: over-all-subsets, level: 青}
      - {title: "落とし穴：負の和のオフセット・空集合を数えるか", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "作れる和の集合を数直線上の点で表し、要素を 1 つ足すたびに集合を右へずらして重ねる図"}
    problems:
      - {id: tdpc_contest, role: example, representative: true, summary: "N 問の配点が決まったコンテストで、取り得る合計点の種類数を求める。", approach: "作れる和の可否 DP"}
      - {id: abc204_d, role: practice, summary: "N 個の料理を 2 台のオーブンに分けて調理するとき、すべて調理し終えるまでの時間の最小を求める。", approach: "一方の合計として作れる和を求め、全体の半分に近いものを選ぶ"}
      - {id: abc274_d, role: practice, summary: "長さの決まった線分を順につなぎ、つなぎ目ごとに 90 度左右どちらかに曲げるとき、終点を (x, y) にできるかを判定する。", approach: "x と y が独立になるので、それぞれ ± の部分和で判定する"}
      - {id: abc222_e, role: practice, summary: "木の上を決まった順に移動するとき、各辺を赤か青に塗って、赤の辺を通る回数と青の辺を通る回数の差を K にする塗り方の数を求める。", approach: "各辺が使われる回数 D_i を求め、±D_i の和が K になる塗り方を数える"}
      - {id: abc216_f, role: practice, summary: "添字の集合 S のうち、S での A の最大値が S での B の和以上になるものの個数を求める。", approach: "A の昇順に並べて A の最大を固定し、B の和を数える（節 sort-then-count）"}
      - {id: abc169_f, role: practice, summary: "数列のすべての部分集合 T について、T の部分集合で和が S になるものの個数を求め、その総和を出す。", approach: "その組を含む部分集合の数を重みとして掛ける（節 over-all-subsets）"}
    sources: ["02-dp §4.B（subset-sum）", "02-dp §5.1", "02-dp §5.3"]

  - id: dp-dimension-reduction
    chapter: 列の DP
    title: DP の状態の削減
    aliases: [状態の削減, 次元の削減, 状態の圧縮, 値と添字の入れ替え, キーと値を入れ替える, 添字と値を逆に, 上限で打ち切る]
    type: technique
    level: 青
    level_evidence: "drken 氏は abc325_f の解説で、DP の値を使って状態を表すこの手法を青 diff あたりの典型と書いている。該当は abc410_e (1077)・abc219_d (1085) の緑から abc364_e (1496)・abc315_f (1674)・abc325_f (1769)・abc376_f (2089)・abc203_f (2252) と広がる。abc319 以降に限っても abc410_e・abc364_e・abc325_f・abc376_f と緑〜黄に散らばり、中心は青。入口の EDPC E は易しい。ナップサックを前提にするので、ナビゲーションではナップサックの後に置く（03-19）"
    kind: [DP]
    prerequisites: [dp-state-design, knapsack-01]
    related: [dp-mod-state, lis, inline-dp, meet-in-the-middle]
    summary: "DP の表が大きすぎるとき、範囲を上限で打ち切るか、ほかの添字から決まる量・支配される量を値の側に回して状態を減らす。どれを添字に残すかは、範囲が小さい量で決める。"
    signs:
      - {type: constraint, text: "重さの上限 W ≤ 10^9 で、価値の総和が 10^5 程度"}
      - {type: phrase, text: "ペナルティが 2^(C−1) のように指数的に増える"}
      - {type: shape, text: "dp[i][a][b] の表が大きすぎ、同じ (i, a) なら b が大きい（小さい）ほど常に良い"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 7 問"
    sections:
      - {title: "上限で打ち切る（log 回で十分な量・目標以上をまとめる）", anchor: cap}
      - {title: "値と添字の入れ替え（同じ添字なら値が良い方が常に良いとき）", anchor: dp-swap-key-value}
      - {title: "どれを添字に残すか（範囲が小さい量を選ぶ）", anchor: which-to-index}
      - {title: "落とし穴：打ち切りの遷移を忘れる・復元が要るのに表を捨てる・入れ替えた後の答えの取り出し", anchor: pitfalls}
    merged_keys: [dp-swap-key-value]
    visual: {kind: static, priority: 2, text: "3 つの量 (a, b, c) の立方体の表から c を値に回して平面の表にする図。「重さ → 価値の最大」と「価値 → 重さの最小」の表を並べ、同じ情報を持つことを示す"}
    problems:
      - {id: dp_e, role: example, summary: "重さの上限 W が 10^9 と大きく価値の総和が 10^5 程度の品物で、重さの合計が W 以下での価値の和の最大を求める。", approach: "価値を添字に、その価値を作る最小の重さを値にする"}
      - {id: abc325_f, role: example, representative: true, summary: "長さ D_i の区間たちを、監視できる長さ・費用・使える個数の上限が決まった 2 種類のセンサーで覆うときの、費用の最小を求める。", approach: "2 種類の個数の両方は添字にせず、片方の個数を値（最小）にする"}
      - {id: abc410_e, role: practice, summary: "体力 H・魔力 M で敵を順に倒し、敵ごとに体力か魔力の決まった量を使うとき、倒せる敵の数の最大を求める。", approach: "残り体力ごとに残せる魔力の最大を値に持つ"}
      - {id: abc364_e, role: practice, summary: "甘さとしょっぱさが決まった料理を並べて順に食べ、甘さの合計が X を、しょっぱさの合計が Y を超えた時点でやめるとき、食べられる品数の最大を求める。", approach: "品数と甘さを添字、しょっぱさの最小を値にする"}
      - {id: abc315_f, role: practice, summary: "チェックポイントを順に回り、いくつか飛ばすと 2^(C−1) のペナルティがかかるとき、移動距離とペナルティの和の最小を求める。", approach: "ペナルティが指数的に増えるので、飛ばす回数は数十まで見れば足りる"}
      - {id: abc376_f, role: practice, summary: "円環上に置いた左右の手を、指示された手を指示された位置へ順に動かすときの、移動の総数の最小を求める。", approach: "指示の直後は指定された手の位置が決まるので、状態はもう一方の手の位置だけでよい"}
      - {id: abc203_f, role: challenge, summary: "高橋君が「最も高い草の半分より高い草を全部抜く」操作を繰り返す前に、青木君が K 本まで草を抜いておくとき、高橋君の操作回数と青木君が抜く本数の組の最小を求める。", approach: "高橋君の操作回数（log 回まで）を添字、青木君が抜く本数の最小を値にする"}
    sources: ["02-dp §4.A（dp-dimension-reduction・dp-swap-key-value）", "02-dp §5.1", "02-dp §5.3", "02-dp §7.2"]

  - id: knapsack-undo
    chapter: 列の DP
    title: 戻す DP
    aliases: [ナップサックの削除, 削除できるナップサック, 減らすナップサック]
    type: technique
    level: 青
    level_evidence: "abc321_f (1645、2023-09) が本命。各要素を除いた場合を全部求める arc070_b (2015) は黄。max のナップサックは戻せないので前後からの DP（abc441_f 1455、2026）や分割統治（abc426_g 2119）を使う。research/00 の undo-dp も青（abc321_f）"
    kind: [DP, 数え上げ]
    prerequisites: [subset-sum, knapsack-01]
    related: [divide-and-conquer#range-knapsack, dp-dimension-reduction]
    summary: "数え上げの部分和 DP の更新は逆向きに解けるので、要素を 1 つ取り除いた状態に戻せる。max や min の DP は戻せないので、前後からの DP のマージや分割統治を使う。"
    signs:
      - {type: phrase, text: "要素の追加と削除のクエリのたびに、和が K になる選び方の数を答える"}
      - {type: phrase, text: "各 i について、i を使わないときの答え（〜を除いたとき）"}
      - {type: constraint, text: "クエリの数 Q と目標の和 K がともに 5000 程度（O(QK) が通る）"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 3 問"
    sections:
      - {title: "足し算の更新は引き算で戻せる（ループの向きは追加と逆）", anchor: undo-by-subtraction}
      - {title: "戻せない DP（max・min・OR）", anchor: not-undoable}
      - {title: "前後からの DP をマージする", anchor: prefix-and-suffix}
      - {title: "分割統治でオフラインに処理する", anchor: offline-divide-and-conquer, level: 黄}
    merged_keys: [undo-dp]
    visual: {kind: dynamic, priority: 3, text: "追加の更新（大きい方から足す）と削除の更新（小さい方から引く）を同じ配列の上で並べるステップ送り（静的な図で代えてよい）"}
    problems:
      - {id: abc321_f, role: example, representative: true, summary: "箱に整数を入れる・取り出すクエリのたびに、箱の中から和がちょうど K になるように選ぶ方法の数を答える。", approach: "追加は部分和 DP の更新、削除はその逆向きの更新で戻す"}
      - {id: abc441_f, role: practice, summary: "（執筆時に確かめる）", approach: "max のナップサックは戻せないので、前後からの DP を保存し、i を除いた最適値をマージで求める"}
      - {id: arc070_b, role: practice, summary: "和が K 以上の部分集合を「良い集合」と呼ぶとき、含まれるどの良い集合から取り除いても良い集合のままになる「不要な」カードの枚数を求める。", approach: "各カードを除いた部分和を、戻す DP か前後からの DP のマージで求める（単調性と二分探索の解法もある）"}
    sources: ["02-dp §4.B（knapsack-undo）", "02-dp §5.1", "00-curriculum §4.2（戻す DP）"]

