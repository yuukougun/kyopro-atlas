      - {title: "選ぶ集合と順序を分けて考える", anchor: set-and-order}
      - {title: "比較の基準の作り方（入れ替えの差を i だけの量と j だけの量に分ける）", anchor: comparison-key}
      - {title: "比は割らずに掛け算で比べる", anchor: compare-ratios}
      - {title: "大きい順に左右の端へ置く", anchor: place-at-ends, level: 黄}
    merged_keys: []
    visual: {kind: static, priority: 3, text: "隣り合う 2 つを入れ替えたときの損得を式にし、比較の基準（s+w・締切・比）が出てくる流れの図"}
    problems:
      - {id: dp_x, role: example, summary: "重さ・丈夫さ・価値が決まったブロックを積み、各ブロックの上に載る重さの合計が丈夫さ以下になるようにするときの、価値の和の最大を求める。", approach: "s+w の小さい順に並べてから、重さの合計を状態にしたナップサック"}
      - {id: typical90_k, role: example, summary: "締切・かかる日数・報酬が決まった仕事を選んで締切までに終えるときの、報酬の和の最大を求める。", approach: "締切の早い順に並べてから、使った日数を状態にしたナップサック"}
      - {id: abc366_f, role: example, representative: true, summary: "N 個の一次関数 f_i(x) = A_i x + B_i から異なる K 個を選んで好きな順に合成し、1 に適用した値の最大を求める。", approach: "適用する順は比の大小で決まるので、その順に並べてから K 個選ぶ DP をする"}
      - {id: abc145_e, role: practice, summary: "食べ終えるのにかかる時間とおいしさが決まった料理を、最後の注文を T − 0.5 分までにする条件で頼むときの、おいしさの和の最大を求める。", approach: "食べる時間の昇順に並べ、最後に頼む品を途中で試す"}
      - {id: abc216_f, role: practice, summary: "添字の集合 S のうち、S での A の最大値が S での B の和以上になるものの個数を求める。", approach: "A の昇順に並べると今の要素が最大と決まり、B の和の数え上げ DP にできる（節は subset-sum#sort-then-count）"}
      - {id: abc163_e, role: challenge, summary: "活発度 A_i の幼児を並べ替えて、各幼児の移動距離×活発度の和の最大を求める。", approach: "活発度の大きい順に左端か右端へ置いてよい。左右に何人置いたかを状態にする（節 place-at-ends）"}
    sources: ["02-dp §4.B（exchange-argument-dp）", "02-dp §5.1"]

  - id: dp-grid
    chapter: 列の DP
    title: グリッド上の DP
    aliases: [グリッド DP, Grid DP, 格子路の DP, 最大正方形]
    type: technique
    level: 水
    level_evidence: "基本の経路数・最長路は基礎（EDPC H・abc232_d 539）。状態や累積和などの工夫が入る問題が abc183_e (1288)・abc311_e (1293)・abc442_f (1295)・abc201_d (1317)・abc210_d (1507)・abc175_e (1554) と水に集まる。abc319 以降は abc442_f (1295)・abc369_f (1618)・abc344_f (1922)。黄に abc227_f (2323)"
    kind: [DP]
    prerequisites: [dp-basics]
    related: [dp-dag, grid-graph, bfs, lattice-paths, inclusion-exclusion-dp#first-obstacle, dp-prefix-sum, grid#right-down]
    summary: "右か下にしか動けないグリッドで、経路の数や経路上の値の最大を、マスの昇順の DP で求める。上下左右に動けるなら閉路ができるので、BFS やダイクストラ法を使う。"
    signs:
      - {type: phrase, text: "右か下にしか動けない"}
      - {type: phrase, text: "経路の数・経路上で集める値の最大"}
      - {type: phrase, text: "条件を満たす正方形の数・最大の正方形"}
      - {type: constraint, text: "H, W ≤ 3000 程度"}
    acl: []
    frequency: B
    frequency_evidence: "recent 1（abc476_f）・前提として届くページなし・古い ABC 11 問"
    sections:
      - {title: "計算順序と初期化（1 行目・1 列目・壁）", anchor: order-and-init}
      - {title: "状態を足す（今の行で拾った個数・作れる差の集合）", anchor: extra-state}
      - {title: "方向ごとの累積和で遷移をまとめる", anchor: directional-prefix}
      - {title: "最大の正方形（左・上・左上の min + 1）", anchor: largest-square}
      - {title: "向きを反転してもう一度", anchor: flip-direction}
      - {title: "経路上の上位 K 個（K 番目を固定して状態に）", anchor: top-k-on-path, level: 黄}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "マス目に値を書き込みながら左上から右下へ埋める様子の図。上下左右に動けると閉路ができて DP にならないことの対比図"}
    problems:
      - {id: dp_h, role: example, summary: "壁のあるグリッドを右か下にだけ進んで、左上から右下へ行く経路の数を求める。", approach: "マスの昇順に、上と左から足す"}
      - {id: abc311_e, role: example, representative: true, summary: "穴のあるマスが N 個あるグリッドで、穴を含まない正方形の個数を求める。", approach: "各マスを右下とする最大の正方形の一辺を、左・上・左上の min + 1 で求める（節 largest-square。2 次元累積和と二分探索でも解ける）"}
      - {id: abc183_e, role: practice, summary: "壁のあるグリッドで、右・下・右下のどれかへ壁の手前まで何マスでも進めるとき、左上から右下へ行く方法の数を求める。", approach: "縦・横・斜めの方向ごとの累積を持つ（節 directional-prefix）"}
      - {id: abc210_d, role: practice, summary: "グリッドの 2 マスに駅を建て、2 つの建設費と駅間のマンハッタン距離×C の和を最小にする。", approach: "左上側の最小値を DP で伝え、向きを反転してもう一度行う"}
      - {id: abc175_e, role: practice, summary: "グリッドを右か下に進んでアイテムを拾うとき、各行で 3 個まで拾える条件での価値の和の最大を求める。", approach: "今の行で拾った個数を状態に足す"}
      - {id: abc369_f, role: practice, summary: "グリッドを右か下にだけ進んでコインを集めるとき、集める枚数の最大と、そのときの経路を求める。", approach: "コインの位置で LIS 型の DP をして復元する（例題は dp-reconstruction）"}
      - {id: abc147_e, role: practice, summary: "各マスに 2 つの数が書かれたグリッドを右か下に進み、各マスでどちらを赤にするか選ぶとき、赤の和と青の和の差の絶対値の最小を求める。", approach: "各マスで作れる差の集合を bitset で持つ"}
      - {id: abc344_f, role: practice, summary: "マスにとどまってお金を稼ぐか、費用を払って右か下へ進むかを繰り返して右下へ着くときの、行動回数の最小を求める。", approach: "通過した中で最も稼ぎの良いマスを状態にし、（行動回数, 所持金）の組を比べて持つ"}
      - {id: abc227_f, role: challenge, summary: "グリッドを右か下に進む経路で、通ったマスの値の大きい方から K 個の和の最小を求める。", approach: "K 番目の値を全探索で固定し、それ以上の個数を状態にする（節 top-k-on-path）"}
    sources: ["02-dp §4.A（dp-grid）", "02-dp §5.1", "02-dp §5.3"]

  - id: dp-sequence-partition
    chapter: 列の DP
    title: 区間分割 DP
    aliases: [区間分割型 DP, 仕切りを入れる DP, 列を区切る DP]
    type: technique
    level: 水
    level_evidence: "区切れるかの可否は arc065_a (930) から。条件を満たす区切り方を数える型は agc031_b (1315) の水から、条件が複雑なもの（abc207_e 1820・typical90_ck (★7)・arc104_c 2009）が青〜黄に続く。abc319 以降の根拠は見つかっていない（古い問題で決めた）"
    kind: [DP]
    prerequisites: [dp-prefix-sum]
    related: [interval-dp, two-pointers, dp-mod-state, monge, alien-dp]
    summary: "列をいくつかの区間に区切る方法の数や最小コストを、最後の区間の左端 j で分けて求める。j の範囲が単調に動くなら尺取りと累積和で、区間の番号に依存するなら番号を状態に足して速くする。"
    signs:
      - {type: phrase, text: "列をいくつかの連続部分に分ける方法の数"}
      - {type: phrase, text: "各区間のコストの和の最小"}
      - {type: phrase, text: "各区間が条件を満たすように区切れるか"}
      - {type: shape, text: "dp[i] = Σ（または min）_{j < i, [j, i) が条件を満たす} dp[j]"}
    acl: []
    frequency: C
    frequency_evidence: "recent 0・前提として 2 ページに届く（直接 1）・古い ABC 1 問"
    sections:
      - {title: "最後の区間で分ける（dp[0] = 1 は空の区切り）", anchor: last-block}
      - {title: "区間 DP（dp[l][r]）との違い", anchor: vs-interval-dp}
      - {title: "遷移元の範囲が単調に動く：尺取りと累積和", anchor: two-pointers}
      - {title: "区間の番号に依存する条件：番号を状態に足す", anchor: block-index, level: 青}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "列に仕切りを 1 本ずつ入れる図と、dp[i] に足し込まれる dp[j] の範囲を色付きの帯で示す図"}
    problems:
      - {id: agc031_b, role: example, representative: true, summary: "石の列で、同じ色の 2 つの石を選んでその間を同じ色に塗る操作を何回でも行うとき、最終的に作れる色の列の種類数を求める。", approach: "直前の同じ色の位置からの遷移で重複を避ける"}
      - {id: arc065_a, role: practice, summary: "文字列 S を dream・dreamer・erase・eraser の連結に区切れるかを判定する。", approach: "先頭からの位置ごとの可否 DP（後ろから照合する貪欲でも解ける。例題は thinking の reverse-thinking）"}
      - {id: abc207_e, role: practice, summary: "数列をいくつかの区間に区切り、k 番目の区間の和が k で割り切れるようにする方法の数を求める。", approach: "区間の番号ごとに余りの累積で遷移をまとめる（節 block-index）"}
      - {id: typical90_ck, role: practice, summary: "数列をいくつかの区間に区切り、各区間の転倒数が K 以下になる区切り方の数を求める。", approach: "尺取りと BIT で左端の範囲を求め、累積和で数える"}
      - {id: arc104_c, role: challenge, summary: "一部が欠けたエレベーターの乗り降りの記録を、条件を満たすように補えるかを判定する。", approach: "区間に区切る可否 DP"}
    problems_note: "abc319 以降の ABC で区間分割 DP が主役の問題は research で確かめられていない。工程 8b の前の問題の補充で探す"
    sources: ["02-dp §4.C（dp-sequence-partition）", "02-dp §5.1"]

  - id: lis
    chapter: 列の DP
    title: 最長増加部分列
    aliases: [LIS, Longest Increasing Subsequence, 最長減少部分列, Dilworth の定理, 増加列への最小分割]
    type: technique
    level: 水
    level_evidence: "基本形（二分探索で O(N log N)）が必要な問題は abc134_e (1320)・typical90_bh (★5) から現れる。abc319 以降の ABC で LIS を使う問題は abc354_f (1639)・abc468_f (1693)・abc457_g (1928)・abc360_g (1982)・abc476_g (2477) と青以上で、どれも応用（各要素の判定・1 か所の変更・Dilworth の定理）にあたる。基本形だけで解ける最近の問題は見つからないので、基本形は古い問題で水とし、応用は青の節に置いた"
    kind: [DP, 二分探索]
    prerequisites: [dp-basics, binary-search]
    related: [dp-segment-tree, segment-tree, dp-dimension-reduction, inline-dp, lcs, root-path-dfs#undo-log, dilworth-path-cover#antichain, manhattan-chebyshev#rotate-45, subsequence-and-substring#longest]
    summary: "列から順序を保って選ぶ増加列の最長を、長さごとの末尾の最小値の配列を二分探索で更新して O(N log N) で求める。値を添字にしたセグメント木を使えば、重み付きや数え上げにも広げられる。"
    signs:
      - {type: constraint, text: "N ≤ 2×10^5 で「部分列」「単調増加」"}
      - {type: phrase, text: "最小で何本の増加（減少）列に分けられるか・何色で塗れるか"}
      - {type: phrase, text: "抜いて差し込む操作の最小回数"}
      - {type: phrase, text: "箱・円を入れ子にできる最大個数"}
    acl: [segtree]
    verify: [longest_increasing_subsequence]
    frequency: A
    frequency_evidence: "recent 3（abc457_g・abc468_f・abc476_g）・前提として届くページなし・古い ABC 5 問"
    sections:
      - {title: "二分探索版（L が単調になる理由・狭義は lower_bound、広義は upper_bound）", anchor: binary-search}
      - {title: "セグメント木版（重み付き・各要素で終わる最長・数え上げ）", anchor: segment-tree}
      - {title: "復元（直前の要素を記録する）", anchor: restore}
      - {title: "各要素が LIS に含まれうるか（前後から 2 回求める）", anchor: contained, level: 青}
      - {title: "2 次元の入れ子（一方は昇順・もう一方は降順に並べる）", anchor: nesting, level: 青}
      - {title: "1 か所だけ変更できる LIS・木の上の LIS", anchor: variants, level: 青}
      - {title: "Dilworth の定理（増加列への最小分割数＝最長減少部分列の長さ）", anchor: dilworth, level: 青}
    merged_keys: [dilworth]
    visual: {kind: dynamic, priority: 1, text: "値を 1 つずつ入れ、L のどこが置き換わるかを強調するステップ送り（O(N^2) の表との対比）。点を並べ、減少列の各点が別々の増加列に入るしかないことを示す図"}
    problems:
      - {id: abc134_e, role: example, representative: true, summary: "数列の各要素に色を塗り、同じ色の要素が左から見て狭義増加になるようにするときの、色の数の最小を求める。", approach: "広義の非増加部分列の最長に言い換える（Dilworth の定理）"}
      - {id: typical90_bh, role: example, summary: "数列から部分列を選び、ある位置までは狭義増加・そこからは狭義減少になる山型の部分列の長さの最大を求める。", approach: "左からの LIS と右からの LIS を各位置で合わせる"}
      - {id: abc354_f, role: practice, summary: "数列の各要素について、その要素を含む最長増加部分列が存在するかを判定する。", approach: "前後からの LIS の長さの和で判定する（節 contained）"}
      - {id: dp_q, role: practice, summary: "高さが相異なる花の列から、高さが左から単調増加になるように選ぶときの美しさの和の最大を求める。", approach: "高さを添字にしたセグメント木で、低い花からの美しさの最大を取る（例題は dp-segment-tree）"}
      - {id: abc006_4, role: practice, summary: "トランプの列で「1 枚抜いて好きな位置に差し込む」操作を繰り返して昇順に並べるときの、操作回数の最小を求める。", approach: "N − LIS に言い換える"}
      - {id: abc165_f, role: practice, summary: "木の各頂点 k について、根から k へのパス上の値の列の最長増加部分列の長さを求める。", approach: "DFS で LIS の配列の 1 か所の変更を記録し、戻るときに元に戻す（節 variants）"}
      - {id: abc457_g, role: practice, summary: "（執筆時に確かめる）", approach: "座標を 45 度回転して上か右にしか動けない形にし、必要な数を増加列への最小分割数（最長減少部分列の長さ）で求める（節 dilworth）"}
      - {id: abc360_g, role: practice, summary: "数列の要素を 1 つだけ好きな整数に変えてよいとき、最長増加部分列の長さの最大を求める。", approach: "「変更済みか」を状態に足す（節 variants）"}
      - {id: abc476_g, role: challenge, summary: "（執筆時に確かめる）", approach: "popcount の列を狭義増加の部分列に塗り分ける最小の色数を、最長の広義減少部分列の長さとして求める（Dilworth の定理と popcount の構造）"}
      - {id: tdpc_target, role: challenge, summary: "数直線上に中心を持つ円の集合から、入れ子（次の円の内側にある）の鎖になるように選べる円の個数の最大を求める。", approach: "円を区間の包含に直してソートし、LIS で最長の鎖を求める（節 nesting）"}
    sources: ["02-dp §4.C（lis）", "02-dp §5.1", "00-curriculum §4.2（Dilworth の定理）", "00-curriculum §2.3.8（abc457_g・abc468_f・abc476_g）", "04-tree §4.17（root-path-dfs：abc165_f）"]

  - id: lcs
    chapter: 列の DP
    title: 最長共通部分列と編集距離
    aliases: [LCS, Longest Common Subsequence, レーベンシュタイン距離, Edit Distance, Levenshtein Distance, 最長共通部分文字列, DP の DP]
    type: technique
    level: 水
    level_evidence: "EDPC F が基本。LCS 型の 2 次元 DP が必要な ABC は abc141_e (1459)・abc185_e (1468)・abc130_e (1676) に集まる。LCS の値ごとに数える DP の DP は abc391_g (2247、2025) の黄（ABC の例が 1 問なので節にした）。abc319 以降で LCS 型の水の問題は見つかっていない（古い問題で決めた）"
    kind: [DP, 文字列]
    prerequisites: [dp-basics]
    related: [dp-reconstruction, subsequence-dp, interval-dp, palindrome, counting-dedup, bit-dp, subsequence-and-substring#longest]
    summary: "2 つの文字列の最長共通部分列の長さを、末尾どうしが一致するかで分ける 2 次元の DP で O(NM) で求める。同じ表で挿入・削除・置換のコストを取れば編集距離になる。"
    signs:
      - {type: constraint, text: "2 つの列・文字列で N, M ≤ 3000〜5000"}
      - {type: phrase, text: "共通の部分列の最長・共通部分列の組の数"}
      - {type: phrase, text: "挿入・削除・置換で一致させる最小回数"}
      - {type: phrase, text: "ある値（2 つの文字列の最長共通部分列の長さなど）がちょうど k になる文字列の数"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 4 問"
    sections:
      - {title: "表の意味と遷移（一致する末尾を使って損をしない理由）", anchor: recurrence}
      - {title: "復元（右下から逆にたどる）", anchor: restore}
      - {title: "編集距離（挿入・削除・置換の 3 方向のコスト）", anchor: edit-distance}
      - {title: "部分列と部分文字列の違い（最長共通部分文字列）", anchor: substring}
      - {title: "共通部分列の組の数（包除で重複を引く・2 次元の累積和）", anchor: count-pairs, level: 青}
      - {title: "最長回文部分列（S と反転の LCS）", anchor: palindromic-subsequence}
      - {title: "LCS の値ごとに数える：DP の DP（内側の DP の 1 行を外側の状態にする）", anchor: dp-of-dp, level: 黄}
    merged_keys: [edit-distance, dp-of-dp]
    visual: {kind: static, priority: 2, text: "2 次元の表を左上から埋め、一致（斜め）・不一致（上か左）の矢印を描く図。復元で逆にたどる経路を強調する。内側の表の 1 行を bit 列にし、1 文字足すと別の行に移る遷移図"}
    problems:
      - {id: dp_f, role: example, summary: "2 つの文字列の最長共通部分列を 1 つ出力する。", approach: "表で長さを求め、終端から逆にたどる"}
      - {id: abc185_e, role: example, representative: true, summary: "2 つの数列からいくつか要素を削除して長さをそろえるとき、削除した個数と、残った列で値が異なる位置の数との和の最小を求める。", approach: "削除と不一致をコストにした編集距離の変形"}
      - {id: abc141_e, role: practice, summary: "文字列の中に、重ならずに 2 回現れる連続部分文字列の長さの最大を求める。", approach: "末尾からの一致長を LCS 型の表で求める（Z アルゴリズムやローリングハッシュでも解ける）"}
      - {id: abc130_e, role: practice, summary: "2 つの数列から、同じ値の列になる部分列の組（取り出す位置の組）の数を求める。", approach: "包除で重複を除き、2 次元の累積和で速くする（節 count-pairs）"}
      - {id: agc021_d, role: challenge, summary: "文字列の文字を K 個まで書き換えたとき、文字列とその反転の最長共通部分列の長さの最大を求める。", approach: "S と反転の LCS を、書き換えた数も状態にした区間 DP で求める"}
      - {id: abc391_g, role: challenge, summary: "長さ M の英小文字列のうち、与えられた短い文字列 S との最長共通部分列の長さが各 k になるものの個数を求める。", approach: "内側の LCS の表の 1 行を bit で外側の状態にする（節 dp-of-dp）"}
    sources: ["02-dp §4.C（lcs・edit-distance・dp-of-dp）", "02-dp §5.1"]

