  - id: dp-decision-binary-search
    chapter: DP の考え方
    title: 答えを決め打ちして DP で判定する
    aliases: [二分探索＋DP, 決め打ち二分探索, 判定 DP, 平均の最大化, 中央値の最大化, 比の最大化]
    type: technique
    level: 青
    level_evidence: "abc415_e (1212) の水から、abc324_f (1815)・abc236_e (1893) と青。木の上の判定は abc246_g (2313)"
    kind: [DP, 二分探索]
    prerequisites: [binary-search-answer, dp-basics]
    related: [fractional-binary-search, median-binary-search, dp-dag, dp-grid, tree-dp]
    summary: "「最小値の最大化」「平均・比・中央値の最大化」は、答え X を決め打つと「X 以上を達成できるか」の判定問題になる。判定が X について単調なら二分探索し、判定を DP で作る。"
    signs:
      - {type: phrase, text: "平均・比・中央値の最大値"}
      - {type: phrase, text: "最小値の最大化・最大値の最小化"}
      - {type: phrase, text: "直接 DP すると個数や総和を状態に持つ必要があって重い"}
    acl: []
    frequency: B
    sections:
      - "判定問題に直す（単調性の確かめ方）"
      - "平均 ≥ X ⇔ Σ(a_i − X) ≥ 0、比 ≥ X ⇔ Σ(b_i − X·c_i) ≥ 0"
      - "中央値 ≥ X ⇔ X 以上を +1・未満を −1 にした和が正"
      - "判定 DP の書き方（決め打ちごとに初期化し直す）"
      - "落とし穴：実数の二分探索の回数・境界の ≥ と >・偶数個のときの中央値"
    merged_keys: []
    visual: "答えの候補 X の数直線と、X を固定したときの判定 DP の結果（可・不可）が単調に切り替わる図"
    problems:
      - {id: abc415_e, role: example, summary: "最初に持つコインの枚数を二分探索し、所持枚数の最大を持つグリッドの DP で可否を判定する"}
      - {id: abc324_f, role: example, summary: "美しさの和÷コストの和の最大。Σ(b − X·c) ≥ 0 となる経路があるかを DAG の最長路で判定する"}
      - {id: abc236_e, role: practice, summary: "隣り合う2つを両方は飛ばせない選び方で、平均と中央値の最大。値を変換して DP で判定する"}
      - {id: abc246_g, role: challenge, summary: "木の上の2人ゲーム。答えを決め打ちし、木 DP で達成できるかを判定する"}
    sources: ["02-dp §4.A（dp-decision-binary-search）", "02-dp §5.1", "00-curriculum §4.2（平均・比の最大化）"]

  # ── 第2章 列の DP ──────────────────────────────

