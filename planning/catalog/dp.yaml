      - {id: typical90_bu, role: example, summary: "辺を切って各成分に a と b の両方が含まれるようにする方法の数。根側の成分の中身を3状態で持つ"}
      - {id: abc239_e, role: practice, summary: "部分木に含まれる値の大きい方から K 番目（K ≤ 20）。子の上位20個をまとめて求める"}
      - {id: abc447_f, role: practice, summary: "次数の条件つきの最長パス。パスの最も浅い頂点で場合分けし、子の長さの上位2つから求める"}
      - {id: abc133_e, role: practice, summary: "距離2以内の頂点が異なる色になる塗り方の数。根から順に選べる色の数を掛けていく"}
      - {id: abc259_f, role: practice, summary: "次数の上限つきで辺を選ぶ重みの最大。親との辺を使うかで分け、子の得の大きい順に取る"}
      - {id: abc359_g, role: challenge, summary: "同じ色の頂点の組の距離の総和。部分木ごとの色の集計を、小さい方から大きい方へ合わせる"}
      - {id: abc246_g, role: challenge, summary: "木の上の2人ゲーム。答えを二分探索で決め打ちし、木 DP で達成できるかを判定する"}
    sources: ["02-dp §4.G（tree-dp・tree-dp-merge）", "02-dp §5.1", "02-dp §7.2", "04-tree §4.11（tree-diameter：abc447_f）", "04-tree §4.20（small-to-large）"]

