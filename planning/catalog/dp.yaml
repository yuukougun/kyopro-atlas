  - id: insertion-dp
    chapter: 状態の形で分かれる DP
    title: 挿入 DP・箱根駅伝 DP
    aliases: [相対順位の DP, 順列の DP, 箱根 DP, Insertion DP, 連結成分 DP, Connected Component DP]
    type: technique
    level: 黄
    level_evidence: "挿入 DP は EDPC T と同型の abc209_f (2307)、発展に abc282_g (2412)・abc267_g (2561)。2026 年は abc468_g (1975)・abc473_g (1974、確率と FPS を組む) と青の上端の G が続いたが、ほかは黄以上なので黄のままにした。abc468_g・abc473_g のように青の帯に出続けたら下げる（design-review §3）。箱根駅伝 DP は abc309_g (2372)・abc134_f (2532) の 2 問だけなので、同じ「順列を相対的な情報で数える」系統としてこのページの節にした（設計書 §4.3）。連結成分 DP は ABC の例がなく発展の節"
    kind: [DP, 数え上げ]
    prerequisites: [dp-state-design, dp-prefix-sum]
    related: [inclusion-exclusion-dp#count-violations, counting-fix-order#relative-order, counting-dedup]
    summary: "順列を、決めた部分の相対順位や「相手が未定の要素の数」だけを状態にして数える。隣り合う大小関係が指定された順列は、最後の要素の相対順位を状態にし累積和で O(N^2) になる。"
    signs:
      - {type: phrase, text: "順列で隣り合う大小関係（< と >）が指定される"}
      - {type: phrase, text: "|p_i − i| の和がちょうど K の順列の数"}
      - {type: phrase, text: "値の小さい順に、列の好きな位置へ挿入していく"}
      - {type: constraint, text: "N ≤ 3000 程度の順列の数え上げ"}
    acl: []
    frequency: A
    frequency_evidence: "recent 2（abc468_g・abc473_g）・前提として届くページなし・古い ABC 5 問"
    sections:
      - {title: "相対順位を状態にする（最後の要素が何番目か）", anchor: relative-rank}
      - {title: "遷移は区間になるので累積和でまとめる", anchor: prefix-sum}
      - {title: "値の大きい（小さい）順に挿入していく見方", anchor: insert-by-value}
      - {title: "箱根駅伝 DP（相手が未定の位置と値の数を持つ）", anchor: hakone-ekiden-dp}
      - {title: "連結成分 DP（ブロックを作る・端に付ける・つなぐ）", anchor: connected-component-dp, level: 発展}
    merged_keys: [hakone-ekiden-dp, connected-component-dp]
    visual: {kind: dynamic, priority: 3, text: "不等号列 <>< に沿って相対順位の表を 1 列ずつ埋め、新しい要素が入れる範囲を帯で示す。位置と値を 2 列に並べて左から線を結び、結ばれていない端の数を状態として表示する（静的な図で代えてよい）"}
    problems:
      - {id: dp_t, role: example, summary: "隣り合う要素の大小関係（< と >）が文字列で指定されたとき、それを満たす 1〜N の順列の個数を求める。", approach: "最後の要素の相対順位を状態にし、累積和で O(N^2)"}
      - {id: abc209_f, role: example, representative: true, summary: "N 本の木を 1 本ずつ切り、切る木とその両隣の現在の高さの和がコストになるとき、コストの合計が最小になる切る順番の数を求める。", approach: "隣どうしのどちらを先に切るかの列に言い換えて、EDPC T と同じ形にする"}
      - {id: abc134_f, role: example, summary: "1〜N の順列 p のうち、Σ |p_i − i| がちょうど K になるものの個数を求める。", approach: "左から見て相手が未定の位置と値の数を状態にする（節 hakone-ekiden-dp）"}
      - {id: abc468_g, role: practice, summary: "（執筆時に確かめる）", approach: "挿入 DP（research/00 §2.3.8 の分類）"}
      - {id: abc309_g, role: practice, summary: "1〜N の順列 p のうち、すべての i で |p_i − i| ≥ X を満たすものの個数を求める（X ≤ 5）。", approach: "包除で違反する位置を選び、近い位置の値の使用状況を bit で持つ"}
      - {id: tdpc_string, role: practice, summary: "各文字の個数が決まった文字を並べる方法のうち、同じ文字が隣り合わないものの個数を求める。", approach: "文字を種類ごとに挿入し、隣り合う同じ文字の組の数を状態にする（節 insert-by-value）"}
      - {id: abc282_g, role: challenge, summary: "1〜N の順列の組 (P, Q) のうち、隣り合う要素の大小関係が P と Q で一致する位置の数がちょうど K になるものの個数を求める。", approach: "2 つの相対順位を状態にする"}
      - {id: abc267_g, role: challenge, summary: "数列の並べ替えのうち、A_i < A_{i+1} となる i がちょうど K 個あるものの個数を求める。", approach: "値の小さい順に挿入して、増える回数を数える（節 insert-by-value）"}
    sources: ["02-dp §4.H（insertion-dp・hakone-ekiden-dp・connected-component-dp）", "02-dp §5.1", "00-curriculum §2.3.8（abc468_g・abc473_g）"]

  # ── 第4章 DP の高速化 ──────────────────────────────

  - id: dp-speedup-overview
    chapter: DP の高速化
    title: DP の高速化の選び方
    aliases: [DP の高速化, DP 高速化, DP 最適化, DP Optimization, 遷移の高速化]
    type: hub
    level: null
    level_evidence: null
    kind: [DP, 案内]
    prerequisites: [dp-basics]
    related: [dp-prefix-sum, dp-segment-tree, inline-dp, dp-dimension-reduction, bitset-speedup#subset-sum-shift, online-convolution#dp-as-polynomial, fps-basics, matrix-power#dp-transition, cht, monge, alien-dp, slope-trick]
    summary: "素直な DP が間に合わないとき、貰う形の式の右辺の形（区間の和・区間の最小・多項式の積・同じ線形の遷移の繰り返し・一次関数の最小など）から速くする道具を選ぶ。"
    signs:
      - {type: shape, text: "素直に書いた DP の遷移が状態 1 つあたり O(N) かかり、全体で O(N^2) になる"}
    acl: []
    sections:
      - {title: "状態を減らすか、遷移を速くするか", anchor: two-directions}
      - {title: "貰う形の式を書き、右辺の形を見る", anchor: read-the-recurrence}
      - {title: "早見表：遷移の形から道具を選ぶ", anchor: shape-to-tool}
      - {title: "多項式の積・同じ線形の遷移の繰り返し（畳み込み・行列累乗へ）", anchor: algebraic-tools}
      - {title: "凸性を使う高速化（CHT・Monge・Alien DP・Slope Trick）の使いどころ", anchor: convexity}
      - {title: "落とし穴：式を書かずに道具から考える・累積和とセグメント木の取り違え", anchor: pitfalls}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "早見表の行（式の形 → 道具 → ページ）：区間の和 → 累積和（dp-prefix-sum）、区間の min・max → セグメント木（dp-segment-tree）、窓が単調に動く min → スライド最小値（dp-segment-tree）、前の段がほぼ写る・一律の加算 → インライン DP（inline-dp）、可否の遷移 → bitset（bitset-speedup）、多項式の積（和が s になる組の数・自分より前の値との畳み込み）→ 畳み込み・分割統治 FFT（math/online-convolution）、同じ線形の遷移の繰り返し（ステップ数が巨大）→ 行列累乗・ダブリング（math/matrix-power）、一次関数の min → CHT（cht）、Monge なコスト → monotone minima・Knuth-Yao（monge）、ちょうど K 個で凸 → Alien DP（alien-dp）、区分線形凸 → Slope Trick（slope-trick）、状態が多すぎる → 状態の削減（dp-dimension-reduction）。各行に式の形の小さな図を添える"}
    problems:
      - {id: typical90_cl, role: challenge, summary: "（執筆時に確かめる）", approach: "素朴な DP から段階的に速くしていく総合問題（典型 90 問の最終問題）"}
    sources: ["02-dp §4.J（dp-speedup-overview）", "02-dp §4.J（dp-matrix-power・dp-convolution の位置づけ）", "02-dp §2.5", "02-dp §6.1", "02-dp §6.2"]

  - id: dp-segment-tree
    chapter: DP の高速化
    title: セグメント木・スライド最小値による DP の高速化
    aliases: [セグ木 DP, BIT で DP を速くする, 値を添字にした DP, deque DP, 単調スタック DP]
    type: technique
    level: 青
    level_evidence: "abc353_g (1765、2024)・arc026_3 (1930 参考値)・typical90_ak (★5)・EDPC Q。kmjp 氏の ABC G の解説でもセグメント木を使う DP は 2000 前後に多い（abc410_g 2242 など）。abc319 以降は abc339_e (1109)・abc359_e (1275)・abc353_g (1765)・abc410_g (2242) と広がるが、易しい 2 問は値を添字にしたセグメント木（ds）や単調スタックそのものが主で、DP の遷移を設計させる問題は青。スライド最小値・単調スタックの遷移は少ないので節にした"
    kind: [DP, 区間クエリ, 尺取り・スライド窓]
    prerequisites: [dp-prefix-sum, segment-tree-on-values]
    related: [monotonic-stack#sliding-window-minimum, segment-tree#dp, fenwick-tree, lis, inline-dp, cht, dp-speedup-overview]
    summary: "遷移元が添字や値の範囲の最小・最大・和になる DP を、dp の値をセグメント木に載せて 1 回 O(log N) にする。遷移元の窓が単調に動くだけなら、スライド最小値でならし O(1) にできる。"
    signs:
      - {type: phrase, text: "隣り合う要素の差が D 以下になるように選ぶ部分列の最長"}
      - {type: shape, text: "dp[i] = max_{j < i, l ≤ a_j ≤ r} dp[j] + c のように、遷移元が添字や値の範囲の最小・最大"}
      - {type: shape, text: "遷移のコストに |x_i − x_j| を含む（x_j < x_i と x_j > x_i で分けられる）"}
      - {type: shape, text: "dp[i] = min_{i−K ≤ j < i} dp[j] + c（窓が単調に動く）"}
    acl: [segtree, fenwick_tree]
    frequency: B
    frequency_evidence: "recent 0・前提として 1 ページに届く（直接 1）・古い ABC 4 問"
    sections:
      - {title: "dp の値を位置や値を添字にしたセグメント木に載せる（座標圧縮）", anchor: values-on-segment-tree}
      - {title: "|x − y| を左右に分けて 2 本のセグメント木に", anchor: split-abs}
      - {title: "区間を覆う最小コスト（右端までの最小）", anchor: interval-cover}
      - {title: "スライド最小値（単調 deque）と単調スタックによる遷移", anchor: dp-sliding-window}
      - {title: "セグメント木・累積和・スライド最小値の使い分け", anchor: which-tool}
      - {title: "落とし穴：初期値（−∞）・更新と取得の順番（同じ i の値を使わない）", anchor: pitfalls}
    merged_keys: [dp-sliding-window]
    visual: {kind: dynamic, priority: 2, text: "dp 配列をセグメント木の葉に並べ、遷移のたびに区間の最大値を取って 1 点更新するステップ送り。deque の中身を窓の移動に合わせて出し入れするステップ送り"}
    problems:
      - {id: dp_q, role: example, summary: "高さが相異なる花の列から、高さが左から単調増加になるように選ぶときの美しさの和の最大を求める。", approach: "花の高さを添字にしたセグメント木で、低い花からの美しさの和の最大を取る"}
      - {id: typical90_ak, role: example, summary: "N 種類の材料をそれぞれ L_i〜R_i グラム（または使わない）で使い、合計をちょうど W グラムにするときの価値の和の最大を求める。", approach: "前の段の区間の最大値をセグメント木（スライド最小値でもよい）で取る"}
      - {id: abc353_g, role: example, representative: true, summary: "順に開かれる市場へ町の間を移動しながら参加するとき、移動費（C×距離）を引いた利益の最大を求める。", approach: "|x − y| の費用を左右に分け、2 本のセグメント木で持つ（節 split-abs）"}
      - {id: abc339_e, role: practice, summary: "数列から部分列を選び、隣り合う要素の差の絶対値が D 以下になるようにするときの長さの最大を求める。", approach: "値を添字にした dp を区間 max のセグメント木で更新する"}
