  - id: knapsack-undo
    chapter: 列の DP
    title: 戻す DP（ナップサックから要素を取り除く）
    aliases: [戻すDP, 戻す DP, ナップサックの削除, 削除できるナップサック, 減らすナップサック]
    type: technique
    level: 青
    level_evidence: "abc321_f (1645) が本命。各要素を除いた場合を全部求める arc070_b (2015) は黄。max のナップサックは戻せないので前後からの DP（abc441_f 1455）や分割統治（abc426_g 2119）を使う。research/00 の undo-dp も青（abc321_f）"
