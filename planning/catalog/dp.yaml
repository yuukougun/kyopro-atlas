  - id: cht
    chapter: DP の高速化
    title: Convex Hull Trick と Li Chao Tree
    aliases: [CHT, Convex Hull Trick, 傾き最適化, 斜率优化, Li Chao Tree, 李超线段树, 直線の最小値]
    type: overview
    level: 発展
    level_evidence: "ABC で CHT が想定解・主要解の問題は 2019〜2026 年の F/G/Ex で abc289_g (2109)・abc228_h (2729) の2問だけ（kmjp 氏の解説 425 本と AtCoder Tags で確認）。Li Chao Tree が必須の ABC は見つからない。設計書 §4.3 で発展に決定"
    kind: [DP, データ構造]
    prerequisites: [dp-speedup-overview, convex-hull]
    related: [dp-segment-tree, segment-tree, monge, alien-dp]
    summary: "dp[i] = min_j (dp[j] + a_j·x_i + b_j) のように、遷移元 j ごとに x の一次関数が決まり i ごとにその最小値を問う形なら、直線の集合の下側の包絡線だけを持てばよい。傾きもクエリも単調なら deque で全体 O(N)、単調でなければ Li Chao Tree で1回 O(log X) になる。"
    signs:
      - {type: phrase, text: "遷移のコストが i と j の積の項を1つだけ含む（(h_i − h_j)^2 など）"}
      - {type: phrase, text: "直線を追加しながら、任意の x での最小値・最大値を答える"}
      - {type: constraint, text: "N ≤ 2×10^5 で素直な DP が O(N^2)"}
    acl: []
    frequency: C
    sections:
      - "遷移を直線の最小値に変形する"
      - "下側の包絡線と不要な直線（傾きもクエリも単調なら deque）"
      - "クエリが単調でないとき（二分探索）"
      - "Li Chao Tree（区間の真ん中で勝つ直線を残す）"
      - "落とし穴：交点の比較は掛け算で（__int128）・最小と最大の取り違え・同じ傾き"
      - "ライブラリでの検証（Library Checker の line_add_get_min・segment_add_get_min）"
    merged_keys: [li-chao-tree]
    visual: "遷移元ごとの直線を平面に描き、下側の包絡線だけが答えになることと、不要な直線が消える様子のステップ送り"
    problems:
      - {id: dp_z, role: example, summary: "高さの差の2乗＋定数のコストで跳ぶ最小コスト。遷移を直線の最小値として CHT で求める"}
      - {id: abc289_g, role: practice, summary: "各商品の価格を決めて売上を最大化する。買う人数ごとの売上が価格の一次関数になるので CHT で最大を取る"}
    sources: ["02-dp §4.K（cht・li-chao-tree）", "02-dp §2.5", "02-dp §5.1"]

  - id: monge
    chapter: DP の高速化
    title: Monge 性による DP の高速化（monotone minima・Knuth-Yao）
    aliases: [Monge, 四角不等式, 四辺形不等式, Quadrangle Inequality, monotone minima, 分割統治 DP, Divide and Conquer DP, SMAWK, LARSCH, Knuth-Yao, "Knuth's optimization", "(max,+) 畳み込み", "min-plus 畳み込み", DP の凸性]
    type: overview
    level: 発展
    level_evidence: "Monge 性を使う ABC は abc348_g (2559)・abc355_g (2991)・abc383_g (3026) と G/Ex のみ（2024 年）。abc373_f (2018) は monotone minima でも解ける。2026 年に abc458_g (2831、(max,+) 畳み込み)。Knuth-Yao・SMAWK・LARSCH が必須の ABC は見つからない。同じ系統で単独では薄いので1枚にまとめた（設計書 §4.1）"
    kind: [DP, ダブリング・分割統治]
    prerequisites: [dp-sequence-partition, dp-speedup-overview, divide-and-conquer]
    related: [interval-dp, alien-dp, cht, slope-trick, convex-function-basics, knapsack-01]
    summary: "コスト c(i, j) が Monge（c(a,c) + c(b,d) ≤ c(a,d) + c(b,c)）なら、各行の最小値を取る列の位置が単調になり、分割統治（monotone minima）・SMAWK・Knuth-Yao で DP を速くできる。答えが個数について凸なら、k 個選ぶ最適値の列どうしの合成も差分のマージで行える。"
    signs:
      - {type: phrase, text: "区間分割 DP で、区間のコストが「広げるほど増え方が大きい」"}
      - {type: phrase, text: "最適な区切り位置が右へ単調に動きそう"}
      - {type: phrase, text: "区間から k 個選ぶときの最大値を、すべての k について求める"}
      - {type: constraint, text: "N ≤ 10^5・K ≤ 数十の分割 DP"}
    acl: []
    frequency: B
    sections:
      - "Monge 性の定義と確かめ方"
      - "monotone minima（分割統治で O(N log N)）"
      - "SMAWK・LARSCH（O(N)・オンラインに決まる DP）"
      - "Knuth-Yao（区間 DP の分割点の範囲を絞って O(N^2)）"
      - "DP の値の凸性と、凸な列どうしの (max,+) 畳み込み"
      - "ライブラリでの検証（Library Checker の min_plus_convolution_convex_arbitrary など）"
    merged_keys: [monotone-minima, smawk-larsch, knuth-yao, convex-max-plus-convolution, dp-convexity]
    visual: "コスト行列を色で塗り、各行の最小値の位置が右下へ単調に並ぶことを示す図。2つの凸な列の差分を大きい順にマージする図"
    problems:
      - {id: abc348_g, role: example, summary: "B の昇順に並べ、k 個選ぶときの A の和の最大から B を引いた値を、すべての k について求める（分割統治）"}
      - {id: abc383_g, role: practice, summary: "長さ K の区間を重ならないように i 個選ぶ和の最大を、すべての i について求める。凹な列どうしを分割統治で合成する"}
    sources: ["02-dp §4.K（monge・monotone-minima・smawk-larsch・knuth-yao・convex-max-plus-convolution・dp-convexity）", "02-dp §2.5", "02-dp §5.1", "00-curriculum §2.3.8（abc458_g）"]

