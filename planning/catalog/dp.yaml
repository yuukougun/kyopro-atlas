      - {id: arc171_c, role: practice, summary: "（執筆時に確かめる）", approach: "辺の交換操作で作れる列の数。子の数と選んだ辺の数を状態にする"}
      - {id: abc207_f, role: practice, summary: "木のいくつかの頂点に見張りを置き、置いた頂点とその隣が見張られるとき、見張られる頂点の数がちょうど k になる置き方の数を k = 0〜N について求める。", approach: "頂点の 3 状態と個数を持ち、O(N^2) で合わせる（節 state-and-count）"}
