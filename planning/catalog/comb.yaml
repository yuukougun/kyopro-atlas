      - {id: abc333_f, role: example, representative: true, summary: "N 人が並ぶ列で、先頭の人が確率 1/2 で列から抜けるか末尾に回る操作を残り 1 人になるまで続けるとき、各人が最後に残る確率を求める。", approach: "円環状の依存を 1 つの未知数で一周させて閉じて解く"}
      - {id: abc189_f, role: practice, summary: "マス 0〜N のすごろくで、1〜M の目が等確率のサイコロを振り、指定されたマスに止まると振り出しに戻るとき、ゴールまでの振る回数の期待値を求める。", approach: "スタートの期待値を X とおいて各マスを a + bX の形で後ろから求め、X = a + bX を解く"}
      - {id: abc224_g, role: challenge, summary: "1〜N の目のサイコロの出目 S を、A 円払って 1 増やすか B 円払って振り直すかを選びながら T にするとき、費用の期待値の最小値を求める。", approach: "未知数を含む期待値の式を 2 通りに立てて等しくする（optimal-strategy-expectation のやり直しの節）"}
    problems_note: "練習は abc189_f の 1 問（問題の補充で探す）"
    sources: ["07-math-comb §4.5", "07-math-comb §6.2", "02-dp §4.I", "02-dp §5.1"]

  - id: expectation-tail-sum
    chapter: 確率・期待値
    title: 期待値と確率の変換
    aliases: ["E[X] = Σ P(X ≥ k)", tail sum, 期待値と確率の行き来, 最大値の期待値, K 番目の値の期待値]
    type: technique
    level: 黄
    level_evidence: "abc295_e (2157) で必須（黄）。abc319 以降の根拠は発展の下端の abc352_g (2413) だけなので、帯は abc295_e で決めた（検証の「帯の外」の警告はこのため）"
    kind: [確率・期待値]
    prerequisites: [linearity-of-expectation, counting-mindset]
    related: [coupon-collector, continuous-probability, binomial-precompute]
    summary: "非負整数の確率変数 X について E[X] = Σ_{k≥1} P(X ≥ k) が成り立つ。最大値・最小値・K 番目の値の期待値を「X ≥ k となる確率」の和に直して求め、「〜になるまでの回数」の期待値にも使う。"
    signs:
      - {type: phrase, text: "最大値（最小値・K 番目の値）の期待値"}
      - {type: phrase, text: "〜がそろうまでに取り出す回数の期待値"}
      - {type: constraint, text: "値の範囲 M ≤ 5000 程度で、各 k について P(X ≥ k) を数える"}
    acl: []
    frequency: C
    frequency_evidence: "recent 0・前提として 1 ページに届く（直接 1）・古い ABC 2 問"
    sections:
      - {title: "X = Σ [X ≥ k] と線形性", anchor: identity}
      - {title: "最大値・K 番目の値：「すべて k 未満」の余事象", anchor: kth-value}
      - {title: "「〜になるまでの回数」= Σ P(k 回目までに終わらない)", anchor: waiting-time}
      - {title: "連続値の場合（積分）", anchor: continuous, level: 発展}
      - {title: "「ちょうど」と「以上」の行き来", anchor: exactly-vs-at-least}
    merged_keys: []
    visual: {kind: static, priority: 3, text: "P(X ≥ k) の棒グラフを横に積むと面積が期待値になる図"}
    problems:
      - {id: abc295_e, role: example, representative: true, summary: "長さ N の列の 0 の項を 1〜M の一様な値に置き換え、ソートしたときの K 番目の値の期待値を mod 998244353 で求める。", approach: "各 x について P(K 番目 ≥ x) を二項係数で数えて足す"}
      - {id: abc352_g, role: challenge, summary: "色ごとの枚数が決まった靴下を 1 枚ずつ取り出し、同じ色の 2 枚がそろうまでに取り出す回数の期待値を求める。", approach: "「k 回目までそろわない確率」の和に直し、多項式で求める"}
    problems_note: "練習の候補が見つかっていない（問題の補充で探す）"
    sources: ["07-math-comb §4.5"]

