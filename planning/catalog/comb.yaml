# 目次：数え上げ・確率・ゲーム（comb）
# 担当 F。research/07 §7.1 の分け方（数え方の考え方 → 二項係数の系統 → 包除の系統 → 構造 → 確率・期待値 → ゲーム、発展の概要）を出発点にし、
# 設計書 §4.2 で comb が持ち主になる research/02（確率・期待値・ゲームの DP、包除 DP）、research/00 の抜けている項目（置換・閉路のあるゲームなど）、
# research/03 の graph-games、research/04 の tree-counting を取り込んだ。
# 並び順がナビゲーションの順。章の中の小見出しは「# ===== 〜 =====」のコメントで示す（catalog の形式に小見出しの項目がないため。open_issues 参照）。
field: comb
pages:
  # ===== 数え上げの基礎 =====
  - id: counting-basics
    chapter: 数え上げの基礎
    title: 和・積の法則と順列・組合せ
    aliases: [和の法則, 積の法則, 順列, 円順列, 重複順列, 塗り分けの数, nPr]
    type: technique
    level: 基礎
    level_evidence: "typical90_bq（★3）・abc307_e (1240) で使う。積の法則の条件（前の選び方によらず次の選択肢の数が一定）を確かめる問題が緑〜水の入口にある"
    kind: [数え上げ]
    prerequisites: []
    related: [binomial-coefficient, counting-mindset, counting-fix-order, twelvefold-way, mod-arithmetic, mod-pow]
    summary: "排反な場合分けは足し、独立な段階の選択は掛けて数える。積の法則は「前の段階で何を選んでも次の段階の選択肢の数が同じ」ときだけ使えるので、塗り分けなどでは決める順番や一列と円環の違いに注意する。"
    signs:
      - {type: phrase, text: "何通りあるかを 998244353 で割った余りで求める"}
      - {type: phrase, text: "隣り合うもの（距離 2 以内のもの）が異なるように塗り分ける方法の数"}
      - {type: phrase, text: "円形に並べる・円環で最後と最初も隣り合う"}
      - {type: constraint, text: "N ≤ 10^18 でも答えが K(K−1)^(N−1) のような累乗の積になる（繰り返し二乗法で求める）"}
    acl: []
    frequency: A
    sections:
      - "和の法則と積の法則（積の法則が使える条件）"
      - "順列・組合せ・重複順列・円順列"
      - "一列の塗り分けと円環の塗り分け"
      - "決める順番を変えて積の法則を使えるようにする"
      - "写像12相の「玉も箱も区別する」マス（k^n と順列）"
    merged_keys: []
    visual: "図：一列と円環の塗り分けで、最後の要素の選択肢の数が変わる様子を並べる"
    problems:
      - {id: typical90_bq, role: example, summary: "距離 2 以内が異なる色になる一列の塗り方を、積の法則で K(K−1)(K−2)^(N−2) と数える"}
      - {id: abc307_e, role: practice, summary: "円環に並んだ N 人に隣どうしが異なる値を割り当てる方法を、一列との違いに注意して数える"}
    sources: ["07-math-comb §4.2", "07-math-comb §6.3"]

  - id: binomial-coefficient
    chapter: 数え上げの基礎
    title: 二項係数の意味と性質
