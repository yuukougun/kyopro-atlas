    problems:
      - {id: abc436_e, role: example, representative: true, summary: "順列 P を 2 要素の swap を最小回数行ってソートするとき、最初の 1 回として選びうる swap の数を求める。", approach: "同じ巡回の 2 要素の swap なら最小回数を保つので、巡回ごとに C(大きさ, 2) を足す"}
