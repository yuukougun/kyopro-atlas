    level_evidence: "abc154_d (485) は易しい入口。abc334_e (1195)・abc417_f (1414) と水で前面に出る。指示確率変数でペアごとの確率に分ける typical90_bn（★5）・agc049_a (1922)・abc380_g (1995) は青、abc199_f (2065)・abc149_f (2208)・abc215_g (2276) は黄"
