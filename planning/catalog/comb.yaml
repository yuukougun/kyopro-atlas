  - id: game-basics
    chapter: ゲーム
    title: ゲームの基本と勝敗の DP
    aliases: [ゲーム DP, 必勝法, 必勝・必敗, 勝ち局面・負け局面, 二人零和有限確定完全情報ゲーム, 手数の偶奇, 真似戦略, ペアリング戦略]
    type: technique
    level: 水
    level_evidence: "abc354_e (1223, 2024)・abc398_e (1238, 2025)・abc270_d (1300)・abc278_f (1452) と水。abc195_e (1609)・abc380_f (1769, 2024) は青。手数の偶奇で決まる abc398_e は水、真似戦略・ペアリング戦略は arc105_d (1871)・agc014_d (2266) と ARC・AGC の青〜黄で ABC の根拠がないので、game-mirror-strategy を統合して青の節にした（01 指摘6）。基本形の dp_k は diff なし"
    kind: [ゲーム, DP]
