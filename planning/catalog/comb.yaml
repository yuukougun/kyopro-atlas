# 目次：数え上げ・確率・ゲーム（comb）
# 担当 F。第2版（2026-10-21）：design-review §1・§3・§4.1 と §4.2 の F の行に従って直した。
# 第1版は research/07 §7.1 の分け方を出発点に、research/02（確率・期待値・ゲームの DP、包除 DP）、research/00 の抜けている項目、
# research/03 の graph-games、research/04 の tree-counting を取り込んだもの。
# 並び順がナビゲーションの順。章：数え上げの基礎 → 数え方の考え方 → 二項係数の系統 → 包除の系統 → 置換・分割・木の数え上げ → 確率・期待値 → ゲーム。
field: comb
pages:
  - id: counting-basics
    chapter: 数え上げの基礎
    title: 和・積の法則と順列・組合せ
    aliases: [和の法則, 積の法則, 円順列, 重複順列, nPr, 塗り分けの数, rule of product]
    type: technique
    level: 基礎
    level_evidence: "積の法則だけで数える typical90_bq（★3）や、10^N・9^N を積の法則で数えて引く abc178_c (653) と基礎。円環の塗り分けの abc307_e (1240) は水の入口で、一列と円環の違いが要る"
    kind: [数え上げ]
    prerequisites: []
    related: [binomial-coefficient, counting-mindset, counting-fix-order, twelvefold-way, mod-pow, dp-state-design]
    summary: "排反な場合分けは足し、独立な段階の選択は掛けて数える。積の法則は前の段階で何を選んでも次の選択肢の数が同じときだけ使え、円環の塗り分けでは最後の要素の選択肢の数が変わる。"
    signs:
      - {type: phrase, text: "隣り合うもの（距離 2 以内のもの）が異なるように塗り分ける方法の数"}
      - {type: phrase, text: "円形に並べる・円環で最後と最初も隣り合う"}
      - {type: constraint, text: "N ≤ 10^18 で、答えが段階ごとの選択肢の数の積になる"}
      - {type: shape, text: "答えが K(K−1)^(N−1) のような累乗の積の形になる"}
    acl: []
    frequency: A
    frequency_evidence: "recent 0・前提として 40 ページに届く（直接 2）・古い ABC 2 問"
    sections:
      - {title: "和の法則と積の法則（積の法則が使える条件）", anchor: sum-and-product}
      - {title: "順列・組合せ・重複順列・円順列", anchor: permutations}
      - {title: "一列の塗り分けと円環の塗り分け", anchor: coloring}
      - {title: "決める順番を変えて積の法則を使えるようにする", anchor: order-of-choice}
      - {title: "写像 12 相の「玉も箱も区別する」マス（k^n と順列）", anchor: twelvefold-cells}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "一列と円環の塗り分けで、最後の要素の選択肢の数が変わる様子を並べる図"}
    problems:
      - {id: typical90_bq, role: example, representative: true, summary: "一列に並んだ N 個のブロックを K 色で塗り、距離 2 以内のブロックがすべて異なる色になる塗り方の数を求める。", approach: "先頭から決めると選択肢は K, K−1, K−2, K−2, … と一定になり、積の法則で K(K−1)(K−2)^(N−2)。N が大きいので累乗は繰り返し二乗法"}
      - {id: abc307_e, role: practice, summary: "円環に並んだ N 人に 0〜M−1 の整数を、隣どうしが異なるように割り当てる方法の数を求める。", approach: "一列と違い最後の人は最初の人とも隣り合う。最初の人と同じ値かどうかを状態にした DP か、一列の数から円環の分を補正する式"}
    problems_note: "練習は abc307_e の 1 問。積の法則だけで解く ABC の易しい問題は調査で拾っていないので、問題の補充で足す"
    sources: ["07-math-comb §4.2", "07-math-comb §6.3"]

  - id: binomial-coefficient
    chapter: 数え上げの基礎
    title: 二項係数の意味と性質
    aliases: [二項係数, nCr, パスカルの三角形, 辞書順 K 番目の組合せ, 組合せの順位, binomial coefficient]
    type: technique
    level: 基礎
    level_evidence: "arc095_b (867)・abc202_d (966)・abc145_d (1009) と基礎で必須。辞書順 K 番目の組合せは abc202_d (966)"
    kind: [数え上げ]
    prerequisites: [counting-basics]
    related: [binomial-precompute, stars-and-bars, lattice-paths, binomial-identities, dp-reconstruction, lexicographic-greedy]
    summary: "n 個から k 個を選ぶ数 C(n,k) を、選び方・1 が k 個の 0/1 列・格子路の 3 つの意味で使い分ける。パスカルの漸化式と対称性、範囲外を 0 とする約束を使い、辞書順 K 番目の組合せも作れる。"
    signs:
      - {type: phrase, text: "N 個から K 個を選ぶ方法の数"}
      - {type: phrase, text: "0 と 1 の列で 1 がちょうど K 個のもの"}
      - {type: phrase, text: "辞書順で K 番目の並べ方・与えられた並べ方が何番目か"}
      - {type: constraint, text: "N ≤ 60 程度で、mod を取らない正確な値を求める"}
    acl: []
    frequency: A
    frequency_evidence: "recent 1（abc476_g）・前提として 28 ページに届く（直接 5）・古い ABC 3 問"
    sections:
      - {title: "3 つの意味（選ぶ・0/1 列・格子路）", anchor: meanings}
      - {title: "パスカルの漸化式と対称性", anchor: pascal}
      - {title: "k < 0・k > n を 0 とする約束", anchor: out-of-range}
      - {title: "mod を取らないときの大きさとオーバーフロー", anchor: overflow}
      - {title: "辞書順 K 番目の組合せと順位", anchor: kth}
    merged_keys: [kth-combination]
    visual: {kind: static, priority: 2, text: "パスカルの三角形で各値が上の 2 つの和になる様子と、格子路の数としての読み替えを並べる図"}
    problems:
      - {id: arc095_b, role: example, representative: true, summary: "N 個の異なる整数から 2 つを選び、大きい方を n、小さい方を r として C(n, r) が最大になる組を求める。", approach: "n は最大の値、r は n/2 に最も近い値を選ぶ（C(n, r) は r が n/2 に近いほど大きい）"}
      - {id: abc202_d, role: practice, summary: "a を A 個、b を B 個並べてできる文字列のうち、辞書順で K 番目のものを求める。", approach: "先頭を a にしたときの残りの並べ方の数 C(A+B−1, A−1) と K を比べて、先頭から 1 文字ずつ決める"}
      - {id: abc057_d, role: practice, summary: "N 個の品物から A 個以上 B 個以下を選んで価値の平均を最大にし、その最大値と、最大を実現する選び方の数を求める。", approach: "大きい順に A 個取ったときが最大。境目の値と同じ値の個数から、二項係数で選び方を数える"}
    sources: ["07-math-comb §4.2", "07-math-comb §6.2"]

  - id: binomial-precompute
    chapter: 数え上げの基礎
    title: 二項係数の前計算
    aliases: [nCr mod p, 階乗と逆階乗の表, fact と ifact, 逆階乗, Combination テーブル, 任意 mod の二項係数, Lucas の定理, nCr mod 2, "Lucas's theorem"]
    type: technique
    level: 基礎
    level_evidence: "abc145_d (1009)・abc132_d (1167) で必要になり、abc167_e (1442)・abc156_e (1514) と水でも頻出。n が巨大な変種の abc156_d (1014) は基礎。小さい素数の法で n ≥ p になる Lucas の定理は arc117_c (1768)・agc043_b (1945) と青で、ABC での出題は見つかっていないので節にした（lucas-theorem を統合）。法が素数とは限らない abc281_g (2304) はパスカルの三角形で表を作るだけで、難しさは数え上げの本体（counting-labeled-graphs）にある"
    kind: [数え上げ, 整数論]
    prerequisites: [binomial-coefficient, mod-inverse]
    related: [modint, mod-pow, multinomial-coefficient, lattice-paths, bit-operations, counting-labeled-graphs]
    summary: "素数 p を法として階乗と逆階乗を前計算し、C(n,k) を O(1) で求める。n が巨大なら O(k) の積、p が小さく n ≥ p なら Lucas の定理、法が素数でなければパスカルの三角形を使う。"
    signs:
      - {type: constraint, text: "N ≤ 2×10^5 程度で C(n,k) を何度も求める"}
      - {type: constraint, text: "n ≤ 10^9 で k ≤ 10^6 程度"}
      - {type: phrase, text: "法 M が入力で与えられ、素数とは限らない"}
      - {type: phrase, text: "隣り合う 2 つから新しい値を作る操作を繰り返し、最後に残る値を求める（三角形・ピラミッド）"}
      - {type: phrase, text: "答えを mod 2・mod 3 など小さい素数で求める"}
    acl: [modint]
    frequency: A
    frequency_evidence: "recent 6（abc453_e・abc458_e・abc459_e・abc463_f・abc463_g・abc471_e）・前提として 11 ページに届く（直接 4）・古い ABC 6 問"
    sections:
      - {title: "fact を前から、ifact を後ろから作る理由", anchor: fact-ifact}
      - {title: "表の大きさ（H+W・N+K・2N など）と範囲外の 0", anchor: table-size}
      - {title: "n が巨大で k が小さいときは O(k) で求める", anchor: large-n}
      - {title: "法が素数でないとき：n が小さければパスカルの三角形で作る", anchor: composite-mod}
      - {title: "法が小さい素数で n ≥ p になるとき：Lucas の定理", anchor: lucas, level: 青}
      - {title: "p = 2 では (n & k) == k、ピラミッドの係数を二項係数と見抜く", anchor: parity-pyramid, level: 青}
      - {title: "mod を取らない正確な値（掛けてから割る・__int128）", anchor: exact}
      - {title: "ACL では modint998244353 の inv()・pow() で自作する", anchor: acl}
    merged_keys: [binomial-variants, lucas-theorem]
    visual: {kind: static, priority: 2, text: "fact を前から、ifact を後ろから埋める 2 本の矢印の図。Lucas の定理の節には、パスカルの三角形を mod 2 で塗った図（シェルピンスキーの三角形）を添える"}
    problems:
      - {id: tessoku_book_ad, role: example, representative: true, summary: "n と r が与えられ、nCr を 10^9+7 で割った余りを求める。", approach: "階乗と、フェルマーの小定理による逆元で計算する"}
      - {id: abc156_d, role: practice, summary: "n 種類の花から 1 本以上を選んで作る花束のうち、本数が a でも b でもないものの数を求める（n は最大 10^9）。", approach: "全体 2^n − 1 から nCa と nCb を引く。n が巨大なので nCa は分子の a 項の積と a! の逆元で O(a)"}
      - {id: abc132_d, role: practice, summary: "N 個の玉のうち K 個が青のとき、各 i について、連続する青玉をまとめて回収する操作がちょうど i 回で済む並べ方の数を求める。", approach: "青玉を i 個のかたまりに分ける C(K−1, i−1) と、赤玉の間に置く C(N−K+1, i) の積"}
      - {id: arc117_c, role: practice, summary: "3 色のブロックの列から、隣り合う 2 つで 1 つ下の段の色を決める操作を繰り返し、最後に残る 1 つの色を求める。", approach: "最後の色は各色に C(N−1, i) を掛けた和の mod 3 で決まり、n ≥ 3 になるので Lucas の定理で求める"}
      - {id: agc043_b, role: practice, summary: "1・2・3 からなる列で、隣り合う 2 つの差の絶対値を取る操作を繰り返し、最後に残る値を求める。", approach: "最後の値の偶奇は C(N−1, i) mod 2 を係数にした和で決まり、C(n, k) が奇数 ⇔ (n & k) == k。あとは 1 を含むかで場合分けする"}
      - {id: abc281_g, role: challenge, summary: "頂点 1 から頂点 N への距離が他のどの頂点への距離よりも真に大きい、N 頂点の連結な単純無向グラフの数を、入力の M（素数とは限らない）で割った余りで求める。", approach: "法が素数とは限らないので二項係数はパスカルの三角形で作る。距離の層ごとに頂点を配り、辺の張り方を数える（counting-labeled-graphs の例題）"}
    sources: ["07-math-comb §4.2（binomial-precompute・binomial-variants・lucas-theorem）", "07-math-comb §6.2", "07-math-comb §7.4", "06-math-nt §4.2", "06-math-nt §7.4"]

  - id: stars-and-bars
    chapter: 数え上げの基礎
    title: 重複組合せ
    aliases: [玉と仕切り, "H(n,k)", 非負整数解の個数, 隣り合わない選び方, stars and bars]
    type: technique
    level: 基礎
    level_evidence: "abc185_c (374)・abc178_d (875)・abc132_d (1167) と基礎で頻出。場合分けしてから配る abc156_e (1514) は水、素因数ごとに配る abc110_d (1695)・多重ループの abc021_d (1704 参考値) は青（節）"
    kind: [数え上げ]
    prerequisites: [binomial-coefficient]
    related: [counting-bijection, twelvefold-way, multinomial-coefficient, inclusion-exclusion, generating-function-counting, prime-exponent-vector]
    summary: "x_1 + … + x_k = n の非負整数解は C(n+k−1, k−1) 個、正の整数解は C(n−1, k−1) 個で、玉と仕切りの並べ方に 1 対 1 に対応する。広義単調な列や間隔を空けて選ぶ方法も、同じ形に直して数える。"
    signs:
      - {type: phrase, text: "和が N になる非負（正）整数の組の個数"}
      - {type: phrase, text: "広義単調増加な列の個数"}
      - {type: phrase, text: "N 個から隣り合わない（間隔 d 以上の）K 個を選ぶ方法の数"}
      - {type: phrase, text: "区別のない玉を区別のある箱へ配る方法の数"}
    acl: []
    frequency: B
    frequency_evidence: "recent 1（abc456_g）・前提として 3 ページに届く（直接 3）・古い ABC 6 問"
    sections:
      - {title: "玉と仕切りの対応（非負解と正の解）", anchor: stars-bars}
      - {title: "「以下」は余りの変数を 1 つ足して等式にする", anchor: at-most}
      - {title: "広義単調な列との対応", anchor: monotone}
      - {title: "隣り合わない選び方・間隔 d 以上の選び方", anchor: gaps}
      - {title: "場合分けしてから配る・素因数ごとに配る", anchor: applications, level: 水}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "玉と仕切りの列を変数の値の組に対応させる図（仕切りの位置を変えると値が変わる様子を 2〜3 例並べる）"}
    problems:
      - {id: abc185_c, role: example, representative: true, summary: "長さ L の棒を、長さが正の整数の 12 本に切り分ける方法の数を求める。", approach: "L−1 か所の切れ目から 11 か所を選ぶ C(L−1, 11)"}
      - {id: abc178_d, role: practice, summary: "各項が 3 以上の整数で、総和が S になる数列の個数を求める。", approach: "各項から 2 を引いて正の整数解の数に直し、項数ごとに足す（DP でもよい）"}
      - {id: abc156_e, role: practice, summary: "n 部屋に 1 人ずついる状態から、1 人が別の部屋へ移る移動をちょうど k 回行った後の、各部屋の人数の組としてありうるものの数を求める。", approach: "空き部屋の数 m ごとに、空き部屋の選び方と残りの部屋への人数の配り方（重複組合せ）を掛けて足す"}
      - {id: abc110_d, role: practice, summary: "積が M になる長さ N の正の整数列の個数を求める。", approach: "M を素因数分解し、素因数ごとに指数を N 個へ配る重複組合せの積"}
      - {id: abc021_d, role: practice, summary: "1 ≤ a_1 ≤ a_2 ≤ … ≤ a_k ≤ n を満たす整数列の個数を求める。", approach: "広義単調な列は重複組合せで C(n+k−1, k)"}
      - {id: typical90_o, role: practice, summary: "1〜N からいくつかを選び、選んだどの 2 つの差も k 以上になる選び方の数を、k = 1, …, N のそれぞれについて求める。", approach: "選ぶ個数 a ごとに間隔を詰めて二項係数で数える。a ≤ N/k なので全体で調和級数の計算量"}
    sources: ["07-math-comb §4.2", "07-math-comb §6.3"]

  - id: lattice-paths
    chapter: 数え上げの基礎
    title: 格子路の数え上げ
    aliases: [格子路, グリッドの最短経路の数, 障害物のある経路, lattice path]
    type: technique
    level: 基礎
    level_evidence: "基本形の abc145_d (1009) は基礎。禁止領域を境界で分ける arc058_b (1905)、経路数の総和の abc154_f (1775)、移動を軸ごとに分ける abc011_4 (1843 参考値) は青で節に置く。3 次元の abc240_g (2462) は発展。水の帯の根拠が見つからなかったので（03 指摘13）、research/07 の案（基本は基礎、障害物・総和は節）どおり基礎のページにした（第1版は水）"
    kind: [数え上げ]
    prerequisites: [binomial-precompute]
    related: [counting-bijection, binomial-identities, reflection-principle, inclusion-exclusion-dp, dp-grid, lgv-lemma, manhattan-chebyshev]
    summary: "(0,0) から (a,b) への右・上の最短経路は C(a+b, a) 通りで、R と U の列に 1 対 1 に対応する。移動の種類が違えば回数の組に直し、禁止領域は境界を越える点で分けて数える。"
    signs:
      - {type: phrase, text: "グリッドの左上から右下への最短経路の数"}
      - {type: constraint, text: "H, W ≤ 10^5 のグリッドで、左上から右下への経路の数を求める"}
      - {type: phrase, text: "通れない長方形の領域がある経路の数"}
      - {type: phrase, text: "2 種類の移動を組み合わせて目的地へ行く方法の数"}
    acl: []
    frequency: A
    frequency_evidence: "recent 0・前提として 6 ページに届く（直接 5）・古い ABC 4 問"
    sections:
      - {title: "基本：C(a+b, a) と R・U の列", anchor: basic}
      - {title: "移動の種類を回数の組に直す", anchor: move-counts}
      - {title: "禁止領域を避ける：境界を越える点で分類する", anchor: forbidden-region, level: 青}
      - {title: "経路数の総和と、二項係数の和を経路数として一括で求める", anchor: sum-of-paths, level: 青}
      - {title: "移動を軸ごとの回数に分けて独立にする（45 度回転）", anchor: independent-axes, level: 青}
    merged_keys: []
    visual: {kind: dynamic, priority: 3, text: "格子の各点に経路数を左下から順に埋めるステップ送り。禁止領域があるときは境界を越える点で経路を色分けする（静的な図で代えてよい）"}
    problems:
      - {id: abc145_d, role: example, representative: true, summary: "原点から (+1, +2) か (+2, +1) の移動を繰り返して、点 (X, Y) に着く方法の数を求める。", approach: "2 種類の移動の回数を連立方程式で決め、並べ方を二項係数で数える"}
      - {id: abc154_f, role: practice, summary: "r_1 ≤ i ≤ r_2、c_1 ≤ j ≤ c_2 のすべての (i, j) について、原点から (i, j) への右・上の最短経路の数を求め、その総和を求める。", approach: "縦の和の公式（hockey stick）で長方形領域の和を閉じた式にする（binomial-identities の例題）"}
      - {id: abc011_4, role: practice, summary: "1 回に上下左右のどれかへ距離 D だけ等確率で動くことを N 回繰り返したとき、点 (X, Y) にいる確率を求める。", approach: "横に動く回数で分け、各軸の 1 次元の移動の数を二項係数で求めて掛ける"}
      - {id: arc058_b, role: practice, summary: "H×W のグリッドの左上から右下へ右と下だけで進むとき、左下の A×B の領域に入らない経路の数を求める。", approach: "禁止領域の境界を越える列で分類し、二項係数の積を足す"}
      - {id: agc001_e, role: challenge, summary: "N 組の (A_i, B_i) について、すべての i < j の組の C(A_i+B_i+A_j+B_j, A_i+A_j) の和を求める。", approach: "二項係数を格子路の数とみなし、始点を (−A_i, −B_i)、終点を (A_j, B_j) にしたグリッドの DP で一括に数える"}
      - {id: abc240_g, role: challenge, summary: "3 次元の格子で、1 回に 6 方向のどれかへ 1 だけ動くことを N 回繰り返して点 (X, Y, Z) に着く方法の数を求める。", approach: "z 軸方向に動く回数で分け、平面の部分は 45 度回転で独立な 2 本の 1 次元の移動にする"}
    sources: ["07-math-comb §4.2", "07-math-comb §4.1", "07-math-comb §4.5（random-walk）"]

