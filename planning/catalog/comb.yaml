      - {id: abc156_e, role: example, summary: "n 部屋に 1 人ずついる状態から、1 人が別の部屋へ移る移動をちょうど k 回行った後の、各部屋の人数の組としてありうるものの数を求める。", approach: "ありうる組を「空き部屋が k 個以下」と言い換え、空き部屋の数で場合分けして重複組合せで数えて足す"}
