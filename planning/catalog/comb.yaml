      - {id: abc277_g, role: challenge, summary: "グラフ上をランダムに歩き、レベルが 1 上がる頂点と、レベルの二乗だけお金を得る頂点があるとき、K 歩で得るお金の期待値を求める。", approach: "確率・レベルの期待値・レベルの二乗の期待値の 3 つを一緒に遷移させる"}
