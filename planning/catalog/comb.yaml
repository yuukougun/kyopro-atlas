  - id: probability-dp
    chapter: 確率・期待値
    title: 確率 DP
    aliases: [前向きに確率を配る, 到達確率, 分布を求める DP, ランダムウォーク, random walk]
    type: technique
    level: 水
    level_evidence: "abc275_e (1264)・abc323_e (1279, 2023)・abc298_e (1300) と水。ランダムウォークの abc011_4 (1843 参考値) は青（節）、行列累乗と組む abc271_g (2323) は黄（節）"
    kind: [確率・期待値, DP]
    prerequisites: [probability-basics, dp-basics]
    related: [expected-value-dp, rational-mod, probability-symmetry, dp-state-design, matrix-power#dp-transition, lattice-paths#independent-axes]
    summary: "dp[t][s] = 時刻 t に状態 s にいる確率を、初期状態の 1 から前向きに配って求める。確率の和が 1 に保たれることが検算になり、時刻が決まっている問題や分布そのものが要る問題に向く。"
    signs:
      - {type: phrase, text: "K 回の操作の後に〜である確率"}
      - {type: phrase, text: "どちらが先にゴールするかの確率"}
      - {type: phrase, text: "時刻 T に〜している確率"}
      - {type: phrase, text: "N 回ランダムに上下左右へ動いた後の位置"}
    acl: [modint]
    frequency: B
    frequency_evidence: "recent 1（abc463_g）・前提として届くページなし・古い ABC 5 問"
    sections:
      - {title: "状態に到達する確率を前から配る（和が 1 の検算）", anchor: forward}
      - {title: "状態の設計：まとめる・上限で打ち切る・到達する値だけ持つ", anchor: state-design}
      - {title: "時刻ごとに配る", anchor: by-time}
      - {title: "期待値 DP との使い分け（前向きと後ろ向き）", anchor: vs-expected-value-dp}
      - {title: "ランダムウォークと二項係数", anchor: random-walk, level: 青}
      - {title: "同じ遷移を多数回行うときは行列累乗へ", anchor: matrix-power, level: 黄}
    merged_keys: [random-walk]
    visual: {kind: static, priority: 2, text: "状態の列に確率の量を配り、各ステップで分かれて流れる様子を 3 段階で並べる図"}
    problems:
      - {id: dp_i, role: example, summary: "N 枚（N は奇数）のコインを投げ、i 枚目は確率 p_i で表が出るとき、表の枚数が裏の枚数より多くなる確率を求める。", approach: "表の枚数ごとの確率を前から配る"}
      - {id: abc275_e, role: example, representative: true, summary: "マス 0〜N のすごろくで、1〜M の目が等確率のサイコロを最大 K 回振り、N を超えた分は戻るとき、マス N に止まる確率を mod 998244353 で求める。", approach: "マスごとの確率を K 回まで前から配る"}
      - {id: abc323_e, role: practice, summary: "N 曲の中から一様に選んだ曲を続けて流し続けるとき、時刻 X+0.5 に曲 1 が流れている確率を mod 998244353 で求める。", approach: "各時刻に曲が始まる確率を前から配る"}
      - {id: abc298_e, role: practice, summary: "2 人がそれぞれのサイコロですごろくを交互に進めるとき、先手が先にゴールに着く確率を mod 998244353 で求める。", approach: "両者の位置と手番を状態に確率を配る（または後ろから求める）"}
      - {id: tdpc_dice, role: practice, summary: "サイコロを N 回振ったときの出目の積が D の倍数になる確率を求める。", approach: "2・3・5 の指数を D に必要な数で打ち切った状態で確率を配る"}
      - {id: abc011_4, role: practice, summary: "1 回に上下左右のどれかへ距離 D だけ等確率で動くことを N 回繰り返したとき、点 (X, Y) にいる確率を求める。", approach: "横に動く回数で分け、各軸の到達確率を二項係数で求めて掛ける"}
      - {id: abc271_g, role: challenge, summary: "（執筆時に確かめる）", approach: "時間帯ごとに確率の決まった遷移を行列にし、行列累乗で多数回の遷移をまとめて計算する"}
      - {id: abc463_g, role: challenge, summary: "N 回の ±1 のランダムな移動のあとの位置と、目標との距離の期待値を求める（クエリの形は執筆時に確かめる）。", approach: "位置の分布を二項係数で表し、距離の期待値を二項係数の和として求める。クエリは先読みする"}
    sources: ["07-math-comb §4.5", "02-dp §4.I", "02-dp §5.1", "02-dp §5.2", "02-dp §2.4"]

  - id: expected-value-dp
    chapter: 確率・期待値
    title: 期待値 DP
    aliases: [後ろから決める期待値, 残りの期待値, 全期待値の公式, 自己ループ, 振り直し, 移項して解く, 選択は max・偶然は平均]
    type: technique
    level: 水
    level_evidence: "abc280_e (1251)・abc184_d (1276)・abc300_e (1354)・abc350_e (1385, 2024) と水。選択がある基本形の abc266_e (1227)・abc350_e は optimal-strategy-expectation から移した節（01 指摘7）。自己ループと累積和の abc263_e (1659)・abc382_e (1671, 2024)・abc314_e (1722) は青（節）、abc144_f (2189) は黄"
    kind: [確率・期待値, DP]
    prerequisites: [linearity-of-expectation, dp-order]
    related: [probability-dp, rational-mod, optimal-strategy-expectation, expectation-linear-equations, coupon-collector, dp-prefix-sum, memoized-recursion]
    summary: "終わるまでの量の期待値 E[s] を、最初の一手で場合分けした E[s] = c(s) + Σ P(s→t) E[t] で、終状態の E = 0 から後ろ向きに埋める。自己ループは移項して消し、選択がある状態では max を取る。"
    signs:
      - {type: phrase, text: "〜になるまでの操作回数の期待値"}
      - {type: phrase, text: "終わるまでにかかる費用の期待値"}
      - {type: phrase, text: "出た目が〜なら振り直し・確率 p で何も起きない"}
      - {type: constraint, text: "状態数 N ≤ 10^5 程度で、各状態の遷移が少数（または区間）"}
      - {type: shape, text: "E[s] が、s から 1 手で移る状態の E の平均に定数を足した式になる"}
    acl: [modint]
    frequency: B
    frequency_evidence: "recent 0・前提として 2 ページに届く（直接 2）・古い ABC 9 問"
    sections:
      - {title: "全期待値の公式（最初の一手で場合分け）", anchor: total-expectation}
      - {title: "なぜ後ろ向きか（終状態が 0 の境界条件）", anchor: why-backward}
      - {title: "状態の設計：区別しない・個数の組にする", anchor: state-design}
      - {title: "計算順序とメモ化再帰", anchor: order}
      - {title: "自己ループの移項 E = (c + Σ …)/(1 − p)", anchor: self-loop}
      - {title: "選択がある期待値：選択は max、偶然は平均", anchor: choice}
      - {title: "遷移を累積和でまとめる", anchor: prefix-sum, level: 青}
      - {title: "前向きの確率 DP との使い分け", anchor: vs-probability-dp}
    merged_keys: [conditional-expectation, self-loop-expectation]
    visual: {kind: dynamic, priority: 1, text: "状態の DAG に、終状態から E を埋めていくステップ送り。自己ループの矢印と移項の式を並べる（ゲームの勝敗 DP の図と同じ部品）"}
    problems:
      - {id: dp_j, role: example, summary: "寿司が 1〜3 個乗った N 枚の皿から毎回一様に 1 枚を選び、寿司があれば 1 個食べるとき、すべて食べ終わるまでの操作回数の期待値を求める。", approach: "寿司が 1・2・3 個の皿の数を状態にし、自己ループを移項して後ろから求める"}
      - {id: abc280_e, role: example, representative: true, summary: "HP が N のモンスターに、確率 P% で 2、それ以外は 1 のダメージを与える攻撃を繰り返すとき、HP が 0 以下になるまでの攻撃回数の期待値を mod 998244353 で求める。", approach: "HP ごとの残りの期待値を後ろから求め、P/100 を mod の値にして入れる"}
      - {id: abc184_d, role: example, summary: "金・銀・銅の硬貨が入った袋から 1 枚取り出し、同じ種類を 2 枚戻す操作を、いずれかの硬貨が 100 枚になるまで繰り返すときの操作回数の期待値を求める。", approach: "3 つの枚数を状態にして後ろから求める（メモ化再帰）"}
      - {id: abc266_e, role: practice, summary: "6 面のサイコロを最大 N 回振れ、振るたびにやめてその目を得点にできるとき、得点の期待値の最大値を求める。", approach: "残り k 回のときの期待値 E_k を、出目と E_{k−1} の大きい方の平均で後ろから求める（選択は max、偶然は平均）"}
      - {id: abc300_e, role: practice, summary: "1 から始めて 1〜6 の目が等確率のサイコロの出目を掛けていくとき、ちょうど N になる確率を mod 998244353 で求める。", approach: "1 の目は状態を変えないので移項し、残り 5 つの目の平均で求める（メモ化再帰）"}
      - {id: abc350_e, role: practice, summary: "整数 N を、X 円払って ⌊N/A⌋ にするか、Y 円払ってサイコロの出目 b で ⌊N/b⌋ にするかを選びながら 0 にするとき、費用の期待値の最小値を求める。", approach: "1 の目で N が変わらない自己ループを移項し、2 つの操作の期待値の小さい方をメモ化再帰で取る"}
      - {id: abc263_e, role: practice, summary: "マス 1〜N のすごろくで、マス i では 0〜A_i の目が等確率のサイコロを振ってその分進むとき、マス N に着くまでの振る回数の期待値を求める。", approach: "0 の目の自己ループを移項し、後ろの期待値の区間の和を累積和で求める"}
      - {id: abc382_e, role: practice, summary: "カードのパックを開け続けて、レアカードが X 枚集まるまでに開けるパックの数の期待値を求める。", approach: "1 パックのレアの枚数の分布を確率 DP で求め、必要な枚数ごとの期待値を後ろから求める"}
      - {id: abc314_e, role: practice, summary: "N 個のルーレットからどれを回すかを選びながら M 点以上を得るまで繰り返すとき、払う費用の期待値の最小値を求める。", approach: "0 点の目の自己ループを移項し、各状態で費用の期待値が最小のルーレットを選ぶ"}
      - {id: abc144_f, role: challenge, summary: "部屋 1 から部屋 N へ向かう DAG で、各部屋から出る通路を一様に選んで進むとき、事前に通路を 1 本だけ塞いで、通る通路の数の期待値を最小にする。", approach: "ゴールまでの期待値を後ろから求め、各部屋で塞ぐ通路を全部試す"}
      - {id: tdpc_ball, role: challenge, summary: "（執筆時に確かめる）", approach: "残りの位置の集合を状態にし、自己ループを移項して倒し尽くすまでの回数の期待値を求める"}
    sources: ["07-math-comb §4.5（expected-value-dp・self-loop-expectation・optimal-strategy-expectation の基本形）", "07-math-comb §6.2", "02-dp §4.I", "02-dp §5.1", "02-dp §5.2", "02-dp §7.5"]

