      - {id: abc242_f, role: challenge, summary: "N×M の盤面に黒い駒 B 個と白い駒 W 個を置くとき、同じ行・同じ列に白と黒が並ばない置き方の数を求める。", approach: "色ごとに使う行と列を決め、その行と列をすべて使う置き方を、使わない行・列の集合で包除して数える（全射の数と同じ形）"}
