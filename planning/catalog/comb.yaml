      - {id: abc393_e, role: practice, summary: "長さ N の列 A の各 i について、A_i を含む K 個の要素を選んだときの gcd の最大値を求める。", approach: "各 d について d の倍数の個数を倍数を回して集め（倍数のゼータ変換を素朴に行う）、A_i の約数で個数が K 以上の最大のものを求める（例題は math/harmonic-sum）"}
      - {id: agc038_c, role: challenge, summary: "長さ N の列 A について、全ペア i < j の lcm(A_i, A_j) の総和を求める。", approach: "gcd ごとの和に直し、倍数のゼータ変換と約数のメビウス変換で求める"}
