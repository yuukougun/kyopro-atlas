    kind: [数え上げ, DP]
    prerequisites: [inclusion-exclusion, dp-basics, lattice-paths]
    related: [dp-grid, counting-dedup, tree-dp, insertion-dp]
    summary: "包除の和 Σ(−1)^|S| N(S) の項が多すぎて列挙できないとき、S を作る過程を DP にし、符号を DP の値に掛けて運ぶ。障害物を並べて最初に踏む障害物で分類し全体から引く形も同じ仲間である。"
    signs:
      - {type: constraint, text: "H, W ≤ 10^5 のグリッドに障害物が N ≤ 3000 個"}
      - {type: phrase, text: "禁止条件が列や木に沿って並ぶ数え上げ"}
      - {type: phrase, text: "|P_i − i| など、位置と値の差に制約がある順列の個数"}
      - {type: phrase, text: "隣り合う値が異なる数列の個数"}
    acl: []
    frequency: C
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 2 問"
    sections:
      - {title: "包除の和を「S を作る過程」の重みの和と見る", anchor: weighted-sum}
      - {title: "最初に踏む障害物で分類する（ソート順と終点の扱い）", anchor: first-obstacle}
      - {title: "違反の個数を状態に持ち、最後に符号と残りの自由度を掛ける", anchor: count-violations}
      - {title: "「等しい」を区間にまとめる符号付き DP", anchor: equal-blocks}
      - {title: "符号付きの木 DP", anchor: tree, level: 発展}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "障害物を並べて、最初に踏む障害物で経路を色分けする図"}
    problems:
      - {id: dp_y, role: example, summary: "H×W のグリッドに N 個の壁のマスがあるとき、左上から右下へ右と下だけで進み、壁を通らない経路の数を求める。", approach: "壁をソートし、他の壁を通らずに各壁に着く経路数を全体から引いて求める"}
      - {id: abc309_g, role: example, representative: true, summary: "すべての i で |P_i − i| ≥ X となる 1〜N の順列 P の数を求める。", approach: "違反する位置を選ぶ包除で、近い位置の値の使用状況を bit で持つ DP にし、違反の個数ごとに符号と残りの並べ方を掛ける"}
      - {id: arc115_e, role: practice, summary: "各項が 1 以上 A_i 以下で、隣り合う項が異なる長さ N の数列の数を求める。", approach: "「等しい」と指定した隣接の個数に符号を付けた DP で包除する"}
      - {id: abc214_g, role: challenge, summary: "2 つの順列 p, q が与えられ、すべての i で r_i ≠ p_i かつ r_i ≠ q_i となる順列 r の数を求める。", approach: "違反の個数ごとの数を DP で数えてから包除する"}
      - {id: arc101_c, role: challenge, summary: "N 頂点（N は偶数）の木の頂点を 2 つずつ組にして結ぶとき、すべての辺がどれかの組の間のパスに含まれる組み方の数を求める。", approach: "使われない辺の集合を切ると決めて符号を付けた木 DP で包除する"}
    problems_note: "練習は arc115_e の 1 問。ABC の黄の候補が少ない（問題の補充で探す）"
    sources: ["07-math-comb §4.3", "02-dp §4.J", "02-dp §5.1", "02-dp §5.2"]

  - id: divisor-inclusion-exclusion
    chapter: 包除の系統
    title: 約数包除
    aliases: [約数系包除, gcd がちょうど g, 倍数から引く, 互いに素な組の数, gcd の総和]
    type: technique
    level: 青
    level_evidence: "abc361_f (1606, 2024)・abc304_f (1619)・abc162_e (1662)・abc206_e (1745) と青にまとまる"
    kind: [数え上げ, 整数論]
    prerequisites: [counting-mindset, gcd-lcm, harmonic-sum]
    related: [mobius-function, zeta-mobius-divisor, euler-phi, burnside-lemma, inclusion-exclusion, divisors-and-multiples]
    summary: "gcd がちょうど g のものの個数 f(g) を、すべて g の倍数のものの個数 F(g) から大きい g の順に f(g) = F(g) − f(2g) − f(3g) − … で求める。全体で O(N log N) になる。"
    signs:
      - {type: phrase, text: "gcd の総和を求める"}
      - {type: phrase, text: "gcd が 1 になる（互いに素な）組の個数"}
      - {type: phrase, text: "最小周期が d の列（文字列）の個数"}
      - {type: constraint, text: "値の上限 ≤ 10^6 程度で、すべての g について数える"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として 2 ページに届く（直接 2）・古い ABC 4 問"
    sections:
      - {title: "「g の倍数」は gcd = g, 2g, 3g, … に排反に分かれる", anchor: partition}
      - {title: "大きい g から引く理由と計算量 O(N log N)", anchor: order}
      - {title: "gcd の総和・互いに素な組", anchor: gcd-sum}
      - {title: "周期の数え上げ（約数の周期で重複した分を引く）", anchor: period}
      - {title: "完全累乗などの重複を指数ごとに除く", anchor: perfect-powers}
      - {title: "メビウス関数での書き方との対応", anchor: vs-mobius}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "数直線上に g の倍数を並べ、F(g) から倍数側の f を引いていく様子の図"}
    problems:
      - {id: abc162_e, role: example, representative: true, summary: "1 以上 K 以下の整数からなる長さ N の列すべてについて gcd を求め、その総和を求める。", approach: "gcd がちょうど g の列の個数を、g の倍数だけの列の個数 (K/g)^N から大きい g の順に引いて求める"}
      - {id: abc206_e, role: example, summary: "L 以上 R 以下の整数の組 (x, y) のうち、gcd(x, y) が 1 でなく、x と y のどちらも gcd(x, y) と等しくないものの数を求める。", approach: "gcd ごとの組の数を倍数から引いて求め、gcd 自身と等しくなる組を除く"}
      - {id: abc361_f, role: practice, summary: "1 以上 N 以下の整数のうち、a^b（a は正の整数、b ≥ 2）と表せるものの個数を求める。", approach: "指数 b ごとの個数を数え、同じ数を重複して数えた分を指数の倍数関係で除く"}
      - {id: abc304_f, role: practice, summary: "（執筆時に確かめる）", approach: "周期 d の文字列の数を求め、d の約数の周期で重複して数えた分を引く"}
    sources: ["07-math-comb §4.3", "06-math-nt §4.3", "06-math-nt §7.4"]

