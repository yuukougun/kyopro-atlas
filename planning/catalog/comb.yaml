      - {id: abc297_f, role: practice, summary: "H×W のグリッドから K マスを一様に選んだとき、選んだマスをすべて含む最小の長方形の面積の期待値を求める。", approach: "長方形ごとに、4 辺すべてに選んだマスがある配置の数を包除で数え、総和を総数で割る"}
