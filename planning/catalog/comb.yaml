      - "場合分けしてから配る応用（水）"
    merged_keys: []
    visual: "図：玉と仕切りの列を変数の値の組に対応させる（仕切りの位置を変えると値が変わる様子を2〜3例並べる）"
    problems:
      - {id: abc185_c, role: example, summary: "長さ L の棒を正の長さの 12 本に切る方法を、11 か所の切れ目の選び方 C(L−1, 11) で数える"}
      - {id: abc178_d, role: practice, summary: "3 以上の整数の和で S を表す数列の数を、各項から 2 を引いて正の整数解の数に直す"}
      - {id: abc156_e, role: practice, summary: "移動後の各部屋の人数の組を、空き部屋の数で場合分けして重複組合せで数える"}
      - {id: abc110_d, role: practice, summary: "積が M になる長さ N の数列を、素因数ごとに指数を N 個へ配る重複組合せの積にする"}
      - {id: abc021_d, role: practice, summary: "1 ≤ a_1 ≤ … ≤ a_k ≤ n を満たす列の個数を重複組合せで求める"}
      - {id: typical90_o, role: practice, summary: "差が k 以上の数だけを選ぶ方法を、選ぶ個数ごとの二項係数で数える（全 k で調和級数の計算量）"}
    sources: ["07-math-comb §4.2", "07-math-comb §6.3"]

