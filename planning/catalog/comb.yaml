    related: [minimax, nim, grundy-number, game-retrograde-analysis, bit-dp, interactive, parity, invariant, symmetry-pigeonhole-casework#symmetry]
    summary: "二人零和有限確定完全情報ゲームの各局面は、手番の人の必勝か必敗に決まる。終局から「負け局面へ 1 手で移れるなら勝ち、どこへ移っても勝ち局面なら負け」と DP で埋め、状態が大きすぎるなら手数の偶奇や真似戦略で決まらないかを疑う。"
    signs:
      - {type: phrase, text: "先手と後手が交互に操作し、両者が最適に行動したとき勝つのはどちらか"}
      - {type: phrase, text: "First / Second（Takahashi / Aoki）を出力する"}
      - {type: constraint, text: "カードの枚数 N ≤ 18 程度で、残りのカードの集合が局面になる"}
      - {type: phrase, text: "盤面（配置）が対称・同じものが偶数個ずつある"}
      - {type: phrase, text: "最終的な形が戦略によらず決まる"}
      - {type: phrase, text: "ジャッジと対戦する（インタラクティブ）"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として 5 ページに届く（直接 3）・古い ABC 6 問"
    sections:
      - {title: "ゲームの前提（零和・有限・確定・完全情報）", anchor: assumptions}
      - {title: "必勝・必敗の定義と後ろ向きに決まる理由", anchor: win-lose}
      - {title: "勝敗の DP とメモ化再帰", anchor: game-dp}
      - {title: "状態の設計：集合（bitDP）・3^N・余り", anchor: state-design}
      - {title: "手番で取れる手が違うときは手番を状態に入れる", anchor: turn}
      - {title: "総手数の偶奇・不変量で決まるゲーム（最終形から数える）", anchor: move-parity}
      - {title: "真似戦略・ペアリング戦略（真似した手が合法かを確かめる）", anchor: mirror-strategy, level: 青}
      - {title: "インタラクティブ：必勝戦略を実行する", anchor: interactive}
    merged_keys: [game-winning-losing-dp, game-dp, interactive-games, game-mirror-strategy, game-parity-invariant]
    visual: {kind: dynamic, priority: 2, text: "局面の DAG で、終局から勝ち・負けを塗っていくステップ送り（期待値 DP・後退解析の図と同じ部品）"}
    problems:
      - {id: dp_k, role: example, summary: "K 個の石の山から、集合 A のどれかの個数を交互に取り、取れなくなった方が負けのとき、勝つのはどちらかを求める。", approach: "石の数ごとの勝ち負けを小さい方から DP で決める"}
      - {id: abc354_e, role: example, representative: true, summary: "表と裏に数の書かれた N 枚（N ≤ 18）のカードから、表どうしか裏どうしが等しい 2 枚を交互に取り除き、取り除けなくなった方が負けのとき、勝つのはどちらかを求める。", approach: "残りのカードの集合を状態にした bitDP で勝敗を決める"}
      - {id: abc398_e, role: example, summary: "N 頂点の木に、奇閉路を作らないように辺を交互に足していき、足せなくなった方が負けのゲームを、ジャッジと対戦して勝つ（インタラクティブ）。", approach: "最終的に足せる辺の総数が戦略によらず決まるので、その偶奇で先手・後手を選び、二部グラフを保つ辺を足し続ける"}
      - {id: abc270_d, role: practice, summary: "N 個の石から、決まった個数 A_1, …, A_K のどれかを交互に取り、両者が自分の取る石の数を最大にするとき、先手が取れる石の数を求める。", approach: "石の数ごとに、手番の人が以後に取れる最大数を DP で求める"}
      - {id: abc278_f, role: practice, summary: "N 個（N ≤ 16）の単語でしりとりをし、同じ単語は使えず、続けられなくなった方が負けのとき、勝つのはどちらかを求める。", approach: "使った単語の集合と最後の単語を状態にした bitDP"}
      - {id: abc195_e, role: practice, summary: "数字の列の各桁について、決まった人が 0 か数字を末尾に足していき、できた数が 7 の倍数なら一方の勝ちになるとき、勝つのはどちらかを求める。", approach: "後ろから「余りが j のとき勝てるか」を、手番の人に応じて or と and で埋める"}
      - {id: abc380_f, role: practice, summary: "2 人の手札と場のカードをやりとりするゲームで、両者が最適に行動したとき勝つのはどちらかを求める（ルールの詳細は執筆時に確かめる）。", approach: "各カードの所在（3 か所）と手番を状態にした 3^N 状態のメモ化再帰"}
      - {id: arc064_b, role: practice, summary: "隣り合う文字が異なる文字列から、両端以外の文字を、取り除いた後も隣り合う文字が異ならないように交互に取り除き、取り除けなくなった方が負けのとき、勝つのはどちらかを求める。", approach: "最終形が両端の文字で決まることから、総手数の偶奇で勝敗を決める"}
      - {id: arc105_d, role: practice, summary: "袋の硬貨を交互に皿へ移したあと、皿の硬貨で Nim をするゲームで、勝つのはどちらかを求める（ルールの詳細は執筆時に確かめる）。", approach: "同じ枚数の袋が偶数個ずつあるとき後手が相手の手を真似できることを使って勝敗を決める"}
      - {id: agc014_d, role: challenge, summary: "木の頂点を 2 人が交互に白と黒に塗り、塗り終えた後の色の配置で勝敗が決まるゲームで、勝つのはどちらかを求める（ルールの詳細は執筆時に確かめる）。", approach: "木に完全マッチングがあれば、後手が相手の塗った頂点の相方を塗り続けて勝てる（ペアリング戦略）"}
    sources: ["07-math-comb §4.6（game-basics・game-winning-losing-dp・game-mirror-strategy・game-parity-invariant・interactive-games）", "07-math-comb §2.4", "07-math-comb §7.2", "02-dp §4.I", "02-dp §5.1"]

