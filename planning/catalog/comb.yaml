      - "パスカルの漸化式と対称性"
      - "k < 0・k > n を 0 とする約束"
      - "mod を取らないときの大きさとオーバーフロー"
      - "辞書順 K 番目と順位"
    merged_keys: [kth-combination]
    visual: "図：パスカルの三角形で各値が上の2つの和になる様子と、格子路の数としての読み替えを並べる"
    problems:
      - {id: arc095_b, role: example, summary: "C(n,r) が最大になる組を選ぶ（n は最大、r は n/2 に最も近いもの）"}
      - {id: abc202_d, role: practice, summary: "a と b を並べた文字列の辞書順 K 番目を、先頭から残りの並べ方の数と K を比べて決める"}
      - {id: abc057_d, role: practice, summary: "平均の最大値と、それを実現する選び方の数を二項係数で数える"}
    sources: ["07-math-comb §4.2", "07-math-comb §6.2"]

  - id: binomial-precompute
    chapter: 数え上げの基礎
    title: 二項係数の前計算（階乗・逆階乗）
    aliases: [nCr mod p, 階乗と逆階乗の表, fact と ifact, 逆階乗, Combination テーブル, 任意 mod の二項係数]
    type: technique
    level: 基礎
    level_evidence: "abc145_d (1009)・abc132_d (1167) で必要になり、abc167_e (1442)・abc156_e (1514) と水で頻出。前計算できない変種は、n が巨大な abc156_d (1014) と、法が素数とは限らない abc281_g (2304、黄)"
    kind: [数え上げ, 整数論]
    prerequisites: [binomial-coefficient, mod-inverse]
    related: [modint, mod-pow, lucas-theorem, lattice-paths, stars-and-bars]
    summary: "素数 p を法として 0..N の階乗と逆階乗を O(N + log p) で前計算し、C(n,k) を O(1) で答える。逆階乗は最大の1つだけ逆元を求めて後ろから作り、n が巨大なときや法が素数でないときは別の方法に切り替える。"
    signs:
      - {type: phrase, text: "答えを 998244353（10^9+7）で割った余りで求め、二項係数を何度も使う"}
      - {type: constraint, text: "N ≤ 2×10^5 程度で C(n,k) を多数回求める"}
      - {type: constraint, text: "n ≤ 10^9 で r が小さい（階乗の表が作れない）"}
      - {type: phrase, text: "法 M が入力で与えられる（素数とは限らない）"}
    acl: [modint]
    frequency: A
    sections:
      - "fact を前から、ifact を後ろから作る理由"
      - "表の大きさ（H+W・N+K・2N など）と範囲外の 0"
      - "n ≥ p では使えない（Lucas の定理へ）"
      - "変種：n が巨大で r が小さいときは O(r) で求める"
      - "変種：法が素数でない・小さいときはパスカルの三角形で作る（黄）"
      - "変種：mod を取らない正確な値（掛けてから割る・__int128）"
      - "ACL では：modint998244353 の inv()・pow() を使って自作する"
    merged_keys: [binomial-variants]
    visual: "図：fact を前から、ifact を後ろから埋める2本の矢印"
    problems:
      - {id: tessoku_book_ad, role: example, summary: "nCr を 10^9+7 で割った余りを、階乗とフェルマーの小定理による逆元で求める"}
      - {id: abc156_d, role: practice, summary: "n が巨大なので nCa を分子の a 項の積と a! の逆元で O(a) で求め、全体から引く"}
      - {id: abc132_d, role: practice, summary: "青玉をかたまりに分けて赤玉の間に置く方法を、かたまりの数ごとに二項係数の積で数える"}
      - {id: abc281_g, role: challenge, summary: "法が素数とは限らないので二項係数をパスカルの三角形で作り、距離の層ごとにグラフを数える"}
    sources: ["07-math-comb §4.2", "07-math-comb §6.2", "06-math-nt §4.2", "06-math-nt §7.4"]

  - id: stars-and-bars
    chapter: 数え上げの基礎
    title: 重複組合せ（玉と仕切り）
    aliases: [重複組合せ, 玉と仕切り, "H(n,k)", 非負整数解の個数, 隣り合わない選び方]
