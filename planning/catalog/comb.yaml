    related: [binomial-precompute, stars-and-bars, lattice-paths, binomial-identities, dp-kth-lexicographic]
    summary: "n 個から k 個を選ぶ数 C(n,k) を「選び方」「1 が k 個の 0/1 列」「格子路」の3つの意味で使い分ける。パスカルの漸化式・対称性・範囲外を 0 とする約束を押さえ、辞書順 K 番目の構成にも使う。"
    signs:
      - {type: phrase, text: "N 個から K 個を選ぶ方法の数"}
      - {type: phrase, text: "0 と 1 の列で 1 がちょうど K 個のもの"}
      - {type: phrase, text: "辞書順で K 番目の並べ方を求める・与えられた並べ方が何番目か"}
      - {type: constraint, text: "N ≤ 60 程度で mod を取らない正確な値（64 bit に収まるか確かめる）"}
