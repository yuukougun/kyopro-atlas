      - "ちょうど K 回なら偶奇がそろうことが必要"
      - "偶奇の条件でつながった成分（Union-Find）"
      - "市松模様の偶奇（青）"
      - "二部グラフ・ゲームとのつながり"
    merged_keys: [checkerboard-parity]
    visual: "静的な図：市松模様の塗り分けで、1 歩ごとに色が入れ替わる図"
    problems:
      - {id: arc089_a, role: example, summary: "時刻と位置の計画が実行可能か。距離が時間以下で、その差が偶数であることが必要十分"}
      - {id: typical90_x, role: example, summary: "±1 をちょうど K 回で A を B にできるか。差の合計が K 以下で、偶奇が一致すること"}
      - {id: abc126_e, role: example, summary: "A_x + A_y + Z が偶数という条件から全カードを当てる最小枚数。条件でつながった成分ごとに 1 枚見ればよい"}
      - {id: abc454_e, role: practice, summary: "グリッドの市松模様の色の偶奇で、到達・構築の可否を判定する"}
      - {id: abc313_d, role: practice, summary: "K 個の和の偶奇だけを聞けるインタラクティブで 01 列を特定する。差を取って 1 つずつ決める"}
      - {id: abc474_g, role: challenge, summary: "市松模様の条件を実験で推測して構築する"}
    sources: ["01-basics §4.L", "01-basics §5", "00-curriculum §3.2", "00-curriculum §2.3.8"]

  - id: invariant
    title: 不変量・単調に変わる量
    aliases: [不変量, モノバリアント, 保存量, 単調量, 操作の順序によらない]
    type: thinking
    level: 基礎
    level_evidence: "ABC では abc125_d（833）・abc323_d（852）・abc140_d（1074）・arc068_b（1084）・typical90_ca（★3）と緑まで。ARC・AGC では青以上で頻出（drken の 25 問の中央値 1171、うち ABC は 5 問）。型の紹介にとどめる"
    kind: [考察]
    prerequisites: []
    related: [parity, reverse-thinking, proof-patterns, game-parity-invariant, run-length-encoding, difference-sequence]
    summary: "操作で変わらない量（和の余り・個数の偶奇・XOR）を見つけて必要条件を得て、十分性は構築で示す。操作で必ず減る量（単調量）は操作回数の上界や停止性の証明に使う。"
    signs:
      - {type: phrase, text: "操作を好きな回数・好きな順に行える"}
      - {type: phrase, text: "目標の状態に到達できるか・最終状態の最大値"}
      - {type: phrase, text: "操作の前後で変わらない量（和・偶奇・余り）がありそう"}
    acl: []
    frequency: B
    sections:
      - "不変量で必要条件を見つけ、構築で十分性を示す"
      - "単調量（必ず減る量）で回数の上界を得る"
