# 考察（thinking）の目次。第2版（2026-10-21）。規則は planning/catalog/README.md、決定は planning/design-review.md。
# 考察の入口は guide の thinking-checklist（詰まったときの発想リスト）1 つにした（design-review D7）。
# このファイルは型の本体（その型が使える合図・最小の例・ABC の例題 2〜4 問）だけを持つ。
# 旧 observation-hub（考察の型の一覧）は、表を thinking-checklist に渡し、小さな型（対称性・鳩の巣原理・場合分け）の
# 普通のページ symmetry-pigeonhole-casework に作り替えた。
field: thinking
pages:
  - id: reformulation
    title: 言い換えの典型
    aliases: [言い換え, 式変形, 条件の言い換え, 独立に分解, x と y を分ける, 変数変換, reformulation]
    type: thinking
    level: 水
    level_evidence: "abc140_d（1074）・abc324_e（1153、2023）・abc105_d（1458）・abc146_e（1762）。abc319 以降は式変形して数える abc460_e（1362）が水、最近の F では「言い換えてからセグ木に載せる」型が 10 問（research/00 §2.3.8）で abc479_f（1938）・abc480_f（1840）など青に多い。drken の「操作・条件・目的関数を言い換える」ABC 72 問の中央値 617（易しい問題も多い）。言い換えが鍵になる問題がまとまって現れる水とした"
    kind: [考察]
    prerequisites: []
    related: [thinking-checklist#q-rephrase, prefix-sum-counting, fractional-binary-search, difference-sequence, bitwise-independence, manhattan-chebyshev#axis-independence, inversion-number]
    summary: "条件や目的関数を、数えやすい・判定しやすい形に書き直す。区間和が M の倍数 ⇔ 累積和の余りが等しい、平均 ≥ x ⇔ Σ(a − x) ≥ 0 のように、手法に結びつく言い換えの型を表で引ける。"
    signs:
      - {type: phrase, text: "条件が複雑で直接は数えにくい・判定しにくい"}
      - {type: phrase, text: "x 方向と y 方向・bit ごと・連結成分ごとに結果が独立に決まる"}
      - {type: shape, text: "式を変形すると i の項と j の項に分離できる"}
    acl: []
    frequency: A
    frequency_evidence: "recent 7（abc454_f・abc459_f・abc466_e・abc470_g・abc475_e・abc479_fほか）・前提として届くページなし・古い ABC 4 問"
    sections:
      - {title: "言い換えの一覧表（元の条件 → 言い換え → 使う手法のページ）", anchor: table}
      - {title: "i と j を分離する（a_i − i などの変数変換）", anchor: separate-indices}
      - {title: "独立に分解する（x と y・bit ごと・連結成分ごと）", anchor: independence}
      - {title: "操作の言い換え（区間操作を差分列で・隣接 swap を転倒数で）", anchor: operations}
      - {title: "言い換えてからデータ構造に載せる", anchor: then-data-structure, level: 青}
    merged_keys: [independence]
    visual: {kind: static, priority: 2, text: "元の条件と言い換えた条件を左右に並べた対応表"}
    problems:
      - {id: abc324_e, role: example, summary: "N 個の文字列から 2 つを順に連結したものが T を部分列に含むような組の数を求める。", approach: "各 S_i で T の先頭・末尾から何文字一致するかに言い換え、ソートと二分探索で数える"}
      - {id: abc105_d, role: example, representative: true, summary: "区間和が M の倍数になる区間の数を求める。", approach: "区間和が M の倍数 ⇔ 累積和の余りが等しい、と言い換えて数える（累積和のページと共通）"}
      - {id: agc003_a, role: practice, summary: "N・S・E・W の移動の各日の距離を自由に決めて、家に戻れるか判定する。", approach: "x 方向と y 方向を独立に判定する（独立に分解）"}
      - {id: abc146_e, role: practice, summary: "区間和を K で割った余りが区間の長さに等しい区間の数を求める。", approach: "余りが区間長に等しい ⇔ a_i − 1 の区間和の余りが 0、と言い換えて数える"}
      - {id: abc460_e, role: practice, summary: "（執筆時に確かめる）", approach: "桁数ごとに式変形して数える（research/00 §2.3.8 の分類）"}
      - {id: abc479_f, role: challenge, summary: "（執筆時に確かめる）", approach: "隣接 swap の回数に言い換え、転倒数で数える（research/00 §2.3.8 の分類）"}
    sources: ["01-basics §4.L", "01-basics §5", "01-basics §6.2", "01-basics §7.3", "00-curriculum §2.3.8"]

  - id: fix-variable
    title: 一部を固定して数える
    aliases: [決め打ち, 固定して全探索, 真ん中を固定, 片方を固定, 最大値を固定, fix one variable]
    type: thinking
    level: 基礎
    level_evidence: "abc330_d（569、2023）・arc102_a（966）・abc318_e（1004）・arc084_a（1096）・abc254_d（1191）。drken の「一部の変数を固定して考える」ABC 55 問の中央値 1004。最近も abc458_e（1309）・abc453_e（1513）"
    kind: [考察, 全探索]
    prerequisites: [brute-force]
    related: [binary-search, contribution, counting-fix-order, greedy-priority-queue]
    summary: "変数の一部（3 つ組の真ん中・最大値・余りなど）を固定すると、残りの条件が単純になって独立に数えられる。固定したあとは二分探索・累積和・連想配列で残りを速く数える。"
    signs:
      - {type: phrase, text: "3 つ組 (i < j < k) を数える"}
      - {type: phrase, text: "2 つの値の組で、片方を決めればもう片方の条件が単純になる"}
      - {type: phrase, text: "最大値（最小値）を決めて残りを最適化する"}
      - {type: constraint, text: "N ≤ 2×10^5 で 3 つ組は N^3 通りあり、全部は試せない"}
    acl: []
    frequency: A
    frequency_evidence: "recent 4（abc453_e・abc458_e・abc461_d・abc467_e）・前提として届くページなし・古い ABC 3 問"
    sections:
      - {title: "真ん中を固定して左右を独立に数える", anchor: fix-middle}
      - {title: "角・余り・平方因子を除いた部分を固定する", anchor: fix-parts}
      - {title: "最大値を固定して残りを最適化する", anchor: fix-maximum}
      - {title: "固定したあとを速くする（二分探索・累積和・連想配列）", anchor: speed-up}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "3 つ組の真ん中 j を固定し、左側と右側を独立に数える図"}
    problems:
      - {id: abc330_d, role: example, representative: true, summary: "N×N のマス目で、o のマスを 3 つ選んで L 字（2 つが同じ行・2 つが同じ列）を作る組の数を求める。", approach: "角のマスを固定し、同じ行・列の o の数の積を足す"}
      - {id: abc318_e, role: example, summary: "A_i = A_k ≠ A_j となる i < j < k の組の数を求める。", approach: "値ごとに出現位置の列を見て、間の個数を一度に数える"}
      - {id: arc102_a, role: practice, summary: "N 以下の正の整数の組 (a, b, c) で、a+b・b+c・c+a がすべて K の倍数になるものの数を求める。", approach: "a の余りを固定すると b, c の余りも決まる"}
      - {id: abc254_d, role: practice, summary: "N 以下の正の整数の組 (i, j) で、i × j が平方数になるものの数を求める。", approach: "i の平方因子を除いた部分を固定すると j の形が決まる"}
      - {id: abc458_e, role: practice, summary: "（執筆時に確かめる）", approach: "仕切りの位置を固定して二項係数で数える（research/00 §2.3.8 の分類）"}
      - {id: abc453_e, role: challenge, summary: "（執筆時に確かめる）", approach: "人数を固定して場合を分け、二項係数と累積和で数える（research/00 §2.3.8 の分類）"}
    sources: ["01-basics §4.L", "01-basics §5", "00-curriculum §2.3.8"]

  - id: contribution
    title: 主客転倒・寄与
    aliases: [主客転倒, 寄与, 貢献度, contribution technique, 足された回数, 各要素が何回数えられるか]
    type: thinking
    level: 水
    level_evidence: "abc186_d（436）は易しいが、abc379_e（1246、2024）・abc351_f（1253、2024）・abc151_e（1344）と水に多く、abc140_e（1873）は青。最近も abc468_e（1038）・abc455_f（1549）・abc471_g（2464）などで頻出。drken の「主客転倒・寄与分解」ABC 16 問の中央値 1907。Σ の式変形の例 abc172_d は math の sigma-manipulation の例題に任せた（03-catalog 指摘6）"
    kind: [考察, 数え上げ]
    prerequisites: []
    related: [sigma-manipulation#swap-order, counting-mindset#contribution-with-binomial, linearity-of-expectation, bitwise-independence#per-bit-contribution, monotonic-stack#contribution, fenwick-tree]
    summary: "全ペア・全区間・全部分集合についての総和を、「各要素が何回数えられるか × 値」の和に入れ替えて求める。各要素が最大・最小になる回数や各桁が現れる回数を数えれば、対象を 1 つずつ列挙しなくて済む。"
    signs:
      - {type: phrase, text: "すべての組・区間・部分集合についての総和"}
      - {type: phrase, text: "各要素が答えに何回足されるか"}
      - {type: phrase, text: "全区間の最小値（2 番目に大きい値）の和"}
      - {type: constraint, text: "N ≤ 2×10^5 で、組・区間は N^2 個あり列挙できない"}
    acl: []
    frequency: A
    frequency_evidence: "recent 5（abc455_f・abc461_e・abc468_e・abc470_g・abc471_g）・前提として 2 ページに届く（直接 2）・古い ABC 6 問"
    sections:
      - {title: "数える対象を入れ替える（表の行と列。式の規則は Σ の変形のページ）", anchor: swap-roles}
      - {title: "ソートで符号を決める（全ペアの差）", anchor: sort-signs}
      - {title: "各桁・各約数の寄与", anchor: digits-divisors}
      - {title: "各要素が最大・最小になる回数（同じ値の扱い）", anchor: max-min-count}
      - {title: "数え上げ・期待値での使い方（数え上げの章へ）", anchor: counting}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "（対象 × 要素）の表で、行ごとに足すか列ごとに足すかを入れ替える図"}
    problems:
      - {id: abc186_d, role: example, summary: "N 個の整数のすべてのペアについて、差の絶対値の総和を求める。", approach: "ソートすると各要素が足される回数と引かれる回数が決まる"}
      - {id: abc151_e, role: example, representative: true, summary: "N 個から K 個を選ぶすべての選び方について、（最大値 − 最小値）の総和を求める。", approach: "ソートし、各要素が最大・最小になる回数を二項係数で数える"}
      - {id: abc468_e, role: practice, summary: "（執筆時に確かめる）", approach: "主客転倒（寄与）と前計算（research/00 §2.3.8 の分類）"}
      - {id: abc379_e, role: practice, summary: "数字列のすべての部分文字列が表す整数の総和を求める。", approach: "各桁が何回どの位で現れるかを数える"}
      - {id: abc351_f, role: practice, summary: "i < j のすべての組について max(A_j − A_i, 0) の総和を求める。", approach: "各 j について、前にある小さい値の個数と和を BIT で数える"}
      - {id: abc140_e, role: challenge, summary: "順列のすべての区間について、2 番目に大きい値の総和を求める。", approach: "各値が 2 番目になる区間の数を、左右の大きい値の位置から数える"}
    sources: ["01-basics §4.L", "01-basics §5", "01-basics §7.3", "07-math-comb §4.1", "00-curriculum §2.3.8"]

  - id: complement
    title: 余事象
    aliases: [補集合, 全体から引く, 少なくとも 1 つ, 2 条件の包除, complementary counting]
    type: thinking
    level: 基礎
    level_evidence: "abc193_c（379）・abc131_c（518）・abc178_c（653）・abc162_d（757）・abc156_d（1014）。drken の「考察：補集合を考える」ABC 29 問の中央値 833。最近も abc455_e（1157）。2〜3 条件の包除（abc131_c）を comb の inclusion-exclusion から受けた（design-review §4.2）"
    kind: [考察, 数え上げ]
    prerequisites: []
    related: [counting-mindset, inclusion-exclusion]
    summary: "「少なくとも 1 つ」「〜でない」ものは、全体から数えやすい補集合を引いて数える。条件が 2〜3 個なら包除原理で重なりを足し引きし、mod での引き算は負にならないように直す。"
    signs:
      - {type: phrase, text: "〜でないもの・少なくとも 1 つ含むもの"}
      - {type: phrase, text: "すべて異なる・条件を 1 つでも満たす"}
      - {type: phrase, text: "A でも B でもないものの個数"}
      - {type: shape, text: "直接数えると場合分けが多いが、条件を満たさない側は数えやすい"}
    acl: []
    frequency: B
    frequency_evidence: "recent 1（abc455_e）・前提として 3 ページに届く（直接 1）・古い ABC 5 問"
    sections:
      - {title: "全体 − 補集合", anchor: whole-minus-complement}
      - {title: "2〜3 条件の包除（重なりを足し戻す）", anchor: two-conditions}
      - {title: "mod の引き算と空集合の扱い", anchor: mod-and-empty}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "全体の長方形から数えやすい部分を切り抜くベン図"}
    problems:
      - {id: abc178_c, role: example, summary: "0 と 9 をどちらも含む、長さ N の数字の列の数を求める。", approach: "全体 10^N から 0 を含まない・9 を含まないものを引き、どちらも含まないものを足し戻す"}
      - {id: abc162_d, role: example, representative: true, summary: "R・G・B からなる文字列で、3 文字の色がすべて異なり、添字が等間隔でない 3 つ組の数を求める。", approach: "色がすべて異なる組の数から、添字が等間隔のものを引く"}
      - {id: abc193_c, role: practice, summary: "1 以上 N 以下の整数のうち、a^b（a, b ≥ 2）と表せないものの個数を求める。", approach: "表せる数を列挙して全体から引く"}
      - {id: abc131_c, role: practice, summary: "A 以上 B 以下の整数のうち、C でも D でも割り切れないものの個数を求める。", approach: "lcm を使った 2 条件の包除"}
      - {id: abc455_e, role: practice, summary: "（執筆時に確かめる）", approach: "余事象・包除原理・累積和で数える（research/00 §2.3.8 の分類）"}
    sources: ["01-basics §4.L", "01-basics §5", "07-math-comb §4.1", "00-curriculum §2.3.8"]

  - id: parity
    title: 偶奇に着目する
    aliases: [パリティ, 偶奇性, mod 2, 市松模様, チェッカーボード, parity]
    type: thinking
    level: 基礎
    level_evidence: "arc089_a（397）・typical90_x（★2）。応用 abc126_e（1340）・abc313_d（1630）。drken の「パリティに着目する」ABC 38 問の中央値 514。市松模様の偶奇は abc454_e（1627、2026）・abc474_g（2280、2026）で青以上（節に印）。abc319 以降で基礎の帯の偶奇の問題は見つかっていないので、帯は古い問題で数えた"
    kind: [考察]
    prerequisites: []
    related: [invariant, bipartite-graph, game-basics#move-parity, union-find-applications, interactive]
    summary: "1 歩ごとに (x + y) の偶奇が入れ替わる、±1 をちょうど K 回なら差と K の偶奇がそろう、など偶奇の必要条件から可否を判定する。グリッドでは市松模様の色の偶奇が不変量になる。"
    signs:
      - {type: phrase, text: "ちょうど K 回の操作・±1 の移動"}
      - {type: phrase, text: "和が偶数という条件"}
      - {type: phrase, text: "グリッドを 1 マスずつ動く操作の可否"}
      - {type: phrase, text: "チェス盤の塗り分け・ドミノの敷き詰め"}
    acl: []
    frequency: A
    frequency_evidence: "recent 5（abc454_e・abc459_g・abc460_d・abc467_e・abc474_g）・前提として 1 ページに届く（直接 1）・古い ABC 2 問"
    sections:
      - {title: "1 歩ごとに偶奇が入れ替わる", anchor: alternating}
      - {title: "ちょうど K 回なら偶奇がそろうことが必要", anchor: exactly-k}
      - {title: "偶奇の条件でつながった成分（Union-Find）", anchor: components}
      - {title: "市松模様の偶奇", anchor: checkerboard, level: 青}
      - {title: "二部グラフ・ゲームとのつながり", anchor: bipartite-game}
    merged_keys: [checkerboard-parity]
    visual: {kind: static, priority: 2, text: "市松模様の塗り分けで、1 歩ごとに色が入れ替わる図"}
    problems:
      - {id: arc089_a, role: example, representative: true, summary: "時刻 t_i に地点 (x_i, y_i) にいるという旅行の計画が、上下左右に 1 歩ずつ動いて実行できるか判定する。", approach: "距離が時間以下で、その差が偶数であることが必要十分"}
      - {id: abc126_e, role: example, summary: "A_x + A_y + Z が偶数という条件がいくつか与えられたとき、すべてのカードの値を知るために見る最小の枚数を求める。", approach: "条件でつながった成分ごとに 1 枚見ればよい（Union-Find）"}
      - {id: typical90_x, role: practice, summary: "A の要素に ±1 する操作をちょうど K 回行って B にできるか判定する。", approach: "差の合計が K 以下で、偶奇が一致すること"}
      - {id: abc454_e, role: practice, summary: "（執筆時に確かめる）", approach: "グリッドの市松模様で可否を判定し、構築する（research/00 §2.3.8 の分類）"}
      - {id: abc474_g, role: challenge, summary: "（執筆時に確かめる）", approach: "市松模様と実験による条件の推測で構築する（research/00 §2.3.8 の分類）"}
    sources: ["01-basics §4.L", "01-basics §5", "00-curriculum §3.2", "00-curriculum §2.3.8"]

  - id: invariant
    title: 不変量・単調に変わる量
    aliases: [モノバリアント, 保存量, 単調量, 操作の順序によらない, invariant, monovariant]
    type: thinking
    level: 基礎
    level_evidence: "ABC では abc125_d（833）・abc323_d（852、2023）・abc140_d（1074）・arc068_b（1084）・typical90_ca（★3）と緑まで。ARC・AGC では青以上で頻出（drken の 25 問の中央値 1171、うち ABC は 5 問）。型の説明にとどめる"
    kind: [考察]
    prerequisites: []
    related: [parity, reverse-thinking, proof-patterns#necessary-sufficient, game-basics#move-parity, run-length-encoding, difference-sequence]
    summary: "操作で変わらない量（和の余り・個数の偶奇・XOR）を見つけて必要条件を得て、十分性は構築で示す。操作で必ず減る量（単調量）は操作回数の上界や停止性の証明に使う。"
    signs:
      - {type: phrase, text: "操作を好きな回数・好きな順に行える"}
      - {type: phrase, text: "目標の状態に到達できるか・最終状態の最大値"}
      - {type: phrase, text: "操作の前後で変わらない量（和・偶奇・余り）がありそう"}
    acl: []
    frequency: B
    frequency_evidence: "recent 0・前提として届くページなし・古い ABC 3 問"
    sections:
      - {title: "不変量で必要条件を見つけ、構築で十分性を示す", anchor: necessary-and-sufficient}
      - {title: "単調量（必ず減る量）で回数の上界を得る", anchor: monovariant}
      - {title: "操作の順序によらないなら都合のよい順で考える", anchor: order-independence}
      - {title: "独立な部分に分ける（奇数部分ごと）", anchor: independent-parts}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "状態の横に不変量を表示しながら操作を進める図"}
    problems:
      - {id: abc125_d, role: example, representative: true, summary: "隣り合う 2 つの符号を反転する操作を何度でも行えるとき、数列の和の最大値を求める。", approach: "負の数の個数の偶奇が変わらないことから決まる"}
      - {id: abc323_d, role: example, summary: "同じ大きさのスライム 2 体を合体させる操作を繰り返したときの、スライムの数の最小値を求める。", approach: "大きさを奇数部分ごとに分けると独立に決まる"}
      - {id: arc068_b, role: example, summary: "カードを 3 枚取って最大と最小を食べ、真ん中を戻す操作で、すべて異なる値にしたときに残せる最大の枚数を求める。", approach: "1 回で 2 枚減ることから偶奇で決まる"}
      - {id: typical90_ca, role: practice, summary: "2×2 の正方形の 4 マスに同じ値を足し引きする操作で、行列 A を B にできるか判定する。", approach: "操作の順番によらないので左上から決めていける"}
      - {id: abc140_d, role: practice, summary: "向き（L/R）の列に区間の反転を K 回まで行い、幸福な人の数を最大化する。", approach: "境界の数が 1 回で高々 2 しか減らない（単調量）"}
    sources: ["01-basics §4.L", "01-basics §5", "01-basics §7.3"]

  - id: reverse-thinking
    title: 後ろから・逆順に考える
    aliases: [逆から考える, 操作を逆再生, クエリを逆順に処理, 削除を追加に, work backwards]
    type: thinking
    level: 基礎
    level_evidence: "agc032_a（738）・abc134_d（926）・arc065_a（930）・abc477_d（946、2026）と、後ろから考えれば解ける問題は基礎の帯から現れる。abc137_d（1313）・abc120_d（1355）は優先度付きキュー・Union-Find と組む形で水、abc466_f（1887、2026）は青。drken の「順序の工夫：後ろから見る」ABC 6 問の中央値 1120。研究の案（水）から、易しい問題のまとまりと最近の根拠に合わせて基礎に下げ、Union-Find と組む節に水の印を付けた"
    kind: [考察, クエリ処理の工夫]
    prerequisites: []
    related: [union-find-connectivity#reverse-deletion, offline-queries#reverse-time, greedy-priority-queue#from-last-day, invariant]
    summary: "後ろから決めると選択肢が一意になる、最後の操作が特定できれば逆再生で取り除ける、削除を逆にすると追加になる、など時間の向きを逆にして考える。"
    signs:
      - {type: phrase, text: "辺・要素の削除のクエリ"}
      - {type: phrase, text: "操作列を復元する・操作の結果から元を求める"}
      - {type: shape, text: "後ろから決めると選択肢が 1 つに決まる"}
    acl: []
    frequency: A
    frequency_evidence: "recent 2（abc466_f・abc477_d）・前提として届くページなし・古い ABC 3 問"
    sections:
      - {title: "後ろから決めると一意になる", anchor: decide-from-back}
      - {title: "最後の操作を特定して逆再生する", anchor: undo-last}
      - {title: "締め切りを後ろから見る", anchor: deadlines}
      - {title: "削除を逆順の追加にする（Union-Find はグラフの章）", anchor: delete-to-add, level: 水}
    merged_keys: []
    visual: {kind: static, priority: 2, text: "時間を逆向きに再生し、削除を追加に置き換える図"}
    problems:
      - {id: agc032_a, role: example, summary: "空の列に「j 番目に j を挿入する」操作を N 回行って列 b を作れるか判定し、できるなら操作列を求める。", approach: "最後の操作は位置と値が一致する最も右の要素と決まるので、逆再生で取り除く"}
      - {id: abc134_d, role: example, representative: true, summary: "i の倍数番目の箱に入れたボールの数の和の偶奇が、すべての i で指定どおりになる入れ方を求める。", approach: "大きい i から決めると一意に決まる"}
      - {id: arc065_a, role: example, summary: "文字列 S が dream・dreamer・erase・eraser の連結で作れるか判定する。", approach: "後ろから照合すると切り方が一意に決まる"}
      - {id: abc477_d, role: practice, summary: "（執筆時に確かめる）", approach: "クエリを逆順に処理する（research/00 §2.3.8 の分類）"}
      - {id: abc120_d, role: practice, summary: "橋が 1 本ずつ崩落していくとき、各時点で行き来できなくなった島の組の数を求める。", approach: "逆順に橋を架け、Union-Find で連結成分を併合する"}
      - {id: abc466_f, role: challenge, summary: "（執筆時に確かめる）", approach: "操作を逆から考え、同じ長さのものを一度に処理する（research/00 §2.3.8 の分類）"}
    sources: ["01-basics §4.L", "01-basics §5", "00-curriculum §2.3.8"]

  - id: construction
    title: 構築問題の考え方
    aliases: [構築, constructive, 1 つ出力せよ, 上界と下界, 必要条件と十分性, constructive algorithms]
    type: thinking
    level: 基礎
    level_evidence: "abc139_d（357）・abc474_d（389、2026）・abc350_c（394、2024）・keyence2020_c（625）・arc115_c（706）・abc112_d（1025）と、構築の考え方が要る問題は基礎の帯から現れる。グラフの構築 abc131_e（1433）は水、XOR の対称な並べ方 abc126_f（1770）・市松模様の abc454_e（1627）は青、abc474_g（2280）は黄。drken の「構築」ABC 13 問の中央値 1192。研究の案（水）から、上界と達成の節（基礎）がページより低くならないよう基礎に下げ、節に水の印を付けた"
    kind: [考察]
    prerequisites: []
    related: [thinking-checklist#shape-construct, invariant, graph-construction, tree-construction, stress-testing]
    summary: "条件を満たすものを 1 つ作る問題は、小さい N で手で作って規則を見つけ、不可能な場合の必要条件を先に挙げてから一般化する。最大値を求める問題では、上界を示してそれを達成する例を作る。"
    signs:
      - {type: phrase, text: "条件を満たすものを 1 つ出力せよ（存在しなければ −1）"}
      - {type: phrase, text: "操作手順を出力せよ（回数の上限が与えられている）"}
      - {type: phrase, text: "最大値を求めるが、答えに自然な上限がありそう"}
    acl: []
    frequency: A
    frequency_evidence: "recent 4（abc453_f・abc454_e・abc474_d・abc474_g）・前提として届くページなし・古い ABC 5 問"
    sections:
      - {title: "小さい N で作って規則を一般化する", anchor: small-cases}
      - {title: "必要条件を先に挙げる", anchor: necessary-conditions}
      - {title: "上界・下界を示して達成する例を作る", anchor: bound-and-construct}
      - {title: "出力を検査するプログラムで確かめる", anchor: checker}
      - {title: "ABC の構築の型（手順・数列・グラフ）", anchor: abc-patterns, level: 水}
    merged_keys: [bound-and-construct]
    visual: {kind: static, priority: 2, text: "小さい N で作った例を並べて規則的に伸ばす様子と、上界の線に構築例が届く図"}
    problems:
      - {id: abc139_d, role: example, representative: true, summary: "1〜N の並べ替え P について Σ (i mod P_i) の最大値を求める。", approach: "各項 ≤ i − 1 の上界を示し、それを達成する並べ方を作る"}
      - {id: abc131_e, role: example, summary: "最短距離が 2 の頂点の組がちょうど K 個になる、N 頂点の連結な単純グラフを 1 つ作る（なければ −1）。", approach: "スターから始め、辺を 1 本足すごとに距離 2 の組を 1 つずつ減らす"}
      - {id: keyence2020_c, role: practice, summary: "和が S になる区間がちょうど K 個ある、長さ N の数列を 1 つ作る。", approach: "S を K 個並べ、残りは S と干渉しない値で埋める"}
      - {id: abc350_c, role: practice, summary: "順列を N−1 回以下の swap でソートする手順を出力する。", approach: "各値を正しい位置へ送る"}
      - {id: arc115_c, role: practice, summary: "i が j の約数（i < j）なら A_i ≠ A_j となる数列のうち、最大値が最小のものを 1 つ作る。", approach: "素因数の個数 + 1 を割り当てる（上界と達成）"}
      - {id: abc126_f, role: challenge, summary: "0〜2^M − 1 をそれぞれ 2 回ずつ含み、同じ値の 2 つの間の XOR がすべて K になる数列を作る（なければ −1）。", approach: "対称な並べ方を工夫する"}
    sources: ["01-basics §4.L", "01-basics §5", "01-basics §7.3"]

  - id: symmetry-pigeonhole-casework
    title: 対称性・鳩の巣原理・場合分け
    aliases: [対称性, 鳩の巣原理, 部屋割り論法, 場合分け, pigeonhole principle, 端の場合を分ける]
    type: thinking
    level: 基礎
    level_evidence: "対称性は abc177_c（386）・abc171_e（778）・abc471_e（990、2026）・abc462_e（1226、2026）、鳩の巣原理は abc174_c（902）・abc179_e（1175）・abc200_d（1217）と abc260_f（1995。graph の degree-sqrt の練習）、場合分けは arc091_a（514）で、どれも基礎の帯から現れる。鳩の巣原理は水の帯に多いので節に印を付けた。旧 observation-hub（考察の型の一覧）を、考察の入口を guide の thinking-checklist に一本化したのに合わせて作り替えた（design-review D7）"
    kind: [考察]
    prerequisites: []
    related: [thinking-checklist#q-invariants, periodicity, probability-symmetry#symmetry, game-basics#mirror-strategy, proof-patterns#pigeonhole-remainder, stress-testing#experiment]
    summary: "対称性で計算や場合を半分に減らし、鳩の巣原理で「必ず一致が起きる」ことから探索の回数の上限を得る。端の場合（N = 1 など）や大小関係で場合を分けて、それぞれを単純な問題にする。"
    signs:
      - {type: phrase, text: "i < j の組の和など、i と j を入れ替えても同じ形の式"}
      - {type: phrase, text: "自分以外の全員の XOR（和）が与えられる"}
      - {type: constraint, text: "余りや状態が M 種類しかなく、M + 1 個以上の候補がある"}
      - {type: phrase, text: "N = 1 や N が小さいときだけ答えの形が違う"}
    acl: []
    frequency: A
    frequency_evidence: "recent 4（abc457_f・abc459_d・abc462_e・abc463_f）・前提として届くページなし・古い ABC 6 問"
    sections:
      - {title: "対称性で計算を半分にする（i < j の和・全体の XOR から 1 つ除く）", anchor: symmetry}
      - {title: "対称性で場合を減らす（N ≤ M に入れ替える）", anchor: symmetry-cases}
      - {title: "鳩の巣原理（必ず一致が起きる・探索の打ち切り回数）", anchor: pigeonhole, level: 水}
      - {title: "場合分け（端の場合・大小関係・操作の順序によらないこと）", anchor: casework}
    merged_keys: [observation-hub, symmetry, pigeonhole, casework]
    visual: {kind: static, priority: 2, text: "i < j の組の表で対角より上を塗り、全体から対角を引いて半分にする図と、M 個の箱に M + 1 個の玉を入れる図"}
    problems:
      - {id: abc177_c, role: example, representative: true, summary: "N 個の整数から 2 つを選ぶすべての組（i < j）について、積 A_i A_j の総和を求める。", approach: "（和の 2 乗 − 2 乗の和）/ 2 で求める（対称性）"}
      - {id: arc091_a, role: example, summary: "N×M 枚のカードのそれぞれについて周り 9 枚を反転する操作を行った後、裏向きのカードの枚数を求める。", approach: "各カードが何回反転されるかを、N・M が 1 か 2 以上かで場合分けして数える（操作の順序によらない）"}
      - {id: abc200_d, role: example, summary: "数列から、和を 200 で割った余りが等しい 2 つの異なる部分列を見つける（なければ No）。", approach: "候補が 201 個あれば必ず一致するので、少数の要素だけ全探索すればよい（鳩の巣原理）"}
      - {id: abc471_e, role: practice, summary: "（執筆時に確かめる）", approach: "二項係数と式変形。Σ_{i≠j} A_i A_j = S1² − S2 の対称性を使う（research/00 §2.3.8 の分類）"}
      - {id: abc174_c, role: practice, summary: "7, 77, 777, … のうち最初に K の倍数になる項が何番目かを求める（なければ −1）。", approach: "余りは K 種類しかないので K 回以内に決着する（鳩の巣原理）"}
      - {id: abc462_e, role: practice, summary: "（執筆時に確かめる）", approach: "対称性で場合を減らして最小化する（research/00 §2.3.8 の分類）"}
    sources: ["01-basics §4.L", "01-basics §5", "01-basics §6.2", "00-curriculum §3.2", "00-curriculum §4.2", "00-curriculum §5.1"]

