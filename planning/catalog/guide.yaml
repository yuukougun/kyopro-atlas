  - id: stress-testing
    title: ストレステストと実験
    aliases: [ランダムテスト, 愚直解との比較, 実験, OEIS, 撃墜ケース探し]
    type: guide
    level: null
    kind: [案内, 実装・C++]
    prerequisites: []
    related: [debugging-checklist, experiment, counting-experiment, interactive, cpp-random-chrono]
    summary: "WA の原因が見つからないときに、愚直解と本解を小さいランダムな入力で比べて反例を探す手順と、小さいケースを全探索して規則を予想する実験の方法。スクリプト全体は載せず、処理の流れを書く。"
    signs: []
    acl: []
    sections:
      - "手順：明らかに正しい愚直解 → 小さい入力の生成器（N は 5〜10、値は 20 程度まで）→ 生成・実行・比較を繰り返し、不一致で止める → 反例を手で追う（手書き）"
      - "形：1つのプログラムに本解と愚直解を入れる／シェルのループと diff／online-judge-tools（oj）の生成とテスト（手書き）"
      - "生成器のコツ：互いに異なる値、木は Union-Find でつないで作る、Yes になる入力を必ず作る、答えが複数ならチェッカーで判定（手書き）"
      - "注意：完全なランダムは 0 や 2 の冪などのコーナーケースを逃すことがあるので、小さい範囲は全数テストにする。愚直解の方が誤っていることもある。本番の前に練習しておく（手書き）"
      - "実験：小さいケースの答えの表を作り、周期・単調性・公式を予想して OEIS で調べる。予想は証明するか、ストレステストで十分に確かめてから使う（考え方の側は考察の章の実験の節）（手書き）"
      - "インタラクティブ問題の手元でのテスト（ジャッジ役のプログラム）→ その他の技法のインタラクティブ問題（手書き）"
    merged_keys: []
    visual: "手書き：生成器 → 愚直解・本解 → 比較 のループの図（Mermaid）"
    problems: []
    sources: ["00-curriculum §4.1（ストレステストと実験）", "00-curriculum §6.7", "01-basics §7.4", "08-string-geo §7.4"]

