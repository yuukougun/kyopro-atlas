  - id: cheatsheet
    chapter: 早見表と資料
    title: 早見表
    aliases: [チートシート, 一覧表, 1 秒で回る回数, 数の目安, 公式集]
    type: guide
    level: null
    kind: [案内]
    prerequisites: []
