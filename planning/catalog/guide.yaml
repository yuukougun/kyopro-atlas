  - id: method-comparison
    chapter: 辞書として引く
    title: 似た手法の使い分け
    aliases: [手法の比較, どれを使うか, 使い分け, 混同しやすい手法, 最短路の選び方, 最短路の比較, 最短路アルゴリズムの使い分け]
    type: guide
    level: null
    kind: [案内]
    prerequisites: []
    related: [bfs, zero-one-bfs, dijkstra, bellman-ford, warshall-floyd, extended-dijkstra, shortest-path-dag, dp-speedup-overview, kth-and-median#dynamic, subsequence-and-substring#properties, stl-containers, reverse-index-signs, cheatsheet]
    summary: "BFS・01-BFS・ダイクストラや累積和・BIT・セグメント木のように混同しやすい手法の組を、できる操作・計算量・前提条件で比べ、条件から選べる。"
    signs: []
    acl: []
    sections:
      - {title: "比べる観点", anchor: criteria}                              # できる操作・計算量・実装の重さ・オンライン／オフライン・前提条件（辺の重みが非負など）・ACL の有無
      - {title: "最短路の選び方（重みと始点の数）", anchor: shortest-path}     # graph/shortest-path-overview を受けた。辺の重み（等しい・0 と 1・非負・負あり）× 始点（単一・全点対）の表と、計算量・制約の目安（BFS・01-BFS・ダイクストラ・ベルマンフォード・ワーシャルフロイド）
      - {title: "最短路の判断の順序", anchor: shortest-path-steps}             # shortest-path-overview から：重み → 始点 → 制約 → 状態を足す（extended-dijkstra）→ 辺を減らす。最短路の拡張グラフと DP の境目
      - {title: "最短路に共通の性質", anchor: shortest-path-properties}        # shortest-path-overview から：部分路も最短路・三角不等式・最短路 DAG（→ shortest-path-dag）
      - {title: "区間の集約", anchor: range-queries}                         # 累積和・いもす法・BIT・セグメント木・遅延セグメント木・Sparse Table・平方分割。いもす法と遅延セグメント木
      - {title: "二分探索の種類", anchor: binary-search}                      # 答えの二分探索・セグメント木上の二分探索・BIT 上の二分探索。二分探索と尺取り法、二分探索と三分探索
      - {title: "繰り返しの高速化", anchor: repetition}                       # 周期の検出・ダブリング・行列累乗。ダブリング（関数）と LCA（木の親）
      - {title: "小さい N の全探索", anchor: small-n}                         # bit 全探索・bitDP・半分全列挙。部分和 DP・半分全列挙・bitset
      - {title: "数え方", anchor: counting}                                  # 余事象と包除原理。主客転倒・寄与・期待値の線形性。期待値 DP と期待値の線形性
      - {title: "ゲーム", anchor: games}                                     # ゲーム DP・Grundy 数・閉路のあるゲームの後退解析
      - {title: "連結性", anchor: connectivity}                              # Union-Find・DFS／BFS・最小全域木。トポロジカルソート・DAG 上の DP・SCC。2-SAT と二部グラフ判定
      - {title: "木の手法", anchor: trees}                                   # 木 DP・全方位木 DP・重心分解。オイラーツアーと HL 分解。LCA（ダブリング／オイラーツアー＋RMQ）。重心分解とマージテク
      - {title: "集合とキュー", anchor: containers}                           # priority_queue と set・multiset、map・unordered_map・配列、座標圧縮・map・動的セグメント木。K 番目を取る構造の比較は kth-and-median#dynamic に任せてリンクだけ
      - {title: "文字列の照合", anchor: strings}                              # ローリングハッシュ・Z・KMP・Suffix Array・Manacher・Trie・Aho-Corasick。ローリングハッシュと集合のハッシュ
      - {title: "最適化の方針", anchor: optimization}                         # DP・貪欲（交換論法の証明があるか）・フロー（燃やす埋める）
      - {title: "名前が似た別物", anchor: similar-names}                      # オイラーツアー（木）とオイラー路（グラフ）、部分列と部分文字列（→ subsequence-and-substring）、置換の巡回分解（任意の swap）と転倒数（隣接 swap）、なもりグラフと Functional graph
      - {title: "数の扱い", anchor: numbers}                                 # double・long double・整数のまま、逆元（フェルマー・拡張ユークリッド）、素数判定・素因数分解（試し割り・篩・Miller-Rabin）
    merged_keys: [shortest-path-overview]
    visual: {kind: static, priority: 2, text: "組ごとの比較表と、条件から選ぶフローチャート（Mermaid）。最短路は辺の重み（等しい・0 と 1・非負・負あり）と始点の数（単一・全点対）の 2 軸の表"}
    problems: []
    sources: ["00-curriculum §4.1（似た手法の使い分け）", "00-curriculum §2.4.2", "00-curriculum §6.3", "01-basics §6.3", "02-dp §6.2", "03-graph §4.B（最短路アルゴリズムの使い分け）", "03-graph §6.2", "03-graph §6.3", "05-ds §6.1", "05-ds §6.2", "06-math-nt §6.2", "07-math-comb §6.2", "08-string-geo §6.2", "09-cpp §6.3"]

  # ===== 章：学び方と練習 =====
  - id: roadmap
    chapter: 学び方と練習
    title: 色別ロードマップ
    aliases: [学習順序, 何から学ぶか, 水色・青・黄色のロードマップ, 推奨ルート, 位置ごとの頻出手法]
    type: guide
    level: null
    kind: [案内]
    prerequisites: []
    related: [knowledge-map, atcoder-system#difficulty-by-position, contest-strategy, practice-method, problem-sets#recent-abc, reformulation]
    summary: "目標の色ごとに、到達の目安、読むページの順、最近の ABC の位置ごとの頻出手法、解いた数の進捗を見られる。ページの列はレベル・前提・出題頻度から生成する。"
    signs: []
    acl: []
    sections:
      - {title: "今の位置と目標", anchor: goal}                              # レート961・パフォーマンス1100〜1450 から、パフォーマンス2000前後を安定して出すまで
      - {title: "色ごとの到達の目安", anchor: targets}                        # パフォーマンス1200 は A〜D を約40分で確実に＋E を5回に2回、1600 は A〜E を約55分、2000 は A〜F を約70分（research/00 §2.3.6〜§2.3.7）
      - {title: "黄を目指す段の主な条件", anchor: yellow}                     # 青までの知識を速く確実に使うこと（F の75%は difficulty 2000 未満）。黄の段の列には青までのページの復習を含める
      - {title: "位置ごとの頻出手法（最近30回）", anchor: recent-positions}    # 生成：data/recent-abc.yaml（D5）。E（水）・F（青）・G（黄）ごとに、分類 → 代表ページ → その位置の最近の問題。F の最多の「言い換え」は reformulation が入口
      - {title: "色ごとのページの列", anchor: reading-order}                  # 生成：level・prerequisites・frequency から。色ごとに前提の順の1本の列（同順は分野の並び、次に frequency の順）にし、各行に分野を示す（D17）。必修（A）・準必修（B）・余裕があれば（C）の印。上位の色の節は「ページ#節」としてその色の列に出す（D1）
      - {title: "色ごとの練習の方法", anchor: practice}                       # 水は E、青は F（と難しい E）、黄は難しい F と易しい G。典型90問の★5／★6／★7、EDPC・NDPC、AAL、鉄則本の B・C
      - {title: "解いた数・理解した数", anchor: progress}                     # 生成：localStorage の記録と graph.json の問題 ID を色・分野ごとに集計した進捗バー。書き出し・読み込みは how-to-use#backup
      - {title: "シラバスではないこと", anchor: not-a-syllabus}               # ロードマップにない知識も出題される
    merged_keys: []
    visual: null
    problems: []
    sources: ["00-curriculum §4.1（色別ロードマップ）", "00-curriculum §6.11", "00-curriculum §2.2.3", "00-curriculum §2.2.4", "00-curriculum §2.3.6", "00-curriculum §2.3.7", "00-curriculum §2.3.8", "10-tech §3.10", "design-review D1・D5・D17", "review/01-learner 指摘3・16"]

