    signs: []
    acl: []
    sections:
      - "引き方：制約から許される計算量を逆算し、候補の手法を疑う。制約は作問の都合で緩いこともあるので囚われすぎない（手書き）"
      - "1秒あたりの演算回数の目安（約 10^8〜10^9 回。定数倍・メモリアクセスで変わる。AtCoder の GCC 15.2・-O2 での実測の例を添える）（手書き）"
      - "制約 → 許される計算量 → 候補の手法の表（N ≤ 10、20、40、80、500、5000、2×10^5、10^6、10^7、10^12、10^18）（骨格は手書き）"
      - "各行の候補のページの一覧（生成：各ページの signs の constraint を N の帯ごとに集める）"
      - "N = 2×10^5 のときの量の目安（log₂N ≈ 17.6、N log N ≈ 3.5×10^6、N log² N ≈ 6.2×10^7、N√N ≈ 8.9×10^7、N² = 4×10^10）（手書き）"
      - "値や複数の制約から読めるサイン（値が 10^9 なら座標圧縮、値が 10^6 なら配列の添字、Q 個のクエリ、ΣN ≤ 2×10^5 の多重テストケース、小さい K・小さい mod）（手書き）"
      - "見た目より速い・遅い計算量（調和級数、2乗の木 DP、累積 OR の値の種類、鳩の巣原理による打ち切り、set への std::lower_bound）（手書き）"
      - "計算量から手法の候補を引く逆向きの表（O(log N)、O(√N)、O(N)、O(N log N)、O(N log² N)、O(N√N)、O(N²)、O(N³)、O(2^N N)、O(3^N)、O(N!)）（手書き）"
      - "早見表（計算量と制約）・計算量の見積もりのページとの相互リンク（手書き）"
    merged_keys: []
    visual: "手書き：横軸に N（対数目盛）、縦に計算量のクラスを並べ、1秒の線を引いた図（SVG）。各セルから手法のページへリンク。生成：制約のサインから集めたページの一覧表"
    problems: []
