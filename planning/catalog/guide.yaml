      - {title: "分野ごとの表示", anchor: by-field}                          # 生成：既定の表示（design-review T2）。graph.json と Cytoscape.js＋dagre
      - {title: "全体の図", anchor: overview}                                # 生成：15 分野を点にした図。分野を選ぶと分野ごとの表示へ
      - {title: "選んだページの前提と次に読むページ", anchor: focus}          # 生成：ページから開くと、そのページの祖先と子孫だけを表示する
      - {title: "理解したページと次の候補", anchor: progress}                 # 生成：localStorage の「理解した」（ページ×色）と突き合わせ、前提をすべて理解した未読のページを強調する
      - {title: "表で見る", anchor: as-table}                                # 生成：同じ内容をレベル別一覧の表で（地図を読めない環境・スマホ向け）
