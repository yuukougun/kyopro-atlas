      - {title: "総和を求める", anchor: shape-sum}                             # 第1版の thinking/observation-hub から受けた「問題の形 → 試す型」の表の行：寄与（contribution）・bit ごと（bitwise-independence）・対称性（symmetry-pigeonhole-casework#symmetry）
