    summary: "提出前の確認と、WA・TLE・RE・MLE の症状ごとに疑う原因を順に並べたチェックリスト。各項目から C++ 章の落とし穴や手法のページの詳しい説明へリンクする。"
    signs: []
    acl: []
    sections:
      - "提出前の確認：サンプルを全部、自作の小さいケース（N=1・全部同じ値・境界の値）、最大ケースの時間・メモリ・あふれ、提出する言語（手書き）"
      - "WA：出力形式、端のケース、多重テストケースの初期化漏れ、オーバーフローと mod の取り忘れ、負の数の割り算、浮動小数点の比較、添字の取り違えと ±1、処理や入力の順序、証明していない貪欲、STL の仕様の誤解（multiset の erase など）（手書き）"
