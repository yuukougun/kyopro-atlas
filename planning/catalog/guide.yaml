      - {title: "操作できるか・最小回数", anchor: shape-operation}               # 不変量（invariant）・偶奇（parity）・後ろから（reverse-thinking）・周期（periodicity）
      - {title: "最大・最小", anchor: shape-optimize}                           # 上界と構築（construction）・答えの二分探索（binary-search-answer）・貪欲（greedy-basics）
