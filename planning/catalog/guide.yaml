  - id: cheatsheet
    title: 早見表
    aliases: [チートシート, 一覧表, 計算量の目安, 1秒で回る回数, 数の目安, 公式集]
    type: guide
    level: null
    kind: [案内]
    prerequisites: []
    related: [reverse-index-constraints, notation, glossary, cpp-integer-overflow, stl-containers, acl-reading, mod-arithmetic, bit-operations, twelvefold-way]
    summary: "コンテスト中や解説を読むときにすぐ引く数字と公式の表。計算量と制約、型の範囲、数の目安、STL と ACL の計算量、mod の性質、よく使う公式、bit 演算の小技を節ごとに並べ、各行から詳しいページへリンクする。本文と並行して育てる。"
    signs: []
    acl: []
    sections:
      - "計算量と制約（cheatsheet-complexity を統合）：1秒の目安、N = 2×10^5 のときの量。逆引き辞典（制約から）と相互リンク（手書き）"
      - "型の範囲とオーバーフローの境目（int・long long・unsigned long long・__int128・double・long double。12! と 13!、20! と 21!、C(66,33)、F_92）（手書き）"
      - "数の目安（10^9・10^18 以下の約数の個数の最大 1344・103680、異なる素因数の個数の最大、素数の個数 π(10^k)、分割数、カタラン数、2^20・3^15）（手書き。値はスクリプトで計算して確かめる）"
      - "STL の計算量（vector・deque・set/map・unordered 系・priority_queue・sort・lower_bound。set に std::lower_bound は O(N)）（手書き）"
      - "ACL の機能と計算量（fenwick_tree・segtree・lazy_segtree・string・math・convolution・modint・dsu・maxflow・mincostflow・scc・two_sat）（手書き）"
      - "mod の性質（998244353 = 119·2^23 + 1 と原始根 3、% の負の値、逆元が存在する条件、階乗の前計算、小さい素数の mod では Lucas の定理へ）（手書き）"
      - "よく使う公式（等差・等比数列の和、二乗和、二項係数の和、写像12相、gcd·lcm = ab、次数の和 = 2×辺数、E[X] = Σ P(X ≥ k)、内積・外積、調和級数）（手書き）"
      - "bit 演算の小技（全体集合、部分集合の列挙 s = (s−1)&A、最下位ビット x&−x、popcount、k 要素の部分集合の列挙）（手書き）"
      - "C++ の版と GCC の対応・INF の候補（C++ 章の早見表へリンク）（手書き）"
    merged_keys: [cheatsheet-complexity]
    visual: "手書き：表のみ。数値は tools/ に置く確認用のスクリプトで計算して確かめる。生成する部分はない"
    problems: []
