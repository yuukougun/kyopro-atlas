  - id: debugging-checklist
    chapter: コンテストと考察
    title: WA・TLE・RE・MLE の原因チェックリスト
    aliases: [デバッグ, バグの探し方, WA の原因, TLE の原因, 提出前の確認]
    type: guide
    level: null
    kind: [案内, 実装・C++]
    prerequisites: []
    related: [stress-testing, cpp-reverse-index#symptoms, cpp-integer-overflow, cpp-undefined-behavior#debug-build, cpp-io#tle-causes, cpp-types-literals#floating-point, cpp-environment#stack-depth, cpp-container-idioms, integer-division]
    summary: "提出前の確認と、WA・TLE・RE・MLE の症状ごとに疑う原因を順にたどれる。各項目から C++ 章の落とし穴や手法のページへつなぐ。"
    signs: []
    acl: []
    sections:
      - {title: "提出前の確認", anchor: before-submit}                         # サンプルを全部、自作の小さいケース（N=1・全部同じ値・境界の値）、最大ケースの時間・メモリ・あふれ、提出する言語
      - {title: "WA のとき", anchor: wa}                                       # 出力形式、端のケース、多重テストケースの初期化漏れ、オーバーフローと mod の取り忘れ、負の数の割り算、浮動小数点の比較、添字の取り違えと ±1、処理や入力の順序、証明していない貪欲、STL の仕様の誤解（multiset の erase など）
      - {title: "一部だけ落ちるか、多くが落ちるか", anchor: partial}             # 一部ならコーナーケース、多くなら解法そのものを疑う
      - {title: "TLE のとき", anchor: tle}                                      # 計算量の見積もり違い、不要なコピー、入出力の速さ（endl など）、ダイクストラで古い値を飛ばしていない、set への std::lower_bound、ハッシュの衝突
      - {title: "RE のとき", anchor: re}                                        # 配列外参照、0 除算、深すぎる再帰、無効になった反復子、比較関数に <=。-fsanitize と _GLIBCXX_DEBUG で見つける
      - {title: "MLE のとき", anchor: mle}                                      # メモリの見積もり（int の配列 10^8 個で約 400MB）、テストケースごとの確保
      - {title: "手元と AtCoder で結果が違う", anchor: local-vs-judge}             # 未初期化変数・未定義動作・スタックの大きさ（C++ 章の症状からの逆引きへ）
      - {title: "最後の手段", anchor: last-resort}                              # 元のコードを残して書き直す、愚直解と比べる（誤読していると愚直解とも一致する点に注意）→ stress-testing
    merged_keys: []
    visual: {kind: static, priority: 2, text: "症状（WA・TLE・RE・MLE）→ 疑う順の分岐図（Mermaid）。各項目から C++ 章の落とし穴のページへリンク"}
    problems: []
    sources: ["00-curriculum §4.1（WA・TLE・RE・MLE の原因チェックリスト）", "00-curriculum §6.6", "09-cpp §6.2", "03-graph §6.5", "06-math-nt §7.3"]

  - id: stress-testing
    chapter: コンテストと考察
    title: ストレステストと実験
    aliases: [ランダムテスト, 愚直解との比較, 実験, OEIS, 撃墜ケース探し]
    type: guide
    level: null
    kind: [案内, 実装・C++]
    prerequisites: []
    related: [debugging-checklist, thinking-checklist#q-small-cases, counting-mindset, interactive, cpp-math-functions#random]
    summary: "WA の原因が見つからないときに、愚直解と本解を小さいランダムな入力で比べて反例を探せる。小さいケースの全探索で表を作り、規則を予想する実験の手順も示す。"
    signs: []
    acl: []
    sections:
      - {title: "ストレステストの手順", anchor: procedure}                     # 明らかに正しい愚直解 → 小さい入力の生成器（N は 5〜10、値は 20 程度まで）→ 生成・実行・比較を繰り返し、不一致で止める → 反例を手で追う。スクリプト全体は載せず処理の流れを書く
      - {title: "書き方の形", anchor: setups}                                  # 1つのプログラムに本解と愚直解を入れる／シェルのループと diff／online-judge-tools（oj）の生成とテスト
      - {title: "生成器のコツ", anchor: generators}                            # 互いに異なる値、木は Union-Find でつないで作る、Yes になる入力も必ず作る、答えが複数ならチェッカーで判定
      - {title: "注意", anchor: caveats}                                       # 完全なランダムは 0 や 2 の冪などのコーナーケースを逃すので小さい範囲は全数テストにする。愚直解の方が誤っていることもある。本番の前に練習しておく
      - {title: "実験で規則を予想する", anchor: experiment}                      # 第1版の thinking/observation-hub の実験（experiment）を受けた本体：小さいケースの答えの表 → 周期・単調性・公式を予想 → OEIS で調べる → 証明するかストレステストで確かめてから使う。数え上げの検算は counting-mindset。本文の例に abc165_d（math の integer-division の練習）・abc380_d を参照してよい
      - {title: "インタラクティブ問題を手元で試す", anchor: interactive}         # ジャッジ役のプログラム → misc/interactive
    merged_keys: [experiment]
    visual: {kind: static, priority: 2, text: "生成器 → 愚直解・本解 → 比較 のループの図（Mermaid）"}
