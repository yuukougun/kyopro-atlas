    summary: "コンテスト中や解説を読むときに、計算量と制約、型の範囲、数の目安、STL と ACL の計算量、mod の性質、よく使う公式、bit 演算の小技をすぐ引ける。各行から詳しいページへつなぐ。"
    signs: []
    acl: []
    sections:
      - {title: "計算量と制約", anchor: complexity-and-constraints}             # cheatsheet-complexity を統合。1 秒の目安、N = 2×10^5 のときの量。reverse-index-constraints と相互リンク
      - {title: "型の範囲とオーバーフローの境目", anchor: type-limits}            # int・long long・unsigned long long・__int128・double・long double。12! と 13!、20! と 21!、C(66,33)、F_92
      - {title: "数の目安", anchor: magnitudes}                                 # 10^9・10^18 以下の約数の個数の最大 1344・103680、異なる素因数の個数の最大、π(10^k)、分割数、カタラン数、2^20・3^15。値は tools/ の確認用スクリプトで計算して確かめる
      - {title: "STL の計算量", anchor: stl}                                    # vector・deque・set/map・unordered 系・priority_queue・sort・lower_bound。set に std::lower_bound は O(N)
      - {title: "ACL の機能と計算量", anchor: acl}                               # fenwick_tree・segtree・lazy_segtree・string・math・convolution・modint・dsu・maxflow・mincostflow・scc・two_sat
      - {title: "mod の性質", anchor: mod}                                      # 998244353 = 119·2^23 + 1 と原始根 3、% の負の値、逆元が存在する条件、階乗の前計算、小さい素数の mod では Lucas の定理へ
      - {title: "よく使う公式", anchor: formulas}                               # 等差・等比数列の和、二乗和、二項係数の和、gcd·lcm = ab、次数の和 = 2×辺数、E[X] = Σ P(X ≥ k)、内積・外積、調和級数。写像12相は twelvefold-way へのリンクだけ（01 指摘10）
      - {title: "bit 演算の小技", anchor: bit-tricks}                            # 全体集合、部分集合の列挙 s = (s−1)&A、最下位ビット x&−x、popcount、k 要素の部分集合の列挙
      - {title: "C++ の版と GCC・INF の候補", anchor: cpp}                        # C++ 章の早見表へリンク
