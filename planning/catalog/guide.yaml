# 横断ページ（guide）の目次。担当 I。規則は planning/catalog/README.md（第2版）、上位の規則は planning/design.md と planning/design-review.md。
# - research/00 §3.1 の横断ページ（kind: cross）の18項目のうち、start に置く3つ（how-to-use・notation・atcoder-system）を除いた14ページと、
#   用語の索引（term-index。design-review T3）の15ページ。cheatsheet-complexity は cheatsheet の節。「C++ の逆引き」は cpp（担当 H）が持つ。
#   レベル別・種類別の一覧、ホーム、分野の入口は生成物（design-review T14）で catalog に含めない。
# - guide は level・frequency を持たない（level: null）。節の level も持たない。問題も持たない。
# - 節の行末の「# 生成：…」は tools/gen_site.py が書く部分（目印 <!-- gen:begin 名前 --> 〜 <!-- gen:end --> の間。design-review T17）と
#   その材料。印のない節は手書き。ほかの行末のコメントは執筆の指示の補足（節の題名は見出しになるので短くした）。
# - 第2版（2026-10-21）：
#   - thinking の observation-hub の「問題の形 → 試す型」の表と「ほかの型の行き先」を thinking-checklist に受けた（考察の入口はこの1ページ。D7）。
#     実験（experiment）は stress-testing を本体にした（01 指摘9）
#   - graph の shortest-path-overview を method-comparison の最短路の節に受けた（D6・03 指摘8）
#   - roadmap・problem-sets に data/recent-abc.yaml（D5）からの生成の節、reverse-index-signs に「立てた式の形から」の生成の節（D9）を足した
#   - 用語の索引（term-index）を足した（T3）。章を4つに分けた（辞書の入口を先に置く）
# - research/00 の gap・gap-candidate の key の受け渡し（moved）はこのファイルの末尾にまとめた。題材別に置く bracket-sequence・mex は patterns.yaml が持つ。
field: guide
pages:
  # ===== 章：辞書として引く =====
  - id: reverse-index-signs
    chapter: 辞書として引く
    title: 逆引き辞典（言い回しから）
    aliases: [問題文のサイン, キーワードから解法, 典型の言い換え一覧, 言い回しから逆引き, 式の形から逆引き]
    type: guide
    level: null
    kind: [案内]
    prerequisites: []
    related: [reverse-index-constraints, term-index, thinking-checklist, method-comparison, dp-speedup-overview, interval, subsequence-and-substring, permutation, bracket-sequence, mex, kth-and-median, xor, divisors-and-multiples, grid, operation-sequence, debugging-checklist, stress-testing, cpp-reverse-index]
    summary: "問題文の言い回しや求めるもの、立てた式の形から、疑う手法とページを引ける。表は各ページのサインから生成し、どれから疑うかの注記を手で添える。"
    signs: []
    acl: []
    sections:
      - {title: "引き方と注意", anchor: how-to-read}                         # サインは疑う候補の入口で、決め手ではない。まず誤読を疑う（→ thinking-checklist#q-misreading）。名前を知っていれば用語の索引へ
      - {title: "言い回しから引く", anchor: by-phrase}                       # 生成：各ページの signs（phrase）。サイン → 疑う手法 → ページ の表を、kind から決めたカテゴリ（最適化・探索／区間・列／数え上げ・確率／グラフ・木／整数／文字列／ゲーム・操作・その他）のタブに分ける
      - {title: "立てた式の形から引く", anchor: by-shape}                     # 生成：各ページの signs（shape）（design-review D9）。DP の遷移の形は dp-speedup-overview の表と同じ材料
      - {title: "1 つのサインに複数の手法が当たるとき", anchor: disambiguation}  # どれから疑うかと見分け方（最小値の最大化 → まず答えの二分探索、単調性がなければ DP。区間に加算 → 最後にまとめて見るならいもす法、更新と質問が交互なら遅延セグメント木）
      - {title: "題材から引く", anchor: by-topic}                             # 区間・部分列と部分文字列・順列・括弧列・mex・K 番目と中央値・XOR・約数と倍数・グリッド・操作列 → 題材別のページ
      - {title: "状況から引く", anchor: by-situation}                         # 方針が立たない → thinking-checklist、サンプルは合うのに WA → debugging-checklist、規則がありそう → stress-testing#experiment、C++ の書き方・エラーから → cpp-reverse-index
    merged_keys: []
    visual: null
    problems: []
    sources: ["00-curriculum §4.1（逆引き辞典（言い回し・サインから））", "00-curriculum §6.2", "01-basics §6.2", "02-dp §6.1", "03-graph §6.1", "04-tree §6.1", "05-ds §6.3", "06-math-nt §6.1", "07-math-comb §6.1", "08-string-geo §6.1", "design-review D9"]

  - id: reverse-index-constraints
    chapter: 辞書として引く
    title: 逆引き辞典（制約・計算量から）
    aliases: [制約から解法を推測する, 計算量の目安, 制約と計算量の対応表, 制約から逆引き, 計算量から逆引き]
    type: guide
    level: null
    kind: [案内]
    prerequisites: []
    related: [reverse-index-signs, cheatsheet#complexity-and-constraints, complexity-estimation, harmonic-sum, cpp-io#tle-causes]
    summary: "N の上限などの制約から、間に合う計算量と候補の手法を引ける。計算量から手法を引く逆向きの表も持ち、制約の帯ごとの候補のページは各ページの制約のサインから生成する。"
    signs: []
    acl: []
    sections:
      - {title: "引き方と注意", anchor: how-to-read}                         # 制約から許される計算量を逆算し、候補の手法を疑う。制約は作問の都合で緩いこともあるので囚われすぎない
      - {title: "1 秒あたりの演算回数の目安", anchor: ops-per-second}         # 約 10^8〜10^9 回。定数倍・メモリアクセスで変わる。AtCoder の GCC 15.2・-O2 での実測の例を添える
      - {title: "制約 → 計算量 → 候補の手法", anchor: constraint-table}       # N ≤ 10、20、40、80、500、5000、2×10^5、10^6、10^7、10^12、10^18 の行。骨格は手書き
      - {title: "制約の帯ごとの候補のページ", anchor: pages-by-constraint}     # 生成：各ページの signs（constraint）を N の帯ごとに集める
      - {title: "N = 2×10^5 のときの量の目安", anchor: magnitudes}            # log₂N ≈ 17.6、N log N ≈ 3.5×10^6、N log² N ≈ 6.2×10^7、N√N ≈ 8.9×10^7、N² = 4×10^10
      - {title: "値や複数の制約から読めるサイン", anchor: value-signs}         # 値が 10^9 なら座標圧縮、10^6 なら配列の添字、Q 個のクエリ、ΣN ≤ 2×10^5 の多重テストケース、小さい K・小さい mod
      - {title: "見た目より速い・遅い計算量", anchor: deceptive}               # 調和級数、2 乗の木 DP、累積 OR の値の種類、鳩の巣原理による打ち切り、set への std::lower_bound
      - {title: "計算量から手法を引く", anchor: complexity-to-methods}         # O(log N)、O(√N)、O(N)、O(N log N)、O(N log² N)、O(N√N)、O(N²)、O(N³)、O(2^N N)、O(3^N)、O(N!) の逆向きの表
    merged_keys: []
    visual: {kind: static, priority: 2, text: "横軸に N（対数目盛）、縦に計算量のクラスを並べ、1 秒の線を引いた図（SVG）。各セルから手法のページへリンク"}
    problems: []
    sources: ["00-curriculum §4.1（逆引き辞典（制約・計算量から））", "00-curriculum §6.1", "01-basics §6.1", "02-dp §6.1", "03-graph §6.1", "05-ds §6.3", "06-math-nt §6.1"]

