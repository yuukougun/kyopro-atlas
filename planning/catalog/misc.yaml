open_issues:
  - "bitset の分担：設計 §4.2（bitset による高速化は misc、dp・graph からリンク）について、dp.yaml は dp-bitset を subset-sum の節（黄）に、graph.yaml は reachability-bitset を単独ページ（黄、前提に bitset-speedup）に置いた。misc の bitset-speedup はワード並列の一般論と、三角形・共通の隣接頂点・偶奇の集計などの型を持ち、部分和と到達可能性は節の見出しで相手のページへ案内する（例題 typical90_bg・abc287_h は graph に任せた）。dp.yaml の open_issues と同じ分担（担当 B と同時に書いたため途中で一度食い違った）。設計 §4.2 の「リンク」をこの分担と読んでよいか、reachability-bitset を単独ページで残すかを見直しで確かめてほしい"
  - "parsing（構文解析）は research/08 では文字列の項目だが、catalog 作成の指示に従い misc に置いた（string.yaml は moved で misc に送っている）。設計 §2.1 の misc の中身（インタラクティブ・乱択・bitset）には構文解析がないので、設計書の表に足すか、文字列に戻すかを見直しで決めてほしい。レベルは研究どおり青、frequency は ABC で稀なので C"
  - "interactive は形式だけなら灰〜緑から出るが、設計が要る問題は水〜黄に散らばるので研究どおり水とし、節にレベルの印を付けた。research/01 の interactive-binary-search（基礎）もこのページの節にした"
  - "parsing は練習の候補が abc380_b（易しい字句解析）の 1 問だけ（設計 §5.3 の目安は 2〜6）。ABC で構文解析が要る問題が少なく、調査で裏付けの取れた候補がないため。執筆時に探して足す"
