# その他の技法（misc）の目次。規則は planning/catalog/README.md、上位の規則は planning/design.md §3〜§5。
# 主な材料：research/08 の「その他」（インタラクティブ・乱択・bitset）と構文解析（担当 G が moved で送る）、
# research/01 の interactive-binary-search。bitset の応用のうち DP（research/02 の dp-bitset）は dp の subset-sum の節、
# 到達可能性（research/03 の reachability-bitset）は graph の単独ページが持ち、どちらもこのファイルの bitset-speedup にリンクする。
# research/08 の constant-factor は basics の complexity-estimation の節に入れた。
field: misc
pages:
  - id: interactive
    title: インタラクティブ問題
    aliases: [対話型, インタラクティブ, ジャッジとの対話, flush, 質問回数, インタラクティブの二分探索]
    type: technique
    level: 水
    level_evidence: "形式だけなら abc244_c（165）・abc299_d（684）・abc269_e（1030）・abc337_e（1155）と灰〜緑から出る。質問の設計が要るのは abc305_f（1420）・abc313_d（1630）・abc282_f（1734）・abc286_f（1841）・abc355_e（2299）で水〜黄。研究どおり水とし、易しい型から順に並べて節にレベルの印を付ける"
    kind: [二分探索, 実装・C++]
    prerequisites: [binary-search]
    related: [cpp-io, interactive-games, crt, tree-diameter, dfs, stress-testing]
    summary: "プログラムが質問を出力し、ジャッジの答えを入力として受け取る形式の問題。質問回数の上限から方針を逆算し（2 択の質問なら ⌈log2 候補数⌉ 回）、出力のたびに flush する。"
    signs:
      - {type: phrase, text: "問題文に「インタラクティブ」「質問は Q 回まで」とある"}
      - {type: phrase, text: "質問の答えが入力として返ってくる・入出力例が対話の形"}
      - {type: constraint, text: "質問回数の上限が 20 回など log2 N 程度"}
    acl: []
    frequency: B
    sections:
      - "形式と C++ の作法（出力のたびに flush・cin.tie(nullptr) を書いたとき）（基礎）"
      - "回数の上限から方針を逆算する（情報量の下界）"
      - "二分探索で候補を半分ずつ減らす（基礎）"
      - "2 進表記で質問を設計する"
      - "未知のグラフを探索する（DFS の行きと帰り）"
      - "連立方程式・中国剰余定理で特定する（青）"
      - "先に構造を出力してから答える（青）"
      - "適応的ジャッジ（最悪の場合の回数で考える）"
      - "手元でのテスト（ジャッジ役のプログラムとパイプでつなぐ）"
    merged_keys: [interactive-binary-search]
    visual: "静的な図：ジャッジとプログラムのやりとりのシーケンス図（Mermaid）と、質問ごとに候補が半分になる図"
    problems:
      - {id: abc299_d, role: example, summary: "先頭が 0・末尾が 1 の隠れた 01 列で、隣と値が異なる位置を 20 回の質問の二分探索で見つける"}
      - {id: abc337_e, role: example, summary: "N 本中 1 本の腐ったジュースを最少人数で特定する。番号の 2 進表記の各ビットを友人に割り当てる"}
      - {id: abc305_f, role: example, summary: "隣接頂点だけ分かるグラフで 2N 回以内の移動で頂点 N へ行く。DFS の行きと帰りで各辺を高々 2 回通る"}
      - {id: abc244_c, role: practice, summary: "1〜2N+1 を交互に言い合うゲームをジャッジと行う（入出力の作法の練習）"}
      - {id: practice_2, role: practice, summary: "比較の質問で N 個を並べる。N=26 は 100 回でマージソート、N=5 は 7 回の専用の手順（7 回で 128 通り ≥ 5! = 120 通り）"}
      - {id: abc269_e, role: practice, summary: "ルークの置かれていない行と列を、長方形内の個数を聞く質問で行と列それぞれ二分探索して特定する"}
      - {id: abc019_4, role: practice, summary: "2 頂点間の距離の質問で木の直径を求める。ある頂点から最も遠い頂点を探し、そこから再び最も遠い頂点を探す"}
      - {id: abc313_d, role: practice, summary: "ちょうど K 個（奇数）の XOR の質問 N 回で全要素を特定する。最初の K+1 個を 1 つずつ除いた質問で連立する"}
      - {id: abc282_f, role: challenge, summary: "先に区間を出力し、後から来る [L, R] を 2 区間の和で答える。長さ 2^k の区間を用意する（Sparse Table と同じ形）"}
      - {id: abc286_f, role: challenge, summary: "関数グラフを出力し、K 回たどった結果から N を当てる。互いに素な長さの閉路と中国剰余定理"}
      - {id: abc355_e, role: challenge, summary: "二進区間の和だけ聞けるとき、最少回数で区間和を求める。区間の端点を頂点とするグラフの最短路で質問を選ぶ"}
    sources: ["08-string-geo §4.9", "08-string-geo §5（その他）", "08-string-geo §6.3", "08-string-geo §7.3", "01-basics §4.C", "01-basics §5"]

  - id: randomized
    title: 乱択アルゴリズム
    aliases: [乱択, ランダム化, モンテカルロ法, ラスベガス法, mt19937, 過半数, Boyer–Moore の投票, Color Coding]
    type: technique
    level: 青
    level_evidence: "abc339_f（1716）・abc272_g（2187）・abc238_g（2254）・abc447_g（2391）。水の上端に abc422_e（1580）。最近は abc455_g（3092、乱択ハッシュ）のように G で道具として使われる"
    kind: [ハッシュ・乱択]
    prerequisites: [probability-basics]
    related: [hash-safety, hashing-for-sets, rolling-hash, cpp-random-chrono, min-enclosing-circle, bit-dp]
    summary: "乱数を使って、一定の確率で誤るが速い方法（モンテカルロ法）や、常に正しいが時間が確率的な方法（ラスベガス法）を作る。成功確率 p の試行を k 回繰り返すと失敗確率は (1 − p)^k になるので、回数を見積もって決める。"
    signs:
      - {type: phrase, text: "半数を超える要素が条件を満たす（過半数）"}
      - {type: phrase, text: "決定的な方法が重く、確率的に正しければよい"}
      - {type: phrase, text: "ハッシュの mod や係数を実行時に決めたい（狙い撃ちを避ける）"}
      - {type: phrase, text: "少数の K 個の異なる要素を選ぶ条件を DP したいが、状態が多すぎる"}
    acl: []
    frequency: B
    sections:
      - "モンテカルロ法とラスベガス法"
      - "失敗確率の見積もりと試行回数（(1 − p)^k）"
      - "過半数の扱い（ランダムな 2 つを選ぶ・Boyer–Moore の投票）"
      - "ハッシュの乱択（mod・base を実行時に決める）"
      - "Color Coding（黄）"
      - "C++ の乱数（mt19937_64・時間計測）"
      - "焼きなましなどのヒューリスティックは ABC の範囲外（AHC）"
    merged_keys: [majority-element, color-coding]
    visual: "静的な図：試行回数 k と失敗確率 (1 − p)^k のグラフと、過半数投票で異なる 2 要素を打ち消していく様子"
    problems:
      - {id: abc422_e, role: example, summary: "過半数の点を通る直線があるか。ランダムな 2 点がその直線上にある確率は 1/4 以上なので、繰り返して検証する"}
      - {id: abc339_f, role: example, summary: "巨大整数の積の一致を数える。実行時にランダムに選んだ大きい素数の mod で比べる（固定の mod は対策されていた）"}
      - {id: abc272_g, role: practice, summary: "半数を超える要素が mod M で合同になる M ≥ 3 を探す。ランダムな 2 要素の差の約数を試す"}
      - {id: abc238_g, role: practice, summary: "区間積が立方数か。素因数ごとに乱数を割り当てたハッシュの累積和で判定する"}
      - {id: abc447_g, role: challenge, summary: "要素にランダムな色を割り当てて条件を単純にし、DP を繰り返す（Color Coding）"}
    sources: ["08-string-geo §4.9", "08-string-geo §5（その他）", "08-string-geo §6.2", "08-string-geo §6.3"]

  - id: bitset-speedup
    title: bitset による高速化
    aliases: [bitset, ビット並列, ワード並列, 1/64 倍, bitset で部分和]
    type: technique
    level: 青
    level_evidence: "abc258_g（1944）・abc348_f（1955）。黄に arc070_b（2015）・abc350_g（2058）・agc020_c（2259）、発展に abc221_g（2914）。DP の bitset（research/02 の dp-bitset、黄）は dp の subset-sum の節、到達可能性（research/03 の reachability-bitset、黄）は graph の単独ページが持つ"
    kind: [ビット演算, DP]
    prerequisites: [bit-operations, complexity-estimation]
    related: [subset-sum, reachability-bitset, cpp-bitset, gaussian-elimination, xor-basis, bit-dp]
    summary: "bool を 64 個ずつ 1 語に詰め、AND・OR・XOR・シフトを語単位で行って計算量をおよそ 1/64 にする。部分和 DP のシフト OR、共通の隣接頂点・三角形の数え上げ、偶奇の集計、到達可能性に使う。"
    signs:
      - {type: constraint, text: "N ≤ 2000〜5000 程度で、O(N^3) や O(N^2 M) が少し間に合わない"}
      - {type: phrase, text: "部分和が作れるか（和の上限が 10^5〜10^6）"}
      - {type: phrase, text: "共通の隣接頂点・三角形の数"}
      - {type: phrase, text: "偶奇（XOR）だけ分かればよい"}
    acl: []
    frequency: B
    sections:
      - "ワード並列の考え方と計算量の目安（N^3/64）"
      - "部分和 DP のシフト OR（dp |= dp << a。DP への使い方は部分和 DP のページの節）（黄）"
      - "共通の隣接頂点・三角形の数（行の AND と popcount）"
      - "偶奇だけの集計（XOR）"
      - "到達可能性・推移閉包（グラフの章の単独ページへ）（黄）"
      - "C++ の作法（大きさはコンパイル時の定数・大きな bitset をスタックに置かない）"
      - "bitDP との違い"
    merged_keys: []
    visual: "静的な図：64 個の bool を 1 語に詰める図と、シフト OR で作れる部分和の集合が広がる図"
    problems:
      - {id: abc258_g, role: example, summary: "N ≤ 3000 頂点のグラフの三角形の数。隣接行列の行を bitset にして AND の popcount を取る"}
      - {id: abc348_f, role: example, summary: "同じ値の列が奇数個ある行の組の数。(列, 値) ごとの行集合を bitset にして XOR で偶奇を集計する"}
      - {id: abc147_e, role: practice, summary: "グリッドの各マスで、赤と青の差として取り得る値の集合を bitset で持つ（普通の bool の DP でも通る）"}
      - {id: arc070_b, role: practice, summary: "不要なカードの枚数。部分和を bitset のシフト OR で求める（単調性と二分探索の解法もある）"}
      - {id: abc350_g, role: practice, summary: "森への辺の追加と、2 頂点の共通の隣接頂点のクエリ。隣接集合の bitset の AND で答える"}
      - {id: agc020_c, role: practice, summary: "全非空部分集合の和の中央値。bitset で作れる部分和を求め、総和の半分以上で最小のものを答える"}
      - {id: abc221_g, role: challenge, summary: "45 度回転で 2 軸を独立にし、bitset の部分和 DP と復元を行う"}
    sources: ["08-string-geo §4.9", "08-string-geo §5（その他）", "08-string-geo §6.3", "02-dp §4.B", "02-dp §5.1"]

  - id: parsing
    title: 構文解析（再帰下降・式の評価）
    aliases: [再帰下降構文解析, パーサ, BNF, 式の評価, 逆ポーランド記法]
    type: technique
    level: 青
    level_evidence: "ABC では稀。文法に沿った DP が abc403_f（1733）、本格的な構文解析が abc338_g（2573）。易しい字句解析は abc380_b（27）、式を作って評価する全探索は arc061_a（1089）"
    kind: [文字列]
    prerequisites: [recursion-structure]
    related: [bracket-sequence, stack-techniques, dp-basics, bit-full-search, cpp-stack-depth]
    summary: "式＝項 {(+|−) 項}、項＝因子 {(*|/) 因子}、因子＝数 | (式) のような文法の各規則を関数にし、読み取り位置を共有して再帰的に読む。演算子の優先順位と括弧が自然に扱え、文法に沿った DP の土台にもなる。"
    signs:
      - {type: phrase, text: "数式の文字列が与えられ、値を求める"}
      - {type: phrase, text: "+ と * と括弧の優先順位がある"}
      - {type: phrase, text: "式として正しい部分文字列"}
      - {type: phrase, text: "入れ子の構造を持つ文字列"}
    acl: []
    frequency: C
    sections:
      - "BNF と規則ごとの関数（読み取り位置を参照で共有する）"
      - "優先順位と括弧が扱える理由（構文木と呼び出しの木）"
      - "単項マイナス・空白などの例外"
      - "文法に沿った DP（青）"
      - "式の部分文字列の総和（発展）"
      - "深い入れ子と再帰の深さ"
    merged_keys: []
    visual: "静的な図：式の構文木と、規則ごとの関数の呼び出しの木が一致する様子"
    problems:
      - {id: arc061_a, role: example, summary: "数字の間に + を入れる全通りの式の値の合計。bit 全探索で式を作って評価する"}
      - {id: abc403_f, role: example, summary: "1 と + と * と括弧で N を表す最短の式。式・項・因子の文法に沿った DP（括弧が要るかを状態に持つ）"}
      - {id: abc380_b, role: practice, summary: "| と - からなる記号列を区切って長さを並べる（易しい字句解析）"}
      - {id: abc338_g, role: challenge, summary: "数字と + と * の式で、式として正しい部分文字列すべての値の和。項と因子の構造に沿って寄与を数える"}
    sources: ["08-string-geo §4.1", "08-string-geo §5（文字列）", "08-string-geo §6.1"]

