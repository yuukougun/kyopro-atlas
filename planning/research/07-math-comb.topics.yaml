# 07 数学（数え上げ・確率・ゲーム）の項目一覧
# 調査レポート planning/research/07-math-comb.md の §3〜§5 を機械で扱える形にしたもの。
# difficulty は tools/ap.py（AtCoder Problems の 2026-10-21 取得キャッシュ）の値。diff=なしは null。
# key は仮の識別子。prerequisites / compare_with のうち他分野の key は推測で書いている。
area: math-comb
topics:
- key: counting-mindset
  title: 数え上げの考え方（総論）
  aliases:
  - 数え上げの基本方針
  - 和の法則・積の法則
  - ちょうど1回数える
  level: 水
  level_evidence: 数え方の設計そのものが問われる問題が水色帯にまとまる：abc167_e (diff 1442)・abc133_e (diff 1505)・abc156_e (diff 1514)。和と積だけで済む abc185_c (diff 374) は茶色以下
  prerequisites:
  - modular-arithmetic
  acl: null
  signs:
  - 〜の個数を 998244353 で割った余り
  - 何通りあるか
  - すべての〜についての総和
  compare_with:
  - dp-basics
  page: own
  visual: 同じ対象を2通りの見方で数える図と、積の法則が成り立つか（次の段階の枝の数が一定か）を色分けした樹形図
  problems:
  - id: abc185_c
    difficulty: 374
    role: example
    summary: 長さ L の棒を正の長さの 12 本に切る方法を、11 か所の切れ目の選び方に言い換えて数える
    evidence: https://drken1215.hatenablog.com/entry/2020/12/14/015500
  - id: abc133_e
    difficulty: 1505
    role: example
    summary: 木の頂点を距離 2 以内が異なる色になるように塗る方法を、BFS 順に決めて積の法則で数える
    evidence: https://drken1215.hatenablog.com/entry/2019/07/08/002700
  - id: abc167_e
    difficulty: 1442
    role: practice
    summary: 隣り合う同色の組が K 個以下になる塗り方を、組の数 k ごとに二項係数と累乗の積で数えて足す
    evidence: https://kmjp.hatenablog.jp/entry/2020/05/10/0900
  - id: abc156_e
    difficulty: 1514
    role: practice
    summary: k 回の移動後にありうる各部屋の人数の組を、空き部屋の数で場合分けして重複組合せで数える
    evidence: https://kmjp.hatenablog.jp/entry/2020/02/23/0900
- key: counting-bijection
  title: 対応づけ・数える対象の言い換え
  aliases:
  - 全単射
  - 言い換え
  - 経路数に帰着
  level: 水
  level_evidence: abc145_d (diff 1009)（移動の回数の組に言い換え）・abc110_d (diff 1695)（素因数ごとの重複組合せへ）で必要。応用は arc058_b (diff 1905)・arc110_d (diff 2078) と青〜黄
  prerequisites:
  - counting-mindset
  - binomial-coefficient
  acl: null
  signs:
  - 単調な数列の個数
  - 切り分け方の数
  - 経路の数
  - 途中で負にならない列
  compare_with:
  - counting-dedup
  - lattice-paths
  page: own
  visual: 左に元の対象・右に言い換えた対象を並べて対応を線で結び、片方を変えるともう片方も変わる動く図
  problems:
  - id: abc145_d
    difficulty: 1009
    role: example
    summary: 2 種類のナイト移動で目的のマスに着く方法を、各移動の回数を連立方程式で決めてから並べ方の二項係数で数える
    evidence: https://drken1215.hatenablog.com/entry/2020/04/26/180000
  - id: abc110_d
    difficulty: 1695
    role: example
    summary: 積が M になる長さ N の数列を、素因数ごとに指数を N 個へ配る重複組合せの積に言い換える
    evidence: https://drken1215.hatenablog.com/entry/2018/09/23/224100
  - id: arc058_b
    difficulty: 1905
    role: practice
    summary: 左下の禁止された長方形を避ける格子路を、境界を越える位置で分類して数える
    evidence: https://drken1215.hatenablog.com/entry/2020/04/06/235844
  - id: arc110_d
    difficulty: 2078
    role: practice
    summary: 二項係数の積の総和を、1 本の格子路の数に言い換えて閉じた式にする
    evidence: https://drken1215.hatenablog.com/entry/2020/12/06/070100
- key: counting-complement
  title: 補集合で数える
  aliases:
  - 余事象
  - 全体から引く
  level: 基礎
  level_evidence: abc178_c (diff 653)・abc162_d (diff 757)・abc156_d (diff 1014) と茶〜緑で頻出。木のパスの色で使う abc163_f (diff 2470) は発展
  prerequisites:
  - counting-mindset
  acl: null
  signs:
  - 少なくとも1つ
  - 〜を含む
  - いずれかが
  compare_with:
  - inclusion-exclusion
  page: section-of:counting-mindset
  visual: 全体の長方形から条件を満たさない部分を切り取る図
  problems:
  - id: abc178_c
    difficulty: 653
    role: example
    summary: 0 と 9 を両方含む長さ N の数字列を、全体から 0 を含まない・9 を含まない場合を引いて（重なりを足し戻して）数える
    evidence: https://drken1215.hatenablog.com/entry/2020/10/09/162600
  - id: abc162_d
    difficulty: 757
    role: example
    summary: 色がすべて異なる 3 つ組の数から、添字が等間隔になっているものを引く
    evidence: https://drken1215.hatenablog.com/entry/2020/04/12/225900
  - id: abc156_d
    difficulty: 1014
    role: practice
    summary: n 本の花から作る花束のうち禁止された 2 つの本数を全体 2^n−1 から引く（n は巨大）
    evidence: https://drken1215.hatenablog.com/entry/2020/04/22/013400
  - id: abc163_f
    difficulty: 2470
    role: practice
    summary: 各色について、その色の頂点を通る単純パスの数を、全パス数からその色を避けるパス数を引いて求める
    evidence: https://kmjp.hatenablog.jp/entry/2020/04/20/0930
- key: counting-dedup
  title: 重複の除き方（割る・代表元を決める）
  aliases:
  - ダブルカウントを防ぐ
  - 正規形
  - 最左マッチ
  - 最小添字規則
  level: 青
  level_evidence: abc310_d (diff 1368) は易しめの入口、arc077_b (diff 1715)・abc171_f (diff 1795) と青帯で必須になる
  prerequisites:
  - counting-mindset
  - binomial-coefficient
  acl: null
  signs:
  - 異なる〜の個数
  - 操作で作れるものの種類数
  - 区別しない
  - 部分列として含む
  compare_with:
  - counting-bijection
  - burnside-lemma
  page: own
  visual: 同じ文字列に部分列が何通りにも埋め込める様子と、最も左の埋め込みだけを残す様子のステップ送り
  problems:
  - id: abc310_d
    difficulty: 1368
    role: example
    summary: 仲の悪い組を避けて N 人を T 組に分ける方法を、まだ組に入っていない最小番号の人から組を決めて重複なく数える
    evidence: https://drken1215.hatenablog.com/entry/2023/07/17/213800
  - id: arc077_b
    difficulty: 1715
    role: example
    summary: 1 つの値だけが 2 回現れる数列の、長さ k の異なる部分列の数を、重複して数えた分を引いて求める
    evidence: https://kmjp.hatenablog.jp/entry/2017/07/02/0900
  - id: abc171_f
    difficulty: 1795
    role: practice
    summary: 文字列 S を部分列として含む長さ N+K の文字列を、最も左で一致させる埋め込みで一意にして数える
    evidence: https://drken1215.hatenablog.com/entry/2020/06/27/125500
- key: counting-fix-order
  title: 順序を固定して数える
  aliases:
  - 相対順序
  - ソートしてから数える
  - 数える順番の工夫
  level: 水
  level_evidence: abc151_e (diff 1344)・abc133_e (diff 1505) で必要。木の上の順番を数える abc160_f (diff 2048) は黄
  prerequisites:
  - counting-mindset
  - binomial-coefficient
  acl: null
  signs:
  - 〜より先に
  - 順番の制約
  - 最大値（最小値）に注目
  - 木の頂点に番号を振る
  compare_with:
  - counting-contribution
  page: own
  visual: k 個の相対順序 k! 通りのうち 1 通りだけを残す図
  problems:
  - id: abc151_e
    difficulty: 1344
    role: example
    summary: ソートして各要素が最大・最小になる選び方の数を二項係数で数え、全 K 個組の max−min の総和を求める
    evidence: https://drken1215.hatenablog.com/entry/2020/01/12/224100
  - id: abc133_e
    difficulty: 1505
    role: example
    summary: 根から BFS 順に色を決めると各頂点の選択肢の数が一定になり、積の法則で数えられる
    evidence: https://drken1215.hatenablog.com/entry/2019/07/08/002700
  - id: abc160_f
    difficulty: 2048
    role: practice
    summary: 隣接する頂点から順に番号を書く方法の数（N!/Π 部分木サイズ）を、全頂点を始点として求める
    evidence: https://kmjp.hatenablog.jp/entry/2020/03/28/1030
- key: counting-at-most-difference
  title: 「ちょうど」を「以下」の差で数える
  aliases:
  - 累積で数える
  - K以上からK+1以上を引く
  level: 水
  level_evidence: 考え方は水色帯の数え上げで常用される（abc178_c (diff 653) も同じ構造）。前面に出る例は abc180_f (diff 2419)・arc100_c (diff 2111) と黄以上
  prerequisites:
  - counting-complement
  acl: null
  signs:
  - 最大値がちょうど K
  - 最大の〜がちょうど L
  - ちょうど K 個
  compare_with:
  - divisor-inclusion-exclusion
  - expectation-tail-sum
  page: section-of:counting-mindset
  visual: 「≤k」の集合が「=k」と「≤k−1」に分かれる入れ子の図
  problems:
  - id: abc180_f
    difficulty: 2419
    role: example
    summary: 最大の連結成分のサイズがちょうど L のグラフを、「L 以下」から「L−1 以下」を引いて数える
    evidence: https://drken1215.hatenablog.com/entry/2020/10/21/145700
  - id: arc100_c
    difficulty: 2111
    role: practice
    summary: 「i or j がちょうど K」の代わりに「K の部分集合」で最大値を求め、累積の max を取る
    evidence: https://drken1215.hatenablog.com/entry/2018/07/25/200000
- key: counting-contribution
  title: 全通りの総和を寄与で数える
  aliases:
  - 主客転倒
  - 寄与
  - 和の順序の交換
  level: 水
  level_evidence: abc186_d (diff 436) が入口、abc151_e (diff 1344)・abc150_e (diff 1851)・abc173_f (diff 1892)・abc127_e (diff 1938) と水〜青で頻出
  prerequisites:
  - counting-mindset
  - binomial-coefficient
  acl: null
  signs:
  - すべての〜についての総和
  - すべての選び方についての f の和
  compare_with:
  - indicator-variables
  - counting-fix-order
  page: section-of:counting-mindset
  visual: 二重和の表を行ごとに足す場合と列ごとに足す場合を切り替える図
  problems:
  - id: abc186_d
    difficulty: 436
    role: example
    summary: すべての 2 数の差の絶対値の総和を、ソート後の各要素に付く係数で求める
    evidence: https://drken1215.hatenablog.com/entry/2020/12/19/231000
  - id: abc127_e
    difficulty: 1938
    role: example
    summary: K 個のマスの選び方すべてについての距離の総和を、2 マスの組ごとの寄与 × 残りの選び方の数で求める
