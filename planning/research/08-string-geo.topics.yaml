area: string-geo
# 08 文字列・幾何・その他の項目一覧。詳細は 08-string-geo.md を参照。
# - 問題IDと difficulty は tools/ap.py（2026-10-21 のキャッシュ）で確認済み
# - evidence は内容の裏付けに使った第三者の解説（atcoder.jp は開いていない）
#   「（検索結果で確認）」は検索結果の要約だけで確認したもの
# - 05（データ構造）と重なる項目は 05 と同じ key を使った（binary-trie, hashing-for-sets）
topics:
  # ==================================================================
  # 文字列：基本
  # ==================================================================
  - key: string-basics
    title: 文字列の基本操作と辞書順
    aliases: [辞書順, 部分文字列と部分列, 文字列の比較, 文字の対応, アナグラム]
    level: 基礎
    level_evidence: "abc110_c (diff 949) 文字の置換の一貫性、abc042_b (616) 辞書順最小の連結、abc286_c (565) 回転と回文。ABC の A〜D で常連"
    prerequisites: [sorting]
    acl: null
    signs: ["辞書順で最小・最大", "部分文字列（連続）か部分列（連続でなくてよい）か", "文字を一斉に別の文字へ置き換える操作", "先頭を末尾に移す（回転）"]
    compare_with: [lexicographic-greedy, cyclic-shift]
    page: own
    visual: "2つの文字列を先頭から1文字ずつ照合し、最初に異なる位置で大小が決まる様子のステップ送り。接頭辞が小さいことを空文字との比較で示す"
    problems:
      - id: abc042_b
        difficulty: 616
        role: example
        summary: "同じ長さの文字列を全部つないだ結果を辞書順最小にする（ソートして連結。長さが違うと a+b<b+a の比較が必要）"
        evidence: "https://drken1215.hatenablog.com/entry/2024/08/04/012109"
      - id: abc286_c
        difficulty: 565
        role: practice
        summary: "回転（コスト A）と書き換え（コスト B）で回文にする最小コスト。回転回数を全探索"
        evidence: "https://drken1215.hatenablog.com/entry/2023/01/29/201129"
      - id: abc076_c
        difficulty: 846
        role: practice
        summary: "? を埋めて T を含む辞書順最小の文字列を作る。T を置く位置を全部試し残りの ? は a"
        evidence: "https://drken1215.hatenablog.com/entry/2025/01/22/125627"
      - id: abc110_c
        difficulty: 949
        role: example
        summary: "文字の一斉置換を繰り返して S を T にできるか。文字の対応が両方向に一意（全単射）かを調べる"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2018/0923_abc110"

  - key: lexicographic-greedy
    title: 辞書順最小の構築と辞書順 K 番目
    aliases: [辞書順最小, 辞書順 K 番目, 先頭から貪欲に決める, 連結順のソート]
    level: 基礎
    level_evidence: "abc202_d (966)、arc097_a (1108) は基礎帯。実現可能性の判定が重いもの（abc009_3 参考値 1915、abc225_f 2612）は青以上"
    prerequisites: [string-basics, binomial-coefficient]
    acl: null
    signs: ["辞書順最小のものを出力", "辞書順で K 番目", "条件を満たすもののうち辞書順最小（なければ -1）", "文字列を並べて連結した結果を最小に"]
    compare_with: [subsequence-matching, string-basics]
    page: own
    visual: "先頭の文字を a から順に仮置きし、残りで条件を満たせるかを判定して確定していくステップ送り。K 番目では各候補の個数を棒で示す"
    problems:
      - id: abc202_d
        difficulty: 966
        role: example
        summary: "a が A 個・b が B 個の文字列の辞書順 K 番目。先頭を a にしたときの個数（二項係数）と K を比べて1文字ずつ決める"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2021/0522_abc202"
      - id: arc097_a
        difficulty: 1108
        role: practice
        summary: "異なる部分文字列の辞書順 K 番目（K≤5）。長さ K 以下の部分文字列だけ列挙すれば十分と気づく"
        evidence: "https://drken1215.hatenablog.com/entry/2018/06/06/174000"
      - id: typical90_f
        difficulty: null
        role: example
        summary: "長さ K の部分列の辞書順最小。先頭から『残りで K 文字取れる範囲の最小の文字』を次の出現位置の表で選ぶ"
        evidence: "https://drken1215.hatenablog.com/entry/2021/10/10/195200"
      - id: abc009_3
        difficulty: 1915
        role: practice
        summary: "並べ替えで元と異なる位置が K 個以下の辞書順最小。各位置で小さい文字から試し、残りで実現できるかを数で判定"
        evidence: "https://drken1215.hatenablog.com/entry/2023/05/06/013800"
      - id: abc225_f
        difficulty: 2612
        role: practice
        summary: "K 個選んで連結した辞書順最小。a+b<b+a で並べた後に後ろから DP（単純な貪欲は誤り）"
        evidence: "https://merom686.hatenablog.com/entry/2021/10/30/235859"

  - key: run-length-encoding
    title: ランレングス圧縮（連続する同じ文字の塊）
    aliases: [RLE, 連長圧縮, 塊ごとに考える]
    level: 基礎
    level_evidence: "abc136_d (794)、abc140_d (1074)、abc124_d (1138) が基礎帯。abc421_d (1321) で水。道具として abc452_g (2255) でも使う"
    prerequisites: [two-pointers]
    acl: null
    signs: ["同じ文字が連続する部分", "区間を反転して連続する 1 を最長に", "塊の個数が操作で何個減るか", "ランレングスで与えられる入力"]
    compare_with: [two-pointers]
    page: own
    visual: "文字列を (文字, 長さ) の帯に変換する図。反転で塊が併合される様子のステップ送り"
    problems:
      - id: abc380_c
        difficulty: 223
        role: example
        summary: "0/1 の列で K 番目の 1 の塊を K−1 番目の直後へ移す。塊の列として扱う"
        evidence: "https://drken1215.hatenablog.com/entry/2024/11/17/012903"
      - id: abc136_d
        difficulty: 794
        role: practice
        summary: "R/L のマスで子どもが移動を繰り返した後の人数。RL の境目ごとに塊の長さの偶奇で振り分ける"
        evidence: "https://drken1215.hatenablog.com/entry/2020/12/29/190100"
      - id: abc140_d
        difficulty: 1074
        role: practice
        summary: "区間反転を K 回して幸福な人を最大化。1回の反転で塊の数が最大2減ることに着目"
        evidence: "https://drken1215.hatenablog.com/entry/2020/05/16/005300"
      - id: abc124_d
        difficulty: 1138
        role: example
        summary: "区間反転 K 回で連続する 1 を最長に。ランレングスにして 0 の塊 K 個分の窓を尺取り"
        evidence: "https://drken1215.hatenablog.com/entry/2019/04/14/222900"
      - id: abc421_d
        difficulty: 1321
        role: practice
        summary: "ランレングスで与えられた2人の移動で同じマスにいる回数を数える。塊ごとにまとめて処理"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2025/0830_abc421"

  - key: subsequence-matching
    title: 部分列判定と次の出現位置テーブル
    aliases: [部分列判定, nxt 配列, 次の出現位置, 部分列オートマトン, 序列自動機]
    level: 水
    level_evidence: "typical90_f（★5＝1200〜1599 相当）、abc452_d (903)、abc324_e (1153)。応用は abc346_f (1840)、arc081_c (2072)"
    prerequisites: [string-basics, binary-search]
    acl: null
    signs: ["T を部分列として含むか", "部分列として含まない最短の文字列", "辞書順最小の部分列", "S を何回も繰り返した文字列の部分列"]
    compare_with: [subsequence-dp, lexicographic-greedy]
    page: own
    visual: "後ろから nxt[i][c] の表を埋めるステップ送りと、T の各文字で表を引いて右へ飛ぶ照合のアニメーション"
    problems:
      - id: abc452_d
        difficulty: 903
        role: example
        summary: "T を部分列として含まない部分文字列の数。各位置から各文字の次の出現位置を前計算して始点ごとに数える"
        evidence: "https://merom686.hatenablog.com/entry/2026/04/05/005148"
      - id: abc324_e
        difficulty: 1153
        role: practice
        summary: "S_i+S_j が T を部分列に含む組の数。S_i で T の先頭から、S_j で末尾から何文字照合できるかを求めて数える"
        evidence: "https://drken1215.hatenablog.com/entry/2023/10/21/181937"
      - id: typical90_f
        difficulty: null
        role: example
        summary: "長さ K の部分列の辞書順最小を次の出現位置の表と貪欲で作る"
        evidence: "https://drken1215.hatenablog.com/entry/2021/10/10/195200"
      - id: abc346_f
        difficulty: 1840
        role: practice
        summary: "S を N 回並べた中に、T の各文字を k 回ずつ並べたものが部分列で入る最大の k。k を二分探索し文字ごとの累積個数で照合"
        evidence: "https://merom686.hatenablog.com/entry/2024/03/24/023206"
      - id: arc081_c
        difficulty: 2072
        role: practice
        summary: "A の部分列でない最短の文字列の辞書順最小。次の出現位置の表で後ろから DP"
        evidence: "https://drken1215.hatenablog.com/entry/2018/09/22/201000"

  - key: subsequence-dp
    title: 部分列の数え上げ（照合位置の DP・異なる部分列）
    aliases: [部分列 DP, 部分列の個数, 異なる部分列の数]
    level: 青
    level_evidence: "abc104_d (1739)、abc214_f (1973)。基本の照合位置 DP は typical90_h（★4）"
    prerequisites: [dp-basics, subsequence-matching]
    acl: null
    signs: ["部分列として何通り取り出せるか", "異なる部分列の個数", "? を置き換えた全通りについての和"]
    compare_with: [string-automaton-dp, subsequence-matching]
    page: "section-of:subsequence-matching"
    visual: "dp[i][j]（i 文字見て j 文字目まで照合）の表を埋めるステップ送り"
    problems:
      - id: typical90_h
        difficulty: null
        role: example
        summary: "S から atcoder を部分列として取り出す方法の数。何文字目まで照合したかを状態にする DP"
        evidence: "https://drken1215.hatenablog.com/entry/2022/04/01/121700"
      - id: abc104_d
        difficulty: 1739
        role: practice
        summary: "? を A/B/C に置き換えた全通りで ABC という部分列の数の和。照合位置を状態にした DP"
        evidence: "https://drken1215.hatenablog.com/entry/2018/08/05/224100_1"
      - id: abc214_f
        difficulty: 1973
        role: practice
        summary: "隣り合わない文字を選んでできる文字列の種類数。同じ文字列を二重に数えない異なる部分列の DP"
        evidence: "https://merom686.hatenablog.com/entry/2021/08/14/235615"

  - key: bracket-sequence
    title: 括弧列
    aliases: [正しい括弧列, カッコ列, 括弧の対応, 累積和の最小値]
    level: 水
    level_evidence: "基本は基礎帯（abc307_d 666、abc312_d 964）。順序の工夫やセグ木での判定は水〜青（abc407_e 1531、abc223_f 1641、abc167_f 1961）"
    prerequisites: [prefix-sum, stack-techniques]
    acl: "atcoder::lazy_segtree（区間加算・区間 min で区間の判定）"
    signs: ["正しい括弧列か", "括弧列を並べて正しくできるか", "区間が正しい括弧列か（更新あり）", "? を ( か ) にする方法の数"]
    compare_with: [segment-tree-monoids, catalan-number]
    page: own
    visual: "( を +1、) を −1 とした累積和の折れ線グラフ。0 を下回る位置で失敗、最後が 0 で成功。括弧列の連結では（最小値, 合計）の組をつなぐ図"
    problems:
      - id: typical90_b
        difficulty: null
        role: example
        summary: "長さ N の正しい括弧列を辞書順に全部出力。bit 全探索で作り累積和で判定"
        evidence: "https://drken1215.hatenablog.com/entry/2021/06/12/151200"
      - id: abc394_d
        difficulty: 253
        role: practice
        summary: "3種類の括弧の列が正しいか。スタックで対応をとる"
        evidence: "https://merom686.hatenablog.com/entry/2025/02/23/001649"
      - id: abc307_d
        difficulty: 666
        role: practice
        summary: "対応する括弧とその中身を取り除き続けた結果。開き括弧の位置をスタックで覚える"
        evidence: "https://drken1215.hatenablog.com/entry/2024/06/10/020153"
      - id: abc312_d
        difficulty: 964
        role: practice
        summary: "? を埋めて正しい括弧列にする方法の数。開いている括弧の数を状態にした DP"
        evidence: "https://merom686.hatenablog.com/entry/2023/07/30/020536"
      - id: abc407_e
        difficulty: 1531
        role: example
        summary: "値の和が最大になる正しい括弧列。先頭 i 文字に必要な ( の数の条件で言い換え、優先度付きキューで貪欲"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2025/0524_abc407"
      - id: abc223_f
        difficulty: 1641
        role: example
        summary: "2文字の交換と区間が正しい括弧列かの判定。累積和に区間加算・区間最小値の遅延セグ木"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2021/1017_abc223"
      - id: abc167_f
        difficulty: 1961
        role: practice
        summary: "N 個の括弧列を並べて正しくできるか。各列を（最小の累積和, 合計）に要約し、並べる順を工夫"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2020/0510_abc167"

  - key: parsing
    title: 構文解析（再帰下降・式の評価）
    aliases: [再帰下降構文解析, パーサ, BNF, 式の評価, 逆ポーランド記法]
    level: 青
    level_evidence: "ABC では稀。文法に沿った DP が abc403_f (1733)、本格的な構文解析が abc338_g (2573)。易しい字句解析は A/B（abc380_b 27）"
    prerequisites: [recursion, dp-basics]
    acl: null
    signs: ["数式の文字列が与えられる", "+ と * と括弧の優先順位", "式として正しい部分文字列", "入れ子の構造を持つ文字列"]
    compare_with: [bracket-sequence]
    page: own
    visual: "BNF の各規則を関数に対応させた呼び出しの木と、読み取り位置のポインタが進むステップ送り"
    problems:
      - id: abc380_b
        difficulty: 27
        role: practice
        summary: "|---|-| のような記号列を区切って長さを並べる（易しい字句解析）"
        evidence: "https://drken1215.hatenablog.com/entry/2024/11/17/011832"
      - id: arc061_a
        difficulty: 1089
        role: example
        summary: "数字の間に + を入れる全通りの式の値の合計。bit 全探索で式を作って評価"
        evidence: "https://drken1215.hatenablog.com/entry/2020/04/11/171900"
      - id: abc403_f
        difficulty: 1733
        role: example
        summary: "1 と + と * と括弧で N を表す最短の式。式・項・因子の文法に沿った DP（括弧が要るかを状態に持つ）"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2025/0427_abc403"
      - id: abc338_g
        difficulty: 2573
        role: practice
        summary: "数字と + と * の式の、式として正しい部分文字列すべての値の和。項と因子の構造に沿って寄与を数える"
        evidence: "https://drken1215.hatenablog.com/entry/2024/01/29/231906"

  - key: string-queries-ds
    title: 文字列へのクエリ（文字ごとの BIT・セグ木）
    aliases: [文字列のクエリ, 文字種ごとの BIT, 文字集合をビットで持つセグ木]
    level: 水
    level_evidence: "abc341_e (1223)、abc157_e (1443)、abc285_f (1876)"
    prerequisites: [segment-tree, fenwick-tree]
    acl: "atcoder::segtree / atcoder::fenwick_tree / atcoder::lazy_segtree"
    signs: ["1文字の更新と区間の問い合わせ", "区間に現れる文字の種類数", "区間がソート済みか"]
    compare_with: [hash-segment-tree, segment-tree-monoids]
    page: "section-of:segment-tree-monoids"
    visual: null
    problems:
      - id: abc341_e
        difficulty: 1223
        role: practice
        summary: "0/1 列の区間反転と、区間内で隣り合う文字がすべて異なるかの判定。隣接の一致を 0/1 にして遅延セグ木"
        evidence: "https://merom686.hatenablog.com/entry/2024/02/18/020947"
      - id: abc157_e
        difficulty: 1443
        role: example
        summary: "1文字の更新と区間の文字の種類数。文字の集合をビットで持つセグ木"
        evidence: "https://merom686.hatenablog.com/entry/2020/03/01/233522"
      - id: abc285_f
        difficulty: 1876
        role: practice
        summary: "1文字の更新と、区間が全体をソートした文字列の部分文字列か。文字ごとの BIT で個数と昇順かを確かめる"
        evidence: "https://merom686.hatenablog.com/entry/2023/01/16/011510"

  # ==================================================================
  # 文字列：ハッシュ
  # ==================================================================
  - key: rolling-hash
    title: ローリングハッシュ
    aliases: [Rabin-Karp, 多項式ハッシュ, ロリハ, 文字列ハッシュ]
    level: 水
    level_evidence: "abc141_e (1459)、abc284_f (1575)、typical90_au（★7。考察込み）。別解として abc430_e (1109)、abc150_f (2281)、abc135_f (2388)"
    prerequisites: [mod-arithmetic, prefix-sum, string-basics]
    acl: null
    signs: ["部分文字列どうしの一致判定を大量に行う", "N ≤ 10^5〜10^6 の文字列で同じ部分が現れるか", "最長の〜を二分探索で求めたい", "回文かを多数判定"]
    compare_with: [z-algorithm, kmp, suffix-array, manacher, hash-safety]
    page: own
    visual: "接頭辞のハッシュ表から h[r] − h[l]·B^(r−l) で部分文字列のハッシュを取り出す図。窓を1文字ずつずらすステップ送り"
    problems:
      - id: abc430_e
        difficulty: 1109
        role: practice
        summary: "A を何回回転すると B になるか。A+A の中で B を最初に見つける（ハッシュ・Z・KMP のどれでも）"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2025/1101_abc430"
      - id: abc141_e
        difficulty: 1459
        role: example
        summary: "重ならずに2回現れる部分文字列の最大長（N≤5000）。長さを二分探索しハッシュで重複判定。DP・Z・SA でも解ける比較用の題材"
        evidence: "https://drken1215.hatenablog.com/entry/2019/09/16/014600"
      - id: abc284_f
        difficulty: 1575
        role: example
        summary: "T＝S の前半＋S の反転＋S の後半となる S と位置。位置ごとに部分文字列の一致を O(1) で判定（ハッシュか Z）"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2023/0107_abc284"
      - id: typical90_au
        difficulty: null
        role: practice
        summary: "色の決まり方を言い換えて『ずらした文字列の一致』に帰着しローリングハッシュで判定（Z でも可）"
        evidence: "https://github.com/E869120/kyopro_educational_90/blob/main/editorial/047-02.jpg"
      - id: abc150_f
        difficulty: 2281
        role: practice
        summary: "b が a の巡回シフトを x で XOR したものになる (k,x) の列挙。隣接 XOR の列にして文字列検索"
        evidence: "https://drken1215.hatenablog.com/entry/2020/01/12/115800"
      - id: abc135_f
