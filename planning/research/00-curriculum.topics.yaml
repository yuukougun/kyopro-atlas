  # ===== 担当表（01〜09）から抜けている項目（kind: gap）=====
  # suggested_area は置き場所の案（担当表の略号）。設計で最終決定する。
  - key: permutation-cycles
    kind: gap
    suggested_area: math-comb
    title: 置換の巡回分解（swap でのソート）
    aliases: [巡回置換, 置換のサイクル, 順列のサイクル分解]
    level: 基礎
    level_evidence: "abc436_e (diff 958) で必須。ikatakos 氏は「順列を任意 swap でソートする問題は近年の ABC で頻出」と書く"
    prerequisites: [functional-graph]
    acl: null
    signs: ["順列 P が与えられる", "任意の2要素の swap でソート", "最小の swap 回数（= N − サイクル数）", "i → P_i を辿る"]
    compare_with: [functional-graph, inversion-number]
    page: own
    visual: "i→P_i の矢印でサイクルを描き、同じサイクル内の swap でサイクルが2つに割れるステップ送り"
    problems:
      - id: abc436_e
        difficulty: 958
        role: example
        summary: "最小回数でソートする操作列の1手目になりうる swap を数える。サイクルごとに C(サイズ,2) を足す"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2025/1213_abc436"
      - id: abc371_g
        difficulty: 2348
        role: practice
        summary: "置換を繰り返し適用して辞書順最小を作る。サイクルごとに最小値の位置を選び、回数の条件を合同式で合わせる"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2024/0914_abc371"
  - key: permutation-parity
    kind: gap
    suggested_area: math-comb
    title: 置換の偶奇（swap 回数の偶奇）
    aliases: [偶置換, 奇置換, 置換の符号]
    level: 青
    level_evidence: "abc470_f (diff 1604)・abc296_f (diff 1811) で偶奇の議論が鍵"
    prerequisites: [permutation-cycles, parity]
    acl: null
    signs: ["3つの巡回シフト（= swap 2回）しかできない", "ちょうど K 回（10^100 回など）の swap", "同じ値があるかどうかで答えが変わる"]
    compare_with: [inversion-number, invariant]
    page: own
    visual: "互換の積で置換を作り、偶奇が操作で変わらないことを色で示す図"
    problems:
      - id: abc470_f
        difficulty: 1604
        role: example
        summary: "swap 可能な位置の組で連結成分を作り、各成分の並べ方を数える。ちょうど 10^100 回なので、同じ文字がない成分では偶奇の片方しか作れない"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2026/0808_abc470"
      - id: abc296_f
        difficulty: 1811
        role: practice
        summary: "2つの列への同時 swap を、片方の3要素の巡回に言い換え、swap 回数の偶奇で可否を判定する"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2023/0401_abc296"
  - key: inversion-number
    kind: gap
    suggested_area: ds
    title: 転倒数
    aliases: [反転数, inversion, バブルソートの交換回数]
    level: 水
    level_evidence: "abc190_f (diff 1321)、abc452_f (diff 1630)"
    prerequisites: [fenwick-tree, coordinate-compression]
    acl: atcoder::fenwick_tree
    signs: ["隣接 swap の最小回数", "i<j かつ a_i>a_j の組の数", "巡回シフトしたときの転倒数", "区間の転倒数"]
    compare_with: [permutation-cycles, permutation-parity]
    page: own
    visual: "左から順に BIT に入れ、各要素より大きい既出の数を数えるステップ送り"
    problems:
      - id: abc190_f
        difficulty: 1321
        role: example
        summary: "順列を巡回シフトしたときの転倒数をすべて求める。先頭を末尾に移すと、その値より大きい数・小さい数の個数だけ差分が出る"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2021/0130_abc190"
      - id: abc452_f
        difficulty: 1630
        role: practice
        summary: "転倒数がちょうど K の区間を数える。区間を広げると転倒数が減らない単調性を使い、BIT で末尾追加・先頭削除しながら尺取りする"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2026/0404_abc452"
  - key: bracket-sequence
    kind: gap
    suggested_area: basics
    title: 括弧列
    aliases: [正しい括弧列, 括弧の対応, parentheses]
    level: 水
    level_evidence: "abc407_e (diff 1531)、abc223_f (diff 1641)、abc167_f (diff 1961)"
    prerequisites: [prefix-sum]
    acl: atcoder::lazy_segtree
    signs: ["'(' と ')' からなる文字列", "正しい括弧列か判定", "括弧列の連結順を決める", "括弧列の個数を数える"]
    compare_with: [catalan-number]
    page: own
    visual: "'(' を +1、')' を −1 とした折れ線グラフ。0 未満に下がらず 0 で終わるのが正しい括弧列"
    problems:
      - id: abc407_e
        difficulty: 1531
        role: example
        summary: "価値が最大になるように正しい括弧列の '(' の位置を選ぶ。「先頭 2i−1 文字に '(' が i 個以上」という言い換えと、優先度付きキューで候補から最大を1つずつ取る貪欲"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2025/0524_abc407"
      - id: abc223_f
        difficulty: 1641
        role: practice
        summary: "括弧の入れ替えと区間が正しい括弧列かの判定を繰り返す。累積和の区間加算と区間 min を遅延セグ木で扱う"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2021/1017_abc223"
      - id: abc167_f
        difficulty: 1961
        role: practice
        summary: "複数の括弧列を並べて正しい括弧列にできるか。各列を（最小値, 最終値）に要約し、増えるものと減るもので分けてソートする貪欲"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2020/0510_abc167"
  - key: mex
    kind: gap
    suggested_area: ds
    title: mex の扱い
    aliases: [MEX, minimum excluded]
    level: 水
    level_evidence: "abc194_e (diff 1088) は基礎、abc438_f (diff 1852) は青。水の帯で set による管理や主客転倒と組み合わさる"
    prerequisites: [set-usage]
    acl: null
    signs: ["含まれない最小の非負整数", "区間・部分列・パスの mex", "mex の総和"]
