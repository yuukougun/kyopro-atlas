        summary: "長さ M の全区間の mex の最小値。値 k を固定し「k を含まない長さ M の区間があるか」を各値の出現位置の間隔で判定する"
        evidence: "https://ikatakos.com/pot/programming_algorithm/contest_history/atcoder/2021/0306_abc194"
      - id: abc438_f
        difficulty: 1852
        role: practice
        summary: "木の全パスの mex の総和。mex ≥ k+1 となるパス（0..k を全部含むパス）の数の和に言い換える主客転倒"
