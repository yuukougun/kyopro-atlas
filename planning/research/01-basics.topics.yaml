# 01 探索・基本テクニック・考察（basics）の項目一覧。説明は 01-basics.md。
# 手引きの形式に加え、problems に stars（典型90問の★）・experimental（difficulty が参考値）・note（別解など）を付けた。
area: basics
topics:
- key: complexity-estimation
  title: 計算量の見積もり（制約から手法を逆算する）
  aliases:
  - 計算量
  - オーダー
  - 制約から考える
  - TLE の見積もり
  level: 基礎
  level_evidence: '全分野の前提。見積もり自体が問われる例: typical90_bc（★2、定数倍の見積もり）、typical90_bt（★4、探索の通り数の見積もり）、abc196_d（diff 1277、愚直 DFS で間に合うことの見積もり）'
  prerequisites: []
  acl: null
  signs:
  - N ≤ 8 / 20 / 40 / 400 / 5000 / 2×10^5 / 10^18 などの制約
  - 実行時間制限が 5 秒など長い
  - Q 個のクエリ
  - 値の上限が 10^6 程度
  compare_with:
  - amortized-analysis
  - harmonic-series
  - small-search-space
  page: own
  visual: 制約の数直線（N の大きさ）に許される計算量と手法を並べた帯図。各計算量の実際の演算回数（2×10^5 で N log N ≈ 3.5×10^6 など）を棒グラフで比べる
  problems:
  - id: typical90_bc
    difficulty: null
    role: example
    summary: 100 個から 5 個選ぶ組合せ（約 7.5×10^7 通り）を全部調べて積の余りを数える。定数倍まで見積もって全探索で間に合うと判断する
    evidence: https://github.com/Reputeless/tenkei_90
    stars: 2
  - id: typical90_bt
    difficulty: null
    role: practice
    summary: 小さいグリッドで山を避ける最長の閉路を探す。経路の通り数を見積もったうえでバックトラックで全部試す
    evidence: https://github.com/Reputeless/tenkei_90
    stars: 4
  - id: abc196_d
    difficulty: 1277
    role: practice
    summary: H×W ≤ 16 のマス目を 1×2 と 1×1 の畳で敷き詰める方法を数える。置き方を DFS で全部試しても間に合う規模だと見積もる
    evidence: https://blog.hamayanhamayan.com/entry/2021/03/21/124541
- key: amortized-analysis
  title: ならし計算量（全体で何回動くかで数える）
  aliases:
  - 償却計算量
  - アモータイズ解析
  - amortized
  level: 基礎
  level_evidence: hhkb2020_c（diff 352、mex のポインタが単調に進む）、abc278_d（559、一括代入を時刻で管理）。drken カテゴリ「ならし計算量解析」の ABC 6 問の中央値 1076
  prerequisites:
  - complexity-estimation
  acl: null
  signs:
  - ポインタが戻らない
  - 各要素が一度入って一度出るだけ
  - while ループの中で for がある
  compare_with:
  - two-pointers
  page: section-of:complexity-estimation
  visual: 各要素の「入る・出る」を時間軸に並べ、合計が 2N を超えないことを示す図
  problems:
  - id: hhkb2020_c
    difficulty: 352
    role: example
    summary: 数を 1 つずつ追加するたびに、まだ現れていない最小の非負整数を出力する。答えのポインタは戻らないので全体で O(N + 値の上限)
    evidence: https://drken1215.hatenablog.com/entry/2020/10/11/200000
  - id: abc278_d
    difficulty: 559
    role: practice
    summary: 全体への一括代入と一点加算・一点取得のクエリ。一括代入の時刻を覚えて、触った要素だけ遅れて更新する
    evidence: https://drken1215.hatenablog.com/entry/2023/05/05/002000
- key: harmonic-series
  title: 調和級数の計算量（倍数を列挙する全探索）
  aliases:
  - N/1+N/2+…+N/N
  - 倍数の列挙
  - エラトステネス的な数え上げ
  level: 水
  level_evidence: abc170_d（1033）, abc177_e（1057）は緑だが、abc356_e（1506）, abc206_e（1745）など水〜青で多い。drken「調和級数」ABC 10 問の中央値 1282
  prerequisites:
  - complexity-estimation
  - bucket-counting
  acl: null
  signs:
  - A_i ≤ 10^6 程度で値を添字にできる
  - 約数・倍数の関係にある組を数える
  - ⌊A_j / A_i⌋ の総和
  compare_with:
  - eratosthenes-sieve
  - divisor-inclusion-exclusion
  page: own
  visual: d = 1, 2, 3, … ごとに倍数の位置に印を付けていくステップ送り。各段の印の数 N/d を積み上げて N ln N に近づくことを見せる
  problems:
  - id: abc170_d
    difficulty: 1033
    role: example
    summary: 他のどの要素でも割り切れない要素の個数。値の上限までの各値の倍数に印を付ける（全体で値の上限 × log）
    evidence: https://drken1215.hatenablog.com/entry/2020/12/30/081500
  - id: abc177_e
    difficulty: 1057
    role: example
    summary: N 個の数が互いに素か・全体の gcd が 1 か を判定する。各値の倍数が何個あるかを調和級数の計算量で数える
    evidence: https://drken1215.hatenablog.com/entry/2020/10/31/203300
    note: 06 の篩とも関係
  - id: abc356_e
    difficulty: 1506
    role: practice
    summary: 全ペアの ⌊max/min⌋ の総和。値ごとの個数の累積和を使い、商が同じになる範囲を倍数ごとにまとめて数える
    evidence: https://drken1215.hatenablog.com/entry/2024/06/08/032313
  - id: abc206_e
    difficulty: 1745
    role: practice
    summary: L 以上 R 以下で gcd(x, y) が 1 でも x, y 自身でもない組の数。gcd を固定して倍数の個数から数え、包除する
    evidence: https://drken1215.hatenablog.com/entry/2021/06/25/121800
    note: 07 の約数包除と境界
- key: small-search-space
  title: 候補が少ないことに気づく（探索の対象を選び直す）
  aliases:
  - 状態数が少ない
  - 変な制約に着目
  - 約数の個数は少ない
  - log 回で収束
  level: 基礎
  level_evidence: sumitb2019_d（838）、typical90_bk（★4）、typical90_cg（★4）、abc153_d（129）。いずれも ABC C〜D 相当
  prerequisites:
  - brute-force
  - complexity-estimation
  acl: null
  signs:
  - 一方の制約だけ極端に小さい（H ≤ 8 など）
  - 答えの候補が 1000 通りなど N によらず少ない
  - K ≤ 10^12 で約数を扱う
  - 値が毎回半分になる
  compare_with:
  - brute-force
  - harmonic-series
  page: section-of:brute-force
  visual: 探索の対象（入力側 / 答え側 / 小さい次元）を入れ替えたときの通り数を並べて比べる表
  problems:
  - id: sumitb2019_d
    difficulty: 838
    role: example
    summary: 長さ N の数字列から 3 桁の暗証番号が何種類作れるか。番号の候補 1000 通りの側を全探索して作れるか判定する
    evidence: https://qiita.com/dvoraker3/items/8388ab6e1dc3af55070e
    note: 典型90 063 の類題として分類
  - id: typical90_bk
    difficulty: null
    role: example
    summary: グリッドから行と列を選ぶ。行数 H ≤ 8 の側の選び方 2^H 通りを全探索し、列はまとめて数える
    evidence: https://github.com/Reputeless/tenkei_90
    stars: 4
  - id: typical90_cg
    difficulty: null
    role: practice
    summary: abc = K（K ≤ 10^12）となる組を数える。約数の個数が少ないので約数の組を全探索する
    evidence: https://github.com/Reputeless/tenkei_90
    stars: 4
    note: 10^12 以下の約数の個数の最大は 6720
  - id: abc153_d
    difficulty: 129
    role: practice
    summary: 体力が半分になって分裂するモンスターをすべて倒す攻撃回数。分裂の深さは log H なので再帰で数えられる
    evidence: https://drken1215.hatenablog.com/entry/2020/01/26/224500
- key: brute-force
  title: 全探索の設計（何を全探索するか・固定して残りを決める）
  aliases:
  - 全列挙
  - 工夫した全探索
  - 総当たり
  level: 基礎
  level_evidence: arc096_a（291）, abc085_c（584）, abc051_b（784）, abc112_c（1147）。E869120 中級編の「工夫して通り数を減らす全列挙」
  prerequisites:
  - complexity-estimation
  acl: null
  signs:
  - 変数が 2〜3 個で、2 つ決めれば残りが決まる
  - 答えの候補（中心・座標・値）が少ない
  - 制約が小さい
  compare_with:
  - bit-full-search
  - fix-variable
  - small-search-space
  page: own
  visual: 3 重ループと「2 つ決めて 3 つ目を計算」のループ回数を比べる図
  problems:
  - id: arc096_a
    difficulty: 291
    role: example
    summary: A・B・AB ピザの買い方で費用を最小化する。AB ピザの枚数だけを全探索すれば残りの枚数は決まる
    evidence: https://qiita.com/e869120/items/eb50fdaece12be418faa
    note: ABC 095 C。工夫した全探索として分類
  - id: abc085_c
    difficulty: 584
    role: example
    summary: 1 万円・5 千円・千円札が合計 N 枚で Y 円になるか。2 種類の枚数を決めれば 3 種類目が決まる
    evidence: https://drken1215.hatenablog.com/entry/2024/05/15/005149
  - id: abc051_b
    difficulty: 784
    role: practice
    summary: 0 以上 K 以下の X, Y, Z で X+Y+Z = S となる組を数える。2 つを決めて残りを計算する
    evidence: https://drken1215.hatenablog.com/entry/2019/07/06/221600
  - id: abc089_c
    difficulty: 642
    role: practice
    summary: 名前の頭文字ごとに人数を数え、MARCH から 3 文字を選ぶ 10 通りを全探索して人数の積を足す
    evidence: https://blog.hamayanhamayan.com/entry/2018/03/05/003346
    note: 同じ種類をまとめて数える
  - id: abc112_c
    difficulty: 1147
    role: practice
    summary: ピラミッドの中心座標 101×101 通りを全探索し、情報から高さを決めて矛盾がないか確かめる
    evidence: https://drken1215.hatenablog.com/entry/2018/11/06/120500
    note: 決めてから整合性を確認する
  - id: typical90_p
    difficulty: null
    role: practice
    summary: 3 種類の硬貨でちょうど N 円払う最小枚数。2 種類の枚数を全探索し、3 種類目は割り算で決める
    evidence: https://github.com/Reputeless/tenkei_90
    stars: 3
- key: grid-brute-force
  title: 盤面を動かして全部試す（平行移動・回転の全探索）
  aliases:
  - ポリオミノ
  - 盤面の回転
  - 重ね合わせ
  level: 水
  level_evidence: abc307_c（1307）, abc322_d（1310）。いずれも ABC C/D で実装量が多い全探索
  prerequisites:
  - brute-force
  acl: null
  signs:
  - 小さい盤面（4×4, 10×10 など）を重ねる・敷き詰める
  - 回転・平行移動の組合せを試す
  compare_with:
  - recursive-enumeration
  page: section-of:brute-force
  visual: ピースを平行移動・回転させた全配置を一覧で並べる図
  problems:
  - id: abc307_c
    difficulty: 1307
    role: example
    summary: 2 枚のシートを平行移動の全組合せで重ね、切り出した結果が目標と一致するかを調べる
    evidence: https://drken1215.hatenablog.com/entry/2024/06/10/001849
  - id: abc322_d
    difficulty: 1310
    role: practice
    summary: 3 つのポリオミノを回転と平行移動の全組合せで置き、4×4 をちょうど埋められるか判定する
    evidence: https://drken1215.hatenablog.com/entry/2023/10/02/230400
- key: bit-full-search
  title: bit 全探索（k 進の全探索を含む）
  aliases:
  - ビット全探索
  - 部分集合の全列挙
  - 2^N 全探索
  - 3 進全探索
  level: 基礎
  level_evidence: abc182_c（292）, abc190_c（472）, abc128_c（805）, abc197_c（809）, abc147_c（977）。応用は abc100_d（1331）, abc104_c（1393）, abc159_e（1450）。drken「bit全探索」ABC 16 問の中央値 642
  prerequisites:
  - brute-force
  - bit-operations
  acl: null
  signs:
  - N ≤ 15〜20 で各要素を「使う／使わない」
  - スイッチの on/off
  - 区切る／区切らない
  - 各要素が 3 択なら 3^N（N ≤ 12 程度）
  compare_with:
  - recursive-enumeration
  - meet-in-the-middle
  - bit-dp
  page: own
  visual: 0〜2^N−1 の整数を 2 進表記で縦に並べ、1 の桁が「選ぶ」に対応することを示す表。片側を bit で決めて残りを貪欲にする型は 2 段の図
  problems:
  - id: abc182_c
    difficulty: 292
    role: example
    summary: 各桁を残すか消すかを bit で全探索し、3 の倍数にできる最小の消去数を求める
    evidence: https://drken1215.hatenablog.com/entry/2020/11/30/014517
  - id: abc128_c
    difficulty: 805
    role: example
    summary: スイッチの on/off 2^N 通りを試し、すべての電球が点く組合せを数える
    evidence: https://drken1215.hatenablog.com/entry/2019/06/15/135300
  - id: abc147_c
    difficulty: 977
    role: example
    summary: 誰が正直者かを 2^N 通り仮定し、証言と矛盾しない場合の正直者の最大人数を求める
    evidence: https://drken1215.hatenablog.com/entry/2019/12/14/180200
    note: 決めてから整合性を確認する
  - id: abc197_c
    difficulty: 809
    role: practice
    summary: 数列を区間に区切り、各区間の OR の XOR を最小化する。区切り方 2^(N−1) 通りを全部試す
    evidence: https://oraclesqlpuzzle.ninja-web.net/kyoupro/05-atcoder-02-abc/kyoupro-abc197-c.html
    note: 典型90 002 の類題
  - id: abc100_d
    difficulty: 1331
    role: practice
    summary: x, y, z の符号の向き 8 通りを全探索し、各向きで評価値の大きい順に M 個取る
    evidence: https://drken1215.hatenablog.com/entry/2018/06/16/234000
    note: 片側を全探索して残りは貪欲
  - id: abc159_e
    difficulty: 1450
    role: practice
    summary: 横の切れ目 2^(H−1) 通りを全探索し、縦の切れ目は左から貪欲に入れて最小回数を求める
    evidence: https://drken1215.hatenablog.com/entry/2020/03/23/002300
    note: 片側を全探索して残りは貪欲
- key: permutation-search
  title: 順列全探索
  aliases:
  - next_permutation
  - N! 全探索
  level: 基礎
  level_evidence: abc145_c（340）, abc150_c（422）, abc232_c（685）, abc371_c（849）。応用 abc198_d（1224）
  prerequisites:
  - brute-force
  acl: null
  signs:
  - N ≤ 8〜10
  - 訪問順・割り当て・頂点の対応を全部試す
  - グラフの同型判定
  compare_with:
  - bit-dp
  - recursive-enumeration
  page: own
  visual: next_permutation が辞書順に次の順列を作る手順のステップ送り（右端から下降が始まる位置を探して入れ替え、反転）
  problems:
  - id: abc145_c
    difficulty: 340
    role: example
    summary: N ≤ 8 個の町を回る全順序について経路長の平均を求める
    evidence: https://blog.hamayanhamayan.com/entry/2019/11/16/233917
  - id: abc150_c
    difficulty: 422
    role: example
    summary: 2 つの順列が辞書順で何番目かを、全順列を列挙して求める
    evidence: https://drken1215.hatenablog.com/entry/2020/01/12/122100
  - id: abc183_c
    difficulty: 335
    role: practice
    summary: 都市 1 から出発して全都市を回り戻る経路のうち、所要時間がちょうど K のものを数える
    evidence: https://oraclesqlpuzzle.ninja-web.net/kyoupro/05-atcoder-02-abc/kyoupro-abc183-c.html
    note: 典型90 032 の類題
  - id: abc232_c
    difficulty: 685
    role: practice
    summary: 2 つのグラフが頂点の付け替えで一致するかを、8! 通りの対応を全部試して判定する
    evidence: https://oraclesqlpuzzle.ninja-web.net/kyoupro/05-atcoder-02-abc/kyoupro-abc232-c.html
  - id: abc371_c
    difficulty: 849
    role: practice
    summary: 辺の追加・削除にコストを払って G を H と同型にする最小費用。頂点の対応 8! 通りを全部試す
    evidence: https://oraclesqlpuzzle.ninja-web.net/kyoupro/05-atcoder-02-abc/kyoupro-abc371-c.html
  - id: abc198_d
    difficulty: 1224
    role: practice
    summary: 覆面算を解く。文字に数字を割り当てる方法を順列のように DFS で全部試す
    evidence: https://blog.hamayanhamayan.com/entry/2021/04/11/225553
- key: recursive-enumeration
  title: 再帰による全列挙（バックトラック・組分け・枝刈り）
  aliases:
  - DFS による全列挙
  - バックトラック
  - グループ分けの全列挙
  - 集合分割
  - ベル数
  level: 水
  level_evidence: abc161_d（991）, abc114_c（1045）は緑、abc236_d（1190）, abc310_d（1368）, abc345_d（1419）, abc390_d（1607）で水〜青に多い。drken「全探索:再帰関数(ビット全探索困難)」ABC 10 問の中央値 1018
  prerequisites:
  - bit-full-search
  - permutation-search
  acl: null
  signs:
  - 条件を満たす数・列を小さい順にすべて作る
  - N ≤ 10〜16 人を組・グループに分ける
  - 敷き詰め・パズル
  - 途中で条件違反なら打ち切れる
  compare_with:
  - bit-full-search
  - bit-dp
  page: own
  visual: 再帰木のステップ送り。組分けでは「まだ組のない最小番号の人から決める」ことで同じ分け方を二度数えない様子を示す
  problems:
  - id: abc114_c
    difficulty: 1045
    role: example
    summary: 7, 5, 3 だけからなり 3 種類すべてを含む N 以下の数を、桁を 1 つずつ足す再帰で数える
    evidence: https://drken1215.hatenablog.com/entry/2019/04/03/125400
  - id: abc161_d
    difficulty: 991
    role: example
    summary: 隣り合う桁の差が 1 以下の数のうち K 番目を、小さい桁数から生成して求める
    evidence: https://drken1215.hatenablog.com/entry/2020/04/05/150900
  - id: abc236_d
    difficulty: 1190
    role: practice
    summary: 2N 人を 2 人組に分ける全通りを再帰で列挙し、組ごとの値の XOR の最大を求める
    evidence: https://oraclesqlpuzzle.ninja-web.net/kyoupro/05-atcoder-02-abc/kyoupro-abc236-d.html
  - id: abc310_d
    difficulty: 1368
    role: practice
    summary: N ≤ 10 人を T チームに分ける方法で、仲の悪い組が同じチームにならないものを数える
    evidence: https://drken1215.hatenablog.com/entry/2023/07/17/213800
    note: 最小番号から決めて重複を防ぐ
  - id: abc345_d
    difficulty: 1419
    role: practice
    summary: N 枚のタイルで H×W を覆えるか。左上の空きマスから置き方を試すバックトラック
    evidence: https://oraclesqlpuzzle.ninja-web.net/kyoupro/05-atcoder-02-abc/kyoupro-abc345-d.html
  - id: abc390_d
    difficulty: 1607
    role: practice
    summary: N ≤ 12 個の袋をグループにまとめる方法（ベル数 B12 ≈ 4.2×10^6 通り）を全列挙し、グループごとの石の数の和の XOR が何種類あるか数える
