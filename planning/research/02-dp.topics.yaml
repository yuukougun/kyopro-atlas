- key: cht
  title: Convex Hull Trick（CHT）
  aliases:
  - CHT
  - Convex Hull Trick
  - 傾き最適化
  - 斜率优化
  level: 発展
  level_evidence: ABC で CHT が想定解・主要解の問題は 2019〜2026 年の ABC F/G/Ex で abc289_g (2109)・abc228_h (2729) の2問（kmjp の解説 425 本と AtCoder Tags で確認）。黄に1問あるが頻度が低く、EDPC Z が定番の練習
  prerequisites:
  - dp-speedup-overview
  - dp-segment-tree
  - convex-hull
  acl: null
  signs:
  - dp[j] = min_i (dp[i] + a_i × x_j + b_i) の形（i と j の積の項が1つ）
  - N ≤ 2×10^5 で O(N^2) の DP
  - (h_i − h_j)^2 のような2乗のコスト
  compare_with:
  - li-chao-tree
  - monotone-minima
  - dp-segment-tree
  page: own
  visual: 遷移元ごとの直線を平面に描き、下側の包絡線（下に凸な折れ線）だけが答えになることと、不要な直線が消える様子をステップ送り
  problems:
  - id: dp_z
    difficulty: null
    role: example
    summary: 高さの差の2乗＋定数のコストで跳ぶカエルの最小コスト。遷移を直線の最小値として CHT で求める
    evidence: https://qiita.com/Series_205/items/05bd22a4e78527cb29dc
  - id: abc289_g
    difficulty: 2109
    role: practice
    summary: 各商品の価格を決めて売上を最大化。買う人数ごとの売上が価格の一次関数になるので CHT で最大を取る
    evidence: https://kmjp.hatenablog.jp/entry/2023/02/11/0900
  - id: abc228_h
    difficulty: 2729
    role: practice
    summary: 値を揃えるコストと種類数のコストの和の最小。ソート後の DP の遷移が一次関数の最小になる
    evidence: https://kmjp.hatenablog.jp/entry/2021/11/22/0930
  - id: colopl2018_final_c
    difficulty: null
    role: practice
    summary: 各地点での (i − j)^2 + a_j の最小値。直線（放物線の差）の最小値として CHT で求める
    evidence: https://drken1215.hatenablog.com/entry/2018/09/18/014400
