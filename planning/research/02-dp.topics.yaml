  - 計算の順番が分かりにくい（DAG・値の大小・ゲームの局面）
  - 終了条件が自然に書ける
  compare_with:
  - dp-order
  - dp-dag
  - dp-push-pull
  page: own
  visual: 再帰の呼び出し木を描き、メモに当たった呼び出しを灰色にして枝が刈られる様子を見せる
