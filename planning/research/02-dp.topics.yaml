- key: monge
  title: Monge 性と DP
  aliases:
  - Monge
  - 四角不等式
  - Quadrangle Inequality
  - 四边形不等式
  level: 発展
  level_evidence: Monge 性（最適な遷移元の単調性）を使う ABC は abc348_g (2559)・abc355_g (2991) など G/Ex のみ（kmjp の解説で monotone minima を使用）
