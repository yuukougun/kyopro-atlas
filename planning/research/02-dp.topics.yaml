  - N ≤ 5000 程度の区間 DP
  compare_with:
  - interval-dp
  - monotone-minima
  page: section-of:monge
  visual: 区間ごとの最適な分割点 opt[l][r] を表に書き、opt[l][r−1] ≤ opt[l][r] ≤ opt[l+1][r] の範囲だけ探す様子
  problems:
  - id: dp_n
    difficulty: null
    role: example
