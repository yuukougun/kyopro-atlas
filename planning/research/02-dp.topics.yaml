- key: knuth-yao
  title: Knuth-Yao speedup（区間 DP の高速化）
  aliases:
  - Knuth-Yao
  - Knuth's optimization
  - 四辺形不等式による高速化
  level: 発展
  level_evidence: ABC で必須の問題は確認できなかった。EDPC N（スライムの合体）は O(N^3) で通るが Knuth-Yao で O(N^2) にできる同型の問題
