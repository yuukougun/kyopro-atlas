- key: memoized-recursion
  title: メモ化再帰
  aliases:
  - メモ化
  - 再帰 DP
  - トップダウン DP
  level: 基礎
  level_evidence: 素直なメモ化の abc340_c (528)・abc275_d (606) が基礎。計算順が自明でない・状態がまばらでメモ化が楽な問題は abc184_d (1276)・abc357_e (1295)・abc201_d (1317)・abc300_e (1354)・abc350_e (1385) と水
