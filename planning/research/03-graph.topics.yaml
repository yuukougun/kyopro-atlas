# 03 グラフ（graph）の項目一覧。レポートは 03-graph.md
# problems の difficulty は tools/ap.py（2026-10-21 のキャッシュ）の値。null は推定値なし（典型90問・EDPC・ACL Practice・鉄則本）
# 典型90問の★と difficulty の目安：★4=800〜1199、★5=1200〜1599、★6=1600〜1999、★7=2000以上
area: graph
topics:
- key: graph-basics
  title: グラフの表現と用語
  aliases:
  - グラフの基本
  - 隣接リスト
  - 隣接行列
  - 辺リスト
  level: 基礎
  level_evidence: typical90_bz（★2）、abc284_c（diff 193）。ABC の C〜D で前提として使われる
  prerequisites:
  - complexity-estimation
  acl: null
  signs:
  - N 頂点 M 辺
  - u_i と v_i を結ぶ辺
  - 1-indexed の頂点番号
  - M ≤ 2×10^5 で隣接行列は持てない
  compare_with:
  - grid-graph
  page: own
  visual: 同じグラフを図・隣接リスト・隣接行列・辺リストの4通りで並べ、1本の辺がそれぞれどこに現れるかを強調する
  problems:
  - id: abc284_c
    difficulty: 193
    role: practice
    summary: 単純無向グラフの連結成分の個数を数える
    evidence: https://drken1215.hatenablog.com/entry/2023/09/28/022105
  - id: typical90_bz
    difficulty: null
    role: example
    summary: 各頂点について番号の小さい隣接頂点を数える。隣接リストの作り方の確認
    evidence: https://github.com/E869120/kyopro_educational_90/blob/main/sol/078.cpp
- key: dfs
  title: 深さ優先探索（DFS）
