# 04 木（tree）の項目一覧。詳細と根拠は 04-tree.md を参照。
# 問題IDはすべて tools/ap.py で実在を確認済み（2026-10-21 取得のキャッシュ）。difficulty は AtCoder Problems の補正後の値。
# 他分野の項目を指す key は推測（例: dfs, union-find, doubling, tree-dp）。
area: tree
topics:
  - key: tree-basics
    title: 木の基本性質と表現
    aliases: [木の定義, 森, 根付き木, 木の性質]
    level: 基礎
    level_evidence: "性質を知っていれば解ける問題が灰〜水に多い。abc263_b (136)・abc399_c (321)・abc303_e (1113)・abc378_f (1436)"
    prerequisites: [graph-representation, dfs, bfs]
    acl: null
    signs: ["N 頂点 N-1 辺の連結グラフ", "どの 2 頂点間にもちょうど 1 つの経路", "p_i < i（親の番号が自分より小さい）", "辺を 1 本足す／1 本取り除く", "森にする（閉路をなくす）"]
    compare_with: [namori-graph, tree-bipartite, tree-degree]
    page: own
    visual: "辺を 1 本取り除くと 2 つに分かれ、1 本足すと閉路が 1 つできる様子を切り替えて見せる図"
    problems:
      - id: abc263_b
        difficulty: 136
        role: example
        summary: "親の番号を根までたどった回数（深さ）を数える"
        evidence: "https://qiita.com/gotoki_no_joe/items/98225d578c885656a959"
      - id: abc399_c
        difficulty: 321
        role: practice
        summary: "森として残せる辺は N −（連結成分数）本なので、それ以外を消す本数を数える"
        evidence: "https://qiita.com/mattsunkun/items/c060dc9d1d22e298ed02"
      - id: abc303_e
        difficulty: 1113
        role: example
        summary: "次数 3 以上の頂点は元の星の中心しかありえないことと頂点数の式から、星の大きさごとの個数を逆算する"
        evidence: "https://drken1215.hatenablog.com/entry/2023/05/29/134700"
      - id: abc378_f
        difficulty: 1436
        role: practice
        summary: "辺を 1 本足してできる閉路の条件を次数で言い換え、次数 3 の頂点の連結成分ごとに接する次数 2 の頂点の組を数える"
        evidence: "https://drken1215.hatenablog.com/entry/2024/11/04/002341"

  - key: tree-traversal
    title: 根付き木と走査順（DFS・BFS・行きがけ／帰りがけ）
    aliases: [木の探索, DFS 順, 行きがけ順, 帰りがけ順, BFS 順, 部分木サイズ, 深さ]
    level: 基礎
    level_evidence: "abc213_d (710)・abc270_c (625)・abc309_e (957)・abc146_d (1192) で、根を決めた DFS/BFS と親・深さ・部分木サイズだけで解ける。abc133_e (1505) が水の応用"
    prerequisites: [tree-basics, dfs, bfs, recursion]
    acl: null
    signs: ["頂点 1 を根とする", "部分木の頂点数・和・最大", "子孫", "親の番号が与えられる", "訪問順を出力"]
    compare_with: [euler-tour, tree-dp]
    page: own
    visual: "DFS のステップ送り。スタックの中身・行きがけ番号・帰りがけ番号を同時に表示し、BFS 順（深さ順）と切り替えられるようにする"
    problems:
      - id: abc213_d
        difficulty: 710
        role: example
        summary: "隣接頂点を番号の小さい順に回る DFS で、戻る動きも含めた訪問順を出力する"
        evidence: "https://drken1215.hatenablog.com/entry/2021/08/11/025100"
      - id: abc270_c
        difficulty: 625
        role: example
        summary: "片方の端点から DFS して親を記録し、2 点間のパスを復元する"
        evidence: "https://qiita.com/gotoki_no_joe/items/126eaba4f553c9ef13be"
      - id: abc309_e
        difficulty: 957
        role: practice
        summary: "親の番号が自分より小さい入力なので、番号順に「あと何世代まで保険が及ぶか」の最大値を子へ伝える"
        evidence: "https://qiita.com/ZOI_dayo/items/a55cc4342832efdc23ba"
      - id: abc333_d
        difficulty: 704
        role: practice
        summary: "頂点 1 の子ごとの部分木サイズを求め、最大のものだけを残す"
        evidence: "https://drken1215.hatenablog.com/entry/2024/11/02/192645"
      - id: abc146_d
        difficulty: 1192
        role: practice
        summary: "根から順に、親へ向かう辺の色だけを避けて子への辺に色を振ると最大次数色で塗れる"
        evidence: "https://drken1215.hatenablog.com/entry/2020/04/26/172200"
      - id: abc133_e
        difficulty: 1505
        role: practice
        summary: "DFS 順に色を決め、距離 2 以内で処理済みの頂点（親・祖父・先に処理した兄弟）の数だけ選択肢が減ることを掛け合わせる"
        evidence: "https://kmjp.hatenablog.jp/entry/2019/07/07/1000"

  - key: tree-bipartite
    title: 木の 2 色塗り分けと距離の偶奇
    aliases: [木は二部グラフ, 深さの偶奇, 2 彩色]
    level: 基礎
    level_evidence: "abc209_d (686)・abc398_e (1238)・abc126_d (1279)・競プロ典型90問 026（★4）"
    prerequisites: [tree-traversal, bipartite-check]
    acl: null
    signs: ["距離の偶奇", "2 人が同時に動いて出会う場所", "辺の重みが偶数か奇数か", "独立集合を N/2 個以上", "二部グラフのまま辺を足す"]
    compare_with: [bipartite-check, tree-distance]
    page: own
    visual: "深さの偶奇で色分けした木。2 点を選ぶと距離と色の組み合わせが表示される図"
    problems:
      - id: abc209_d
        difficulty: 686
        role: example
        summary: "2 点の距離の偶奇で出会う場所（町か道路）が決まり、偶奇は深さの和で分かる（LCA で距離を求めても解ける）"
        evidence: "https://blog.hamayanhamayan.com/entry/2021/07/11/154020"
      - id: abc126_d
        difficulty: 1279
        role: example
        summary: "辺の重みが偶数なら同じ色、奇数なら違う色という規則で DFS しながら塗る"
        evidence: "https://drken1215.hatenablog.com/entry/2019/05/19/224500"
      - id: typical90_z
        difficulty: null
        role: practice
        summary: "2 色に塗ると多い方の色は N/2 個以上あり、同じ色どうしは隣接しないので独立集合になる"
        evidence: "https://github.com/E869120/kyopro_educational_90/blob/main/sol/026.cpp"
      - id: abc398_e
        difficulty: 1238
        role: practice
        summary: "色の違う頂点の組のうち辺のない組の数の偶奇で、先手と後手のどちらを選ぶかを決めるゲーム"
        evidence: "https://qiita.com/gotoki_no_joe/items/5fbb19b3022933cc370b"
      - id: abc437_g
        difficulty: 2806
        role: practice
        summary: "木が二部グラフであることを使い、各辺の消し方を左右の頂点の色の状態の割り当てとして最大流で求める"
        evidence: "https://kmjp.hatenablog.jp/entry/2025/12/20/0930"

  - key: tree-distance
    title: 木の上の距離（1 点・2 点から／根からの累積）
    aliases: [木の距離, 根からの累積, XOR 距離, 追いかけっこ]
    level: 基礎
    level_evidence: "1 点からの距離は abc070_d (1182)。2 点からの比較は abc148_f (1457)、根からの XOR は abc201_e (1694)・arc045_c (2022 参考値)"
    prerequisites: [tree-traversal]
    acl: null
    signs: ["頂点 K を経由する最短距離", "2 人の追いかけっこ・どちらが先に着くか", "パス上の XOR", "全ての 2 頂点間の距離が与えられる"]
    compare_with: [lca, tree-path, tree-diameter]
    page: own
    visual: "2 点からの距離を色の濃淡で塗り、どちらに近いかの境目（パスの中点）を見せる図"
    problems:
      - id: abc070_d
        difficulty: 1182
        role: example
        summary: "経由点 K から全頂点への距離を 1 回の DFS で前計算し、各クエリは 2 つの距離の和で答える"
        evidence: "https://drken1215.hatenablog.com/entry/2019/02/17/114200"
      - id: abc148_f
        difficulty: 1457
        role: example
        summary: "2 人それぞれからの距離を求め、逃げる側が先に着ける頂点のうち鬼から最も遠い所までの手数を求める"
        evidence: "https://blog.hamayanhamayan.com/entry/2019/12/23/220247"
      - id: abc201_e
        difficulty: 1694
        role: practice
        summary: "根からの XOR を前計算すると 2 点間の XOR はその XOR になる。全組の和はビットごとに 0 と 1 の個数の積で数える"
        evidence: "https://blog.hamayanhamayan.com/entry/2021/05/15/235842"
      - id: arc045_c
        difficulty: 2022
        role: practice
        summary: "根からの XOR が sum[a] と sum[b] なら 2 点間は sum[a] xor sum[b]。値ごとの個数で XOR が X のパスを数える"
        evidence: "https://drken1215.hatenablog.com/entry/2019/03/10/195800"
      - id: abc414_f
        difficulty: 2357
        role: practice
        summary: "ちょうど K 辺ずつ進む移動の最短回数を、距離の余りと来た方向を状態に持つ BFS で求める（03 の状態拡張との境界）"
        evidence: "https://merom686.hatenablog.com/entry/2025/07/13/021033"

  - key: tree-imos
    title: 木の上の累積和・いもす法
    aliases: [木上のいもす法, 部分木加算, パス加算, 木上の累積和]
    level: 基礎
    level_evidence: "部分木への一括加算は abc138_d (920)、根の向きを自分で決める応用が abc187_e (1358)。パスへの加算は LCA を使うので青の節にする"
    prerequisites: [tree-traversal, imos]
    acl: null
    signs: ["部分木の全頂点に x を加算するクエリがたくさん来て、最後に全頂点の値を出力", "辺のどちら側かに加算", "多数のパスに沿って +1 し、各辺・各頂点を通った回数を求める"]
    compare_with: [euler-tour, euler-tour-path, lca]
    page: own
    visual: "印をつける段階と、根から下へ（または葉から上へ）累積する段階をステップ送りで見せる"
    problems:
      - id: abc138_d
        difficulty: 920
        role: example
        summary: "部分木への加算を根の頂点に印として足しておき、最後に根から下へ累積する"
        evidence: "https://drken1215.hatenablog.com/entry/2020/05/18/174000"
      - id: abc187_e
        difficulty: 1358
        role: example
        summary: "根を決め、辺の片側への加算を「子の部分木へ加算」か「全体へ加算して子の部分木から引く」に直して累積する"
        evidence: "https://drken1215.hatenablog.com/entry/2021/01/03/162800"
      - id: abc222_e
        difficulty: 1491
        role: practice
        summary: "決まった順に移動したときに各辺を通る回数を先に数え、赤と青の差がちょうど K になる塗り方を部分和 DP で数える"
        evidence: "https://blog.hamayanhamayan.com/entry/2021/10/10/142820"

  - key: leaf-first
    title: 葉から考える（葉の削除・葉から決める貪欲）
    aliases: [葉から貪欲, 葉を刈る, トポロジカル順に葉から]
    level: 水
    level_evidence: "abc459_e (1298)・abc397_e (1484) で葉から情報を送る発想が要る。黄に abc345_f (2157)"
    prerequisites: [tree-traversal, greedy-exchange]
    acl: null
    signs: ["木を K 頂点ずつのパスに分ける", "辺をすべて使う・すべて覆う", "葉を消していく操作", "部分木で余った個数を上に送る"]
    compare_with: [tree-dp, tree-degree]
    page: own
    visual: "次数 1 の頂点をキューに入れて削っていくステップ送り（キューと残りの次数を表示）"
    problems:
      - id: abc459_e
        difficulty: 1298
        role: example
        summary: "部分木で余る個数を末端から集め、そのつど二項係数を掛けていく。足りなくなったら 0"
        evidence: "https://merom686.hatenablog.com/entry/2026/05/24/005253"
      - id: abc397_e
        difficulty: 1484
        role: example
        summary: "葉から未完成のパスの長さを親へ送り、K に達したら切り離す。2 本を合わせるときはちょうど K でなければ失敗"
        evidence: "https://qiita.com/Shizen_Tota/items/df1f142c879a61c21838"
      - id: abc345_f
        difficulty: 2157
        role: practice
        summary: "全域森を作り、葉の辺から順に「この葉のランプを点けるためにその辺を使うか」を決めていく"
        evidence: "https://qiita.com/gotoki_no_joe/items/f9770e81cc38a70b5300"

  - key: tree-degree
    title: 次数と次数列（木を作れる条件・プリューファー列）
    aliases: [次数列, プリューファー列, Prüfer code, 握手補題]
    level: 青
    level_evidence: "次数を数えるだけの問題は abc303_e (1113)・abc385_e (1406) と易しいが、次数列から木を作れる条件を使う abc359_f (1792)・abc239_f (1959) が青"
    prerequisites: [tree-basics, leaf-first]
    acl: null
    signs: ["各頂点の次数を決める", "次数の和が 2N-2", "次数が ○ 以下の木", "星・雪の結晶など次数で決まる形"]
    compare_with: [tree-counting, tree-construction]
    page: own
    visual: "最小番号の葉を消してその隣を記録する、プリューファー列の生成と復元のステップ送り"
    problems:
      - id: abc385_e
        difficulty: 1406
        role: example
        summary: "中心にする頂点を全探索し、隣の頂点の次数を大きい順に並べて、作れる形の頂点数の最大を求める"
        evidence: "https://drken1215.hatenablog.com/entry/2024/12/26/010927"
      - id: abc359_f
        difficulty: 1792
        role: example
        summary: "各次数が 1 以上で和が 2N-2 なら木が作れるので、増やしたときのコストの増分が小さい頂点へ順に次数を配る"
        evidence: "https://drken1215.hatenablog.com/entry/2024/06/23/032101"
      - id: abc239_f
        difficulty: 1959
        role: practice
        summary: "次数の和と閉路の有無を確かめたうえで、次数が不足している連結成分どうしをつないで木を完成させる"
        evidence: "https://kazun-kyopro.hatenablog.com/entry/ABC/239/F"
      - id: abc303_h
        difficulty: 2501
        role: practice
        summary: "次数の候補が決まった木の数を、プリューファー列の多項係数と形式的冪級数で数える（07 との境界）"
        evidence: "https://drken1215.hatenablog.com/entry/2023/05/28/010200"

  - key: tree-edge-contribution
    title: 辺で切って数える（全ペアのパスの寄与）
    aliases: [辺の寄与, 主客転倒（木）, 全点対の距離の和]
    level: 水
    level_evidence: "abc214_d (1341)・競プロ典型90問 039（★5）が基本。応用は abc201_e (1694)・abc173_f (1892)・abc149_f (2208)"
    prerequisites: [tree-traversal, contribution, union-find]
    acl: "atcoder::dsu（重みの順に併合する形のとき）"
    signs: ["すべての i < j について f(i, j) の総和", "全ペアのパス上の最大値の和", "区間 [L, R] で誘導される森の連結成分数の総和"]
    compare_with: [rerooting-dp, centroid-decomposition, small-to-large]
    page: own
    visual: "辺を 1 本ずつ切って左右の頂点数と積を表示し、総和が積み上がっていくアニメ"
    problems:
      - id: typical90_am
        difficulty: null
        role: example
        summary: "辺で切った両側の頂点数を s と N-s とすると、その辺を通るペアは s(N-s) 個。全辺で足すと距離の総和"
        evidence: "https://github.com/E869120/kyopro_educational_90/blob/main/sol/039.cpp"
      - id: abc214_d
        difficulty: 1341
        role: example
        summary: "辺を重みの小さい順に Union-Find で併合し、併合した瞬間に両側の大きさの積と重みを掛けて足す"
        evidence: "https://blog.hamayanhamayan.com/entry/2021/08/15/034729"
      - id: abc173_f
        difficulty: 1892
        role: practice
        summary: "森の連結成分数 = 頂点数 − 辺数 に分け、各頂点・各辺を含む区間の個数を数えて足す"
        evidence: "https://blog.hamayanhamayan.com/entry/2020/07/05/235609"
      - id: abc149_f
        difficulty: 2208
        role: practice
        summary: "各頂点について、周りの各方向にある頂点数から「白で、黒を含む方向が 2 つ以上」の確率を求めて足す（期待値の線形性）"
        evidence: "https://kmjp.hatenablog.jp/entry/2019/12/30/0930"
      - id: abc163_f
        difficulty: 2470
        role: practice
        summary: "色ごとに、その色の頂点を取り除いた連結成分の大きさから「その色を通らないパス」を数えて引く"
        evidence: "https://kmjp.hatenablog.jp/entry/2020/04/20/0930"

  - key: complete-binary-tree
    title: 完全二分木（ヒープ番号の木）
    aliases: [完全二分木, ヒープ番号, 親は i/2]
    level: 水
    level_evidence: "移動の基本は abc243_d (758)。距離ごとの頂点数を数える abc321_e (1627) が青との境目"
    prerequisites: [tree-basics, bit-operations]
    acl: null
    signs: ["頂点 i と floor(i/2) を結ぶ", "N ≤ 10^18 の木", "L・R・U の移動列"]
    compare_with: [tree-path, lca]
    page: own
    visual: "番号と 2 進表記を並べた完全二分木。L/R/U の移動が 2 進表記の末尾の付け外しになることを見せる"
    problems:
      - id: abc243_d
        difficulty: 758
        role: example
        summary: "L/R の直後の U は打ち消し合うのでスタックで消してから、残った移動を番号の計算で行う"
        evidence: "https://drken1215.hatenablog.com/entry/2024/09/24/123142"
      - id: abc321_e
        difficulty: 1627
        role: example
        summary: "自分の部分木で深さ K の頂点数に、祖先へ上がるたびに反対側の子の部分木で深さが合う頂点数を足す（N 以下に制限）"
        evidence: "https://drken1215.hatenablog.com/entry/2023/09/24/231639"
      - id: abc264_h
        difficulty: 2660
        role: practice
        summary: "完全二分木の高さは log N 程度しかないことを使い、頂点を加えるたびに祖先の DP だけを更新する（02 との境界）"
        evidence: "https://kmjp.hatenablog.jp/entry/2022/08/13/0930"

  - key: namori-graph
    title: なもりグラフ（木に 1 本の辺を足したグラフ）
    aliases: [なもり, unicyclic graph, N 頂点 N 辺の連結グラフ]
    level: 水
    level_evidence: "abc266_f (1525)。有向版の Functional graph は abc256_e (1224)・abc357_e (1295)（03 の担当）"
    prerequisites: [tree-basics, leaf-first, union-find]
    acl: "atcoder::dsu（閉路を作る辺の検出に使える）"
    signs: ["N 頂点 N 辺の連結グラフ", "木に辺を 1 本足す", "各頂点から辺が 1 本ずつ出る"]
    compare_with: [functional-graph, tree-basics]
    page: own
    visual: "閉路を横一列に並べ、各閉路の頂点から下に木がぶら下がる描き方に並べ替えるアニメ"
    problems:
      - id: abc266_f
        difficulty: 1525
        role: example
        summary: "次数 1 の頂点を削り続けて閉路を求め、閉路の各頂点からぶら下がる木が同じなら 2 点間のパスは一意"
        evidence: "https://zenn.dev/fjnkt98/articles/98c9dfbd0702a4"
      - id: abc235_e
