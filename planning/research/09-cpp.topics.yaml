# 09 C++ の項目一覧（調査レポート 09-cpp.md の機械可読版）
# level は「その書き方が解説コードで目に入り始める帯」の目安。環境・道具の項目は null。
# signs は「解説コードでの見た目」または「症状」。コードの見た目から引く逆引きに使う。
# problems は C++ 章では空にしている（レポート §5 を参照）。
area: cpp
topics:
  # ===== A. 入口・環境 =====
  - key: cpp-reading-guide
    title: 解説コードの読み方（書き方からの逆引き）
    aliases: [C++ 逆引き, モダン C++ の読み方, 解説コードが読めない]
    level: 基礎
    level_evidence: '要件定義書の例（for (const auto& [i, component] : scc.scc() | views::enumerate)）のように、解説コードは易しい問題から現代的な構文を含みうる。章の入口なので基礎に置く'
    prerequisites: []
    acl: null
    signs: ['見慣れない記号やキーワードを含む1行', 'std::views / std::ranges / auto&& / [&] / this auto&& self などが並ぶ行']
    compare_with: []
    page: own
    visual: '1行のコードを部品（const auto& / [i, component] / scc.scc() / | views::enumerate）に分け、部品ごとに該当ページへ矢印を引く分解図'
    problems: []

