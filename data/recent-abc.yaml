# 最近の ABC（abc451〜abc480 の D〜G、120問）と、使う手法のページの対応（design-review D5）。
# ロードマップの「位置ごとの頻出手法（最近30回）」「最近の ABC → ページ」の表と、frequency の付け直しの材料。
#
# 出典: planning/research/00-curriculum.md §2.3.8 の分類表（technique はその「使われた手法」の列、evidence は「裏付け」の列）。
# 項目:
#   position・title・difficulty  tools/ap.py のキャッシュ（取得 2026-10-21T01:14:31+09:00）の値
#   pages         表に名前の出た手法ごとに、それを説明する catalog のページの id（節が決まれば id#anchor）。1問に複数。
#                 ほかの手法の中で使う道具（Kruskal 法の Union-Find、転倒数の BIT など）も、表に名前があれば入れた。
#                 表に名前がなくても、裏付けの記事や research の各レポートで解法の中心と分かった手法は入れ、note に書いた。
#                 technique・thinking・overview のページを使い、題材別（patterns）は手法のページがないときだけ入れた（abc470_d）。
#                 hub・guide・cpp・start のページは入れない。
#   alternatives  表や裏付けで別解・発展とされた手法のページ（frequency の回数に数えない）
#   unmatched     表に名前の出た手法のうち、対応するページ・節がないもの（ないときは項目ごと省く）
#   note          対応の根拠と解法の要点。「evidence で確かめた」は裏付けの記事を読んで節・ページを決めたもの、
#                 「research/0x」はその調査レポートの同じ問題の行、「表の記述どおり」は表の記述だけで決めたもの
# 対応を確かめた catalog: 2026-10-21T06:13:25+09:00 時点の planning/catalog/*.yaml（ページの id と節の anchor はすべて存在を確かめた）。
