compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点どうし
  - {input: "1\n", output: "Yes\n"}
  # 2 頂点（中心が 2 個）
  - {input: "2\n0 1\n1 0\n", output: "Yes\n"}
  # 一直線 0-1-2-3 と、番号を付け替えた一直線 2-0-3-1
  - {input: "4\n0 1\n1 2\n2 3\n2 0\n0 3\n3 1\n", output: "Yes\n"}
  # 一直線と星（どちらも 4 頂点）
  - {input: "4\n0 1\n1 2\n2 3\n0 1\n0 2\n0 3\n", output: "No\n"}
  # 中心が 2 個の 6 頂点：両端に葉を 1 本ずつ足した一直線と、その付け替え
  - {input: "6\n0 1\n1 2\n2 3\n1 4\n2 5\n5 2\n2 0\n0 1\n2 3\n0 4\n", output: "Yes\n"}
  # 次数の列は同じだが形が違う 6 頂点：0-1-2-3-4 で 1 に葉 vs 2 に葉
  - {input: "6\n0 1\n1 2\n2 3\n3 4\n1 5\n0 1\n1 2\n2 3\n3 4\n2 5\n", output: "No\n"}
