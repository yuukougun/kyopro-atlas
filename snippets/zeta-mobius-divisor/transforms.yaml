# main の中で、O(n^2) の愚直な計算と一致すること、逆変換で元に戻ることを assert で確かめてから出力する
# 「6 / 1 1 1 1 1 1」の 1 行目は約数の個数、2 行目は ⌊6/m⌋、3 行目の 23 は 1〜6 の互いに素な順序対の数（手で数えた）
compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n5\n", output: "5\n5\n25\n25\n"}
  - {input: "2\n0 0\n", output: "0 0\n0 0\n0 0\n0 0\n"}
  - {input: "6\n1 1 1 1 1 1\n", output: "1 2 2 3 2 4\n6 3 2 1 1 1\n23 7 3 1 1 1\n1 3 3 5 3 9\n"}
  - {input: "6\n1 2 3 4 5 6\n", output: "1 3 4 7 6 12\n21 12 9 4 5 6\n227 92 45 16 25 36\n1 8 15 40 35 120\n"}
  - {input: "12\n3 -1 4 1 -5 9 2 -6 5 3 -5 8\n", output: "3 2 7 3 -2 15 5 -3 12 0 -2 24\n18 14 26 3 -2 17 2 -6 5 3 -5 8\n-283 -47 362 -91 -5 225 4 36 25 9 25 64\n9 -5 40 5 -5 181 16 0 95 1 -5 346\n"}
