# 期待値は、n ≤ 5・A_i ≤ 5 の乱択 400 通りで操作の回数を総当たりした結果と一致することを確かめたうえで、手でも確かめた
# 「2 / 1 4」：操作 1 を 3 回行い、A_1 だけを 4 にする（答え 3）
# 「2 / 4 1」：A_2 を上げる操作 2 は A_1 も上げるので差が縮まらない（-1）
compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n7\n", output: "0\n"}
  - {input: "2\n3 3\n", output: "0\n"}
  - {input: "2\n1 4\n", output: "3\n"}
  - {input: "2\n4 1\n", output: "-1\n"}
  - {input: "4\n2 2 2 5\n", output: "-1\n"}
  - {input: "2\n1 1000000000\n", output: "999999999\n"}
