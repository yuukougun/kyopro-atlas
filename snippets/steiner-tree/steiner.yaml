compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 本文の図のグラフ。指定頂点 0・1・2 を、指定されていない頂点 3 を経由してつなぐ
  - {input: "4 6 3\n0 1 4\n1 2 4\n2 0 4\n0 3 2\n1 3 2\n2 3 2\n0 1 2\n", output: "6\n"}
  # 指定頂点が 1 つなら辺は要らない
  - {input: "1 0 1\n0\n", output: "0\n"}
  # 指定頂点が 2 つなら最短路
  - {input: "4 4 2\n0 1 5\n1 3 5\n0 2 1\n2 3 1\n0 3\n", output: "2\n"}
  # 重み 0 の辺・多重辺・自己ループ
  - {input: "3 4 3\n0 1 0\n0 1 7\n1 1 3\n1 2 0\n0 1 2\n", output: "0\n"}
  # パス状のグラフで、両端の指定頂点の間の頂点を通る
  - {input: "5 4 2\n0 1 1000000000\n1 2 1000000000\n2 3 1000000000\n3 4 1000000000\n0 4\n", output: "4000000000\n"}
