compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 要素：並びは 1 通りで和は 0
  - {input: "1\n5\n", output: "0 1\n"}
  # 3 2 1 の順に入力しても 3! = 6 通りを全部回る（2 1 3 → 1+2 = 3 が最大）
  - {input: "3\n3 2 1\n", output: "3 6\n"}
  # 重複あり：1 1 2 の異なる並びは 3 通り（1 2 1 → 2 が最大）
  - {input: "3\n1 1 2\n", output: "2 3\n"}
  # 全部同じ：1 通り
  - {input: "4\n7 7 7 7\n", output: "0 1\n"}
  # 8 要素：8! = 40320 通り。1..8 の最大は 4 6 1 7 2 8 3 5 などの並びで 31
  - {input: "8\n1 2 3 4 5 6 7 8\n", output: "31 40320\n"}
