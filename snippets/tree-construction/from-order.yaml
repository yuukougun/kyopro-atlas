compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 頂点 1 つ
  - {input: "1\n0\n", output: "1\n"}
  # 根が最初でない
  - {input: "2\n1 0\n", output: "0\n"}
  # 増える順：どの頂点も、それまでのすべての頂点を親にできる（1 × 2 = 2）
  - {input: "3\n0 1 2\n", output: "2\n"}
  # 0 2 1：1 の親は直前の 2 だけ
  - {input: "3\n0 2 1\n", output: "1\n"}
  # 減る順：パスしかない
  - {input: "4\n0 3 2 1\n", output: "1\n"}
  # 0 2 1 3：候補は 1・1・3
  - {input: "4\n0 2 1 3\n", output: "3\n"}
  # 増える順の 6 頂点：5! = 120
  - {input: "6\n0 1 2 3 4 5\n", output: "120\n"}
