compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1 1\n3\n4\n", output: "12\n"}
  - {input: "3 3\n1 2 3\n4 5 6\n", output: "4 13 28 27 18\n"}
  # 998244352 = -1 なので (-1)(-1) = 1、(-1) * 1 + 1 * (-1) = -2
  - {input: "2 2\n998244352 1\n998244352 1\n", output: "1 998244351 1\n"}
  # 結果の長さ 5 を 8 に広げて計算する
  - {input: "4 2\n1 0 0 1\n1 1\n", output: "1 1 0 1 1\n"}
  - {input: "0 2\n\n1 2\n", output: "\n"}
