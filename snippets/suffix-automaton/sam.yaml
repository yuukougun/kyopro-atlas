compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 文字（状態は 2 つ）
  - {input: "a\n", output: "1\n2 1\n"}
  # ab^(N-1) の形は状態数 2N−1 に届く（複製が起きる）
  - {input: "abb\n", output: "1 3 5\n5 5\n"}
  # abbc は遷移数 3N−4 に届く
  - {input: "abbc\n", output: "1 3 5 9\n6 8\n"}
  # 同じ文字だけ：1 文字ごとに 1 つずつ増える
  - {input: "aaaa\n", output: "1 2 3 4\n5 4\n"}
  - {input: "abcbc\n", output: "1 3 6 9 12\n8 9\n"}
