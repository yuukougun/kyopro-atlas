compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n5 1\n", output: "10\n"}
  - {input: "1\n-3 1\n", output: "6\n"}
  - {input: "2\n-2 1\n3 1\n", output: "10\n"}
  - {input: "3\n2 1\n-1 2\n4 2\n", output: "10\n"}
  - {input: "3\n4 2\n-1 2\n2 3\n", output: "10\n"}
  - {input: "2\n1000000000 1\n-1000000000 2\n", output: "4000000000\n"}
