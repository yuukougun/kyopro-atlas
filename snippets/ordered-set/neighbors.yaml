compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n? 5\n", output: "- -\n"}
  - {input: "4\n+ 3\n+ 8\n? 8\n? 10\n", output: "3 8\n8 -\n"}
