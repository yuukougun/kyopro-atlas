compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1×1
  - {input: "1\n5\n", output: "5\n"}
  # 1 列目が 0 で行の交換が要る：det = 0·0 − 1·1 = −1
  - {input: "2\n0 1\n1 0\n", output: "998244352\n"}
  # 2 行目が 1 行目の 2 倍で 0
  - {input: "2\n1 2\n2 4\n", output: "0\n"}
  # 3×3：det = 1·(1·2 − (−1)·(−1)) − 1·(2·2 − (−1)·1) + 1·(2·(−1) − 1·1) = 1 − 5 − 3 = −7
  - {input: "3\n1 1 1\n2 1 998244352\n1 998244352 2\n", output: "998244346\n"}
  # 上三角はそのまま対角成分の積
  - {input: "3\n2 7 1\n0 3 8\n0 0 4\n", output: "24\n"}
