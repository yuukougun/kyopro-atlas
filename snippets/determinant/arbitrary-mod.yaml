compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 0×0 の行列式は 1（空の積）
  - {input: "0 10\n", output: "1\n"}
  # m = 6 で 2 と 3 はどちらも逆元を持たない：det = 2·3 − 0 = 6 ≡ 0
  - {input: "2 6\n2 0\n0 3\n", output: "0\n"}
  # 逆元のないピボット 4 と 6（mod 12）：det = 4·5 − 1·6 = 14 ≡ 2
  - {input: "2 12\n4 1\n6 5\n", output: "2\n"}
  # 1 列目が 0 で行の交換が要る：det = −1 ≡ 9
  - {input: "2 10\n0 1\n1 0\n", output: "9\n"}
  # 法 10^9：det = 999999999·999999999 − 0 ≡ 1
  - {input: "2 1000000000\n999999999 0\n0 999999999\n", output: "1\n"}
