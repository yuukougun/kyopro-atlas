compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # K = 0：自分自身へ重み 0、ほかは届かない
  - {input: "1 0 0\n", output: "0\n"}
  - {input: "1 0 1\n", output: "-1\n"}
  # 0→1 (1), 1→2 (1), 0→2 (5), 2→0 (1)
  - {input: "3 4 2\n0 1 1\n1 2 1\n0 2 5\n2 0 1\n", output: "6 -1 2\n"}
  - {input: "3 4 3\n0 1 1\n1 2 1\n0 2 5\n2 0 1\n", output: "3 7 11\n"}
  # 重み 0 の自己ループで待てば、K = 10^18 でも 0→1 の 3 が最小
  - {input: "2 2 1000000000000000000\n0 0 0\n0 1 3\n", output: "0 3\n"}
