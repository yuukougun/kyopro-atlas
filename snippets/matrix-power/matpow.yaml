compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # K = 0 は単位行列
  - {input: "1 0\n5\n", output: "1\n"}
  - {input: "2 0\n3 4\n5 6\n", output: "1 0\n0 1\n"}
  # フィボナッチの行列の 10 乗：F_11 = 89, F_10 = 55, F_9 = 34
  - {input: "2 10\n1 1\n1 0\n", output: "89 55\n55 34\n"}
  # 3 頂点の有向グラフ（0→1, 0→2, 1→2, 2→0）の長さ 2 のウォークの数
  - {input: "3 2\n0 1 1\n0 0 1\n1 0 0\n", output: "1 0 1\n1 0 0\n0 1 1\n"}
  # K = 10^18：[[1,1],[0,1]]^K = [[1,K],[0,1]]、10^18 mod 998244353 = 716070898
  - {input: "2 1000000000000000000\n1 1\n0 1\n", output: "1 716070898\n0 1\n"}
