compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 辺のない 1 頂点
  - {input: "1 0\n", output: "0\n0\n"}
  # 図と同じ形のグラフ（1-indexed で 1-2, 1-3, 2-3, 3-4）
  - {input: "4 4\n1 2 5\n1 3 2\n2 3 7\n3 4 1\n", output: "2 2 3 1\n0 5 2 -1\n5 0 7 -1\n2 7 0 1\n-1 -1 1 0\n"}
  # 多重辺（重み 9 と 4）と自己ループ（頂点 2）
  - {input: "2 3\n1 2 9\n2 1 4\n2 2 3\n", output: "2 4\n0 4\n4 0\n"}
  # 重みが大きくても long long に収まる
  - {input: "2 1\n1 2 1000000000000\n", output: "1 1\n0 1000000000000\n1000000000000 0\n"}
