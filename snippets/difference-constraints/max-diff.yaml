compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 本文の図の 5 つの条件。x_3 - x_0 の最大は 6
  - {input: "4 5 0 3\n0 1 4\n0 2 5\n1 2 2\n2 3 1\n3 1 -1\n", output: "6\n"}
  # 同じ条件で x_1 - x_0 の最大は 4（x_1 - x_3 <= -1 の辺は効かない）
  - {input: "4 5 0 1\n0 1 4\n0 2 5\n1 2 2\n2 3 1\n3 1 -1\n", output: "4\n"}
  # 等式 x_1 - x_0 = 3 を 2 本の辺にする。最大も最小（向きを逆にして符号を反転）も 3
  - {input: "2 2 0 1\n0 1 3\n1 0 -3\n", output: "3\n"}
  - {input: "2 2 1 0\n0 1 3\n1 0 -3\n", output: "-3\n"}
  # x_1 - x_0 <= 3 かつ x_1 - x_0 >= 4 は矛盾する（1 周 -1 の負閉路）
  - {input: "2 2 0 1\n0 1 3\n1 0 -4\n", output: "NO\n"}
  # s から届かない負閉路でも、解はない
  - {input: "3 2 0 0\n1 2 -1\n2 1 0\n", output: "NO\n"}
  # t に届かなければ x_t はいくらでも大きくできる
  - {input: "2 0 0 1\n", output: "INF\n"}
  # 変数 1 つ・条件なし
  - {input: "1 0 0 0\n", output: "0\n"}
  # 負の自己ループ（x_0 - x_0 <= -1）は矛盾
  - {input: "1 1 0 0\n0 0 -1\n", output: "NO\n"}
  # 値が 32 ビットを超える
  - {input: "3 2 0 2\n0 1 2000000000000\n1 2 3000000000000\n", output: "5000000000000\n"}
