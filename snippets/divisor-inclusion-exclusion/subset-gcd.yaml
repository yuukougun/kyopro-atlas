# main の中で、n <= 10・値 <= 30 の乱択 2000 通りについて 2^n 通りの愚直と一致することを assert で確かめてから、入力を解く
# 期待値は Python の愚直（2^n 通りの gcd）で求めた。最後の例は値の上限 10^6 までループが回る
compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n5\n", output: "0\n5\n"}
  - {input: "1\n1\n", output: "1\n1\n"}
  - {input: "3\n6 10 15\n", output: "1\n42\n"}
  - {input: "5\n1 2 3 4 6\n", output: "22\n48\n"}
  - {input: "3\n1000000 999999 500000\n", output: "3\n3000002\n"}
