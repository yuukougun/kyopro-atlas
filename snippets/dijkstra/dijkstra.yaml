compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 本文の図のグラフ（無向の辺を両向きに入れたもの）。頂点 1〜5
  - {input: "5 12\n1 2 4\n2 1 4\n1 3 1\n3 1 1\n3 2 2\n2 3 2\n2 4 1\n4 2 1\n3 4 5\n4 3 5\n4 5 3\n5 4 3\n", output: "0 3 1 4 7\n1 3 2 4 5\n"}
  # 頂点 1 つ・辺なし
  - {input: "1 0\n", output: "0\n1\n"}
  # 終点に届かない
  - {input: "3 1\n1 2 5\n", output: "0 5 -1\n-1\n"}
  # 重み 0 の辺と自己ループ・多重辺
  - {input: "3 4\n1 1 7\n1 2 3\n1 2 0\n2 3 0\n", output: "0 0 0\n1 2 3\n"}
  # 重みが大きい（和が 32 ビットを超える）
  - {input: "3 2\n1 2 1000000000000\n2 3 1000000000000\n", output: "0 1000000000000 2000000000000\n1 2 3\n"}
