compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点：動かないので 0
  - {input: "1\n0\n", output: "0\n"}
  # 2 頂点：行って戻る
  - {input: "2\n0 3\n5 0\n", output: "8\n"}
  # 向きでコストが違う 4 頂点：0→1→2→3→0 が 1+1+1+1=4
  - {input: "4\n0 1 9 9\n9 0 1 9\n9 9 0 1\n1 9 9 0\n", output: "4\n"}
  # 三角不等式を満たさない例でも「ちょうど 1 回ずつ」の最小を返す
  - {input: "3\n0 1 100\n100 0 1\n1 100 0\n", output: "3\n"}
