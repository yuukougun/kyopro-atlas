compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 点・同じ点ばかり（半径 0）
  - {input: "1\n5 5\n", output: "0.0000000000\n"}
  - {input: "3\n1 1\n1 1\n1 1\n", output: "0.0000000000\n"}
  # 2 点：その 2 点を直径とする円
  - {input: "2\n0 0\n2 0\n", output: "1.0000000000\n"}
  # 直角三角形：斜辺を直径とする円（外接円と同じ）
  - {input: "3\n0 0\n4 0\n0 3\n", output: "2.5000000000\n"}
  # 鋭角三角形：外接円（中心 (2, 5/6)、半径 13/6）
  - {input: "3\n0 0\n4 0\n2 3\n", output: "2.1666666667\n"}
  # 鈍角三角形：最長辺を直径とする円
  - {input: "3\n0 0\n10 0\n5 1\n", output: "5.0000000000\n"}
  # 3 点が一直線上（外心がない）
  - {input: "3\n0 0\n1 0\n5 0\n", output: "2.5000000000\n"}
  # 正方形の 4 頂点と中心
  - {input: "5\n0 0\n2 0\n0 2\n2 2\n1 1\n", output: "1.4142135624\n"}
