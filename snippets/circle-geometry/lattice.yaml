compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 単位円（周上の 4 点と中心）
  - {input: "0 0 1\n", output: "5\n"}
  - {input: "0 0 1.5\n", output: "9\n"}
  # 半径 0（中心が格子点なら 1）と、格子点が 1 つも入らない円
  - {input: "0 0 0\n", output: "1\n"}
  - {input: "0.5 0.5 0.5\n", output: "0\n"}
  # 周上の点をちょうど数える（負の座標も）
  - {input: "0.5 0 0.5\n", output: "2\n"}
  - {input: "-0.5 0 0.5\n", output: "2\n"}
  # 小数の桁が少ない入力・負の小数（Fraction の全探索で確かめた値）
  - {input: "3.1415 -2.7182 10.5\n", output: "346\n"}
  - {input: "-0.05 0.0001 3\n", output: "26\n"}
  # 座標と半径が 10^5 規模（2 乗は 10^18 規模）
  - {input: "100000 100000 100000\n", output: "31415925457\n"}
  - {input: "-99999.9999 0.5 99999.9999\n", output: "31415925960\n"}
