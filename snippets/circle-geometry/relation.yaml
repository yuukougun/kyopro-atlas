compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 離れる・外接・交わる・内接・内包・一致の順
  - {input: "6\n0 0 1 3 0 1\n0 0 1 2 0 1\n0 0 2 3 0 2\n0 0 3 1 0 2\n0 0 5 1 0 1\n2 3 4 2 3 4\n", output: "separate 0\nexternal 1\nintersect 1\ninternal 1\ncontain 0\nsame 1\n"}
  # 同心で半径が違う（内包）・半径 0 の円（点）が円周上にある
  - {input: "2\n0 0 3 0 0 1\n0 0 5 3 4 0\n", output: "contain 0\nexternal 1\n"}
  # 座標と半径が 10^9 規模（2 乗の和は 8×10^18 で long long に収まる）
  - {input: "2\n-1000000000 -1000000000 1000000000 1000000000 1000000000 1000000000\n-1000000000 0 1000000000 1000000000 0 1000000000\n", output: "separate 0\nexternal 1\n"}
  # 半径 0 の同じ 2 点（一致）・半径 0 の違う 2 点（離れる）
  - {input: "2\n3 4 0 3 4 0\n0 0 0 1 0 0\n", output: "same 1\nseparate 0\n"}
