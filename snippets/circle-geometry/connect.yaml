compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 外接する 2 円を伝って、左の円の左端から右の円の右端へ
  - {input: "2\n-2 0 2 0\n-1 0 1\n1 0 1\n", output: "Yes\n"}
  # 内包する 2 円は共有点がないので移れない
  - {input: "2\n-5 0 1 0\n0 0 5\n0 0 1\n", output: "No\n"}
  # 3 円の鎖（内接と外接）
  - {input: "3\n-3 0 5 0\n0 0 3\n1 0 2\n4 0 1\n", output: "Yes\n"}
  # s と t が同じ円の上
  - {input: "1\n1 0 0 1\n0 0 1\n", output: "Yes\n"}
  # 円が 1 つもつながらない
  - {input: "2\n1 0 11 0\n0 0 1\n10 0 1\n", output: "No\n"}
