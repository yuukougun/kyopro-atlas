compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 損だけの品物は選ばない（空の選び方が最適）
  - {input: "1 0\n-5\n", output: "0\n\n"}
  - {input: "1 0\n7\n", output: "7\n0\n"}
  # 0 は 1 と 2 を、3 は 2 を必要とする：10 - 4 - 3 + 2 = 5
  - {input: "4 3\n10 -4 -3 2\n0 1\n0 2\n3 2\n", output: "5\n0 1 2 3\n"}
  # 必要な品物の損が大きいので取らない
  - {input: "2 1\n3 -5\n0 1\n", output: "0\n\n"}
  # 利益 0 の同点では、s から届く最小の集合（何も選ばない）が返る
  - {input: "2 1\n5 -5\n0 1\n", output: "0\n\n"}
  # 互いに必要とする組（条件の閉路）は、まとめて選ぶか選ばないか
  - {input: "2 2\n4 -3\n0 1\n1 0\n", output: "1\n0 1\n"}
  - {input: "3 0\n0 0 0\n", output: "0\n\n"}
