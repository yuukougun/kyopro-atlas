# main の中で、n <= 8・値 <= 30 の乱択 2000 通りについて O(n^2) の愚直と一致することを assert で確かめてから、入力を解く
# 「5 / 1 2 3 4 6」と「3 / 1000000 999999 500000」の期待値は手で数えた（後者は値の上限 10^6 までループが回る）
compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n5\n", output: "1\n0\n0\n"}
  - {input: "2\n3 3\n", output: "0\n1\n0\n"}
  - {input: "4\n1 1 1 1\n", output: "0\n6\n6\n"}
  - {input: "5\n1 2 3 4 6\n", output: "1\n25\n6\n"}
  - {input: "3\n1000000 999999 500000\n", output: "2\n4\n2\n"}
