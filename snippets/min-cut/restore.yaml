compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 本文の図の例：s=0, a=1, b=2, c=3, d=4, t=5
  - {input: "6 9 0 5\n0 1 4\n0 2 2\n1 3 2\n1 2 2\n2 4 3\n3 5 3\n4 5 4\n4 1 2\n3 4 1\n", output: "5\n2\n2\n4\n"}
  # 辺がない：容量 0 のカット
  - {input: "2 0 0 1\n", output: "0\n0\n"}
  # 1 本だけ
  - {input: "2 1 0 1\n0 1 7\n", output: "7\n1\n0\n"}
  # 逆向きの辺だけ：s から t へ流れない
  - {input: "2 1 0 1\n1 0 5\n", output: "0\n0\n"}
  # 容量 0 の辺は流れないがカットに入る
  - {input: "3 2 0 2\n0 1 0\n1 2 3\n", output: "0\n1\n0\n"}
