compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 本文の図の例：0-1, 0-2, 1-3, 2-3, 1-2。費用は 1 が 5、2 が 4
  - {input: "4 5\n0 1\n0 2\n1 3\n2 3\n1 2\n0 5 4 0\n", output: "9\n2\n1\n2\n"}
  # 経路が 1 本：安い方を消す
  - {input: "4 3\n0 1\n1 2\n2 3\n0 7 3 0\n", output: "3\n1\n2\n"}
  # 始点と終点が隣り合う：切り離せない
  - {input: "3 2\n0 2\n0 1\n0 1 0\n", output: "-1\n"}
  # 最初から行けない
  - {input: "3 1\n0 1\n0 5 0\n", output: "0\n0\n"}
  # 費用 0 の頂点
  - {input: "3 2\n0 1\n1 2\n0 0 0\n", output: "0\n1\n1\n"}
