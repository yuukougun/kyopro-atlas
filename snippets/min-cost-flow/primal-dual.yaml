compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 本文の図のグラフ（s=0, a=1, b=2, t=3）。1 本目 s→a→b→t（3）、2 本目は逆辺 b→a を通る（7）
  - {input: "4 5 0 3\n0 1 1 1\n0 2 1 4\n1 2 1 1\n1 3 1 4\n2 3 1 1\n", output: "2 10\n"}
  # 辺がない
  - {input: "2 0 0 1\n", output: "0 0\n"}
  # 始点から届かない頂点 4 から、届く頂点へ辺がある（ポテンシャルの更新の境界）
  - {input: "5 6 0 3\n0 1 2 1\n1 3 1 1\n0 2 1 5\n2 3 2 0\n4 1 3 0\n4 2 3 0\n", output: "2 7\n"}
  # 容量 2 以上と多重辺・コスト 0 の辺
  - {input: "3 4 0 2\n0 1 3 0\n1 2 2 4\n1 2 2 1\n0 2 1 9\n", output: "4 15\n"}
