compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 項だけ：1/1 = 1、log 1 = 0、exp 0 = 1
  - {input: "1\n1\n", output: "1\n0\n1\n"}
  # f = 1 + x：1/f = 1 − x、log f = x − …、exp x = 1 + x
  - {input: "2\n1 1\n", output: "1 998244352\n0 1\n1 1\n"}
  # f = 1 − x：1/f = 1 + x + x^2 + …、log f = −x − x^2/2 − x^3/3 − x^4/4、exp(−x) = 1 − x + x^2/2 − x^3/6 + x^4/24
  - {input: "5\n1 998244352 0 0 0\n", output: "1 1 1 1 1\n0 998244352 499122176 665496235 249561088\n1 998244352 499122177 831870294 291154603\n"}
  # f = 1 + x + … + x^5 = (1 − x^6)/(1 − x)：x^6 未満では 1/f = 1 − x
  - {input: "6\n1 1 1 1 1 1\n", output: "1 998244352 0 0 0 0\n0 1 499122177 332748118 748683265 598946612\n1 1 499122178 166374061 291154606 24956113\n"}
