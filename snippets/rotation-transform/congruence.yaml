compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 点どうしは常に重なる
  - {input: "1\n3 5\n-2 7\n", output: "Yes\n"}
  # 2 点：長さが同じなら回転で重なる
  - {input: "2\n0 0\n2 0\n5 5\n5 7\n", output: "Yes\n"}
  - {input: "2\n0 0\n2 0\n0 0\n3 0\n", output: "No\n"}
  # 3-4-5 の直角三角形を 90 度でない角度（cos = 3/5）で回した形
  - {input: "3\n0 0\n5 0\n0 10\n0 0\n3 4\n-8 6\n", output: "Yes\n"}
  # 鏡像（反転しないと重ならない）は No
  - {input: "3\n0 0\n2 0\n0 1\n0 0\n-2 0\n0 1\n", output: "No\n"}
  # 重心に点がある：4 点と中心を cos = 3/5 の角度で回して平行移動したもの
  - {input: "5\n0 0\n3 4\n-4 3\n-3 -4\n4 -3\n10 10\n15 10\n10 15\n5 10\n10 5\n", output: "Yes\n"}
  # 長さは合うが形が違う
  - {input: "3\n0 0\n2 0\n1 3\n0 0\n2 0\n1 -2\n", output: "No\n"}
