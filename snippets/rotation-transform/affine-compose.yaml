compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 操作 0 回：単位行列のまま
  - {input: "1\n3 4\n0\n1\n0 0\n", output: "3 4\n"}
  # 時計回り 90 度 → x = 1 で反転：(1, 2) → (2, -1) → (0, -1)。順序を逆にすると (1, 2) → (1, 2) → (2, -1) で異なる
  - {input: "1\n1 2\n2\n1\n3 1\n3\n0 0\n1 0\n2 0\n", output: "1 2\n2 -1\n0 -1\n"}
  # 反時計回り → y = 3 で反転、2 点
  - {input: "2\n1 0\n0 0\n2\n2\n4 3\n4\n1 0\n2 0\n1 1\n2 1\n", output: "0 1\n0 5\n0 0\n0 6\n"}
  # 座標・p が 10^9 で、反転を繰り返すと int に収まらない値になる
  - {input: "1\n-1000000000 0\n2\n3 1000000000\n3 -1000000000\n2\n1 0\n2 0\n", output: "3000000000 0\n-5000000000 0\n"}
