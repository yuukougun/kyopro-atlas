compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "3 10 1\n3 5 7\n", output: "5\n"}
  - {input: "1 10 1\n4\n", output: "4\n"}
