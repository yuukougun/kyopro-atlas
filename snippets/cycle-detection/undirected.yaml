compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 辺がない
  - {input: "1 0\n", output: "-1\n"}
  # 自己ループ
  - {input: "1 1\n0 0\n", output: "1\n0\n"}
  # 木（パス）には閉路がない
  - {input: "3 2\n0 1\n1 2\n", output: "-1\n"}
  # 多重辺は長さ 2 の閉路（頂点で親を除くと見落とす）
  - {input: "2 2\n0 1\n0 1\n", output: "2\n0 1\n"}
  # 三角形
  - {input: "3 3\n0 1\n1 2\n2 0\n", output: "3\n0 1 2\n"}
  # 森の 2 つ目の成分に閉路がある
  - {input: "5 4\n0 1\n2 3\n3 4\n4 2\n", output: "3\n2 3 4\n"}
