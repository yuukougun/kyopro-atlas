compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 辺がない
  - {input: "1 0\n", output: "-1\n"}
  # 自己ループは長さ 1 の閉路
  - {input: "1 1\n0 0\n", output: "1\n0\n"}
  # 0→1、0→2→1：完了した 1 への辺は閉路ではない
  - {input: "3 3\n0 1\n0 2\n2 1\n", output: "-1\n"}
  # 0→1→2→0
  - {input: "3 3\n0 1\n1 2\n2 0\n", output: "3\n0 1 2\n"}
  # 閉路の手前にしっぽがある：0→1→2→3→1
  - {input: "4 4\n0 1\n1 2\n2 3\n3 1\n", output: "3\n1 2 3\n"}
  # 向きが逆の 2 本は長さ 2 の閉路
  - {input: "2 2\n0 1\n1 0\n", output: "2\n0 1\n"}
  # 頂点 0 から届かない所に閉路がある
  - {input: "4 3\n0 1\n2 3\n3 2\n", output: "2\n2 3\n"}
