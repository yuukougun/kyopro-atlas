compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 2x + y = 5, x + 3y = 10 → x = 1, y = 3
  - {input: "2 2\n2 1 5\n1 3 10\n", output: "2\nunique 1 3\n"}
  # 1 列目の係数が 0 で、行の入れ替えが要る
  - {input: "2 2\n0 1 4\n1 1 6\n", output: "2\nunique 2 4\n"}
  # x + y = 1, 2x + 2y = 3 → 0 = 1 の行が残る
  - {input: "2 2\n1 1 1\n2 2 3\n", output: "1\nnone\n"}
  # x + y = 2, 2x + 2y = 4 → 自由変数 y = 0
  - {input: "2 2\n1 1 2\n2 2 4\n", output: "1\nmany 2 0\n"}
  # 2x = 1 → x = 1/2 = 499122177
  - {input: "1 1\n2 1\n", output: "1\nunique 499122177\n"}
  # 係数がすべて 0 で右辺も 0
  - {input: "1 2\n0 0 0\n", output: "0\nmany 0 0\n"}
  # 係数が 998244353 の倍数（整数としては 0 でない）
  - {input: "2 2\n998244353 1 3\n1 1 5\n", output: "2\nunique 2 3\n"}
