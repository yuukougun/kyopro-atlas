compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点：辺は要らない
  - {input: "1\n0\n", output: "0\n"}
  # 2 頂点：直接つなぐしかない
  - {input: "2\n0 5\n5 0\n", output: "5\n"}
  # 1 + 2 = 3：長さ 3 の組は迂回できるので要らない
  - {input: "3\n0 1 3\n1 0 2\n3 2 0\n", output: "3\n"}
  # 1 + 1 < 3：三角不等式が崩れている
  - {input: "3\n0 1 3\n1 0 1\n3 1 0\n", output: "-1\n"}
  # 本文の図の表（4 頂点）：0-1・1-2・1-3・2-3 を残し、0-2・0-3 は迂回できる
  - {input: "4\n0 2 5 6\n2 0 3 4\n5 3 0 4\n6 4 4 0\n", output: "13\n"}
  # 和が int を超える
  - {input: "3\n0 1000000000 1000000000\n1000000000 0 1000000000\n1000000000 1000000000 0\n", output: "3000000000\n"}
