compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点・辺なし
  - {input: "1 0\n", output: "0\n0\n0\n0\n"}
  # 三角形：積むときに印を付けると、木に入らない辺 2-3 が兄弟どうしを結ぶ
  - {input: "3 3\n1 2\n1 3\n2 3\n", output: "0\n0\n0\n1\n"}
  # パス（木そのもの。木に入らない辺がない）
  - {input: "4 3\n1 2\n2 3\n3 4\n", output: "0\n0\n0\n0\n"}
  # 本文の図のグラフ（6 頂点・8 本。入力は 1-indexed なので、図の頂点 v は入力の v + 1）
  - {input: "6 8\n1 2\n1 3\n2 4\n2 5\n3 5\n4 5\n5 6\n3 6\n", output: "0\n0\n0\n3\n"}
  # 完全グラフ K4
  - {input: "4 6\n1 2\n1 3\n1 4\n2 3\n2 4\n3 4\n", output: "0\n0\n0\n3\n"}
