compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 要素：加算の前後で数える
  - {input: "1 3\n5\n2 0 1 5\n1 0 1 -1\n2 0 1 5\n", output: "1\n0\n"}
  # 空の区間 l = r は 0 個、加算しても何も変わらない
  - {input: "3 3\n1 2 3\n1 1 1 100\n2 2 2 0\n2 0 3 2\n", output: "0\n2\n"}
  # 長さ 5（B = 2）：加算 [1, 5) はブロック 1 が丸ごと入りタグが 10 になる（値は 1 12 13 14 15）。
  # 質問 [0, 5) はタグ付きのブロック 1 を二分探索で数え、[2, 3) は同じブロックの中を 1 つずつ見る
  - {input: "5 5\n1 2 3 4 5\n2 0 5 3\n1 1 5 10\n2 0 5 12\n2 2 3 13\n2 4 5 5\n", output: "3\n4\n1\n1\n"}
