# main の中で、愚直な O(4^n) の計算と一致すること、2 回の変換で 2^n 倍に戻ることを assert で確かめてから出力する
# 「0 / 5 / 7 / 3」：長さ 1（n = 0）では 5 × 7 = 35、5^3 = 125
# 「1 / 1 2 / 3 4 / 2」：c = (1·3 + 2·4, 1·4 + 2·3) = (11, 10)、(1, 2) を 2 回で (1 + 4, 2 + 2) = (5, 4)（手で計算した）
# 「2 / 0 1 1 0 / 0 1 1 0 / 0」：K = 0 は単位元 (1, 0, 0, 0)。{1, 2} どうしの XOR は 0 が 2 通り・3 が 2 通り
# 「2 / 998244352 0 0 1 / 2 0 0 0 / 5」：法 − 1（= −1）を含み、引き算が負にならないことを確かめる
compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "0\n5\n7\n3\n", output: "35\n125\n"}
  - {input: "1\n1 2\n3 4\n2\n", output: "11 10\n5 4\n"}
  - {input: "2\n0 1 1 0\n0 1 1 0\n0\n", output: "2 0 0 2\n1 0 0 0\n"}
  - {input: "2\n998244352 0 0 1\n2 0 0 0\n5\n", output: "998244351 0 0 2\n998244337 0 0 16\n"}
