compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 要素：正なら反転しない
  - {input: "1\n5\n", output: "5\n"}
  - {input: "1\n-5\n", output: "5\n"}
  # 真ん中だけ反転
  - {input: "3\n1 -2 3\n", output: "6\n"}
  # 全体を反転
  - {input: "3\n-4 1 -3\n", output: "6\n"}
  # 負の区間が 2 つ離れている（1 つしか反転できない）
  - {input: "5\n-3 5 5 5 -2\n", output: "16\n"}
