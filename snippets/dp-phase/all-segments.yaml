compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 要素
  - {input: "1 3\n3\n", output: "1\n"}
  - {input: "1 3\n2\n", output: "0\n"}
  # 区間 [0,2) で {2,2}、[0,3) で {2,2}・{4}、[1,3) で {4}、[2,3) で {4}
  - {input: "3 4\n2 2 4\n", output: "5\n"}
  # 和 2 は 2 つの 1 の組。組 (i, j) を含む区間は (i+1)(5-j) 個
  - {input: "5 2\n1 1 1 1 1\n", output: "35\n"}
  - {input: "6 3\n1 2 3 1 2 3\n", output: "39\n"}
