compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 辺のない 1 頂点
  - {input: "1 0\n", output: "-1\n0\n"}
  # 三角形だけ（長さ 4 の閉路はない）
  - {input: "3 3\n1 2\n2 3\n3 1\n", output: "-1\n0\n"}
  # 長さ 4 の閉路 1-2-3-4
  - {input: "4 4\n1 2\n2 3\n3 4\n4 1\n", output: "1 2 3 4\n1\n"}
  # 完全グラフ K4（長さ 4 の閉路は 3 個）
  - {input: "4 6\n1 2\n1 3\n1 4\n2 3\n2 4\n3 4\n", output: "1 3 2 4\n3\n"}
