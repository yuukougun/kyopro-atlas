compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 左 0 が先に右 0 を取り、左 1 の探索で交互路 1→0→0→1 を反転する
  - {input: "2 2 3\n0 0\n0 1\n1 0\n", output: "2\n1 0\n"}
  # 辺がない
  - {input: "1 1 0\n", output: "0\n-1\n"}
  # 左 3 個が同じ右 1 個を取り合う
  - {input: "3 1 3\n0 0\n1 0\n2 0\n", output: "1\n0 -1 -1\n"}
  # 長い交互路（左 i は右 i と右 i+1、最後の左だけ右 0 しか使えない）
  - {input: "3 3 5\n0 0\n0 1\n1 1\n1 2\n2 0\n", output: "3\n1 2 0\n"}
