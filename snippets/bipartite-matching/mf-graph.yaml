compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 左 0 が右 0 を取ると左 1 が余る形（貪欲の失敗例）。最大は 2
  - {input: "2 2 3\n0 0\n0 1\n1 0\n", output: "2\n0 1\n1 0\n"}
  # 辺がない
  - {input: "1 1 0\n", output: "0\n"}
  # 左 3 個が同じ右 1 個を取り合う
  - {input: "3 1 3\n0 0\n1 0\n2 0\n", output: "1\n0 0\n"}
