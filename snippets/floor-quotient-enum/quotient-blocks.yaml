# main の中で、n <= 3000 の全通りについて愚直な和・値の種類数・種類数の式と一致することを assert で確かめてから、次のケースを解く
# 大きいケースの期待値は Python の多倍長整数で 2Σ_{i<=s}⌊n/i⌋ − s²（s = ⌊√n⌋）と 2s − [⌊n/s⌋ = s] を計算して確かめた
compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n1\n", output: "1 1\n"}
  - {input: "3\n2\n10\n20\n", output: "3 2\n27 5\n66 8\n"}
  - {input: "2\n999999999999\n1000000000000\n", output: "27785452448917 1999998\n27785452449086 1999999\n"}
