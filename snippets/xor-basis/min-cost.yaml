compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # n = 1：1 を買うしかない
  - {input: "1\n7\n", output: "7\n"}
  # n = 2：最も安い 3 と、次に安い 1 で足りる（2 = 1 xor 3）
  - {input: "2\n5 9 1\n", output: "6\n"}
  # n = 3：安い順に 7・6・1 を見ると 1 = 7 xor 6 で入らず、次の 2 が入る
  - {input: "3\n2 3 10 10 10 1 1\n", output: "5\n"}
  # 値段がすべて同じ
  - {input: "3\n4 4 4 4 4 4 4\n", output: "12\n"}
  # n = 4：値段が大きい
  - {input: "4\n1000000000 1000000000 1000000000 1000000000 1000000000 1000000000 1000000000 1000000000 1000000000 1000000000 1000000000 1000000000 1000000000 1000000000 1000000000\n", output: "4000000000\n"}
