compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 13・9・6・11：11 は作れる値なので基底は 3 個、作れる値は 8 個
  - {input: "4\n13 9 6 11\n4\n0 1 7 8\n", output: "3\n15\n0\n2\n15\n-1\n"}
  # 空の集合：作れるのは 0 だけ
  - {input: "0\n2\n0 1\n", output: "0\n0\n0\n-1\n"}
  # 0 だけ・同じ値の重複
  - {input: "3\n0 5 5\n2\n0 1\n", output: "1\n5\n0\n5\n"}
  # 3・5・6：3 xor 5 = 6 なので 4 種類
  - {input: "3\n3 5 6\n4\n0 1 2 3\n", output: "2\n6\n0\n3\n5\n6\n"}
  # 2^60 - 1 と 2^59：境界の bit
  - {input: "2\n1152921504606846975 576460752303423488\n2\n2 3\n", output: "2\n1152921504606846975\n576460752303423488\n1152921504606846975\n"}
