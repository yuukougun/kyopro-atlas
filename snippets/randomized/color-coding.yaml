compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # K = 1：重みの最大の頂点 1 つ
  - {input: "3 0 1\n4 9 2\n", output: "9\n"}
  # 星形（中心 0）：3 頂点のパスは 葉-中心-葉 で 5+1+4 = 10。4 頂点のパスはない
  - {input: "4 3 3\n1 5 4 3\n0 1\n0 2\n0 3\n", output: "10\n"}
  - {input: "4 3 4\n1 5 4 3\n0 1\n0 2\n0 3\n", output: "-1\n"}
  # 閉路 0-1-2-3-4-0 と弦 1-3：4 頂点のパスの最大は 2-1-3-4 で 2+7+9+8 = 26
  - {input: "5 6 4\n1 7 2 9 8\n0 1\n1 2\n2 3\n3 4\n4 0\n1 3\n", output: "26\n"}
  # 完全グラフ K5 で K = 5：全頂点を通る
  - {input: "5 10 5\n1 2 3 4 5\n0 1\n0 2\n0 3\n0 4\n1 2\n1 3\n1 4\n2 3\n2 4\n3 4\n", output: "15\n"}
