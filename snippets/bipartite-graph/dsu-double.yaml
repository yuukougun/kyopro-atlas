compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 長さ 4 の閉路までは塗れ、対角線 1-3 で長さ 3 の閉路ができて塗れなくなる
  - {input: "4 5\n1 2\n2 3\n3 4\n4 1\n1 3\n", output: "Yes\nYes\nYes\nYes\nNo\n"}
  # 別々の成分をつないでも二部グラフのまま
  - {input: "4 3\n1 2\n3 4\n2 3\n", output: "Yes\nYes\nYes\n"}
  # 自己ループ
  - {input: "1 1\n1 1\n", output: "No\n"}
  # 頂点 1 つ・辺なし
  - {input: "1 0\n", output: ""}
