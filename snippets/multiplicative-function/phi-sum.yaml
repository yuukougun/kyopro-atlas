# main の中で、n <= 2000 の全通りについて φ を素朴に足した値と一致することを assert で確かめる
# 10^6・10^10 の期待値は、同じ漸化式を Python の多倍長整数で計算し（Σφ(10^6) = 303963552392、Σφ(10^10) = 30396355092886216366）、998244353 で割った余り
compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n", output: "1\n"}
  - {input: "10\n", output: "32\n"}
  - {input: "1000000\n", output: "497269080\n"}
  - {input: "10000000000\n", output: "866849765\n"}
