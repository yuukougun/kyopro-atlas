compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1 100\n", output: "1\n"}
  - {input: "2 100\n1 2\n", output: "2\n2\n"}
  - {input: "3 100\n1 2\n2 3\n", output: "3\n4\n3\n"}
  - {input: "3 2\n1 2\n2 3\n", output: "1\n0\n1\n"}
  - {input: "4 6\n1 2\n1 3\n1 4\n", output: "2\n5\n5\n5\n"}
  - {input: "6 1000000000\n1 2\n1 3\n2 4\n2 5\n3 6\n", output: "15\n16\n12\n9\n9\n7\n"}
