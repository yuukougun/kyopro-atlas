compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 図の例：8 要素を併合し、7 の根をたどる（最後の行はグループの数）
  - {input: "8 9\n0 0 1\n0 2 3\n0 0 2\n0 4 5\n0 6 7\n0 4 6\n0 0 4\n1 7 3\n2 5\n", output: "Yes\n8\n1\n"}
  # 1 要素・自分自身との併合（失敗する）
  - {input: "1 3\n0 0 0\n1 0 0\n2 0\n", output: "Yes\n1\n1\n"}
  # 同じグループどうしの併合を繰り返しても、数は 1 回分しか減らない
  - {input: "4 6\n0 0 1\n0 1 0\n0 0 1\n1 0 2\n2 1\n2 3\n", output: "No\n2\n1\n3\n"}
  # 質問だけ
  - {input: "3 2\n1 0 2\n2 2\n", output: "No\n1\n3\n"}
