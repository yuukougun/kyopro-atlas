compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点：根はいつも良い頂点
  - {input: "1\n5\n", output: "1\n"}
  # パス 1-2-3-4、色 1 2 1 3：頂点 3 は根と同じ色
  - {input: "4\n1 2 1 3\n1 2\n2 3\n3 4\n", output: "1\n2\n4\n"}
  # 根 1 の子 2・3、2 の子 4・5。色 1 2 2 2 1：兄弟の 2 と 3 は互いに影響しない
  - {input: "5\n1 2 2 2 1\n1 2\n1 3\n2 4\n2 5\n", output: "1\n2\n3\n"}
  # 辺の向きが逆に与えられても根は 1
  - {input: "3\n7 7 8\n2 1\n3 2\n", output: "1\n3\n"}
