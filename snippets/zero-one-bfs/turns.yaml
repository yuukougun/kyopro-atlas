compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 壁のない 3×3 で対角へ：1 回曲がる
  - {input: "3 3\n0 0 2 2\n...\n...\n...\n", output: "1\n"}
  # スタートとゴールが同じ 1×1
  - {input: "1 1\n0 0 0 0\n.\n", output: "0\n"}
  # 一直線なら曲がらない
  - {input: "1 3\n0 0 0 2\n...\n", output: "0\n"}
  # 行けない
  - {input: "2 2\n0 0 1 1\n.#\n#.\n", output: "-1\n"}
  # 右・下・左と進む：2 回曲がる
  - {input: "3 3\n0 0 2 0\n...\n##.\n...\n", output: "2\n"}
