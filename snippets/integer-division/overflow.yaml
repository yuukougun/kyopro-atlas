  - {input: "2\n1000000000 1000000001\n", output: "-1 -1\n"}
  - {input: "2\n1000000000000000000 1000000000000000000\n", output: "-1 1000000000000000000\n"}
  - {input: "2\n999999999 1000000000\n", output: "999999999000000000 999999999000000000\n"}
  - {input: "2\n1000000000000000000 999999999999999999\n", output: "-1 -1\n"}
  - {input: "3\n4 6 10\n", output: "240 60\n"}
