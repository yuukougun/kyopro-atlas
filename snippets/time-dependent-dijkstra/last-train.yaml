compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "2 0\n", output: "Unreachable\n"}
  - {input: "2 1\n1 1 1 1 1 2\n", output: "1\n"}
  - {input: "3 2\n1 5 3 2 1 2\n5 10 2 1 2 3\n", output: "11\n15\n"}
  - {input: "3 3\n1 5 3 2 1 2\n5 10 2 1 2 3\n12 1 1 100 1 3\n", output: "12\n15\n"}
  - {input: "3 2\n10 100 5 1 1 2\n5 1 1 1 2 3\n", output: "Unreachable\n5\n"}
  - {input: "2 1\n1000000000 1000000000 1000000000 1000000000 1 2\n", output: "1000000000000000000\n"}
