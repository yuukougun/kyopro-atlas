compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点・辺なし
  - {input: "1 0\n", output: "0\n0\n"}
  # 本文の図：三角形 2 つを橋でつなぎ、先に 1 本の橋
  - {input: "7 8\n0 1\n1 2\n2 0\n1 3\n3 4\n4 5\n5 3\n5 6\n", output: "2 3 7\n3 1 3 5\n"}
  # 多重辺：0-1 の 2 本はどちらも橋ではない。1-2 は橋
  - {input: "3 3\n0 1\n1 0\n1 2\n", output: "1 2\n1 1\n"}
  # パス：すべての辺が橋、端以外が関節点
  - {input: "4 3\n0 1\n1 2\n2 3\n", output: "3 0 1 2\n2 1 2\n"}
  # 根が関節点になる星形と、自己ループ・孤立点を含む非連結なグラフ
  - {input: "6 4\n0 1\n0 2\n0 3\n4 4\n", output: "3 0 1 2\n1 0\n"}
  # 閉路（橋も関節点もない）
  - {input: "4 4\n0 1\n1 2\n2 3\n3 0\n", output: "0\n0\n"}
