compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点・辺なし
  - {input: "1 0\n", output: "0\n0\n"}
  # 本文の図：三角形 2 つを橋でつなぎ、先に 1 本の橋（図の頂点 v を v + 1 にしたもの。橋は 4 本目と 8 本目の辺）
  - {input: "7 8\n1 2\n2 3\n3 1\n2 4\n4 5\n5 6\n6 4\n6 7\n", output: "2 4 8\n3 2 4 6\n"}
  # 多重辺：1-2 の 2 本はどちらも橋ではない。2-3 は橋
  - {input: "3 3\n1 2\n2 1\n2 3\n", output: "1 3\n1 2\n"}
  # パス：すべての辺が橋、端以外が関節点
  - {input: "4 3\n1 2\n2 3\n3 4\n", output: "3 1 2 3\n2 2 3\n"}
  # 根が関節点になる星形と、自己ループ・孤立点を含む非連結なグラフ
  - {input: "6 4\n1 2\n1 3\n1 4\n5 5\n", output: "3 1 2 3\n1 1\n"}
  # 閉路（橋も関節点もない）
  - {input: "4 4\n1 2\n2 3\n3 4\n4 1\n", output: "0\n0\n"}
