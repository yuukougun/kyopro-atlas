compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点・辺なし
  - {input: "1 0\n", output: "1\n0\n"}
  # 本文の図：{0,1,2}・{3,4,5}・{6} の 3 成分が橋 2 本でつながる
  - {input: "7 8\n0 1\n1 2\n2 0\n1 3\n3 4\n4 5\n5 3\n5 6\n", output: "3\n0 0 0 1 1 1 2\n"}
  # 多重辺は同じ成分にまとまる
  - {input: "3 3\n0 1\n1 0\n1 2\n", output: "2\n0 0 1\n"}
  # 非連結・自己ループ
  - {input: "5 3\n0 1\n2 2\n3 4\n", output: "5\n0 1 2 3 4\n"}
