compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "5 0\n4 1 0 2 3\n10 20 30 40 50\n", output: "10 20 30 40 50\n"}
  - {input: "5 1\n4 1 0 2 3\n10 20 30 40 50\n", output: "50 20 10 30 40\n"}
