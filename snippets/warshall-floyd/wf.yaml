compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 本文の例（4 頂点・5 本の有向辺。本文の頂点 v を v + 1 にしたもの）
  - {input: "4 5\n1 2 5\n1 4 1\n4 3 1\n3 2 1\n2 1 2\n", output: "0 3 2 1\n2 0 4 3\n3 1 0 4\n4 2 1 0\n"}
  # 1 頂点・辺なし
  - {input: "1 0\n", output: "0\n"}
  # 負の辺と届かない組（頂点 3 からはどこへも行けない）。多重辺と正の自己ループも含む
  - {input: "3 4\n1 2 4\n1 2 2\n2 3 -3\n2 2 5\n", output: "0 2 -1\nINF 0 -3\nINF INF 0\n"}
  # 負閉路（2 → 3 → 2 が -1）
  - {input: "3 3\n1 2 1\n2 3 -2\n3 2 1\n", output: "NEGATIVE CYCLE\n"}
  # 負の自己ループ
  - {input: "2 1\n2 2 -1\n", output: "NEGATIVE CYCLE\n"}
