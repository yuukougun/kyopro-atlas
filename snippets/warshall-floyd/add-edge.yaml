compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 辺のない 3 頂点に順に足す。3 本目は 0 - 2 を 5 から 1 に縮める
  - {input: "3 0\n3\n0 1 2\n1 2 3\n0 2 1\n", output: "2\n10\n6\n"}
  # 1 頂点（自己ループを足しても何も変わらない）
  - {input: "1 0\n1\n0 0 7\n", output: "0\n"}
  # 既存より長い辺は何も変えない。長さ 0 の辺
  - {input: "4 3\n0 1 1\n1 2 1\n2 3 1\n2\n0 3 10\n0 3 0\n", output: "10\n5\n"}
