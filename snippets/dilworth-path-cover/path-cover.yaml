compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "0 0\n", output: "paths 0\nchains 0\nantichain:\n"}
  - {input: "1 0\n", output: "paths 1\nchains 1\nantichain: 0\n"}
  - {input: "3 0\n", output: "paths 3\nchains 3\nantichain: 0 1 2\n"}
  - {input: "4 3\n0 1\n1 2\n2 3\n", output: "paths 1\nchains 1\nantichain: 3\n"}
  - {input: "4 4\n0 1\n0 2\n1 3\n2 3\n", output: "paths 2\nchains 2\nantichain: 1 2\n"}
  - {input: "5 4\n0 2\n1 2\n2 3\n2 4\n", output: "paths 3\nchains 2\nantichain: 3 4\n"}
