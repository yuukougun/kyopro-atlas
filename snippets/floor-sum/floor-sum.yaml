# main の中で、小さい値の全通りと乱数の値について愚直解との一致を assert で確かめてから、次のケースを解く
# 期待する出力は、別の式（i を 0〜N の閉区間で回す古典的な再帰）を Python の多倍長整数で計算して確かめた
compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n0 1 0 0\n", output: "0\n"}
  - {input: "1\n1 1 0 0\n", output: "0\n"}
  - {input: "3\n6 5 3 2\n4 3 5 7\n5 7 0 3\n", output: "9\n18\n0\n"}
  - {input: "2\n1000000000 1000000000 999999999 999999999\n1000000000 999999937 1 0\n", output: "499999999500000000\n63\n"}
  - {input: "1\n4294967295 4294967295 4294967295 4294967295\n", output: "9223372034707292160\n"}
