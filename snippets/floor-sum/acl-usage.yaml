# main の中で、小さい値の全通りについて 3 つの量が愚直解と一致することを assert で確かめてから、次のケースを解く
# 大きいケースの期待値は Python の多倍長整数（floor sum）と、式で数えた個数で確かめた
compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "1\n0 1 0 0\n", output: "0 0 0\n"}
  - {input: "1\n1 1 0 0\n", output: "0 0 0\n"}
  - {input: "3\n6 5 3 2\n4 3 5 7\n5 7 0 3\n", output: "9 12 2\n18 4 1\n0 15 3\n"}
  - {input: "2\n1000000000 1000000000 999999999 999999999\n1000000000 999999937 1 0\n", output: "499999999500000000 499999999500000000 500000000\n63 499999936500003969 0\n"}
  - {input: "1\n4294967295 4294967295 4294967295 4294967295\n", output: "9223372034707292160 0 0\n"}
