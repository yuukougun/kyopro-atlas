compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 先頭・真ん中・末尾への挿入と、先頭・末尾の削除
  - {input: "3\n10 20 30\n4\n1 10 15\n1 30 40\n2 10\n2 40\n", output: "15 20 30\n"}
  # 1 要素から始めてすべて消すと空の列になる
  - {input: "1\n5\n1\n2 5\n", output: "\n"}
  # 消した値をもう一度挿入する・大きな値
  - {input: "2\n1000000000 7\n3\n2 7\n1 1000000000 7\n1 7 999999999\n", output: "1000000000 7 999999999\n"}
  # 同じ値の直後に続けて挿入すると、後から入れたものが前に来る
  - {input: "1\n1\n2\n1 1 3\n1 1 2\n", output: "1 2 3\n"}
