compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "0\n\n", output: "\n"}
  - {input: "1\n5\n", output: "5/1\n"}
  - {input: "1\n-3\n", output: "-3/1\n"}
  - {input: "4\n1 2 3 4\n", output: "5/2 3/1 7/2 4/1\n"}
  - {input: "4\n4 3 2 1\n", output: "4/1 3/1 2/1 1/1\n"}
  - {input: "5\n2 -1 3 -2 1\n", output: "2/1 1/1 3/1 -1/2 1/1\n"}
  - {input: "3\n0 0 0\n", output: "0/1 0/1 0/1\n"}
  - {input: "3\n1000000 -1000000 1000000\n", output: "1000000/1 0/1 1000000/1\n"}
