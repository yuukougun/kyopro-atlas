compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 本文の図（反復ごとの dist）のグラフ。辺はこの順に緩和する
  - {input: "4 5\n3 4 3\n2 3 -2\n1 2 4\n1 3 5\n1 4 9\n", output: "0 4 2 5\n"}
  # 本文の図（3 種類の頂点）のグラフ。頂点 s, a, b, c, d, x, y を 1〜7 にしたもの
  - {input: "7 8\n1 2 2\n2 3 1\n3 2 -3\n3 4 1\n1 5 3\n6 7 -1\n7 6 -1\n7 5 -5\n", output: "0 -INF -INF -INF 3 INF INF\n"}
  # 2N 回で dist[N] の変化を見るだけでは見逃す例（閉路は 1 周 -1 だが、直通の辺がずっと短い）
  - {input: "4 5\n1 4 -500000000\n1 2 0\n2 3 -2\n3 2 1\n3 4 500000000\n", output: "0 -INF -INF -INF\n"}
  # 頂点 1 つ・辺なし
  - {input: "1 0\n", output: "0\n"}
  # 無向の負の辺を両向きに入れると、それだけで負閉路になる（始点も -INF）
  - {input: "2 2\n1 2 -1\n2 1 -1\n", output: "-INF -INF\n"}
  # 負の自己ループ
  - {input: "3 3\n1 2 5\n2 2 -1\n1 3 7\n", output: "0 -INF 7\n"}
  # 重みが大きい（和が 32 ビットを超える）
  - {input: "3 2\n1 2 -1000000000000\n2 3 -1000000000000\n", output: "0 -1000000000000 -2000000000000\n"}
