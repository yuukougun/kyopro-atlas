  - {input: "1 2\n5\n1 0\n0 0 -7\n", output: "5\n"}
  # パス状の木（0-1-2-3）と葉の部分木
  - {input: "4 3\n1 1 1 1\n0 1 2\n1 2\n1 3\n1 0\n", output: "2\n1\n4\n"}
