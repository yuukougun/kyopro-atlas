compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 0-1-2-3 の道の後に 3-0（長さ 4 の閉路）は塗れ、0-2 で長さ 3 の閉路ができて塗れなくなる
  - {input: "4 6\n0 1\n1 2\n2 3\n3 0\n0 2\n1 3\n", output: "Yes\nYes\nYes\nYes\nNo\nNo\n"}
  - {input: "1 0\n", output: ""}
  # 自己ループは塗れない
  - {input: "2 2\n0 1\n1 1\n", output: "Yes\nNo\n"}
