compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # N = 2 は質問せずに答える
  - {input: "2\n", output: "! 1\n"}
  # S = 0 0 1 1 1：? 3 → 1、? 2 → 0
  - {input: "5\n1\n0\n", output: "? 3\n? 2\n! 2\n"}
  # S = 0 1 0 0 1 1：? 3 → 0、? 4 → 0、? 5 → 1（単調でなくても境界の 1 つが見つかる）
  - {input: "6\n0\n0\n1\n", output: "? 3\n? 4\n? 5\n! 4\n"}
  # 不正の合図 -1 を受け取ったら何も出さずに終わる
  - {input: "5\n-1\n", output: "? 3\n"}
