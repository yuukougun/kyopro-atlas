compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点・辺なし
  - {input: "1 0\n", output: "1\n0\n"}
  # 本文の図のグラフ
  - {input: "8 12\n1 2\n2 3\n3 1\n3 4\n4 5\n5 4\n2 6\n6 6\n4 7\n5 7\n6 7\n7 8\n", output: "5\n0 0 0 2 2 1 3 4\n"}
  # 一直線（3→2→1）なら成分は 1 頂点ずつで、番号は 3, 2, 1 の順
  - {input: "3 2\n3 2\n2 1\n", output: "3\n2 1 0\n"}
