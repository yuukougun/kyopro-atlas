compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点・辺なし
  - {input: "1 0\n5\n", output: "5\n"}
  # 本文の図のグラフ（頂点 1〜8）。価値はすべて 1 なので、訪れられる頂点の数の最大
  - {input: "8 12\n1 1 1 1 1 1 1 1\n1 2\n2 3\n3 1\n3 4\n4 5\n5 4\n2 6\n6 6\n4 7\n5 7\n6 7\n7 8\n", output: "7\n"}
  # 閉路 1→2→1 を回って 2 の先の重い頂点へ行ける。3 には戻れない向きなので取れない
  - {input: "4 4\n1 1 100 7\n1 2\n2 1\n3 1\n2 4\n", output: "9\n"}
  # 分かれ道：多重辺があっても最大値の DP は変わらない
  - {input: "4 5\n0 3 5 1\n1 2\n1 3\n1 3\n2 4\n3 4\n", output: "6\n"}
