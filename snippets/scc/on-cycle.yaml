compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 1 頂点・辺なし
  - {input: "1 0\n", output: "0\n"}
  # 自己ループだけ
  - {input: "1 1\n1 1\n", output: "1\n"}
  # 本文の図のグラフ：{1,2,3}・{4,5}・自己ループの 6
  - {input: "8 12\n1 2\n2 3\n3 1\n3 4\n4 5\n5 4\n2 6\n6 6\n4 7\n5 7\n6 7\n7 8\n", output: "6\n"}
  # DAG（多重辺あり）なら 0
  - {input: "3 3\n1 2\n1 2\n2 3\n", output: "0\n"}
