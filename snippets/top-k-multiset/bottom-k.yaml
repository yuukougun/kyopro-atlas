compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  # 図の例：K = 3、{1, 4, 5, 7, 9} に 3 を足し、1 を消す
  - {input: "3 10\n1 1\n1 4\n1 5\n1 7\n1 9\n3\n1 3\n3\n2 1\n3\n", output: "10\n8\n12\n"}
  # 空・K 個未満・K = 0
  - {input: "2 5\n3\n1 5\n3\n1 2\n3\n", output: "0\n5\n7\n"}
  - {input: "0 3\n1 4\n1 -2\n3\n", output: "0\n"}
  # 同じ値が L と R にまたがるときの削除
  - {input: "2 9\n1 5\n1 5\n1 5\n1 1\n3\n2 5\n3\n2 1\n3\n", output: "6\n6\n10\n"}
