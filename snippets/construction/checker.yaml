compilers: [g++-15]
flags: "-std=gnu++23 -O2 -Wall -Wextra"
expect: run
cases:
  - {input: "4 3\n3\n1 4\n2 4\n3 4\n", output: "OK\n"}
  - {input: "4 2\n4\n1 4\n2 4\n3 4\n1 2\n", output: "OK\n"}
  - {input: "4 3\n2\n1 4\n2 4\n", output: "not connected\n"}
  - {input: "3 1\n3\n1 3\n2 3\n2 3\n", output: "multiple edge\n"}
  - {input: "3 1\n2\n1 1\n2 3\n", output: "self loop\n"}
  - {input: "4 1\n3\n1 4\n2 4\n3 4\n", output: "distance-2 pairs = 3\n"}
  - {input: "2 1\n-1\n", output: "claimed impossible\n"}
