<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" font-size="15">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="30" fill="#222">13 を 2 進表記すると 1101₂ = 8 + 4 + 1（下の桁から k = 0, 1, 2, 3）</text>
<text x="20" y="78" fill="#222">k</text>
<text x="20" y="118" fill="#222">bit</text>
<text x="20" y="168" fill="#222">3^(2^k)</text>
<text x="165" y="78" text-anchor="middle" fill="#222">0</text>
<text x="165" y="118" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="110" y="140" width="110" height="44" rx="6" fill="#dbe8fb" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="165" y="168" text-anchor="middle" fill="#222">3¹ = 3</text>
<line x1="222" y1="152" x2="238" y2="152" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="230.0" y="134" text-anchor="middle" fill="#555" font-size="12">2 乗</text>
<line x1="165" y1="186" x2="165" y2="226" stroke="#1f4e9a" stroke-width="2" marker-end="url(#ar)"/>
<text x="295" y="78" text-anchor="middle" fill="#222">1</text>
<text x="295" y="118" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<rect x="240" y="140" width="110" height="44" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="295" y="168" text-anchor="middle" fill="#222">3² = 9</text>
<line x1="352" y1="152" x2="368" y2="152" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="360.0" y="134" text-anchor="middle" fill="#555" font-size="12">2 乗</text>
<text x="295" y="206" text-anchor="middle" fill="#888" font-size="13">掛けない</text>
<text x="425" y="78" text-anchor="middle" fill="#222">2</text>
<text x="425" y="118" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="370" y="140" width="110" height="44" rx="6" fill="#dbe8fb" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="425" y="168" text-anchor="middle" fill="#222">3⁴ = 81</text>
<line x1="482" y1="152" x2="498" y2="152" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="490.0" y="134" text-anchor="middle" fill="#555" font-size="12">2 乗</text>
<line x1="425" y1="186" x2="425" y2="226" stroke="#1f4e9a" stroke-width="2" marker-end="url(#ar)"/>
<text x="555" y="78" text-anchor="middle" fill="#222">3</text>
<text x="555" y="118" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="500" y="140" width="110" height="44" rx="6" fill="#dbe8fb" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="555" y="168" text-anchor="middle" fill="#222">3⁸ = 6561</text>
<line x1="555" y1="186" x2="555" y2="226" stroke="#1f4e9a" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="252" fill="#222">bit が 1 の項（実線の枠）だけを掛ける：3 × 81 × 6561 = 3^(1+4+8) = 3^13 = 1594323</text>
<text x="20" y="280" fill="#555" font-size="13">2 乗は 3 回、答えへの掛け算は 3 回。1 回ずつ掛けると 12 回かかる</text>
</svg>