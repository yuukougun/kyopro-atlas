<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" width="400" height="310" font-family="sans-serif" font-size="13">
  <rect x="0" y="0" width="400" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="10" y="24" font-size="14" fill="#111111">N = 5 の位置ごとの確率（K 回の操作の後）</text>
  <rect x="8" y="40" width="64" height="56" fill="#dbe9ff" stroke="#1f4e9a" stroke-width="2.5"/>
  <text x="40" y="62" text-anchor="middle" fill="#111111">位置 1</text>
  <text x="40" y="84" text-anchor="middle" fill="#111111">p</text>
  <g stroke="#666666" stroke-width="1.5" stroke-dasharray="5 3" fill="#f2f2f2">
    <rect x="80" y="40" width="74" height="56"/>
    <rect x="158" y="40" width="74" height="56"/>
    <rect x="236" y="40" width="74" height="56"/>
    <rect x="314" y="40" width="74" height="56"/>
  </g>
  <g text-anchor="middle" fill="#111111">
    <text x="117" y="62">位置 2</text><text x="117" y="84" font-size="12">(1 − p)/4</text>
    <text x="195" y="62">位置 3</text><text x="195" y="84" font-size="12">(1 − p)/4</text>
    <text x="273" y="62">位置 4</text><text x="273" y="84" font-size="12">(1 − p)/4</text>
    <text x="351" y="62">位置 5</text><text x="351" y="84" font-size="12">(1 − p)/4</text>
  </g>
  <path d="M80,104 L80,112 L388,112 L388,104" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="234" y="132" text-anchor="middle" fill="#333333">初期状態（黒玉は位置 1）も操作も、</text>
  <text x="234" y="150" text-anchor="middle" fill="#333333">位置 2〜5 を入れ替えても変わらない</text>
  <text x="234" y="168" text-anchor="middle" fill="#333333">→ どれも同じ確率</text>
  <line x1="200" y1="176" x2="200" y2="200" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="10" y="216" width="104" height="58" fill="#dbe9ff" stroke="#1f4e9a" stroke-width="2.5"/>
  <text x="62" y="240" text-anchor="middle" fill="#111111">位置 1</text>
  <text x="62" y="262" text-anchor="middle" fill="#111111">確率 p</text>
  <rect x="270" y="216" width="122" height="58" fill="#f2f2f2" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="331" y="240" text-anchor="middle" fill="#111111">その他（まとめて）</text>
  <text x="331" y="262" text-anchor="middle" fill="#111111">確率 1 − p</text>
  <line x1="118" y1="232" x2="264" y2="232" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="192" y="224" text-anchor="middle" fill="#111111">2(N − 1) / N²</text>
  <line x1="264" y1="260" x2="118" y2="260" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="192" y="280" text-anchor="middle" fill="#111111">2 / N²</text>
  <text x="200" y="302" text-anchor="middle" font-size="12" fill="#555555">（下の矢印は、その他の各位置から位置 1 へ移る確率）</text>
</svg>
