<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="15" fill="#111111">N = 5 の位置ごとの確率（K 回の操作の後）</text>
  <!-- position 1 -->
  <rect x="40" y="45" width="90" height="60" fill="#dbe9ff" stroke="#1f4e9a" stroke-width="2.5"/>
  <text x="85" y="68" text-anchor="middle" fill="#111111">位置 1</text>
  <text x="85" y="92" text-anchor="middle" fill="#111111">p</text>
  <!-- positions 2..5 -->
  <g stroke="#666666" stroke-width="1.5" stroke-dasharray="5 3" fill="#f2f2f2">
    <rect x="160" y="45" width="100" height="60"/>
    <rect x="270" y="45" width="100" height="60"/>
    <rect x="380" y="45" width="100" height="60"/>
    <rect x="490" y="45" width="100" height="60"/>
  </g>
  <g text-anchor="middle" fill="#111111">
    <text x="210" y="68">位置 2</text><text x="210" y="92">(1 − p) / 4</text>
    <text x="320" y="68">位置 3</text><text x="320" y="92">(1 − p) / 4</text>
    <text x="430" y="68">位置 4</text><text x="430" y="92">(1 − p) / 4</text>
    <text x="540" y="68">位置 5</text><text x="540" y="92">(1 − p) / 4</text>
  </g>
  <path d="M160,115 L160,125 L590,125 L590,115" fill="none" stroke="#666666" stroke-width="1.5"/>
  <text x="375" y="145" text-anchor="middle" fill="#333333">位置 2〜5 を入れ替えても操作は変わらないので、どれも同じ確率</text>
  <line x1="320" y1="155" x2="320" y2="180" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- two states -->
  <rect x="90" y="195" width="150" height="60" fill="#dbe9ff" stroke="#1f4e9a" stroke-width="2.5"/>
  <text x="165" y="220" text-anchor="middle" fill="#111111">位置 1</text>
  <text x="165" y="243" text-anchor="middle" fill="#111111">確率 p</text>
  <rect x="400" y="195" width="170" height="60" fill="#f2f2f2" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="485" y="220" text-anchor="middle" fill="#111111">その他（まとめて）</text>
  <text x="485" y="243" text-anchor="middle" fill="#111111">確率 1 − p</text>
  <line x1="245" y1="210" x2="393" y2="210" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="320" y="202" text-anchor="middle" fill="#111111">2(N − 1) / N²</text>
  <line x1="393" y1="242" x2="245" y2="242" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="320" y="262" text-anchor="middle" fill="#111111">2 / N²</text>
  <text x="320" y="300" text-anchor="middle" fill="#333333">追う値は p の 1 つだけ：p ← p (1 − 2(N − 1)/N²) + (1 − p) · 2/N²</text>
</svg>
