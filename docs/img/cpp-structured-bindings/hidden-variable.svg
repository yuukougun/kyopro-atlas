<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>

  <!-- 上段：auto -->
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#111">auto [a, b] = p;（コピー）</text>
  <text x="20" y="52" fill="#333">p</text>
  <rect x="20" y="66" width="70" height="34" fill="#e8f0fe" stroke="#333"/>
  <rect x="90" y="66" width="70" height="34" fill="#e8f0fe" stroke="#333"/>
  <text x="55" y="88" text-anchor="middle" fill="#111">first 1</text>
  <text x="125" y="88" text-anchor="middle" fill="#111">second 2</text>

  <text x="280" y="52" fill="#333">見えない変数 e（p のコピー）</text>
  <rect x="280" y="66" width="70" height="34" fill="#fff4e0" stroke="#333" stroke-dasharray="5,3"/>
  <rect x="350" y="66" width="70" height="34" fill="#fff4e0" stroke="#333" stroke-dasharray="5,3"/>
  <text x="315" y="88" text-anchor="middle" fill="#111">first 1</text>
  <text x="385" y="88" text-anchor="middle" fill="#111">second 2</text>
  <line x1="162" y1="83" x2="276" y2="83" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text x="219" y="76" text-anchor="middle" fill="#333" font-size="12">値を写す</text>

  <text x="540" y="78" fill="#111" font-weight="bold">a</text>
  <text x="540" y="128" fill="#111" font-weight="bold">b</text>
  <path d="M534,74 L450,74 L450,60 L315,60 L315,64" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M534,124 L470,124 L400,104" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="440" y="148" fill="#333" font-size="12">a・b は e のメンバの名前。a = 100 でも p は変わらない</text>

  <line x1="20" y1="170" x2="620" y2="170" stroke="#999" stroke-width="1"/>

  <!-- 下段：auto& -->
  <text x="20" y="200" font-size="16" font-weight="bold" fill="#111">auto&amp; [a, b] = p;（参照）</text>
  <text x="20" y="222" fill="#333">p（見えない変数 e は p そのものを指す）</text>
  <rect x="20" y="238" width="70" height="34" fill="#e8f0fe" stroke="#333" stroke-width="2.5"/>
  <rect x="90" y="238" width="70" height="34" fill="#e8f0fe" stroke="#333" stroke-width="2.5"/>
  <text x="55" y="260" text-anchor="middle" fill="#111">first 1</text>
  <text x="125" y="260" text-anchor="middle" fill="#111">second 2</text>

  <text x="540" y="250" fill="#111" font-weight="bold">a</text>
  <text x="540" y="300" fill="#111" font-weight="bold">b</text>
  <path d="M534,246 L200,246 L200,230 L55,230 L55,235" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M534,296 L200,296 L130,276" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="220" y="320" fill="#333" font-size="12">a・b は p のメンバの名前。a = 100 で p.first が 100 になる</text>
</svg>
