<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="22" fill="#222">値 1, 3, 3, 6, 8 の count(x) ＝ x 以下の個数</text>
<text x="16" y="42" fill="#555" font-size="12">高さ K = 3 に初めて届く x が 3 番目（中央値）</text>
<line x1="50" y1="236" x2="370" y2="236" stroke="#333" stroke-width="1.5"/>
<line x1="50" y1="236" x2="50" y2="72" stroke="#333" stroke-width="1.5"/>
<text x="42" y="240" text-anchor="end" fill="#555" font-size="12">0</text>
<text x="42" y="210" text-anchor="end" fill="#555" font-size="12">1</text>
<text x="42" y="180" text-anchor="end" fill="#555" font-size="12">2</text>
<text x="42" y="150" text-anchor="end" fill="#555" font-size="12">3</text>
<text x="42" y="120" text-anchor="end" fill="#555" font-size="12">4</text>
<text x="42" y="90" text-anchor="end" fill="#555" font-size="12">5</text>
<text x="50" y="254" text-anchor="middle" fill="#222" font-size="12">0</text>
<text x="84" y="254" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="118" y="254" text-anchor="middle" fill="#222" font-size="12">2</text>
<text x="152" y="254" text-anchor="middle" fill="#222" font-size="12">3</text>
<text x="186" y="254" text-anchor="middle" fill="#222" font-size="12">4</text>
<text x="220" y="254" text-anchor="middle" fill="#222" font-size="12">5</text>
<text x="254" y="254" text-anchor="middle" fill="#222" font-size="12">6</text>
<text x="288" y="254" text-anchor="middle" fill="#222" font-size="12">7</text>
<text x="322" y="254" text-anchor="middle" fill="#222" font-size="12">8</text>
<text x="356" y="254" text-anchor="middle" fill="#222" font-size="12">9</text>
<text x="372" y="240" fill="#555" font-size="12">x</text>
<line x1="50" y1="146" x2="366" y2="146" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="366" y="140" text-anchor="end" fill="#c0392b" font-size="12">K = 3</text>
<line x1="50" y1="236" x2="84" y2="236" stroke="#aaaaaa" stroke-width="2.5"/>
<line x1="84" y1="206" x2="118" y2="206" stroke="#aaaaaa" stroke-width="2.5"/>
<line x1="118" y1="206" x2="152" y2="206" stroke="#aaaaaa" stroke-width="2.5"/>
<line x1="152" y1="146" x2="186" y2="146" stroke="#1f4e9c" stroke-width="2.5"/>
<line x1="186" y1="146" x2="220" y2="146" stroke="#1f4e9c" stroke-width="2.5"/>
<line x1="220" y1="146" x2="254" y2="146" stroke="#1f4e9c" stroke-width="2.5"/>
<line x1="254" y1="116" x2="288" y2="116" stroke="#1f4e9c" stroke-width="2.5"/>
<line x1="288" y1="116" x2="322" y2="116" stroke="#1f4e9c" stroke-width="2.5"/>
<line x1="322" y1="86" x2="356" y2="86" stroke="#1f4e9c" stroke-width="2.5"/>
<circle cx="50" cy="236" r="3" fill="#aaaaaa"/>
<circle cx="84" cy="206" r="3" fill="#aaaaaa"/>
<circle cx="118" cy="206" r="3" fill="#aaaaaa"/>
<circle cx="152" cy="146" r="3" fill="#1f4e9c"/>
<circle cx="186" cy="146" r="3" fill="#1f4e9c"/>
<circle cx="220" cy="146" r="3" fill="#1f4e9c"/>
<circle cx="254" cy="116" r="3" fill="#1f4e9c"/>
<circle cx="288" cy="116" r="3" fill="#1f4e9c"/>
<circle cx="322" cy="86" r="3" fill="#1f4e9c"/>
<circle cx="356" cy="86" r="3" fill="#1f4e9c"/>
<line x1="152" y1="154" x2="152" y2="232" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="152" y="274" text-anchor="middle" fill="#c0392b" font-size="12">答え 3</text>
<text x="160" y="180" fill="#555" font-size="11">x = 3 で 1 から 3 へ（同じ値が 2 個）</text>
<text x="16" y="292" fill="#555" font-size="12">灰色：count(x) &lt; 3（不可）　青：count(x) ≥ 3（可）</text>
</svg>
