<svg xmlns="http://www.w3.org/2000/svg" width="360" height="707" viewBox="0 0 360 707" font-family="sans-serif" font-size="15">
<g transform="translate(0 0)">
  <rect x="0" y="0" width="360" height="707" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <g transform="translate(-14,0)">
  <!-- 左：根 1 -->
  <text x="170" y="26" text-anchor="middle" font-weight="bold">根が 1 のとき</text>
  <rect x="38" y="108" width="140" height="132" rx="12" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
  <text x="40" y="258" fill="#2f5d9e">頂点 2 の部分木 {2, 4, 5}</text>
  <rect x="198" y="108" width="80" height="132" rx="12" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
  <text x="186" y="278" fill="#2f5d9e">頂点 3 の部分木 {3, 6}</text>
  <g stroke="#333333" stroke-width="2">
    <line x1="170" y1="60" x2="108" y2="135"/>
    <line x1="170" y1="60" x2="238" y2="135"/>
    <line x1="108" y1="135" x2="68" y2="210"/>
    <line x1="108" y1="135" x2="148" y2="210"/>
    <line x1="238" y1="135" x2="238" y2="210"/>
  </g>
  <g stroke="#333333" stroke-width="2" fill="#ffffff">
    <circle cx="170" cy="60" r="18" stroke-width="3"/>
    <circle cx="108" cy="135" r="18"/>
    <circle cx="238" cy="135" r="18"/>
    <circle cx="68" cy="210" r="18"/>
    <circle cx="148" cy="210" r="18"/>
    <circle cx="238" cy="210" r="18"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="170" y="60">1</text>
    <text x="108" y="135">2</text>
    <text x="238" y="135">3</text>
    <text x="68" y="210">4</text>
    <text x="148" y="210">5</text>
    <text x="238" y="210">6</text>
  </g>
  </g>
  <!-- 矢印 -->
  <line x1="180" y1="292" x2="180" y2="332" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="194" y="318">根を 2 へ</text>
  <g transform="translate(-375,336)">
  <!-- 右：根 2 -->
  <text x="510" y="26" text-anchor="middle" font-weight="bold">根が 2 のとき</text>
  <rect x="393" y="108" width="54" height="54" rx="10" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
  <rect x="463" y="108" width="54" height="54" rx="10" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
  <text x="455" y="182" text-anchor="middle" fill="#2f5d9e">部分木 {4}・{5}</text>
  <text x="455" y="200" text-anchor="middle" fill="#2f5d9e">（同じ）</text>
  <rect x="530" y="100" width="146" height="262" rx="12" fill="#fff4e0" stroke="#b5651d" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="553" y="182" width="74" height="132" rx="10" fill="#e8f0fb" stroke="#2f5d9e" stroke-width="2"/>
  <text x="604" y="340" text-anchor="middle" fill="#b5651d" font-weight="bold">親側 {1, 3, 6}</text>
  <text x="603" y="357" text-anchor="middle" fill="#b5651d">ここだけ新しく要る</text>
  <text x="631" y="250" fill="#2f5d9e" font-size="13">{3, 6}</text>
  <g stroke="#333333" stroke-width="2">
    <line x1="510" y1="60" x2="420" y2="135"/>
    <line x1="510" y1="60" x2="490" y2="135"/>
    <line x1="510" y1="60" x2="590" y2="135"/>
    <line x1="590" y1="135" x2="590" y2="210"/>
    <line x1="590" y1="210" x2="590" y2="285"/>
  </g>
  <g stroke="#333333" stroke-width="2" fill="#ffffff">
    <circle cx="510" cy="60" r="18" stroke-width="3"/>
    <circle cx="420" cy="135" r="18"/>
    <circle cx="490" cy="135" r="18"/>
    <circle cx="590" cy="135" r="18"/>
    <circle cx="590" cy="210" r="18"/>
    <circle cx="590" cy="285" r="18"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="510" y="60">2</text>
    <text x="420" y="135">4</text>
    <text x="490" y="135">5</text>
    <text x="590" y="135">1</text>
    <text x="590" y="210">3</text>
    <text x="590" y="285">6</text>
  </g>
  </g>
</g>
