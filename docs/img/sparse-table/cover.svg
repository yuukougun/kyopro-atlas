<text x="400.0" y="191" text-anchor="middle" fill="#a33b00" font-size="15" font-weight="bold">[3, 7)：st[2][3] = 4</text>
<text x="348" y="236" text-anchor="middle" fill="#7a5200" font-size="14">重なり [3, 5)（min なら 2 回数えても同じ）</text>
<text x="20" y="272" text-anchor="start" fill="#222" font-weight="bold">答え = min(st[2][1], st[2][3]) = min(3, 4) = 3</text>
<text x="20" y="312" text-anchor="start" fill="#222">表 st[k][i]：区間 [i, i + 2^k) の最小値</text>
<text x="20" y="334" text-anchor="start" fill="#555" font-size="15">st[k][i] = min(st[k−1][i], st[k−1][i + 2^(k−1)])</text>
