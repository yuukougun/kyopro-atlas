<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222">説明用に a→1・b→2・c→3、B = 10、mod なしで計算する（ハッシュが 10 進数の数字の並びになる）</text>
<text x="20" y="72" fill="#222">i</text><text x="20" y="102" fill="#222">S[i]</text>
<text x="190.0" y="72" text-anchor="middle" fill="#555" font-size="12">0</text>
<rect x="150" y="80" width="80" height="32" fill="#eeeeee" stroke="#888" stroke-width="1.5"/>
<text x="190.0" y="101" text-anchor="middle" fill="#222">a（1）</text>
<text x="270.0" y="72" text-anchor="middle" fill="#555" font-size="12">1</text>
<rect x="230" y="80" width="80" height="32" fill="#eeeeee" stroke="#888" stroke-width="1.5"/>
<text x="270.0" y="101" text-anchor="middle" fill="#222">b（2）</text>
<text x="350.0" y="72" text-anchor="middle" fill="#555" font-size="12">2</text>
<rect x="310" y="80" width="80" height="32" fill="#ffe2b8" stroke="#b35c00" stroke-width="1.5"/>
<text x="350.0" y="101" text-anchor="middle" fill="#222">c（3）</text>
<text x="430.0" y="72" text-anchor="middle" fill="#555" font-size="12">3</text>
<rect x="390" y="80" width="80" height="32" fill="#ffe2b8" stroke="#b35c00" stroke-width="1.5"/>
<text x="430.0" y="101" text-anchor="middle" fill="#222">a（1）</text>
<text x="510.0" y="72" text-anchor="middle" fill="#555" font-size="12">4</text>
<rect x="470" y="80" width="80" height="32" fill="#ffe2b8" stroke="#b35c00" stroke-width="1.5"/>
<text x="510.0" y="101" text-anchor="middle" fill="#222">b（2）</text>
<text x="310" y="132" fill="#b35c00" font-size="12">S[2, 5) = "cab"（取り出したい部分）</text>
<text x="20" y="182" fill="#222">h[i]</text>
<text x="150.0" y="158" text-anchor="middle" fill="#555" font-size="12">0</text>
<rect x="116.0" y="164" width="68" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1"/>
<text x="150.0" y="183" text-anchor="middle" fill="#222">0</text>
<text x="230.0" y="158" text-anchor="middle" fill="#555" font-size="12">1</text>
<rect x="196.0" y="164" width="68" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1"/>
<text x="230.0" y="183" text-anchor="middle" fill="#222">1</text>
<text x="310.0" y="158" text-anchor="middle" fill="#555" font-size="12">2</text>
<rect x="276.0" y="164" width="68" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="310.0" y="183" text-anchor="middle" fill="#222">12</text>
<text x="390.0" y="158" text-anchor="middle" fill="#555" font-size="12">3</text>
<rect x="356.0" y="164" width="68" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1"/>
<text x="390.0" y="183" text-anchor="middle" fill="#222">123</text>
<text x="470.0" y="158" text-anchor="middle" fill="#555" font-size="12">4</text>
<rect x="436.0" y="164" width="68" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1"/>
<text x="470.0" y="183" text-anchor="middle" fill="#222">1231</text>
<text x="550.0" y="158" text-anchor="middle" fill="#555" font-size="12">5</text>
<rect x="516.0" y="164" width="68" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="550.0" y="183" text-anchor="middle" fill="#222">12312</text>
<text x="20" y="226" fill="#222">h[5] − h[2]·B^(5−2) = 12312 − 12 × 1000 = 312 ＝ "cab" のハッシュ</text>
</svg>
