<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 406 282" width="406" height="282" font-family="sans-serif" font-size="14">
<rect width="406" height="282" fill="#ffffff"/>
<text x="8" y="22" fill="#222">説明用に a→1・b→2・c→3、B = 10、</text>
<text x="8" y="40" fill="#222">mod なしで計算する</text>
<text x="8" y="58" fill="#222">（ハッシュが 10 進数の数字の並びになる）</text>
<text x="8" y="92" fill="#222">i</text><text x="8" y="121" fill="#222">S[i]</text>
<text x="98" y="92" text-anchor="middle" fill="#555" font-size="13">0</text>
<rect x="70" y="100" width="56" height="32" fill="#eeeeee" stroke="#888" stroke-width="1.5"/>
<text x="98" y="121" text-anchor="middle" fill="#222">a（1）</text>
<text x="154" y="92" text-anchor="middle" fill="#555" font-size="13">1</text>
<rect x="126" y="100" width="56" height="32" fill="#eeeeee" stroke="#888" stroke-width="1.5"/>
<text x="154" y="121" text-anchor="middle" fill="#222">b（2）</text>
<text x="210" y="92" text-anchor="middle" fill="#555" font-size="13">2</text>
<rect x="182" y="100" width="56" height="32" fill="#ffe2b8" stroke="#b35c00" stroke-width="1.5"/>
<text x="210" y="121" text-anchor="middle" fill="#222">c（3）</text>
<text x="266" y="92" text-anchor="middle" fill="#555" font-size="13">3</text>
<rect x="238" y="100" width="56" height="32" fill="#ffe2b8" stroke="#b35c00" stroke-width="1.5"/>
<text x="266" y="121" text-anchor="middle" fill="#222">a（1）</text>
<text x="322" y="92" text-anchor="middle" fill="#555" font-size="13">4</text>
<rect x="294" y="100" width="56" height="32" fill="#ffe2b8" stroke="#b35c00" stroke-width="1.5"/>
<text x="322" y="121" text-anchor="middle" fill="#222">b（2）</text>
<text x="182" y="152" fill="#b35c00" font-size="13">S[2, 5) = "cab"（取り出したい部分）</text>
<text x="8" y="203" fill="#222">h[i]</text>
<text x="70" y="178" text-anchor="middle" fill="#555" font-size="13">0</text>
<rect x="45" y="184" width="50" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1"/>
<text x="70" y="203" text-anchor="middle" fill="#222">0</text>
<text x="126" y="178" text-anchor="middle" fill="#555" font-size="13">1</text>
<rect x="101" y="184" width="50" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1"/>
<text x="126" y="203" text-anchor="middle" fill="#222">1</text>
<text x="182" y="178" text-anchor="middle" fill="#555" font-size="13">2</text>
<rect x="157" y="184" width="50" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="182" y="203" text-anchor="middle" fill="#222">12</text>
<text x="238" y="178" text-anchor="middle" fill="#555" font-size="13">3</text>
<rect x="213" y="184" width="50" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1"/>
<text x="238" y="203" text-anchor="middle" fill="#222">123</text>
<text x="294" y="178" text-anchor="middle" fill="#555" font-size="13">4</text>
<rect x="269" y="184" width="50" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1"/>
<text x="294" y="203" text-anchor="middle" fill="#222">1231</text>
<text x="350" y="178" text-anchor="middle" fill="#555" font-size="13">5</text>
<rect x="325" y="184" width="50" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="350" y="203" text-anchor="middle" fill="#222">12312</text>
<text x="8" y="244" fill="#222">h[5] − h[2]·B^(5−2) = 12312 − 12 × 1000</text>
<text x="8" y="266" fill="#222">= 312 ＝ "cab" のハッシュ</text>
</svg>
