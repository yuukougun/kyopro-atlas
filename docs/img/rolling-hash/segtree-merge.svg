<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222">説明用に a→1・b→2・c→3、B = 10、mod なし。節点には（ハッシュ, B^長さ）を書く</text>
<rect x="230" y="60" width="260" height="56" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="360.0" y="82" text-anchor="middle" fill="#222">"abcab"</text>
<text x="360.0" y="104" text-anchor="middle" fill="#222" font-size="13">(12312, 100000)</text>
<rect x="60" y="190" width="220" height="56" rx="6" fill="#eeeeee" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="170.0" y="212" text-anchor="middle" fill="#222">左："ab"</text>
<text x="170.0" y="234" text-anchor="middle" fill="#222" font-size="13">(12, 100)</text>
<rect x="440" y="190" width="220" height="56" rx="6" fill="#ffe2b8" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="550.0" y="212" text-anchor="middle" fill="#222">右："cab"</text>
<text x="550.0" y="234" text-anchor="middle" fill="#222" font-size="13">(312, 1000)</text>
<line x1="170" y1="190" x2="300" y2="116" stroke="#555" stroke-width="1.5"/>
<line x1="550" y1="190" x2="420" y2="116" stroke="#555" stroke-width="1.5"/>
<text x="360" y="150" text-anchor="middle" fill="#222" font-size="13">ハッシュ：12 × 1000 + 312 = 12312</text>
<text x="360" y="170" text-anchor="middle" fill="#222" font-size="13">B^長さ：100 × 1000 = 100000</text>
</svg>
