<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 352" width="380" height="352" font-family="sans-serif" font-size="15">
<rect width="380" height="352" fill="#ffffff"/>
<text x="8" y="22" fill="#222">説明用に a→1・b→2・c→3、B = 10、mod なし。</text>
<text x="8" y="42" fill="#222">節点には（ハッシュ, B^長さ）を書く</text>
<line x1="90" y1="214" x2="160" y2="132" stroke="#555" stroke-width="1.5"/>
<line x1="290" y1="214" x2="220" y2="132" stroke="#555" stroke-width="1.5"/>
<rect x="100" y="76" width="180" height="56" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="190" y="98" text-anchor="middle" fill="#222">"abcab"</text>
<text x="190" y="121" text-anchor="middle" fill="#222">(12312, 100000)</text>
<rect x="10" y="214" width="160" height="56" rx="6" fill="#eeeeee" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="90" y="236" text-anchor="middle" fill="#222">左："ab"</text>
<text x="90" y="259" text-anchor="middle" fill="#222">(12, 100)</text>
<rect x="210" y="214" width="160" height="56" rx="6" fill="#ffe2b8" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="290" y="236" text-anchor="middle" fill="#222">右："cab"</text>
<text x="290" y="259" text-anchor="middle" fill="#222">(312, 1000)</text>
<text x="8" y="310" fill="#222">ハッシュ：12 × 1000 + 312 = 12312</text>
<text x="8" y="334" fill="#222">B^長さ：100 × 1000 = 100000</text>
</svg>
