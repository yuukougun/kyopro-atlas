<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<circle cx="57.5" cy="85" r="40" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<circle cx="142.5" cy="85" r="25" fill="none" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="57.5" cy="85" r="2.5" fill="#1f4e9a"/>
<circle cx="142.5" cy="85" r="2.5" fill="#b03a2e"/>
<line x1="57.5" y1="85" x2="142.5" y2="85" stroke="#222" stroke-width="1"/>
<text x="100" y="160" text-anchor="middle" fill="#222" font-weight="bold">離れる（共有点 0）</text>
<text x="100" y="182" text-anchor="middle" fill="#222">d &gt; r1 + r2</text>
<circle cx="267.5" cy="85" r="40" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<circle cx="332.5" cy="85" r="25" fill="none" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="267.5" cy="85" r="2.5" fill="#1f4e9a"/>
<circle cx="332.5" cy="85" r="2.5" fill="#b03a2e"/>
<line x1="267.5" y1="85" x2="332.5" y2="85" stroke="#222" stroke-width="1"/>
<circle cx="307.5" cy="85.0" r="4.5" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="300" y="160" text-anchor="middle" fill="#222" font-weight="bold">外接（共有点 1）</text>
<text x="300" y="182" text-anchor="middle" fill="#222">d = r1 + r2</text>
<circle cx="79.0" cy="285" r="40" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<circle cx="121.0" cy="285" r="25" fill="none" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="79.0" cy="285" r="2.5" fill="#1f4e9a"/>
<circle cx="121.0" cy="285" r="2.5" fill="#b03a2e"/>
<line x1="79.0" y1="285" x2="121.0" y2="285" stroke="#222" stroke-width="1"/>
<circle cx="111.6" cy="261.8" r="4.5" fill="#ffffff" stroke="#222" stroke-width="2"/>
<circle cx="111.6" cy="308.2" r="4.5" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="100" y="360" text-anchor="middle" fill="#222" font-weight="bold">交わる（共有点 2）</text>
<text x="100" y="382" text-anchor="middle" fill="#222">|r1 − r2| &lt; d &lt; r1 + r2</text>
<circle cx="290.0" cy="285" r="45" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<circle cx="310.0" cy="285" r="25" fill="none" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="290.0" cy="285" r="2.5" fill="#1f4e9a"/>
<circle cx="310.0" cy="285" r="2.5" fill="#b03a2e"/>
<line x1="290.0" y1="285" x2="310.0" y2="285" stroke="#222" stroke-width="1"/>
<circle cx="335.0" cy="285.0" r="4.5" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="300" y="360" text-anchor="middle" fill="#222" font-weight="bold">内接（共有点 1）</text>
<text x="300" y="382" text-anchor="middle" fill="#222">d = |r1 − r2|</text>
<circle cx="95.0" cy="485" r="45" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<circle cx="105.0" cy="485" r="18" fill="none" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="95.0" cy="485" r="2.5" fill="#1f4e9a"/>
<circle cx="105.0" cy="485" r="2.5" fill="#b03a2e"/>
<line x1="95.0" y1="485" x2="105.0" y2="485" stroke="#222" stroke-width="1"/>
<text x="100" y="560" text-anchor="middle" fill="#222" font-weight="bold">内包（共有点 0）</text>
<text x="100" y="582" text-anchor="middle" fill="#222">d &lt; |r1 − r2|</text>
<text x="300" y="430" text-anchor="middle" fill="#222" font-weight="bold">d の値で並べると</text>
<line x1="215" y1="485" x2="390" y2="485" stroke="#222" stroke-width="1.5"/>
<line x1="270" y1="460" x2="335" y2="460" stroke="#222" stroke-width="6"/>
<text x="302.5" y="450" text-anchor="middle" fill="#222" font-size="12">共有点あり</text>
<line x1="215" y1="479" x2="215" y2="491" stroke="#222" stroke-width="1.5"/>
<text x="215" y="509" text-anchor="middle" fill="#222" font-size="12">0</text>
<line x1="270" y1="479" x2="270" y2="491" stroke="#222" stroke-width="1.5"/>
<text x="270" y="509" text-anchor="middle" fill="#222" font-size="12">|r1 − r2|</text>
<line x1="335" y1="479" x2="335" y2="491" stroke="#222" stroke-width="1.5"/>
<text x="335" y="509" text-anchor="middle" fill="#222" font-size="12">r1 + r2</text>
<text x="242.5" y="535" text-anchor="middle" fill="#222" font-size="12">内包</text>
<text x="302.5" y="535" text-anchor="middle" fill="#222" font-size="12">交わる</text>
<text x="362.5" y="535" text-anchor="middle" fill="#222" font-size="12">離れる</text>
<text x="300" y="582" text-anchor="middle" fill="#222" font-size="12">端点がちょうど内接・外接</text>
<text x="200" y="608" text-anchor="middle" fill="#222" font-size="13">実線：円 1（半径 r1）　破線：円 2（半径 r2）</text>
<text x="200" y="628" text-anchor="middle" fill="#222" font-size="13">白丸：共有点　d：中心間の距離</text>
</svg>
