<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="20" y1="30" x2="56" y2="30" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="64" y="35" fill="#222" font-size="13">最適な手（手番の人が選ぶ）</text>
<line x1="20" y1="54" x2="56" y2="54" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="64" y="59" fill="#222" font-size="13">最適でない手</text>
<text x="20" y="83" fill="#222" font-size="13">辺：取った数：g(m) − f(s')</text>
<rect x="305.0" y="18" width="150" height="44" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="380" y="37" text-anchor="middle" fill="#222">[3, 9, 1, 2] 先手の番</text>
<text x="380" y="55" text-anchor="middle" fill="#222" font-size="13">f = 7</text>
<rect x="115.0" y="138" width="150" height="44" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
<text x="190" y="157" text-anchor="middle" fill="#222">[9, 1, 2] 後手の番</text>
<text x="190" y="175" text-anchor="middle" fill="#222" font-size="13">f = 8</text>
<rect x="495.0" y="138" width="150" height="44" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="570" y="157" text-anchor="middle" fill="#222">[3, 9, 1] 後手の番</text>
<text x="570" y="175" text-anchor="middle" fill="#222" font-size="13">f = −5</text>
<rect x="20.0" y="258" width="150" height="44" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="95" y="277" text-anchor="middle" fill="#222">[1, 2] 先手の番</text>
<text x="95" y="295" text-anchor="middle" fill="#222" font-size="13">f = 1</text>
<rect x="210.0" y="258" width="150" height="44" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
<text x="285" y="277" text-anchor="middle" fill="#222">[9, 1] 先手の番</text>
<text x="285" y="295" text-anchor="middle" fill="#222" font-size="13">f = 8</text>
<rect x="400.0" y="258" width="150" height="44" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="475" y="277" text-anchor="middle" fill="#222">[9, 1] 先手の番</text>
<text x="475" y="295" text-anchor="middle" fill="#222" font-size="13">f = 8</text>
<rect x="590.0" y="258" width="150" height="44" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="665" y="277" text-anchor="middle" fill="#222">[3, 9] 先手の番</text>
<text x="665" y="295" text-anchor="middle" fill="#222" font-size="13">f = 6</text>
<line x1="380" y1="62" x2="190" y2="138" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="269.0" y="104.0" text-anchor="end" fill="#222" font-size="13">3：3 − 8 = −5</text>
<line x1="380" y1="62" x2="570" y2="138" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="491.0" y="104.0" text-anchor="start" fill="#222" font-size="13">2：2 − (−5) = 7</text>
<line x1="190" y1="182" x2="95" y2="258" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="126.5" y="224.0" text-anchor="end" fill="#222" font-size="13">9：9 − 1 = 8</text>
<line x1="190" y1="182" x2="285" y2="258" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="253.5" y="224.0" text-anchor="start" fill="#222" font-size="13">2：2 − 8 = −6</text>
<line x1="570" y1="182" x2="475" y2="258" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="506.5" y="224.0" text-anchor="end" fill="#222" font-size="13">3：3 − 8 = −5</text>
<line x1="570" y1="182" x2="665" y2="258" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="633.5" y="224.0" text-anchor="start" fill="#222" font-size="13">1：1 − 6 = −5</text>
</svg>
