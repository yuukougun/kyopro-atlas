<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="30" fill="#222" font-size="15">次数列 d = (1, 3, 1, 2, 1, 4, 1, 1) から作る</text>
<text x="20" y="54" fill="#222" font-size="15">次数 2 以上の 2・4・6 を背骨のパスにする</text>
<line x1="110" y1="150" x2="290" y2="150" stroke="#1f4e9a" stroke-width="4"/>
<line x1="290" y1="150" x2="470" y2="150" stroke="#1f4e9a" stroke-width="4"/>
<line x1="110" y1="150" x2="60" y2="270" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="110" y1="150" x2="160" y2="270" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="470" y1="150" x2="400" y2="270" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="470" y1="150" x2="470" y2="270" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="470" y1="150" x2="540" y2="270" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="110" cy="150" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/><text x="110" y="155" text-anchor="middle" fill="#222" font-size="15">2</text>
<circle cx="290" cy="150" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/><text x="290" y="155" text-anchor="middle" fill="#222" font-size="15">4</text>
<circle cx="470" cy="150" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/><text x="470" y="155" text-anchor="middle" fill="#222" font-size="15">6</text>
<circle cx="60" cy="270" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="60" y="275" text-anchor="middle" fill="#222" font-size="15">1</text>
<circle cx="160" cy="270" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="160" y="275" text-anchor="middle" fill="#222" font-size="15">3</text>
<circle cx="400" cy="270" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="400" y="275" text-anchor="middle" fill="#222" font-size="15">5</text>
<circle cx="470" cy="270" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="470" y="275" text-anchor="middle" fill="#222" font-size="15">7</text>
<circle cx="540" cy="270" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="540" y="275" text-anchor="middle" fill="#222" font-size="15">8</text>
<text x="110" y="118" text-anchor="middle" fill="#1f4e9a" font-size="13">d = 3：パスで 1、葉 2</text>
<text x="290" y="118" text-anchor="middle" fill="#1f4e9a" font-size="13">d = 2：パスで 2、葉 0</text>
<text x="470" y="118" text-anchor="middle" fill="#1f4e9a" font-size="13">d = 4：パスで 1、葉 3</text>
<line x1="40" y1="322" x2="80" y2="322" stroke="#1f4e9a" stroke-width="4"/>
<text x="88" y="327" fill="#222" font-size="13">背骨のパス</text>
<line x1="190" y1="322" x2="230" y2="322" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<text x="238" y="327" fill="#222" font-size="13">葉を付ける辺</text>
<text x="40" y="365" fill="#222" font-size="13">要る葉 2 + 0 + 3 ＝ 5 ＝ 次数 1 の頂点の数</text>
</svg>
