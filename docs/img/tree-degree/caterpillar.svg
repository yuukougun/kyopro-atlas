<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 410" width="410" height="410" font-family="sans-serif" font-size="15">
<rect width="410" height="410" fill="#ffffff"/>
<text x="10" y="26" fill="#222">次数列 d = (1, 3, 1, 2, 1, 4, 1, 1) から作る</text>
<text x="10" y="48" fill="#222">次数 2 以上の 2・4・6 を背骨のパスにする</text>
<line x1="70" y1="170" x2="200" y2="170" stroke="#1f4e9a" stroke-width="4"/><line x1="200" y1="170" x2="330" y2="170" stroke="#1f4e9a" stroke-width="4"/>
<line x1="70" y1="170" x2="30" y2="290" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="70" y1="170" x2="110" y2="290" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="330" y1="170" x2="280" y2="290" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="330" y1="170" x2="330" y2="290" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="330" y1="170" x2="380" y2="290" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="70" cy="170" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/><text x="70" y="175" text-anchor="middle" fill="#222">2</text>
<circle cx="200" cy="170" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/><text x="200" y="175" text-anchor="middle" fill="#222">4</text>
<circle cx="330" cy="170" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/><text x="330" y="175" text-anchor="middle" fill="#222">6</text>
<circle cx="30" cy="290" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="30" y="295" text-anchor="middle" fill="#222">1</text>
<circle cx="110" cy="290" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="110" y="295" text-anchor="middle" fill="#222">3</text>
<circle cx="280" cy="290" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="280" y="295" text-anchor="middle" fill="#222">5</text>
<circle cx="330" cy="290" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="330" y="295" text-anchor="middle" fill="#222">7</text>
<circle cx="380" cy="290" r="18" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/><text x="380" y="295" text-anchor="middle" fill="#222">8</text>
<text x="70" y="122" text-anchor="middle" fill="#1f4e9a" font-size="14">d = 3</text><text x="70" y="141" text-anchor="middle" fill="#1f4e9a" font-size="14">パスで 1、葉 2</text>
<text x="200" y="122" text-anchor="middle" fill="#1f4e9a" font-size="14">d = 2</text><text x="200" y="141" text-anchor="middle" fill="#1f4e9a" font-size="14">パスで 2、葉 0</text>
<text x="330" y="122" text-anchor="middle" fill="#1f4e9a" font-size="14">d = 4</text><text x="330" y="141" text-anchor="middle" fill="#1f4e9a" font-size="14">パスで 1、葉 3</text>
<line x1="20" y1="340" x2="60" y2="340" stroke="#1f4e9a" stroke-width="4"/><text x="68" y="345" fill="#222" font-size="14">背骨のパス</text>
<line x1="190" y1="340" x2="230" y2="340" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><text x="238" y="345" fill="#222" font-size="14">葉を付ける辺</text>
<text x="20" y="384" fill="#222" font-size="14">要る葉 2 + 0 + 3 ＝ 5 ＝ 次数 1 の頂点の数</text>
</svg>
