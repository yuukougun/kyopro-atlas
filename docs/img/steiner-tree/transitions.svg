<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" font-family="sans-serif" font-size="13">
  <rect width="400" height="250" fill="#ffffff"/>
  <!-- 左：v の次数が 2 以上なら 2 つに分ける -->
  <text x="100" y="22" text-anchor="middle" fill="#333" font-weight="bold">次数 2 以上：分けて合わせる</text>
  <ellipse cx="55" cy="150" rx="40" ry="52" fill="#e3eefb" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <ellipse cx="145" cy="150" rx="40" ry="52" fill="#fbe7e3" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 3"/>
  <g stroke="#333" stroke-width="2">
    <line x1="100" y1="70" x2="60" y2="130"/>
    <line x1="60" y1="130" x2="40" y2="180"/>
    <line x1="60" y1="130" x2="80" y2="180"/>
    <line x1="100" y1="70" x2="140" y2="130"/>
    <line x1="140" y1="130" x2="140" y2="180"/>
  </g>
  <circle cx="100" cy="70" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="100" y="75" text-anchor="middle" fill="#333" font-weight="bold">v</text>
  <g fill="#fde9c8" stroke="#333" stroke-width="1.5">
    <rect x="32" y="172" width="16" height="16"/><rect x="72" y="172" width="16" height="16"/>
    <rect x="132" y="172" width="16" height="16"/>
  </g>
  <text x="100" y="47" text-anchor="middle" fill="#333" font-size="11">v は両方の木に入る</text>
  <g fill="#333" font-size="11"><circle cx="60" cy="130" r="5"/><circle cx="140" cy="130" r="5"/></g>
  <text x="55" y="222" text-anchor="middle" fill="#1f5fa8">T 側</text>
  <text x="145" y="222" text-anchor="middle" fill="#c0392b">S∖T 側</text>
  <text x="100" y="242" text-anchor="middle" fill="#333">dp[T][v] + dp[S∖T][v]</text>
  <!-- 区切り -->
  <line x1="200" y1="35" x2="200" y2="235" stroke="#bbb" stroke-width="1"/>
  <!-- 右：v の次数が 1 なら辺を 1 本たどる -->
  <text x="300" y="22" text-anchor="middle" fill="#333" font-weight="bold">次数 1：辺を 1 本たどる</text>
  <ellipse cx="300" cy="160" rx="62" ry="48" fill="#e3eefb" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <g stroke="#333" stroke-width="2">
    <line x1="300" y1="70" x2="300" y2="130"/>
    <line x1="300" y1="130" x2="270" y2="180"/>
    <line x1="300" y1="130" x2="330" y2="180"/>
  </g>
  <text x="308" y="105" fill="#333">w</text>
  <circle cx="300" cy="70" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="300" y="75" text-anchor="middle" fill="#333" font-weight="bold">v</text>
  <circle cx="300" cy="130" r="11" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="300" y="135" text-anchor="middle" fill="#333" font-weight="bold">u</text>
  <g fill="#fde9c8" stroke="#333" stroke-width="1.5">
    <rect x="262" y="172" width="16" height="16"/><rect x="322" y="172" width="16" height="16"/>
  </g>
  <text x="300" y="222" text-anchor="middle" fill="#1f5fa8">S と u をつなぐ木</text>
  <text x="300" y="242" text-anchor="middle" fill="#333">dp[S][u] + w</text>
</svg>
