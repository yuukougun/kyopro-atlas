<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222">各頂点の (a からの距離, b からの距離) と、どちらに近いか</text>
<line x1="310" y1="50" x2="310" y2="66" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="310" y1="90" x2="310" y2="340" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="318" y="62" fill="#555" font-size="12">パスの中点</text>
<line x1="70" y1="110" x2="190" y2="110" stroke="#1f4e9a" stroke-width="5"/>
<line x1="190" y1="110" x2="310" y2="110" stroke="#1f4e9a" stroke-width="5"/>
<line x1="310" y1="110" x2="430" y2="110" stroke="#1f4e9a" stroke-width="5"/>
<line x1="430" y1="110" x2="550" y2="110" stroke="#1f4e9a" stroke-width="5"/>
<line x1="190" y1="110" x2="190" y2="210" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="190" y1="210" x2="190" y2="300" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="310" y1="110" x2="310" y2="210" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="430" y1="110" x2="430" y2="210" stroke="#1f4e9a" stroke-width="2.5"/>
<circle cx="70" cy="110" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="70" y="115" text-anchor="middle" fill="#1f4e9a" font-weight="bold">0</text>
<text x="70" y="82" text-anchor="middle" fill="#222" font-size="13">(0, 4)</text>
<circle cx="190" cy="110" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="190" y="115" text-anchor="middle" fill="#1f4e9a" font-weight="bold">1</text>
<text x="190" y="82" text-anchor="middle" fill="#222" font-size="13">(1, 3)</text>
<circle cx="310" cy="110" r="18" fill="#eeeeee" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="2 2"/>
<text x="310" y="115" text-anchor="middle" fill="#1f4e9a" font-weight="bold">2</text>
<text x="310" y="82" text-anchor="middle" fill="#222" font-size="13">(2, 2)</text>
<circle cx="430" cy="110" r="18" fill="#ffe0b8" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="430" y="115" text-anchor="middle" fill="#1f4e9a" font-weight="bold">3</text>
<text x="430" y="82" text-anchor="middle" fill="#222" font-size="13">(3, 1)</text>
<circle cx="550" cy="110" r="18" fill="#ffe0b8" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="550" y="115" text-anchor="middle" fill="#1f4e9a" font-weight="bold">4</text>
<text x="550" y="82" text-anchor="middle" fill="#222" font-size="13">(4, 0)</text>
<circle cx="190" cy="210" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="190" y="215" text-anchor="middle" fill="#1f4e9a" font-weight="bold">5</text>
<text x="216" y="215" fill="#222" font-size="13">(2, 4)</text>
<circle cx="190" cy="300" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="190" y="305" text-anchor="middle" fill="#1f4e9a" font-weight="bold">6</text>
<text x="216" y="305" fill="#222" font-size="13">(3, 5)</text>
<circle cx="310" cy="210" r="18" fill="#eeeeee" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="2 2"/>
<text x="310" y="215" text-anchor="middle" fill="#1f4e9a" font-weight="bold">7</text>
<text x="336" y="215" fill="#222" font-size="13">(3, 3)</text>
<circle cx="430" cy="210" r="18" fill="#ffe0b8" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="430" y="215" text-anchor="middle" fill="#1f4e9a" font-weight="bold">8</text>
<text x="456" y="215" fill="#222" font-size="13">(4, 2)</text>
<text x="70" y="148" text-anchor="middle" fill="#1f4e9a" font-weight="bold">a</text>
<text x="550" y="148" text-anchor="middle" fill="#b26b00" font-weight="bold">b</text>
<circle cx="40" cy="360" r="9" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="56" y="365" fill="#222" font-size="12">実線：a の方が近い（d_a &lt; d_b）</text>
<circle cx="270" cy="360" r="9" fill="#eeeeee" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="2 2"/>
<text x="286" y="365" fill="#222" font-size="12">細かい点線：等しい</text>
<circle cx="420" cy="360" r="9" fill="#ffe0b8" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="436" y="365" fill="#222" font-size="12">点線：b の方が近い</text>
<text x="20" y="390" fill="#555" font-size="12">太い線：パス a–b。頂点 5・6 は 1 に、7 は 2 に、8 は 3 に付いている</text>
</svg>
