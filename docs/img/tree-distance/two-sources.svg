<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 480" width="410" height="480" font-family="sans-serif" font-size="16">
<rect width="410" height="480" fill="#ffffff"/>
<text x="12" y="24" fill="#222" font-size="15">各頂点の (a からの距離, b からの距離) と、</text>
<text x="12" y="44" fill="#222" font-size="15">どちらに近いか</text>
<text x="213" y="72" fill="#555" font-size="14">パスの中点</text>
<line x1="205" y1="62" x2="205" y2="78" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="205" y1="106" x2="205" y2="340" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="35" y1="128" x2="120" y2="128" stroke="#1f4e9a" stroke-width="5"/>
<line x1="120" y1="128" x2="205" y2="128" stroke="#1f4e9a" stroke-width="5"/>
<line x1="205" y1="128" x2="290" y2="128" stroke="#1f4e9a" stroke-width="5"/>
<line x1="290" y1="128" x2="375" y2="128" stroke="#1f4e9a" stroke-width="5"/>
<line x1="120" y1="128" x2="120" y2="228" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="120" y1="228" x2="120" y2="318" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="205" y1="128" x2="205" y2="228" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="290" y1="128" x2="290" y2="228" stroke="#1f4e9a" stroke-width="2.5"/>
<circle cx="35" cy="128" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="35" y="134" text-anchor="middle" fill="#1f4e9a" font-weight="bold">0</text>
<text x="35" y="100" text-anchor="middle" fill="#222" font-size="14">(0, 4)</text>
<circle cx="120" cy="128" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="120" y="134" text-anchor="middle" fill="#1f4e9a" font-weight="bold">1</text>
<text x="120" y="100" text-anchor="middle" fill="#222" font-size="14">(1, 3)</text>
<circle cx="205" cy="128" r="18" fill="#eeeeee" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="2 2"/>
<text x="205" y="134" text-anchor="middle" fill="#1f4e9a" font-weight="bold">2</text>
<text x="205" y="100" text-anchor="middle" fill="#222" font-size="14">(2, 2)</text>
<circle cx="290" cy="128" r="18" fill="#ffe0b8" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="290" y="134" text-anchor="middle" fill="#1f4e9a" font-weight="bold">3</text>
<text x="290" y="100" text-anchor="middle" fill="#222" font-size="14">(3, 1)</text>
<circle cx="375" cy="128" r="18" fill="#ffe0b8" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="375" y="134" text-anchor="middle" fill="#1f4e9a" font-weight="bold">4</text>
<text x="375" y="100" text-anchor="middle" fill="#222" font-size="14">(4, 0)</text>
<circle cx="120" cy="228" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="120" y="234" text-anchor="middle" fill="#1f4e9a" font-weight="bold">5</text>
<text x="144" y="233" fill="#222" font-size="14">(2, 4)</text>
<circle cx="120" cy="318" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="120" y="324" text-anchor="middle" fill="#1f4e9a" font-weight="bold">6</text>
<text x="144" y="323" fill="#222" font-size="14">(3, 5)</text>
<circle cx="205" cy="228" r="18" fill="#eeeeee" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="2 2"/>
<text x="205" y="234" text-anchor="middle" fill="#1f4e9a" font-weight="bold">7</text>
<text x="229" y="233" fill="#222" font-size="14">(3, 3)</text>
<circle cx="290" cy="228" r="18" fill="#ffe0b8" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="290" y="234" text-anchor="middle" fill="#1f4e9a" font-weight="bold">8</text>
<text x="314" y="233" fill="#222" font-size="14">(4, 2)</text>
<text x="35" y="166" text-anchor="middle" fill="#1f4e9a" font-weight="bold">a</text>
<text x="375" y="166" text-anchor="middle" fill="#b26b00" font-weight="bold">b</text>
<circle cx="24" cy="366" r="9" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="42" y="371" fill="#222" font-size="14">実線：a の方が近い（d_a &lt; d_b）</text>
<circle cx="24" cy="392" r="9" fill="#eeeeee" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="2 2"/>
<text x="42" y="397" fill="#222" font-size="14">細かい点線：等しい</text>
<circle cx="24" cy="418" r="9" fill="#ffe0b8" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="42" y="423" fill="#222" font-size="14">点線：b の方が近い</text>
<text x="12" y="452" fill="#555" font-size="14">太い線：パス a–b。頂点 5・6 は 1 に、7 は 2 に、</text>
<text x="12" y="472" fill="#555" font-size="14">8 は 3 に付いている</text>
</svg>
