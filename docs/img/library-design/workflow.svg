<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" width="400" height="386" font-family="sans-serif" font-size="12">
  <rect x="0" y="0" width="400" height="386" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- library -->
  <rect x="110" y="12" width="180" height="44" rx="6" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="200" y="31" text-anchor="middle" font-weight="bold">lib/fenwick_tree.hpp</text>
  <text x="200" y="47" text-anchor="middle">ライブラリの本体</text>
  <!-- arrows down -->
  <line x1="160" y1="56" x2="100" y2="96" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="200" y1="56" x2="200" y2="96" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="240" y1="56" x2="310" y2="96" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="162" y="70" width="76" height="14" fill="#ffffff"/>
  <text x="200" y="81" text-anchor="middle" font-size="11" fill="#555555">#include "..."</text>
  <!-- three users -->
  <rect x="8" y="98" width="122" height="58" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="69" y="118" text-anchor="middle" font-weight="bold">①手元のテスト</text>
  <text x="69" y="134" text-anchor="middle" font-size="11">境界の assert と</text>
  <text x="69" y="148" text-anchor="middle" font-size="11">愚直解との突き合わせ</text>
  <rect x="139" y="98" width="122" height="58" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="118" text-anchor="middle" font-weight="bold">②確認用の解答</text>
  <text x="200" y="134" text-anchor="middle" font-size="11">*.test.cpp に</text>
  <text x="200" y="148" text-anchor="middle" font-size="11">問題の URL を書く</text>
  <rect x="270" y="98" width="122" height="58" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="331" y="118" text-anchor="middle" font-weight="bold">③コンテストの</text>
  <text x="331" y="134" text-anchor="middle" font-weight="bold">解答 main.cpp</text>
  <text x="331" y="148" text-anchor="middle" font-size="11">ふだんの提出</text>
  <!-- next row -->
  <line x1="69" y1="156" x2="69" y2="196" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="200" y1="156" x2="200" y2="196" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="331" y1="156" x2="331" y2="196" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="8" y="198" width="122" height="58" rx="6" fill="#f3f3f3" stroke="#333333" stroke-width="1.5"/>
  <text x="69" y="220" text-anchor="middle">手元で実行</text>
  <text x="69" y="238" text-anchor="middle" font-size="11">変更のたびに回す</text>
  <rect x="139" y="198" width="122" height="58" rx="6" fill="#f3f3f3" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="216" text-anchor="middle" font-size="11">oj-verify・</text>
  <text x="200" y="231" text-anchor="middle" font-size="11">competitive-verifier</text>
  <text x="200" y="246" text-anchor="middle" font-size="11">が全ケースで判定</text>
  <rect x="270" y="198" width="122" height="58" rx="6" fill="#f3f3f3" stroke="#333333" stroke-width="1.5"/>
  <text x="331" y="220" text-anchor="middle">1 ファイルに展開</text>
  <text x="331" y="238" text-anchor="middle" font-size="11">（バンドル）</text>
  <!-- last row -->
  <line x1="200" y1="256" x2="200" y2="296" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="331" y1="256" x2="331" y2="296" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="139" y="298" width="122" height="58" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="320" text-anchor="middle">Library Checker</text>
  <text x="200" y="338" text-anchor="middle" font-size="11">の入出力で確認</text>
  <rect x="270" y="298" width="122" height="58" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="331" y="320" text-anchor="middle">AtCoder に提出</text>
  <text x="331" y="338" text-anchor="middle" font-size="11">ACL の include は残す</text>
  <text x="10" y="374" font-size="11" fill="#555555">①②は同じヘッダを確かめる。③は確かめたヘッダを使う。</text>
</svg>
