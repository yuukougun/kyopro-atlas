<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" font-family="sans-serif" font-size="15">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f4e9a" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222">周期 P = 4 の模様（黒・白・黒・黒の繰り返し）で、[0, 10) の黒を数える</text>
<rect x="40" y="80" width="52" height="44" fill="#333333" stroke="#333" stroke-width="1.2"/>
<text x="66.0" y="144" text-anchor="middle" fill="#555" font-size="13">0</text>
<rect x="92" y="80" width="52" height="44" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
<text x="118.0" y="144" text-anchor="middle" fill="#555" font-size="13">1</text>
<rect x="144" y="80" width="52" height="44" fill="#333333" stroke="#333" stroke-width="1.2"/>
<text x="170.0" y="144" text-anchor="middle" fill="#555" font-size="13">2</text>
<rect x="196" y="80" width="52" height="44" fill="#333333" stroke="#333" stroke-width="1.2"/>
<text x="222.0" y="144" text-anchor="middle" fill="#555" font-size="13">3</text>
<rect x="248" y="80" width="52" height="44" fill="#333333" stroke="#333" stroke-width="1.2"/>
<text x="274.0" y="144" text-anchor="middle" fill="#555" font-size="13">4</text>
<rect x="300" y="80" width="52" height="44" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
<text x="326.0" y="144" text-anchor="middle" fill="#555" font-size="13">5</text>
<rect x="352" y="80" width="52" height="44" fill="#333333" stroke="#333" stroke-width="1.2"/>
<text x="378.0" y="144" text-anchor="middle" fill="#555" font-size="13">6</text>
<rect x="404" y="80" width="52" height="44" fill="#333333" stroke="#333" stroke-width="1.2"/>
<text x="430.0" y="144" text-anchor="middle" fill="#555" font-size="13">7</text>
<rect x="456" y="80" width="52" height="44" fill="#333333" stroke="#333" stroke-width="1.2"/>
<text x="482.0" y="144" text-anchor="middle" fill="#555" font-size="13">8</text>
<rect x="508" y="80" width="52" height="44" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
<text x="534.0" y="144" text-anchor="middle" fill="#555" font-size="13">9</text>
<rect x="560" y="80" width="52" height="44" fill="url(#hatch)" stroke="#999" stroke-dasharray="4 3"/>
<text x="586.0" y="144" text-anchor="middle" fill="#999" font-size="13">10</text>
<path d="M43,74 L43,66 L245,66 L245,74" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<text x="144.0" y="58" text-anchor="middle" fill="#1f4e9a" font-size="13">1 周期：黒 3</text>
<path d="M251,74 L251,66 L453,66 L453,74" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<text x="352.0" y="58" text-anchor="middle" fill="#1f4e9a" font-size="13">1 周期：黒 3</text>
<path d="M459,74 L459,66 L557,66 L557,74" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<text x="508.0" y="58" text-anchor="middle" fill="#1f4e9a" font-size="13">余り 2 マス：黒 1</text>
<text x="20" y="200" fill="#222">X = 10 = 4 × 2 + 2 なので、q = ⌊X / P⌋ = 2、r = X mod P = 2</text>
<text x="20" y="228" fill="#222">f(X) = q × （1 周期の黒の数）+ （先頭 r マスの黒の数）= 2 × 3 + 1 = 7</text>
<text x="20" y="256" fill="#222">範囲 [L, R) の黒の数は f(R) − f(L)（L, R が負でも、⌊ ⌋ で割れば同じ式で済む）</text>
</svg>
