<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" font-family="sans-serif" font-size="17">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222">周期 P = 4（黒・白・黒・黒）で [0, 10) の黒を数える</text>
<rect x="30" y="96" width="40" height="44" fill="#333333" stroke="#999" stroke-width="1.5"/>
<text x="50" y="160" text-anchor="middle" fill="#555" font-size="16">0</text>
<rect x="70" y="96" width="40" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="90" y="160" text-anchor="middle" fill="#555" font-size="16">1</text>
<rect x="110" y="96" width="40" height="44" fill="#333333" stroke="#999" stroke-width="1.5"/>
<text x="130" y="160" text-anchor="middle" fill="#555" font-size="16">2</text>
<rect x="150" y="96" width="40" height="44" fill="#333333" stroke="#999" stroke-width="1.5"/>
<text x="170" y="160" text-anchor="middle" fill="#555" font-size="16">3</text>
<rect x="190" y="96" width="40" height="44" fill="#333333" stroke="#999" stroke-width="1.5"/>
<text x="210" y="160" text-anchor="middle" fill="#555" font-size="16">4</text>
<rect x="230" y="96" width="40" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="250" y="160" text-anchor="middle" fill="#555" font-size="16">5</text>
<rect x="270" y="96" width="40" height="44" fill="#333333" stroke="#999" stroke-width="1.5"/>
<text x="290" y="160" text-anchor="middle" fill="#555" font-size="16">6</text>
<rect x="310" y="96" width="40" height="44" fill="#333333" stroke="#999" stroke-width="1.5"/>
<text x="330" y="160" text-anchor="middle" fill="#555" font-size="16">7</text>
<rect x="350" y="96" width="40" height="44" fill="#333333" stroke="#999" stroke-width="1.5"/>
<text x="370" y="160" text-anchor="middle" fill="#555" font-size="16">8</text>
<rect x="390" y="96" width="40" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="410" y="160" text-anchor="middle" fill="#555" font-size="16">9</text>
<path d="M33,88 L33,80 L187,80 L187,88" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<text x="110" y="72" text-anchor="middle" fill="#1f4e9a" font-size="16">1 周期：黒 3</text>
<path d="M193,88 L193,80 L347,80 L347,88" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<text x="270" y="72" text-anchor="middle" fill="#1f4e9a" font-size="16">1 周期：黒 3</text>
<path d="M353,88 L353,80 L427,80 L427,88" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<text x="390" y="72" text-anchor="middle" fill="#1f4e9a" font-size="16">黒 1</text>
<text x="390" y="52" text-anchor="middle" fill="#1f4e9a" font-size="16">余り 2 マス</text>
<line x1="430" y1="86" x2="430" y2="148" stroke="#b03a2e" stroke-width="2.5"/>
<text x="436" y="162" fill="#b03a2e" font-size="16">X = 10</text>
<text x="20" y="226" fill="#222">X = 10 = 4 × 2 + 2 → q = 2、r = 2</text>
<text x="20" y="254" fill="#222">f(10) = 2 × 3 + 1 = 7（1 周期の黒 × q + 余り）</text>
<text x="20" y="282" fill="#222">[L, R) の黒の数は f(R) − f(L)</text>
</svg>
