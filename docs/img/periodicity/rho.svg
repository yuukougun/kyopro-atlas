<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="sans-serif" font-size="15">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222">x_0 = 2、x_{t+1} = x_t² mod 25 をたどる（丸の中は値、下の t は初めて訪れた時刻）</text>
<line x1="94.0" y1="200.0" x2="174.0" y2="200.0" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="224.0" y1="200.0" x2="324.0" y2="200.0" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="367.0" y1="183.0" x2="411.6" y2="138.4" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<line x1="447.0" y1="137.0" x2="491.6" y2="181.6" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<line x1="493.0" y1="217.0" x2="448.4" y2="261.6" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<line x1="413.0" y1="263.0" x2="368.4" y2="218.4" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="70.0" cy="200.0" r="24" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="70.0" y="205.0" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<text x="70.0" y="244.0" text-anchor="middle" fill="#555" font-size="13">t=0</text>
<circle cx="200.0" cy="200.0" r="24" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="200.0" y="205.0" text-anchor="middle" fill="#222" font-weight="bold">4</text>
<text x="200.0" y="244.0" text-anchor="middle" fill="#555" font-size="13">t=1</text>
<circle cx="350.0" cy="200.0" r="24" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
<text x="350.0" y="205.0" text-anchor="middle" fill="#222" font-weight="bold">16</text>
<text x="344.0" y="244.0" text-anchor="middle" fill="#555" font-size="13">t=2</text>
<circle cx="430.0" cy="120.0" r="24" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
<text x="430.0" y="125.0" text-anchor="middle" fill="#222" font-weight="bold">6</text>
<text x="430.0" y="86.0" text-anchor="middle" fill="#555" font-size="13">t=3</text>
<circle cx="510.0" cy="200.0" r="24" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
<text x="510.0" y="205.0" text-anchor="middle" fill="#222" font-weight="bold">11</text>
<text x="554.0" y="205.0" text-anchor="middle" fill="#555" font-size="13">t=4</text>
<circle cx="430.0" cy="280.0" r="24" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
<text x="430.0" y="285.0" text-anchor="middle" fill="#222" font-weight="bold">21</text>
<text x="430.0" y="324.0" text-anchor="middle" fill="#555" font-size="13">t=5</text>
<text x="135" y="160" text-anchor="middle" fill="#222">尾（点線）：長さ μ = 2</text>
<text x="430" y="205" text-anchor="middle" fill="#222">周期 λ = 4</text>
<text x="300" y="300" text-anchor="middle" fill="#b03a2e" font-size="13">t=6 で 16 に戻る</text>
<text x="20" y="360" fill="#222">16 を初めて訪れたのは t = 2、再び訪れたのは t = 6 → μ = 2、λ = 6 − 2 = 4</text>
<text x="20" y="388" fill="#222">K = 10 回後：K ≥ μ なので μ + (K − μ) mod λ = 2 + 8 mod 4 = 2 → x_10 = x_2 = 16</text>
</svg>
