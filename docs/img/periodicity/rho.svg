<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" font-family="sans-serif" font-size="17">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="30" fill="#222">x₀ = 2、次の値 = 今の値² mod 25</text>
<text x="20" y="56" fill="#555" font-size="16">丸の中は値、t は初めて訪れた時刻</text>
<line x1="78.0" y1="210.0" x2="130.0" y2="210.0" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="188.0" y1="210.0" x2="260.0" y2="210.0" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="309.8" y1="190.2" x2="358.8" y2="141.2" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<line x1="399.8" y1="139.8" x2="448.8" y2="188.8" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<line x1="450.2" y1="229.8" x2="401.2" y2="278.8" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<line x1="360.2" y1="280.2" x2="311.2" y2="231.2" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="50" cy="210" r="26" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="50" y="216" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<text x="50" y="262" text-anchor="middle" fill="#555" font-size="16">t=0</text>
<circle cx="160" cy="210" r="26" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="160" y="216" text-anchor="middle" fill="#222" font-weight="bold">4</text>
<text x="160" y="262" text-anchor="middle" fill="#555" font-size="16">t=1</text>
<circle cx="290" cy="210" r="26" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
<text x="290" y="216" text-anchor="middle" fill="#222" font-weight="bold">16</text>
<text x="278" y="264" text-anchor="middle" fill="#555" font-size="16">t=2</text>
<circle cx="380" cy="120" r="26" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
<text x="380" y="126" text-anchor="middle" fill="#222" font-weight="bold">6</text>
<text x="380" y="82" text-anchor="middle" fill="#555" font-size="16">t=3</text>
<circle cx="470" cy="210" r="26" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
<text x="470" y="216" text-anchor="middle" fill="#222" font-weight="bold">11</text>
<text x="522" y="216" text-anchor="middle" fill="#555" font-size="16">t=4</text>
<circle cx="380" cy="300" r="26" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
<text x="380" y="306" text-anchor="middle" fill="#222" font-weight="bold">21</text>
<text x="380" y="350" text-anchor="middle" fill="#555" font-size="16">t=5</text>
<text x="105" y="172" text-anchor="middle" fill="#222">尾：長さ μ = 2</text>
<text x="380" y="216" text-anchor="middle" fill="#222">周期 λ = 4</text>
<text x="230" y="326" text-anchor="middle" fill="#b03a2e" font-size="16">t=6 で 16 に戻る</text>
<text x="20" y="392" fill="#222">16 は t = 2 と t = 6 に訪れた → μ = 2、λ = 4</text>
<text x="20" y="422" fill="#222">K = 10：2 + (10 − 2) mod 4 = 2 → x₁₀ = x₂ = 16</text>
</svg>
