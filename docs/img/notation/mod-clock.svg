<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" font-family="sans-serif" font-size="13">
<rect width="400" height="320" fill="#ffffff"/>
<text x="200.0" y="24" text-anchor="middle" fill="#222">数直線を 5 ごとに巻き取った時計（m = 5）</text>
<circle cx="200" cy="160" r="62" fill="none" stroke="#333" stroke-width="1.5"/>
<circle cx="200.0" cy="98.0" r="11" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="200.0" y="102.5" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<text x="200.0" y="64.0" text-anchor="middle" fill="#222">…, −5, 0, 5, 10</text>
<circle cx="259.0" cy="140.8" r="11" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="259.0" y="145.3" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<text x="283.7" y="137.8" text-anchor="start" fill="#222">…, −4, 1, 6, 11</text>
<circle cx="236.4" cy="210.2" r="13" fill="#d0d0d0" stroke="#333" stroke-width="2.5"/>
<text x="236.4" y="214.7" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<text x="251.7" y="247.2" text-anchor="start" fill="#222">…, −3, 2, 7, 12</text>
<circle cx="163.6" cy="210.2" r="11" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="163.6" y="214.7" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<text x="148.3" y="247.2" text-anchor="end" fill="#222">…, −2, 3, 8, 13</text>
<circle cx="141.0" cy="140.8" r="11" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="141.0" y="145.3" text-anchor="middle" fill="#222" font-weight="bold">4</text>
<text x="116.3" y="137.8" text-anchor="end" fill="#222">…, −1, 4, 9, 14</text>
<text x="200" y="164" text-anchor="middle" fill="#666" font-size="12">余り</text>
<text x="200.0" y="284" text-anchor="middle" fill="#222">同じ位置の数どうしは合同：−3 ≡ 2 ≡ 7 (mod 5)</text>
<text x="200.0" y="306" text-anchor="middle" fill="#222">位置の番号が余り：(−3) mod 5 = 2</text>
</svg>
