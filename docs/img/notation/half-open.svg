<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 232" width="400" height="232" font-family="sans-serif" font-size="13">
<rect width="400" height="232" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs>
<rect x="40" y="44" width="40" height="36" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="60.0" y="67" text-anchor="middle" fill="#222">0</text>
<rect x="80" y="44" width="40" height="36" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="100.0" y="67" text-anchor="middle" fill="#222">1</text>
<rect x="120" y="44" width="40" height="36" fill="#d0d0d0" stroke="#333" stroke-width="2"/>
<text x="140.0" y="67" text-anchor="middle" fill="#222">2</text>
<rect x="160" y="44" width="40" height="36" fill="#d0d0d0" stroke="#333" stroke-width="2"/>
<text x="180.0" y="67" text-anchor="middle" fill="#222">3</text>
<rect x="200" y="44" width="40" height="36" fill="#d0d0d0" stroke="#333" stroke-width="2"/>
<text x="220.0" y="67" text-anchor="middle" fill="#222">4</text>
<rect x="240" y="44" width="40" height="36" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="260.0" y="67" text-anchor="middle" fill="#222">5</text>
<rect x="280" y="44" width="40" height="36" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="300.0" y="67" text-anchor="middle" fill="#222">6</text>
<rect x="320" y="44" width="40" height="36" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="340.0" y="67" text-anchor="middle" fill="#222">7</text>
<path d="M120 40 L120 34 L240 34 L240 40" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="180.0" y="26" text-anchor="middle" fill="#222">[2, 5)：位置 2, 3, 4</text>
<text x="40" y="96" text-anchor="middle" fill="#666" font-size="11">0</text>
<text x="80" y="96" text-anchor="middle" fill="#666" font-size="11">1</text>
<text x="120" y="96" text-anchor="middle" fill="#666" font-size="11">2</text>
<text x="160" y="96" text-anchor="middle" fill="#666" font-size="11">3</text>
<text x="200" y="96" text-anchor="middle" fill="#666" font-size="11">4</text>
<text x="240" y="96" text-anchor="middle" fill="#666" font-size="11">5</text>
<text x="280" y="96" text-anchor="middle" fill="#666" font-size="11">6</text>
<text x="320" y="96" text-anchor="middle" fill="#666" font-size="11">7</text>
<text x="360" y="96" text-anchor="middle" fill="#666" font-size="11">8</text>
<line x1="120" y1="120" x2="120" y2="102" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="120" y="136" text-anchor="middle" fill="#222">l = 2（含む）</text>
<line x1="240" y1="120" x2="240" y2="102" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="240" y="136" text-anchor="middle" fill="#222">r = 5（含まない）</text>
<text x="40" y="166" fill="#222">個数（長さ）は r − l = 5 − 2 = 3</text>
<text x="40" y="186" fill="#222">[2, 3) と [3, 5) に分けても重ならず漏れない</text>
<text x="40" y="206" fill="#222">l = r なら空の区間（[6, 6) は 0 個）</text>
<text x="40" y="226" fill="#222">箱の下の小さい数は境目の番号で、l と r は境目を指す</text>
</svg>
