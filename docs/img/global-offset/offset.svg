<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="400" height="330" fill="#ffffff"/>
<text x="16" y="22" font-size="14" fill="#333">操作：5 を入れる → 全体に +3 → 6 を入れる</text>
<text x="16" y="40" font-size="14" fill="#333">→ 全体に +2 → 5 を入れる（今の d = 5）</text>
<text x="16" y="72" fill="#111">格納値<tspan font-size="13" fill="#333">（入れたときの d を引いて保存）</tspan></text>
<text x="130.0" y="94" text-anchor="middle" font-size="13" fill="#333">5 − 5</text>
<rect x="95" y="100" width="70" height="40" fill="#e8f0fe" stroke="#1a4fa0" stroke-width="1.5"/>
<text x="130.0" y="126" text-anchor="middle">0</text>
<line x1="130.0" y1="142" x2="130.0" y2="194" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="125.0,192 135.0,192 130.0,200" fill="#555"/>
<text x="140.0" y="174" font-size="13" fill="#b03a00">＋d</text>
<text x="220.0" y="94" text-anchor="middle" font-size="13" fill="#333">6 − 3</text>
<rect x="185" y="100" width="70" height="40" fill="#e8f0fe" stroke="#1a4fa0" stroke-width="1.5"/>
<text x="220.0" y="126" text-anchor="middle">3</text>
<line x1="220.0" y1="142" x2="220.0" y2="194" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="215.0,192 225.0,192 220.0,200" fill="#555"/>
<text x="230.0" y="174" font-size="13" fill="#b03a00">＋d</text>
<text x="310.0" y="94" text-anchor="middle" font-size="13" fill="#333">5 − 0</text>
<rect x="275" y="100" width="70" height="40" fill="#e8f0fe" stroke="#1a4fa0" stroke-width="1.5"/>
<text x="310.0" y="126" text-anchor="middle">5</text>
<line x1="310.0" y1="142" x2="310.0" y2="194" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="305.0,192 315.0,192 310.0,200" fill="#555"/>
<text x="320.0" y="174" font-size="13" fill="#b03a00">＋d</text>
<rect x="95" y="200" width="70" height="40" fill="#fff4e5" stroke="#b03a00" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="130.0" y="226" text-anchor="middle">5</text>
<rect x="185" y="200" width="70" height="40" fill="#fff4e5" stroke="#b03a00" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="220.0" y="226" text-anchor="middle">8</text>
<rect x="275" y="200" width="70" height="40" fill="#fff4e5" stroke="#b03a00" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="310.0" y="226" text-anchor="middle">10</text>
<text x="16" y="266" fill="#111">実際の値<tspan font-size="13" fill="#333">（どの要素にも同じ d = 5 を足す）</tspan></text>
<text x="16" y="298" font-size="13" fill="#333">箱は格納値の小さい順。この順は実際の値でも同じ</text>
<text x="16" y="316" font-size="13" fill="#333">なので、ヒープや set はそのまま使える</text>
</svg>
