<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif" font-size="14">
  <rect width="640" height="250" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" font-size="15">HP h の状態と E[h]（p = 1/2）。実線：確率 1 − p で HP − 1、破線：確率 p で HP − 2</text>
  <!-- nodes at x = 80,200,320,440,560 ; y = 140 -->
  <g stroke="#333333" stroke-width="1.5">
    <circle cx="80" cy="140" r="30" fill="#e8f0fe"/>
    <circle cx="200" cy="140" r="30" fill="#e8f0fe"/>
    <circle cx="320" cy="140" r="30" fill="#e8f0fe"/>
    <circle cx="440" cy="140" r="30" fill="#e8f0fe"/>
    <circle cx="560" cy="140" r="30" fill="#fde7e7" stroke-width="3"/>
  </g>
  <g text-anchor="middle">
    <text x="80" y="136">HP 4</text><text x="80" y="154">2.875</text>
    <text x="200" y="136">HP 3</text><text x="200" y="154">2.25</text>
    <text x="320" y="136">HP 2</text><text x="320" y="154">1.5</text>
    <text x="440" y="136">HP 1</text><text x="440" y="154">1</text>
    <text x="560" y="136">HP 0</text><text x="560" y="154">0</text>
    <text x="560" y="194">終状態</text>
  </g>
  <!-- solid: h -> h-1 -->
  <g stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <line x1="110" y1="140" x2="168" y2="140"/>
    <line x1="230" y1="140" x2="288" y2="140"/>
    <line x1="350" y1="140" x2="408" y2="140"/>
    <line x1="470" y1="140" x2="528" y2="140"/>
  </g>
  <!-- dashed: h -> h-2 (from 1 goes to 0 as well) -->
  <g stroke="#333333" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)">
    <path d="M90,111 Q200,50 310,111"/>
    <path d="M210,169 Q320,230 430,169"/>
    <path d="M330,111 Q440,50 550,111"/>
    <path d="M455,166 Q510,215 548,168"/>
  </g>
  <text x="320" y="246" text-anchor="middle" font-size="13">HP 1 からは破線も実線も HP 0 へ移る（0 未満は 0 にまとめる）。値は右（HP 0 = 0）から順に埋まる</text>
</svg>
