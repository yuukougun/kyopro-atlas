<text x="20" y="370" fill="#222" font-size="13">1 葉 [1, 2) を足す：累積 1 ≤ 12（真）→ 右隣へ</text>
<text x="20" y="390" fill="#222" font-size="13">2 右隣 [2, 3) は左の子なので親 [2, 4) へ登り、足す：1 + 5 = 6（真）→ 右隣へ</text>
<text x="20" y="410" fill="#222" font-size="13">3 右隣 [4, 6) も左の子なので親 [4, 8) へ登る：6 + 22 = 28（偽）→ 降りる</text>
<text x="20" y="430" fill="#222" font-size="13">4 左の子 [4, 6) は 6 + 14 = 20（偽）→ 足さずに左の子へ</text>
<text x="20" y="450" fill="#222" font-size="13">5 左の子 [4, 5) は 6 + 5 = 11（真）→ 足して右隣へ。葉に着いたので r = 5</text>
