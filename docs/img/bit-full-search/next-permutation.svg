<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="500" height="330" font-family="sans-serif" font-size="14">
<rect x="0" y="0" width="500" height="330" fill="#ffffff"/>
<text x="20" y="44" fill="#000">① 右から見て初めて</text>
<rect x="200" y="20" width="40" height="36" rx="4" fill="#ffffff" stroke="#777"/>
<text x="220" y="44" text-anchor="middle" fill="#000" font-size="17">1</text>
<rect x="250" y="20" width="40" height="36" rx="4" fill="#ffe0b3" stroke="#c06000" stroke-width="2"/>
<text x="270" y="44" text-anchor="middle" fill="#000" font-size="17">3</text>
<rect x="300" y="20" width="40" height="36" rx="4" fill="#ffffff" stroke="#2a8a2a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="320" y="44" text-anchor="middle" fill="#000" font-size="17">5</text>
<rect x="350" y="20" width="40" height="36" rx="4" fill="#ffffff" stroke="#2a8a2a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="370" y="44" text-anchor="middle" fill="#000" font-size="17">4</text>
<rect x="400" y="20" width="40" height="36" rx="4" fill="#ffffff" stroke="#2a8a2a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="420" y="44" text-anchor="middle" fill="#000" font-size="17">2</text>
<text x="20" y="74" fill="#000">　下がる位置 i（3）</text>
<text x="300" y="74" fill="#2a8a2a">5 4 2 は降順（点線）</text>
<text x="20" y="124" fill="#000">② 右から見て初めて</text>
<rect x="200" y="100" width="40" height="36" rx="4" fill="#ffffff" stroke="#777"/>
<text x="220" y="124" text-anchor="middle" fill="#000" font-size="17">1</text>
<rect x="250" y="100" width="40" height="36" rx="4" fill="#ffe0b3" stroke="#c06000" stroke-width="2"/>
<text x="270" y="124" text-anchor="middle" fill="#000" font-size="17">3</text>
<rect x="300" y="100" width="40" height="36" rx="4" fill="#ffffff" stroke="#777"/>
<text x="320" y="124" text-anchor="middle" fill="#000" font-size="17">5</text>
<rect x="350" y="100" width="40" height="36" rx="4" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2"/>
<text x="370" y="124" text-anchor="middle" fill="#000" font-size="17">4</text>
<rect x="400" y="100" width="40" height="36" rx="4" fill="#ffffff" stroke="#777"/>
<text x="420" y="124" text-anchor="middle" fill="#000" font-size="17">2</text>
<text x="20" y="154" fill="#000">　a[i] より大きい j（4）</text>
<text x="20" y="204" fill="#000">③ a[i] と a[j] を交換</text>
<rect x="200" y="180" width="40" height="36" rx="4" fill="#ffffff" stroke="#777"/>
<text x="220" y="204" text-anchor="middle" fill="#000" font-size="17">1</text>
<rect x="250" y="180" width="40" height="36" rx="4" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2"/>
<text x="270" y="204" text-anchor="middle" fill="#000" font-size="17">4</text>
<rect x="300" y="180" width="40" height="36" rx="4" fill="#ffffff" stroke="#2a8a2a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="320" y="204" text-anchor="middle" fill="#000" font-size="17">5</text>
<rect x="350" y="180" width="40" height="36" rx="4" fill="#ffffff" stroke="#2a8a2a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="370" y="204" text-anchor="middle" fill="#000" font-size="17">3</text>
<rect x="400" y="180" width="40" height="36" rx="4" fill="#ffffff" stroke="#2a8a2a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="420" y="204" text-anchor="middle" fill="#000" font-size="17">2</text>
<text x="300" y="234" fill="#2a8a2a">5 3 2 はまだ降順</text>
<text x="20" y="284" fill="#000">④ i より右を反転</text>
<rect x="200" y="260" width="40" height="36" rx="4" fill="#ffffff" stroke="#777"/>
<text x="220" y="284" text-anchor="middle" fill="#000" font-size="17">1</text>
<rect x="250" y="260" width="40" height="36" rx="4" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2"/>
<text x="270" y="284" text-anchor="middle" fill="#000" font-size="17">4</text>
<rect x="300" y="260" width="40" height="36" rx="4" fill="#ffffff" stroke="#2a8a2a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="320" y="284" text-anchor="middle" fill="#000" font-size="17">2</text>
<rect x="350" y="260" width="40" height="36" rx="4" fill="#ffffff" stroke="#2a8a2a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="370" y="284" text-anchor="middle" fill="#000" font-size="17">3</text>
<rect x="400" y="260" width="40" height="36" rx="4" fill="#ffffff" stroke="#2a8a2a" stroke-width="2" stroke-dasharray="5 3"/>
<text x="420" y="284" text-anchor="middle" fill="#000" font-size="17">5</text>
<text x="20" y="314" fill="#000">　→ 次の順列</text>
</svg>
