<svg viewBox="0 0 330 775" width="330" height="775" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="330" height="775" fill="#ffffff"/>
  <g font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold">
    <text x="150" y="26">DFS 木（頂点 0 から）</text>
    <text x="180" y="416">BFS 木（頂点 0 から）</text>
  </g>
  <!-- DFS 木：木に入らない辺（破線の弧） -->
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M 120 60 Q 290 160 120 260"/>
    <path d="M 120 110 Q 195 160 120 210"/>
    <path d="M 120 210 Q 190 260 120 310"/>
  </g>
  <!-- DFS 木：木の辺 -->
  <g stroke="#1d4ed8" stroke-width="4">
    <line x1="120" y1="60" x2="120" y2="310"/>
  </g>
  <g fill="#ffffff" stroke="#0f172a" stroke-width="2">
    <circle cx="120" cy="60" r="16"/>
    <circle cx="120" cy="110" r="16"/>
    <circle cx="120" cy="160" r="16"/>
    <circle cx="120" cy="210" r="16"/>
    <circle cx="120" cy="260" r="16"/>
    <circle cx="120" cy="310" r="16"/>
  </g>
  <g font-size="15" fill="#0f172a" text-anchor="middle">
    <text x="120" y="65">0</text>
    <text x="120" y="115">1</text>
    <text x="120" y="165">3</text>
    <text x="120" y="215">4</text>
    <text x="120" y="265">2</text>
    <text x="120" y="315">5</text>
  </g>
  <g font-size="14" fill="#64748b" text-anchor="end">
    <text x="92" y="64">深さ 0</text>
    <text x="92" y="114">1</text>
    <text x="92" y="164">2</text>
    <text x="92" y="214">3</text>
    <text x="92" y="264">4</text>
    <text x="92" y="314">5</text>
  </g>
  <g font-size="14" fill="#b45309">
    <text x="210" y="164">0–2</text>
    <text x="163" y="152">1–4</text>
    <text x="160" y="276">4–5</text>
  </g>
  <line x1="10" y1="385" x2="320" y2="385" stroke="#ccc" stroke-dasharray="4 4"/>
  <!-- BFS 木：層 -->
  <g font-size="14" fill="#64748b" text-anchor="start">
    <text x="34" y="454">層 0</text>
    <text x="34" y="554">層 1</text>
    <text x="34" y="654">層 2</text>
  </g>
  <!-- BFS 木：木に入らない辺 -->
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <line x1="240" y1="550" x2="180" y2="650"/>
    <line x1="100" y1="650" x2="180" y2="650"/>
    <line x1="180" y1="650" x2="280" y2="650"/>
  </g>
  <!-- BFS 木：木の辺 -->
  <g stroke="#1d4ed8" stroke-width="4">
    <line x1="180" y1="450" x2="120" y2="550"/>
    <line x1="180" y1="450" x2="240" y2="550"/>
    <line x1="120" y1="550" x2="100" y2="650"/>
    <line x1="120" y1="550" x2="180" y2="650"/>
    <line x1="240" y1="550" x2="280" y2="650"/>
  </g>
  <g fill="#ffffff" stroke="#0f172a" stroke-width="2">
    <circle cx="180" cy="450" r="16"/>
    <circle cx="120" cy="550" r="16"/>
    <circle cx="240" cy="550" r="16"/>
    <circle cx="100" cy="650" r="16"/>
    <circle cx="180" cy="650" r="16"/>
    <circle cx="280" cy="650" r="16"/>
  </g>
  <g font-size="15" fill="#0f172a" text-anchor="middle">
    <text x="180" y="455">0</text>
    <text x="120" y="555">1</text>
    <text x="240" y="555">2</text>
    <text x="100" y="655">3</text>
    <text x="180" y="655">4</text>
    <text x="280" y="655">5</text>
  </g>
  <!-- 説明 -->
  <g font-size="14" fill="#334155" text-anchor="middle">
    <text x="150" y="346">破線（木に入らない辺）は</text>
    <text x="150" y="364">すべて祖先と子孫を結ぶ</text>
    <text x="180" y="690">破線は同じ層か隣の層を結び、</text>
    <text x="180" y="708">祖先と子孫を結ぶものはない</text>
  </g>
  <!-- 凡例 -->
  <g font-size="14" fill="#334155">
    <line x1="30" y1="758" x2="66" y2="758" stroke="#1d4ed8" stroke-width="4"/>
    <text x="72" y="762">木の辺</text>
    <line x1="150" y1="758" x2="186" y2="758" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="192" y="762">木に入らない辺</text>
  </g>
</svg>
