<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" font-family="sans-serif" font-size="14">
  <rect width="400" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="16" y="24" font-size="15" font-weight="bold" fill="#111111">再帰の 1 回の呼び出しがたどる経路</text>
  <!-- std::function -->
  <text x="16" y="56" fill="#333333" font-weight="bold">std::function</text>
  <rect x="16" y="68" width="100" height="34" rx="5" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="66" y="90" text-anchor="middle">dfs(to, v)</text>
  <rect x="140" y="68" width="112" height="34" rx="5" fill="#fff4e0" stroke="#b36b00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="196" y="90" text-anchor="middle">型消去の入れ物</text>
  <rect x="276" y="68" width="104" height="34" rx="5" fill="#eef4ff" stroke="#1f4e9c" stroke-width="2"/>
  <text x="328" y="90" text-anchor="middle">ラムダの本体</text>
  <line x1="116" y1="85" x2="137" y2="85" stroke="#333333" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="252" y1="85" x2="273" y2="85" stroke="#333333" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a2)"/>
  <text x="16" y="126" font-size="13" fill="#b36b00">中身の型を知らないので、関数ポインタを経て</text>
  <text x="16" y="144" font-size="13" fill="#b36b00">間接的に呼ぶ（インライン化されにくく、</text>
  <text x="16" y="162" font-size="13" fill="#b36b00">1 段ごとのスタックも大きい）</text>
  <line x1="16" y1="180" x2="384" y2="180" stroke="#cccccc"/>
  <!-- self -->
  <text x="16" y="206" fill="#333333" font-weight="bold">auto&amp;&amp; self・this auto&amp;&amp; self</text>
  <rect x="16" y="218" width="150" height="46" rx="5" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="91" y="236" text-anchor="middle">self(self, to, v)</text>
  <text x="91" y="256" text-anchor="middle">self(to, v)</text>
  <rect x="276" y="224" width="104" height="34" rx="5" fill="#eef4ff" stroke="#1f4e9c" stroke-width="2"/>
  <text x="328" y="246" text-anchor="middle">ラムダの本体</text>
  <line x1="166" y1="241" x2="273" y2="241" stroke="#333333" stroke-width="2" marker-end="url(#a2)"/>
  <text x="16" y="290" font-size="13" fill="#1f4e9c">self の型はコンパイル時に分かっているので、</text>
  <text x="16" y="308" font-size="13" fill="#1f4e9c">直接呼ぶ（普通の関数の再帰と同じ速さ）</text>
</svg>
