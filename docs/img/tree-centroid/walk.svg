<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 456" width="400" height="456" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="400" height="456" fill="#ffffff"/>
<text x="10" y="22" fill="#222">最大の成分の方へ 1 歩ずつ動くと、</text>
<text x="10" y="42" fill="#222">重心 2 で止まる（N = 10）</text>
<g fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4">
<rect x="10" y="190" width="120" height="90" rx="14"/>
<rect x="238" y="86" width="152" height="160" rx="14"/>
<rect x="238" y="266" width="152" height="110" rx="14"/>
</g>
<text x="70" y="300" text-anchor="middle" fill="#555">成分 2 頂点</text>
<text x="238" y="78" fill="#555">成分 4 頂点</text>
<text x="238" y="396" fill="#555">成分 3 頂点</text>
<g stroke="#555" stroke-width="2">
<line x1="30" y1="230" x2="105" y2="230"/>
<line x1="105" y1="230" x2="185" y2="230"/>
<line x1="185" y1="230" x2="265" y2="165"/>
<line x1="185" y1="230" x2="265" y2="310"/>
<line x1="265" y1="165" x2="355" y2="110"/>
<line x1="265" y1="165" x2="365" y2="165"/>
<line x1="265" y1="165" x2="355" y2="220"/>
<line x1="265" y1="310" x2="355" y2="290"/>
<line x1="265" y1="310" x2="355" y2="350"/>
</g>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker></defs>
<g fill="none" stroke="#1f5fbf" stroke-width="3" marker-end="url(#arrow)"><path d="M 38 207 Q 67 178 97 205"/><path d="M 113 207 Q 145 178 177 205"/></g>
<text x="100" y="170" text-anchor="middle" fill="#1f5fbf">最大の成分の方へ</text>
<g fill="#ffffff" stroke="#555" stroke-width="2">
<circle cx="30" cy="230" r="15"/>
<circle cx="105" cy="230" r="15"/>
<circle cx="265" cy="165" r="15"/>
<circle cx="265" cy="310" r="15"/>
<circle cx="355" cy="110" r="13"/>
<circle cx="365" cy="165" r="13"/>
<circle cx="355" cy="220" r="13"/>
<circle cx="355" cy="290" r="13"/>
<circle cx="355" cy="350" r="13"/>
</g>
<circle cx="185" cy="230" r="17" fill="#dbe7f8" stroke="#1f5fbf" stroke-width="3.5"/>
<g text-anchor="middle" font-size="15" fill="#222">
<text x="30" y="235">0</text>
<text x="105" y="235">1</text>
<text x="185" y="235">2</text>
<text x="265" y="170">3</text>
<text x="265" y="315">4</text>
<text x="355" y="115">5</text>
<text x="365" y="170">6</text>
<text x="355" y="225">7</text>
<text x="355" y="295">8</text>
<text x="355" y="355">9</text>
</g>
<g text-anchor="middle" font-size="15" fill="#b03a2e">
<text x="30" y="266">最大 9</text><text x="105" y="266">最大 8</text><text x="185" y="268" font-weight="bold">最大 4</text><text x="262" y="138">最大 6</text><text x="262" y="346">最大 7</text>
</g>
<text x="10" y="424" fill="#222">2 を取り除くと 2・4・3 頂点に分かれ、どれも</text>
<text x="10" y="444" fill="#222">10 / 2 = 5 以下（葉はどれも最大 9）</text>
</svg>
