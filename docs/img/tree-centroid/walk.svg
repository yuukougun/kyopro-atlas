<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="390" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#222">最大の成分の方へ 1 歩ずつ動くと、重心 2 で止まる（N = 10）</text>
  <!-- 2 を取り除いたときの成分（破線の枠） -->
  <g fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4">
    <rect x="40" y="150" width="170" height="90" rx="14"/>
    <rect x="370" y="45" width="210" height="160" rx="14"/>
    <rect x="370" y="225" width="210" height="110" rx="14"/>
  </g>
  <text x="125" y="258" text-anchor="middle" font-size="15" fill="#555">成分 2 頂点</text>
  <text x="590" y="130" text-anchor="start" font-size="15" fill="#555">成分</text>
  <text x="590" y="148" text-anchor="start" font-size="15" fill="#555">4 頂点</text>
  <text x="590" y="280" text-anchor="start" font-size="15" fill="#555">成分</text>
  <text x="590" y="298" text-anchor="start" font-size="15" fill="#555">3 頂点</text>
  <!-- 辺 -->
  <g stroke="#555" stroke-width="2">
    <line x1="80" y1="190" x2="170" y2="190"/>
    <line x1="170" y1="190" x2="290" y2="190"/>
    <line x1="290" y1="190" x2="410" y2="125"/>
    <line x1="290" y1="190" x2="410" y2="270"/>
    <line x1="410" y1="125" x2="530" y2="70"/>
    <line x1="410" y1="125" x2="540" y2="125"/>
    <line x1="410" y1="125" x2="530" y2="180"/>
    <line x1="410" y1="270" x2="530" y2="250"/>
    <line x1="410" y1="270" x2="530" y2="310"/>
  </g>
  <!-- 動いた道（太い矢印） -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
  </defs>
  <g fill="none" stroke="#1f5fbf" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 88 165 Q 125 130 160 163"/>
    <path d="M 180 163 Q 230 125 278 163"/>
  </g>
  <text x="185" y="120" text-anchor="middle" font-size="15" fill="#1f5fbf">最大の成分の方へ</text>
  <!-- 頂点 -->
  <g fill="#ffffff" stroke="#555" stroke-width="2">
    <circle cx="80" cy="190" r="15"/>
    <circle cx="170" cy="190" r="15"/>
    <circle cx="410" cy="125" r="15"/>
    <circle cx="410" cy="270" r="15"/>
    <circle cx="530" cy="70" r="13"/>
    <circle cx="540" cy="125" r="13"/>
    <circle cx="530" cy="180" r="13"/>
    <circle cx="530" cy="250" r="13"/>
    <circle cx="530" cy="310" r="13"/>
  </g>
  <circle cx="290" cy="190" r="17" fill="#dbe7f8" stroke="#1f5fbf" stroke-width="3.5"/>
  <g text-anchor="middle" font-size="14" fill="#222">
    <text x="80" y="195">0</text>
    <text x="170" y="195">1</text>
    <text x="290" y="195">2</text>
    <text x="410" y="130">3</text>
    <text x="410" y="275">4</text>
    <text x="530" y="75">5</text>
    <text x="540" y="130">6</text>
    <text x="530" y="185">7</text>
    <text x="530" y="255">8</text>
    <text x="530" y="315">9</text>
  </g>
  <!-- 取り除いたときの最大の成分 -->
  <g text-anchor="middle" font-size="15" fill="#b03a2e">
    <text x="80" y="226">最大 9</text>
    <text x="170" y="226">最大 8</text>
    <text x="290" y="228" font-weight="bold">最大 4</text>
    <text x="410" y="96">最大 6</text>
    <text x="410" y="306">最大 7</text>
  </g>
  <text x="320" y="356" text-anchor="middle" font-size="15" fill="#222">2 を取り除くと 2・4・3 頂点に分かれ、どれも 10 / 2 = 5 以下</text>
  <text x="320" y="376" text-anchor="middle" font-size="15" fill="#222">（葉はどれも最大 9）</text>
</svg>
