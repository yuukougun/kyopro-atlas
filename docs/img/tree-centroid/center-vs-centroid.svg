<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="270" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#222">中心は直径の真ん中、重心は頂点の数の真ん中（N = 10）</text>
  <!-- 直径 0–6（太線） -->
  <g stroke="#555" stroke-width="2">
    <line x1="460" y1="130" x2="570" y2="180"/>
    <line x1="460" y1="130" x2="570" y2="230"/>
    <line x1="460" y1="130" x2="570" y2="130"/>
  </g>
  <g stroke="#1f5fbf" stroke-width="5">
    <line x1="60" y1="130" x2="460" y2="130"/>
    <line x1="460" y1="130" x2="570" y2="70"/>
  </g>
  <text x="240" y="92" text-anchor="middle" font-size="15" fill="#1f5fbf">直径 0–6（太線、長さ 6）</text>
  <!-- 重心の 2 頂点を分ける辺 4–5 -->
  <line x1="420" y1="100" x2="420" y2="200" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="420" y="218" text-anchor="middle" font-size="15" fill="#b03a2e">5 頂点 | 5 頂点</text>
  <!-- 頂点 -->
  <g fill="#ffffff" stroke="#555" stroke-width="2">
    <circle cx="60" cy="130" r="15"/>
    <circle cx="140" cy="130" r="15"/>
    <circle cx="220" cy="130" r="15"/>
    <circle cx="570" cy="70" r="13"/>
    <circle cx="570" cy="130" r="13"/>
    <circle cx="570" cy="180" r="13"/>
    <circle cx="570" cy="230" r="13"/>
  </g>
  <!-- 中心 3：二重丸 -->
  <circle cx="300" cy="130" r="19" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <circle cx="300" cy="130" r="14" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- 重心 4, 5：塗り -->
  <circle cx="380" cy="130" r="16" fill="#f6d5d1" stroke="#b03a2e" stroke-width="3"/>
  <circle cx="460" cy="130" r="16" fill="#f6d5d1" stroke="#b03a2e" stroke-width="3"/>
  <g text-anchor="middle" font-size="14" fill="#222">
    <text x="60" y="135">0</text>
    <text x="140" y="135">1</text>
    <text x="220" y="135">2</text>
    <text x="300" y="135">3</text>
    <text x="380" y="135">4</text>
    <text x="460" y="135">5</text>
    <text x="570" y="75">6</text>
    <text x="570" y="135">7</text>
    <text x="570" y="185">8</text>
    <text x="570" y="235">9</text>
  </g>
  <text x="300" y="172" text-anchor="middle" font-size="15" fill="#222">中心（二重丸）</text>
  <text x="300" y="188" text-anchor="middle" font-size="15" fill="#222">最も遠い点まで 3</text>
  <text x="420" y="66" text-anchor="middle" font-size="15" fill="#b03a2e">重心（塗り）4 と 5</text>
  <text x="320" y="254" text-anchor="middle" font-size="15" fill="#222">葉が片側に集まると、重心は葉の側へ寄り、中心とずれる</text>
</svg>
