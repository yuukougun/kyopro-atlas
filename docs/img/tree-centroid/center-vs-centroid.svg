<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 316" width="390" height="316" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="390" height="316" fill="#ffffff"/>
<text x="10" y="22" fill="#222">中心は直径の真ん中、重心は頂点の数の</text>
<text x="10" y="42" fill="#222">真ん中（N = 10）</text>
<g stroke="#555" stroke-width="2">
<line x1="284" y1="152" x2="354" y2="152"/>
<line x1="284" y1="152" x2="354" y2="202"/>
<line x1="284" y1="152" x2="354" y2="252"/>
</g><g stroke="#1f5fbf" stroke-width="5">
<line x1="24" y1="152" x2="284" y2="152"/><line x1="284" y1="152" x2="354" y2="92"/></g>
<text x="104" y="122" text-anchor="middle" fill="#1f5fbf">直径 0–6（太線、長さ 6）</text>
<line x1="258" y1="126" x2="258" y2="222" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="258" y="242" text-anchor="middle" fill="#b03a2e">5 頂点 | 5 頂点</text>
<g fill="#ffffff" stroke="#555" stroke-width="2">
<circle cx="24" cy="152" r="15"/>
<circle cx="76" cy="152" r="15"/>
<circle cx="128" cy="152" r="15"/>
<circle cx="354" cy="92" r="13"/>
<circle cx="354" cy="152" r="13"/>
<circle cx="354" cy="202" r="13"/>
<circle cx="354" cy="252" r="13"/>
</g>
<circle cx="180" cy="152" r="19" fill="#ffffff" stroke="#222" stroke-width="2"/><circle cx="180" cy="152" r="14" fill="#ffffff" stroke="#222" stroke-width="2"/>
<circle cx="232" cy="152" r="16" fill="#f6d5d1" stroke="#b03a2e" stroke-width="3"/>
<circle cx="284" cy="152" r="16" fill="#f6d5d1" stroke="#b03a2e" stroke-width="3"/>
<g text-anchor="middle" font-size="15" fill="#222">
<text x="24" y="157">0</text>
<text x="76" y="157">1</text>
<text x="128" y="157">2</text>
<text x="180" y="157">3</text>
<text x="232" y="157">4</text>
<text x="284" y="157">5</text>
<text x="354" y="97">6</text>
<text x="354" y="157">7</text>
<text x="354" y="207">8</text>
<text x="354" y="257">9</text>
</g>
<text x="180" y="196" text-anchor="middle" fill="#222">中心（二重丸）</text>
<text x="180" y="216" text-anchor="middle" fill="#222">最も遠い点まで 3</text>
<text x="250" y="92" text-anchor="middle" fill="#b03a2e">重心（塗り）4 と 5</text>
<text x="10" y="284" fill="#222">葉が片側に集まると、重心は葉の側へ寄り、</text>
<text x="10" y="304" fill="#222">中心とずれる</text>
</svg>
