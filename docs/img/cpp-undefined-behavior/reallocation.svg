<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="360" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- 上：push_back の前 -->
  <text x="16" y="26" font-weight="bold" fill="#000000">① auto&amp; row = g[0]; の直後</text>
  <text x="16" y="56" fill="#000000">g の領域（容量 1）</text>
  <rect x="16" y="66" width="90" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="61" y="91" text-anchor="middle" fill="#000000">g[0]={1}</text>
  <text x="200" y="91" fill="#000000">row</text>
  <line x1="196" y1="86" x2="112" y2="86" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="16" y="136" fill="#000000">row は g[0] を指す</text>

  <line x1="16" y1="162" x2="344" y2="162" stroke="#d1d5db" stroke-width="1"/>

  <!-- 下：push_back の後 -->
  <text x="16" y="194" font-weight="bold" fill="#000000">② g.push_back({2}); の後</text>
  <text x="16" y="224" fill="#000000">古い領域（解放済み）</text>
  <rect x="16" y="234" width="90" height="40" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="61" y="259" text-anchor="middle" fill="#6b7280">（空き）</text>
  <text x="200" y="259" fill="#000000">row</text>
  <line x1="196" y1="254" x2="112" y2="254" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <line x1="61" y1="276" x2="61" y2="331" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="72" y="308" fill="#1d4ed8">要素が移る</text>
  <text x="16" y="354" fill="#000000">新しい領域（容量 2）</text>
  <rect x="16" y="364" width="90" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="61" y="389" text-anchor="middle" fill="#000000">g[0]={1}</text>
  <rect x="106" y="364" width="90" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="151" y="389" text-anchor="middle" fill="#000000">g[1]={2}</text>
  <text x="16" y="446" fill="#b91c1c">row は解放済みの古い領域を指したまま</text>
  <text x="16" y="470" fill="#b91c1c">（ダングリング。row.push_back(3) は</text>
  <text x="16" y="490" fill="#b91c1c">未定義動作）</text>
</svg>
