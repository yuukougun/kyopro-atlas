<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- 左：push_back の前 -->
  <text x="20" y="28" font-weight="bold" fill="#000000">① auto&amp; row = g[0]; の直後</text>
  <text x="20" y="62" fill="#000000">g の領域（容量 1）</text>
  <rect x="20" y="72" width="90" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="65" y="97" text-anchor="middle" fill="#000000">g[0]={1}</text>
  <text x="20" y="170" fill="#000000">row</text>
  <line x1="50" y1="165" x2="62" y2="116" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="20" y="200" fill="#000000">row は g[0] を指す</text>

  <!-- 右：push_back の後 -->
  <text x="330" y="28" font-weight="bold" fill="#000000">② g.push_back({2}); の後</text>
  <text x="330" y="62" fill="#000000">古い領域（解放済み）</text>
  <rect x="330" y="72" width="90" height="40" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="375" y="97" text-anchor="middle" fill="#6b7280">（空き）</text>
  <text x="520" y="185" fill="#000000">新しい領域</text>
  <rect x="330" y="160" width="90" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="375" y="185" text-anchor="middle" fill="#000000">g[0]={1}</text>
  <rect x="420" y="160" width="90" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="465" y="185" text-anchor="middle" fill="#000000">g[1]={2}</text>
  <line x1="375" y1="114" x2="375" y2="157" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="385" y="140" fill="#1d4ed8">要素が移る</text>
  <text x="560" y="97" fill="#000000">row</text>
  <line x1="556" y1="92" x2="426" y2="92" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="330" y="240" fill="#b91c1c">row は解放済みの古い領域を指したまま</text>
  <text x="330" y="262" fill="#b91c1c">（ダングリング。row.push_back(3) は未定義動作）</text>
</svg>
