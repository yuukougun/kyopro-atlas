<text x="270.0" y="315" text-anchor="middle" fill="#555" font-size="11">選択済</text>
<rect x="290" y="268" width="32" height="32" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="306.0" y="290" text-anchor="middle" fill="#222">b</text>
<rect x="287" y="265" width="38" height="38" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="346" y="282" fill="#222">a を試す：× 位置 5 以降に a がない</text>
<text x="346" y="302" fill="#222">b を試す：○ 位置 5 で確定</text>
<text x="20" y="370" fill="#222">答え：aab（太枠が選んだ位置。破線の枠は、取ると残りが足りなくなるか、すでに通り過ぎた位置）</text>
</g>
