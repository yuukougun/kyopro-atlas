<text x="162.0" y="315" text-anchor="middle" fill="#555" font-size="11">選択済</text>
<rect x="182" y="268" width="32" height="32" fill="#eeeeee" stroke="#1f4e9a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="198.0" y="290" text-anchor="middle" fill="#999">c</text>
<rect x="218" y="268" width="32" height="32" fill="#eeeeee" stroke="#1f4e9a" stroke-width="1.2" stroke-dasharray="3 3"/>
