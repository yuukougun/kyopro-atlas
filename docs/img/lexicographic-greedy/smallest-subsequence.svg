<rect x="290" y="163" width="32" height="32" fill="#eeeeee" stroke="#1f4e9a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="306.0" y="185" text-anchor="middle" fill="#999">b</text>
<rect x="251" y="160" width="38" height="38" fill="none" stroke="#c0392b" stroke-width="3"/>
