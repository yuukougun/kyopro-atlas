<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="20" fill="#222">S = bacbab から長さ 3 の部分列を辞書順最小に選ぶ。</text>
<text x="20" y="38" fill="#222">各段で a から順に試し、残りの文字数が足りる範囲（青い枠）に出てくれば確定する。</text>
