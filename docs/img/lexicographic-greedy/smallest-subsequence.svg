<rect x="254" y="58" width="32" height="32" fill="#eeeeee" stroke="#1f4e9a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="270.0" y="80" text-anchor="middle" fill="#999">a</text>
<text x="270.0" y="50" text-anchor="middle" fill="#555" font-size="12">4</text>
<rect x="290" y="58" width="32" height="32" fill="#eeeeee" stroke="#1f4e9a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="306.0" y="80" text-anchor="middle" fill="#999">b</text>
<text x="306.0" y="50" text-anchor="middle" fill="#555" font-size="12">5</text>
<rect x="143" y="55" width="38" height="38" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="346" y="72" fill="#222">a を試す：○ 位置 1（範囲内）で確定</text>
<text x="20" y="175" fill="#222" font-weight="bold">2 文字目</text>
<text x="20" y="195" fill="#555" font-size="12">位置 2〜4</text>
