<svg xmlns="http://www.w3.org/2000/svg" width="400" height="344" viewBox="0 0 400 344" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0 1)">
<text x="16" y="22" fill="#222">半開区間 [2, 9) と [5, 14) の両端点</text>
<text x="16" y="42" fill="#222">2・5・9・14 を圧縮する</text>
<rect x="100" y="68" width="154" height="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="106" y="83" fill="#1f4e9a" font-size="13">[2, 9)</text>
<rect x="166" y="98" width="198" height="20" fill="#ffe1c7" stroke="#a5501b" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="358" y="113" text-anchor="end" fill="#a5501b" font-size="13">[5, 14)</text>
<line x1="56" y1="146" x2="386" y2="146" stroke="#333" stroke-width="1.5"/>
<line x1="56" y1="140" x2="56" y2="152" stroke="#333" stroke-width="1"/>
<line x1="78" y1="140" x2="78" y2="152" stroke="#333" stroke-width="1"/>
<line x1="100" y1="132" x2="100" y2="160" stroke="#333" stroke-width="2"/>
<line x1="100" y1="64" x2="100" y2="128" stroke="#999" stroke-dasharray="2 3"/>
<text x="100" y="176" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<line x1="122" y1="140" x2="122" y2="152" stroke="#333" stroke-width="1"/>
<line x1="144" y1="140" x2="144" y2="152" stroke="#333" stroke-width="1"/>
<line x1="166" y1="132" x2="166" y2="160" stroke="#333" stroke-width="2"/>
<line x1="166" y1="64" x2="166" y2="128" stroke="#999" stroke-dasharray="2 3"/>
<text x="166" y="176" text-anchor="middle" fill="#222" font-weight="bold">5</text>
<line x1="188" y1="140" x2="188" y2="152" stroke="#333" stroke-width="1"/>
<line x1="210" y1="140" x2="210" y2="152" stroke="#333" stroke-width="1"/>
<line x1="232" y1="140" x2="232" y2="152" stroke="#333" stroke-width="1"/>
<line x1="254" y1="132" x2="254" y2="160" stroke="#333" stroke-width="2"/>
<line x1="254" y1="64" x2="254" y2="128" stroke="#999" stroke-dasharray="2 3"/>
<text x="254" y="176" text-anchor="middle" fill="#222" font-weight="bold">9</text>
<line x1="276" y1="140" x2="276" y2="152" stroke="#333" stroke-width="1"/>
<line x1="298" y1="140" x2="298" y2="152" stroke="#333" stroke-width="1"/>
<line x1="320" y1="140" x2="320" y2="152" stroke="#333" stroke-width="1"/>
<line x1="342" y1="140" x2="342" y2="152" stroke="#333" stroke-width="1"/>
<line x1="364" y1="132" x2="364" y2="160" stroke="#333" stroke-width="2"/>
<line x1="364" y1="64" x2="364" y2="128" stroke="#999" stroke-dasharray="2 3"/>
<text x="364" y="176" text-anchor="middle" fill="#222" font-weight="bold">14</text>
<line x1="386" y1="140" x2="386" y2="152" stroke="#333" stroke-width="1"/>
<text x="16" y="176" fill="#555" font-size="13">座標</text>
<text x="16" y="200" fill="#555" font-size="13">番号</text>
<text x="100" y="200" text-anchor="middle" fill="#1f4e9a">0</text>
<text x="166" y="200" text-anchor="middle" fill="#1f4e9a">1</text>
<text x="254" y="200" text-anchor="middle" fill="#1f4e9a">2</text>
<text x="364" y="200" text-anchor="middle" fill="#1f4e9a">3</text>
<text x="16" y="239" fill="#555" font-size="13">基本</text>
<text x="16" y="255" fill="#555" font-size="13">区間</text>
<rect x="102" y="220" width="62" height="28" fill="#f2f2f2" stroke="#666"/>
<text x="133" y="239" text-anchor="middle" fill="#222">j = 0</text>
<text x="133" y="268" text-anchor="middle" fill="#222" font-size="13">長さ 3</text>
<text x="133" y="286" text-anchor="middle" fill="#555" font-size="13">重なり 1</text>
<rect x="168" y="220" width="84" height="28" fill="#f2f2f2" stroke="#666"/>
<text x="210" y="239" text-anchor="middle" fill="#222">j = 1</text>
<text x="210" y="268" text-anchor="middle" fill="#222" font-size="13">長さ 4</text>
<text x="210" y="286" text-anchor="middle" fill="#555" font-size="13">重なり 2</text>
<rect x="256" y="220" width="106" height="28" fill="#f2f2f2" stroke="#666"/>
<text x="309" y="239" text-anchor="middle" fill="#222">j = 2</text>
<text x="309" y="268" text-anchor="middle" fill="#222" font-size="13">長さ 5</text>
<text x="309" y="286" text-anchor="middle" fill="#555" font-size="13">重なり 1</text>
<text x="16" y="312" fill="#222" font-size="13">覆われる長さ = 3 + 4 + 5 = 12</text>
<text x="16" y="330" fill="#222" font-size="13">（番号の差 3 − 0 = 3 で測ると誤り）</text>
</g>
</svg>
