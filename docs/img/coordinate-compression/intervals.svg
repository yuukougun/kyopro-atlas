<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" fill="#222">半開区間 [2, 9) と [5, 14) の両端点 2・5・9・14 を圧縮する</text>
<rect x="132" y="44" width="252" height="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="392" y="58" fill="#1f4e9a">[2, 9)</text>
<rect x="240" y="74" width="324" height="18" fill="#ffe1c7" stroke="#a5501b" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="572" y="88" fill="#a5501b">[5, 14)</text>
<line x1="60" y1="122" x2="600" y2="122" stroke="#333" stroke-width="1.5"/>
<line x1="60" y1="116" x2="60" y2="128" stroke="#333" stroke-width="1"/>
<line x1="96" y1="116" x2="96" y2="128" stroke="#333" stroke-width="1"/>
<line x1="132" y1="108" x2="132" y2="136" stroke="#333" stroke-width="2"/>
<text x="132" y="152" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<line x1="132" y1="40" x2="132" y2="104" stroke="#999" stroke-dasharray="2 3"/>
<line x1="168" y1="116" x2="168" y2="128" stroke="#333" stroke-width="1"/>
<line x1="204" y1="116" x2="204" y2="128" stroke="#333" stroke-width="1"/>
<line x1="240" y1="108" x2="240" y2="136" stroke="#333" stroke-width="2"/>
<text x="240" y="152" text-anchor="middle" fill="#222" font-weight="bold">5</text>
<line x1="240" y1="40" x2="240" y2="104" stroke="#999" stroke-dasharray="2 3"/>
<line x1="276" y1="116" x2="276" y2="128" stroke="#333" stroke-width="1"/>
<line x1="312" y1="116" x2="312" y2="128" stroke="#333" stroke-width="1"/>
<line x1="348" y1="116" x2="348" y2="128" stroke="#333" stroke-width="1"/>
<line x1="384" y1="108" x2="384" y2="136" stroke="#333" stroke-width="2"/>
<text x="384" y="152" text-anchor="middle" fill="#222" font-weight="bold">9</text>
<line x1="384" y1="40" x2="384" y2="104" stroke="#999" stroke-dasharray="2 3"/>
<line x1="420" y1="116" x2="420" y2="128" stroke="#333" stroke-width="1"/>
<line x1="456" y1="116" x2="456" y2="128" stroke="#333" stroke-width="1"/>
<line x1="492" y1="116" x2="492" y2="128" stroke="#333" stroke-width="1"/>
<line x1="528" y1="116" x2="528" y2="128" stroke="#333" stroke-width="1"/>
<line x1="564" y1="108" x2="564" y2="136" stroke="#333" stroke-width="2"/>
<text x="564" y="152" text-anchor="middle" fill="#222" font-weight="bold">14</text>
<line x1="564" y1="40" x2="564" y2="104" stroke="#999" stroke-dasharray="2 3"/>
<line x1="600" y1="116" x2="600" y2="128" stroke="#333" stroke-width="1"/>
<text x="20" y="152" fill="#555" font-size="12">座標</text>
<text x="20" y="176" fill="#555" font-size="12">番号</text>
<text x="132" y="176" text-anchor="middle" fill="#1f4e9a">0</text>
<text x="240" y="176" text-anchor="middle" fill="#1f4e9a">1</text>
<text x="384" y="176" text-anchor="middle" fill="#1f4e9a">2</text>
<text x="564" y="176" text-anchor="middle" fill="#1f4e9a">3</text>
<text x="20" y="214" fill="#555" font-size="12">基本区間</text>
<rect x="134" y="196" width="104" height="28" fill="#f2f2f2" stroke="#666"/>
<text x="186.0" y="215" text-anchor="middle" fill="#222">j = 0</text>
<text x="186.0" y="244" text-anchor="middle" fill="#222" font-size="12">長さ 5−2 = 3</text>
<text x="186.0" y="262" text-anchor="middle" fill="#555" font-size="12">重なり 1</text>
<rect x="242" y="196" width="140" height="28" fill="#f2f2f2" stroke="#666"/>
<text x="312.0" y="215" text-anchor="middle" fill="#222">j = 1</text>
<text x="312.0" y="244" text-anchor="middle" fill="#222" font-size="12">長さ 9−5 = 4</text>
<text x="312.0" y="262" text-anchor="middle" fill="#555" font-size="12">重なり 2</text>
<rect x="386" y="196" width="176" height="28" fill="#f2f2f2" stroke="#666"/>
<text x="474.0" y="215" text-anchor="middle" fill="#222">j = 2</text>
<text x="474.0" y="244" text-anchor="middle" fill="#222" font-size="12">長さ 14−9 = 5</text>
<text x="474.0" y="262" text-anchor="middle" fill="#555" font-size="12">重なり 1</text>
<text x="20" y="288" fill="#222" font-size="13">覆われる長さ = 3 + 4 + 5 = 12（番号の差 3 − 0 = 3 で測ると誤り）</text>
</svg>
