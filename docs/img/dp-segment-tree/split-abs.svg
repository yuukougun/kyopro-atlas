<svg width="360" height="244" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="22" fill="#222">いま町 x = 4 の市場へ向かう。</text>
<text x="12" y="42" fill="#222">前にいた町 y を左右に分ける</text>
<text x="104" y="72" text-anchor="middle" fill="#1f4e9a">y ≤ x：費用 C(x − y)</text>
<text x="104" y="90" text-anchor="middle" fill="#1f4e9a" font-size="13">max(dp[y] + C·y) − C·x</text>
<path d="M18,108 L18,98 L190,98 L190,108" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<line x1="12" y1="134" x2="348" y2="134" stroke="#333" stroke-width="1.5"/>
<circle cx="28" cy="134" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="28" y="168" text-anchor="middle" fill="#222">0</text>
<circle cx="66" cy="134" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="66" y="168" text-anchor="middle" fill="#222">1</text>
<circle cx="104" cy="134" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="104" y="168" text-anchor="middle" fill="#222">2</text>
<circle cx="142" cy="134" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="142" y="168" text-anchor="middle" fill="#222">3</text>
<rect x="167" y="121" width="26" height="26" fill="#fff3cd" stroke="#b03a2e" stroke-width="3"/>
<text x="180" y="168" text-anchor="middle" fill="#222">4</text>
<circle cx="218" cy="134" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="218" y="168" text-anchor="middle" fill="#222">5</text>
<circle cx="256" cy="134" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="256" y="168" text-anchor="middle" fill="#222">6</text>
<circle cx="294" cy="134" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="294" y="168" text-anchor="middle" fill="#222">7</text>
<circle cx="332" cy="134" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="332" y="168" text-anchor="middle" fill="#222">8</text>
<path d="M170,180 L170,190 L342,190 L342,180" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 3"/>
<text x="256" y="210" text-anchor="middle" fill="#2e7d32">y ≥ x：費用 C(y − x)</text>
<text x="256" y="228" text-anchor="middle" fill="#2e7d32" font-size="13">max(dp[y] − C·y) + C·x</text>
<text x="12" y="210" fill="#555" font-size="12">実線：左の木</text>
<text x="12" y="228" fill="#555" font-size="12">破線：右の木</text>
</svg>
