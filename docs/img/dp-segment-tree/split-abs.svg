<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" font-family="sans-serif" font-size="14">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222">いま町 x = 4 の市場へ向かう。前にいた町 y を左右に分ける</text>
<line x1="40" y1="130" x2="592" y2="130" stroke="#333" stroke-width="1.5"/>
<circle cx="60" cy="130" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="60" y="164" text-anchor="middle" fill="#222">0</text>
<circle cx="124" cy="130" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="124" y="164" text-anchor="middle" fill="#222">1</text>
<circle cx="188" cy="130" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="188" y="164" text-anchor="middle" fill="#222">2</text>
<circle cx="252" cy="130" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="252" y="164" text-anchor="middle" fill="#222">3</text>
<rect x="302" y="116" width="28" height="28" fill="#fff3cd" stroke="#b03a2e" stroke-width="3"/>
<text x="316" y="164" text-anchor="middle" fill="#222">4</text>
<circle cx="380" cy="130" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="380" y="164" text-anchor="middle" fill="#222">5</text>
<circle cx="444" cy="130" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="444" y="164" text-anchor="middle" fill="#222">6</text>
<circle cx="508" cy="130" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="508" y="164" text-anchor="middle" fill="#222">7</text>
<circle cx="572" cy="130" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="572" y="164" text-anchor="middle" fill="#222">8</text>
<path d="M50,100 L50,90 L326,90 L326,100" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<text x="188.0" y="64" text-anchor="middle" fill="#1f4e9a">y ≤ x：費用 C(x − y)</text>
<text x="188.0" y="82" text-anchor="middle" fill="#1f4e9a" font-size="13">max(dp[y] + C·y) − C·x</text>
<path d="M306,180 L306,190 L582,190 L582,180" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 3"/>
<text x="444.0" y="210" text-anchor="middle" fill="#2e7d32">y ≥ x：費用 C(y − x)</text>
<text x="444.0" y="228" text-anchor="middle" fill="#2e7d32" font-size="13">max(dp[y] − C·y) + C·x</text>
<text x="20" y="228" fill="#555" font-size="12">実線：左の木</text>
<text x="20" y="244" fill="#555" font-size="12">破線：右の木</text>
</svg>
