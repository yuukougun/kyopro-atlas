<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 542" font-family="sans-serif" font-size="15">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" fill="#222" font-size="15">best[v]：末尾の高さが v の列の美しさの和の最大</text>
<text x="20" y="44" fill="#222" font-size="15">（左から花を 1 本ずつ見る）</text>
<text x="48.0" y="74" text-anchor="middle" fill="#555" font-size="14">高さ 0</text>
<text x="104.0" y="74" text-anchor="middle" fill="#555" font-size="14">高さ 1</text>
<text x="160.0" y="74" text-anchor="middle" fill="#555" font-size="14">高さ 2</text>
<text x="216.0" y="74" text-anchor="middle" fill="#555" font-size="14">高さ 3</text>
<text x="20" y="102" fill="#222" font-weight="bold">花 0：高さ 1、美しさ 5</text>
<rect x="20" y="112" width="56" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="48.0" y="138" text-anchor="middle" fill="#222">0</text>
<rect x="76" y="112" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<rect x="79" y="115" width="50" height="34" fill="none" stroke="#b03a2e" stroke-width="3"/>
<text x="104.0" y="138" text-anchor="middle" fill="#b03a2e" font-weight="bold">5</text>
<rect x="132" y="112" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<text x="160.0" y="138" text-anchor="middle" fill="#222">0</text>
<rect x="188" y="112" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<text x="216.0" y="138" text-anchor="middle" fill="#222">0</text>
<text x="258" y="128" fill="#1f4e9a" font-size="14">[0, 1) の max = 0</text>
<text x="258" y="148" fill="#b03a2e" font-size="14">→ best[1] ← 0 + 5 = 5</text>
<text x="20" y="186" fill="#222" font-weight="bold">花 1：高さ 3、美しさ 3</text>
<rect x="20" y="196" width="56" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="48.0" y="222" text-anchor="middle" fill="#222">0</text>
<rect x="76" y="196" width="56" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="104.0" y="222" text-anchor="middle" fill="#222">5</text>
<rect x="132" y="196" width="56" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="160.0" y="222" text-anchor="middle" fill="#222">0</text>
<rect x="188" y="196" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<rect x="191" y="199" width="50" height="34" fill="none" stroke="#b03a2e" stroke-width="3"/>
<text x="216.0" y="222" text-anchor="middle" fill="#b03a2e" font-weight="bold">8</text>
<text x="258" y="212" fill="#1f4e9a" font-size="14">[0, 3) の max = 5</text>
<text x="258" y="232" fill="#b03a2e" font-size="14">→ best[3] ← 5 + 3 = 8</text>
<text x="20" y="270" fill="#222" font-weight="bold">花 2：高さ 0、美しさ 4</text>
<rect x="20" y="280" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<rect x="23" y="283" width="50" height="34" fill="none" stroke="#b03a2e" stroke-width="3"/>
<text x="48.0" y="306" text-anchor="middle" fill="#b03a2e" font-weight="bold">4</text>
<rect x="76" y="280" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<text x="104.0" y="306" text-anchor="middle" fill="#222">5</text>
<rect x="132" y="280" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<text x="160.0" y="306" text-anchor="middle" fill="#222">0</text>
<rect x="188" y="280" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<text x="216.0" y="306" text-anchor="middle" fill="#222">8</text>
<text x="258" y="296" fill="#1f4e9a" font-size="14">[0, 0) は空：e() = 0</text>
<text x="258" y="316" fill="#b03a2e" font-size="14">→ best[0] ← 0 + 4 = 4</text>
<text x="20" y="354" fill="#222" font-weight="bold">花 3：高さ 2、美しさ 6</text>
<rect x="20" y="364" width="56" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="48.0" y="390" text-anchor="middle" fill="#222">4</text>
<rect x="76" y="364" width="56" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="104.0" y="390" text-anchor="middle" fill="#222">5</text>
<rect x="132" y="364" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<rect x="135" y="367" width="50" height="34" fill="none" stroke="#b03a2e" stroke-width="3"/>
<text x="160.0" y="390" text-anchor="middle" fill="#b03a2e" font-weight="bold">11</text>
<rect x="188" y="364" width="56" height="40" fill="#ffffff" stroke="#888" stroke-width="1"/>
<text x="216.0" y="390" text-anchor="middle" fill="#222">8</text>
<text x="258" y="380" fill="#1f4e9a" font-size="14">[0, 2) の max = 5</text>
<text x="258" y="400" fill="#b03a2e" font-size="14">→ best[2] ← 5 + 6 = 11</text>
<rect x="20" y="432" width="28" height="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<text x="56" y="446" fill="#222" font-size="14">先に取得する区間（今の花より低い高さ）</text>
<rect x="20" y="460" width="28" height="18" fill="none" stroke="#b03a2e" stroke-width="3"/>
<text x="56" y="474" fill="#222" font-size="14">後で更新する 1 点（今の花の高さ）</text>
<text x="20" y="506" fill="#222" font-size="14">各段は処理の後の best。答えは全体の max = 11</text>
<text x="20" y="526" fill="#222" font-size="14">（高さ 1・2 の花を選ぶ）</text>
</svg>
