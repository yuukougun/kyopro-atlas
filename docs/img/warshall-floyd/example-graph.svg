<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
  </defs>
  <!-- 0 -> 1 (5) -->
  <line x1="106" y1="90" x2="292" y2="90" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="110" text-anchor="middle" font-size="16" fill="#333333">5</text>
  <!-- 1 -> 0 (2) -->
  <path d="M 300,72 Q 200,10 100,72" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="36" text-anchor="middle" font-size="16" fill="#333333">2</text>
  <!-- 0 -> 3 (1) -->
  <line x1="80" y1="116" x2="80" y2="208" stroke="#1f5fbf" stroke-width="4" stroke-dasharray="8 4" marker-end="url(#arrow-b)"/>
  <text x="62" y="168" text-anchor="middle" font-size="16" fill="#1f5fbf">1</text>
  <!-- 3 -> 2 (1) -->
  <line x1="106" y1="234" x2="292" y2="234" stroke="#1f5fbf" stroke-width="4" stroke-dasharray="8 4" marker-end="url(#arrow-b)"/>
  <text x="200" y="256" text-anchor="middle" font-size="16" fill="#1f5fbf">1</text>
  <!-- 2 -> 1 (1) -->
  <line x1="320" y1="208" x2="320" y2="116" stroke="#1f5fbf" stroke-width="4" stroke-dasharray="8 4" marker-end="url(#arrow-b)"/>
  <text x="338" y="168" text-anchor="middle" font-size="16" fill="#1f5fbf">1</text>
  <!-- vertices -->
  <circle cx="80" cy="90" r="24" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="80" y="96" text-anchor="middle" font-size="18" fill="#333333">0</text>
  <circle cx="320" cy="90" r="24" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="320" y="96" text-anchor="middle" font-size="18" fill="#333333">1</text>
  <circle cx="320" cy="234" r="24" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="320" y="240" text-anchor="middle" font-size="18" fill="#333333">2</text>
  <circle cx="80" cy="234" r="24" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="80" y="240" text-anchor="middle" font-size="18" fill="#333333">3</text>
  <text x="200" y="290" text-anchor="middle" font-size="13" fill="#1f5fbf">太い破線：0 → 1 の最短路 0 → 3 → 2 → 1（長さ 3）</text>
</svg>
