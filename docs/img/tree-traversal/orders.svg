<text x="372" y="200" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">4</text>
<text x="408" y="200" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">7</text>
<text x="444" y="200" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">5</text>
<text x="480" y="200" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">2</text>
<text x="516" y="200" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">6</text>
<text x="552" y="200" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">3</text>
<text x="588" y="200" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">1</text>
<text x="350" y="232" fill="#555" font-size="14">どの頂点も、その子孫がすべて並んだ後に来る</text>
<text x="350" y="280" fill="#222">BFS 順（深さの順）</text>
<text x="372" y="310" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">1</text>
<text x="408" y="310" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">2</text>
<text x="444" y="310" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">3</text>
<text x="480" y="310" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">4</text>
<text x="516" y="310" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">5</text>
<text x="552" y="310" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">6</text>
<text x="588" y="310" text-anchor="middle" fill="#1f4e9a" font-weight="bold" font-size="17">7</text>
<text x="350" y="342" fill="#555" font-size="14">親は子より前。逆から読めば子が親より前</text>
