<text x="408" y="90" text-anchor="middle" fill="#b26b00" font-weight="bold" font-size="17">2</text>
<text x="444" y="90" text-anchor="middle" fill="#b26b00" font-weight="bold" font-size="17">4</text>
<text x="480" y="90" text-anchor="middle" fill="#b26b00" font-weight="bold" font-size="17">5</text>
