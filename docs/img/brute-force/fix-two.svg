<text x="300" y="310" fill="#1f4e9a" font-size="14">実線：可</text>
<text x="300" y="330" fill="#1f4e9a" font-size="14">（c ≥ 0）</text>
<text x="300" y="362" fill="#555" font-size="14">斜線：不可</text>
<text x="300" y="382" fill="#555" font-size="14">（c &lt; 0）</text>
<line x1="20" y1="494" x2="400" y2="494" stroke="#ccc"/>
<text x="20" y="522" fill="#222" font-weight="bold">N = 2000 なら</text>
<text x="20" y="546" fill="#222">3 重ループ：2001³ ≈ 8.0 × 10⁹ 回（遅い）</text>
<text x="20" y="570" fill="#222">2 重ループ：2001² ≈ 4.0 × 10⁶ 回（速い）</text>
</svg>
