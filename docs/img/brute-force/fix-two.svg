<svg xmlns="http://www.w3.org/2000/svg" width="420" height="590" viewBox="0 0 420 590" font-family="sans-serif" font-size="16">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="30" fill="#222">a + b + c = N（N = 4、a, b, c ≥ 0）を探す</text>
<text x="20" y="66" fill="#222" font-weight="bold">3 重ループ</text>
<text x="20" y="90" fill="#222">a, b, c を 0〜4 で全部試す：125 通り</text>
<text x="20" y="112" fill="#555" font-size="14">（条件を満たすのは 15 通りだけ）</text>
<text x="20" y="148" fill="#222" font-weight="bold">2 つ決めて 3 つ目を計算</text>
<text x="20" y="172" fill="#222">a, b を決めると c = N − a − b</text>
<text x="20" y="196" fill="#222">5 × 5 = 25 通り（下の表）</text>
<text x="174.0" y="220" text-anchor="middle" fill="#222">b →</text>
<text x="26" y="366.0" text-anchor="middle" fill="#222">a ↓</text>
