<text x="368" y="319" fill="#222">x</text>
<circle cx="66" cy="314" r="6" fill="#d9534f" stroke="#7a1f1c"/>
<circle cx="138" cy="314" r="6" fill="#d9534f" stroke="#7a1f1c"/>
<circle cx="246" cy="314" r="6" fill="#d9534f" stroke="#7a1f1c"/>
<circle cx="318" cy="314" r="6" fill="#d9534f" stroke="#7a1f1c"/>
<polyline points="30,98 66,146 138,194 246,194 318,146 354,98" fill="none" stroke="#1f4e9a" stroke-width="2.5"/>
