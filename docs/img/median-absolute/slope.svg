<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="sans-serif" font-size="14">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9bbbe0" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="26" fill="#222">f(x) = |x − 1| + |x − 3| + |x − 6| + |x − 8| のグラフ</text>
<text x="30" y="46" fill="#555" font-size="12">線分の上の数は傾き ＝（x より左の点の数）−（x より右の点の数）</text>
<rect x="225" y="166" width="165" height="84" fill="url(#hatch)" stroke="none"/>
<text x="307.5" y="200" text-anchor="middle" fill="#1f4e9a" font-weight="bold">最小 10</text>
<text x="307.5" y="218" text-anchor="middle" fill="#1f4e9a" font-size="12">3 ≤ x ≤ 6 ならどこでも</text>
<line x1="50" y1="250" x2="570" y2="250" stroke="#333" stroke-width="1.5"/>
<line x1="60" y1="246" x2="60" y2="254" stroke="#333"/>
<text x="60" y="272" text-anchor="middle" fill="#222" font-size="12">0</text>
<line x1="115" y1="246" x2="115" y2="254" stroke="#333"/>
<text x="115" y="272" text-anchor="middle" fill="#222" font-size="12">1</text>
<line x1="170" y1="246" x2="170" y2="254" stroke="#333"/>
<text x="170" y="272" text-anchor="middle" fill="#222" font-size="12">2</text>
<line x1="225" y1="246" x2="225" y2="254" stroke="#333"/>
<text x="225" y="272" text-anchor="middle" fill="#222" font-size="12">3</text>
<line x1="280" y1="246" x2="280" y2="254" stroke="#333"/>
<text x="280" y="272" text-anchor="middle" fill="#222" font-size="12">4</text>
<line x1="335" y1="246" x2="335" y2="254" stroke="#333"/>
<text x="335" y="272" text-anchor="middle" fill="#222" font-size="12">5</text>
<line x1="390" y1="246" x2="390" y2="254" stroke="#333"/>
<text x="390" y="272" text-anchor="middle" fill="#222" font-size="12">6</text>
<line x1="445" y1="246" x2="445" y2="254" stroke="#333"/>
<text x="445" y="272" text-anchor="middle" fill="#222" font-size="12">7</text>
<line x1="500" y1="246" x2="500" y2="254" stroke="#333"/>
<text x="500" y="272" text-anchor="middle" fill="#222" font-size="12">8</text>
<line x1="555" y1="246" x2="555" y2="254" stroke="#333"/>
<text x="555" y="272" text-anchor="middle" fill="#222" font-size="12">9</text>
<text x="577" y="255" fill="#222">x</text>
<circle cx="115" cy="250" r="6" fill="#d9534f" stroke="#7a1f1c"/>
<circle cx="225" cy="250" r="6" fill="#d9534f" stroke="#7a1f1c"/>
<circle cx="390" cy="250" r="6" fill="#d9534f" stroke="#7a1f1c"/>
<circle cx="500" cy="250" r="6" fill="#d9534f" stroke="#7a1f1c"/>
<text x="30" y="300" fill="#222" font-size="12">● は点 a_i（1・3・6・8）。点を 1 つ右へ越えるたびに傾きは 2 増える</text>
<polyline points="60,106 115,138 225,170 390,170 500,138 555,106" fill="none" stroke="#1f4e9a" stroke-width="2.5"/>
<circle cx="60" cy="106" r="3" fill="#1f4e9a"/>
<text x="60" y="98" text-anchor="middle" fill="#555" font-size="11">18</text>
<circle cx="115" cy="138" r="3" fill="#1f4e9a"/>
<text x="115" y="130" text-anchor="middle" fill="#555" font-size="11">14</text>
<circle cx="225" cy="170" r="3" fill="#1f4e9a"/>
<text x="225" y="162" text-anchor="middle" fill="#555" font-size="11">10</text>
<circle cx="390" cy="170" r="3" fill="#1f4e9a"/>
<text x="390" y="162" text-anchor="middle" fill="#555" font-size="11">10</text>
<circle cx="500" cy="138" r="3" fill="#1f4e9a"/>
<text x="500" y="130" text-anchor="middle" fill="#555" font-size="11">14</text>
<circle cx="555" cy="106" r="3" fill="#1f4e9a"/>
<text x="555" y="98" text-anchor="middle" fill="#555" font-size="11">18</text>
<text x="101.5" y="112.0" text-anchor="middle" fill="#222" font-weight="bold">−4</text>
<text x="184.0" y="144.0" text-anchor="middle" fill="#222" font-weight="bold">−2</text>
<text x="307.5" y="158.0" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<text x="431.0" y="144.0" text-anchor="middle" fill="#222" font-weight="bold">+2</text>
<text x="513.5" y="112.0" text-anchor="middle" fill="#222" font-weight="bold">+4</text>
<text x="30" y="322" fill="#222" font-size="12">傾きが負から 0 以上に変わる所（中央値）で f は最小になる</text>
</svg>
