<svg xmlns="http://www.w3.org/2000/svg" width="400" height="424" viewBox="0 0 400 424" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0 1)">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9bbbe0" stroke-width="2"/></pattern></defs>
<text x="16" y="22" fill="#222">f(x) = |x − 1| + |x − 3| + |x − 6| + |x − 8|</text>
<text x="16" y="44" fill="#555">線分の上の数は傾き</text>
<text x="16" y="64" fill="#555">＝（x より左の点の数）−（x より右の点の数）</text>
<rect x="138" y="194" width="108" height="120" fill="url(#hatch)" stroke="none"/>
<text x="192" y="234" text-anchor="middle" fill="#1f4e9a" font-weight="bold">最小 10</text>
<text x="192" y="256" text-anchor="middle" fill="#1f4e9a" font-size="13">3 ≤ x ≤ 6 なら</text>
<text x="192" y="274" text-anchor="middle" fill="#1f4e9a" font-size="13">どこでも</text>
<line x1="22" y1="314" x2="364" y2="314" stroke="#333" stroke-width="1.5"/>
