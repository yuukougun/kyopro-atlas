<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 406" font-family="sans-serif" font-size="14">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="24" fill="#222">右端の小さい順に見て、最後に選んだ右端 last 以上から始まる区間を選ぶ</text>
<text x="20" y="44" fill="#555" font-size="12">区間は半開区間 [l, r)（マス l 〜 r − 1 を占める）。網かけの列は、選んだ区間の右端の直前のマス（点）</text>
