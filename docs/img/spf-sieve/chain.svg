<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 276" width="400" height="276" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="276" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- 1 段目：360 → 180 → 90 → 45、2 段目：45 → 15 → 5 → 1。箱の中心 x = 50, 150, 250, 350 -->
  <g font-size="20" text-anchor="middle">
    <rect x="18" y="38" width="64" height="44" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
    <text x="50" y="67">360</text>
    <rect x="118" y="38" width="64" height="44" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
    <text x="150" y="67">180</text>
    <rect x="218" y="38" width="64" height="44" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
    <text x="250" y="67">90</text>
    <rect x="318" y="38" width="64" height="44" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
    <text x="350" y="67">45</text>
    <rect x="18" y="148" width="64" height="44" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
    <text x="50" y="177">45</text>
    <rect x="118" y="148" width="64" height="44" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
    <text x="150" y="177">15</text>
    <rect x="218" y="148" width="64" height="44" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
    <text x="250" y="177">5</text>
    <rect x="318" y="148" width="64" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="350" y="177">1</text>
  </g>
  <g stroke="#333333" stroke-width="2" marker-end="url(#arr)">
    <line x1="82" y1="60" x2="116" y2="60"/>
    <line x1="182" y1="60" x2="216" y2="60"/>
    <line x1="282" y1="60" x2="316" y2="60"/>
    <line x1="82" y1="170" x2="116" y2="170"/>
    <line x1="182" y1="170" x2="216" y2="170"/>
    <line x1="282" y1="170" x2="316" y2="170"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#333333">
    <text x="100" y="30">÷2</text>
    <text x="200" y="30">÷2</text>
    <text x="300" y="30">÷2</text>
    <text x="100" y="140">÷3</text>
    <text x="200" y="140">÷3</text>
    <text x="300" y="140">÷5</text>
  </g>
  <g font-size="16" text-anchor="middle" fill="#444444">
    <text x="50" y="104">spf = 2</text>
    <text x="150" y="104">spf = 2</text>
    <text x="250" y="104">spf = 2</text>
    <text x="350" y="104">spf = 3</text>
    <text x="50" y="214">spf = 3</text>
    <text x="150" y="214">spf = 3</text>
    <text x="250" y="214">spf = 5</text>
    <text x="350" y="214">終わり</text>
  </g>
  <g font-size="16" text-anchor="middle" fill="#111111">
    <text x="200" y="244">360 = 2³ × 3² × 5</text>
    <text x="200" y="266">割った回数 6 回 ≤ log₂ 360 ≈ 8.5</text>
  </g>
</svg>
