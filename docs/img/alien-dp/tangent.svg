<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290" font-family="sans-serif" font-size="13">
  <rect width="400" height="290" fill="#ffffff"/>
  <!-- 軸 -->
  <line x1="40" y1="250" x2="380" y2="250" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="260" x2="50" y2="20" stroke="#333" stroke-width="1.5"/>
  <text x="372" y="270" fill="#333">k</text>
  <text x="58" y="28" fill="#333">f(k)</text>
  <g fill="#333" text-anchor="middle">
    <text x="50" y="268">0</text><text x="100" y="268">1</text><text x="150" y="268">2</text>
    <text x="200" y="268">3</text><text x="250" y="268">4</text><text x="300" y="268">5</text><text x="350" y="268">6</text>
  </g>
  <!-- 凹な折れ線 f(k) -->
  <polyline points="50,250 100,178 150,130 200,98 250,82 300,74 350,74" fill="none" stroke="#1f5fa8" stroke-width="2.5"/>
  <g fill="#1f5fa8">
    <circle cx="50" cy="250" r="4"/><circle cx="100" cy="178" r="4"/><circle cx="150" cy="130" r="4"/>
    <circle cx="200" cy="98" r="4"/><circle cx="250" cy="82" r="4"/><circle cx="300" cy="74" r="4"/><circle cx="350" cy="74" r="4"/>
  </g>
  <g fill="#1f5fa8" font-size="12" text-anchor="middle">
    <text x="100" y="197">9</text><text x="150" y="150">15</text><text x="200" y="118">19</text>
    <text x="250" y="102">21</text><text x="300" y="94">22</text><text x="350" y="94">22</text>
  </g>
  <!-- 傾き 4 の直線 -->
  <line x1="50" y1="194" x2="300" y2="34" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="222" y="60" fill="#c0392b" text-anchor="end">傾き λ = 4 の直線</text>
  <!-- 切片 -->
  <circle cx="50" cy="194" r="4" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <line x1="55" y1="198" x2="108" y2="224" stroke="#c0392b" stroke-width="1"/>
  <text x="112" y="232" fill="#c0392b">切片 = max(f(k) − 4k) = 7</text>
  <!-- 接点 -->
  <circle cx="150" cy="130" r="8" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="200" cy="98" r="8" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="212" y="140" fill="#333" font-size="12">k = 2 と 3 で接する</text>
</svg>
