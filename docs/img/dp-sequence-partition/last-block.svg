<svg width="355" height="423" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 355 423" font-family="sans-serif" font-size="15">
<g transform="translate(3 3)">
<rect x="-3" y="-3" width="355" height="423" fill="#ffffff"/>
<text x="8" y="20" font-size="14" fill="#333">(1) 仕切りを入れる：a = (2, 1, 1, 1, 1, 2, 2, 1)、</text>
<text x="8" y="40" font-size="14" fill="#333">どの区間の和も 4 以下</text>
<rect x="50" y="58" width="34" height="34" fill="#e3f2fd" stroke="#555"/>
<text x="67" y="81" text-anchor="middle">2</text>
<rect x="84" y="58" width="34" height="34" fill="#e3f2fd" stroke="#555"/>
<text x="101" y="81" text-anchor="middle">1</text>
<rect x="118" y="58" width="34" height="34" fill="#fff3e0" stroke="#555"/>
<text x="135" y="81" text-anchor="middle">1</text>
<rect x="152" y="58" width="34" height="34" fill="#e8f5e9" stroke="#555"/>
<text x="169" y="81" text-anchor="middle">1</text>
<rect x="186" y="58" width="34" height="34" fill="#e8f5e9" stroke="#555"/>
<text x="203" y="81" text-anchor="middle">1</text>
<rect x="220" y="58" width="34" height="34" fill="#e8f5e9" stroke="#555"/>
<text x="237" y="81" text-anchor="middle">2</text>
<rect x="254" y="58" width="34" height="34" fill="#fce4ec" stroke="#555"/>
<text x="271" y="81" text-anchor="middle">2</text>
<rect x="288" y="58" width="34" height="34" fill="#fce4ec" stroke="#555"/>
<text x="305" y="81" text-anchor="middle">1</text>
<text x="50" y="110" text-anchor="middle" font-size="12" fill="#555">0</text>
<text x="84" y="110" text-anchor="middle" font-size="12" fill="#555">1</text>
<text x="118" y="110" text-anchor="middle" font-size="12" fill="#555">2</text>
<text x="152" y="110" text-anchor="middle" font-size="12" fill="#555">3</text>
<text x="186" y="110" text-anchor="middle" font-size="12" fill="#555">4</text>
<text x="220" y="110" text-anchor="middle" font-size="12" fill="#555">5</text>
<text x="254" y="110" text-anchor="middle" font-size="12" fill="#555">6</text>
<text x="288" y="110" text-anchor="middle" font-size="12" fill="#555">7</text>
<text x="322" y="110" text-anchor="middle" font-size="12" fill="#555">8</text>
<line x1="118" y1="50" x2="118" y2="100" stroke="#c62828" stroke-width="4"/>
<line x1="152" y1="50" x2="152" y2="100" stroke="#c62828" stroke-width="4"/>
<line x1="254" y1="50" x2="254" y2="100" stroke="#c62828" stroke-width="4"/>
<text x="8" y="81" font-size="13">列</text>
<text x="8" y="110" font-size="12" fill="#555">境界</text>
<text x="8" y="134" font-size="13" fill="#333">赤の太線が仕切り（境界 1〜7 に置ける）。</text>
<text x="8" y="152" font-size="13" fill="#333">区間は [0, 2)・[2, 3)・[3, 6)・[6, 8)</text>
<line x1="8" y1="170" x2="344" y2="170" stroke="#ddd"/>
<text x="8" y="190" font-size="14" fill="#333">(2) dp[6] は、最後の区間 [j, 6) の和が</text>
<text x="8" y="210" font-size="14" fill="#333">4 以下になる j の dp[j] の和</text>
<rect x="34" y="254" width="32" height="30" fill="#f5f5f5" stroke="#555"/>
<text x="50" y="273" text-anchor="middle" font-size="12">dp[0]</text>
<rect x="68" y="254" width="32" height="30" fill="#f5f5f5" stroke="#555"/>
<text x="84" y="273" text-anchor="middle" font-size="12">dp[1]</text>
<rect x="102" y="254" width="32" height="30" fill="#f5f5f5" stroke="#555"/>
<text x="118" y="273" text-anchor="middle" font-size="12">dp[2]</text>
<rect x="136" y="254" width="32" height="30" fill="#ffe082" stroke="#555"/>
<text x="152" y="273" text-anchor="middle" font-size="12">dp[3]</text>
<rect x="170" y="254" width="32" height="30" fill="#ffe082" stroke="#555"/>
<text x="186" y="273" text-anchor="middle" font-size="12">dp[4]</text>
<rect x="204" y="254" width="32" height="30" fill="#ffe082" stroke="#555"/>
<text x="220" y="273" text-anchor="middle" font-size="12">dp[5]</text>
<rect x="238" y="254" width="32" height="30" fill="#90caf9" stroke="#555"/>
<text x="254" y="273" text-anchor="middle" font-size="12">dp[6]</text>
<rect x="272" y="254" width="32" height="30" fill="#f5f5f5" stroke="#555" stroke-dasharray="4 3"/>
<text x="288" y="273" text-anchor="middle" font-size="12">dp[7]</text>
<rect x="306" y="254" width="32" height="30" fill="#f5f5f5" stroke="#555" stroke-dasharray="4 3"/>
<text x="322" y="273" text-anchor="middle" font-size="12">dp[8]</text>
<text x="8" y="273" font-size="13">表</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1565c0"/></marker></defs>
<path d="M186 252 C 206 228, 240 228, 254 252" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#ar)"/>
<path d="M136 292 L136 302 L236 302 L236 292" fill="none" stroke="#8d6e00" stroke-width="2"/>
<text x="186" y="320" text-anchor="middle" font-size="13" fill="#5d4400">遷移元 j = 3, 4, 5（黄）</text>
<text x="186" y="338" text-anchor="middle" font-size="12" fill="#5d4400">最後の区間の和 4・3・2</text>
<text x="8" y="362" font-size="12" fill="#555">j = 2 は和 5 で不可。点線はまだ求めていない</text>
<text x="8" y="388" font-size="13" fill="#333">dp[6] = dp[3] + dp[4] + dp[5] は、累積和 T を</text>
<text x="8" y="406" font-size="13" fill="#333">使えば T[6] − T[3] の 1 回の引き算で求まる</text>
</g>
</svg>
