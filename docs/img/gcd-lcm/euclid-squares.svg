<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="sans-serif">
  <rect x="0" y="0" width="600" height="330" fill="#ffffff"/>
  <!-- 寸法 -->
  <text x="320" y="28" font-size="16" text-anchor="middle" fill="#222">a = 16</text>
  <line x1="60" y1="36" x2="540" y2="36" stroke="#444" stroke-width="1"/>
  <text x="38" y="135" font-size="16" text-anchor="middle" fill="#222">b = 6</text>
  <!-- 1 段目：6×6 を 2 個（16 mod 6 = 4） -->
  <rect x="60" y="45" width="180" height="180" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/>
  <rect x="240" y="45" width="180" height="180" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="150" y="141" font-size="20" text-anchor="middle" fill="#1f4e79">6×6</text>
  <text x="330" y="141" font-size="20" text-anchor="middle" fill="#1f4e79">6×6</text>
  <!-- 2 段目：残り 4×6 から 4×4 を 1 個（6 mod 4 = 2） -->
  <rect x="420" y="45" width="120" height="120" fill="#fde9d2" stroke="#9c4f00" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="111" font-size="18" text-anchor="middle" fill="#9c4f00">4×4</text>
  <!-- 3 段目：残り 4×2 から 2×2 を 2 個（4 mod 2 = 0） -->
  <rect x="420" y="165" width="60" height="60" fill="#e3f2dc" stroke="#2e6b1f" stroke-width="2" stroke-dasharray="2 3"/>
  <rect x="480" y="165" width="60" height="60" fill="#e3f2dc" stroke="#2e6b1f" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="450" y="200" font-size="14" text-anchor="middle" fill="#2e6b1f">2×2</text>
  <text x="510" y="200" font-size="14" text-anchor="middle" fill="#2e6b1f">2×2</text>
  <!-- 外枠 -->
  <rect x="60" y="45" width="480" height="180" fill="none" stroke="#000" stroke-width="2.5"/>
  <!-- 説明 -->
  <text x="60" y="262" font-size="15" fill="#1f4e79">① 実線：16 = 2 × 6 + 4 → 6×6 を 2 個取り、4×6 が残る</text>
  <text x="60" y="287" font-size="15" fill="#9c4f00">② 破線：6 = 1 × 4 + 2 → 4×4 を 1 個取り、4×2 が残る</text>
  <text x="60" y="312" font-size="15" fill="#2e6b1f">③ 点線：4 = 2 × 2 + 0 → 2×2 で割り切れる。gcd(16, 6) = 2</text>
</svg>
