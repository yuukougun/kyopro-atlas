<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 304" width="320" height="304" font-family="sans-serif">
  <rect x="0" y="0" width="320" height="304" fill="#ffffff"/>
  <text x="176" y="26" font-size="15" text-anchor="middle" fill="#222">a = 16</text>
  <line x1="44" y1="34" x2="308" y2="34" stroke="#444" stroke-width="1"/>
  <text x="22" y="104.5" font-size="14" text-anchor="middle" fill="#222">b</text>
  <text x="22" y="120.5" font-size="14" text-anchor="middle" fill="#222">= 6</text>
  <rect x="44" y="50" width="99" height="99" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/>
  <rect x="143" y="50" width="99" height="99" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/>
  <text x="93.5" y="104.45" font-size="16" text-anchor="middle" fill="#1f4e79">6×6</text>
  <text x="192.5" y="104.45" font-size="16" text-anchor="middle" fill="#1f4e79">6×6</text>
  <rect x="242" y="50" width="66" height="66" fill="#fde9d2" stroke="#9c4f00" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="275" y="87.95" font-size="14" text-anchor="middle" fill="#9c4f00">4×4</text>
  <rect x="242" y="116" width="33" height="33" fill="#e3f2dc" stroke="#2e6b1f" stroke-width="2" stroke-dasharray="2 3"/>
  <rect x="275" y="116" width="33" height="33" fill="#e3f2dc" stroke="#2e6b1f" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="258.5" y="136.625" font-size="12" text-anchor="middle" fill="#2e6b1f">2×2</text>
  <text x="291.5" y="136.625" font-size="12" text-anchor="middle" fill="#2e6b1f">2×2</text>
  <rect x="44" y="50" width="264" height="99" fill="none" stroke="#000" stroke-width="2.5"/>
  <text x="10" y="179" font-size="14" fill="#1f4e79">① 実線：16 = 2 × 6 + 4</text>
  <text x="28" y="198" font-size="14" fill="#1f4e79">→ 6×6 を 2 個取り、4×6 が残る</text>
  <text x="10" y="225" font-size="14" fill="#9c4f00">② 破線：6 = 1 × 4 + 2</text>
  <text x="28" y="244" font-size="14" fill="#9c4f00">→ 4×4 を 1 個取り、4×2 が残る</text>
  <text x="10" y="271" font-size="14" fill="#2e6b1f">③ 点線：4 = 2 × 2 + 0</text>
  <text x="28" y="290" font-size="14" fill="#2e6b1f">→ 2×2 で割り切れる。gcd(16, 6) = 2</text>
</svg>
