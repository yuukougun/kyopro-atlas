<text x="8" y="334" fill="#555">S[k] = dp[0] + … + dp[k−1]</text>
<text x="8" y="354" fill="#555">（境界 k の下に置く）</text>
<text x="8" y="374" fill="#222">dp[7] = S[6] − S[3] = 7 − 2 = 5。</text>
<text x="8" y="394" fill="#222">区間の長さによらず 2 つの値の差で済む</text>
