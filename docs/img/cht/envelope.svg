<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" font-family="sans-serif" font-size="13">
  <rect x="0" y="0" width="400" height="280" fill="#ffffff"/>
  <!-- 軸 -->
  <line x1="40" y1="230" x2="380" y2="230" stroke="#333" stroke-width="1"/>
  <line x1="40" y1="230" x2="40" y2="10" stroke="#333" stroke-width="1"/>
  <text x="384" y="234" fill="#333">x</text>
  <text x="34" y="10" fill="#333" text-anchor="end">y</text>
  <!-- 下側の包絡線（太い帯） -->
  <polyline points="40,212 186.7,116 370,176" fill="none" stroke="#f4b183" stroke-width="10" stroke-linejoin="round"/>
  <!-- 直線 -->
  <line x1="40" y1="212" x2="342.5" y2="14" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="40" y1="122" x2="370" y2="68" stroke="#777" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="40" y1="68" x2="370" y2="176" stroke="#2e7d32" stroke-width="2"/>
  <text x="298" y="36" fill="#1f5fa8" text-anchor="end">A：y = 2x + 1</text>
  <text x="395" y="100" fill="#555" font-size="12" text-anchor="end">B：y = x/2 + 6（不要）</text>
  <text x="300" y="192" fill="#2e7d32" text-anchor="middle">C：y = −x + 9</text>
  <!-- 交点 -->
  <circle cx="186.7" cy="116" r="4" fill="#000"/>
  <circle cx="223.3" cy="92" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="186.7" y1="116" x2="186.7" y2="230" stroke="#000" stroke-dasharray="2 3"/>
  <line x1="223.3" y1="92" x2="223.3" y2="230" stroke="#000" stroke-dasharray="2 3"/>
  <text x="186.7" y="248" text-anchor="middle">8/3</text>
  <text x="223.3" y="248" text-anchor="middle">10/3</text>
  <text x="150" y="262" text-anchor="middle" font-size="12">A と C の交点</text>
  <text x="262" y="262" text-anchor="middle" font-size="12">A と B の交点</text>
  <text x="50" y="24" font-size="12">太い帯：下側の包絡線（最小値）</text>
</svg>
