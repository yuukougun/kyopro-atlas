<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" width="400" height="370" font-family="sans-serif" font-size="14">
<rect width="400" height="370" fill="#ffffff"/>
<text x="12" y="24" fill="#222" font-weight="bold">A = abcd の回転は、A + A の長さ 4 の窓</text>
<text x="12" y="44" fill="#222" font-weight="bold">（開始位置 k = 0〜3）</text>
<text x="62" y="116" text-anchor="end" fill="#222">A + A</text>
<text x="89" y="84" text-anchor="middle" font-size="13" fill="#666">0</text>
<rect x="70" y="88" width="38" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="89" y="117" text-anchor="middle" font-size="20" fill="#222">a</text>
<text x="127" y="84" text-anchor="middle" font-size="13" fill="#666">1</text>
<rect x="108" y="88" width="38" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="127" y="117" text-anchor="middle" font-size="20" fill="#222">b</text>
<text x="165" y="84" text-anchor="middle" font-size="13" fill="#666">2</text>
<rect x="146" y="88" width="38" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="165" y="117" text-anchor="middle" font-size="20" fill="#222">c</text>
<text x="203" y="84" text-anchor="middle" font-size="13" fill="#666">3</text>
<rect x="184" y="88" width="38" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="203" y="117" text-anchor="middle" font-size="20" fill="#222">d</text>
<text x="241" y="84" text-anchor="middle" font-size="13" fill="#666">4</text>
<rect x="222" y="88" width="38" height="44" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="241" y="117" text-anchor="middle" font-size="20" fill="#222">a</text>
<text x="279" y="84" text-anchor="middle" font-size="13" fill="#666">5</text>
<rect x="260" y="88" width="38" height="44" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="279" y="117" text-anchor="middle" font-size="20" fill="#222">b</text>
<text x="317" y="84" text-anchor="middle" font-size="13" fill="#666">6</text>
<rect x="298" y="88" width="38" height="44" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="317" y="117" text-anchor="middle" font-size="20" fill="#222">c</text>
<text x="355" y="84" text-anchor="middle" font-size="13" fill="#666">7</text>
<rect x="336" y="88" width="38" height="44" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="355" y="117" text-anchor="middle" font-size="20" fill="#222">d</text>
<text x="298" y="152" text-anchor="middle" font-size="13" fill="#555">（後ろ半分は A の写し）</text>
<line x1="73" y1="172" x2="219" y2="172" stroke="#1f4e9a" stroke-width="3"/>
<line x1="73" y1="165" x2="73" y2="179" stroke="#1f4e9a" stroke-width="2"/><line x1="219" y1="165" x2="219" y2="179" stroke="#1f4e9a" stroke-width="2"/>
<text x="62" y="177" text-anchor="end" fill="#222">k = 0</text>
<text x="229" y="177" fill="#1f4e9a">abcd</text>
<line x1="111" y1="212" x2="257" y2="212" stroke="#1f4e9a" stroke-width="3"/>
<line x1="111" y1="205" x2="111" y2="219" stroke="#1f4e9a" stroke-width="2"/><line x1="257" y1="205" x2="257" y2="219" stroke="#1f4e9a" stroke-width="2"/>
<text x="62" y="217" text-anchor="end" fill="#222">k = 1</text>
<text x="267" y="217" fill="#1f4e9a">bcda</text>
<line x1="149" y1="252" x2="295" y2="252" stroke="#1f4e9a" stroke-width="3"/>
<line x1="149" y1="245" x2="149" y2="259" stroke="#1f4e9a" stroke-width="2"/><line x1="295" y1="245" x2="295" y2="259" stroke="#1f4e9a" stroke-width="2"/>
<text x="62" y="257" text-anchor="end" fill="#222">k = 2</text>
<text x="305" y="257" fill="#1f4e9a">cdab</text>
<line x1="187" y1="292" x2="333" y2="292" stroke="#1f4e9a" stroke-width="3"/>
<line x1="187" y1="285" x2="187" y2="299" stroke="#1f4e9a" stroke-width="2"/><line x1="333" y1="285" x2="333" y2="299" stroke="#1f4e9a" stroke-width="2"/>
<text x="62" y="297" text-anchor="end" fill="#222">k = 3</text>
<text x="343" y="297" fill="#1f4e9a">dabc</text>
<text x="12" y="338" fill="#555">k = 4 の窓は k = 0 と同じ A になるので、</text>
<text x="12" y="358" fill="#555">開始位置は 0〜N−1 の N 通りだけ数える</text>
</svg>
