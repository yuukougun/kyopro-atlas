<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 450" width="320" height="450" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="320" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- 上段：補正の流れ -->
  <rect x="70" y="10" width="180" height="44" rx="6" fill="#eef3fb" stroke="#3b6db3"/>
  <text x="160" y="30" text-anchor="middle">r ← sqrtl(N)</text>
  <text x="160" y="47" text-anchor="middle" font-size="12">（±1 ずれうる近い値）</text>
  <line x1="160" y1="54" x2="160" y2="72" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="70" y="74" width="180" height="44" rx="6" fill="#fdf0e6" stroke="#c06a1f" stroke-dasharray="5 3"/>
  <text x="160" y="94" text-anchor="middle">r² &gt; N の間</text>
  <text x="160" y="111" text-anchor="middle">r を 1 減らす</text>
  <line x1="160" y1="118" x2="160" y2="136" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="70" y="138" width="180" height="44" rx="6" fill="#fdf0e6" stroke="#c06a1f" stroke-dasharray="5 3"/>
  <text x="160" y="158" text-anchor="middle">(r+1)² ≤ N の間</text>
  <text x="160" y="175" text-anchor="middle">r を 1 増やす</text>
  <line x1="160" y1="182" x2="160" y2="200" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="60" y="202" width="200" height="34" rx="6" fill="#e9f6ec" stroke="#2f8a44" stroke-width="2"/>
  <text x="160" y="224" text-anchor="middle">r² ≤ N &lt; (r+1)² で確定</text>
  <!-- 下段：数直線 -->
  <text x="10" y="266">N を平方数の間に置くと、答え r は</text>
  <text x="10" y="286">「左隣の平方数の根」になる</text>
  <line x1="10" y1="350" x2="310" y2="350" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="40" y1="342" x2="40" y2="358" stroke="#333333" stroke-width="1.5"/>
  <text x="40" y="378" text-anchor="middle">(r−1)²</text>
  <line x1="130" y1="342" x2="130" y2="358" stroke="#333333" stroke-width="1.5"/>
  <text x="130" y="378" text-anchor="middle">r²</text>
  <line x1="270" y1="342" x2="270" y2="358" stroke="#333333" stroke-width="1.5"/>
  <text x="270" y="378" text-anchor="middle">(r+1)²</text>
  <rect x="130" y="336" width="140" height="28" fill="#2f8a44" fill-opacity="0.12" stroke="none"/>
  <circle cx="225" cy="350" r="6" fill="#2f8a44"/>
  <text x="225" y="330" text-anchor="middle" font-weight="bold">N</text>
  <text x="10" y="308" font-size="12">推定が r−1 なら r² ≤ N で増やす</text>
  <text x="10" y="324" font-size="12">推定が r+1 なら (r+1)² &gt; N で減らす</text>
  <text x="10" y="406" font-size="13">この半開区間 [r², (r+1)²) に N があれば</text>
  <text x="10" y="425" font-size="13">⌊√N⌋ = r</text>
</svg>
