<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- 上段：補正の流れ -->
  <rect x="20" y="20" width="160" height="44" rx="6" fill="#eef3fb" stroke="#3b6db3"/>
  <text x="100" y="40" text-anchor="middle">r ← sqrtl(N)</text>
  <text x="100" y="57" text-anchor="middle" font-size="12">（±1 ずれうる近い値）</text>
  <line x1="180" y1="42" x2="228" y2="42" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="230" y="20" width="170" height="44" rx="6" fill="#fdf0e6" stroke="#c06a1f" stroke-dasharray="5 3"/>
  <text x="315" y="40" text-anchor="middle">r² &gt; N の間</text>
  <text x="315" y="57" text-anchor="middle">r を 1 減らす</text>
  <line x1="400" y1="42" x2="448" y2="42" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="450" y="20" width="170" height="44" rx="6" fill="#fdf0e6" stroke="#c06a1f" stroke-dasharray="5 3"/>
  <text x="535" y="40" text-anchor="middle">(r+1)² ≤ N の間</text>
  <text x="535" y="57" text-anchor="middle">r を 1 増やす</text>
  <line x1="535" y1="64" x2="535" y2="92" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="420" y="94" width="200" height="34" rx="6" fill="#e9f6ec" stroke="#2f8a44" stroke-width="2"/>
  <text x="520" y="116" text-anchor="middle">r² ≤ N &lt; (r+1)² で確定</text>
  <!-- 下段：数直線 -->
  <text x="20" y="160">N を平方数の間に置くと、答え r は「左隣の平方数の根」になる</text>
  <line x1="40" y1="220" x2="610" y2="220" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="110" y1="212" x2="110" y2="228" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="248" text-anchor="middle">(r−1)²</text>
  <line x1="280" y1="212" x2="280" y2="228" stroke="#333333" stroke-width="1.5"/>
  <text x="280" y="248" text-anchor="middle">r²</text>
  <line x1="500" y1="212" x2="500" y2="228" stroke="#333333" stroke-width="1.5"/>
  <text x="500" y="248" text-anchor="middle">(r+1)²</text>
  <rect x="280" y="206" width="220" height="28" fill="#2f8a44" fill-opacity="0.12" stroke="none"/>
  <circle cx="440" cy="220" r="6" fill="#2f8a44"/>
  <text x="440" y="200" text-anchor="middle" font-weight="bold">N</text>
  <text x="390" y="272" text-anchor="middle" font-size="13">この半開区間 [r², (r+1)²) に N があれば ⌊√N⌋ = r</text>
  <text x="195" y="200" text-anchor="middle" font-size="12">推定が r−1 なら r² ≤ N で増やす</text>
  <text x="560" y="186" text-anchor="middle" font-size="12">推定が r+1 なら</text>
  <text x="560" y="200" text-anchor="middle" font-size="12">(r+1)² &gt; N で減らす</text>
</svg>
