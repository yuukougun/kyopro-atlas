<text x="374" y="90" fill="#1f4e9a" font-size="13">青いマス（和が 7）は 6 個</text>
<text x="374" y="110" fill="#222" font-size="13">P(和が 7) = 6/36 = 1/6</text>
<text x="374" y="144" fill="#c0392b" font-size="13">破線の行（1 回目が 3）は 6 マス</text>
<text x="374" y="164" fill="#222" font-size="13">その中で和が 7 は 1 マス</text>
<text x="374" y="184" fill="#222" font-size="13">P(和が 7 | 1 回目が 3) = 1/6</text>
<text x="374" y="218" fill="#555" font-size="13">和が 2 のマスは 1 個だけ</text>
<text x="374" y="238" fill="#555" font-size="13">→ 和の 11 通りは等確率でない</text>
<text x="24" y="380" fill="#555" font-size="12">青の塗り＝和が 7、赤の破線＝条件「1 回目が 3」で絞った後の全体</text>
