<svg width="350" height="404" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 404" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="10" y="22" fill="#222">根を頂点 1 から子の頂点 3 へ移すときの、</text>
<text x="10" y="42" fill="#222">距離の総和の変化（N = 6）</text>
<text x="10" y="68" fill="#222">f(1) = 8</text>
<text x="10" y="88" fill="#222">f(3) = 8 + 4 − 2 = 10</text>
<rect x="246" y="175" width="68" height="150" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="20" y="92" width="216" height="232" rx="10" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<g stroke="#555" stroke-width="2">
<line x1="190" y1="120" x2="100" y2="205"/>
<line x1="100" y1="205" x2="50" y2="295"/>
<line x1="100" y1="205" x2="150" y2="295"/>
<line x1="280" y1="205" x2="280" y2="295"/>
</g>
<line x1="190" y1="120" x2="280" y2="205" stroke="#c0392b" stroke-width="5"/>
<circle cx="190" cy="120" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="190" y="125" text-anchor="middle" font-weight="bold" fill="#1f4e9a">1</text>
<circle cx="100" cy="205" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="100" y="210" text-anchor="middle" font-weight="bold" fill="#1f4e9a">2</text>
<circle cx="280" cy="205" r="18" stroke="#c0392b" stroke-width="2" fill="#fdecea"/>
<text x="280" y="210" text-anchor="middle" font-weight="bold" fill="#c0392b">3</text>
<circle cx="50" cy="295" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="50" y="300" text-anchor="middle" font-weight="bold" fill="#1f4e9a">4</text>
<circle cx="150" cy="295" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="150" y="300" text-anchor="middle" font-weight="bold" fill="#1f4e9a">5</text>
<circle cx="280" cy="295" r="18" stroke="#c0392b" stroke-width="2" fill="#fdecea"/>
<text x="280" y="300" text-anchor="middle" font-weight="bold" fill="#c0392b">6</text>
<text x="10" y="352" fill="#1f4e9a">実線の枠：残りの N − sz = 4 頂点が 1 遠ざかる</text>
<text x="10" y="372" fill="#c0392b">破線の枠：3 の部分木の sz = 2 頂点が 1 近づく</text>
<text x="10" y="392" fill="#555">太線の辺をまたいで根が移る</text>
</svg>
