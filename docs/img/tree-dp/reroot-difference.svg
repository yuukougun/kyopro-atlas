<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222">根を頂点 1 から子の頂点 3 へ移すときの、距離の総和の変化（N = 6）</text>
<rect x="395" y="135" width="110" height="150" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="400" y="306" fill="#c0392b">3 の部分木：sz = 2 頂点が 1 近づく</text>
<rect x="60" y="55" width="290" height="230" rx="10" fill="none" stroke="#1f4e9a" stroke-width="2"/>
<text x="64" y="306" fill="#1f4e9a">残りの N − sz = 4 頂点が 1 遠ざかる</text>
<g stroke="#555" stroke-width="2">
<line x1="320" y1="80" x2="190" y2="165"/>
<line x1="320" y1="80" x2="450" y2="165"/>
<line x1="190" y1="165" x2="120" y2="255"/>
<line x1="190" y1="165" x2="260" y2="255"/>
<line x1="450" y1="165" x2="450" y2="255"/>
</g>
<line x1="337" y1="91" x2="433" y2="154" stroke="#c0392b" stroke-width="5"/>
<g stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff">
<circle cx="320" cy="80" r="18"/>
<circle cx="190" cy="165" r="18"/>
<circle cx="120" cy="255" r="18"/>
<circle cx="260" cy="255" r="18"/>
</g>
<g stroke="#c0392b" stroke-width="2" fill="#fdecea">
<circle cx="450" cy="165" r="18"/>
<circle cx="450" cy="255" r="18"/>
</g>
<g text-anchor="middle" font-weight="bold">
<text x="320" y="85" fill="#1f4e9a">1</text>
<text x="190" y="170" fill="#1f4e9a">2</text>
<text x="120" y="260" fill="#1f4e9a">4</text>
<text x="260" y="260" fill="#1f4e9a">5</text>
<text x="450" y="170" fill="#c0392b">3</text>
<text x="450" y="260" fill="#c0392b">6</text>
</g>
<text x="400" y="60" fill="#222">f(1) = 8</text>
<text x="400" y="80" fill="#222">f(3) = 8 + 4 − 2 = 10</text>
<text x="520" y="168" fill="#555">太線の辺を</text>
<text x="520" y="188" fill="#555">またいで移る</text>
</svg>
