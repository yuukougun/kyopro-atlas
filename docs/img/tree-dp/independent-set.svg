<svg width="350" height="405" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 405" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="10" y="22" fill="#222">各頂点の横の (白, 黒)：その頂点を白・黒に</text>
<text x="10" y="42" fill="#222">塗ったときの部分木の塗り方の数</text>
<g stroke="#555" stroke-width="2">
<line x1="190" y1="90" x2="100" y2="175"/>
<line x1="190" y1="90" x2="280" y2="175"/>
<line x1="100" y1="175" x2="50" y2="265"/>
<line x1="100" y1="175" x2="150" y2="265"/>
<line x1="280" y1="175" x2="280" y2="265"/>
</g>
<circle cx="190" cy="90" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="190" y="95" text-anchor="middle" font-weight="bold" fill="#1f4e9a">1</text>
<text x="214" y="84" text-anchor="start" fill="#222">(15, 8)</text>
<circle cx="100" cy="175" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="100" y="180" text-anchor="middle" font-weight="bold" fill="#1f4e9a">2</text>
<text x="76" y="171" text-anchor="end" fill="#222">(4, 1)</text>
<circle cx="280" cy="175" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="280" y="180" text-anchor="middle" font-weight="bold" fill="#1f4e9a">3</text>
<text x="304" y="169" text-anchor="start" fill="#222">(2, 1)</text>
<circle cx="50" cy="265" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="50" y="270" text-anchor="middle" font-weight="bold" fill="#1f4e9a">4</text>
<text x="50" y="303" text-anchor="middle" fill="#222">(1, 1)</text>
<circle cx="150" cy="265" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="150" y="270" text-anchor="middle" font-weight="bold" fill="#1f4e9a">5</text>
<text x="150" y="303" text-anchor="middle" fill="#222">(1, 1)</text>
<circle cx="280" cy="265" r="18" stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff"/>
<text x="280" y="270" text-anchor="middle" font-weight="bold" fill="#1f4e9a">6</text>
<text x="280" y="303" text-anchor="middle" fill="#222">(1, 1)</text>
<text x="10" y="329" fill="#555">頂点 2：白 = (1+1)(1+1) = 4、黒 = 1·1 = 1</text>
<text x="10" y="349" fill="#555">頂点 3：白 = 1+1 = 2、黒 = 1</text>
<text x="10" y="369" fill="#555">頂点 1：白 = (4+1)(2+1) = 15、黒 = 4·2 = 8</text>
<text x="10" y="393" fill="#c0392b">答え：根の白と黒を足して 15 + 8 = 23 通り</text>
</svg>
