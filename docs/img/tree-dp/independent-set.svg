<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222">各頂点の横の (白, 黒)：その頂点を白・黒に塗ったときの部分木の塗り方の数</text>
<g stroke="#555" stroke-width="2">
<line x1="320" y1="80" x2="190" y2="165"/>
<line x1="320" y1="80" x2="450" y2="165"/>
<line x1="190" y1="165" x2="120" y2="255"/>
<line x1="190" y1="165" x2="260" y2="255"/>
<line x1="450" y1="165" x2="450" y2="255"/>
</g>
<g stroke="#1f4e9a" stroke-width="2" fill="#cfe3ff">
<circle cx="320" cy="80" r="18"/>
<circle cx="190" cy="165" r="18"/>
<circle cx="450" cy="165" r="18"/>
<circle cx="120" cy="255" r="18"/>
<circle cx="260" cy="255" r="18"/>
<circle cx="450" cy="255" r="18"/>
</g>
<g text-anchor="middle" fill="#1f4e9a" font-weight="bold">
<text x="320" y="85">1</text>
<text x="190" y="170">2</text>
<text x="450" y="170">3</text>
<text x="120" y="260">4</text>
<text x="260" y="260">5</text>
<text x="450" y="260">6</text>
</g>
<g fill="#222">
<text x="346" y="72">(15, 8)</text>
<text x="112" y="160">(4, 1)</text>
<text x="476" y="158">(2, 1)</text>
<text x="102" y="295">(1, 1)</text>
<text x="242" y="295">(1, 1)</text>
<text x="432" y="295">(1, 1)</text>
</g>
<g fill="#555" font-size="13">
<text x="20" y="325">頂点 2：白 = (1+1)(1+1) = 4、黒 = 1·1 = 1</text>
<text x="20" y="345">頂点 3：白 = 1+1 = 2、黒 = 1</text>
<text x="20" y="365">頂点 1：白 = (4+1)(2+1) = 15、黒 = 4·2 = 8</text>
</g>
<text x="20" y="390" fill="#c0392b">答え：根の白と黒を足して 15 + 8 = 23 通り</text>
</svg>
