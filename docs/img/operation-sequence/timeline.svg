<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" font-family="sans-serif">
<rect width="400" height="250" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<text x="12" y="22" font-size="13" fill="#222">前向き（問題の順）：削除の直後に答える</text>
<line x1="70" y1="70" x2="130" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="100.0" y="60" font-size="12" text-anchor="middle" fill="#222">削除 1</text>
<line x1="130" y1="170" x2="70" y2="170" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="100.0" y="188" font-size="12" text-anchor="middle" fill="#1a5fb4">追加 1</text>
<line x1="170" y1="70" x2="230" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="200.0" y="60" font-size="12" text-anchor="middle" fill="#222">削除 2</text>
<line x1="230" y1="170" x2="170" y2="170" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="200.0" y="188" font-size="12" text-anchor="middle" fill="#1a5fb4">追加 2</text>
<line x1="270" y1="70" x2="330" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="300.0" y="60" font-size="12" text-anchor="middle" fill="#222">削除 3</text>
<line x1="330" y1="170" x2="270" y2="170" stroke="#1a5fb4" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="300.0" y="188" font-size="12" text-anchor="middle" fill="#1a5fb4">追加 3</text>
<circle cx="50" cy="120" r="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="50" y="125" font-size="13" text-anchor="middle" fill="#222">S0</text>
<circle cx="150" cy="120" r="18" fill="#fff4d6" stroke="#333" stroke-width="2.5"/>
<text x="150" y="125" font-size="13" text-anchor="middle" fill="#222">S1</text>
<circle cx="250" cy="120" r="18" fill="#fff4d6" stroke="#333" stroke-width="2.5"/>
<text x="250" y="125" font-size="13" text-anchor="middle" fill="#222">S2</text>
<circle cx="350" cy="120" r="18" fill="#fff4d6" stroke="#333" stroke-width="2.5"/>
<text x="350" y="125" font-size="13" text-anchor="middle" fill="#222">S3</text>
<text x="50" y="98" font-size="11" text-anchor="middle" fill="#555">全部の辺</text>
<text x="350" y="98" font-size="11" text-anchor="middle" fill="#555">残る辺だけ</text>
<text x="12" y="216" font-size="13" fill="#1a5fb4">逆向き（処理の順）：S3 から始め、記録してから追加</text>
<text x="12" y="238" font-size="12" fill="#222">太い丸 S1〜S3 が答え。逆順に記録し、最後に反転</text>
</svg>
