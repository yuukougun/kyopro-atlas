<circle cx="268" cy="112" r="6" fill="#1565c0"/>
<polyline points="100,112 212,112 268,112" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="4 3"/>
<text x="20" y="140" font-size="14">取り出すと aca（S に連続しては現れない）</text>
