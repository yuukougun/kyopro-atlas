<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 476" width="580" height="476" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="580" height="476" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <text x="20" y="28" font-weight="bold">P = abab、文字は a・b の照合オートマトン</text>
  <line x1="128" y1="140" x2="172" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="150" y="132" text-anchor="middle" font-family="monospace" font-size="17" fill="#333">a</text>
  <line x1="228" y1="140" x2="272" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="250" y="132" text-anchor="middle" font-family="monospace" font-size="17" fill="#333">b</text>
  <line x1="328" y1="140" x2="372" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="350" y="132" text-anchor="middle" font-family="monospace" font-size="17" fill="#333">a</text>
  <line x1="428" y1="140" x2="472" y2="140" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="450" y="132" text-anchor="middle" font-family="monospace" font-size="17" fill="#c0392b">b</text>
  <path d="M86,117 C66,50 134,50 114,117" stroke="#333" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="100" y="64" text-anchor="middle" font-family="monospace" font-size="17">b</text>
  <path d="M186,117 C166,50 234,50 214,117" stroke="#333" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="200" y="64" text-anchor="middle" font-family="monospace" font-size="17">a</text>
  <path d="M292,167 C270,215 130,215 108,168" stroke="#333" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="200" y="214" text-anchor="middle" font-family="monospace" font-size="17">b</text>
  <path d="M392,167 C370,260 230,260 208,168" stroke="#333" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="300" y="248" text-anchor="middle" font-family="monospace" font-size="17">a</text>
  <circle cx="100" cy="140" r="28" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="100" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">0</text>
  <text x="100" y="156" text-anchor="middle" font-family="monospace" font-size="16" fill="#000">""</text>
  <circle cx="200" cy="140" r="28" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="200" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">1</text>
  <text x="200" y="156" text-anchor="middle" font-family="monospace" font-size="16" fill="#000">a</text>
  <circle cx="300" cy="140" r="28" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="300" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">2</text>
  <text x="300" y="156" text-anchor="middle" font-family="monospace" font-size="16" fill="#000">ab</text>
  <circle cx="400" cy="140" r="28" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="400" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">3</text>
  <text x="400" y="156" text-anchor="middle" font-family="monospace" font-size="16" fill="#000">aba</text>
  <circle cx="500" cy="140" r="28" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="500" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">4</text>
  <text x="500" y="156" text-anchor="middle" font-family="monospace" font-size="16" fill="#c0392b">abab</text>
  <text x="500" y="190" text-anchor="middle" font-size="16" fill="#c0392b">含んだ：捨てる</text>
  <line x1="20" y1="290" x2="560" y2="290" stroke="#bbb"/>
  <text x="20" y="314" font-size="16">dp[i][j]：長さ i で状態が j の文字列の数（abab を含まないもの）</text>
  <text x="20" y="344" font-size="16" fill="#555">j =</text>
  <text x="100" y="344" text-anchor="middle" font-size="16" fill="#555">0</text>
  <text x="200" y="344" text-anchor="middle" font-size="16" fill="#555">1</text>
  <text x="300" y="344" text-anchor="middle" font-size="16" fill="#555">2</text>
  <text x="400" y="344" text-anchor="middle" font-size="16" fill="#555">3</text>
  <text x="510" y="344" text-anchor="middle" font-size="16" fill="#555">和</text>
  <line x1="20" y1="352" x2="560" y2="352" stroke="#ddd"/>
  <line x1="455" y1="326" x2="455" y2="410" stroke="#bbb"/>
  <text x="20" y="376" font-size="16">i = 3</text>
  <text x="100" y="376" text-anchor="middle">2</text>
  <text x="200" y="376" text-anchor="middle">3</text>
  <text x="300" y="376" text-anchor="middle">2</text>
  <text x="400" y="376" text-anchor="middle">1</text>
  <text x="510" y="376" text-anchor="middle">8</text>
  <text x="20" y="404" font-size="16">i = 4</text>
  <text x="100" y="404" text-anchor="middle">4</text>
  <text x="200" y="404" text-anchor="middle">6</text>
  <text x="300" y="404" text-anchor="middle">3</text>
  <text x="400" y="404" text-anchor="middle">2</text>
  <text x="510" y="404" text-anchor="middle">15</text>
  <text x="20" y="438" font-size="16" fill="#333">例：dp[4][1] = dp[3][0] + dp[3][1] + dp[3][3]</text>
  <text x="20" y="462" font-size="16" fill="#333">　　= 2 + 3 + 1（a の辺で状態 1 に入る）</text>
</svg>
