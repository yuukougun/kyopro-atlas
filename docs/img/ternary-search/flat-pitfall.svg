<text x="310.0" y="252.0" text-anchor="middle" fill="#222" font-size="12">f(m1) = f(m2) = 5 のとき「(m2, r] を捨てる」と書くと、最小の x = 8 を含む斜線部を捨ててしまう</text>
<text x="310.0" y="270.0" text-anchor="middle" fill="#222" font-size="12">差分は 0, 0, …, 0, −2, −2, +2 で単調でなく、差分の二分探索も同じ理由で失敗する</text>
