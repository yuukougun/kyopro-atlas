<svg viewBox="0 0 300 605" width="300" height="605" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
