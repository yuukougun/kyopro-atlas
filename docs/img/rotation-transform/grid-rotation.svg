<path d="M 144 290 L 144 322" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<text x="156" y="312" fill="#222" font-size="13">時計回り</text>
<text x="12" y="572" fill="#222" font-size="13">a：(0, 0) → (0, 2)、b：(0, 1) → (1, 2)。</text>
<text x="12" y="592" fill="#222" font-size="13">元の左の列 g・d・a が上の行に移る</text>
