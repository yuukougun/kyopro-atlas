<text x="464.0" y="212.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">f</text>
<text x="464.0" y="232" text-anchor="middle" fill="#666" font-size="10">(2,1)</text>
<rect x="492" y="182" width="56" height="56" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="520.0" y="212.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">c</text>
<text x="520.0" y="232" text-anchor="middle" fill="#666" font-size="10">(2,2)</text>
