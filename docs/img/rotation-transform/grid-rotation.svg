<text x="464.0" y="156.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">e</text>
<text x="464.0" y="176" text-anchor="middle" fill="#666" font-size="10">(1,1)</text>
<rect x="492" y="126" width="56" height="56" fill="#ffe2b8" stroke="#333" stroke-width="1.5"/>
<text x="520.0" y="156.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">b</text>
