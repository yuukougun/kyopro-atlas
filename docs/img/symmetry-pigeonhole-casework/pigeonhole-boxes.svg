<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 301" width="400" height="301" font-family="sans-serif">
<g transform="translate(0 1)">
<rect x="0" y="-1" width="400" height="301" fill="#ffffff"/>
<text x="16" y="22" font-size="14" fill="#222">余り 0, 1, 2（M = 3 個の箱）に、7, 77, 777, 7777</text>
<text x="16" y="42" font-size="14" fill="#222">を 3 で割った余りを入れる</text>
<path d="M24,84 L24,210 L124,210 L124,84" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="74" y="234" font-size="14" text-anchor="middle" fill="#222">余り 0</text>
<circle cx="74" cy="184" r="23" fill="#e6e6e6" stroke="#555"/>
<text x="74" y="189" font-size="13" text-anchor="middle" fill="#111">777</text>
<path d="M152,84 L152,210 L252,210 L252,84" fill="none" stroke="#333" stroke-width="3"/>
<text x="202" y="234" font-size="14" text-anchor="middle" fill="#222">余り 1</text>
<circle cx="202" cy="184" r="23" fill="#f3c98b" stroke="#555"/>
<text x="202" y="189" font-size="13" text-anchor="middle" fill="#111">7</text>
<circle cx="202" cy="134" r="23" fill="#f3c98b" stroke="#555"/>
<text x="202" y="139" font-size="13" text-anchor="middle" fill="#111">7777</text>
<text x="202" y="76" font-size="14" text-anchor="middle" fill="#a0460a">2 個（一致）</text>
<path d="M280,84 L280,210 L380,210 L380,84" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="330" y="234" font-size="14" text-anchor="middle" fill="#222">余り 2</text>
<circle cx="330" cy="184" r="23" fill="#e6e6e6" stroke="#555"/>
<text x="330" y="189" font-size="13" text-anchor="middle" fill="#111">77</text>
<text x="16" y="264" font-size="13" fill="#444">玉が 4 個（M + 1 個）なら、どう入れても 2 個入る</text>
<text x="16" y="284" font-size="13" fill="#444">箱が必ずある（太線の箱）</text>
</g>
</svg>
