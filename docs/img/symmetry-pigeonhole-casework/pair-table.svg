<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 482" width="320" height="482" font-family="sans-serif">
<defs><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="2"/></pattern></defs>
<rect width="320" height="482" fill="#ffffff"/>
<text x="16" y="22" font-size="14" fill="#222">N = 4 の積 a_i a_j の表</text>
<text x="16" y="42" font-size="14" fill="#222">（全体の和 = (a_0 + a_1 + a_2 + a_3)^2）</text>
<text x="86" y="80" font-size="13" text-anchor="middle" fill="#333">j = 0</text>
<text x="50" y="121" font-size="13" text-anchor="end" fill="#333">i = 0</text>
<text x="138" y="80" font-size="13" text-anchor="middle" fill="#333">j = 1</text>
<text x="50" y="173" font-size="13" text-anchor="end" fill="#333">i = 1</text>
<text x="190" y="80" font-size="13" text-anchor="middle" fill="#333">j = 2</text>
<text x="50" y="225" font-size="13" text-anchor="end" fill="#333">i = 2</text>
<text x="242" y="80" font-size="13" text-anchor="middle" fill="#333">j = 3</text>
<text x="50" y="277" font-size="13" text-anchor="end" fill="#333">i = 3</text>
<rect x="60" y="90" width="52" height="52" fill="url(#h)" stroke="#555" stroke-width="1"/>
<text x="86" y="121" font-size="12" text-anchor="middle" fill="#111">a0a0</text>
<rect x="112" y="90" width="52" height="52" fill="#9ec1ec" stroke="#555" stroke-width="1"/>
<text x="138" y="121" font-size="12" text-anchor="middle" fill="#111">a0a1</text>
<rect x="164" y="90" width="52" height="52" fill="#9ec1ec" stroke="#555" stroke-width="1"/>
<text x="190" y="121" font-size="12" text-anchor="middle" fill="#111">a0a2</text>
<rect x="216" y="90" width="52" height="52" fill="#9ec1ec" stroke="#555" stroke-width="1"/>
<text x="242" y="121" font-size="12" text-anchor="middle" fill="#111">a0a3</text>
<rect x="60" y="142" width="52" height="52" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="86" y="173" font-size="12" text-anchor="middle" fill="#111">a1a0</text>
<rect x="112" y="142" width="52" height="52" fill="url(#h)" stroke="#555" stroke-width="1"/>
<text x="138" y="173" font-size="12" text-anchor="middle" fill="#111">a1a1</text>
<rect x="164" y="142" width="52" height="52" fill="#9ec1ec" stroke="#555" stroke-width="1"/>
<text x="190" y="173" font-size="12" text-anchor="middle" fill="#111">a1a2</text>
<rect x="216" y="142" width="52" height="52" fill="#9ec1ec" stroke="#555" stroke-width="1"/>
<text x="242" y="173" font-size="12" text-anchor="middle" fill="#111">a1a3</text>
<rect x="60" y="194" width="52" height="52" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="86" y="225" font-size="12" text-anchor="middle" fill="#111">a2a0</text>
<rect x="112" y="194" width="52" height="52" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="138" y="225" font-size="12" text-anchor="middle" fill="#111">a2a1</text>
<rect x="164" y="194" width="52" height="52" fill="url(#h)" stroke="#555" stroke-width="1"/>
<text x="190" y="225" font-size="12" text-anchor="middle" fill="#111">a2a2</text>
<rect x="216" y="194" width="52" height="52" fill="#9ec1ec" stroke="#555" stroke-width="1"/>
<text x="242" y="225" font-size="12" text-anchor="middle" fill="#111">a2a3</text>
<rect x="60" y="246" width="52" height="52" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="86" y="277" font-size="12" text-anchor="middle" fill="#111">a3a0</text>
<rect x="112" y="246" width="52" height="52" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="138" y="277" font-size="12" text-anchor="middle" fill="#111">a3a1</text>
<rect x="164" y="246" width="52" height="52" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="190" y="277" font-size="12" text-anchor="middle" fill="#111">a3a2</text>
<rect x="216" y="246" width="52" height="52" fill="url(#h)" stroke="#555" stroke-width="1"/>
<text x="242" y="277" font-size="12" text-anchor="middle" fill="#111">a3a3</text>
<rect x="16" y="318" width="22" height="22" fill="#9ec1ec" stroke="#555"/>
<text x="46" y="334" font-size="13" fill="#222">求める i &lt; j の部分（6 マス）</text>
<rect x="16" y="350" width="22" height="22" fill="#ffffff" stroke="#555"/>
<text x="46" y="366" font-size="13" fill="#222">i &gt; j の部分：転置すると同じ値</text>
<rect x="16" y="382" width="22" height="22" fill="url(#h)" stroke="#555"/>
<text x="46" y="398" font-size="13" fill="#222">対角 i = j：a_i^2 の和</text>
<text x="16" y="428" font-size="13" fill="#222">i &lt; j の和 =（全体 − 対角）÷ 2</text>
<text x="16" y="452" font-size="13" fill="#444">上の三角と下の三角は対角について対称なので</text>
<text x="16" y="470" font-size="13" fill="#444">値の和が等しい</text>
</svg>
