<text x="342" y="97" font-size="13" fill="#222">求める i &lt; j の部分（6 マス）</text>
<rect x="308" y="120" width="24" height="24" fill="#ffffff" stroke="#555"/>
<text x="342" y="137" font-size="13" fill="#222">i &gt; j の部分：転置すると同じ値</text>
<rect x="308" y="160" width="24" height="24" fill="url(#h)" stroke="#555"/>
<text x="342" y="177" font-size="13" fill="#222">対角 i = j：a_i^2 の和</text>
<text x="308" y="220" font-size="13" fill="#222">i &lt; j の和 =（全体 − 対角）÷ 2</text>
<text x="20" y="310" font-size="12" fill="#444">上の三角と下の三角は対角について対称なので値の和が等しい</text>
