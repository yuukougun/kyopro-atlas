<text x="252.0" y="153.0" font-size="12" text-anchor="middle" fill="#111">a1a3</text>
<rect x="70" y="174" width="52" height="52" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="96.0" y="205.0" font-size="12" text-anchor="middle" fill="#111">a2a0</text>
<rect x="122" y="174" width="52" height="52" fill="#ffffff" stroke="#555" stroke-width="1"/>
<text x="148.0" y="205.0" font-size="12" text-anchor="middle" fill="#111">a2a1</text>
