<text x="184" y="114" fill="#c0392b" text-anchor="end">③ 答え</text>
<text x="12" y="450" fill="#222">① 11 は 9 より 1 深いので、1 個上げて 8 にする</text>
<text x="12" y="480" fill="#222">② u = 8、v = 9 から、k を上の段から試す</text>
<text x="20" y="518" fill="#222" font-size="14">k</text>
<text x="52" y="518" fill="#222" font-size="14">u</text>
<text x="84" y="518" fill="#222" font-size="14">v</text>
<text x="122" y="518" fill="#222" font-size="14">up[k][u]</text>
<text x="218" y="518" fill="#222" font-size="14">up[k][v]</text>
<text x="312" y="518" fill="#222" font-size="14">判定</text>
<line x1="12" y1="526" x2="448" y2="526" stroke="#999"/>
<text x="20" y="552" fill="#222">3</text>
<text x="52" y="552" fill="#222">8</text>
<text x="84" y="552" fill="#222">9</text>
<text x="122" y="552" fill="#222">0</text>
<text x="218" y="552" fill="#222">0</text>
<text x="312" y="552" fill="#222">同じ→跳ばない</text>
<text x="20" y="582" fill="#222">2</text>
<text x="52" y="582" fill="#222">8</text>
<text x="84" y="582" fill="#222">9</text>
<text x="122" y="582" fill="#222">0</text>
<text x="218" y="582" fill="#222">0</text>
<text x="312" y="582" fill="#222">同じ→跳ばない</text>
<rect x="12" y="592" width="436" height="28" fill="#dbe7f7"/>
<text x="20" y="612" fill="#222" font-weight="bold">1</text>
<text x="52" y="612" fill="#222" font-weight="bold">8</text>
<text x="84" y="612" fill="#222" font-weight="bold">9</text>
<text x="122" y="612" fill="#222" font-weight="bold">3</text>
<text x="218" y="612" fill="#222" font-weight="bold">4</text>
<text x="312" y="612" fill="#222" font-weight="bold">違う→跳ぶ</text>
<text x="20" y="642" fill="#222">0</text>
<text x="52" y="642" fill="#222">3</text>
<text x="84" y="642" fill="#222">4</text>
<text x="122" y="642" fill="#222">1</text>
<text x="218" y="642" fill="#222">1</text>
<text x="312" y="642" fill="#222">同じ→跳ばない</text>
<text x="12" y="690" fill="#222">③ 最後の u = 3、v = 4 は LCA の 1 つ下にいる。</text>
<text x="12" y="716" fill="#c0392b">答えは 3 の親の 1（lca(11, 9) = 1）</text>
<text x="12" y="752" fill="#555" font-size="14">根より上を指す跳躍は根 0 に止まる（根の親を根自身にする）。</text>
<text x="12" y="774" fill="#555" font-size="14">太い矢印：跳んだ。破線：深さをそろえた。</text>
</svg>
