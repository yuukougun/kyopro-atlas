<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 330" width="510" height="330" font-family="sans-serif" font-size="14">
<rect x="0" y="0" width="510" height="330" fill="#ffffff"/>
<!-- 辺 -->
<line x1="160" y1="50" x2="85" y2="135" stroke="#999" stroke-width="1.5"/>
<line x1="160" y1="50" x2="235" y2="135" stroke="#1f5fbf" stroke-width="5"/>
<line x1="85" y1="135" x2="45" y2="225" stroke="#999" stroke-width="1.5"/>
<line x1="85" y1="135" x2="125" y2="225" stroke="#999" stroke-width="1.5"/>
<line x1="235" y1="135" x2="195" y2="225" stroke="#1f5fbf" stroke-width="5"/>
<line x1="235" y1="135" x2="275" y2="225" stroke="#999" stroke-width="1.5" stroke-dasharray="2 4"/>
<!-- 頂点：パス上（太い実線・塗り） -->
<circle cx="160" cy="50" r="20" fill="#dbe8fb" stroke="#1f5fbf" stroke-width="3"/>
<text x="160" y="55" text-anchor="middle" fill="#000">1</text>
<text x="190" y="40" fill="#333">色 A</text>
<circle cx="235" cy="135" r="20" fill="#dbe8fb" stroke="#1f5fbf" stroke-width="3"/>
<text x="235" y="140" text-anchor="middle" fill="#000">3</text>
<text x="263" y="125" fill="#333">色 B</text>
<circle cx="195" cy="225" r="20" fill="#dbe8fb" stroke="#1f5fbf" stroke-width="3"/>
<text x="195" y="230" text-anchor="middle" fill="#000">6</text>
<text x="225" y="250" fill="#333">色 A</text>
<text x="195" y="285" text-anchor="middle" fill="#1f5fbf" font-weight="bold">今の頂点</text>
<!-- 頂点：もう出た（破線） -->
<circle cx="85" cy="135" r="20" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="85" y="140" text-anchor="middle" fill="#555">2</text>
<text x="40" y="125" text-anchor="end" fill="#555">色 B</text>
<circle cx="45" cy="225" r="20" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="45" y="230" text-anchor="middle" fill="#555">4</text>
<text x="45" y="265" text-anchor="middle" fill="#555">色 A</text>
<circle cx="125" cy="225" r="20" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="125" y="230" text-anchor="middle" fill="#555">5</text>
<text x="125" y="265" text-anchor="middle" fill="#555">色 C</text>
<!-- 頂点：まだ（点線） -->
<circle cx="275" cy="225" r="20" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="275" y="230" text-anchor="middle" fill="#999">7</text>
<text x="275" y="265" text-anchor="middle" fill="#999">色 C</text>
<!-- 凡例 -->
<circle cx="30" cy="308" r="7" fill="#dbe8fb" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="42" y="313" fill="#333">スタックにある</text>
<circle cx="170" cy="308" r="7" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="182" y="313" fill="#333">出た</text>
<circle cx="240" cy="308" r="7" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="252" y="313" fill="#333">まだ</text>
<!-- 右：スタック -->
<text x="330" y="30" fill="#000" font-weight="bold">DFS のスタック（下が根）</text>
<rect x="340" y="110" width="80" height="30" fill="#dbe8fb" stroke="#1f5fbf" stroke-width="2"/>
<text x="380" y="130" text-anchor="middle">6</text>
<rect x="340" y="140" width="80" height="30" fill="#dbe8fb" stroke="#1f5fbf" stroke-width="2"/>
<text x="380" y="160" text-anchor="middle">3</text>
<rect x="340" y="170" width="80" height="30" fill="#dbe8fb" stroke="#1f5fbf" stroke-width="2"/>
<text x="380" y="190" text-anchor="middle">1</text>
<text x="430" y="130" fill="#333">← 今</text>
<text x="330" y="225" fill="#333">＝ 根から 6 へのパス</text>
<!-- 右：出現回数（上が色、下が回数） -->
<text x="330" y="282" fill="#000" font-weight="bold">cnt</text>
<rect x="370" y="250" width="40" height="28" fill="#f4f4f4" stroke="#555"/>
<text x="390" y="269" text-anchor="middle">A</text>
<rect x="370" y="278" width="40" height="28" fill="#ffffff" stroke="#555"/>
<text x="390" y="297" text-anchor="middle">2</text>
<rect x="410" y="250" width="40" height="28" fill="#f4f4f4" stroke="#555"/>
<text x="430" y="269" text-anchor="middle">B</text>
<rect x="410" y="278" width="40" height="28" fill="#ffffff" stroke="#555"/>
<text x="430" y="297" text-anchor="middle">1</text>
<rect x="450" y="250" width="40" height="28" fill="#f4f4f4" stroke="#555"/>
<text x="470" y="269" text-anchor="middle">C</text>
<rect x="450" y="278" width="40" height="28" fill="#ffffff" stroke="#555"/>
<text x="470" y="297" text-anchor="middle">0</text>
</svg>
