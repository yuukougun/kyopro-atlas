<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 406" width="320" height="406" font-family="sans-serif" font-size="15">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="10" y="24" fill="#222" font-size="14">試し割り：i = 2, 3, … の順に、n を割れるだけ</text>
<text x="10" y="44" fill="#222" font-size="14">割る（i² &gt; n になったら止める）</text>
<rect x="16" y="96" width="74" height="42" rx="6" fill="#dbe8fb" stroke="#1f4e9a" stroke-width="2"/>
<text x="53.0" y="123" text-anchor="middle" fill="#222" font-size="17">360</text>
<rect x="123" y="96" width="74" height="42" rx="6" fill="#dbe8fb" stroke="#1f4e9a" stroke-width="2"/>
<text x="160.0" y="123" text-anchor="middle" fill="#222" font-size="17">180</text>
<rect x="230" y="96" width="74" height="42" rx="6" fill="#dbe8fb" stroke="#1f4e9a" stroke-width="2"/>
<text x="267.0" y="123" text-anchor="middle" fill="#222" font-size="17">90</text>
<line x1="92" y1="117.0" x2="121" y2="117.0" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="106.5" y="88" text-anchor="middle" fill="#222" font-size="14">÷2</text>
<text x="106.5" y="70" text-anchor="middle" fill="#555" font-size="13">i = 2</text>
<line x1="199" y1="117.0" x2="228" y2="117.0" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="213.5" y="88" text-anchor="middle" fill="#222" font-size="14">÷2</text>
<text x="213.5" y="70" text-anchor="middle" fill="#555" font-size="13">i = 2</text>
<polyline points="267.0,140 267.0,162 53.0,162 53.0,223" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="160.0" y="180" text-anchor="middle" fill="#222" font-size="14">÷2（i = 2）</text>
<rect x="16" y="226" width="74" height="42" rx="6" fill="#dbe8fb" stroke="#1f4e9a" stroke-width="2"/>
<text x="53.0" y="253" text-anchor="middle" fill="#222" font-size="17">45</text>
<rect x="123" y="226" width="74" height="42" rx="6" fill="#dbe8fb" stroke="#1f4e9a" stroke-width="2"/>
<text x="160.0" y="253" text-anchor="middle" fill="#222" font-size="17">15</text>
<rect x="230" y="226" width="74" height="42" rx="6" fill="#fbe9d9" stroke="#9a4a1f" stroke-width="2"/>
<text x="267.0" y="253" text-anchor="middle" fill="#222" font-size="17">5</text>
<line x1="92" y1="247.0" x2="121" y2="247.0" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="106.5" y="218" text-anchor="middle" fill="#222" font-size="14">÷3</text>
<text x="106.5" y="200" text-anchor="middle" fill="#555" font-size="13">i = 3</text>
<line x1="199" y1="247.0" x2="228" y2="247.0" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="213.5" y="218" text-anchor="middle" fill="#222" font-size="14">÷3</text>
<text x="213.5" y="200" text-anchor="middle" fill="#555" font-size="13">i = 3</text>
<text x="267.0" y="286" text-anchor="middle" fill="#9a4a1f" font-size="13">残り（素数）</text>
<text x="10" y="320" fill="#9a4a1f" font-size="14">i = 4 で 4² = 16 &gt; 5 なので止める</text>
<text x="10" y="344" fill="#222" font-size="14">止めた時点の残り 5 は 1 より大きいので、</text>
<text x="10" y="364" fill="#222" font-size="14">素数として加える</text>
<text x="10" y="392" fill="#222" font-weight="bold">360 = 2³ × 3² × 5</text>
</svg>
