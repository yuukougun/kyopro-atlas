<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="210" fill="#ffffff"/>
  <text x="10" y="22" font-size="13" fill="#222">並びの一部（P は V の親）</text>
  <!-- before -->
  <rect x="20" y="36" width="70" height="36" fill="#dbe8f7" stroke="#2b5d9b" stroke-width="2"/>
  <text x="55" y="59" font-size="14" text-anchor="middle" fill="#222">P</text>
  <rect x="90" y="36" width="90" height="36" fill="#f2f2f2" stroke="#555" stroke-dasharray="5,3"/>
  <text x="135" y="59" font-size="14" text-anchor="middle" fill="#222">Z<tspan font-size="11" dy="4">1</tspan></text>
  <rect x="180" y="36" width="110" height="36" fill="#f2f2f2" stroke="#555" stroke-dasharray="5,3"/>
  <text x="235" y="59" font-size="14" text-anchor="middle" fill="#222">Z<tspan font-size="11" dy="4">2</tspan></text>
  <rect x="290" y="36" width="80" height="36" fill="#fde3c8" stroke="#b5651d" stroke-width="3"/>
  <text x="330" y="59" font-size="14" text-anchor="middle" fill="#222">V</text>
  <text x="380" y="59" font-size="12" fill="#222">…</text>
  <!-- arrow -->
  <path d="M330 78 C 330 105, 130 100, 130 128" fill="none" stroke="#b5651d" stroke-width="2"/>
  <path d="M124 120 L130 132 L136 120 Z" fill="#b5651d"/>
  <text x="250" y="108" font-size="12" fill="#222">V を P の直後へ移す</text>
  <!-- after -->
  <rect x="20" y="134" width="70" height="36" fill="#dbe8f7" stroke="#2b5d9b" stroke-width="2"/>
  <text x="55" y="157" font-size="14" text-anchor="middle" fill="#222">P</text>
  <rect x="90" y="134" width="80" height="36" fill="#fde3c8" stroke="#b5651d" stroke-width="3"/>
  <text x="130" y="157" font-size="14" text-anchor="middle" fill="#222">V</text>
  <rect x="170" y="134" width="90" height="36" fill="#f2f2f2" stroke="#555" stroke-dasharray="5,3"/>
  <text x="215" y="157" font-size="14" text-anchor="middle" fill="#222">Z<tspan font-size="11" dy="4">1</tspan></text>
  <rect x="260" y="134" width="110" height="36" fill="#f2f2f2" stroke="#555" stroke-dasharray="5,3"/>
  <text x="315" y="157" font-size="14" text-anchor="middle" fill="#222">Z<tspan font-size="11" dy="4">2</tspan></text>
  <text x="380" y="157" font-size="12" fill="#222">…</text>
  <text x="10" y="196" font-size="12" fill="#222">変わるのは V と Z の前後だけ：費用の差は d(V)c(Z) − d(Z)c(V) ≤ 0</text>
</svg>
