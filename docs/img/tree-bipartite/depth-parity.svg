<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 522" width="400" height="522" font-family="sans-serif" font-size="15">
<rect width="400" height="522" fill="#ffffff"/>
<text x="10" y="22" fill="#222">深さの偶奇で塗った木（根は 0）</text>
<text x="10" y="42" fill="#222">白は深さが偶数、黒は奇数</text>
<text x="8" y="85" fill="#555" font-size="14">深さ 0</text>
<text x="8" y="155" fill="#555" font-size="14">深さ 1</text>
<text x="8" y="225" fill="#555" font-size="14">深さ 2</text>
<text x="8" y="295" fill="#555" font-size="14">深さ 3</text>
<line x1="58" y1="80" x2="370" y2="80" stroke="#e3e3e3" stroke-dasharray="2 4"/>
<line x1="58" y1="150" x2="370" y2="150" stroke="#e3e3e3" stroke-dasharray="2 4"/>
<line x1="58" y1="220" x2="370" y2="220" stroke="#e3e3e3" stroke-dasharray="2 4"/>
<line x1="58" y1="290" x2="370" y2="290" stroke="#e3e3e3" stroke-dasharray="2 4"/>
<g stroke="#444" stroke-width="2">
<line x1="230" y1="80" x2="130" y2="150"/>
<line x1="230" y1="80" x2="330" y2="150"/>
<line x1="130" y1="150" x2="80" y2="220"/>
<line x1="130" y1="150" x2="180" y2="220"/>
<line x1="330" y1="150" x2="330" y2="220"/>
<line x1="80" y1="220" x2="80" y2="290"/>
<line x1="330" y1="220" x2="330" y2="290"/>
</g>
<g stroke="#c0392b" stroke-width="5" stroke-dasharray="9 6" fill="none">
<line x1="80" y1="290" x2="80" y2="220"/>
<line x1="80" y1="220" x2="130" y2="150"/>
<line x1="130" y1="150" x2="180" y2="220"/>
</g>
<g stroke="#1e8449" stroke-width="7" stroke-opacity="0.75">
<line x1="330" y1="150" x2="330" y2="220"/>
<line x1="330" y1="220" x2="330" y2="290"/>
</g>
<g stroke="#333333" stroke-width="2">
<circle cx="230" cy="80" r="17" fill="#ffffff"/>
<circle cx="130" cy="150" r="17" fill="#333333"/>
<circle cx="330" cy="150" r="17" fill="#333333"/>
<circle cx="80" cy="220" r="17" fill="#ffffff"/>
<circle cx="180" cy="220" r="17" fill="#ffffff"/>
<circle cx="330" cy="220" r="17" fill="#ffffff"/>
<circle cx="80" cy="290" r="17" fill="#333333"/>
<circle cx="330" cy="290" r="17" fill="#333333"/>
</g>
<g text-anchor="middle">
<text x="230" y="85" fill="#222">0</text>
<text x="130" y="155" fill="#ffffff">1</text>
<text x="330" y="155" fill="#ffffff">2</text>
<text x="80" y="225" fill="#222">3</text>
<text x="180" y="225" fill="#222">4</text>
<text x="330" y="225" fill="#222">5</text>
<text x="80" y="295" fill="#ffffff">6</text>
<text x="330" y="295" fill="#ffffff">7</text>
</g>
<text x="360" y="230" fill="#1e8449" font-size="14">太線</text>
<text x="25" y="255" fill="#c0392b" font-size="14">破線</text>
<text x="10" y="340" fill="#c0392b" font-size="14">破線 d(6, 4) = 3（奇数）。dep 3 + dep 2 = 5</text>
<text x="10" y="360" fill="#c0392b" font-size="14">も奇数で、6 と 4 は色が違う</text>
<text x="10" y="390" fill="#1e8449" font-size="14">太線 d(2, 7) = 2（偶数）。dep 1 + dep 3 = 4</text>
<text x="10" y="410" fill="#1e8449" font-size="14">も偶数で、2 と 7 は色が同じ</text>
<text x="10" y="440" fill="#222" font-size="14">白 4 個（0・3・4・5）、黒 4 個（1・2・6・7）。</text>
<text x="10" y="460" fill="#222" font-size="14">色の違う組は 4 × 4 = 16</text>
<text x="10" y="490" fill="#222" font-size="14">そのうち 7 組は木の辺なので、二部グラフの</text>
<text x="10" y="510" fill="#222" font-size="14">まま足せる辺は 16 − 7 = 9 本</text>
</svg>
