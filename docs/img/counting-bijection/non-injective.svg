<svg xmlns="http://www.w3.org/2000/svg" width="520" height="272" viewBox="0 0 520 272" font-family="sans-serif" font-size="14.5">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<text x="24" y="26" fill="#222">赤 r₁, r₂ と白 w から、赤を含む 2 個を選ぶ</text>
<text x="100" y="58" text-anchor="middle" fill="#1f4e9a" font-weight="bold">（指定の赤, 残りの 1 個）</text>
<text x="420" y="58" text-anchor="middle" fill="#b03030" font-weight="bold">選んだ集合</text>
<rect x="40" y="73" width="120" height="26" rx="4" fill="#e8f0fb" stroke="#1f4e9a"/><text x="100" y="91" text-anchor="middle" fill="#222">(r₁, r₂)</text>
<rect x="40" y="113" width="120" height="26" rx="4" fill="#e8f0fb" stroke="#1f4e9a"/><text x="100" y="131" text-anchor="middle" fill="#222">(r₁, w)</text>
<rect x="40" y="153" width="120" height="26" rx="4" fill="#e8f0fb" stroke="#1f4e9a"/><text x="100" y="171" text-anchor="middle" fill="#222">(r₂, r₁)</text>
<rect x="40" y="193" width="120" height="26" rx="4" fill="#e8f0fb" stroke="#1f4e9a"/><text x="100" y="211" text-anchor="middle" fill="#222">(r₂, w)</text>
<rect x="370" y="73" width="100" height="26" rx="4" fill="#fbecec" stroke="#b03030" stroke-dasharray="4 2"/><text x="420" y="91" text-anchor="middle" fill="#222">{r₁, r₂}</text>
<rect x="370" y="123" width="100" height="26" rx="4" fill="#fbecec" stroke="#b03030" stroke-dasharray="4 2"/><text x="420" y="141" text-anchor="middle" fill="#222">{r₁, w}</text>
<rect x="370" y="173" width="100" height="26" rx="4" fill="#fbecec" stroke="#b03030" stroke-dasharray="4 2"/><text x="420" y="191" text-anchor="middle" fill="#222">{r₂, w}</text>
<line x1="162" y1="86" x2="367" y2="80" stroke="#b03030" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#arR)"/>
<line x1="162" y1="126" x2="364" y2="136" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="162" y1="166" x2="367" y2="93" stroke="#b03030" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#arR)"/>
<line x1="162" y1="206" x2="364" y2="186" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="260" y="240" text-anchor="middle" fill="#444" font-size="14.5">左は 2 × 2 = 4 個、右は 3 個</text>
<text x="260" y="262" text-anchor="middle" fill="#444" font-size="14.5">{r₁, r₂} に 2 本（赤の破線）が届き、2 回数えられる</text>
</svg>