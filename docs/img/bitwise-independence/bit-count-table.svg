<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="15">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="62" fill="#222">bit</text>
<text x="205.0" y="62" text-anchor="middle" fill="#222">k = 2（4）</text>
<text x="315.0" y="62" text-anchor="middle" fill="#222">k = 1（2）</text>
<text x="425.0" y="62" text-anchor="middle" fill="#222">k = 0（1）</text>
<text x="30" y="96" fill="#222">a = 3</text>
<rect x="170" y="76" width="70" height="30" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="205.0" y="97" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<rect x="280" y="76" width="70" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="315.0" y="97" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="390" y="76" width="70" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="425.0" y="97" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<text x="30" y="130" fill="#222">a = 5</text>
<rect x="170" y="110" width="70" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="205.0" y="131" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="280" y="110" width="70" height="30" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="315.0" y="131" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<rect x="390" y="110" width="70" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="425.0" y="131" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<text x="30" y="164" fill="#222">a = 6</text>
<rect x="170" y="144" width="70" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="205.0" y="165" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="280" y="144" width="70" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="315.0" y="165" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="390" y="144" width="70" height="30" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="425.0" y="165" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<line x1="20" y1="184" x2="480" y2="184" stroke="#888"/>
<text x="30" y="212" fill="#222">1 の個数</text>
<text x="205.0" y="212" text-anchor="middle" fill="#222">2</text>
<text x="315.0" y="212" text-anchor="middle" fill="#222">2</text>
<text x="425.0" y="212" text-anchor="middle" fill="#222">2</text>
<text x="30" y="242" fill="#222">0 の個数</text>
<text x="205.0" y="242" text-anchor="middle" fill="#222">1</text>
<text x="315.0" y="242" text-anchor="middle" fill="#222">1</text>
<text x="425.0" y="242" text-anchor="middle" fill="#222">1</text>
<text x="30" y="272" fill="#222">1 × 0 × 2^k</text>
<text x="205.0" y="272" text-anchor="middle" fill="#222">2×1×4 = 8</text>
<text x="315.0" y="272" text-anchor="middle" fill="#222">2×1×2 = 4</text>
<text x="425.0" y="272" text-anchor="middle" fill="#222">2×1×1 = 2</text>
<text x="30" y="309" fill="#c0392b" font-weight="bold">合計 8 + 4 + 2 = 14 ＝ (3 xor 5) + (3 xor 6) + (5 xor 6) = 6 + 5 + 3</text>
</svg>
