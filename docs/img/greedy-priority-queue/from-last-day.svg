<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="sans-serif" font-size="16">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="26" fill="#222">m = 3、仕事 (a, b) = (1, 2), (1, 3), (2, 4), (3, 5), (3, 1)</text>
<text x="16" y="50" fill="#222">後ろの日から決める</text>
<text x="16" y="86" fill="#555" font-size="14">日（間に合う a）</text>
<text x="150" y="86" fill="#555" font-size="14">新しく入れる b</text>
<text x="262" y="86" fill="#555" font-size="14">ヒープ（大きい順）</text>
<text x="450" y="86" text-anchor="middle" fill="#555" font-size="14">選ぶ</text>
<text x="520" y="86" text-anchor="middle" fill="#555" font-size="14">合計</text>
<line x1="16" y1="96" x2="544" y2="96" stroke="#888"/>
<text x="16" y="132" fill="#222">日 2（a ≤ 1）</text>
<rect x="150" y="110" width="38" height="32" fill="#fff4d6" stroke="#b7791f" stroke-dasharray="4 3"/>
<text x="169" y="132" text-anchor="middle" fill="#222">2</text>
<rect x="196" y="110" width="38" height="32" fill="#fff4d6" stroke="#b7791f" stroke-dasharray="4 3"/>
<text x="215" y="132" text-anchor="middle" fill="#222">3</text>
<rect x="262" y="110" width="38" height="32" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="281" y="132" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<rect x="308" y="110" width="38" height="32" fill="#f2f2f2" stroke="#888" stroke-width="1"/>
<text x="327" y="132" text-anchor="middle" fill="#222">2</text>
<text x="450" y="132" text-anchor="middle" fill="#1f4e9a" font-weight="bold">3</text>
<text x="520" y="132" text-anchor="middle" fill="#222">3</text>
<text x="262" y="164" fill="#555" font-size="14">先頭の 3 を選び、2 は次の日へ持ち越す</text>
<text x="16" y="212" fill="#222">日 1（a ≤ 2）</text>
<rect x="150" y="190" width="38" height="32" fill="#fff4d6" stroke="#b7791f" stroke-dasharray="4 3"/>
<text x="169" y="212" text-anchor="middle" fill="#222">4</text>
<rect x="262" y="190" width="38" height="32" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="281" y="212" text-anchor="middle" fill="#222" font-weight="bold">4</text>
<rect x="308" y="190" width="38" height="32" fill="#f2f2f2" stroke="#888" stroke-width="1"/>
<text x="327" y="212" text-anchor="middle" fill="#222">2</text>
<text x="450" y="212" text-anchor="middle" fill="#1f4e9a" font-weight="bold">4</text>
<text x="520" y="212" text-anchor="middle" fill="#222">7</text>
<text x="262" y="244" fill="#555" font-size="14">先頭の 4 を選び、2 は次の日へ持ち越す</text>
<text x="16" y="292" fill="#222">日 0（a ≤ 3）</text>
<rect x="150" y="270" width="38" height="32" fill="#fff4d6" stroke="#b7791f" stroke-dasharray="4 3"/>
<text x="169" y="292" text-anchor="middle" fill="#222">5</text>
<rect x="196" y="270" width="38" height="32" fill="#fff4d6" stroke="#b7791f" stroke-dasharray="4 3"/>
<text x="215" y="292" text-anchor="middle" fill="#222">1</text>
<rect x="262" y="270" width="38" height="32" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="281" y="292" text-anchor="middle" fill="#222" font-weight="bold">5</text>
<rect x="308" y="270" width="38" height="32" fill="#f2f2f2" stroke="#888" stroke-width="1"/>
<text x="327" y="292" text-anchor="middle" fill="#222">2</text>
<rect x="354" y="270" width="38" height="32" fill="#f2f2f2" stroke="#888" stroke-width="1"/>
<text x="373" y="292" text-anchor="middle" fill="#222">1</text>
<text x="450" y="292" text-anchor="middle" fill="#1f4e9a" font-weight="bold">5</text>
<text x="520" y="292" text-anchor="middle" fill="#222">12</text>
<text x="262" y="324" fill="#555" font-size="14">先頭の 5 を選ぶ。2 と 1 は選ばれない</text>
</svg>
