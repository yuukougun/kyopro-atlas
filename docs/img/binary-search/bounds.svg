<path d="M186,160 L186,168 L314,168 L314,160" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="250" y="186" text-anchor="middle" fill="#222" font-size="13">5 に等しい：6 − 3 = 3 個</text>
<path d="M54,202 L54,210 L314,210 L314,202" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="184" y="228" text-anchor="middle" fill="#222" font-size="13">5 以下：6 個（upper_bound の位置）</text>
