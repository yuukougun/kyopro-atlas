<line x1="184" y1="74" x2="184" y2="92" stroke="#1f4e9a" stroke-width="2" marker-end="url(#arb)"/>
<text x="184" y="50" text-anchor="middle" fill="#1f4e9a">lower_bound = 3</text>
<text x="184" y="68" text-anchor="middle" fill="#1f4e9a" font-size="13">（5 以上の最初）</text>
<line x1="316" y1="74" x2="316" y2="92" stroke="#9a4e1f" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="392" y="50" text-anchor="end" fill="#9a4e1f">upper_bound = 6</text>
<text x="392" y="68" text-anchor="end" fill="#9a4e1f" font-size="13">（5 より大きい最初）</text>
<path d="M54,160 L54,168 L182,168 L182,160" fill="none" stroke="#333" stroke-width="1.5"/>
