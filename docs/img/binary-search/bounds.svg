<text x="206" y="150" text-anchor="middle" fill="#555" font-size="13">3</text>
<rect x="228" y="96" width="44" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="250" y="119" text-anchor="middle" fill="#222" font-weight="bold">5</text>
<text x="250" y="150" text-anchor="middle" fill="#555" font-size="13">4</text>
<rect x="272" y="96" width="44" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="294" y="119" text-anchor="middle" fill="#222" font-weight="bold">5</text>
<text x="294" y="150" text-anchor="middle" fill="#555" font-size="13">5</text>
<rect x="316" y="96" width="44" height="36" fill="#ffe2c4" stroke="#9a4e1f" stroke-width="1.5"/>
