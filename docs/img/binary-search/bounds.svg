<text x="118" y="119" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<text x="118" y="150" text-anchor="middle" fill="#555" font-size="13">1</text>
<rect x="140" y="96" width="44" height="36" fill="#f2f2f2" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="162" y="119" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<text x="162" y="150" text-anchor="middle" fill="#555" font-size="13">2</text>
