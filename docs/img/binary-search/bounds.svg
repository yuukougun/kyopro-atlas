<svg xmlns="http://www.w3.org/2000/svg" width="402" height="250" viewBox="0 0 402 250" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0 0)">
<defs><marker id="arb" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1f4e9a"/></marker><marker id="arr" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#9a4e1f"/></marker></defs>
<text x="16" y="24" fill="#222">ソート済みの列 a と x = 5</text>
<rect x="52" y="96" width="44" height="36" fill="#f2f2f2" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
