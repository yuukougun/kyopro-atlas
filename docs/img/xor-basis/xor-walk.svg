<svg width="480" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="sans-serif" font-size="20">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222" font-size="19">根は 1。d は根から木の辺をたどった XOR</text>
<line x1="60" y1="110" x2="250" y2="110" stroke="#1f4e9a" stroke-width="3"/>
<text x="155" y="98" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<line x1="250" y1="110" x2="250" y2="250" stroke="#1f4e9a" stroke-width="3"/>
<text x="268" y="187" text-anchor="middle" fill="#222" font-weight="bold">5</text>
<line x1="250" y1="250" x2="420" y2="250" stroke="#1f4e9a" stroke-width="3"/>
<text x="335" y="238" text-anchor="middle" fill="#222" font-weight="bold">6</text>
<line x1="60" y1="110" x2="250" y2="250" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="136" y="200" text-anchor="middle" fill="#222" font-weight="bold">4</text>
<circle cx="60" cy="110" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="60" y="117" text-anchor="middle" fill="#222">1</text>
<text x="60" y="76" text-anchor="middle" fill="#1f4e9a" font-size="19">d = 0</text>
<circle cx="250" cy="110" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="250" y="117" text-anchor="middle" fill="#222">2</text>
<text x="250" y="76" text-anchor="middle" fill="#1f4e9a" font-size="19">d = 3</text>
<circle cx="250" cy="250" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="250" y="257" text-anchor="middle" fill="#222">3</text>
<text x="250" y="296" text-anchor="middle" fill="#1f4e9a" font-size="19">d = 6</text>
<circle cx="420" cy="250" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="420" y="257" text-anchor="middle" fill="#222">4</text>
<text x="420" y="296" text-anchor="middle" fill="#1f4e9a" font-size="19">d = 0</text>
<line x1="20" y1="325" x2="54" y2="325" stroke="#1f4e9a" stroke-width="3"/><text x="62" y="331" fill="#222" font-size="18">木の辺</text>
<line x1="150" y1="325" x2="184" y2="325" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/><text x="192" y="331" fill="#222" font-size="18">木に入らない辺</text>
</svg>
