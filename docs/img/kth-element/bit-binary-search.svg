<text x="315.0" y="180" text-anchor="middle" font-size="12" fill="#111">t[7]=3</text><text x="315.0" y="194" text-anchor="middle" font-size="12" fill="#111">④×</text>
<text x="10" y="226" font-size="13" fill="#111">値 i（上）と個数 c（箱）</text>
<text x="39.0" y="248" text-anchor="middle" fill="#111">1</text>
