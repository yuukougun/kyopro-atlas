<line x1="320.0" y1="76" x2="320.0" y2="104" stroke="#1f4e9a" stroke-width="2"/>
<line x1="390.0" y1="76" x2="390.0" y2="104" stroke="#1f4e9a" stroke-width="2"/>
<line x1="460.0" y1="76" x2="460.0" y2="104" stroke="#1f4e9a" stroke-width="2"/>
