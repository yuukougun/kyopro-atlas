<text x="320.0" y="124" text-anchor="middle" fill="#222">8</text>
<text x="600.0" y="124" text-anchor="middle" fill="#222">16</text>
<path d="M77.0,70 L77.0,64 L108.0,64 L108.0,70" fill="none" stroke="#777"/>
<text x="92.5" y="58" text-anchor="middle" fill="#555" font-size="12">間隔 1/4</text>
<path d="M112.0,70 L112.0,64 L178.0,64 L178.0,70" fill="none" stroke="#777"/>
<text x="145.0" y="58" text-anchor="middle" fill="#555" font-size="12">間隔 1/2</text>
<path d="M182.0,70 L182.0,64 L318.0,64 L318.0,70" fill="none" stroke="#777"/>
<text x="250.0" y="58" text-anchor="middle" fill="#555" font-size="12">間隔 1</text>
<path d="M322.0,70 L322.0,64 L598.0,64 L598.0,70" fill="none" stroke="#777"/>
<text x="460.0" y="58" text-anchor="middle" fill="#555" font-size="12">間隔 2</text>
<text x="30" y="152" fill="#222">2 の冪を 1 つ越えるごとに、表せる値の間隔が 2 倍になる（相対的な細かさは一定）</text>
<text x="30" y="190" fill="#222" font-weight="bold">double（仮数 53 ビット）での隣の値との間隔</text>
<text x="60" y="218" fill="#222" font-weight="bold">値の大きさ</text>
<text x="240" y="218" fill="#222" font-weight="bold">隣の値との間隔</text>
<line x1="50" y1="226" x2="460" y2="226" stroke="#999"/>
<text x="60" y="244" fill="#222" font-weight="normal">1</text>
<text x="240" y="244" fill="#222" font-weight="normal">約 2.2×10^-16</text>
<text x="60" y="270" fill="#222" font-weight="normal">10^6</text>
<text x="240" y="270" fill="#222" font-weight="normal">約 1.2×10^-10</text>
<text x="60" y="296" fill="#222" font-weight="normal">10^9</text>
<text x="240" y="296" fill="#222" font-weight="normal">約 1.2×10^-7</text>
<text x="60" y="322" fill="#222" font-weight="normal">10^18</text>
<text x="240" y="322" fill="#222" font-weight="normal">128</text>
