<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="26" fill="#222">仮数を 2 ビットにした小さな浮動小数点数で表せる値（縦線）</text>
