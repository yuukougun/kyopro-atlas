<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="70" y1="100" x2="210" y2="50" stroke="#1f4e9a" stroke-width="4"/>
<line x1="210" y1="50" x2="170" y2="200" stroke="#1f4e9a" stroke-width="4"/>
<line x1="70" y1="100" x2="170" y2="200" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="170" y1="200" x2="330" y2="130" stroke="#1f4e9a" stroke-width="4"/>
<line x1="210" y1="50" x2="330" y2="130" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="330" y1="130" x2="440" y2="230" stroke="#1f4e9a" stroke-width="4"/>
<line x1="170" y1="200" x2="440" y2="230" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="129.0" y="64.0" width="22" height="22" rx="4" fill="#ffffff" stroke="#1f4e9a"/>
<text x="140.0" y="80.0" text-anchor="middle" fill="#222">1</text>
<rect x="179.0" y="114.0" width="22" height="22" rx="4" fill="#ffffff" stroke="#1f4e9a"/>
<text x="190.0" y="130.0" text-anchor="middle" fill="#222">2</text>
<rect x="109.0" y="139.0" width="22" height="22" rx="4" fill="#ffffff" stroke="#999"/>
<text x="120.0" y="155.0" text-anchor="middle" fill="#222">3</text>
<rect x="239.0" y="154.0" width="22" height="22" rx="4" fill="#ffffff" stroke="#1f4e9a"/>
<text x="250.0" y="170.0" text-anchor="middle" fill="#222">4</text>
<rect x="259.0" y="79.0" width="22" height="22" rx="4" fill="#ffffff" stroke="#999"/>
<text x="270.0" y="95.0" text-anchor="middle" fill="#222">5</text>
<rect x="374.0" y="169.0" width="22" height="22" rx="4" fill="#ffffff" stroke="#1f4e9a"/>
<text x="385.0" y="185.0" text-anchor="middle" fill="#222">6</text>
<rect x="294.0" y="204.0" width="22" height="22" rx="4" fill="#ffffff" stroke="#999"/>
<text x="305.0" y="220.0" text-anchor="middle" fill="#222">7</text>
<circle cx="70" cy="100" r="17" fill="#f3f6fb" stroke="#222" stroke-width="1.5"/>
<text x="70" y="105" text-anchor="middle" fill="#222" font-weight="bold">A</text>
<circle cx="210" cy="50" r="17" fill="#f3f6fb" stroke="#222" stroke-width="1.5"/>
<text x="210" y="55" text-anchor="middle" fill="#222" font-weight="bold">B</text>
<circle cx="170" cy="200" r="17" fill="#f3f6fb" stroke="#222" stroke-width="1.5"/>
<text x="170" y="205" text-anchor="middle" fill="#222" font-weight="bold">C</text>
<circle cx="330" cy="130" r="17" fill="#f3f6fb" stroke="#222" stroke-width="1.5"/>
<text x="330" y="135" text-anchor="middle" fill="#222" font-weight="bold">D</text>
<circle cx="440" cy="230" r="17" fill="#f3f6fb" stroke="#222" stroke-width="1.5"/>
<text x="440" y="235" text-anchor="middle" fill="#222" font-weight="bold">E</text>
<text x="510" y="30" fill="#222">重みの小さい順に見る</text>
<text x="510" y="60" fill="#1f4e9a">1：A–B　採る</text>
<text x="510" y="90" fill="#1f4e9a">2：B–C　採る</text>
<text x="510" y="120" fill="#777">3：A–C　捨てる（閉路になる）</text>
<text x="510" y="150" fill="#1f4e9a">4：C–D　採る</text>
<text x="510" y="180" fill="#777">5：B–D　捨てる（閉路になる）</text>
<text x="510" y="210" fill="#1f4e9a">6：D–E　採る</text>
<text x="510" y="240" fill="#777">7：C–E　捨てる（閉路になる）</text>
<text x="510" y="270" fill="#222">合計 1 + 2 + 4 + 6 = 13</text>
</svg>
