<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" font-family="sans-serif" font-size="16">
<rect width="520" height="230" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs>
<text x="20" y="26" fill="#222">負の数の割り算：C++ の / と floor の違い</text>
<line x1="15" y1="140" x2="505" y2="140" stroke="#333" stroke-width="1.5"/>
<line x1="35" y1="135" x2="35" y2="145" stroke="#333"/>
<text x="35" y="162" text-anchor="middle" fill="#222">−5</text>
<line x1="83" y1="135" x2="83" y2="145" stroke="#333"/>
<text x="83" y="162" text-anchor="middle" fill="#222">−4</text>
<line x1="131" y1="135" x2="131" y2="145" stroke="#333"/>
<text x="131" y="162" text-anchor="middle" fill="#222">−3</text>
<line x1="179" y1="135" x2="179" y2="145" stroke="#333"/>
<text x="179" y="162" text-anchor="middle" fill="#222">−2</text>
<line x1="227" y1="135" x2="227" y2="145" stroke="#333"/>
<text x="227" y="162" text-anchor="middle" fill="#222">−1</text>
<line x1="275" y1="135" x2="275" y2="145" stroke="#333"/>
<text x="275" y="162" text-anchor="middle" fill="#222">0</text>
<line x1="323" y1="135" x2="323" y2="145" stroke="#333"/>
<text x="323" y="162" text-anchor="middle" fill="#222">1</text>
<line x1="371" y1="135" x2="371" y2="145" stroke="#333"/>
<text x="371" y="162" text-anchor="middle" fill="#222">2</text>
<line x1="419" y1="135" x2="419" y2="145" stroke="#333"/>
<text x="419" y="162" text-anchor="middle" fill="#222">3</text>
<line x1="467" y1="135" x2="467" y2="145" stroke="#333"/>
<text x="467" y="162" text-anchor="middle" fill="#222">4</text>
<circle cx="107.0" cy="140" r="5" fill="#d9534f" stroke="#333"/>
<circle cx="443.0" cy="140" r="5" fill="#d9534f" stroke="#333"/>
<text x="101.0" y="128" text-anchor="end" font-size="14" fill="#b52b27">−3.5</text>
<text x="449.0" y="128" text-anchor="start" font-size="14" fill="#b52b27">3.5</text>
<path d="M107.0 132 Q119.0 98 132 132" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="20" y="58" fill="#222">C++ の −7 / 2 は −3（0 に向かう。実線）</text>
<path d="M107.0 147 V180 Q107.0 186 101.0 186 H89 Q83 186 83 180 V169" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<text x="20" y="214" fill="#222">floor(−3.5) は −4（−∞ に向かう。破線）</text>
<path d="M443.0 132 Q431.0 98 418 132" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="500" y="86" text-anchor="end" fill="#222">正なら 7 / 2 も floor も 3</text>
</svg>
