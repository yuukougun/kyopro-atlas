<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 504" width="400" height="504" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="400" height="504" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<text x="16" y="24" font-weight="bold" fill="#222222">vector v = {10, 20, 30, 40}</text>
<text x="16" y="44" fill="#222222" font-size="14">（set も同じ並び）</text>
<text x="48.0" y="72" text-anchor="middle" fill="#1f5fa8">begin()</text>
<line x1="48.0" y1="78" x2="48.0" y2="102" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="234.0" y="72" text-anchor="middle" fill="#a8331f">prev(end())</text>
<line x1="240.0" y1="78" x2="240.0" y2="102" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="318.0" y="72" text-anchor="middle" fill="#555555">end()</text>
<line x1="304.0" y1="78" x2="304.0" y2="102" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<rect x="16" y="110" width="64" height="44" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="48.0" y="138" text-anchor="middle" fill="#222222" font-size="18">10</text>
<rect x="80" y="110" width="64" height="44" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="112.0" y="138" text-anchor="middle" fill="#222222" font-size="18">20</text>
<rect x="144" y="110" width="64" height="44" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="176.0" y="138" text-anchor="middle" fill="#222222" font-size="18">30</text>
<rect x="208" y="110" width="64" height="44" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="240.0" y="138" text-anchor="middle" fill="#222222" font-size="18">40</text>
<rect x="272" y="110" width="64" height="44" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="304.0" y="137" text-anchor="middle" fill="#888888" font-size="14">要素なし</text>
<text x="48.0" y="174" text-anchor="middle" fill="#555555" font-size="14">添字 0</text>
<text x="112.0" y="174" text-anchor="middle" fill="#555555" font-size="14">1</text>
<text x="176.0" y="174" text-anchor="middle" fill="#555555" font-size="14">2</text>
<text x="240.0" y="174" text-anchor="middle" fill="#555555" font-size="14">3</text>
<text x="304.0" y="174" text-anchor="middle" fill="#555555" font-size="14">4 = size()</text>
<text x="16" y="202" fill="#222222" font-size="14">prev(end()) と rbegin() は同じ要素（40）を指す。</text>
<text x="16" y="220" fill="#222222" font-size="14">end() は最後の要素の次。*end() は読めない</text>
<text x="16" y="238" fill="#222222" font-size="14">（未定義動作）。it - v.begin() が添字になる</text>
<line x1="16" y1="260" x2="384" y2="260" stroke="#cccccc" stroke-width="1"/>
<text x="16" y="286" font-weight="bold" fill="#222222">set で it = st.erase(it) を実行する</text>
<text x="16" y="306" fill="#222222" font-size="14">（it は 20 を指す）</text>
<text x="144.0" y="330" text-anchor="middle" fill="#a8331f">it</text>
<line x1="144.0" y1="334" x2="144.0" y2="344" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="16" y="374" fill="#222222">前</text>
<rect x="48" y="348" width="64" height="40" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="80.0" y="374" text-anchor="middle" fill="#222222" font-size="18">10</text>
<rect x="112" y="348" width="64" height="40" fill="#fbe9e6" stroke="#a8331f" stroke-width="2"/>
<text x="144.0" y="374" text-anchor="middle" fill="#222222" font-size="18">20</text>
<rect x="176" y="348" width="64" height="40" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="208.0" y="374" text-anchor="middle" fill="#222222" font-size="18">30</text>
<rect x="240" y="348" width="64" height="40" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="272.0" y="374" text-anchor="middle" fill="#222222" font-size="18">40</text>
<text x="208.0" y="408" text-anchor="middle" fill="#1f5fa8">戻り値の it</text>
<line x1="208.0" y1="411" x2="208.0" y2="421" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="16" y="450" fill="#222222">後</text>
<rect x="48" y="424" width="64" height="40" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="80.0" y="450" text-anchor="middle" fill="#222222" font-size="18">10</text>
<rect x="112" y="424" width="64" height="40" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="144.0" y="449" text-anchor="middle" fill="#888888" font-size="14">消えた</text>
<rect x="176" y="424" width="64" height="40" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="208.0" y="450" text-anchor="middle" fill="#222222" font-size="18">30</text>
<rect x="240" y="424" width="64" height="40" stroke="#333333" stroke-width="1.5" fill="#eef3fa"/>
<text x="272.0" y="450" text-anchor="middle" fill="#222222" font-size="18">40</text>
<text x="16" y="490" fill="#222222" font-size="14">10・30・40 を指すイテレータはそのまま使える</text>
</svg>
