<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- 上段：vector の begin・end・rbegin -->
  <text x="20" y="30" font-weight="bold" fill="#222222">vector v = {10, 20, 30, 40}（set も同じ並び）</text>
  <text x="170" y="62" text-anchor="middle" fill="#1f5fa8">begin()</text>
  <line x1="170" y1="68" x2="170" y2="92" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="410" y="62" text-anchor="middle" fill="#a8331f">prev(end())</text>
  <text x="410" y="80" text-anchor="middle" fill="#a8331f" font-size="14">rbegin() も同じ要素</text>
  <line x1="410" y1="84" x2="410" y2="96" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="62" text-anchor="middle" fill="#555555">end()</text>
  <line x1="490" y1="68" x2="490" y2="92" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <g stroke="#333333" stroke-width="1.5" fill="#eef3fa">
    <rect x="130" y="100" width="80" height="44"/>
    <rect x="210" y="100" width="80" height="44"/>
    <rect x="290" y="100" width="80" height="44"/>
    <rect x="370" y="100" width="80" height="44"/>
  </g>
  <rect x="450" y="100" width="80" height="44" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle" fill="#222222" font-size="18">
    <text x="170" y="128">10</text>
    <text x="250" y="128">20</text>
    <text x="330" y="128">30</text>
    <text x="410" y="128">40</text>
  </g>
  <text x="490" y="127" text-anchor="middle" fill="#888888" font-size="14">要素なし</text>
  <g text-anchor="middle" fill="#555555" font-size="14">
    <text x="170" y="164">添字 0</text>
    <text x="250" y="164">1</text>
    <text x="330" y="164">2</text>
    <text x="410" y="164">3</text>
    <text x="490" y="164">4 = size()</text>
  </g>
  <text x="20" y="194" fill="#222222" font-size="14">end() は最後の要素の次。*end() は読めない（未定義動作）。it - v.begin() が添字になる</text>

  <!-- 下段：set の erase -->
  <line x1="20" y1="214" x2="620" y2="214" stroke="#cccccc" stroke-width="1"/>
  <text x="20" y="242" font-weight="bold" fill="#222222">set で it = st.erase(it) を実行する（it は 20 を指す）</text>

  <text x="20" y="300" fill="#222222">前</text>
  <g stroke="#333333" stroke-width="1.5" fill="#eef3fa">
    <rect x="130" y="276" width="80" height="40"/>
    <rect x="290" y="276" width="80" height="40"/>
    <rect x="370" y="276" width="80" height="40"/>
  </g>
  <rect x="210" y="276" width="80" height="40" fill="#fbe9e6" stroke="#a8331f" stroke-width="2"/>
  <g text-anchor="middle" fill="#222222" font-size="18">
    <text x="170" y="302">10</text>
    <text x="250" y="302">20</text>
    <text x="330" y="302">30</text>
    <text x="410" y="302">40</text>
  </g>
  <text x="250" y="258" text-anchor="middle" fill="#a8331f">it</text>
  <line x1="250" y1="262" x2="250" y2="272" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="20" y="372" fill="#222222">後</text>
  <g stroke="#333333" stroke-width="1.5" fill="#eef3fa">
    <rect x="130" y="348" width="80" height="40"/>
    <rect x="290" y="348" width="80" height="40"/>
    <rect x="370" y="348" width="80" height="40"/>
  </g>
  <rect x="210" y="348" width="80" height="40" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle" fill="#222222" font-size="18">
    <text x="170" y="374">10</text>
    <text x="330" y="374">30</text>
    <text x="410" y="374">40</text>
  </g>
  <text x="250" y="373" text-anchor="middle" fill="#888888" font-size="14">消えた</text>
  <text x="330" y="332" text-anchor="middle" fill="#1f5fa8">戻り値の it</text>
  <line x1="330" y1="335" x2="330" y2="345" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="462" y="358" fill="#222222" font-size="14">10・30・40 を指す</text>
  <text x="462" y="374" fill="#222222" font-size="14">イテレータは</text>
  <text x="462" y="390" fill="#222222" font-size="14">そのまま使える</text>
</svg>
