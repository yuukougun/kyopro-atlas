<svg xmlns="http://www.w3.org/2000/svg" width="480" height="338" viewBox="0 0 480 338" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="26" fill="#222" font-size="16">頂点 1 からの距離で頂点を層に分ける</text>
<text x="60" y="56" fill="#666" text-anchor="middle" font-size="13.5">距離 0</text>
<text x="170" y="56" fill="#666" text-anchor="middle" font-size="13.5">距離 1</text>
<text x="280" y="56" fill="#666" text-anchor="middle" font-size="13.5">距離 2</text>
<text x="400" y="56" fill="#666" text-anchor="middle" font-size="13.5">距離 3</text>
<rect x="30" y="66" width="60" height="190" rx="10" fill="#f4f4f4" stroke="#999"/>
<rect x="140" y="66" width="60" height="190" rx="10" fill="#f4f4f4" stroke="#999"/>
<rect x="250" y="66" width="60" height="190" rx="10" fill="#f4f4f4" stroke="#999"/>
<rect x="370" y="66" width="60" height="190" rx="10" fill="#f4f4f4" stroke="#999"/>
<line x1="60" y1="160" x2="170" y2="110" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="60" y1="160" x2="170" y2="210" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="170" y1="110" x2="280" y2="100" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="170" y1="210" x2="280" y2="100" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="170" y1="210" x2="280" y2="220" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="280" y1="220" x2="400" y2="160" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="280" y1="100" x2="400" y2="160" stroke="#1f4e9a" stroke-width="2.5"/>
<path d="M 280 160 Q 296 160 280 220" fill="none" stroke="#2a7a2a" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M 280 160 Q 296 130 280 100" fill="none" stroke="#2a7a2a" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="170" y1="110" x2="170" y2="210" stroke="#2a7a2a" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="170" y1="210" x2="280" y2="160" stroke="#1f4e9a" stroke-width="2.5"/>
<circle cx="60" cy="160" r="16" fill="#ffffff" stroke="#1f4e9a" stroke-width="3"/>
