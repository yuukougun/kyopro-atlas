<line x1="24" y1="276" x2="60" y2="276" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="68" y="281" fill="#222" font-size="13.5">前の層への辺：各頂点が 1 本以上（2^j − 1 通りずつ）</text>
<line x1="24" y1="300" x2="60" y2="300" stroke="#2a7a2a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="68" y="305" fill="#222" font-size="13.5">同じ層の中の辺：自由（2^C(k,2) 通り）</text>
<text x="68" y="325" fill="#666" font-size="13.5">2 層以上離れた頂点の間には辺がない</text>
</svg>
