<circle cx="170" cy="110" r="16" fill="#ffffff" stroke="#1f4e9a" stroke-width="2"/>
<text x="170" y="116" fill="#222" text-anchor="middle">4</text>
<circle cx="170" cy="210" r="16" fill="#ffffff" stroke="#1f4e9a" stroke-width="2"/>
<text x="170" y="216" fill="#222" text-anchor="middle">2</text>
<circle cx="280" cy="100" r="16" fill="#ffffff" stroke="#1f4e9a" stroke-width="2"/>
<text x="280" y="106" fill="#222" text-anchor="middle">3</text>
<circle cx="280" cy="160" r="16" fill="#ffffff" stroke="#1f4e9a" stroke-width="2"/>
<text x="280" y="166" fill="#222" text-anchor="middle">6</text>
