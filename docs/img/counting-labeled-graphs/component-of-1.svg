<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" font-family="sans-serif" font-size="15">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="26" fill="#222" font-size="16">非連結なグラフ（n = 6）を頂点 1 の成分 T で分ける</text>
<rect x="16" y="44" width="176" height="160" rx="12" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="104" y="66" fill="#1f4e9a" text-anchor="middle" font-size="14">T：頂点 1 を含む成分</text>
<text x="104" y="84" fill="#1f4e9a" text-anchor="middle" font-size="13.5">k = 3 頂点・連結</text>
<rect x="288" y="44" width="176" height="160" rx="12" fill="#eeeeee" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="376" y="66" fill="#222" text-anchor="middle" font-size="14">残り：n − k = 3 頂点</text>
<text x="376" y="84" fill="#222" text-anchor="middle" font-size="13.5">どんなグラフでもよい</text>
<line x1="56" y1="120" x2="104" y2="175" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="104" y1="175" x2="152" y2="120" stroke="#1f4e9a" stroke-width="2.5"/>
<line x1="328" y1="120" x2="424" y2="120" stroke="#444" stroke-width="2.5"/>
<circle cx="56" cy="120" r="17" fill="#ffffff" stroke="#1f4e9a" stroke-width="3"/>
<text x="56" y="126" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<circle cx="104" cy="175" r="17" fill="#ffffff" stroke="#1f4e9a" stroke-width="2"/>
<text x="104" y="181" fill="#222" text-anchor="middle">3</text>
<circle cx="152" cy="120" r="17" fill="#ffffff" stroke="#1f4e9a" stroke-width="2"/>
<text x="152" y="126" fill="#222" text-anchor="middle">4</text>
<circle cx="328" cy="120" r="17" fill="#ffffff" stroke="#444" stroke-width="2"/>
<text x="328" y="126" fill="#222" text-anchor="middle">2</text>
<circle cx="424" cy="120" r="17" fill="#ffffff" stroke="#444" stroke-width="2"/>
<text x="424" y="126" fill="#222" text-anchor="middle">5</text>
<circle cx="376" cy="175" r="17" fill="#ffffff" stroke="#444" stroke-width="2"/>
<text x="376" y="181" fill="#222" text-anchor="middle">6</text>
<line x1="172" y1="150" x2="308" y2="150" stroke="#b03030" stroke-width="2" stroke-dasharray="5 4"/>
<text x="240" y="144" fill="#b03030" text-anchor="middle" font-size="20" font-weight="bold">×</text>
<text x="240" y="172" fill="#b03030" text-anchor="middle" font-size="13.5">間の辺は</text>
<text x="240" y="188" fill="#b03030" text-anchor="middle" font-size="13.5">0 本</text>
<text x="16" y="234" fill="#222">T の残りの頂点の選び方 C(n − 1, k − 1) ＝ C(5, 2)</text>
<text x="16" y="258" fill="#222">× T の中の辺の張り方 c(k)　× 残りの張り方 g(n − k)</text>
<text x="16" y="284" fill="#666" font-size="13.5">頂点 1 の成分は 1 つに決まるので、どの非連結なグラフも 1 回だけ数える</text>
</svg>
