<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" width="520" height="290" font-family="sans-serif">
  <rect x="0" y="0" width="520" height="290" fill="#ffffff"/>
  <text x="260" y="22" font-size="15" text-anchor="middle" fill="#222">S = 1414、P = 7：境目 i ごとに接尾辞 S[i, N) の余り U_i を書く</text>
  <!-- arcs between boundaries with equal remainder (0) -->
  <path d="M100,128 C100,78 260,78 260,128" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <path d="M260,128 C260,78 420,78 420,128" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <path d="M100,128 C100,34 420,34 420,128" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="180" y="84" font-size="14" text-anchor="middle" fill="#1565c0">「14」</text>
  <text x="340" y="84" font-size="14" text-anchor="middle" fill="#1565c0">「14」</text>
  <text x="260" y="50" font-size="14" text-anchor="middle" fill="#1565c0">「1414」</text>
  <!-- digit boxes -->
  <g stroke="#333" stroke-width="1.5" fill="#f5f5f5">
    <rect x="100" y="128" width="80" height="50"/>
    <rect x="180" y="128" width="80" height="50"/>
    <rect x="260" y="128" width="80" height="50"/>
    <rect x="340" y="128" width="80" height="50"/>
  </g>
  <g font-size="24" text-anchor="middle" fill="#222">
    <text x="140" y="162">1</text>
    <text x="220" y="162">4</text>
    <text x="300" y="162">1</text>
    <text x="380" y="162">4</text>
  </g>
  <!-- boundary markers -->
  <g stroke="#333" stroke-width="1.5">
    <circle cx="100" cy="128" r="6" fill="#1565c0"/>
    <circle cx="180" cy="128" r="6" fill="#ffffff"/>
    <circle cx="260" cy="128" r="6" fill="#1565c0"/>
    <circle cx="340" cy="128" r="6" fill="#ffffff"/>
    <circle cx="420" cy="128" r="6" fill="#1565c0"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="40" y="205" text-anchor="start">i</text>
    <text x="100" y="205">0</text>
    <text x="180" y="205">1</text>
    <text x="260" y="205">2</text>
    <text x="340" y="205">3</text>
    <text x="420" y="205">4</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="40" y="232" text-anchor="start">接尾辞</text>
    <text x="100" y="232">1414</text>
    <text x="180" y="232">414</text>
    <text x="260" y="232">14</text>
    <text x="340" y="232">4</text>
    <text x="420" y="232">（空）</text>
  </g>
  <g font-size="16" text-anchor="middle" font-weight="bold">
    <text x="40" y="262" text-anchor="start" fill="#444" font-weight="normal" font-size="14">U_i</text>
    <text x="100" y="262" fill="#1565c0">0</text>
    <text x="180" y="262" fill="#444">1</text>
    <text x="260" y="262" fill="#1565c0">0</text>
    <text x="340" y="262" fill="#444">4</text>
    <text x="420" y="262" fill="#1565c0">0</text>
  </g>
  <text x="260" y="283" font-size="13" text-anchor="middle" fill="#444">余り 0 の境目が 3 つ → 組は 3C2 = 3 個（余り 1・4 は 1 つずつで組なし）</text>
</svg>
