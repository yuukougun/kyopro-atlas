<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 342" width="320" height="342" font-family="sans-serif">
  <rect x="0" y="0" width="320" height="342" fill="#ffffff"/>
  <text x="160" y="22" font-size="15" text-anchor="middle" fill="#222">S = 1414、P = 7：境目 i ごとに</text>
  <text x="160" y="42" font-size="15" text-anchor="middle" fill="#222">接尾辞 S[i, N) の余り U_i を書く</text>
  <!-- arcs between boundaries with equal remainder (0) -->
  <path d="M84,152 C84,102 196,102 196,152" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <path d="M196,152 C196,102 308,102 308,152" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <path d="M84,152 C84,58 308,58 308,152" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="140" y="104" font-size="14" text-anchor="middle" fill="#1565c0">「14」</text>
  <text x="252" y="104" font-size="14" text-anchor="middle" fill="#1565c0">「14」</text>
  <text x="196" y="70" font-size="14" text-anchor="middle" fill="#1565c0">「1414」</text>
  <!-- digit boxes -->
  <g stroke="#333" stroke-width="1.5" fill="#f5f5f5">
    <rect x="84" y="152" width="56" height="50"/>
    <rect x="140" y="152" width="56" height="50"/>
    <rect x="196" y="152" width="56" height="50"/>
    <rect x="252" y="152" width="56" height="50"/>
  </g>
  <g font-size="22" text-anchor="middle" fill="#222">
    <text x="112" y="186">1</text>
    <text x="168" y="186">4</text>
    <text x="224" y="186">1</text>
    <text x="280" y="186">4</text>
  </g>
  <!-- boundary markers -->
  <g stroke="#333" stroke-width="1.5">
    <circle cx="84" cy="152" r="6" fill="#1565c0"/>
    <circle cx="140" cy="152" r="6" fill="#ffffff"/>
    <circle cx="196" cy="152" r="6" fill="#1565c0"/>
    <circle cx="252" cy="152" r="6" fill="#ffffff"/>
    <circle cx="308" cy="152" r="6" fill="#1565c0"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="8" y="229" text-anchor="start">i</text>
    <text x="84" y="229">0</text>
    <text x="140" y="229">1</text>
    <text x="196" y="229">2</text>
    <text x="252" y="229">3</text>
    <text x="308" y="229">4</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#444">
    <text x="8" y="256" text-anchor="start">接尾辞</text>
    <text x="84" y="256">1414</text>
    <text x="140" y="256">414</text>
    <text x="196" y="256">14</text>
    <text x="252" y="256">4</text>
    <text x="308" y="256">（空）</text>
  </g>
  <g font-size="16" text-anchor="middle" font-weight="bold">
    <text x="8" y="286" text-anchor="start" fill="#444" font-weight="normal" font-size="14">U_i</text>
    <text x="84" y="286" fill="#1565c0">0</text>
    <text x="140" y="286" fill="#444">1</text>
    <text x="196" y="286" fill="#1565c0">0</text>
    <text x="252" y="286" fill="#444">4</text>
    <text x="308" y="286" fill="#1565c0">0</text>
  </g>
  <text x="8" y="312" font-size="13" fill="#444">余り 0 の境目が 3 つ → 組は 3C2 = 3 個</text>
  <text x="8" y="330" font-size="13" fill="#444">（余り 1・4 は 1 つずつで組なし）</text>
</svg>
