<line x1="520.0" y1="220" x2="520.0" y2="130" stroke="#222" stroke-width="1"/>
<rect x="464.0" y="192" width="52" height="26" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="490.0" y="210" text-anchor="middle" fill="#222">0</text>
<text x="490.0" y="248" text-anchor="middle" fill="#c0392b">組 (3, 4)</text>
<text x="590.0" y="62" text-anchor="middle" fill="#555" font-size="12">位置 5</text>
<text x="590.0" y="86" text-anchor="middle" fill="#222" font-size="20" font-weight="bold">)</text>
<text x="590.0" y="108" text-anchor="middle" fill="#555" font-size="12">pop</text>
<line x1="560.0" y1="220" x2="620.0" y2="220" stroke="#222" stroke-width="2"/>
<line x1="560.0" y1="220" x2="560.0" y2="130" stroke="#222" stroke-width="1"/>
<line x1="620.0" y1="220" x2="620.0" y2="130" stroke="#222" stroke-width="1"/>
<text x="590.0" y="210" text-anchor="middle" fill="#888" font-size="12">（空）</text>
<text x="590.0" y="248" text-anchor="middle" fill="#c0392b">組 (0, 5)</text>
<text x="20" y="284" fill="#222">閉じ括弧の相手は、常にスタックの先頭（太枠）。最後に空なので正しい括弧列である</text>
</svg>
