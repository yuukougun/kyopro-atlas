<rect x="264.0" y="192" width="52" height="26" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="290.0" y="210" text-anchor="middle" fill="#222">0</text>
<text x="290.0" y="248" text-anchor="middle" fill="#c0392b">組 (1, 2)</text>
<text x="390.0" y="62" text-anchor="middle" fill="#555" font-size="12">位置 3</text>
<text x="390.0" y="86" text-anchor="middle" fill="#222" font-size="20" font-weight="bold">(</text>
<text x="390.0" y="108" text-anchor="middle" fill="#555" font-size="12">push</text>
<line x1="360.0" y1="220" x2="420.0" y2="220" stroke="#222" stroke-width="2"/>
<line x1="360.0" y1="220" x2="360.0" y2="130" stroke="#222" stroke-width="1"/>
<line x1="420.0" y1="220" x2="420.0" y2="130" stroke="#222" stroke-width="1"/>
<rect x="364.0" y="192" width="52" height="26" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="390.0" y="210" text-anchor="middle" fill="#222">0</text>
<rect x="364.0" y="162" width="52" height="26" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2.5"/>
<text x="390.0" y="180" text-anchor="middle" fill="#222">3</text>
<text x="490.0" y="62" text-anchor="middle" fill="#555" font-size="12">位置 4</text>
<text x="490.0" y="86" text-anchor="middle" fill="#222" font-size="20" font-weight="bold">)</text>
<text x="490.0" y="108" text-anchor="middle" fill="#555" font-size="12">pop</text>
