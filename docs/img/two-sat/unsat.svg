<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="400" height="300" fill="#ffffff"/>
  <!-- 頂点：a 左上、b 右上、¬a 右下、¬b 左下 -->
  <circle cx="110" cy="70" r="26" fill="#fff3c4" stroke="#8a6d00" stroke-width="4"/>
  <text x="110" y="77" font-size="20" text-anchor="middle" fill="#222">a</text>
  <circle cx="290" cy="70" r="24" fill="#e6f0fb" stroke="#2a5ea8" stroke-width="2"/>
  <text x="290" y="77" font-size="20" text-anchor="middle" fill="#222">b</text>
  <circle cx="290" cy="210" r="26" fill="#fff3c4" stroke="#8a6d00" stroke-width="4" stroke-dasharray="7 4"/>
  <text x="290" y="217" font-size="20" text-anchor="middle" fill="#222">¬a</text>
  <circle cx="110" cy="210" r="24" fill="#fde8e8" stroke="#b03030" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="110" y="217" font-size="20" text-anchor="middle" fill="#222">¬b</text>
  <!-- 辺 -->
  <line x1="138" y1="70" x2="264" y2="70" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="200" y="55" font-size="14" text-anchor="middle" fill="#222">¬a ∨ b から</text>
  <line x1="290" y1="96" x2="290" y2="182" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="144" font-size="14" fill="#222">¬a ∨ ¬b から</text>
  <line x1="262" y1="210" x2="136" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="200" y="235" font-size="14" text-anchor="middle" fill="#222">a ∨ ¬b から</text>
  <line x1="110" y1="184" x2="110" y2="98" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="100" y="144" font-size="14" text-anchor="end" fill="#222">a ∨ b から</text>
  <text x="200" y="270" font-size="14" text-anchor="middle" fill="#222">太い円の a と ¬a が同じ閉路の上にある</text>
  <text x="200" y="290" font-size="13" text-anchor="middle" fill="#555">（4 つの節の残りの 4 本の辺は省いた）</text>
</svg>
