<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" height="490" font-family="sans-serif">
<rect x="0" y="0" width="680" height="490" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#222">多重集合 {5, 1, 5, 9, 10^9} を座標圧縮し、値の順位を添字にする。ノードは（個数, 和）</text>
<!-- edges -->
<g stroke="#888" stroke-width="1.5">
<line x1="340" y1="94" x2="200" y2="134"/><line x1="340" y1="94" x2="480" y2="134"/>
<line x1="200" y1="184" x2="130" y2="224"/><line x1="200" y1="184" x2="270" y2="224"/>
<line x1="480" y1="184" x2="410" y2="224"/><line x1="480" y1="184" x2="550" y2="224"/>
</g>
<!-- root -->
<rect x="265" y="44" width="150" height="50" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="340" y="64" font-size="12" fill="#666" text-anchor="middle">[0, 4)</text>
<text x="340" y="84" font-size="14" fill="#222" text-anchor="middle">(5, 1000000020)</text>
<!-- mid -->
<rect x="135" y="134" width="130" height="50" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="200" y="154" font-size="12" fill="#666" text-anchor="middle">[0, 2)</text>
<text x="200" y="174" font-size="14" fill="#222" text-anchor="middle">(3, 11)</text>
<rect x="400" y="134" width="160" height="50" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="480" y="154" font-size="12" fill="#666" text-anchor="middle">[2, 4)</text>
<text x="480" y="174" font-size="14" fill="#222" text-anchor="middle">(2, 1000000009)</text>
<!-- leaves -->
<rect x="75" y="224" width="110" height="50" rx="6" fill="#dce7f7" stroke="#2f5fb3" stroke-width="3"/>
<text x="130" y="244" font-size="12" fill="#666" text-anchor="middle">添字 0</text>
<text x="130" y="264" font-size="14" fill="#222" text-anchor="middle">(1, 1)</text>
<rect x="215" y="224" width="110" height="50" rx="6" fill="#fff4e5" stroke="#c26a00" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="270" y="244" font-size="12" fill="#666" text-anchor="middle">添字 1</text>
<text x="270" y="264" font-size="14" fill="#222" text-anchor="middle">(2, 10)</text>
<rect x="355" y="224" width="110" height="50" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="410" y="244" font-size="12" fill="#666" text-anchor="middle">添字 2</text>
<text x="410" y="264" font-size="14" fill="#222" text-anchor="middle">(1, 9)</text>
<rect x="485" y="224" width="130" height="50" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="550" y="244" font-size="12" fill="#666" text-anchor="middle">添字 3</text>
<text x="550" y="264" font-size="14" fill="#222" text-anchor="middle">(1, 1000000000)</text>
<!-- histogram -->
<line x1="60" y1="380" x2="630" y2="380" stroke="#888" stroke-width="1.5"/>
<rect x="105" y="350" width="50" height="30" fill="#2f5fb3"/>
<rect x="245" y="320" width="50" height="60" fill="#ffffff" stroke="#c26a00" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="245" y1="350" x2="295" y2="350" stroke="#c26a00" stroke-width="1.5"/>
<rect x="245" y="350" width="50" height="30" fill="#c26a00" fill-opacity="0.35"/>
<rect x="385" y="350" width="50" height="30" fill="#bbbbbb"/>
<rect x="525" y="350" width="50" height="30" fill="#bbbbbb"/>
<text x="130" y="342" font-size="12" fill="#222" text-anchor="middle">1 個</text>
<text x="270" y="312" font-size="12" fill="#222" text-anchor="middle">2 個</text>
<text x="410" y="342" font-size="12" fill="#222" text-anchor="middle">1 個</text>
<text x="550" y="342" font-size="12" fill="#222" text-anchor="middle">1 個</text>
<text x="130" y="398" font-size="13" fill="#444" text-anchor="middle">値 1</text>
<text x="270" y="398" font-size="13" fill="#444" text-anchor="middle">値 5</text>
<text x="410" y="398" font-size="13" fill="#444" text-anchor="middle">値 9</text>
<text x="550" y="398" font-size="13" fill="#444" text-anchor="middle">値 10^9</text>
<!-- legend -->
<rect x="30" y="418" width="22" height="16" fill="#dce7f7" stroke="#2f5fb3" stroke-width="3"/>
<text x="60" y="431" font-size="13" fill="#222">K = 2 のとき丸ごと取るノード（個数 1、和 1）</text>
<rect x="30" y="442" width="22" height="16" fill="#fff4e5" stroke="#c26a00" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="60" y="455" font-size="13" fill="#222">境界の値 5 から残り 1 個だけ取る</text>
<text x="30" y="480" font-size="13" fill="#222">小さい方から 2 個の和 = 1 + 1 × 5 = 6（[0, 2) は個数 3 で多すぎ、max_right は r = 1 を返す）</text>
</svg>
