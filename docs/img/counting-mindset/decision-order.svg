<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" width="400" height="660" font-family="sans-serif">
<rect x="0" y="0" width="400" height="660" fill="#ffffff"/>
<text x="200" y="24" font-size="15" text-anchor="middle" fill="#111">決める順 A → B → C</text>
<rect x="166" y="45" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="200" y="65" font-size="15" text-anchor="middle" fill="#111">A=1</text>
<text x="241" y="64" font-size="13" text-anchor="start" fill="#0b5394" font-weight="bold">枝 2 本</text>
<line x1="200" y1="75" x2="120" y2="125" stroke="#555" stroke-width="1.5"/>
<rect x="86" y="125" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="120" y="145" font-size="15" text-anchor="middle" fill="#111">B=2</text>
<line x1="120" y1="155" x2="82" y2="205" stroke="#555" stroke-width="1.5"/>
<rect x="48" y="205" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="82" y="225" font-size="15" text-anchor="middle" fill="#111">C=1</text>
<line x1="120" y1="155" x2="158" y2="205" stroke="#555" stroke-width="1.5"/>
<rect x="124" y="205" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="158" y="225" font-size="15" text-anchor="middle" fill="#111">C=3</text>
<text x="120" y="256" font-size="13" text-anchor="middle" fill="#0b5394" font-weight="bold">枝 2 本</text>
<line x1="200" y1="75" x2="280" y2="125" stroke="#555" stroke-width="1.5"/>
<rect x="246" y="125" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="280" y="145" font-size="15" text-anchor="middle" fill="#111">B=3</text>
<line x1="280" y1="155" x2="242" y2="205" stroke="#555" stroke-width="1.5"/>
<rect x="208" y="205" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="242" y="225" font-size="15" text-anchor="middle" fill="#111">C=1</text>
<line x1="280" y1="155" x2="318" y2="205" stroke="#555" stroke-width="1.5"/>
<rect x="284" y="205" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="318" y="225" font-size="15" text-anchor="middle" fill="#111">C=2</text>
<text x="280" y="256" font-size="13" text-anchor="middle" fill="#0b5394" font-weight="bold">枝 2 本</text>
<text x="200" y="284" font-size="13" text-anchor="middle" fill="#111">どの節点でも枝の数が同じ</text>
<text x="200" y="304" font-size="13" text-anchor="middle" fill="#0b5394" font-weight="bold">→ 積の法則：3 × 2 × 2 = 12 通り</text>
<line x1="10" y1="322" x2="390" y2="322" stroke="#999" stroke-dasharray="4 4"/>
<text x="200" y="354" font-size="15" text-anchor="middle" fill="#111">決める順 A → C → B</text>
<rect x="166" y="375" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="200" y="395" font-size="15" text-anchor="middle" fill="#111">A=1</text>
<text x="241" y="394" font-size="13" text-anchor="start" fill="#b45f06" font-weight="bold">枝 3 本</text>
<line x1="200" y1="405" x2="80" y2="455" stroke="#555" stroke-width="1.5"/>
<rect x="46" y="455" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="80" y="475" font-size="15" text-anchor="middle" fill="#111">C=1</text>
<line x1="80" y1="485" x2="42" y2="535" stroke="#555" stroke-width="1.5"/>
<rect x="8" y="535" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="42" y="555" font-size="15" text-anchor="middle" fill="#111">B=2</text>
<line x1="80" y1="485" x2="118" y2="535" stroke="#555" stroke-width="1.5"/>
<rect x="84" y="535" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="118" y="555" font-size="15" text-anchor="middle" fill="#111">B=3</text>
<text x="80" y="516" font-size="12" text-anchor="middle" fill="#111">C = A</text>
<text x="80" y="586" font-size="13" text-anchor="middle" fill="#b45f06" font-weight="bold">枝 2 本</text>
<line x1="200" y1="405" x2="200" y2="455" stroke="#555" stroke-width="1.5"/>
<rect x="166" y="455" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334" stroke-dasharray="5 3"/>
<text x="200" y="475" font-size="15" text-anchor="middle" fill="#111">C=2</text>
<line x1="200" y1="485" x2="200" y2="535" stroke="#555" stroke-width="1.5"/>
<rect x="166" y="535" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="200" y="555" font-size="15" text-anchor="middle" fill="#111">B=3</text>
<text x="206" y="516" font-size="12" text-anchor="start" fill="#111">C ≠ A</text>
<text x="200" y="586" font-size="13" text-anchor="middle" fill="#b45f06" font-weight="bold">枝 1 本</text>
<line x1="200" y1="405" x2="320" y2="455" stroke="#555" stroke-width="1.5"/>
<rect x="286" y="455" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334" stroke-dasharray="5 3"/>
<text x="320" y="475" font-size="15" text-anchor="middle" fill="#111">C=3</text>
<line x1="320" y1="485" x2="320" y2="535" stroke="#555" stroke-width="1.5"/>
<rect x="286" y="535" width="68" height="30" rx="6" fill="#f4f6fa" stroke="#334"/>
<text x="320" y="555" font-size="15" text-anchor="middle" fill="#111">B=2</text>
<text x="326" y="516" font-size="12" text-anchor="start" fill="#111">C ≠ A</text>
<text x="320" y="586" font-size="13" text-anchor="middle" fill="#b45f06" font-weight="bold">枝 1 本</text>
<text x="200" y="614" font-size="13" text-anchor="middle" fill="#111">枝の数が「C が A と同じ色か」で変わる</text>
<text x="200" y="634" font-size="13" text-anchor="middle" fill="#b45f06" font-weight="bold">→ 3 × 3 × （一定の数）と掛けられない</text>
</svg>
