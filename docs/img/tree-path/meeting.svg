<svg width="520" height="525" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 525" font-family="sans-serif" font-size="16">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="28" fill="#222">3 点 7・8・9 の合流点は、3 つの LCA のうち最も深い 1</text>
<text x="510" y="95" fill="#666" font-size="15" text-anchor="end">深さ 0</text>
<text x="510" y="165" fill="#666" font-size="15" text-anchor="end">深さ 1</text>
<text x="510" y="235" fill="#666" font-size="15" text-anchor="end">深さ 2</text>
<text x="510" y="305" fill="#666" font-size="15" text-anchor="end">深さ 3</text>
<text x="510" y="375" fill="#666" font-size="15" text-anchor="end">深さ 4</text>
<line x1="200" y1="160" x2="300" y2="90" stroke="#2e7d32" stroke-width="5"/>
<line x1="420" y1="160" x2="300" y2="90" stroke="#2e7d32" stroke-width="5"/>
<line x1="130" y1="230" x2="200" y2="160" stroke="#2e7d32" stroke-width="5"/>
<line x1="270" y1="230" x2="200" y2="160" stroke="#2e7d32" stroke-width="5"/>
<line x1="420" y1="230" x2="420" y2="160" stroke="#2e7d32" stroke-width="5"/>
<line x1="90" y1="300" x2="130" y2="230" stroke="#999" stroke-width="1.5"/>
<line x1="170" y1="300" x2="130" y2="230" stroke="#2e7d32" stroke-width="5"/>
<line x1="270" y1="300" x2="270" y2="230" stroke="#2e7d32" stroke-width="5"/>
<line x1="420" y1="300" x2="420" y2="230" stroke="#2e7d32" stroke-width="5"/>
<line x1="90" y1="370" x2="90" y2="300" stroke="#999" stroke-width="1.5"/>
<circle cx="300" cy="90" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="300" y="96" text-anchor="middle" fill="#222">0</text>
<circle cx="200" cy="160" r="17" fill="#fff3c4" stroke="#333" stroke-width="2.5"/>
<text x="200" y="166" text-anchor="middle" fill="#222">1</text>
<circle cx="420" cy="160" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="420" y="166" text-anchor="middle" fill="#222">2</text>
<circle cx="130" cy="230" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="130" y="236" text-anchor="middle" fill="#222">3</text>
<circle cx="270" cy="230" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="270" y="236" text-anchor="middle" fill="#222">4</text>
<circle cx="420" cy="230" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="420" y="236" text-anchor="middle" fill="#222">5</text>
<circle cx="90" cy="300" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="90" y="306" text-anchor="middle" fill="#222">6</text>
<circle cx="170" cy="300" r="17" fill="#dde7f7" stroke="#333" stroke-width="2.5"/>
<text x="170" y="306" text-anchor="middle" fill="#222">7</text>
<circle cx="270" cy="300" r="17" fill="#dde7f7" stroke="#333" stroke-width="2.5"/>
<text x="270" y="306" text-anchor="middle" fill="#222">8</text>
<circle cx="420" cy="300" r="17" fill="#dde7f7" stroke="#333" stroke-width="2.5"/>
<text x="420" y="306" text-anchor="middle" fill="#222">9</text>
<circle cx="90" cy="370" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="90" y="376" text-anchor="middle" fill="#222">10</text>
<text x="176" y="148" fill="#222" text-anchor="end" font-size="15">合流点 m = 1</text>
<text x="176" y="168" fill="#555" text-anchor="end" font-size="15">lca(7, 8) = 1</text>
<text x="300" y="64" fill="#555" text-anchor="middle" font-size="15">lca(8, 9) = lca(9, 7) = 0</text>
<text x="170" y="340" fill="#1f4e9a" text-anchor="middle" font-size="17">a</text>
<text x="270" y="340" fill="#1f4e9a" text-anchor="middle" font-size="17">b</text>
<text x="420" y="340" fill="#1f4e9a" text-anchor="middle" font-size="17">c</text>
<line x1="20" y1="440" x2="60" y2="440" stroke="#2e7d32" stroke-width="5"/>
<text x="70" y="445" fill="#222" font-size="15">3 点を結ぶ最小の部分木（辺 8 本）</text>
<text x="20" y="475" fill="#222" font-size="15">(d(a,b) + d(b,c) + d(c,a)) / 2 = (4 + 6 + 6) / 2 = 8</text>
<text x="20" y="505" fill="#222" font-size="15">d(a,m) + d(b,m) + d(c,m) = 2 + 2 + 4 = 8</text>
</svg>
