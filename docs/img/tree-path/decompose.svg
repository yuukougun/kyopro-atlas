<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 525" font-family="sans-serif" font-size="16">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="28" fill="#222">パス 10–8 を 2 本の縦の線に分ける（根は 0）</text>
<text x="510" y="95" fill="#666" font-size="14" text-anchor="end">深さ 0</text>
<text x="510" y="165" fill="#666" font-size="14" text-anchor="end">深さ 1</text>
<text x="510" y="235" fill="#666" font-size="14" text-anchor="end">深さ 2</text>
<text x="510" y="305" fill="#666" font-size="14" text-anchor="end">深さ 3</text>
<text x="510" y="375" fill="#666" font-size="14" text-anchor="end">深さ 4</text>
<line x1="200" y1="160" x2="300" y2="90" stroke="#999" stroke-width="1.5"/>
<line x1="420" y1="160" x2="300" y2="90" stroke="#999" stroke-width="1.5"/>
<line x1="130" y1="230" x2="200" y2="160" stroke="#1f4e9a" stroke-width="5"/>
<line x1="270" y1="230" x2="200" y2="160" stroke="#c0561b" stroke-width="5" stroke-dasharray="9,5"/>
<line x1="420" y1="230" x2="420" y2="160" stroke="#999" stroke-width="1.5"/>
<line x1="90" y1="300" x2="130" y2="230" stroke="#1f4e9a" stroke-width="5"/>
<line x1="170" y1="300" x2="130" y2="230" stroke="#999" stroke-width="1.5"/>
<line x1="270" y1="300" x2="270" y2="230" stroke="#c0561b" stroke-width="5" stroke-dasharray="9,5"/>
<line x1="420" y1="300" x2="420" y2="230" stroke="#999" stroke-width="1.5"/>
<line x1="90" y1="370" x2="90" y2="300" stroke="#1f4e9a" stroke-width="5"/>
<circle cx="300" cy="90" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="300" y="96" text-anchor="middle" fill="#222">0</text>
<circle cx="200" cy="160" r="17" fill="#fff3c4" stroke="#333" stroke-width="2.5"/>
<text x="200" y="166" text-anchor="middle" fill="#222">1</text>
<circle cx="420" cy="160" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="420" y="166" text-anchor="middle" fill="#222">2</text>
<circle cx="130" cy="230" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="130" y="236" text-anchor="middle" fill="#222">3</text>
<circle cx="270" cy="230" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="270" y="236" text-anchor="middle" fill="#222">4</text>
<circle cx="420" cy="230" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="420" y="236" text-anchor="middle" fill="#222">5</text>
<circle cx="90" cy="300" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="90" y="306" text-anchor="middle" fill="#222">6</text>
<circle cx="170" cy="300" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="170" y="306" text-anchor="middle" fill="#222">7</text>
<circle cx="270" cy="300" r="17" fill="#dde7f7" stroke="#333" stroke-width="2.5"/>
<text x="270" y="306" text-anchor="middle" fill="#222">8</text>
<circle cx="420" cy="300" r="17" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
<text x="420" y="306" text-anchor="middle" fill="#222">9</text>
<circle cx="90" cy="370" r="17" fill="#dde7f7" stroke="#333" stroke-width="2.5"/>
<text x="90" y="376" text-anchor="middle" fill="#222">10</text>
<text x="176" y="166" fill="#222" text-anchor="end" font-size="15">l = lca(10, 8)</text>
<text x="66" y="376" fill="#1f4e9a" text-anchor="end" font-size="17">u</text>
<text x="270" y="340" fill="#c0561b" text-anchor="middle" font-size="17">v</text>
<text x="170" y="340" fill="#555" text-anchor="middle" font-size="17">x</text>
<line x1="20" y1="440" x2="60" y2="440" stroke="#1f4e9a" stroke-width="5"/>
<text x="70" y="445" fill="#222" font-size="15">u から l へ上る：dep[u] − dep[l] = 3 本</text>
<line x1="20" y1="470" x2="60" y2="470" stroke="#c0561b" stroke-width="5" stroke-dasharray="9,5"/>
<text x="70" y="475" fill="#222" font-size="15">l から v へ下る：dep[v] − dep[l] = 2 本</text>
<text x="20" y="505" fill="#222" font-size="15">x = 7 は外れる：d(u, x) + d(x, v) = 3 + 4 = 7 &gt; 5</text>
</svg>
