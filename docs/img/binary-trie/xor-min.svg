<text x="126" y="342" text-anchor="middle" font-size="18">1（001）</text>
<circle cx="252" cy="300" r="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="252" y="306" text-anchor="middle">1</text>
<text x="252" y="342" text-anchor="middle" font-size="18">3（011）</text>
<circle cx="378" cy="300" r="18" fill="#fdf0e0" stroke="#b25e00" stroke-width="3"/>
