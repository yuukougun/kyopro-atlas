<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" font-family="sans-serif" font-size="16">
<rect x="0" y="0" width="600" height="440" fill="#ffffff"/>
<text x="20" y="30" font-size="16">集合 {1, 3, 4, 6}（3 bit）、x = 5（101）で XOR の最小を探す</text>
<text x="20" y="105" fill="#555">bit 2</text>
<text x="20" y="185" fill="#555">bit 1</text>
<text x="20" y="265" fill="#555">bit 0</text>
<line x1="340" y1="60" x2="200" y2="140" stroke="#999" stroke-width="2"/>
<text x="256.0" y="105.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">0</text>
<line x1="340" y1="60" x2="480" y2="140" stroke="#b25e00" stroke-width="5"/>
<text x="424.0" y="105.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">1</text>
<line x1="200" y1="140" x2="130" y2="220" stroke="#999" stroke-width="2"/>
<text x="151.0" y="185.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">0</text>
<line x1="200" y1="140" x2="270" y2="220" stroke="#999" stroke-width="2"/>
<text x="249.0" y="185.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">1</text>
<line x1="480" y1="140" x2="410" y2="220" stroke="#b25e00" stroke-width="5"/>
<text x="431.0" y="185.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">0</text>
<line x1="480" y1="140" x2="550" y2="220" stroke="#999" stroke-width="2"/>
<text x="529.0" y="185.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">1</text>
<line x1="130" y1="220" x2="130" y2="300" stroke="#999" stroke-width="2"/>
<text x="144.0" y="265.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">1</text>
<line x1="270" y1="220" x2="270" y2="300" stroke="#999" stroke-width="2"/>
<text x="284.0" y="265.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">1</text>
<line x1="410" y1="220" x2="410" y2="300" stroke="#b25e00" stroke-width="5" stroke-dasharray="9 5"/>
<text x="396.0" y="265.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">0</text>
<line x1="550" y1="220" x2="550" y2="300" stroke="#999" stroke-width="2"/>
<text x="536.0" y="265.0" text-anchor="middle" font-weight="bold" fill="#1a56c4">0</text>
<circle cx="340" cy="60" r="18" fill="#fdf0e0" stroke="#b25e00" stroke-width="3"/>
<text x="340" y="66" text-anchor="middle">4</text>
<circle cx="200" cy="140" r="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="200" y="146" text-anchor="middle">2</text>
<circle cx="480" cy="140" r="18" fill="#fdf0e0" stroke="#b25e00" stroke-width="3"/>
<text x="480" y="146" text-anchor="middle">2</text>
<circle cx="130" cy="220" r="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="130" y="226" text-anchor="middle">1</text>
<circle cx="270" cy="220" r="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="270" y="226" text-anchor="middle">1</text>
<circle cx="410" cy="220" r="18" fill="#fdf0e0" stroke="#b25e00" stroke-width="3"/>
<text x="410" y="226" text-anchor="middle">1</text>
<circle cx="550" cy="220" r="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="550" y="226" text-anchor="middle">1</text>
<circle cx="130" cy="300" r="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="130" y="306" text-anchor="middle">1</text>
<text x="130" y="342" text-anchor="middle" font-size="18">1（001）</text>
<circle cx="270" cy="300" r="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="270" y="306" text-anchor="middle">1</text>
<text x="270" y="342" text-anchor="middle" font-size="18">3（011）</text>
<circle cx="410" cy="300" r="18" fill="#fdf0e0" stroke="#b25e00" stroke-width="3"/>
<text x="410" y="306" text-anchor="middle">1</text>
<text x="410" y="342" text-anchor="middle" font-size="18">4（100）</text>
<circle cx="550" cy="300" r="18" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="550" y="306" text-anchor="middle">1</text>
<text x="550" y="342" text-anchor="middle" font-size="18">6（110）</text>
<text x="20" y="372" fill="#333" font-size="18">実線の太線：x と同じ側へ降りた（bit は 0）</text>
<text x="20" y="398" fill="#333" font-size="18">破線の太線：同じ側がなく反対側へ（bit は 1）</text>
<text x="20" y="424" fill="#333" font-size="18">円の中の数：部分木の要素の個数</text>
</svg>
