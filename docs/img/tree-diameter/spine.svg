<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 346" width="380" height="346" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="380" height="346" fill="#ffffff"/>
<text x="10" y="22" fill="#222">直径 p–q を横一列に並べ、残りの頂点を</text>
<text x="10" y="42" fill="#222">枝としてぶら下げる</text>
  <!-- 直径（太い実線） -->
  <line x1="30" y1="104" x2="342" y2="104" stroke="#1f5fbf" stroke-width="5"/>
  <!-- 枝（細い破線） -->
  <line x1="134" y1="104" x2="134" y2="184" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="134" y1="184" x2="134" y2="264" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="134" y1="184" x2="94" y2="264" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="238" y1="104" x2="238" y2="184" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="238" y1="184" x2="238" y2="264" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="186" y1="104" x2="186" y2="184" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- 直径の頂点 -->
  <g fill="#ffffff" stroke="#1f5fbf" stroke-width="2.5">
    <circle cx="30" cy="104" r="13"/>
    <circle cx="82" cy="104" r="13"/>
    <circle cx="134" cy="104" r="13"/>
    <circle cx="186" cy="104" r="13"/>
    <circle cx="238" cy="104" r="13"/>
    <circle cx="290" cy="104" r="13"/>
    <circle cx="342" cy="104" r="13"/>
  </g>
  <!-- 枝の頂点 -->
  <g fill="#ffffff" stroke="#555" stroke-width="2">
    <circle cx="134" cy="184" r="11"/>
    <circle cx="134" cy="264" r="11"/>
    <circle cx="94" cy="264" r="11"/>
    <circle cx="238" cy="184" r="11"/>
    <circle cx="238" cy="264" r="11"/>
    <circle cx="186" cy="184" r="11"/>
  </g>
  <text x="30" y="109" text-anchor="middle" fill="#1f5fbf" font-weight="bold">p</text>
  <text x="342" y="109" text-anchor="middle" fill="#1f5fbf" font-weight="bold">q</text>
  <text x="134" y="109" text-anchor="middle" fill="#1f5fbf">x</text>
  <text x="238" y="109" text-anchor="middle" fill="#1f5fbf">y</text>
  <text x="134" y="269" text-anchor="middle" fill="#222">s</text>
  <text x="238" y="269" text-anchor="middle" fill="#222">u</text>
  <!-- y から q までの長さ -->
  <line x1="238" y1="76" x2="342" y2="76" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="238" y1="70" x2="238" y2="82" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="342" y1="70" x2="342" y2="82" stroke="#c0392b" stroke-width="1.5"/>
  <text x="290" y="70" text-anchor="middle" fill="#c0392b">d(y, q) = 2</text>
  <!-- y から u までの深さ -->
  <line x1="262" y1="104" x2="262" y2="264" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="256" y1="104" x2="268" y2="104" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="256" y1="264" x2="268" y2="264" stroke="#c0392b" stroke-width="1.5"/>
  <text x="270" y="189" fill="#c0392b">d(y, u) = 2</text>
<text x="10" y="308" fill="#222">枝の深さは、付け根から近い方の端までの</text>
<text x="10" y="328" fill="#222">長さを超えない（超えると直径が伸びる）</text>
</svg>
