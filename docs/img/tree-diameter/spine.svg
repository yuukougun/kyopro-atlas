<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#222">直径 p–q を横一列に並べ、残りの頂点を枝としてぶら下げる</text>
  <!-- 直径（太い実線） -->
  <line x1="80" y1="80" x2="560" y2="80" stroke="#1f5fbf" stroke-width="5"/>
  <!-- 枝（細い破線） -->
  <line x1="240" y1="80" x2="240" y2="160" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="240" y1="160" x2="240" y2="240" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="240" y1="160" x2="180" y2="240" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="400" y1="80" x2="400" y2="160" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="400" y1="160" x2="400" y2="240" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="320" y1="80" x2="320" y2="160" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- 直径の頂点 -->
  <g fill="#ffffff" stroke="#1f5fbf" stroke-width="2.5">
    <circle cx="80" cy="80" r="13"/>
    <circle cx="160" cy="80" r="13"/>
    <circle cx="240" cy="80" r="13"/>
    <circle cx="320" cy="80" r="13"/>
    <circle cx="400" cy="80" r="13"/>
    <circle cx="480" cy="80" r="13"/>
    <circle cx="560" cy="80" r="13"/>
  </g>
  <!-- 枝の頂点 -->
  <g fill="#ffffff" stroke="#555" stroke-width="2">
    <circle cx="240" cy="160" r="11"/>
    <circle cx="240" cy="240" r="11"/>
    <circle cx="180" cy="240" r="11"/>
    <circle cx="400" cy="160" r="11"/>
    <circle cx="400" cy="240" r="11"/>
    <circle cx="320" cy="160" r="11"/>
  </g>
  <text x="80" y="85" text-anchor="middle" fill="#1f5fbf" font-weight="bold">p</text>
  <text x="560" y="85" text-anchor="middle" fill="#1f5fbf" font-weight="bold">q</text>
  <text x="240" y="85" text-anchor="middle" fill="#1f5fbf">x</text>
  <text x="400" y="85" text-anchor="middle" fill="#1f5fbf">y</text>
  <text x="240" y="245" text-anchor="middle" fill="#222">s</text>
  <text x="400" y="245" text-anchor="middle" fill="#222">u</text>
  <!-- y から q までの長さ -->
  <line x1="400" y1="52" x2="560" y2="52" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="400" y1="46" x2="400" y2="58" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="560" y1="46" x2="560" y2="58" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="46" text-anchor="middle" fill="#c0392b">d(y, q) = 2</text>
  <!-- y から u までの深さ -->
  <line x1="430" y1="80" x2="430" y2="240" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="424" y1="80" x2="436" y2="80" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="424" y1="240" x2="436" y2="240" stroke="#c0392b" stroke-width="1.5"/>
  <text x="440" y="165" fill="#c0392b">d(y, u) = 2</text>
  <text x="320" y="285" text-anchor="middle" fill="#222">枝の深さは、付け根から近い方の端までの長さを超えない（超えると直径が伸びる）</text>
</svg>
