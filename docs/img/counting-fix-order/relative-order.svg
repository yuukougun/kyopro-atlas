<svg xmlns="http://www.w3.org/2000/svg" width="400" height="290" viewBox="0 0 400 290" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" fill="#222">3! = 6 通りを、A・B が入る 2 か所で 3 組に分ける</text>
<text x="52" y="54" text-anchor="middle" fill="#444" font-size="13">A・B の位置</text>
<text x="175" y="54" text-anchor="middle" fill="#1f4e9a" font-size="13">A が先</text>
<text x="320" y="54" text-anchor="middle" fill="#777" font-size="13">B が先</text>
<rect x="6" y="64" width="388" height="54" rx="8" fill="#f6f6f6" stroke="#999"/>
<text x="52" y="96" text-anchor="middle" fill="#444" font-size="14">1・2 番目</text>
<rect x="104" y="72" width="142" height="38" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="146" y="97" text-anchor="middle" fill="#222" font-size="17" xml:space="preserve">A B C</text>
<text x="214" y="96" text-anchor="middle" fill="#1f4e9a" font-size="14">残す</text>
<rect x="254" y="72" width="132" height="38" fill="#ffffff" stroke="#999" stroke-dasharray="5 4"/>
<text x="290" y="97" text-anchor="middle" fill="#999" font-size="17" xml:space="preserve">B A C</text>
<text x="350" y="96" text-anchor="middle" fill="#999" font-size="14">× 除く</text>
<rect x="6" y="126" width="388" height="54" rx="8" fill="#f6f6f6" stroke="#999"/>
<text x="52" y="158" text-anchor="middle" fill="#444" font-size="14">1・3 番目</text>
<rect x="104" y="134" width="142" height="38" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="146" y="159" text-anchor="middle" fill="#222" font-size="17" xml:space="preserve">A C B</text>
<text x="214" y="158" text-anchor="middle" fill="#1f4e9a" font-size="14">残す</text>
<rect x="254" y="134" width="132" height="38" fill="#ffffff" stroke="#999" stroke-dasharray="5 4"/>
<text x="290" y="159" text-anchor="middle" fill="#999" font-size="17" xml:space="preserve">B C A</text>
<text x="350" y="158" text-anchor="middle" fill="#999" font-size="14">× 除く</text>
<rect x="6" y="188" width="388" height="54" rx="8" fill="#f6f6f6" stroke="#999"/>
<text x="52" y="220" text-anchor="middle" fill="#444" font-size="14">2・3 番目</text>
<rect x="104" y="196" width="142" height="38" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="146" y="221" text-anchor="middle" fill="#222" font-size="17" xml:space="preserve">C A B</text>
<text x="214" y="220" text-anchor="middle" fill="#1f4e9a" font-size="14">残す</text>
<rect x="254" y="196" width="132" height="38" fill="#ffffff" stroke="#999" stroke-dasharray="5 4"/>
<text x="290" y="221" text-anchor="middle" fill="#999" font-size="17" xml:space="preserve">C B A</text>
<text x="350" y="220" text-anchor="middle" fill="#999" font-size="14">× 除く</text>
<text x="12" y="270" fill="#222">各組の 2! 通りのうち 1 通りだけが残る → 3! / 2! = 3 通り</text>
</svg>
