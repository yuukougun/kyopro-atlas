<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="15">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="30" fill="#222">3! = 6 通りを、A・B が入る 2 か所で 3 組に分ける</text>
<rect x="30" y="60" width="185" height="170" rx="8" fill="#f6f6f6" stroke="#999"/>
<text x="122" y="85" text-anchor="middle" fill="#444" font-size="13">A・B が 1・2 番目</text>
<rect x="50" y="105" width="145" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="90" y="131" text-anchor="middle" fill="#222" font-size="17" xml:space="preserve">A B C</text>
<text x="170" y="131" text-anchor="middle" fill="#1f4e9a" font-size="13">残す</text>
<rect x="50" y="165" width="145" height="40" fill="#ffffff" stroke="#999" stroke-dasharray="5 4"/>
<text x="90" y="191" text-anchor="middle" fill="#999" font-size="17" xml:space="preserve">B A C</text>
<text x="170" y="191" text-anchor="middle" fill="#999" font-size="13">× B が先</text>
<rect x="235" y="60" width="185" height="170" rx="8" fill="#f6f6f6" stroke="#999"/>
<text x="327" y="85" text-anchor="middle" fill="#444" font-size="13">A・B が 1・3 番目</text>
<rect x="255" y="105" width="145" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="295" y="131" text-anchor="middle" fill="#222" font-size="17" xml:space="preserve">A C B</text>
<text x="375" y="131" text-anchor="middle" fill="#1f4e9a" font-size="13">残す</text>
<rect x="255" y="165" width="145" height="40" fill="#ffffff" stroke="#999" stroke-dasharray="5 4"/>
<text x="295" y="191" text-anchor="middle" fill="#999" font-size="17" xml:space="preserve">B C A</text>
<text x="375" y="191" text-anchor="middle" fill="#999" font-size="13">× B が先</text>
<rect x="440" y="60" width="185" height="170" rx="8" fill="#f6f6f6" stroke="#999"/>
<text x="532" y="85" text-anchor="middle" fill="#444" font-size="13">A・B が 2・3 番目</text>
<rect x="460" y="105" width="145" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="500" y="131" text-anchor="middle" fill="#222" font-size="17" xml:space="preserve">C A B</text>
<text x="580" y="131" text-anchor="middle" fill="#1f4e9a" font-size="13">残す</text>
<rect x="460" y="165" width="145" height="40" fill="#ffffff" stroke="#999" stroke-dasharray="5 4"/>
<text x="500" y="191" text-anchor="middle" fill="#999" font-size="17" xml:space="preserve">C B A</text>
<text x="580" y="191" text-anchor="middle" fill="#999" font-size="13">× B が先</text>
<text x="20" y="270" fill="#222">各組で 2! 通りのうち 1 通りだけが残る → 3! / 2! = 3 通り</text>
</svg>
