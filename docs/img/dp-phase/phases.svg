<text x="66" y="242" text-anchor="middle" font-size="18" font-weight="bold">0</text>
<text x="176" y="242" text-anchor="middle" font-size="18" font-weight="bold">1</text>
<text x="286" y="242" text-anchor="middle" font-size="18" font-weight="bold">2</text>
<text x="66" y="176" text-anchor="middle" font-size="14">前のまま</text>
<text x="176" y="176" text-anchor="middle" font-size="14">a を足す</text>
<text x="286" y="176" text-anchor="middle" font-size="14">後のまま</text>
<text x="121" y="212" text-anchor="middle" font-size="13">入って</text>
<text x="121" y="227" text-anchor="middle" font-size="13">a を足す</text>
<text x="231" y="227" text-anchor="middle" font-size="13">出る</text>
<text x="176" y="324" text-anchor="middle" font-size="14" fill="#666">空の区間を許すときだけ 0 → 2</text>
</svg>
