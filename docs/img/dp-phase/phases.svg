<svg viewBox="0 0 340 336" width="340" height="336" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="340" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f0f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern>
  </defs>
<text x="68" y="22" font-size="13" fill="#666" text-anchor="middle">0</text>
<text x="108" y="22" font-size="13" fill="#666" text-anchor="middle">1</text>
<text x="148" y="22" font-size="13" fill="#666" text-anchor="middle">2</text>
<text x="188" y="22" font-size="13" fill="#666" text-anchor="middle">3</text>
<text x="228" y="22" font-size="13" fill="#666" text-anchor="middle">4</text>
<text x="268" y="22" font-size="13" fill="#666" text-anchor="middle">5</text>
<text x="308" y="22" font-size="13" fill="#666" text-anchor="middle">6</text>
<text x="24" y="54" text-anchor="middle">a</text>
<rect x="48" y="30" width="40" height="38" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="68" y="55" text-anchor="middle" font-size="16">2</text>
<rect x="88" y="30" width="40" height="38" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="108" y="55" text-anchor="middle" font-size="16">−5</text>
<rect x="128" y="30" width="40" height="38" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
<text x="148" y="55" text-anchor="middle" font-size="16">3</text>
<rect x="168" y="30" width="40" height="38" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
<text x="188" y="55" text-anchor="middle" font-size="16">−1</text>
<rect x="208" y="30" width="40" height="38" fill="#e8f0fe" stroke="#333" stroke-width="1.5"/>
<text x="228" y="55" text-anchor="middle" font-size="16">4</text>
<rect x="248" y="30" width="40" height="38" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="268" y="55" text-anchor="middle" font-size="16">−6</text>
<rect x="288" y="30" width="40" height="38" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="308" y="55" text-anchor="middle" font-size="16">1</text>
