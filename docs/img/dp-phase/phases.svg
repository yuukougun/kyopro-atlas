<text x="24" y="121" text-anchor="middle" font-size="13">段階</text>
<rect x="48" y="98" width="80" height="36" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
<rect x="128" y="98" width="120" height="36" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2.5"/>
<rect x="248" y="98" width="80" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="88" y="121" text-anchor="middle" font-size="12">0：区間の前</text>
<text x="188" y="121" text-anchor="middle" font-size="12">1：区間の中</text>
<text x="288" y="121" text-anchor="middle" font-size="12">2：区間の後</text>
<g stroke="#333" stroke-width="1.8" fill="none">
<circle cx="66" cy="236" r="24" fill="url(#hatch)"/>
<circle cx="176" cy="236" r="24" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2.5"/>
<circle cx="286" cy="236" r="24" fill="#ffffff" stroke-dasharray="6 4"/>
<line x1="92" y1="236" x2="148" y2="236" marker-end="url(#arr)"/>
<line x1="202" y1="236" x2="258" y2="236" marker-end="url(#arr)"/>
<path d="M56,214 C40,174 92,174 76,214" marker-end="url(#arr)"/>
<path d="M166,214 C150,174 202,174 186,214" marker-end="url(#arr)"/>
<path d="M276,214 C260,174 312,174 296,214" marker-end="url(#arr)"/>
<path d="M74,259 C116,316 236,316 278,259" stroke="#999" stroke-dasharray="4 4" marker-end="url(#arr)"/>
