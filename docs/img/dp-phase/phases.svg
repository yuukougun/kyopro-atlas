<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 350" width="580" height="350" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="580" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f0f0f0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 添字 -->
  <g font-size="13" fill="#666" text-anchor="middle">
    <text x="97" y="26">0</text><text x="161" y="26">1</text><text x="225" y="26">2</text>
    <text x="289" y="26">3</text><text x="353" y="26">4</text><text x="417" y="26">5</text><text x="481" y="26">6</text>
  </g>
  <text x="40" y="58" text-anchor="middle">a</text>
  <!-- 列 -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="65" y="34" width="64" height="38" fill="#ffffff"/>
    <rect x="129" y="34" width="64" height="38" fill="#ffffff"/>
    <rect x="193" y="34" width="64" height="38" fill="#e8f0fe"/>
    <rect x="257" y="34" width="64" height="38" fill="#e8f0fe"/>
    <rect x="321" y="34" width="64" height="38" fill="#e8f0fe"/>
    <rect x="385" y="34" width="64" height="38" fill="#ffffff"/>
    <rect x="449" y="34" width="64" height="38" fill="#ffffff"/>
  </g>
  <rect x="193" y="34" width="192" height="38" fill="none" stroke="#1a56c4" stroke-width="3"/>
  <g text-anchor="middle" font-size="17">
    <text x="97" y="59">2</text><text x="161" y="59">−5</text><text x="225" y="59">3</text>
    <text x="289" y="59">−1</text><text x="353" y="59">4</text><text x="417" y="59">−6</text><text x="481" y="59">1</text>
  </g>
  <text x="530" y="59" font-size="14" fill="#1a56c4">和 6</text>

  <!-- 段階の帯 -->
  <text x="40" y="111" text-anchor="middle" font-size="13">段階</text>
  <rect x="65" y="88" width="128" height="36" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
  <rect x="193" y="88" width="192" height="36" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2.5"/>
  <rect x="385" y="88" width="128" height="36" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="129" y="111">0：区間の前</text>
    <text x="289" y="111">1：区間の中</text>
    <text x="449" y="111">2：区間の後</text>
  </g>

  <!-- 状態遷移図 -->
  <g transform="translate(0,-30)">
  <g stroke="#333" stroke-width="1.8" fill="none">
    <circle cx="140" cy="262" r="30" fill="url(#hatch)"/>
    <circle cx="300" cy="262" r="30" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2.5"/>
    <circle cx="460" cy="262" r="30" fill="#ffffff" stroke-dasharray="6 4"/>
    <!-- 0→1, 1→2 -->
    <line x1="172" y1="262" x2="266" y2="262" marker-end="url(#arr)"/>
    <line x1="332" y1="262" x2="426" y2="262" marker-end="url(#arr)"/>
    <!-- 自己ループ -->
    <path d="M128,234 C110,190 170,190 152,234" marker-end="url(#arr)"/>
    <path d="M288,234 C270,190 330,190 312,234" marker-end="url(#arr)"/>
    <path d="M448,234 C430,190 490,190 472,234" marker-end="url(#arr)"/>
    <!-- 0→2（空の区間を許すときだけ） -->
    <path d="M150,291 C200,370 400,370 450,291" stroke="#999" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  </g>
  <g text-anchor="middle" font-size="18" font-weight="bold">
    <text x="140" y="268">0</text><text x="300" y="268">1</text><text x="460" y="268">2</text>
  </g>
  <g text-anchor="middle" font-size="15">
    <text x="140" y="186">前のまま</text>
    <text x="300" y="186">a を足す</text>
    <text x="460" y="186">後のまま</text>
    <text x="219" y="233" font-size="14">入って</text>
    <text x="219" y="251" font-size="14">a を足す</text>
    <text x="379" y="252">出る</text>
    <text x="300" y="368" fill="#666">空の区間を許すときだけ 0 → 2</text>
  </g>
  </g>
</svg>
