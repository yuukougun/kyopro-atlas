<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 400" width="370" height="400" font-family="sans-serif" font-size="16">
<rect width="370" height="400" fill="#ffffff"/>
<text x="10" y="24" fill="#333333">木にない組の距離は道の辺の和なので、</text>
<text x="10" y="44" fill="#333333">道のどの辺よりも長い</text>
<g stroke="#333333" stroke-width="2.5">
<line x1="30" y1="230" x2="120" y2="150"/>
<line x1="120" y1="150" x2="172" y2="230"/>
<line x1="120" y1="150" x2="232" y2="150"/>
<line x1="232" y1="150" x2="330" y2="230"/>
</g>
<path d="M 30 230 Q 180 340 330 230" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<g fill="#333333">
<text x="63" y="184" text-anchor="middle">2</text>
<text x="156" y="190" text-anchor="middle">1</text>
<text x="172" y="140" text-anchor="middle">3</text>
<text x="293" y="184" text-anchor="middle">2</text>
</g>
<text x="180" y="320" text-anchor="middle" fill="#c0392b">d(0, 4) = 2 + 3 + 2 = 7</text>
<g fill="#ffffff" stroke="#333333" stroke-width="2">
<circle cx="30" cy="230" r="18"/>
<circle cx="120" cy="150" r="18"/>
<circle cx="172" cy="230" r="18"/>
<circle cx="232" cy="150" r="18"/>
<circle cx="330" cy="230" r="18"/>
</g><g text-anchor="middle" fill="#000000">
<text x="30" y="236">0</text>
<text x="120" y="156">1</text>
<text x="172" y="236">2</text>
<text x="232" y="156">3</text>
<text x="330" y="236">4</text>
</g>
<g fill="#333333"><line x1="20" y1="360" x2="60" y2="360" stroke="#333333" stroke-width="2.5"/><text x="68" y="365">木の辺</text><line x1="160" y1="360" x2="200" y2="360" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/><text x="208" y="365">木にない組</text></g>
</svg>
