<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 215" font-family="sans-serif" font-size="16">
  <rect width="640" height="215" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" fill="#333333">訪問順 q = (0, 5, 2, 4, 1, 3)。位置 5 の頂点 3 の親になれるのはどれか</text>
  <!-- position labels -->
  <g text-anchor="middle" font-size="16" fill="#555555">
    <text x="85" y="146">位置 0</text>
    <text x="175" y="146">1</text>
    <text x="265" y="146">2</text>
    <text x="355" y="146">3</text>
    <text x="445" y="146">4</text>
    <text x="535" y="146">5</text>
  </g>
  <!-- cells -->
  <g stroke="#333333" stroke-width="2">
    <rect x="60" y="82" width="50" height="44" fill="#ffffff"/>
    <rect x="150" y="82" width="50" height="44" fill="#ffffff"/>
    <rect x="240" y="82" width="50" height="44" fill="#ffffff"/>
    <rect x="330" y="82" width="50" height="44" fill="#dff0d8"/>
    <rect x="420" y="82" width="50" height="44" fill="#dff0d8"/>
    <rect x="510" y="82" width="50" height="44" fill="#ffffff" stroke-width="3.5"/>
  </g>
  <g text-anchor="middle" font-size="20" fill="#000000">
    <text x="85" y="111">0</text>
    <text x="175" y="111">5</text>
    <text x="265" y="111">2</text>
    <text x="355" y="111">4</text>
    <text x="445" y="111">1</text>
    <text x="535" y="111">3</text>
  </g>
  <!-- bracket for candidates -->
  <path d="M 330 158 L 330 170 L 470 170 L 470 158" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="400" y="194" text-anchor="middle" fill="#2e7d32">親の候補（2 個）</text>
  <!-- previous greater arrow -->
  <path d="M 520 80 Q 445 40 370 80" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="445" y="52" text-anchor="middle" font-size="16" fill="#333333">左で 3 より大きい最後の値</text>
  <!-- invalid explanation -->
  <path d="M 60 158 L 60 170 L 290 170 L 290 158" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="175" y="194" text-anchor="middle" fill="#c0392b">候補にならない</text>
</svg>
