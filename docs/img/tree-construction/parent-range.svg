<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" font-family="sans-serif" font-size="16">
<rect width="380" height="240" fill="#ffffff"/>
<text x="10" y="22" fill="#333333">訪問順 q = (0, 5, 2, 4, 1, 3)。</text>
<text x="10" y="42" fill="#333333">位置 5 の頂点 3 の親になれるのはどれか</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/></marker></defs>
<g text-anchor="middle" fill="#555555">
<text x="53" y="176">位置 0</text>
<text x="109" y="176">1</text>
<text x="165" y="176">2</text>
<text x="221" y="176">3</text>
<text x="277" y="176">4</text>
<text x="333" y="176">5</text>
</g><g stroke="#333333" stroke-width="2">
<rect x="30" y="112" width="46" height="44" fill="#ffffff"/>
<rect x="86" y="112" width="46" height="44" fill="#ffffff"/>
<rect x="142" y="112" width="46" height="44" fill="#ffffff"/>
<rect x="198" y="112" width="46" height="44" fill="#dff0d8"/>
<rect x="254" y="112" width="46" height="44" fill="#dff0d8"/>
<rect x="310" y="112" width="46" height="44" fill="#ffffff" stroke-width="3.5"/>
</g><g text-anchor="middle" font-size="20" fill="#000000">
<text x="53" y="141">0</text>
<text x="109" y="141">5</text>
<text x="165" y="141">2</text>
<text x="221" y="141">4</text>
<text x="277" y="141">1</text>
<text x="333" y="141">3</text>
</g>
<path d="M 198 188 L 198 200 L 300 200 L 300 188" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
<text x="249" y="224" text-anchor="middle" fill="#2e7d32">親の候補（2 個）</text>
<path d="M 323 110 Q 277 74 231 110" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="370" y="74" text-anchor="end" fill="#333333">左で 3 より大きい最後の値</text>
<path d="M 30 188 L 30 200 L 188 200 L 188 188" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="109" y="224" text-anchor="middle" fill="#c0392b">候補にならない</text>
</svg>
