<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222" font-size="13">[0, 12) を区切った区間（帯の中の数が値）に、[2, 10) を値 4 にする代入をする</text>
<text x="20" y="60" fill="#222">① 代入の前</text>
<rect x="70" y="72" width="114" height="34" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="127.0" y="95" text-anchor="middle" fill="#222">0</text>
<rect x="184" y="72" width="76" height="34" fill="#fbe3c8" stroke="#333" stroke-width="1.5"/>
<text x="222.0" y="95" text-anchor="middle" fill="#222">2</text>
<rect x="260" y="72" width="152" height="34" fill="#d9efd6" stroke="#333" stroke-width="1.5"/>
<text x="336.0" y="95" text-anchor="middle" fill="#222">3</text>
<rect x="412" y="72" width="114" height="34" fill="#d6e6f5" stroke="#333" stroke-width="1.5"/>
<text x="469.0" y="95" text-anchor="middle" fill="#222">1</text>
<line x1="70" y1="106" x2="70" y2="114" stroke="#333"/>
<text x="70" y="130" text-anchor="middle" fill="#333" font-size="12">0</text>
<line x1="184" y1="106" x2="184" y2="114" stroke="#333"/>
<text x="184" y="130" text-anchor="middle" fill="#333" font-size="12">3</text>
<line x1="260" y1="106" x2="260" y2="114" stroke="#333"/>
<text x="260" y="130" text-anchor="middle" fill="#333" font-size="12">5</text>
<line x1="412" y1="106" x2="412" y2="114" stroke="#333"/>
<text x="412" y="130" text-anchor="middle" fill="#333" font-size="12">9</text>
<line x1="526" y1="106" x2="526" y2="114" stroke="#333"/>
<text x="526" y="130" text-anchor="middle" fill="#333" font-size="12">12（番兵）</text>
<text x="20" y="170" fill="#222">② split(2)・split(10) の後</text>
<rect x="70" y="182" width="76" height="34" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="108.0" y="205" text-anchor="middle" fill="#222">0</text>
<rect x="146" y="182" width="38" height="34" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="165.0" y="205" text-anchor="middle" fill="#222">0</text>
<rect x="184" y="182" width="76" height="34" fill="#fbe3c8" stroke="#333" stroke-width="1.5"/>
<text x="222.0" y="205" text-anchor="middle" fill="#222">2</text>
<rect x="260" y="182" width="152" height="34" fill="#d9efd6" stroke="#333" stroke-width="1.5"/>
<text x="336.0" y="205" text-anchor="middle" fill="#222">3</text>
<rect x="412" y="182" width="38" height="34" fill="#d6e6f5" stroke="#333" stroke-width="1.5"/>
<text x="431.0" y="205" text-anchor="middle" fill="#222">1</text>
<rect x="450" y="182" width="76" height="34" fill="#d6e6f5" stroke="#333" stroke-width="1.5"/>
<text x="488.0" y="205" text-anchor="middle" fill="#222">1</text>
<line x1="70" y1="216" x2="70" y2="224" stroke="#333"/>
<text x="70" y="240" text-anchor="middle" fill="#333" font-size="12">0</text>
<line x1="146" y1="216" x2="146" y2="224" stroke="#333"/>
<text x="146" y="240" text-anchor="middle" fill="#b00000" font-size="12" font-weight="bold">2</text>
<line x1="184" y1="216" x2="184" y2="224" stroke="#333"/>
<text x="184" y="240" text-anchor="middle" fill="#333" font-size="12">3</text>
<line x1="260" y1="216" x2="260" y2="224" stroke="#333"/>
<text x="260" y="240" text-anchor="middle" fill="#333" font-size="12">5</text>
<line x1="412" y1="216" x2="412" y2="224" stroke="#333"/>
<text x="412" y="240" text-anchor="middle" fill="#333" font-size="12">9</text>
<line x1="450" y1="216" x2="450" y2="224" stroke="#333"/>
<text x="450" y="240" text-anchor="middle" fill="#b00000" font-size="12" font-weight="bold">10</text>
<line x1="526" y1="216" x2="526" y2="224" stroke="#333"/>
<text x="526" y="240" text-anchor="middle" fill="#333" font-size="12">12（番兵）</text>
<text x="534" y="205" fill="#b00000" font-size="12">新しい左端</text>
<text x="534" y="221" fill="#b00000" font-size="12">2 と 10</text>
<text x="20" y="280" fill="#222">③ [2, 10) を消して 4 を入れた後</text>
<rect x="70" y="292" width="76" height="34" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="108.0" y="315" text-anchor="middle" fill="#222">0</text>
<rect x="146" y="292" width="304" height="34" fill="#f5d0d0" stroke="#333" stroke-width="1.5"/>
<text x="298.0" y="315" text-anchor="middle" fill="#222">4</text>
<rect x="450" y="292" width="76" height="34" fill="#d6e6f5" stroke="#333" stroke-width="1.5"/>
<text x="488.0" y="315" text-anchor="middle" fill="#222">1</text>
<line x1="70" y1="326" x2="70" y2="334" stroke="#333"/>
<text x="70" y="350" text-anchor="middle" fill="#333" font-size="12">0</text>
<line x1="146" y1="326" x2="146" y2="334" stroke="#333"/>
<text x="146" y="350" text-anchor="middle" fill="#333" font-size="12">2</text>
<line x1="450" y1="326" x2="450" y2="334" stroke="#333"/>
<text x="450" y="350" text-anchor="middle" fill="#333" font-size="12">10</text>
<line x1="526" y1="326" x2="526" y2="334" stroke="#333"/>
<text x="526" y="350" text-anchor="middle" fill="#333" font-size="12">12（番兵）</text>
<text x="20" y="400" fill="#555" font-size="12">帯の下の数は map のキー（区間の左端）。② で値は変わらず、区切りだけが増える</text>
</svg>
