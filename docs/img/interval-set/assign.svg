<text x="442.0" y="363" text-anchor="middle" fill="#222">1</text>
<line x1="24" y1="374" x2="24" y2="382" stroke="#333"/>
<text x="24" y="400" text-anchor="middle" fill="#333" font-size="16">0</text>
<line x1="100" y1="374" x2="100" y2="382" stroke="#333"/>
<text x="100" y="400" text-anchor="middle" fill="#333" font-size="16">2</text>
<line x1="404" y1="374" x2="404" y2="382" stroke="#333"/>
<text x="404" y="400" text-anchor="middle" fill="#333" font-size="16">10</text>
<line x1="480" y1="374" x2="480" y2="382" stroke="#333"/>
<text x="480" y="400" text-anchor="middle" fill="#333" font-size="16">12（番兵）</text>
<text x="16" y="440" fill="#555" font-size="16">帯の下の数は map のキー（区間の左端）。</text>
<text x="16" y="462" fill="#555" font-size="16">② で値は変わらず、区切りだけが増える</text>
</svg>
