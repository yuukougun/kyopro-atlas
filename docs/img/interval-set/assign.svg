<rect x="138" y="218" width="76" height="36" fill="#fbe3c8" stroke="#333" stroke-width="1.5"/>
<text x="176.0" y="243" text-anchor="middle" fill="#222">2</text>
<rect x="214" y="218" width="152" height="36" fill="#d9efd6" stroke="#333" stroke-width="1.5"/>
