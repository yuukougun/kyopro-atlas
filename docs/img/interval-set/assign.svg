<rect x="24" y="338" width="76" height="36" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="62.0" y="363" text-anchor="middle" fill="#222">0</text>
<rect x="100" y="338" width="304" height="36" fill="#f5d0d0" stroke="#333" stroke-width="1.5"/>
