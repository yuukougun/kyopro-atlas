<line x1="100" y1="254" x2="100" y2="262" stroke="#333"/>
<text x="100" y="280" text-anchor="middle" fill="#b00000" font-size="16" font-weight="bold">2</text>
<line x1="138" y1="254" x2="138" y2="262" stroke="#333"/>
<text x="138" y="280" text-anchor="middle" fill="#333" font-size="16">3</text>
<line x1="214" y1="254" x2="214" y2="262" stroke="#333"/>
<text x="214" y="280" text-anchor="middle" fill="#333" font-size="16">5</text>
<line x1="366" y1="254" x2="366" y2="262" stroke="#333"/>
<text x="366" y="280" text-anchor="middle" fill="#333" font-size="16">9</text>
<line x1="404" y1="254" x2="404" y2="262" stroke="#333"/>
