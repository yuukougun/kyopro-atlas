<line x1="480" y1="134" x2="480" y2="142" stroke="#333"/>
<text x="480" y="160" text-anchor="middle" fill="#333" font-size="16">12（番兵）</text>
<text x="16" y="206" fill="#222" font-size="17">② split(2)・split(10) の後（赤の太字は新しい左端 2 と 10）</text>
<rect x="24" y="218" width="76" height="36" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="62.0" y="243" text-anchor="middle" fill="#222">0</text>
