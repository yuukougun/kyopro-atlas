<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="sans-serif">
<rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
<text x="20" y="28" font-size="16" fill="#222">T = aabb に S = ab を埋め込む方法は 4 通り</text>
<text x="140" y="58" font-size="13" fill="#555" text-anchor="middle">1</text>
<text x="184" y="58" font-size="13" fill="#555" text-anchor="middle">2</text>
<text x="228" y="58" font-size="13" fill="#555" text-anchor="middle">3</text>
<text x="272" y="58" font-size="13" fill="#555" text-anchor="middle">4</text>
<text x="20" y="96" font-size="14" fill="#222">位置 (1, 3)</text>
<rect x="120" y="70" width="40" height="40" fill="#cfe3ff" stroke="#333" stroke-width="3"/>
<text x="140" y="97" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">a</text>
<rect x="164" y="70" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="184" y="97" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">a</text>
<rect x="208" y="70" width="40" height="40" fill="#cfe3ff" stroke="#333" stroke-width="3"/>
<text x="228" y="97" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">b</text>
<rect x="252" y="70" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="272" y="97" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">b</text>
<text x="310" y="87" font-size="15" fill="#0b4fa8" font-weight="bold">◎ 代表（最も左）</text>
<text x="310" y="106" font-size="14" fill="#444">1 と 3 の間は a で b ではない</text>
<text x="20" y="158" font-size="14" fill="#222">位置 (1, 4)</text>
<rect x="120" y="132" width="40" height="40" fill="#e6e6e6" stroke="#333" stroke-width="3" stroke-dasharray="5 3"/>
<text x="140" y="159" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">a</text>
<rect x="164" y="132" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="184" y="159" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">a</text>
<rect x="208" y="132" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="228" y="159" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">b</text>
<rect x="252" y="132" width="40" height="40" fill="#e6e6e6" stroke="#333" stroke-width="3" stroke-dasharray="5 3"/>
<text x="272" y="159" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">b</text>
<text x="310" y="149" font-size="15" fill="#555" font-weight="normal">× 代表でない</text>
<text x="310" y="168" font-size="14" fill="#444">1 と 4 の間に b（位置 3）がある</text>
<text x="20" y="220" font-size="14" fill="#222">位置 (2, 3)</text>
<rect x="120" y="194" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="140" y="221" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">a</text>
<rect x="164" y="194" width="40" height="40" fill="#e6e6e6" stroke="#333" stroke-width="3" stroke-dasharray="5 3"/>
<text x="184" y="221" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">a</text>
<rect x="208" y="194" width="40" height="40" fill="#e6e6e6" stroke="#333" stroke-width="3" stroke-dasharray="5 3"/>
<text x="228" y="221" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">b</text>
<rect x="252" y="194" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="272" y="221" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">b</text>
<text x="310" y="211" font-size="15" fill="#555" font-weight="normal">× 代表でない</text>
<text x="310" y="230" font-size="14" fill="#444">2 より前に a（位置 1）がある</text>
<text x="20" y="282" font-size="14" fill="#222">位置 (2, 4)</text>
<rect x="120" y="256" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="140" y="283" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">a</text>
<rect x="164" y="256" width="40" height="40" fill="#e6e6e6" stroke="#333" stroke-width="3" stroke-dasharray="5 3"/>
<text x="184" y="283" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">a</text>
<rect x="208" y="256" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="228" y="283" font-size="18" text-anchor="middle" fill="#111" font-weight="normal">b</text>
<rect x="252" y="256" width="40" height="40" fill="#e6e6e6" stroke="#333" stroke-width="3" stroke-dasharray="5 3"/>
<text x="272" y="283" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">b</text>
<text x="310" y="273" font-size="15" fill="#555" font-weight="normal">× 代表でない</text>
<text x="310" y="292" font-size="14" fill="#444">2 より前に a、間に b がある</text>
</svg>