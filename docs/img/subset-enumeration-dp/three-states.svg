<svg width="480" height="330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" font-family="sans-serif" font-size="16">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="28" fill="#222" font-size="16">集合 S とグループ T の組で、各要素は 3 通り</text>
<text x="200" y="62" fill="#666" font-size="14" text-anchor="middle">要素 3</text>
<text x="260" y="62" fill="#666" font-size="14" text-anchor="middle">要素 2</text>
<text x="320" y="62" fill="#666" font-size="14" text-anchor="middle">要素 1</text>
<text x="380" y="62" fill="#666" font-size="14" text-anchor="middle">要素 0</text>
<text x="16" y="93" fill="#222">S = 1101</text>
<rect x="182" y="74" width="36" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="200" y="94" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="242" y="74" width="36" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="260" y="94" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="302" y="74" width="36" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="320" y="94" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<rect x="362" y="74" width="36" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="380" y="94" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<text x="16" y="133" fill="#222">T = 0101</text>
<rect x="182" y="114" width="36" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="200" y="134" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<rect x="242" y="114" width="36" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="260" y="134" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="302" y="114" width="36" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="320" y="134" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<rect x="362" y="114" width="36" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="380" y="134" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<line x1="16" y1="156" x2="464" y2="156" stroke="#444" stroke-width="1.2"/>
<text x="16" y="186" fill="#222">要素の状態</text>
<rect x="176" y="168" width="48" height="28" rx="6" fill="#e6e6e6" stroke="#444" stroke-width="1.2"/>
<text x="200" y="188" fill="#222" text-anchor="middle" font-size="15">残り</text>
<rect x="236" y="168" width="48" height="28" rx="6" fill="#1f4e9a" stroke="#444" stroke-width="1.2"/>
<text x="260" y="188" fill="#ffffff" text-anchor="middle" font-size="15">T</text>
<rect x="296" y="168" width="48" height="28" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="320" y="188" fill="#222" text-anchor="middle" font-size="15">外</text>
<rect x="356" y="168" width="48" height="28" rx="6" fill="#1f4e9a" stroke="#444" stroke-width="1.2"/>
<text x="380" y="188" fill="#ffffff" text-anchor="middle" font-size="15">T</text>
<rect x="16" y="210" width="30" height="20" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="56" y="226" fill="#222" font-size="14">外：S に入らない</text>
<rect x="16" y="238" width="30" height="20" rx="4" fill="#e6e6e6" stroke="#444" stroke-width="1.2"/>
<text x="56" y="254" fill="#222" font-size="14">残り：S に入り T に入らない（S ∖ T）</text>
<rect x="16" y="266" width="30" height="20" rx="4" fill="#1f4e9a" stroke="#444" stroke-width="1.2"/>
<text x="56" y="282" fill="#222" font-size="14">T：グループに入る</text>
<text x="16" y="316" fill="#222" font-size="15">要素ごとに 3 通りを選ぶと組 (S, T) が決まる → 全部で 3<tspan baseline-shift="super" font-size="11">N</tspan> 組</text>
</svg>
