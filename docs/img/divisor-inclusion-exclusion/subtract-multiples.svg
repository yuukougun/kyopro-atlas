<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 620" width="390" height="620" font-family="sans-serif">
<rect x="0" y="0" width="390" height="620" fill="#ffffff"/>
<text x="8" y="22" font-size="14" fill="#222">1 ≤ x, y ≤ 6 の組 (x, y) を gcd ごとに数える</text>
<text x="8" y="40" font-size="13" fill="#555">（g の大きい順に決める）</text>
<text x="56" y="68" font-size="12" text-anchor="end" fill="#555">gcd →</text>
<text x="86" y="68" font-size="15" text-anchor="middle" fill="#222">1</text>
<text x="138" y="68" font-size="15" text-anchor="middle" fill="#222">2</text>
<text x="190" y="68" font-size="15" text-anchor="middle" fill="#222">3</text>
<text x="242" y="68" font-size="15" text-anchor="middle" fill="#222">4</text>
<text x="294" y="68" font-size="15" text-anchor="middle" fill="#222">5</text>
<text x="346" y="68" font-size="15" text-anchor="middle" fill="#222">6</text>
<text x="54" y="101" font-size="14" text-anchor="end" fill="#222">g = 6</text>
<rect x="64" y="78" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="116" y="78" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="168" y="78" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="220" y="78" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="272" y="78" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="324" y="78" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="346" y="101" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">1</text>
<text x="54" y="147" font-size="14" text-anchor="end" fill="#222">g = 5</text>
<rect x="64" y="124" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="116" y="124" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="168" y="124" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="220" y="124" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="272" y="124" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="294" y="147" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">1</text>
<rect x="324" y="124" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<text x="54" y="193" font-size="14" text-anchor="end" fill="#222">g = 4</text>
<rect x="64" y="170" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="116" y="170" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="168" y="170" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="220" y="170" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="242" y="193" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">1</text>
<rect x="272" y="170" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="324" y="170" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<text x="54" y="239" font-size="14" text-anchor="end" fill="#222">g = 3</text>
<rect x="64" y="216" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="116" y="216" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="168" y="216" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="190" y="239" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">3</text>
<rect x="220" y="216" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="272" y="216" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="324" y="216" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="346" y="239" font-size="14" text-anchor="middle" fill="#444">−1</text>
<text x="54" y="285" font-size="14" text-anchor="end" fill="#222">g = 2</text>
<rect x="64" y="262" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="116" y="262" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="138" y="285" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">7</text>
<rect x="168" y="262" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="220" y="262" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="242" y="285" font-size="14" text-anchor="middle" fill="#444">−1</text>
<rect x="272" y="262" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="324" y="262" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="346" y="285" font-size="14" text-anchor="middle" fill="#444">−1</text>
<text x="54" y="331" font-size="14" text-anchor="end" fill="#222">g = 1</text>
<rect x="64" y="308" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="86" y="331" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">23</text>
<rect x="116" y="308" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="138" y="331" font-size="14" text-anchor="middle" fill="#444">−7</text>
<rect x="168" y="308" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="190" y="331" font-size="14" text-anchor="middle" fill="#444">−3</text>
<rect x="220" y="308" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="242" y="331" font-size="14" text-anchor="middle" fill="#444">−1</text>
<rect x="272" y="308" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="294" y="331" font-size="14" text-anchor="middle" fill="#444">−1</text>
<rect x="324" y="308" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="346" y="331" font-size="14" text-anchor="middle" fill="#444">−1</text>
<text x="8" y="368" font-size="13" fill="#555">F(g) = ⌊6/g⌋² から、倍数の位置の f を引く</text>
<text x="8" y="388" font-size="13" fill="#222">g = 6：F(6) = 1² = 1 → f(6) = 1</text>
<text x="8" y="408" font-size="13" fill="#222">g = 5：F(5) = 1² = 1 → f(5) = 1</text>
<text x="8" y="428" font-size="13" fill="#222">g = 4：F(4) = 1² = 1 → f(4) = 1</text>
<text x="8" y="448" font-size="13" fill="#222">g = 3：F(3) = 2² = 4 → f(3) = 4 − 1 = 3</text>
<text x="8" y="468" font-size="13" fill="#222">g = 2：F(2) = 3² = 9 → f(2) = 9 − 1 − 1 = 7</text>
<text x="8" y="488" font-size="13" fill="#222">g = 1：F(1) = 6² = 36</text>
<text x="8" y="508" font-size="13" fill="#222">　→ f(1) = 36 − 7 − 3 − 1 − 1 − 1 = 23</text>
<rect x="8" y="521" width="22" height="16" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="38" y="534" font-size="13" fill="#222">この行で決まる f(g)</text>
<rect x="8" y="545" width="22" height="16" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="38" y="558" font-size="13" fill="#222">決まっている f(2g), f(3g), … を引く</text>
<text x="8" y="586" font-size="13" fill="#222">答え：gcd が 1 の組は f(1) = 23 個</text>
<text x="8" y="606" font-size="13" fill="#222">gcd の総和は Σ g·f(g) = 61</text>
</svg>
