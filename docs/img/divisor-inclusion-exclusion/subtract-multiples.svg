<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="720" height="416" font-family="sans-serif">
<rect x="0" y="0" width="720" height="416" fill="#ffffff"/>
<text x="360.0" y="24" font-size="16" text-anchor="middle" fill="#222">1 ≤ x, y ≤ 6 の組 (x, y) を gcd ごとに数える（g の大きい順）</text>
<text x="100" y="56" font-size="13" text-anchor="end" fill="#555">gcd の値 →</text>
<text x="136.0" y="56" font-size="15" text-anchor="middle" fill="#222">1</text>
<text x="188.0" y="56" font-size="15" text-anchor="middle" fill="#222">2</text>
<text x="240.0" y="56" font-size="15" text-anchor="middle" fill="#222">3</text>
<text x="292.0" y="56" font-size="15" text-anchor="middle" fill="#222">4</text>
<text x="344.0" y="56" font-size="15" text-anchor="middle" fill="#222">5</text>
<text x="396.0" y="56" font-size="15" text-anchor="middle" fill="#222">6</text>
<text x="442" y="56" font-size="13" fill="#555">F(g) = ⌊6/g⌋² から倍数側を引く</text>
<text x="96" y="98.0" font-size="15" text-anchor="end" fill="#222">g = 6</text>
<rect x="114" y="75" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="166" y="75" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="218" y="75" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="270" y="75" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="322" y="75" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="374" y="75" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="396.0" y="98.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">1</text>
<text x="442" y="90.0" font-size="14" fill="#222">f(6) = F(6) = 1</text>
<text x="442" y="107.0" font-size="13" fill="#666">F(6) = 1² = 1</text>
<text x="96" y="144.0" font-size="15" text-anchor="end" fill="#222">g = 5</text>
<rect x="114" y="121" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="166" y="121" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="218" y="121" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="270" y="121" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="322" y="121" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="344.0" y="144.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">1</text>
<rect x="374" y="121" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<text x="442" y="136.0" font-size="14" fill="#222">f(5) = F(5) = 1</text>
<text x="442" y="153.0" font-size="13" fill="#666">F(5) = 1² = 1</text>
<text x="96" y="190.0" font-size="15" text-anchor="end" fill="#222">g = 4</text>
<rect x="114" y="167" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="166" y="167" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="218" y="167" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="270" y="167" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="292.0" y="190.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">1</text>
<rect x="322" y="167" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="374" y="167" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<text x="442" y="182.0" font-size="14" fill="#222">f(4) = F(4) = 1</text>
<text x="442" y="199.0" font-size="13" fill="#666">F(4) = 1² = 1</text>
<text x="96" y="236.0" font-size="15" text-anchor="end" fill="#222">g = 3</text>
<rect x="114" y="213" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="166" y="213" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="218" y="213" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="240.0" y="236.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">3</text>
<rect x="270" y="213" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="322" y="213" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="374" y="213" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="396.0" y="236.0" font-size="14" text-anchor="middle" fill="#444">−1</text>
<text x="442" y="228.0" font-size="14" fill="#222">f(3) = 4 − 1 = 3</text>
<text x="442" y="245.0" font-size="13" fill="#666">F(3) = 2² = 4</text>
<text x="96" y="282.0" font-size="15" text-anchor="end" fill="#222">g = 2</text>
<rect x="114" y="259" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="166" y="259" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="188.0" y="282.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">7</text>
<rect x="218" y="259" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="270" y="259" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="292.0" y="282.0" font-size="14" text-anchor="middle" fill="#444">−1</text>
<rect x="322" y="259" width="44" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="374" y="259" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="396.0" y="282.0" font-size="14" text-anchor="middle" fill="#444">−1</text>
<text x="442" y="274.0" font-size="14" fill="#222">f(2) = 9 − 1 − 1 = 7</text>
<text x="442" y="291.0" font-size="13" fill="#666">F(2) = 3² = 9</text>
<text x="96" y="328.0" font-size="15" text-anchor="end" fill="#222">g = 1</text>
<rect x="114" y="305" width="44" height="36" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="136.0" y="328.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#123c7a">23</text>
<rect x="166" y="305" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="188.0" y="328.0" font-size="14" text-anchor="middle" fill="#444">−7</text>
<rect x="218" y="305" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="240.0" y="328.0" font-size="14" text-anchor="middle" fill="#444">−3</text>
<rect x="270" y="305" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="292.0" y="328.0" font-size="14" text-anchor="middle" fill="#444">−1</text>
<rect x="322" y="305" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="344.0" y="328.0" font-size="14" text-anchor="middle" fill="#444">−1</text>
<rect x="374" y="305" width="44" height="36" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="396.0" y="328.0" font-size="14" text-anchor="middle" fill="#444">−1</text>
<text x="442" y="320.0" font-size="14" fill="#222">f(1) = 36 − 7 − 3 − 1 − 1 − 1 = 23</text>
<text x="442" y="337.0" font-size="13" fill="#666">F(1) = 6² = 36</text>
<rect x="110" y="355" width="22" height="16" fill="#cfe3ff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="140" y="368" font-size="13" fill="#222">この行で決まる f(g)</text>
<rect x="320" y="355" width="22" height="16" fill="#eeeeee" stroke="#777" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="350" y="368" font-size="13" fill="#222">決まっている f(2g), f(3g), … を引く</text>
<text x="110" y="394" font-size="13" fill="#222">答え：gcd が 1 の組は f(1) = 23 個、gcd の総和は Σ g·f(g) = 61</text>
</svg>
