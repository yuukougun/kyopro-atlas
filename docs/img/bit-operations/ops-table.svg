<svg xmlns="http://www.w3.org/2000/svg" width="480" height="333" viewBox="0 0 480 333" font-family="sans-serif" font-size="16">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0 0)">
<text x="16" y="28" fill="#222" font-size="17">桁をそろえて bit ごとに計算する（a = 12, b = 10）</text>
<text x="130" y="58" fill="#666" font-size="14" text-anchor="middle">bit 3</text>
<text x="170" y="58" fill="#666" font-size="14" text-anchor="middle">bit 2</text>
<text x="210" y="58" fill="#666" font-size="14" text-anchor="middle">bit 1</text>
<text x="250" y="58" fill="#666" font-size="14" text-anchor="middle">bit 0</text>
<text x="16" y="90" fill="#222">a</text>
<rect x="115" y="70" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="130" y="90" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="155" y="70" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="170" y="90" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="195" y="70" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="210" y="90" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<rect x="235" y="70" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="250" y="90" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<text x="285" y="90" fill="#222">= 12</text>
<text x="16" y="130" fill="#222">b</text>
<rect x="115" y="110" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="130" y="130" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="155" y="110" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="170" y="130" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<rect x="195" y="110" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="210" y="130" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="235" y="110" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="250" y="130" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<text x="285" y="130" fill="#222">= 10</text>
<line x1="16" y1="148" x2="464" y2="148" stroke="#444" stroke-width="1.5"/>
<text x="16" y="170" fill="#222">a AND b</text>
<rect x="115" y="150" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="130" y="170" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="155" y="150" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="170" y="170" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<rect x="195" y="150" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="210" y="170" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<rect x="235" y="150" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="250" y="170" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<text x="285" y="170" fill="#222">= 8</text>
<text x="335" y="170" fill="#555" font-size="14">両方 1 なら 1</text>
<text x="16" y="210" fill="#222">a OR b</text>
<rect x="115" y="190" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="130" y="210" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="155" y="190" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="170" y="210" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="195" y="190" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="210" y="210" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="235" y="190" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="250" y="210" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<text x="285" y="210" fill="#222">= 14</text>
<text x="335" y="210" fill="#555" font-size="14">どちらか 1 なら 1</text>
<text x="16" y="250" fill="#222">a XOR b</text>
<rect x="115" y="230" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="130" y="250" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<rect x="155" y="230" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="170" y="250" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="195" y="230" width="30" height="28" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="210" y="250" fill="#222" text-anchor="middle" font-weight="bold">1</text>
<rect x="235" y="230" width="30" height="28" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.2"/>
<text x="250" y="250" fill="#222" text-anchor="middle" font-weight="normal">0</text>
<text x="285" y="250" fill="#222">= 6</text>
<text x="335" y="250" fill="#555" font-size="14">異なれば 1</text>
<text x="16" y="294" fill="#222">a + b = 22 = (a XOR b) + 2 × (a AND b) = 6 + 2 × 8</text>
<text x="16" y="320" fill="#555" font-size="14">XOR は繰り上がりを無視した和、AND は繰り上がりの出る桁</text>
</g>
</svg>
