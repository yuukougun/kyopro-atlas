<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="28" fill="#222">dp[l][r]：区間 [l, r) を 1 つにする最小コスト（A = 2, 5, 1, 3）</text>
<text x="24" y="50" fill="#555" font-size="14">dp[0][4] は同じ行の左（dp[0][m]）と同じ列の下（dp[m][4]）を使う</text>
<text x="294" y="76" text-anchor="middle" fill="#222">r →</text>
<text x="186.0" y="90" dy="-2" text-anchor="middle" fill="#222" font-size="15"></text>
<text x="258.0" y="90" dy="-2" text-anchor="middle" fill="#222" font-size="15"></text>
<text x="330.0" y="90" dy="-2" text-anchor="middle" fill="#222" font-size="15"></text>
<text x="402.0" y="90" dy="-2" text-anchor="middle" fill="#222" font-size="15"></text>
<text x="186.0" y="318" text-anchor="middle" fill="#222">r = 1</text>
<text x="258.0" y="318" text-anchor="middle" fill="#222">r = 2</text>
<text x="330.0" y="318" text-anchor="middle" fill="#222">r = 3</text>
<text x="402.0" y="318" text-anchor="middle" fill="#222">r = 4</text>
<text x="138" y="121.0" text-anchor="end" fill="#222">l = 0</text>
<text x="138" y="173.0" text-anchor="end" fill="#222">l = 1</text>
<text x="138" y="225.0" text-anchor="end" fill="#222">l = 2</text>
<text x="138" y="277.0" text-anchor="end" fill="#222">l = 3</text>
<text x="90" y="199" text-anchor="end" fill="#222">l ↓</text>
<rect x="150" y="90" width="72" height="52" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="186.0" y="122.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">0</text>
<text x="218" y="103" text-anchor="end" fill="#666" font-size="12">長さ 1</text>
<rect x="222" y="90" width="72" height="52" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="258.0" y="122.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">7</text>
<text x="290" y="103" text-anchor="end" fill="#666" font-size="12">長さ 2</text>
<rect x="294" y="90" width="72" height="52" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="330.0" y="122.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">14</text>
<text x="362" y="103" text-anchor="end" fill="#666" font-size="12">長さ 3</text>
<rect x="366" y="90" width="72" height="52" fill="#ffe0b3" stroke="#b35900" stroke-width="3"/>
<text x="402.0" y="122.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">22</text>
<text x="434" y="103" text-anchor="end" fill="#666" font-size="12">長さ 4</text>
<rect x="150" y="142" width="72" height="52" fill="#eeeeee" stroke="#bbb"/>
<rect x="222" y="142" width="72" height="52" fill="#ffffff" stroke="#888"/>
<text x="258.0" y="174.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">0</text>
<text x="290" y="155" text-anchor="end" fill="#666" font-size="12">長さ 1</text>
<rect x="294" y="142" width="72" height="52" fill="#ffffff" stroke="#888"/>
<text x="330.0" y="174.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">6</text>
<text x="362" y="155" text-anchor="end" fill="#666" font-size="12">長さ 2</text>
<rect x="366" y="142" width="72" height="52" fill="#d9f2d9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="402.0" y="174.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">13</text>
<text x="434" y="155" text-anchor="end" fill="#666" font-size="12">長さ 3</text>
<rect x="150" y="194" width="72" height="52" fill="#eeeeee" stroke="#bbb"/>
<rect x="222" y="194" width="72" height="52" fill="#eeeeee" stroke="#bbb"/>
<rect x="294" y="194" width="72" height="52" fill="#ffffff" stroke="#888"/>
<text x="330.0" y="226.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">0</text>
<text x="362" y="207" text-anchor="end" fill="#666" font-size="12">長さ 1</text>
<rect x="366" y="194" width="72" height="52" fill="#d9f2d9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="402.0" y="226.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">4</text>
<text x="434" y="207" text-anchor="end" fill="#666" font-size="12">長さ 2</text>
<rect x="150" y="246" width="72" height="52" fill="#eeeeee" stroke="#bbb"/>
<rect x="222" y="246" width="72" height="52" fill="#eeeeee" stroke="#bbb"/>
<rect x="294" y="246" width="72" height="52" fill="#eeeeee" stroke="#bbb"/>
<rect x="366" y="246" width="72" height="52" fill="#d9f2d9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="402.0" y="278.0" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">0</text>
<text x="434" y="259" text-anchor="end" fill="#666" font-size="12">長さ 1</text>
<rect x="462" y="90" width="22" height="22" fill="#ffe0b3" stroke="#b35900" stroke-width="2" />
<text x="492" y="106" fill="#222" font-size="15">求める値 dp[0][4]</text>
<rect x="462" y="124" width="22" height="22" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2" />
<text x="492" y="140" fill="#222" font-size="15">同じ行：dp[0][m]</text>
<rect x="462" y="158" width="22" height="22" fill="#d9f2d9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="492" y="174" fill="#222" font-size="15">同じ列：dp[m][4]</text>
<rect x="462" y="192" width="22" height="22" fill="#eeeeee" stroke="#bbb" stroke-width="2" />
<text x="492" y="208" fill="#222" font-size="15">使わない（r ≤ l）</text>
<text x="24" y="358" fill="#222" font-size="15">l を昇順に回すと、dp[1][4]・dp[2][4] がまだ空である</text>
</svg>
