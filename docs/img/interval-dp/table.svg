<svg width="340" height="464" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 464" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0 1)">
<text x="10" y="22" fill="#222">dp[l][r]：区間 [l, r) を 1 つにする最小コスト</text>
<text x="10" y="42" fill="#222">（A = 2, 5, 1, 3）</text>
<text x="10" y="64" fill="#555" font-size="13">dp[0][4] は同じ行の左（dp[0][m]）と</text>
<text x="10" y="82" fill="#555" font-size="13">同じ列の下（dp[m][4]）を使う</text>
<text x="188" y="108" text-anchor="middle" fill="#222">r →</text>
<text x="56" y="108" text-anchor="end" fill="#222">l ↓</text>
<text x="56" y="147" text-anchor="end" fill="#222">l = 0</text>
<text x="56" y="195" text-anchor="end" fill="#222">l = 1</text>
<text x="56" y="243" text-anchor="end" fill="#222">l = 2</text>
<text x="56" y="291" text-anchor="end" fill="#222">l = 3</text>
<text x="95" y="330" text-anchor="middle" fill="#222">r = 1</text>
<text x="157" y="330" text-anchor="middle" fill="#222">r = 2</text>
<text x="219" y="330" text-anchor="middle" fill="#222">r = 3</text>
<text x="281" y="330" text-anchor="middle" fill="#222">r = 4</text>
<rect x="64" y="118" width="62" height="48" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="122" y="132" text-anchor="end" fill="#666" font-size="12">長さ 1</text>
<text x="95" y="156" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">0</text>
<rect x="126" y="118" width="62" height="48" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="184" y="132" text-anchor="end" fill="#666" font-size="12">長さ 2</text>
<text x="157" y="156" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">7</text>
<rect x="188" y="118" width="62" height="48" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="246" y="132" text-anchor="end" fill="#666" font-size="12">長さ 3</text>
<text x="219" y="156" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">14</text>
<rect x="250" y="118" width="62" height="48" fill="#ffe0b3" stroke="#b35900" stroke-width="3"/>
<text x="308" y="132" text-anchor="end" fill="#666" font-size="12">長さ 4</text>
<text x="281" y="156" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">22</text>
<rect x="64" y="166" width="62" height="48" fill="#eeeeee" stroke="#bbb"/>
<rect x="126" y="166" width="62" height="48" fill="#ffffff" stroke="#888"/>
<text x="184" y="180" text-anchor="end" fill="#666" font-size="12">長さ 1</text>
<text x="157" y="204" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">0</text>
<rect x="188" y="166" width="62" height="48" fill="#ffffff" stroke="#888"/>
<text x="246" y="180" text-anchor="end" fill="#666" font-size="12">長さ 2</text>
<text x="219" y="204" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">6</text>
<rect x="250" y="166" width="62" height="48" fill="#d9f2d9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="308" y="180" text-anchor="end" fill="#666" font-size="12">長さ 3</text>
<text x="281" y="204" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">13</text>
<rect x="64" y="214" width="62" height="48" fill="#eeeeee" stroke="#bbb"/>
<rect x="126" y="214" width="62" height="48" fill="#eeeeee" stroke="#bbb"/>
<rect x="188" y="214" width="62" height="48" fill="#ffffff" stroke="#888"/>
<text x="246" y="228" text-anchor="end" fill="#666" font-size="12">長さ 1</text>
<text x="219" y="252" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">0</text>
<rect x="250" y="214" width="62" height="48" fill="#d9f2d9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="308" y="228" text-anchor="end" fill="#666" font-size="12">長さ 2</text>
<text x="281" y="252" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">4</text>
<rect x="64" y="262" width="62" height="48" fill="#eeeeee" stroke="#bbb"/>
<rect x="126" y="262" width="62" height="48" fill="#eeeeee" stroke="#bbb"/>
<rect x="188" y="262" width="62" height="48" fill="#eeeeee" stroke="#bbb"/>
<rect x="250" y="262" width="62" height="48" fill="#d9f2d9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="308" y="276" text-anchor="end" fill="#666" font-size="12">長さ 1</text>
<text x="281" y="300" text-anchor="middle" fill="#222" font-size="17" font-weight="bold">0</text>
<rect x="10" y="354" width="18" height="18" fill="#ffe0b3" stroke="#b35900" stroke-width="2"/>
<text x="34" y="368" fill="#222" font-size="13">求める値 dp[0][4]</text>
<rect x="170" y="354" width="18" height="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="194" y="368" fill="#222" font-size="13">同じ行：dp[0][m]</text>
<rect x="10" y="382" width="18" height="18" fill="#d9f2d9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
<text x="34" y="396" fill="#222" font-size="13">同じ列：dp[m][4]</text>
<rect x="170" y="382" width="18" height="18" fill="#eeeeee" stroke="#bbb" stroke-width="2"/>
<text x="194" y="396" fill="#222" font-size="13">使わない（r ≤ l）</text>
<text x="10" y="430" fill="#222">l を昇順に回すと、dp[1][4]・dp[2][4] が</text>
<text x="10" y="450" fill="#222">まだ空である</text>
</g>
</svg>
