<rect x="200" y="50" width="200" height="46" rx="6" fill="#ffe0b3" stroke="#b35900" stroke-width="2.5"/>
<text x="300.0" y="69" text-anchor="middle" fill="#222">[0, 4)　2 5 1 3</text>
<text x="300.0" y="88" text-anchor="middle" fill="#555" font-size="15">dp = 11 + 11 = 22</text>
<rect x="60" y="170" width="170" height="46" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
