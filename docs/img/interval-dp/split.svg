<svg width="340" height="230" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="10" y="22" fill="#222">最後の合体の境目 m で [0, 4) を 2 つに割る</text>
<text x="10" y="42" fill="#222">（A = 2, 5, 1, 3）</text>
<rect x="90" y="60" width="160" height="46" rx="6" fill="#ffe0b3" stroke="#b35900" stroke-width="2.5"/>
<text x="170" y="79" text-anchor="middle" fill="#222">[0, 4)　2 5 1 3</text>
<text x="170" y="98" text-anchor="middle" fill="#555" font-size="15">dp = 11 + 11 = 22</text>
<rect x="12" y="170" width="140" height="46" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="82" y="189" text-anchor="middle" fill="#222">[0, 2)　2 5</text>
<text x="82" y="208" text-anchor="middle" fill="#555" font-size="15">dp = 7</text>
<rect x="188" y="170" width="140" height="46" rx="6" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="258" y="189" text-anchor="middle" fill="#222">[2, 4)　1 3</text>
<text x="258" y="208" text-anchor="middle" fill="#555" font-size="15">dp = 4</text>
<line x1="140" y1="106" x2="82" y2="170" stroke="#444" stroke-width="1.5"/>
<line x1="200" y1="106" x2="258" y2="170" stroke="#444" stroke-width="1.5"/>
<text x="170" y="150" text-anchor="middle" fill="#b35900" font-size="16">m = 2</text>
</svg>
