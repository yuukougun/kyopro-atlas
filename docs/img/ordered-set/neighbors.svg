<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="sans-serif" font-size="14">
  <rect width="640" height="260" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- 上段：x = 10 -->
  <text x="20" y="28" font-size="15" fill="#222222">x = 10（集合にない値）</text>
  <line x1="40" y1="90" x2="600" y2="90" stroke="#888888" stroke-width="2"/>
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <rect x="40" y="75" width="56" height="30" rx="4" stroke-dasharray="5 3"/>
    <circle cx="200" cy="90" r="15"/>
    <circle cx="320" cy="90" r="15"/>
    <circle cx="480" cy="90" r="15"/>
    <rect x="544" y="75" width="56" height="30" rx="4" stroke-dasharray="5 3"/>
  </g>
  <g text-anchor="middle" fill="#222222">
    <text x="68" y="95">−INF</text>
    <text x="200" y="95">3</text>
    <text x="320" y="95">8</text>
    <text x="480" y="95">15</text>
    <text x="572" y="95">INF</text>
  </g>
  <line x1="400" y1="70" x2="400" y2="110" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="400" y="62" text-anchor="middle" fill="#c0392b">x = 10</text>
  <line x1="480" y1="140" x2="480" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="480" y="158" text-anchor="middle" fill="#222222">it = lower_bound(10)</text>
  <text x="480" y="176" text-anchor="middle" fill="#222222">x 以上の最小 = 15</text>
  <line x1="320" y1="140" x2="320" y2="110" stroke="#333333" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#ah)"/>
  <text x="300" y="158" text-anchor="middle" fill="#222222">prev(it)</text>
  <text x="300" y="176" text-anchor="middle" fill="#222222">x 未満の最大 = 8</text>
  <!-- 下段：x = 1 -->
  <text x="20" y="214" font-size="15" fill="#222222">x = 1 のとき：lower_bound は 3、prev は番兵 −INF（左に要素がない）</text>
  <text x="20" y="240" font-size="15" fill="#222222">x = 20 のとき：lower_bound は番兵 INF（右に要素がない）、prev は 15</text>
</svg>
