<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 301" width="400" height="301" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="400" height="301" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="16" y="26" font-size="15" fill="#222222">x = 10（集合にない値）</text>
  <line x1="16" y1="90" x2="384" y2="90" stroke="#888888" stroke-width="2"/>
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <rect x="16" y="75" width="50" height="30" rx="4" stroke-dasharray="5 3"/>
    <circle cx="110" cy="90" r="15"/>
    <circle cx="190" cy="90" r="15"/>
    <circle cx="300" cy="90" r="15"/>
    <rect x="334" y="75" width="50" height="30" rx="4" stroke-dasharray="5 3"/>
  </g>
  <g text-anchor="middle" fill="#222222">
    <text x="41" y="95">−INF</text>
    <text x="110" y="95">3</text>
    <text x="190" y="95">8</text>
    <text x="300" y="95">15</text>
    <text x="359" y="95">INF</text>
  </g>
  <line x1="245" y1="70" x2="245" y2="110" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="245" y="62" text-anchor="middle" fill="#c0392b">x = 10</text>
  <line x1="300" y1="140" x2="300" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="300" y="158" text-anchor="middle" fill="#222222">it =</text>
  <text x="300" y="176" text-anchor="middle" fill="#222222">lower_bound(10)</text>
  <text x="300" y="194" text-anchor="middle" fill="#222222">x 以上の最小 = 15</text>
  <line x1="190" y1="140" x2="190" y2="110" stroke="#333333" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#ah)"/>
  <text x="170" y="158" text-anchor="middle" fill="#222222">prev(it)</text>
  <text x="170" y="176" text-anchor="middle" fill="#222222">x 未満の最大 = 8</text>
  <text x="16" y="228" font-size="14" fill="#222222">x = 1 のとき：lower_bound は 3、prev は番兵</text>
  <text x="16" y="246" font-size="14" fill="#222222">−INF（左に要素がない）</text>
  <text x="16" y="272" font-size="14" fill="#222222">x = 20 のとき：lower_bound は番兵 INF</text>
  <text x="16" y="290" font-size="14" fill="#222222">（右に要素がない）、prev は 15</text>
</svg>
