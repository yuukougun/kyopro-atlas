<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="720" height="220" fill="#ffffff"/>
  <defs>
    <pattern id="h2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fde2b8"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#d98a1c" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- grid 0..i+1 rows, 0..j+1 cols; origin (40,40), cell 30 -->
  <rect x="40" y="40" width="150" height="120" fill="#e6eef8" stroke="#333" stroke-width="1.5"/>
  <rect x="40" y="40" width="150" height="150" fill="none" stroke="#2a5db0" stroke-width="3" stroke-dasharray="8 4"/>
  <rect x="40" y="40" width="180" height="120" fill="none" stroke="#2f7d32" stroke-width="3"/>
  <rect x="190" y="160" width="30" height="30" fill="url(#h2)" stroke="#333" stroke-width="2"/>
  <text x="115" y="105" text-anchor="middle" fill="#222">S[i][j]</text>
  <text x="115" y="125" text-anchor="middle" font-size="12" fill="#222">（2 回数えられる）</text>
  <text x="205" y="210" text-anchor="middle" font-size="13" fill="#222">a[i][j]</text>
  <!-- legend -->
  <line x1="270" y1="60" x2="310" y2="60" stroke="#2f7d32" stroke-width="3"/>
  <text x="320" y="65" fill="#222">実線：S[i][j+1]（行 [0, i)・列 [0, j+1)）</text>
  <line x1="270" y1="95" x2="310" y2="95" stroke="#2a5db0" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="320" y="100" fill="#222">破線：S[i+1][j]（行 [0, i+1)・列 [0, j)）</text>
  <rect x="275" y="118" width="30" height="20" fill="#e6eef8" stroke="#333"/>
  <text x="320" y="133" fill="#222">重なり：S[i][j]（1 回引く）</text>
  <rect x="275" y="150" width="30" height="20" fill="url(#h2)" stroke="#333"/>
  <text x="320" y="165" fill="#222">斜線：新しいマス a[i][j]</text>
  <text x="270" y="200" font-size="14" fill="#222" font-weight="bold">S[i+1][j+1] ＝ S[i][j+1] + S[i+1][j] − S[i][j] + a[i][j]</text>
</svg>
