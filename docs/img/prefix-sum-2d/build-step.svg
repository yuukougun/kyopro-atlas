<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="420" height="440" fill="#ffffff"/>
  <defs>
    <pattern id="h2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fde2b8"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#d98a1c" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- grid 0..i+1 rows, 0..j+1 cols; origin (110,30), cell 30 -->
  <rect x="110" y="30" width="150" height="120" fill="#e6eef8" stroke="#333" stroke-width="1.5"/>
  <rect x="110" y="30" width="150" height="150" fill="none" stroke="#2a5db0" stroke-width="3" stroke-dasharray="8 4"/>
  <rect x="110" y="30" width="180" height="120" fill="none" stroke="#2f7d32" stroke-width="3"/>
  <rect x="260" y="150" width="30" height="30" fill="url(#h2)" stroke="#333" stroke-width="2"/>
  <text x="185" y="95" text-anchor="middle" fill="#222">S[i][j]</text>
  <text x="185" y="117" text-anchor="middle" font-size="13" fill="#222">（2 回数えられる）</text>
  <text x="275" y="202" text-anchor="middle" font-size="14" fill="#222">a[i][j]</text>
  <!-- legend -->
  <line x1="16" y1="240" x2="56" y2="240" stroke="#2f7d32" stroke-width="3"/>
  <text x="66" y="245" fill="#222">実線：S[i][j+1]（行 [0, i)・列 [0, j+1)）</text>
  <line x1="16" y1="275" x2="56" y2="275" stroke="#2a5db0" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="66" y="280" fill="#222">破線：S[i+1][j]（行 [0, i+1)・列 [0, j)）</text>
  <rect x="21" y="298" width="30" height="20" fill="#e6eef8" stroke="#333"/>
  <text x="66" y="313" fill="#222">重なり：S[i][j]（1 回引く）</text>
  <rect x="21" y="330" width="30" height="20" fill="url(#h2)" stroke="#333"/>
  <text x="66" y="345" fill="#222">斜線：新しいマス a[i][j]</text>
  <text x="16" y="390" fill="#222" font-weight="bold">S[i+1][j+1] ＝ S[i][j+1] + S[i+1][j]</text>
  <text x="108" y="418" fill="#222" font-weight="bold">− S[i][j] + a[i][j]</text>
</svg>
