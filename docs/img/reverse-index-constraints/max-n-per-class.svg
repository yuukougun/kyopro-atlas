<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 368" width="400" height="368" font-family="sans-serif">
<rect width="400" height="368" fill="#ffffff"/>
<text x="8" y="16" font-size="12" font-weight="bold" fill="#222">1 秒に収まる N の上限（定数倍 1 とした値）</text>
<rect x="8" y="25" width="16" height="9" fill="#3b6ea5"/>
<text x="28" y="33" font-size="11" fill="#222">10⁸ 回まで</text>
<rect x="100" y="25" width="16" height="9" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2"/>
<text x="120" y="33" font-size="11" fill="#222">10⁹ 回まで（軽い処理なら）</text>
<text x="8" y="58" font-size="11" fill="#555">計算量</text>
<text x="142" y="58" font-size="11" fill="#555" text-anchor="end">N の上限</text>
<line x1="150.0" y1="60" x2="150.0" y2="324" stroke="#bbb" stroke-width="0.6"/>
<text x="150.0" y="338" font-size="11" fill="#333" text-anchor="middle">1</text>
<line x1="189.7" y1="60" x2="189.7" y2="324" stroke="#bbb" stroke-width="0.6"/>
<text x="189.7" y="338" font-size="11" fill="#333" text-anchor="middle">10³</text>
<line x1="229.3" y1="60" x2="229.3" y2="324" stroke="#bbb" stroke-width="0.6"/>
<text x="229.3" y="338" font-size="11" fill="#333" text-anchor="middle">10⁶</text>
<line x1="269.0" y1="60" x2="269.0" y2="324" stroke="#bbb" stroke-width="0.6"/>
<text x="269.0" y="338" font-size="11" fill="#333" text-anchor="middle">10⁹</text>
<line x1="308.7" y1="60" x2="308.7" y2="324" stroke="#bbb" stroke-width="0.6"/>
<text x="308.7" y="338" font-size="11" fill="#333" text-anchor="middle">10¹²</text>
<line x1="348.3" y1="60" x2="348.3" y2="324" stroke="#bbb" stroke-width="0.6"/>
<text x="348.3" y="338" font-size="11" fill="#333" text-anchor="middle">10¹⁵</text>
<line x1="388.0" y1="60" x2="388.0" y2="324" stroke="#bbb" stroke-width="0.6"/>
<text x="388.0" y="338" font-size="11" fill="#333" text-anchor="middle">10¹⁸</text>
<text x="269" y="356" font-size="11" fill="#333" text-anchor="middle">N（対数目盛。1 目盛りで 1000 倍）</text>
<rect x="4" y="60" width="392" height="24" fill="#f4f4f4"/>
<text x="8" y="76" font-size="11" fill="#222">O(N!·N)</text>
<text x="142" y="76" font-size="11" fill="#222" text-anchor="end">10</text>
<rect x="163.2" y="66" width="0.5" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="66" width="13.2" height="12" fill="#3b6ea5"/>
<text x="8" y="100" font-size="11" fill="#222">O(3ᴺ)</text>
<text x="142" y="100" font-size="11" fill="#222" text-anchor="end">16</text>
<rect x="165.9" y="90" width="0.7" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="90" width="15.9" height="12" fill="#3b6ea5"/>
<rect x="4" y="108" width="392" height="24" fill="#f4f4f4"/>
<text x="8" y="124" font-size="11" fill="#222">O(2ᴺ·N)</text>
<text x="142" y="124" font-size="11" fill="#222" text-anchor="end">22</text>
<rect x="167.7" y="114" width="0.7" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="114" width="17.7" height="12" fill="#3b6ea5"/>
<text x="8" y="148" font-size="11" fill="#222">O(2ᴺᐟ²·N)</text>
<text x="142" y="148" font-size="11" fill="#222" text-anchor="end">42</text>
<rect x="171.5" y="138" width="0.8" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="138" width="21.5" height="12" fill="#3b6ea5"/>
<rect x="4" y="156" width="392" height="24" fill="#f4f4f4"/>
<text x="8" y="172" font-size="11" fill="#222">O(N³)</text>
<text x="142" y="172" font-size="11" fill="#222" text-anchor="end">460</text>
<rect x="185.3" y="162" width="4.4" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="162" width="35.3" height="12" fill="#3b6ea5"/>
<text x="8" y="196" font-size="11" fill="#222">O(N²)</text>
<text x="142" y="196" font-size="11" fill="#222" text-anchor="end">10⁴</text>
<rect x="202.9" y="186" width="6.6" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="186" width="52.9" height="12" fill="#3b6ea5"/>
<rect x="4" y="204" width="392" height="24" fill="#f4f4f4"/>
<text x="8" y="220" font-size="11" fill="#222">O(N√N)</text>
<text x="142" y="220" font-size="11" fill="#222" text-anchor="end">2×10⁵</text>
<rect x="220.5" y="210" width="8.8" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="210" width="70.5" height="12" fill="#3b6ea5"/>
<text x="8" y="244" font-size="11" fill="#222">O(N log N)</text>
<text x="142" y="244" font-size="11" fill="#222" text-anchor="end">4×10⁶</text>
<rect x="238.0" y="234" width="12.5" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="234" width="88.0" height="12" fill="#3b6ea5"/>
<rect x="4" y="252" width="392" height="24" fill="#f4f4f4"/>
<text x="8" y="268" font-size="11" fill="#222">O(N)</text>
<text x="142" y="268" font-size="11" fill="#222" text-anchor="end">10⁸</text>
<rect x="255.8" y="258" width="13.2" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="258" width="105.8" height="12" fill="#3b6ea5"/>
<text x="8" y="292" font-size="11" fill="#222">O(√N)</text>
<text x="142" y="292" font-size="11" fill="#222" text-anchor="end">10¹⁶</text>
<rect x="361.6" y="282" width="26.4" height="12" fill="#cfdcec" stroke="#3b6ea5" stroke-dasharray="2,2" stroke-width="0.8"/>
<rect x="150" y="282" width="211.6" height="12" fill="#3b6ea5"/>
<rect x="4" y="300" width="392" height="24" fill="#f4f4f4"/>
<text x="8" y="316" font-size="11" fill="#222">O(log N)</text>
<text x="142" y="316" font-size="11" fill="#222" text-anchor="end">制限なし</text>
<rect x="150" y="306" width="238" height="12" fill="#3b6ea5"/>
<polygon points="388,303 396,312 388,321" fill="#3b6ea5"/>
<line x1="150" y1="60" x2="150" y2="324" stroke="#333" stroke-width="1"/>
</svg>
