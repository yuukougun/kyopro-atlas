<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 580" width="310" height="580" font-family="sans-serif">
<rect width="310" height="580" fill="#fff"/>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<text x="150" y="22" text-anchor="middle" font-size="14" font-weight="bold">1 本目：元のグラフ</text>
<line x1="64.7" y1="109.7" x2="133.6" y2="61.5" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ar)"/><text x="90.0" y="77.0" text-anchor="middle" font-size="17" fill="#c0392b">1</text>
<line x1="64.7" y1="130.3" x2="133.6" y2="178.5" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/><text x="90.0" y="171.0" text-anchor="middle" font-size="17" fill="#222">4</text>
<line x1="150.0" y1="68.0" x2="150.0" y2="170.0" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ar)"/><text x="162.0" y="124.0" text-anchor="middle" font-size="17" fill="#c0392b">1</text>
<line x1="164.7" y1="60.3" x2="233.6" y2="108.5" stroke="#555" stroke-width="1.5" marker-end="url(#ag)"/><text x="210.0" y="77.0" text-anchor="middle" font-size="17" fill="#222">4</text>
<line x1="164.7" y1="179.7" x2="233.6" y2="131.5" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ar)"/><text x="210.0" y="171.0" text-anchor="middle" font-size="17" fill="#c0392b">1</text>
<circle cx="50" cy="120" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="50" y="125" text-anchor="middle" font-size="17">s</text>
<circle cx="150" cy="50" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="150" y="55" text-anchor="middle" font-size="17">a</text>
<circle cx="150" cy="190" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="150" y="195" text-anchor="middle" font-size="17">b</text>
<circle cx="250" cy="120" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="250" y="125" text-anchor="middle" font-size="17">t</text>
<text x="150" y="245" text-anchor="middle" font-size="14">太線 s→a→b→t：コスト 1+1+1 = 3</text>
<line x1="10" y1="268" x2="300" y2="268" stroke="#bbb" stroke-width="1"/>
<g transform="translate(-320,260)">
<text x="470" y="22" text-anchor="middle" font-size="14" font-weight="bold">2 本目：1 本目を流した後の残余グラフ</text>
<line x1="455.3" y1="60.3" x2="386.4" y2="108.5" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ag)"/><text x="408.0" y="77.0" text-anchor="middle" font-size="17" fill="#222">−1</text>
<line x1="384.7" y1="130.3" x2="453.6" y2="178.5" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ar)"/><text x="410.0" y="171.0" text-anchor="middle" font-size="17" fill="#c0392b">4</text>
<line x1="470.0" y1="172.0" x2="470.0" y2="70.0" stroke="#c0392b" stroke-width="3.5" stroke-dasharray="7 4" marker-end="url(#ar)"/><text x="488.0" y="124.0" text-anchor="middle" font-size="17" fill="#c0392b">−1</text>
<line x1="484.7" y1="60.3" x2="553.6" y2="108.5" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ar)"/><text x="530.0" y="77.0" text-anchor="middle" font-size="17" fill="#c0392b">4</text>
<line x1="555.3" y1="130.3" x2="486.4" y2="178.5" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ag)"/><text x="532.0" y="171.0" text-anchor="middle" font-size="17" fill="#222">−1</text>
<circle cx="370" cy="120" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="370" y="125" text-anchor="middle" font-size="17">s</text>
<circle cx="470" cy="50" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="470" y="55" text-anchor="middle" font-size="17">a</text>
<circle cx="470" cy="190" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="470" y="195" text-anchor="middle" font-size="17">b</text>
<circle cx="570" cy="120" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="570" y="125" text-anchor="middle" font-size="17">t</text>
<text x="470" y="245" text-anchor="middle" font-size="14">太線 s→b→a→t：コスト 4−1+4 = 7</text>
</g>
<text x="155" y="545" text-anchor="middle" font-size="14">容量はすべて 1。数字は 1 単位あたりのコスト</text>
<text x="155" y="568" text-anchor="middle" font-size="14">破線は逆辺（コストは符号を反転）</text>
</svg>
