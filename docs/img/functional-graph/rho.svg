<text x="660" y="232" text-anchor="middle" fill="#555" font-size="13">d=1</text>
<text x="470" y="195" text-anchor="middle" fill="#222">閉路（実線）</text>
<text x="470" y="210" text-anchor="middle" fill="#222" font-size="13">長さ 4</text>
<text x="60" y="130" text-anchor="middle" fill="#222" font-size="13">しっぽ（点線）</text>
<text x="20" y="340" fill="#222">頂点 0 から K = 10 回進む：しっぽを 3 回で抜けて頂点 3 に入り、</text>
<text x="20" y="364" fill="#222">残り 10 − 3 = 7 回は閉路の上なので 7 mod 4 = 3 回だけ進む → 3 → 4 → 5 → 6</text>
<text x="20" y="396" fill="#222">頂点 0 から届く頂点：しっぽの 3 個（0・1・2）と閉路の 4 個で 7 個</text>
