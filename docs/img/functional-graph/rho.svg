<text x="280" y="232" text-anchor="middle" fill="#555" font-size="13">d=1</text>
<circle cx="390" cy="190" r="22" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
<text x="390" y="195" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<circle cx="470" cy="110" r="22" fill="#dce8f7" stroke="#333" stroke-width="1.5"/>
