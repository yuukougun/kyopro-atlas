<text x="300" y="207" text-anchor="middle" fill="#222" font-size="13">閉路（実線）</text>
<text x="300" y="224" text-anchor="middle" fill="#222" font-size="13">長さ 4</text>
<text x="12" y="160" fill="#222" font-size="13">しっぽ</text>
