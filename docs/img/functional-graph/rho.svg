<circle cx="60" cy="190" r="22" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
<text x="60" y="195" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<text x="60" y="232" text-anchor="middle" fill="#555" font-size="13">d=3</text>
<circle cx="170" cy="190" r="22" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
