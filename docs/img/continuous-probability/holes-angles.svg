<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" font-family="sans-serif" font-size="13">
  <rect width="400" height="320" fill="#ffffff"/>
  <!-- 凸包 -->
  <polygon points="120,220 280,220 200,100" fill="#eef3fb" stroke="#1f4e9c" stroke-width="2"/>
  <!-- 辺の外向きの法線（各頂点から 2 本ずつ） -->
  <g stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="120" y1="220" x2="120" y2="290"/>
    <line x1="120" y1="220" x2="53.4" y2="175.6"/>
    <line x1="280" y1="220" x2="280" y2="290"/>
    <line x1="280" y1="220" x2="346.6" y2="175.6"/>
    <line x1="200" y1="100" x2="266.6" y2="55.6"/>
    <line x1="200" y1="100" x2="133.4" y2="55.6"/>
  </g>
  <!-- 外角の弧 -->
  <g fill="none" stroke="#c0392b" stroke-width="2">
    <path d="M120,245 A25,25 0 0 1 99.2,206.1"/>
    <path d="M300.8,206.1 A25,25 0 0 1 280,245"/>
    <path d="M179.2,86.1 A25,25 0 0 1 220.8,86.1"/>
  </g>
  <!-- 点 -->
  <g fill="#1f4e9c">
    <circle cx="120" cy="220" r="5"/>
    <circle cx="280" cy="220" r="5"/>
    <circle cx="200" cy="100" r="5"/>
  </g>
  <circle cx="200" cy="180" r="5" fill="#ffffff" stroke="#1f4e9c" stroke-width="2"/>
  <!-- ラベル -->
  <text x="18" y="250">A：外角 123.7°</text>
  <text x="18" y="268">確率 0.344</text>
  <text x="290" y="268">B：外角 123.7°</text>
  <text x="290" y="286">確率 0.344</text>
  <text x="200" y="28" text-anchor="middle">C：外角 112.6°・確率 0.313</text>
  <text x="212" y="176">D：確率 0</text>
  <text x="200" y="312" text-anchor="middle" fill="#555555">破線：辺に垂直な外向きの方向</text>
</svg>
