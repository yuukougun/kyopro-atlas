<text x="190.0" y="150.0" text-anchor="middle" fill="#2a6fb0" font-size="13">3–1</text>
<text x="400" y="50" fill="#555">値のグラフ</text>
<line x1="420" y1="90" x2="510" y2="90" stroke="#2a6fb0" stroke-width="2" />
<line x1="510" y1="90" x2="465" y2="170" stroke="#2a6fb0" stroke-width="2" stroke-dasharray="7 4"/>
<line x1="465" y1="170" x2="420" y2="90" stroke="#2a6fb0" stroke-width="2" stroke-dasharray="2 4"/>
<circle cx="420" cy="90" r="17" fill="#fff4d6" stroke="#c08a00" stroke-width="2"/>
<text x="420" y="96" text-anchor="middle" fill="#222" font-size="17">1</text>
<circle cx="510" cy="90" r="17" fill="#fff4d6" stroke="#c08a00" stroke-width="2"/>
<text x="510" y="96" text-anchor="middle" fill="#222" font-size="17">2</text>
<circle cx="465" cy="170" r="17" fill="#fff4d6" stroke="#c08a00" stroke-width="2"/>
<text x="465" y="176" text-anchor="middle" fill="#222" font-size="17">3</text>
<text x="8" y="232" fill="#222" font-size="14">食い違う組は 3 つだが、値 1・2・3 は 1 つの連結成分にまとまる</text>
<text x="8" y="256" fill="#222" font-size="14">置き換えは（成分の大きさ − 1）＝ 2 回で足りる</text>
