<rect x="194" y="58" width="42" height="36" fill="none" stroke="#333"/>
<text x="215.0" y="82" text-anchor="middle" fill="#222" font-size="18">1</text>
<text x="265.0" y="50" text-anchor="middle" fill="#555" font-size="14">4</text>
<rect x="244" y="58" width="42" height="36" fill="none" stroke="#333"/>
<text x="265.0" y="82" text-anchor="middle" fill="#222" font-size="18">3</text>
<text x="315.0" y="50" text-anchor="middle" fill="#555" font-size="14">5</text>
<rect x="294" y="58" width="42" height="36" fill="none" stroke="#333"/>
<text x="315.0" y="82" text-anchor="middle" fill="#222" font-size="18">2</text>
<path d="M65.0,96 Q190.0,262 315.0,96" fill="none" stroke="#2a6fb0" stroke-width="2" />
<text x="190.0" y="194.0" text-anchor="middle" fill="#2a6fb0" font-size="13">1–2</text>
<path d="M115.0,96 Q190.0,218 265.0,96" fill="none" stroke="#2a6fb0" stroke-width="2" stroke-dasharray="7 4"/>
<text x="190.0" y="172.0" text-anchor="middle" fill="#2a6fb0" font-size="13">2–3</text>
