<svg viewBox="0 0 344 408" width="344" height="408" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="344" height="408" fill="#ffffff"/>
<text x="8" y="22" font-size="15" fill="#222222">x ≤ A = 1101、y ≤ B = 0111、</text>
<text x="8" y="42" font-size="15" fill="#222222">x AND y = 0 を上の bit から決める</text>
<text x="8" y="76" font-size="15" fill="#555555">bit</text>
<text x="124" y="76" font-size="15" text-anchor="middle" fill="#555555">3</text>
<text x="172" y="76" font-size="15" text-anchor="middle" fill="#555555">2</text>
<text x="220" y="76" font-size="15" text-anchor="middle" fill="#555555">1</text>
<text x="268" y="76" font-size="15" text-anchor="middle" fill="#555555">0</text>
<text x="8" y="110" font-size="14" fill="#222222">上限 A</text>
<text x="8" y="150" font-size="14" fill="#222222">x</text>
<text x="8" y="190" font-size="14" fill="#555555">x のフラグ</text>
<text x="8" y="240" font-size="14" fill="#222222">上限 B</text>
<text x="8" y="280" font-size="14" fill="#222222">y</text>
<text x="8" y="320" font-size="14" fill="#555555">y のフラグ</text>
<text x="124" y="111" font-size="16" text-anchor="middle" fill="#555555">1</text>
<rect x="107" y="130" width="34" height="30" fill="#ffffff" stroke="#333333"/>
<text x="124" y="151" font-size="16" text-anchor="middle" fill="#222222">1</text>
<text x="124" y="191" font-size="14" text-anchor="middle" fill="#222222">一致</text>
<text x="124" y="241" font-size="16" text-anchor="middle" fill="#555555">0</text>
<rect x="107" y="260" width="34" height="30" fill="#ffffff" stroke="#333333"/>
<text x="124" y="281" font-size="16" text-anchor="middle" fill="#222222">0</text>
<text x="124" y="321" font-size="14" text-anchor="middle" fill="#222222">一致</text>
<text x="172" y="111" font-size="16" text-anchor="middle" fill="#555555">1</text>
<rect x="155" y="130" width="34" height="30" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="172" y="151" font-size="16" text-anchor="middle" fill="#1f5fbf">0</text>
<text x="172" y="191" font-size="14" text-anchor="middle" fill="#1f5fbf">未満</text>
<text x="172" y="241" font-size="16" text-anchor="middle" fill="#555555">1</text>
<rect x="155" y="260" width="34" height="30" fill="#ffffff" stroke="#333333"/>
<text x="172" y="281" font-size="16" text-anchor="middle" fill="#222222">1</text>
<text x="172" y="321" font-size="14" text-anchor="middle" fill="#222222">一致</text>
<text x="220" y="111" font-size="16" text-anchor="middle" fill="#555555">0</text>
<rect x="203" y="130" width="34" height="30" fill="#ffffff" stroke="#333333"/>
<text x="220" y="151" font-size="16" text-anchor="middle" fill="#222222">1</text>
<text x="220" y="191" font-size="14" text-anchor="middle" fill="#1f5fbf">未満</text>
<text x="220" y="241" font-size="16" text-anchor="middle" fill="#555555">1</text>
<rect x="203" y="260" width="34" height="30" fill="#ffffff" stroke="#b5521b" stroke-width="2.5" stroke-dasharray="5 2"/>
<text x="220" y="281" font-size="16" text-anchor="middle" fill="#b5521b">0</text>
<text x="220" y="321" font-size="14" text-anchor="middle" fill="#b5521b">未満</text>
<text x="268" y="111" font-size="16" text-anchor="middle" fill="#555555">1</text>
<rect x="251" y="130" width="34" height="30" fill="#ffffff" stroke="#333333"/>
<text x="268" y="151" font-size="16" text-anchor="middle" fill="#222222">0</text>
<text x="268" y="191" font-size="14" text-anchor="middle" fill="#1f5fbf">未満</text>
<text x="268" y="241" font-size="16" text-anchor="middle" fill="#555555">1</text>
<rect x="251" y="260" width="34" height="30" fill="#ffffff" stroke="#333333"/>
<text x="268" y="281" font-size="16" text-anchor="middle" fill="#222222">1</text>
<text x="268" y="321" font-size="14" text-anchor="middle" fill="#b5521b">未満</text>
<text x="8" y="356" font-size="14" fill="#1f5fbf">実線の枠：x は bit 2 で A より小さくなる</text>
<text x="8" y="376" font-size="14" fill="#b5521b">破線の枠：y は bit 1 で B より小さくなる</text>
<text x="8" y="396" font-size="14" fill="#555555">フラグは数ごとに別々に切り替わる</text>
</svg>
