<svg viewBox="0 0 404 369" width="404" height="369" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<g transform="translate(4 2)">
  <rect x="-4" y="-2" width="404" height="369" fill="#ffffff"/>
<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
  </defs>
<text x="8" y="22" font-size="15" fill="#222222">X = 87、硬貨 1・10・100 円：</text>
<text x="8" y="42" font-size="15" fill="#222222">下の桁から繰り上がり c を運ぶ</text>
<text x="120" y="72" font-size="14" text-anchor="middle" fill="#222222">一の位 d = 7</text>
<line x1="120" y1="100" x2="120" y2="300" stroke="#bbbbbb" stroke-dasharray="4 4"/>
<text x="220" y="72" font-size="14" text-anchor="middle" fill="#222222">十の位 d = 8</text>
<line x1="220" y1="100" x2="220" y2="300" stroke="#bbbbbb" stroke-dasharray="4 4"/>
<text x="314" y="72" font-size="14" text-anchor="middle" fill="#222222">百の位 d = 0</text>
<line x1="314" y1="100" x2="314" y2="300" stroke="#bbbbbb" stroke-dasharray="4 4"/>
<text x="314" y="90" font-size="13" text-anchor="middle" fill="#555555">（いちばん上）</text>
<text x="6" y="155" font-size="14" fill="#222222">c = 0</text>
<text x="6" y="265" font-size="14" fill="#222222">c = 1</text>
<rect x="48" y="134" width="44" height="32" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="70" y="155" font-size="15" text-anchor="middle" fill="#222222">0</text>
<rect x="48" y="244" width="44" height="32" rx="6" fill="#f2f2f2" stroke="#999999" stroke-dasharray="3 3"/>
<text x="70" y="265" font-size="15" text-anchor="middle" fill="#888888">∞</text>
<rect x="148" y="134" width="44" height="32" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="170" y="155" font-size="15" text-anchor="middle" fill="#222222">7</text>
<rect x="148" y="244" width="44" height="32" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="170" y="265" font-size="15" text-anchor="middle" fill="#1f5fbf">3</text>
<rect x="248" y="134" width="44" height="32" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="270" y="155" font-size="15" text-anchor="middle" fill="#222222">12</text>
<rect x="248" y="244" width="44" height="32" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="270" y="265" font-size="15" text-anchor="middle" fill="#1f5fbf">4</text>
<rect x="350" y="187" width="44" height="36" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.5"/>
<text x="372" y="211" font-size="16" text-anchor="middle" fill="#1f5fbf">5</text>
<text x="372" y="241" font-size="14" text-anchor="middle" fill="#555555">答え</text>
<line x1="92" y1="150" x2="146" y2="150" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="120" y="140" font-size="13" text-anchor="middle" fill="#333333">7 枚払う</text>
<line x1="92" y1="160" x2="146" y2="250" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#arrb)"/>
<text x="8" y="210" font-size="13" fill="#1f5fbf">お釣り 3 枚</text>
<line x1="192" y1="146" x2="246" y2="146" stroke="#333333" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<line x1="192" y1="160" x2="246" y2="248" stroke="#333333" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<line x1="192" y1="250" x2="246" y2="162" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="192" y1="264" x2="246" y2="264" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#arrb)"/>
<text x="270" y="124" font-size="13" text-anchor="middle" fill="#333333">min(7 + 8, 3 + 9)</text>
<text x="270" y="296" font-size="13" text-anchor="middle" fill="#1f5fbf">min(7 + 2, 3 + 1)</text>
<line x1="292" y1="156" x2="348" y2="193" stroke="#333333" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="304.0" y="162" font-size="13" fill="#333333">12 + 0</text>
<line x1="292" y1="254" x2="348" y2="215" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#arrb)"/>
<text x="310.0" y="266" font-size="13" fill="#1f5fbf">4 + 1</text>
<text x="8" y="334" font-size="14" fill="#555555">太い線が最小の道：100 円 1 枚を払い、10 円</text>
<text x="8" y="354" font-size="14" fill="#555555">1 枚と 1 円 3 枚のお釣り（87 = 100 − 10 − 3）</text>
</g>
