<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="680" height="352" font-family="sans-serif">
  <rect x="0" y="0" width="680" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
  </defs>
  <text x="340" y="24" font-size="15" text-anchor="middle" fill="#222222">X = 87、硬貨 1・10・100 円：下の桁から繰り上がり c を運ぶ</text>
  <!-- 列の見出し -->
  <text x="185" y="56" font-size="16" text-anchor="middle" fill="#222222">一の位 d = 7</text>
  <text x="375" y="56" font-size="16" text-anchor="middle" fill="#222222">十の位 d = 8</text>
  <text x="575" y="56" font-size="16" text-anchor="middle" fill="#222222">百の位 d = 0</text>
  <text x="575" y="76" font-size="15" text-anchor="middle" fill="#555555">（いちばん上）</text>
  <!-- 行の見出し -->
  <text x="6" y="134" font-size="15" fill="#222222">c = 0</text>
  <text x="6" y="254" font-size="15" fill="#222222">c = 1</text>
  <!-- 区切りの点線 -->
  <line x1="185" y1="86" x2="185" y2="300" stroke="#bbbbbb" stroke-dasharray="4 4"/>
  <line x1="375" y1="86" x2="375" y2="300" stroke="#bbbbbb" stroke-dasharray="4 4"/>
  <line x1="575" y1="86" x2="575" y2="300" stroke="#bbbbbb" stroke-dasharray="4 4"/>
  <!-- 節点 -->
  <rect x="62" y="112" width="56" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="90" y="135" font-size="15" text-anchor="middle" fill="#222222">0</text>
  <rect x="62" y="232" width="56" height="34" rx="6" fill="#f2f2f2" stroke="#999999" stroke-dasharray="3 3"/>
  <text x="90" y="255" font-size="15" text-anchor="middle" fill="#888888">∞</text>

  <rect x="252" y="112" width="56" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="280" y="135" font-size="15" text-anchor="middle" fill="#222222">7</text>
  <rect x="252" y="232" width="56" height="34" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="280" y="255" font-size="15" text-anchor="middle" fill="#1f5fbf">3</text>

  <rect x="442" y="112" width="56" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="470" y="135" font-size="15" text-anchor="middle" fill="#222222">12</text>
  <rect x="442" y="232" width="56" height="34" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="470" y="255" font-size="15" text-anchor="middle" fill="#1f5fbf">4</text>

  <rect x="608" y="172" width="60" height="38" rx="6" fill="#ffffff" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="638" y="197" font-size="16" text-anchor="middle" fill="#1f5fbf">5</text>
  <text x="638" y="230" font-size="15" text-anchor="middle" fill="#555555">答え</text>

  <!-- 一の位の遷移 -->
  <line x1="118" y1="129" x2="250" y2="129" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="140" y="120" font-size="15" fill="#333333">7 枚払う</text>
  <line x1="118" y1="140" x2="250" y2="243" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#arrb)"/>
  <text x="40" y="200" font-size="15" fill="#1f5fbf">お釣り 3 枚</text>
  <!-- 十の位の遷移（ラベルは節点の側に書く） -->
  <line x1="308" y1="125" x2="440" y2="125" stroke="#333333" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <line x1="308" y1="138" x2="440" y2="236" stroke="#333333" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <line x1="308" y1="240" x2="440" y2="140" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="308" y1="252" x2="440" y2="252" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#arrb)"/>
  <text x="470" y="104" font-size="15" text-anchor="middle" fill="#333333">min(7 + 8, 3 + 9)</text>
  <text x="470" y="288" font-size="15" text-anchor="middle" fill="#1f5fbf">min(7 + 2, 3 + 1)</text>
  <!-- 百の位 -->
  <line x1="498" y1="132" x2="606" y2="183" stroke="#333333" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="500" y="178" font-size="15" fill="#333333">12 + 0</text>
  <line x1="498" y1="248" x2="606" y2="200" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#arrb)"/>
  <text x="530" y="262" font-size="15" fill="#1f5fbf">4 + 1</text>
  <text x="340" y="318" font-size="15" text-anchor="middle" fill="#555555">太い線が最小の道：100 円 1 枚を払い、</text>
  <text x="340" y="340" font-size="15" text-anchor="middle" fill="#555555">10 円 1 枚と 1 円 3 枚のお釣り（87 = 100 − 10 − 3）</text>
</svg>
