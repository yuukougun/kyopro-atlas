<svg xmlns="http://www.w3.org/2000/svg" viewBox="372 0 388 340" width="388" height="340" font-family="sans-serif">
  <rect x="372" y="0" width="388" height="340" fill="#ffffff"/>
  <text x="566" y="24" font-size="14" text-anchor="middle" fill="#222">併合過程の木（丸は元の頂点、四角は併合）</text>
  <!-- tree edges -->
  <g stroke="#222" stroke-width="1.5">
    <line x1="530" y1="70" x2="440" y2="150"/>
    <line x1="530" y1="70" x2="640" y2="130"/>
    <line x1="440" y1="150" x2="410" y2="250"/>
    <line x1="440" y1="150" x2="470" y2="250"/>
    <line x1="640" y1="130" x2="590" y2="190"/>
    <line x1="640" y1="130" x2="700" y2="250"/>
    <line x1="590" y1="190" x2="560" y2="250"/>
    <line x1="590" y1="190" x2="620" y2="250"/>
  </g>
  <!-- internal nodes -->
  <g font-size="14" text-anchor="middle">
    <rect x="508" y="55" width="44" height="30" rx="4" fill="#fde9c8" stroke="#c46a00" stroke-width="3"/><text x="530" y="75">5</text>
    <rect x="418" y="135" width="44" height="30" rx="4" fill="#eef3fb" stroke="#1f5fbf" stroke-width="1.5"/><text x="440" y="155">2</text>
    <rect x="618" y="115" width="44" height="30" rx="4" fill="#eef3fb" stroke="#1f5fbf" stroke-width="1.5"/><text x="640" y="135">4</text>
    <rect x="568" y="175" width="44" height="30" rx="4" fill="#eef3fb" stroke="#1f5fbf" stroke-width="1.5"/><text x="590" y="195">3</text>
  </g>
  <!-- leaves -->
  <g font-size="15" text-anchor="middle">
    <circle cx="410" cy="260" r="15" fill="#fff" stroke="#c46a00" stroke-width="3"/><text x="410" y="265">1</text>
    <circle cx="470" cy="260" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="470" y="265">2</text>
    <circle cx="560" cy="260" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="560" y="265">3</text>
    <circle cx="620" cy="260" r="15" fill="#fff" stroke="#c46a00" stroke-width="3"/><text x="620" y="265">4</text>
    <circle cx="700" cy="260" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="700" y="265">5</text>
  </g>
  <text x="570" y="62" font-size="12" text-anchor="start" fill="#c46a00">LCA(1, 4)</text>
  <text x="566" y="305" font-size="12" text-anchor="middle" fill="#444">1 と 4 の LCA の重みは 5。1 から 4 へのボトルネックの最小も 5</text>
  <text x="566" y="324" font-size="12" text-anchor="middle" fill="#444">（1-2-3-4 の最大は 5、1-3-4 は 6、1-2-5-4 は 7）</text>
</svg>
