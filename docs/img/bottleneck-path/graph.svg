<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" font-family="sans-serif">
  <rect x="0" y="0" width="380" height="340" fill="#ffffff"/>
  <text x="180" y="24" font-size="14" text-anchor="middle" fill="#222">元のグラフ（実線が最小全域木の辺）</text>
  <!-- edges: MST -->
  <g stroke="#1f5fbf" stroke-width="3">
    <line x1="60" y1="80" x2="210" y2="80"/>
    <line x1="210" y1="80" x2="90" y2="210"/>
    <line x1="90" y1="210" x2="230" y2="270"/>
    <line x1="230" y1="270" x2="320" y2="180"/>
  </g>
  <!-- non-MST -->
  <g stroke="#888" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="60" y1="80" x2="90" y2="210"/>
    <line x1="210" y1="80" x2="320" y2="180"/>
  </g>
  <!-- edge weights -->
  <g font-size="14" fill="#222" text-anchor="middle">
    <text x="135" y="72">2</text>
    <text x="160" y="150">5</text>
    <text x="62" y="150">6</text>
    <text x="152" y="258">3</text>
    <text x="287" y="240">4</text>
    <text x="278" y="118">7</text>
  </g>
  <!-- vertices -->
  <g font-size="15" text-anchor="middle">
    <circle cx="60" cy="80" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="60" y="85">1</text>
    <circle cx="210" cy="80" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="210" y="85">2</text>
    <circle cx="90" cy="210" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="90" y="215">3</text>
    <circle cx="230" cy="270" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="230" y="275">4</text>
    <circle cx="320" cy="180" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="320" y="185">5</text>
  </g>
  <text x="180" y="320" font-size="12" text-anchor="middle" fill="#444">破線（6・7）は閉路を作るので併合に使われない</text>
</svg>
