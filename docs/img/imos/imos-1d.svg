<svg xmlns="http://www.w3.org/2000/svg" width="400" height="430" viewBox="0 0 400 430" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0 1)">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<text x="16" y="22" fill="#222">操作 1：[1, 5) に +1、操作 2：[3, 7) に +2</text>
<text x="16" y="42" fill="#555">（N = 8、0-indexed）</text>
<text x="16" y="70" fill="#555">添字 i</text>
<text x="44" y="92" text-anchor="middle" fill="#555">0</text>
<text x="84" y="92" text-anchor="middle" fill="#555">1</text>
<text x="124" y="92" text-anchor="middle" fill="#555">2</text>
<text x="164" y="92" text-anchor="middle" fill="#555">3</text>
<text x="204" y="92" text-anchor="middle" fill="#555">4</text>
<text x="244" y="92" text-anchor="middle" fill="#555">5</text>
<text x="284" y="92" text-anchor="middle" fill="#555">6</text>
<text x="324" y="92" text-anchor="middle" fill="#555">7</text>
<text x="364" y="92" text-anchor="middle" fill="#555">8</text>
<line x1="64" y1="114" x2="220" y2="114" stroke="#1f4e9a" stroke-width="4"/>
<line x1="64" y1="107" x2="64" y2="121" stroke="#1f4e9a" stroke-width="2"/>
<circle cx="224" cy="114" r="5" fill="#ffffff" stroke="#1f4e9a" stroke-width="2"/>
<text x="236" y="119" fill="#222">操作 1（+1）</text>
<line x1="144" y1="138" x2="300" y2="138" stroke="#1f4e9a" stroke-width="4" stroke-dasharray="8 4"/>
<line x1="144" y1="131" x2="144" y2="145" stroke="#1f4e9a" stroke-width="2"/>
<circle cx="304" cy="138" r="5" fill="#ffffff" stroke="#1f4e9a" stroke-width="2"/>
<text x="136" y="143" text-anchor="end" fill="#222">操作 2（+2）</text>
<text x="16" y="176" fill="#222">D（印）</text>
<rect x="24" y="184" width="40" height="36" fill="#ffffff" stroke="#b25b00" stroke-width="1.5"/>
<text x="44" y="208" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<rect x="64" y="184" width="40" height="36" fill="#ffe2c2" stroke="#b25b00" stroke-width="1.5"/>
<text x="84" y="208" text-anchor="middle" fill="#222" font-weight="bold">+1</text>
<rect x="104" y="184" width="40" height="36" fill="#ffffff" stroke="#b25b00" stroke-width="1.5"/>
<text x="124" y="208" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<rect x="144" y="184" width="40" height="36" fill="#ffe2c2" stroke="#b25b00" stroke-width="1.5"/>
<text x="164" y="208" text-anchor="middle" fill="#222" font-weight="bold">+2</text>
<rect x="184" y="184" width="40" height="36" fill="#ffffff" stroke="#b25b00" stroke-width="1.5"/>
<text x="204" y="208" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<rect x="224" y="184" width="40" height="36" fill="#ffe2c2" stroke="#b25b00" stroke-width="1.5"/>
<text x="244" y="208" text-anchor="middle" fill="#222" font-weight="bold">−1</text>
<rect x="264" y="184" width="40" height="36" fill="#ffffff" stroke="#b25b00" stroke-width="1.5"/>
<text x="284" y="208" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<rect x="304" y="184" width="40" height="36" fill="#ffe2c2" stroke="#b25b00" stroke-width="1.5"/>
<text x="324" y="208" text-anchor="middle" fill="#222" font-weight="bold">−2</text>
<rect x="344" y="184" width="40" height="36" fill="#ffffff" stroke="#b25b00" stroke-width="1.5"/>
<text x="364" y="208" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<text x="16" y="242" fill="#555" font-size="13">D[1] += 1、D[5] −= 1、D[3] += 2、D[7] −= 2</text>
<text x="16" y="260" fill="#555" font-size="13">（D は N + 1 = 9 個）。左から累積する</text>
<line x1="44" y1="268" x2="44" y2="288" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="84" y1="268" x2="84" y2="288" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="124" y1="268" x2="124" y2="288" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="164" y1="268" x2="164" y2="288" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="204" y1="268" x2="204" y2="288" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="244" y1="268" x2="244" y2="288" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="284" y1="268" x2="284" y2="288" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="324" y1="268" x2="324" y2="288" stroke="#333" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="16" y="312" fill="#222">A（累積和）</text>
<rect x="24" y="320" width="40" height="36" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="44" y="344" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<rect x="64" y="320" width="40" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="84" y="344" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="104" y="320" width="40" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="124" y="344" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="144" y="320" width="40" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="164" y="344" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<rect x="184" y="320" width="40" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="204" y="344" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<rect x="224" y="320" width="40" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="244" y="344" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<rect x="264" y="320" width="40" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="284" y="344" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<rect x="304" y="320" width="40" height="36" fill="#ffffff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="324" y="344" text-anchor="middle" fill="#222" font-weight="normal">0</text>
<text x="16" y="380" fill="#555" font-size="13">A[i] = D[0] + … + D[i]。重なる 3・4 は 1 + 2 = 3、</text>
<text x="16" y="398" fill="#555" font-size="13">どちらにも入らない 0・7 は 0。D[8] は累積に使わない</text>
<text x="16" y="416" fill="#555" font-size="13">（番兵）</text>
</g>
</svg>
