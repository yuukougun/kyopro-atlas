<text x="20" y="300" fill="#555" font-size="14">A[i] = D[0] + … + D[i]。[1, 5) と [3, 7) が重なる 3・4 は 1 + 2 = 3、</text>
<text x="20" y="318" fill="#555" font-size="14">どちらにも入らない 0・7 は 0。D[8] は累積に使わない（番兵）</text>
