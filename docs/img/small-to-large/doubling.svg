<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 466" width="420" height="466" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="420" height="466" fill="#ffffff"/>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe0f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#3a6ea5" stroke-width="2"/></pattern></defs>
<text x="10" y="26" fill="#222">要素 x が移るたびに、x の入っている</text>
<text x="10" y="46" fill="#222">集合の大きさは 2 倍以上になる</text>
<text x="10" y="91" fill="#222">1 回目</text>
<rect x="70" y="70" width="9.5" height="30" fill="url(#hatch)" stroke="#1f3f66" stroke-width="2"/>
<rect x="83.5" y="70" width="9.5" height="30" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<text x="24" y="120" font-size="14"><tspan fill="#1f3f66">x の側 1</tspan><tspan fill="#555">　相手 1（1 ≥ 1）</tspan><tspan fill="#222">　→ 移った後 2 ≥ 2 × 1</tspan></text>
<text x="10" y="167" fill="#222">2 回目</text>
<rect x="70" y="146" width="19.0" height="30" fill="url(#hatch)" stroke="#1f3f66" stroke-width="2"/>
<rect x="93.0" y="146" width="28.5" height="30" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<text x="24" y="196" font-size="14"><tspan fill="#1f3f66">x の側 2</tspan><tspan fill="#555">　相手 3（3 ≥ 2）</tspan><tspan fill="#222">　→ 移った後 5 ≥ 2 × 2</tspan></text>
<text x="10" y="243" fill="#222">3 回目</text>
<rect x="70" y="222" width="47.5" height="30" fill="url(#hatch)" stroke="#1f3f66" stroke-width="2"/>
<rect x="121.5" y="222" width="66.5" height="30" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<text x="24" y="272" font-size="14"><tspan fill="#1f3f66">x の側 5</tspan><tspan fill="#555">　相手 7（7 ≥ 5）</tspan><tspan fill="#222">　→ 移った後 12 ≥ 2 × 5</tspan></text>
<text x="10" y="319" fill="#222">4 回目</text>
<rect x="70" y="298" width="114.0" height="30" fill="url(#hatch)" stroke="#1f3f66" stroke-width="2"/>
<rect x="188.0" y="298" width="190.0" height="30" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<text x="24" y="348" font-size="14"><tspan fill="#1f3f66">x の側 12</tspan><tspan fill="#555">　相手 20（20 ≥ 12）</tspan><tspan fill="#222">　→ 移った後 32 ≥ 2 × 12</tspan></text>
<text x="10" y="380" font-size="14" fill="#222">斜線：x の入っている集合（小さい方なので移る）</text>
<text x="10" y="402" font-size="14" fill="#222">破線：大きい方（相手）</text>
<text x="10" y="430" font-size="14" fill="#222">大きさは N を超えないので、x が移る回数は</text>
<text x="10" y="450" font-size="14" fill="#222">log₂ N 以下</text>
</svg>
