<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" height="410" font-family="sans-serif" font-size="14">
<rect x="0" y="0" width="700" height="410" fill="#ffffff"/>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfe0f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#3a6ea5" stroke-width="2"/></pattern></defs>
<text x="20" y="28" font-size="15" fill="#222">要素 x が移るたびに、x の入っている集合の大きさは 2 倍以上になる</text>
<text x="20" y="82" fill="#222">1 回目</text>
<rect x="110" y="60" width="10" height="32" fill="url(#hatch)" stroke="#1f3f66" stroke-width="2"/>
<text x="110" y="110" font-size="12"><tspan fill="#1f3f66">x の側 1</tspan><tspan fill="#555">　相手 1（1 ≥ 1）</tspan></text>
<rect x="126" y="60" width="10" height="32" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<text x="450" y="82" fill="#222">→ 移った後 2 ≥ 2 × 1</text>
<text x="20" y="152" fill="#222">2 回目</text>
<rect x="110" y="130" width="20" height="32" fill="url(#hatch)" stroke="#1f3f66" stroke-width="2"/>
<text x="110" y="180" font-size="12"><tspan fill="#1f3f66">x の側 2</tspan><tspan fill="#555">　相手 3（3 ≥ 2）</tspan></text>
<rect x="136" y="130" width="30" height="32" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<text x="450" y="152" fill="#222">→ 移った後 5 ≥ 2 × 2</text>
<text x="20" y="222" fill="#222">3 回目</text>
<rect x="110" y="200" width="50" height="32" fill="url(#hatch)" stroke="#1f3f66" stroke-width="2"/>
<text x="110" y="250" font-size="12"><tspan fill="#1f3f66">x の側 5</tspan><tspan fill="#555">　相手 7（7 ≥ 5）</tspan></text>
<rect x="166" y="200" width="70" height="32" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<text x="450" y="222" fill="#222">→ 移った後 12 ≥ 2 × 5</text>
<text x="20" y="292" fill="#222">4 回目</text>
<rect x="110" y="270" width="120" height="32" fill="url(#hatch)" stroke="#1f3f66" stroke-width="2"/>
<text x="110" y="320" font-size="12"><tspan fill="#1f3f66">x の側 12</tspan><tspan fill="#555">　相手 20（20 ≥ 12）</tspan></text>
<rect x="236" y="270" width="200" height="32" fill="#ffffff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<text x="450" y="292" fill="#222">→ 移った後 32 ≥ 2 × 12</text>
<text x="20" y="360" font-size="13" fill="#222">斜線：x の入っている集合（小さい方なので移る）　破線：大きい方（相手）</text>
<text x="20" y="380" font-size="13" fill="#222">大きさは N を超えないので、x が移る回数は log₂ N 以下</text>
</svg>
