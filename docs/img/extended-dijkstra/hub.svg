<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="160" y="26" text-anchor="middle">全対に辺を張る（s = 6）</text>
  <text x="480" y="26" text-anchor="middle">超頂点 h を 1 つ足す</text>
  <!-- 左：完全グラフ。中心 (160,150) 半径 90 の六角形 -->
  <g stroke="#555" stroke-width="1.5">
    <line x1="250" y1="150" x2="205" y2="228"/><line x1="250" y1="150" x2="115" y2="228"/><line x1="250" y1="150" x2="70" y2="150"/><line x1="250" y1="150" x2="115" y2="72"/><line x1="250" y1="150" x2="205" y2="72"/>
    <line x1="205" y1="228" x2="115" y2="228"/><line x1="205" y1="228" x2="70" y2="150"/><line x1="205" y1="228" x2="115" y2="72"/><line x1="205" y1="228" x2="205" y2="72"/>
    <line x1="115" y1="228" x2="70" y2="150"/><line x1="115" y1="228" x2="115" y2="72"/><line x1="115" y1="228" x2="205" y2="72"/>
    <line x1="70" y1="150" x2="115" y2="72"/><line x1="70" y1="150" x2="205" y2="72"/>
    <line x1="115" y1="72" x2="205" y2="72"/>
  </g>
  <g stroke="#333" stroke-width="2" fill="#ffffff">
    <circle cx="250" cy="150" r="11"/><circle cx="205" cy="228" r="11"/><circle cx="115" cy="228" r="11"/><circle cx="70" cy="150" r="11"/><circle cx="115" cy="72" r="11"/><circle cx="205" cy="72" r="11"/>
  </g>
  <text x="160" y="270" text-anchor="middle">コスト c の辺が s(s−1)/2 = 15 本</text>
  <!-- 右：星形。中心 (480,150) -->
  <g stroke="#555" stroke-width="1.5" marker-end="url(#h)">
    <line x1="560" y1="150" x2="500" y2="150"/>
    <line x1="520" y1="219" x2="490" y2="167"/>
    <line x1="440" y1="219" x2="470" y2="167"/>
    <line x1="400" y1="150" x2="460" y2="150"/>
    <line x1="440" y1="81" x2="470" y2="133"/>
    <line x1="520" y1="81" x2="490" y2="133"/>
  </g>
  <g stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#h)">
    <path d="M492,140 Q530,128 552,140" fill="none"/>
    <path d="M496,156 Q528,178 524,208" fill="none"/>
    <path d="M466,160 Q432,178 436,208" fill="none"/>
    <path d="M466,140 Q430,128 408,140" fill="none"/>
    <path d="M466,140 Q430,112 432,92" fill="none"/>
    <path d="M494,140 Q530,112 528,92" fill="none"/>
  </g>
  <g stroke="#333" stroke-width="2" fill="#ffffff">
    <circle cx="560" cy="150" r="11"/><circle cx="520" cy="219" r="11"/><circle cx="440" cy="219" r="11"/><circle cx="400" cy="150" r="11"/><circle cx="440" cy="81" r="11"/><circle cx="520" cy="81" r="11"/>
  </g>
  <circle cx="480" cy="150" r="14" fill="#fdf2d0" stroke="#333" stroke-width="2"/>
  <text x="480" y="155" text-anchor="middle">h</text>
  <text x="480" y="256" text-anchor="middle">実線：各点 → h、コスト c</text>
  <text x="480" y="276" text-anchor="middle">破線：h → 各点、コスト 0</text>
  <text x="480" y="300" text-anchor="middle">有向の辺が 2s = 12 本</text>
  <text x="480" y="320" text-anchor="middle">どの 2 点の間も c のまま</text>
</svg>
