<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 472" width="560" height="472" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="560" height="472" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-size="15">辺のコストを 1 回だけ 0 にできる（K = 1）</text>
  <text x="280" y="46" text-anchor="middle" font-size="14">始点 0、終点 3</text>
  <!-- 層の帯 -->
  <rect x="20" y="62" width="520" height="96" rx="10" fill="#eef4fb" stroke="#9db4cc"/>
  <rect x="20" y="222" width="520" height="96" rx="10" fill="#f6f1e8" stroke="#c9b48f"/>
  <text x="30" y="80" font-size="13">層 k = 0（まだ使っていない）</text>
  <text x="30" y="312" font-size="13">層 k = 1（1 回使った）</text>
  <!-- 層 0 の辺 -->
  <line x1="102" y1="110" x2="218" y2="110" stroke="#555" stroke-width="2"/>
  <text x="160" y="104" text-anchor="middle">5</text>
  <line x1="242" y1="110" x2="358" y2="110" stroke="#555" stroke-width="2"/>
  <text x="300" y="104" text-anchor="middle">3</text>
  <line x1="382" y1="110" x2="498" y2="110" stroke="#555" stroke-width="2"/>
  <text x="440" y="104" text-anchor="middle">7</text>
  <path d="M100,100 Q230,40 360,100" fill="none" stroke="#555" stroke-width="2"/>
  <text x="230" y="64" text-anchor="middle">9</text>
  <!-- 層 1 の辺 -->
  <line x1="102" y1="270" x2="218" y2="270" stroke="#555" stroke-width="2"/>
  <text x="160" y="290" text-anchor="middle">5</text>
  <line x1="242" y1="270" x2="358" y2="270" stroke="#555" stroke-width="2"/>
  <text x="300" y="290" text-anchor="middle">3</text>
  <line x1="382" y1="270" x2="498" y2="270" stroke="#c0392b" stroke-width="4"/>
  <text x="440" y="290" text-anchor="middle" fill="#c0392b">7</text>
  <path d="M100,280 Q230,340 360,280" fill="none" stroke="#555" stroke-width="2"/>
  <text x="230" y="334" text-anchor="middle">9</text>
  <!-- 層の間の辺（無料で通る。左から右の向きだけを描く） -->
  <line x1="98" y1="122" x2="222" y2="256" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="238" y1="122" x2="362" y2="256" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="378" y1="122" x2="502" y2="256" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <path d="M96,124 Q150,230 358,262" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="146" y="208" fill="#c0392b">0</text>
  <text x="168" y="184">0</text><text x="308" y="184">0</text>
  <text x="448" y="184">0</text>
  
  <!-- 頂点 -->
  <g stroke="#333" stroke-width="2" fill="#ffffff">
    <circle cx="90" cy="110" r="13"/><circle cx="230" cy="110" r="13"/><circle cx="370" cy="110" r="13"/><circle cx="510" cy="110" r="13"/>
    <circle cx="90" cy="270" r="13"/><circle cx="230" cy="270" r="13"/><circle cx="370" cy="270" r="13"/><circle cx="510" cy="270" r="13"/>
  </g>
  <g text-anchor="middle">
    <text x="90" y="115">0</text><text x="230" y="115">1</text><text x="370" y="115">2</text><text x="510" y="115">3</text>
    <text x="90" y="275">0</text><text x="230" y="275">1</text><text x="370" y="275">2</text><text x="510" y="275">3</text>
  </g>
  <!-- 下の説明 -->
  <g font-size="14">
    <text x="30" y="364">dist[3][0] = 15（0→1→2→3）</text>
    <text x="30" y="386">dist[3][1] = 7（0→2 を無料、2→3 に 7）</text>
    <text x="30" y="412">実線：ふつうに通る、破線：無料で通る</text>
    <text x="30" y="434">太線が最短路</text>
  </g>
  <text x="30" y="458" font-size="13">各層の辺は両向き。層の間の破線の逆向きは省いた</text>
</svg>
