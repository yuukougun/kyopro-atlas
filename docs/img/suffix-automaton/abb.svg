<path d="M331.7,132.1 Q281.1,178.2 212.9,183.6" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ag)"/>
<path d="M177.0,185.8 Q104.1,189.2 56.7,133.7" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ag)"/>
<circle cx="45" cy="120" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="45" y="125" font-size="14" text-anchor="middle">0</text>
<circle cx="135" cy="60" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="135" y="65" font-size="14" text-anchor="middle">1</text>
<circle cx="235" cy="60" r="18" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="235" y="65" font-size="14" text-anchor="middle">2</text>
