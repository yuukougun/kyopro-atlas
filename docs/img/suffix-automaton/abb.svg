<text x="195" y="190" font-size="14" text-anchor="middle">4</text>
<text x="45" y="156" font-size="12" text-anchor="middle" fill="#333">{空文字列}</text>
<text x="135" y="34" font-size="12" text-anchor="middle" fill="#333">{a}</text>
<text x="235" y="34" font-size="12" text-anchor="middle" fill="#333">{ab}</text>
<text x="355" y="164" font-size="12" text-anchor="middle" fill="#333">{abb, bb}</text>
<text x="195" y="226" font-size="12" text-anchor="middle" fill="#333">{b}</text>
<line x1="20" y1="258" x2="60" y2="258" stroke="#000" stroke-width="1.6" marker-end="url(#ar)"/><text x="68" y="262" font-size="12">遷移（文字を末尾に足す）</text>
<line x1="20" y1="282" x2="60" y2="282" stroke="#777" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ag)"/><text x="68" y="286" font-size="12">接尾辞リンク</text>
<text x="230" y="262" font-size="12">{ } は状態が表す部分文字列</text>
<text x="230" y="286" font-size="12">太い円は last（S 全体）</text>
