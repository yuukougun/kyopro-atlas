<text x="294" y="431" font-size="15" fill="#1f5fa8">k=1：1 個</text>
<text x="294" y="391" font-size="15" fill="#1f5fa8">k=0：0 個</text>
<text x="12" y="590" font-size="16">帯は直線から x = 6 までの横の距離 (20 − 5j)/3</text>
