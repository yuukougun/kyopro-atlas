<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 666" width="420" height="666" font-family="sans-serif" role="img" aria-label="f(6,5,3,2) の格子点 9 個を、上は列ごとに 0+1+1+2+2+3、下は行ごとに 5+3+1+0 と数える。行の個数は直線から x=6 までの横の距離を切り捨てたもので、上から k=0〜3 と振ると ⌊5k/3⌋、すなわち f(4,3,5,0) の各項になる">
