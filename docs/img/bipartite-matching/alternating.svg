<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 706" width="380" height="706" font-family="sans-serif" font-size="18">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="190" y="30" text-anchor="middle" fill="#222" font-weight="bold">反転の前（大きさ 2）</text>
<line x1="90" y1="75" x2="290" y2="75" stroke="#c0392b" stroke-width="6"/>
<line x1="90" y1="75" x2="290" y2="145" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="90" y1="145" x2="290" y2="145" stroke="#c0392b" stroke-width="6"/>
<line x1="90" y1="145" x2="290" y2="215" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="90" y1="215" x2="290" y2="75" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="90" cy="75" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="90" y="81" text-anchor="middle" fill="#222">L0</text>
<circle cx="90" cy="145" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="90" y="151" text-anchor="middle" fill="#222">L1</text>
<circle cx="90" cy="215" r="20" fill="#ffffff" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/>
<text x="90" y="221" text-anchor="middle" fill="#222">L2</text>
<rect x="270" y="55" width="40" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="290" y="81" text-anchor="middle" fill="#222">R0</text>
<rect x="270" y="125" width="40" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="290" y="151" text-anchor="middle" fill="#222">R1</text>
<rect x="270" y="195" width="40" height="40" fill="#ffffff" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/>
<text x="290" y="221" text-anchor="middle" fill="#222">R2</text>
<text x="190" y="262" text-anchor="middle" fill="#222">増加路 L2→R0→L0→R1→L1→R2</text>
<text x="190" y="286" text-anchor="middle" fill="#222">（両端の L2 と R2 は空き）</text>
<text x="190" y="340" text-anchor="middle" fill="#222" font-size="28">⇓</text>
<text x="190" y="380" text-anchor="middle" fill="#222" font-weight="bold">反転の後（大きさ 3）</text>
<line x1="90" y1="425" x2="290" y2="425" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="90" y1="425" x2="290" y2="495" stroke="#c0392b" stroke-width="6"/>
<line x1="90" y1="495" x2="290" y2="495" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="90" y1="495" x2="290" y2="565" stroke="#c0392b" stroke-width="6"/>
<line x1="90" y1="565" x2="290" y2="425" stroke="#c0392b" stroke-width="6"/>
<circle cx="90" cy="425" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="90" y="431" text-anchor="middle" fill="#222">L0</text>
<circle cx="90" cy="495" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="90" y="501" text-anchor="middle" fill="#222">L1</text>
<circle cx="90" cy="565" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="90" y="571" text-anchor="middle" fill="#222">L2</text>
<rect x="270" y="405" width="40" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="290" y="431" text-anchor="middle" fill="#222">R0</text>
<rect x="270" y="475" width="40" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="290" y="501" text-anchor="middle" fill="#222">R1</text>
<rect x="270" y="545" width="40" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="290" y="571" text-anchor="middle" fill="#222">R2</text>
<text x="190" y="612" text-anchor="middle" fill="#222">組と組でないを入れ替える</text>
<text x="190" y="636" text-anchor="middle" fill="#222">組でない辺が 1 本多いので 1 増える</text>
<text x="190" y="674" text-anchor="middle" fill="#222">太い実線：組　細い破線：組でない</text>
<text x="190" y="698" text-anchor="middle" fill="#222">破線の枠：空いている頂点</text>
</svg>
