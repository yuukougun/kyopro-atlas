<text x="10" y="22" fill="#222">有向グラフ（辺 0→1・0→2・1→2・2→0）</text>
<text x="10" y="42" fill="#222">と、隣接行列 A・A²（行 = 出発、列 = 到着）</text>
<text x="10" y="432" fill="#555" font-size="12">A の (i, j) 成分は i→j の辺の本数である。</text>
<text x="10" y="452" fill="#555" font-size="12">A² の (i, j) 成分は i から j への長さ 2 のウォークの数。</text>
<text x="10" y="474" fill="#c0392b" font-size="12">破線の枠：(A²)₀₂ = A₀₀A₀₂ + A₀₁A₁₂ + A₀₂A₂₂</text>
<text x="10" y="492" fill="#c0392b" font-size="12">= 0 + 1·1 + 0 = 1（0→1→2 の 1 本）</text>
<text x="10" y="514" fill="#555" font-size="12">(0, 0) 成分の 1 は 0→2→0、(2, 2) 成分の 1 は</text>
<text x="10" y="532" fill="#555" font-size="12">2→0→2 のウォークである。</text>
