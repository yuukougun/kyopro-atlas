<text x="20" y="262" fill="#555" font-size="12">A の (i, j) 成分は i→j の辺の本数である。</text>
<text x="20" y="282" fill="#c0392b" font-size="12">破線の枠：(A²)₀₂ = A₀₀A₀₂ + A₀₁A₁₂ + A₀₂A₂₂ = 0 + 1·1 + 0 = 1（0→1→2 の 1 本）</text>
<text x="20" y="302" fill="#555" font-size="12">(0, 0) 成分の 1 は 0→2→0、(2, 2) 成分の 1 は 2→0→2 の歩道である。</text>
