<text x="278" y="80" font-size="13" fill="#222">丸の数字は出発からの歩数 t</text>
<text x="278" y="106" font-size="13" fill="#222">1 歩で i + j は ±1 変わる</text>
<text x="278" y="132" font-size="13" fill="#222">→ 色が必ず入れ替わる</text>
<text x="278" y="170" font-size="13" fill="#222">t が偶数のとき灰のマス、</text>
