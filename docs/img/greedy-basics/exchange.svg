<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 312" width="520" height="312" font-family="sans-serif">
  <rect x="0" y="0" width="520" height="312" fill="#ffffff"/>
  <text x="16" y="28" font-size="16" fill="#222">値 9, 7, 6, 4, 2 から 3 個選び、和を最大にする</text>
  <!-- column highlight: the first value only G chose -->
  <rect x="226" y="44" width="68" height="206" fill="#fff4cc" stroke="#c99a00" stroke-dasharray="6 4"/>
  <text x="260" y="270" font-size="15" fill="#7a5c00" text-anchor="middle">G だけが選んだ最初の値</text>
  <!-- header values -->
  <g font-size="16" fill="#222" text-anchor="middle">
    <text x="190" y="66">9</text><text x="260" y="66">7</text><text x="330" y="66">6</text><text x="400" y="66">4</text><text x="470" y="66">2</text>
  </g>
  <!-- row labels -->
  <g font-size="15" fill="#222">
    <text x="16" y="102">貪欲解 G</text>
    <text x="16" y="162">ほかの解 O</text>
    <text x="16" y="222">入れ替えた O′</text>
  </g>
  <g font-size="15" fill="#444">
    <text x="16" y="120">和 22</text>
    <text x="16" y="180">和 19</text>
    <text x="16" y="240">和 22（= G）</text>
  </g>
  <!-- G: 9 7 6 -->
  <g stroke="#1f4e8c" stroke-width="2" fill="#cfe0f5">
    <rect x="164" y="82" width="52" height="38"/>
    <rect x="234" y="82" width="52" height="38"/>
    <rect x="304" y="82" width="52" height="38"/>
  </g>
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="#ffffff">
    <rect x="374" y="82" width="52" height="38"/>
    <rect x="444" y="82" width="52" height="38"/>
  </g>
  <!-- O: 9 6 4 -->
  <g stroke="#1f4e8c" stroke-width="2" fill="#cfe0f5">
    <rect x="164" y="142" width="52" height="38"/>
    <rect x="304" y="142" width="52" height="38"/>
    <rect x="374" y="142" width="52" height="38"/>
  </g>
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="#ffffff">
    <rect x="234" y="142" width="52" height="38"/>
    <rect x="444" y="142" width="52" height="38"/>
  </g>
  <!-- O': 9 7 6 -->
  <g stroke="#1f4e8c" stroke-width="2" fill="#cfe0f5">
    <rect x="164" y="202" width="52" height="38"/>
    <rect x="234" y="202" width="52" height="38"/>
    <rect x="304" y="202" width="52" height="38"/>
  </g>
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="#ffffff">
    <rect x="374" y="202" width="52" height="38"/>
    <rect x="444" y="202" width="52" height="38"/>
  </g>
  <!-- labels in boxes -->
  <g font-size="15" text-anchor="middle" fill="#1f4e8c">
    <text x="190" y="106">選ぶ</text><text x="260" y="106">選ぶ</text><text x="330" y="106">選ぶ</text>
    <text x="190" y="166">選ぶ</text><text x="330" y="166">選ぶ</text><text x="400" y="166">選ぶ</text>
    <text x="190" y="226">選ぶ</text><text x="260" y="226">選ぶ</text><text x="330" y="226">選ぶ</text>
  </g>
  <!-- arrow: from O's 4 to 7 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <path d="M400,180 C400,194 290,190 272,200" fill="none" stroke="#b03a2e" stroke-width="2" marker-end="url(#ah)"/>
  <text x="16" y="300" font-size="15" fill="#b03a2e">O の 4 を 7 に替える：和は 7 − 4 = 3 増える</text>
</svg>
