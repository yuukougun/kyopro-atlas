<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" fill="#222">値 9, 7, 6, 4, 2 から 3 個選んで和を最大にする（大きい順に並べてある）</text>
  <!-- column highlight: first difference -->
  <rect x="268" y="44" width="64" height="232" fill="#fff4cc" stroke="#c99a00" stroke-dasharray="6 4"/>
  <text x="300" y="296" font-size="13" fill="#7a5c00" text-anchor="middle">最初に違う所</text>
  <!-- header values -->
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="220" y="66">9</text><text x="300" y="66">7</text><text x="380" y="66">6</text><text x="460" y="66">4</text><text x="540" y="66">2</text>
  </g>
  <!-- row labels -->
  <g font-size="14" fill="#222">
    <text x="20" y="110">貪欲解 G</text>
    <text x="20" y="170">ほかの解 O</text>
    <text x="20" y="230">入れ替えた O′</text>
  </g>
  <g font-size="12" fill="#444">
    <text x="20" y="126">和 22</text>
    <text x="20" y="186">和 19</text>
    <text x="20" y="246">和 22（G と同じ）</text>
  </g>
  <!-- G: 9 7 6 -->
  <g stroke="#1f4e8c" stroke-width="2">
    <rect x="196" y="88" width="48" height="36" fill="#cfe0f5"/>
    <rect x="276" y="88" width="48" height="36" fill="#cfe0f5"/>
    <rect x="356" y="88" width="48" height="36" fill="#cfe0f5"/>
  </g>
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="#ffffff">
    <rect x="436" y="88" width="48" height="36"/>
    <rect x="516" y="88" width="48" height="36"/>
  </g>
  <!-- O: 9 6 4 -->
  <g stroke="#1f4e8c" stroke-width="2">
    <rect x="196" y="148" width="48" height="36" fill="#cfe0f5"/>
    <rect x="356" y="148" width="48" height="36" fill="#cfe0f5"/>
    <rect x="436" y="148" width="48" height="36" fill="#cfe0f5"/>
  </g>
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="#ffffff">
    <rect x="276" y="148" width="48" height="36"/>
    <rect x="516" y="148" width="48" height="36"/>
  </g>
  <!-- O': 9 7 6 -->
  <g stroke="#1f4e8c" stroke-width="2">
    <rect x="196" y="208" width="48" height="36" fill="#cfe0f5"/>
    <rect x="276" y="208" width="48" height="36" fill="#cfe0f5"/>
    <rect x="356" y="208" width="48" height="36" fill="#cfe0f5"/>
  </g>
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="#ffffff">
    <rect x="436" y="208" width="48" height="36"/>
    <rect x="516" y="208" width="48" height="36"/>
  </g>
  <!-- labels in boxes -->
  <g font-size="13" text-anchor="middle" fill="#1f4e8c">
    <text x="220" y="111">選ぶ</text><text x="300" y="111">選ぶ</text><text x="380" y="111">選ぶ</text>
    <text x="220" y="171">選ぶ</text><text x="380" y="171">選ぶ</text><text x="460" y="171">選ぶ</text>
    <text x="220" y="231">選ぶ</text><text x="300" y="231">選ぶ</text><text x="380" y="231">選ぶ</text>
  </g>
  <!-- arrow: from O's 4 to 7 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <path d="M460,186 C460,200 330,196 312,206" fill="none" stroke="#b03a2e" stroke-width="2" marker-end="url(#ah)"/>
  <text x="320" y="318" font-size="13" fill="#b03a2e" text-anchor="middle">O の 4 を、G が選んだ 7 に替える：和は 7 − 4 = 3 増える（減らない）</text>
</svg>
