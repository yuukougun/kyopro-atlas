<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 506" width="320" height="506" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text x="10" y="24" font-size="15" font-weight="bold" fill="#000">a = 38, b = 14 の拡張ユークリッドの互除法</text>
<text x="10" y="46" font-size="13" fill="#333">次の行 ＝ 前の行 − q × この行</text>
<text x="10" y="64" font-size="13" fill="#333">（r・x・y のどれにも同じ計算をする）</text>
<rect x="8" y="78" width="304" height="30" fill="#eeeeee" stroke="#666"/>
<text x="36" y="98" text-anchor="middle" font-weight="bold" fill="#000">行 i</text>
<text x="96" y="98" text-anchor="middle" font-weight="bold" fill="#000">余り r</text>
<text x="156" y="98" text-anchor="middle" font-weight="bold" fill="#000">商 q</text>
<text x="216" y="98" text-anchor="middle" font-weight="bold" fill="#000">x</text>
<text x="276" y="98" text-anchor="middle" font-weight="bold" fill="#000">y</text>
<rect x="8" y="108" width="304" height="50" fill="#ffffff" stroke="#666" stroke-width="1"/>
<text x="36" y="129" text-anchor="middle" fill="#000">0</text>
<text x="96" y="129" text-anchor="middle" fill="#000">38</text>
<text x="156" y="129" text-anchor="middle" fill="#000">—</text>
<text x="216" y="129" text-anchor="middle" fill="#000">1</text>
<text x="276" y="129" text-anchor="middle" fill="#000">0</text>
<text x="160" y="149" text-anchor="middle" font-size="13" fill="#555">確かめ：38·1 + 14·0 = 38</text>
<rect x="8" y="158" width="304" height="50" fill="#ffffff" stroke="#666" stroke-width="1"/>
<text x="36" y="179" text-anchor="middle" fill="#000">1</text>
<text x="96" y="179" text-anchor="middle" fill="#000">14</text>
<text x="156" y="179" text-anchor="middle" fill="#000">2</text>
<text x="216" y="179" text-anchor="middle" fill="#000">0</text>
<text x="276" y="179" text-anchor="middle" fill="#000">1</text>
<text x="160" y="199" text-anchor="middle" font-size="13" fill="#555">確かめ：38·0 + 14·1 = 14</text>
<rect x="8" y="208" width="304" height="50" fill="#ffffff" stroke="#666" stroke-width="1"/>
<text x="36" y="229" text-anchor="middle" fill="#000">2</text>
<text x="96" y="229" text-anchor="middle" fill="#000">10</text>
<text x="156" y="229" text-anchor="middle" fill="#000">1</text>
<text x="216" y="229" text-anchor="middle" fill="#000">1</text>
<text x="276" y="229" text-anchor="middle" fill="#000">−2</text>
<text x="160" y="249" text-anchor="middle" font-size="13" fill="#555">確かめ：38·1 + 14·(−2) = 10</text>
<rect x="8" y="258" width="304" height="50" fill="#ffffff" stroke="#666" stroke-width="1"/>
<text x="36" y="279" text-anchor="middle" fill="#000">3</text>
<text x="96" y="279" text-anchor="middle" fill="#000">4</text>
<text x="156" y="279" text-anchor="middle" fill="#000">2</text>
<text x="216" y="279" text-anchor="middle" fill="#000">−1</text>
<text x="276" y="279" text-anchor="middle" fill="#000">3</text>
<text x="160" y="299" text-anchor="middle" font-size="13" fill="#555">確かめ：38·(−1) + 14·3 = 4</text>
<rect x="8" y="308" width="304" height="50" fill="#fff4cc" stroke="#666" stroke-width="2.5"/>
<text x="36" y="329" text-anchor="middle" fill="#000">4</text>
<text x="96" y="329" text-anchor="middle" fill="#000">2</text>
<text x="156" y="329" text-anchor="middle" fill="#000">2</text>
<text x="216" y="329" text-anchor="middle" fill="#000">3</text>
<text x="276" y="329" text-anchor="middle" fill="#000">−8</text>
<text x="160" y="349" text-anchor="middle" font-size="13" fill="#555">確かめ：38·3 + 14·(−8) = 2</text>
<rect x="8" y="358" width="304" height="50" fill="#ffffff" stroke="#666" stroke-width="1" stroke-dasharray="6 4"/>
<text x="36" y="379" text-anchor="middle" fill="#000">5</text>
<text x="96" y="379" text-anchor="middle" fill="#000">0</text>
<text x="156" y="379" text-anchor="middle" fill="#000">—</text>
<text x="216" y="379" text-anchor="middle" fill="#000">−7</text>
<text x="276" y="379" text-anchor="middle" fill="#000">19</text>
<text x="160" y="399" text-anchor="middle" font-size="13" fill="#555">確かめ：38·(−7) + 14·19 = 0</text>
<text x="10" y="432" font-size="14" fill="#000">太枠（r = 2）：g = 2 で、(x, y) = (3, −8) が</text>
<text x="10" y="452" font-size="14" fill="#000">38x + 14y = 2 の解</text>
<text x="10" y="472" font-size="14" fill="#000">破線（r = 0）：(−7, 19) = (−b/g, a/g)。</text>
<text x="10" y="492" font-size="14" fill="#000">何倍足しても 38x + 14y は同じ</text>
</svg>
