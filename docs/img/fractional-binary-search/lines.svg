<text x="35" y="334" text-anchor="end" fill="#444" font-size="13">-10</text>
<text x="35" y="234" text-anchor="end" fill="#444" font-size="13">0</text>
<text x="35" y="134" text-anchor="end" fill="#444" font-size="13">10</text>
<text x="370.0" y="398" text-anchor="end" fill="#444" font-size="13">x（候補の答え）</text>
<line x1="216.0" y1="70" x2="216.0" y2="360" stroke="#999" stroke-dasharray="3 3"/>
<line x1="304.0" y1="70" x2="304.0" y2="360" stroke="#999" stroke-dasharray="3 3"/>
<text x="221.0" y="90" fill="#444" font-size="13">x = 4/3：</text>
<text x="221.0" y="108.0" fill="#444" font-size="13">C と B が</text>
<text x="221.0" y="126.0" fill="#444" font-size="13">入れ替わる</text>
<text x="309.0" y="90" fill="#444" font-size="13">x = 2：</text>
<text x="309.0" y="108.0" fill="#444" font-size="13">g(x) = 0</text>
<line x1="40" y1="190.0" x2="370.0" y2="215.0" stroke="#1f4e9a" stroke-width="2"/>
<line x1="40" y1="230.0" x2="370.0" y2="255.0" stroke="#b5462a" stroke-width="2" stroke-dasharray="8 4"/>
<line x1="40" y1="110.0" x2="370.0" y2="360.0" stroke="#2a7a3b" stroke-width="2" stroke-dasharray="2 3"/>
<polyline points="40,70.0 216.0,216.7 370.0,240.0" fill="none" stroke="#222" stroke-width="4"/>
<circle cx="304" cy="230" r="5" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="374.0" y="220.0" fill="#1f4e9a" font-size="13">A</text>
<text x="374.0" y="260.0" fill="#b5462a" font-size="13">B</text>
<text x="70" y="155.0" fill="#2a7a3b" font-size="13">C</text>
<line x1="52" y1="280" x2="80" y2="280" stroke="#1f4e9a" stroke-width="2"/>
<text x="86" y="285" fill="#222" font-size="13">A：4 − x</text>
<line x1="52" y1="300" x2="80" y2="300" stroke="#b5462a" stroke-width="2" stroke-dasharray="8 4"/>
<text x="86" y="305" fill="#222" font-size="13">B：0 − x</text>
<line x1="52" y1="320" x2="80" y2="320" stroke="#2a7a3b" stroke-width="2" stroke-dasharray="2 3"/>
<text x="86" y="325" fill="#222" font-size="13">C：12 − 10x</text>
<line x1="52" y1="340" x2="80" y2="340" stroke="#222" stroke-width="4"/>
<text x="86" y="345" fill="#222" font-size="13">g(x)：上位 2 個の和</text>
</g>
</svg>
