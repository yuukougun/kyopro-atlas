<svg xmlns="http://www.w3.org/2000/svg" width="400" height="412" viewBox="0 0 400 412" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0 1)">
<text x="16" y="22" fill="#222">各要素の値 a − x·b を x の関数として描く</text>
<text x="16" y="42" fill="#555" font-size="13">K = 2 個を選ぶ。A = (a 4, b 1)・B = (a 0, b 1)・</text>
<text x="16" y="60" fill="#555" font-size="13">C = (a 12, b 10)</text>
<line x1="40" y1="230" x2="370.0" y2="230" stroke="#888"/>
<line x1="40" y1="70" x2="40" y2="360" stroke="#888"/>
<line x1="40" y1="226" x2="40" y2="234" stroke="#888"/>
<text x="40" y="380" text-anchor="middle" fill="#444" font-size="13">0</text>
<line x1="106" y1="226" x2="106" y2="234" stroke="#888"/>
<text x="106" y="380" text-anchor="middle" fill="#444" font-size="13">0.5</text>
<line x1="172" y1="226" x2="172" y2="234" stroke="#888"/>
<text x="172" y="380" text-anchor="middle" fill="#444" font-size="13">1</text>
<line x1="238" y1="226" x2="238" y2="234" stroke="#888"/>
<text x="238" y="380" text-anchor="middle" fill="#444" font-size="13">1.5</text>
<line x1="304" y1="226" x2="304" y2="234" stroke="#888"/>
<text x="304" y="380" text-anchor="middle" fill="#444" font-size="13">2</text>
<line x1="370" y1="226" x2="370" y2="234" stroke="#888"/>
