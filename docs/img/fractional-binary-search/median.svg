<svg xmlns="http://www.w3.org/2000/svg" width="400" height="356" viewBox="0 0 400 356" font-family="sans-serif" font-size="14">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="24" fill="#222">x = 5 として、5 以上を +1、5 未満を −1 に</text>
<text x="16" y="44" fill="#222">塗り替える</text>
<text x="84" y="88" text-anchor="end" fill="#444">元の列</text>
<text x="84" y="142" text-anchor="end" fill="#444">塗り替え</text>
<rect x="92" y="64" width="48" height="36" fill="#ffffff" stroke="#666"/>
<text x="116" y="88" text-anchor="middle" fill="#222">3</text>
<rect x="92" y="118" width="48" height="36" fill="url(#hatch)" stroke="#666" stroke-dasharray="4 2"/>
<rect x="102" y="127" width="28" height="18" fill="#ffffff"/>
<text x="116" y="141" text-anchor="middle" fill="#333">−1</text>
<rect x="140" y="64" width="48" height="36" fill="#ffffff" stroke="#666"/>
<text x="164" y="88" text-anchor="middle" fill="#222">7</text>
<rect x="140" y="118" width="48" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="164" y="142" text-anchor="middle" fill="#1f4e9a" font-weight="bold">+1</text>
<rect x="188" y="64" width="48" height="36" fill="#ffffff" stroke="#666"/>
<text x="212" y="88" text-anchor="middle" fill="#222">1</text>
<rect x="188" y="118" width="48" height="36" fill="url(#hatch)" stroke="#666" stroke-dasharray="4 2"/>
<rect x="198" y="127" width="28" height="18" fill="#ffffff"/>
<text x="212" y="141" text-anchor="middle" fill="#333">−1</text>
<rect x="236" y="64" width="48" height="36" fill="#ffffff" stroke="#666"/>
<text x="260" y="88" text-anchor="middle" fill="#222">5</text>
<rect x="236" y="118" width="48" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="260" y="142" text-anchor="middle" fill="#1f4e9a" font-weight="bold">+1</text>
<rect x="284" y="64" width="48" height="36" fill="#ffffff" stroke="#666"/>
<text x="308" y="88" text-anchor="middle" fill="#222">9</text>
<rect x="284" y="118" width="48" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="308" y="142" text-anchor="middle" fill="#1f4e9a" font-weight="bold">+1</text>
<rect x="332" y="64" width="48" height="36" fill="#ffffff" stroke="#666"/>
<text x="356" y="88" text-anchor="middle" fill="#222">2</text>
<rect x="332" y="118" width="48" height="36" fill="url(#hatch)" stroke="#666" stroke-dasharray="4 2"/>
<rect x="342" y="127" width="28" height="18" fill="#ffffff"/>
<text x="356" y="141" text-anchor="middle" fill="#333">−1</text>
<text x="380" y="176" text-anchor="end" fill="#222">和 = 0</text>
<text x="16" y="214" fill="#444">並べ替えると 1, 2, 3, 5, 7, 9</text>
<text x="16" y="234" fill="#444">（6 個なので中央は 3 番目と 4 番目）</text>
<text x="16" y="264" fill="#222">・小さい方の中央値（3 番目）= 3 &lt; 5。</text>
<text x="16" y="284" fill="#222">　和 0 は「正」でないので、判定は不可</text>
<text x="16" y="310" fill="#222">・大きい方の中央値（4 番目）= 5 ≥ 5。</text>
<text x="16" y="330" fill="#222">　和 0 は「0 以上」なので、判定は可</text>
</svg>
