<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="sans-serif" font-size="14">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="26" fill="#222">x = 5 として、5 以上を +1、5 未満を −1 に塗り替える</text>
<text x="118" y="72" text-anchor="end" fill="#444">元の列</text>
<text x="118" y="132" text-anchor="end" fill="#444">塗り替え</text>
<rect x="130" y="47" width="56" height="40" fill="#ffffff" stroke="#666"/>
<text x="158.0" y="73" text-anchor="middle" fill="#222">3</text>
<rect x="130" y="107" width="56" height="40" fill="url(#hatch)" stroke="#666" stroke-dasharray="4 2"/>
<rect x="144" y="117" width="28" height="20" fill="#ffffff"/>
<text x="158.0" y="132" text-anchor="middle" fill="#333">−1</text>
<rect x="186" y="47" width="56" height="40" fill="#ffffff" stroke="#666"/>
<text x="214.0" y="73" text-anchor="middle" fill="#222">7</text>
<rect x="186" y="107" width="56" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="214.0" y="133" text-anchor="middle" fill="#1f4e9a" font-weight="bold">+1</text>
<rect x="242" y="47" width="56" height="40" fill="#ffffff" stroke="#666"/>
<text x="270.0" y="73" text-anchor="middle" fill="#222">1</text>
<rect x="242" y="107" width="56" height="40" fill="url(#hatch)" stroke="#666" stroke-dasharray="4 2"/>
<rect x="256" y="117" width="28" height="20" fill="#ffffff"/>
<text x="270.0" y="132" text-anchor="middle" fill="#333">−1</text>
<rect x="298" y="47" width="56" height="40" fill="#ffffff" stroke="#666"/>
<text x="326.0" y="73" text-anchor="middle" fill="#222">5</text>
<rect x="298" y="107" width="56" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="326.0" y="133" text-anchor="middle" fill="#1f4e9a" font-weight="bold">+1</text>
<rect x="354" y="47" width="56" height="40" fill="#ffffff" stroke="#666"/>
<text x="382.0" y="73" text-anchor="middle" fill="#222">9</text>
<rect x="354" y="107" width="56" height="40" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="382.0" y="133" text-anchor="middle" fill="#1f4e9a" font-weight="bold">+1</text>
<rect x="410" y="47" width="56" height="40" fill="#ffffff" stroke="#666"/>
<text x="438.0" y="73" text-anchor="middle" fill="#222">2</text>
<rect x="410" y="107" width="56" height="40" fill="url(#hatch)" stroke="#666" stroke-dasharray="4 2"/>
<rect x="424" y="117" width="28" height="20" fill="#ffffff"/>
<text x="438.0" y="132" text-anchor="middle" fill="#333">−1</text>
<text x="480" y="133" fill="#222">和 = 0</text>
<text x="30" y="180" fill="#444">並べ替えると 1, 2, 3, 5, 7, 9（6 個なので中央は 3 番目と 4 番目）</text>
<text x="30" y="212" fill="#222">・小さい方の中央値（3 番目）= 3 &lt; 5。和 0 は「正」でないので、判定は不可</text>
<text x="30" y="240" fill="#222">・大きい方の中央値（4 番目）= 5 ≥ 5。和 0 は「0 以上」なので、判定は可</text>
<text x="30" y="272" fill="#555" font-size="12">偶数個のときだけ、和が 0 になる場合の扱いが定義で分かれる</text>
</svg>
