<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" font-family="sans-serif" font-size="14">
<rect x="0" y="0" width="400" height="220" fill="#ffffff"/>
<!-- 格子 -->
<g stroke="#e3e3e3" stroke-width="1">
<path d="M30,180 H90 M30,150 H90 M30,120 H90 M30,90 H90"/>
<path d="M30,90 V180 M60,90 V180 M90,90 V180"/>
<path d="M130,180 H160 M130,150 H160 M130,120 H160"/>
<path d="M130,120 V180 M160,120 V180"/>
<path d="M240,180 H330 M240,150 H330 M240,120 H330 M240,90 H330"/>
<path d="M240,90 V180 M270,90 V180 M300,90 V180 M330,90 V180"/>
</g>
<!-- A -->
<polygon points="30,180 90,180 30,120" fill="#dbe6f7" stroke="#1f4e9a" stroke-width="3"/>
<text x="42" y="168" fill="#1f4e9a" font-weight="bold">A</text>
<text x="24" y="200" font-size="12">(0,0)</text>
<!-- B -->
<polygon points="130,180 160,180 160,150 130,150" fill="#f6dcd8" stroke="#b03a2e" stroke-width="3" stroke-dasharray="6,4"/>
<text x="139" y="171" fill="#b03a2e" font-weight="bold">B</text>
<text x="124" y="200" font-size="12">(0,0)</text>
<text x="104" y="160" font-size="20">+</text>
<text x="190" y="135" font-size="20">=</text>
<!-- A+B -->
<polygon points="240,180 330,180 330,150 270,90 240,90" fill="#eeeeee" stroke="none"/>
<g stroke-width="3" fill="none">
<path d="M240,180 H300" stroke="#1f4e9a"/>
<path d="M300,180 H330 V150" stroke="#b03a2e" stroke-dasharray="6,4"/>
<path d="M330,150 L270,90" stroke="#1f4e9a"/>
<path d="M270,90 H240" stroke="#b03a2e" stroke-dasharray="6,4"/>
<path d="M240,90 V150" stroke="#1f4e9a"/>
<path d="M240,150 V180" stroke="#b03a2e" stroke-dasharray="6,4"/>
</g>
<text x="262" y="150" font-weight="bold">A ⊕ B</text>
<text x="234" y="200" font-size="12">(0,0)</text>
<text x="334" y="198" font-size="12">(3,0)</text>
<text x="336" y="152" font-size="12">(3,1)</text>
<text x="262" y="80" font-size="12">(1,3)</text>
<text x="206" y="86" font-size="12">(0,3)</text>
<!-- 凡例 -->
<path d="M20,30 H50" stroke="#1f4e9a" stroke-width="3"/>
<text x="56" y="35" font-size="13">A の辺（実線）</text>
<path d="M200,30 H230" stroke="#b03a2e" stroke-width="3" stroke-dasharray="6,4"/>
<text x="236" y="35" font-size="13">B の辺（破線）</text>
</svg>
