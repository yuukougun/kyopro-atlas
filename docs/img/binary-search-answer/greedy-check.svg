<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 250" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="33" fill="#222">x = 5：前の切れ目から 5 以上離れた最初の候補で切る</text>
<rect x="40" y="55" width="240" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="160.0" y="75" text-anchor="middle" fill="#222">5</text>
<rect x="280" y="55" width="240" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="400.0" y="75" text-anchor="middle" fill="#222">5</text>
<line x1="184" y1="55" x2="184" y2="85" stroke="#888" stroke-dasharray="2 3"/>
<text x="184" y="107" text-anchor="middle" fill="#555" font-size="12">3</text>
<line x1="280" y1="47" x2="280" y2="93" stroke="#c0392b" stroke-width="3"/>
<text x="280" y="107" text-anchor="middle" fill="#555" font-size="12">5</text>
<line x1="376" y1="55" x2="376" y2="85" stroke="#888" stroke-dasharray="2 3"/>
<text x="376" y="107" text-anchor="middle" fill="#555" font-size="12">7</text>
<text x="40" y="107" text-anchor="middle" fill="#555" font-size="12">0</text>
<text x="520" y="107" text-anchor="middle" fill="#555" font-size="12">10</text>
<text x="536" y="75" fill="#222">2 個 → 可</text>
<text x="40" y="148" fill="#222">x = 6：7 で切ると、右の残り 3 が 6 に届かない</text>
<rect x="40" y="170" width="336" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="208.0" y="190" text-anchor="middle" fill="#222">7</text>
<rect x="376" y="170" width="144" height="30" fill="#f3f3f3" stroke="#1f4e9a" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="448.0" y="190" text-anchor="middle" fill="#222">3（足りない）</text>
<line x1="184" y1="170" x2="184" y2="200" stroke="#888" stroke-dasharray="2 3"/>
<text x="184" y="222" text-anchor="middle" fill="#555" font-size="12">3</text>
<line x1="280" y1="170" x2="280" y2="200" stroke="#888" stroke-dasharray="2 3"/>
<text x="280" y="222" text-anchor="middle" fill="#555" font-size="12">5</text>
<line x1="376" y1="162" x2="376" y2="208" stroke="#c0392b" stroke-width="3"/>
<text x="376" y="222" text-anchor="middle" fill="#555" font-size="12">7</text>
<text x="40" y="222" text-anchor="middle" fill="#555" font-size="12">0</text>
<text x="520" y="222" text-anchor="middle" fill="#555" font-size="12">10</text>
<text x="536" y="190" fill="#222">1 個 → 不可</text>
<text x="40" y="242" fill="#555" font-size="12">赤い太線：切る位置　点線：切らない候補　点線の枠：x に届かず数えない残り</text>
</svg>