<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="26" fill="#222">x = 5：前の切れ目から 5 以上離れた最初の候補で切る</text>
<rect x="16" y="42" width="160" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="96" y="62" text-anchor="middle" fill="#222">5</text>
<rect x="176" y="42" width="160" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="256" y="62" text-anchor="middle" fill="#222">5</text>
<line x1="112" y1="42" x2="112" y2="72" stroke="#888" stroke-dasharray="2 3"/>
<line x1="240" y1="42" x2="240" y2="72" stroke="#888" stroke-dasharray="2 3"/>
<line x1="176" y1="34" x2="176" y2="80" stroke="#c0392b" stroke-width="3"/>
<text x="16" y="96" text-anchor="middle" fill="#555" font-size="13">0</text>
<text x="112" y="96" text-anchor="middle" fill="#555" font-size="13">3</text>
<text x="176" y="96" text-anchor="middle" fill="#555" font-size="13">5</text>
<text x="240" y="96" text-anchor="middle" fill="#555" font-size="13">7</text>
<text x="336" y="96" text-anchor="middle" fill="#555" font-size="13">10</text>
<text x="16" y="120" fill="#222">→ 2 個に切れるので可</text>
<text x="16" y="160" fill="#222">x = 6：7 で切ると、右の残り 3 が 6 に届かない</text>
<rect x="16" y="176" width="224" height="30" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="128" y="196" text-anchor="middle" fill="#222">7</text>
<rect x="240" y="176" width="96" height="30" fill="#f3f3f3" stroke="#1f4e9a" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="288" y="196" text-anchor="middle" fill="#222">3（不足）</text>
<line x1="112" y1="176" x2="112" y2="206" stroke="#888" stroke-dasharray="2 3"/>
<line x1="176" y1="176" x2="176" y2="206" stroke="#888" stroke-dasharray="2 3"/>
<line x1="240" y1="168" x2="240" y2="214" stroke="#c0392b" stroke-width="3"/>
<text x="16" y="230" text-anchor="middle" fill="#555" font-size="13">0</text>
<text x="112" y="230" text-anchor="middle" fill="#555" font-size="13">3</text>
<text x="176" y="230" text-anchor="middle" fill="#555" font-size="13">5</text>
<text x="240" y="230" text-anchor="middle" fill="#555" font-size="13">7</text>
<text x="336" y="230" text-anchor="middle" fill="#555" font-size="13">10</text>
<text x="16" y="254" fill="#222">→ 1 個しか切れないので不可</text>
<text x="16" y="286" fill="#555" font-size="13">赤い太線：切る位置　点線：切らない候補</text>
<text x="16" y="306" fill="#555" font-size="13">点線の枠：x に届かず数えない残り</text>
</svg>
