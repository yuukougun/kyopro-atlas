<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 718" width="340" height="718" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="340" height="718" fill="#ffffff"/>
  <!-- 左：点と枠。原点 (40, 330)、1 目盛り 32px。D = 3（時刻）、W = 2（位置） -->
  <text x="20" y="28" font-weight="bold">点 P = (5, 4) と枠（D = 3、W = 2）</text>
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="72" y1="90" x2="72" y2="330"/><line x1="104" y1="90" x2="104" y2="330"/>
    <line x1="136" y1="90" x2="136" y2="330"/><line x1="168" y1="90" x2="168" y2="330"/>
    <line x1="200" y1="90" x2="200" y2="330"/><line x1="232" y1="90" x2="232" y2="330"/>
    <line x1="264" y1="90" x2="264" y2="330"/><line x1="296" y1="90" x2="296" y2="330"/>
    <line x1="40" y1="298" x2="296" y2="298"/><line x1="40" y1="266" x2="296" y2="266"/>
    <line x1="40" y1="234" x2="296" y2="234"/><line x1="40" y1="202" x2="296" y2="202"/>
    <line x1="40" y1="170" x2="296" y2="170"/><line x1="40" y1="138" x2="296" y2="138"/>
    <line x1="40" y1="106" x2="296" y2="106"/>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <line x1="40" y1="330" x2="310" y2="330"/><line x1="40" y1="330" x2="40" y2="80"/>
  </g>
  <text x="314" y="335">t</text><text x="34" y="72">x</text>
  <g font-size="15" fill="#555" text-anchor="middle">
    <text x="40" y="347">0</text><text x="136" y="347">3</text><text x="200" y="347">5</text><text x="232" y="347">6</text>
  </g>
  <g font-size="15" fill="#555" text-anchor="end">
    <text x="34" y="238">3</text><text x="34" y="206">4</text><text x="34" y="174">5</text>
  </g>
  <!-- 枠 [s, s+3) × [L, L+2)、(s, L) = (3, 3) -->
  <rect x="136" y="170" width="96" height="64" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2.5"/>
  <circle cx="136" cy="234" r="5" fill="#ffffff" stroke="#1a56c4" stroke-width="2.5"/>
  <text x="128" y="256" font-size="15" fill="#1a56c4" text-anchor="end">(s, L)</text>
  <circle cx="200" cy="202" r="6" fill="#333"/>
  <text x="208" y="196" font-size="15">P</text>

  <g transform="translate(-340, 360)">
  <!-- 右（左の下に積む）：左下の角 (s, L) の取りうる範囲。原点 (380, 330)、1 目盛り 32px -->
  <text x="360" y="28" font-weight="bold">P を覆う枠の左下の角 (s, L)</text>
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="412" y1="90" x2="412" y2="330"/><line x1="444" y1="90" x2="444" y2="330"/>
    <line x1="476" y1="90" x2="476" y2="330"/><line x1="508" y1="90" x2="508" y2="330"/>
    <line x1="540" y1="90" x2="540" y2="330"/><line x1="572" y1="90" x2="572" y2="330"/>
    <line x1="604" y1="90" x2="604" y2="330"/><line x1="636" y1="90" x2="636" y2="330"/>
    <line x1="380" y1="298" x2="636" y2="298"/><line x1="380" y1="266" x2="636" y2="266"/>
    <line x1="380" y1="234" x2="636" y2="234"/><line x1="380" y1="202" x2="636" y2="202"/>
    <line x1="380" y1="170" x2="636" y2="170"/><line x1="380" y1="138" x2="636" y2="138"/>
    <line x1="380" y1="106" x2="636" y2="106"/>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <line x1="380" y1="330" x2="650" y2="330"/><line x1="380" y1="330" x2="380" y2="80"/>
  </g>
  <text x="654" y="335">s</text><text x="374" y="72">L</text>
  <g font-size="15" fill="#555" text-anchor="middle">
    <text x="380" y="347">0</text><text x="476" y="347">3</text><text x="540" y="347">5</text>
  </g>
  <g font-size="15" fill="#555" text-anchor="end">
    <text x="374" y="238">3</text><text x="374" y="206">4</text>
  </g>
  <!-- s が [3, 5]、L が [3, 4] の格子点 -->
  <rect x="468" y="194" width="80" height="48" fill="#fdf0e0" stroke="#b25e00" stroke-width="2" stroke-dasharray="6 3"/>
  <g fill="#b25e00">
    <circle cx="476" cy="234" r="5"/><circle cx="508" cy="234" r="5"/><circle cx="540" cy="234" r="5"/>
    <circle cx="476" cy="202" r="5"/><circle cx="508" cy="202" r="5"/><circle cx="540" cy="202" r="5"/>
  </g>
  <circle cx="476" cy="234" r="8" fill="none" stroke="#1a56c4" stroke-width="2.5"/>
  </g>
</svg>
