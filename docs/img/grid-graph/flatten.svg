<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 660" font-family="sans-serif">
<rect width="440" height="660" fill="#ffffff"/>
<text x="20" y="30" font-size="16" fill="#222">H = 3, W = 4：番号 = i×W + j</text>
<text x="20" y="52" font-size="14" fill="#333">（灰色は i + j が奇数）</text>
<rect x="20" y="66" width="80" height="60" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="60" y="94" font-size="22" text-anchor="middle" fill="#111">0</text>
<text x="60" y="116" font-size="14" text-anchor="middle" fill="#333">(0, 0)</text>
<rect x="100" y="66" width="80" height="60" fill="#d0d0d0" stroke="#333" stroke-width="1.5"/>
<text x="140" y="94" font-size="22" text-anchor="middle" fill="#111">1</text>
<text x="140" y="116" font-size="14" text-anchor="middle" fill="#333">(0, 1)</text>
<rect x="180" y="66" width="80" height="60" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="220" y="94" font-size="22" text-anchor="middle" fill="#111">2</text>
<text x="220" y="116" font-size="14" text-anchor="middle" fill="#333">(0, 2)</text>
<rect x="260" y="66" width="80" height="60" fill="#d0d0d0" stroke="#333" stroke-width="1.5"/>
<text x="300" y="94" font-size="22" text-anchor="middle" fill="#111">3</text>
<text x="300" y="116" font-size="14" text-anchor="middle" fill="#333">(0, 3)</text>
<rect x="20" y="126" width="80" height="60" fill="#d0d0d0" stroke="#333" stroke-width="1.5"/>
<text x="60" y="154" font-size="22" text-anchor="middle" fill="#111">4</text>
<text x="60" y="176" font-size="14" text-anchor="middle" fill="#333">(1, 0)</text>
<rect x="100" y="126" width="80" height="60" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="140" y="154" font-size="22" text-anchor="middle" fill="#111">5</text>
<text x="140" y="176" font-size="14" text-anchor="middle" fill="#333">(1, 1)</text>
<rect x="180" y="126" width="80" height="60" fill="#d0d0d0" stroke="#333" stroke-width="1.5"/>
<text x="220" y="154" font-size="22" text-anchor="middle" fill="#111">6</text>
<text x="220" y="176" font-size="14" text-anchor="middle" fill="#333">(1, 2)</text>
<rect x="260" y="126" width="80" height="60" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="300" y="154" font-size="22" text-anchor="middle" fill="#111">7</text>
<text x="300" y="176" font-size="14" text-anchor="middle" fill="#333">(1, 3)</text>
<rect x="20" y="186" width="80" height="60" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="60" y="214" font-size="22" text-anchor="middle" fill="#111">8</text>
<text x="60" y="236" font-size="14" text-anchor="middle" fill="#333">(2, 0)</text>
<rect x="100" y="186" width="80" height="60" fill="#d0d0d0" stroke="#333" stroke-width="1.5"/>
<text x="140" y="214" font-size="22" text-anchor="middle" fill="#111">9</text>
<text x="140" y="236" font-size="14" text-anchor="middle" fill="#333">(2, 1)</text>
<rect x="180" y="186" width="80" height="60" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="220" y="214" font-size="22" text-anchor="middle" fill="#111">10</text>
<text x="220" y="236" font-size="14" text-anchor="middle" fill="#333">(2, 2)</text>
<rect x="260" y="186" width="80" height="60" fill="#d0d0d0" stroke="#333" stroke-width="1.5"/>
<text x="300" y="214" font-size="22" text-anchor="middle" fill="#111">11</text>
<text x="300" y="236" font-size="14" text-anchor="middle" fill="#333">(2, 3)</text>
<text x="20" y="276" font-size="14" fill="#333">番号 v から戻す：i = v / W、j = v % W</text>
<text x="20" y="298" font-size="14" fill="#333">4 近傍の辺は必ず白と灰色を結ぶ</text>
<line x1="20" y1="318" x2="420" y2="318" stroke="#bbb" stroke-width="1"/>
<text x="20" y="346" font-size="16" fill="#222">(di, dj) と番号の差</text>
<text x="20" y="370" font-size="14" fill="#333">番号の差で隣を書くのは番兵で囲んだときだけ</text>
<text x="20" y="390" font-size="14" fill="#333">（そのとき W を W + 2 に読み替える）</text>
<rect x="20" y="406" width="76" height="76" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="58.0" y="436" font-size="14" text-anchor="middle" fill="#333">(−1, −1)</text>
<text x="58.0" y="462" font-size="16" text-anchor="middle" fill="#111">−W−1</text>
<rect x="96" y="406" width="76" height="76" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="134.0" y="436" font-size="14" text-anchor="middle" fill="#333">(−1, 0)</text>
<text x="134.0" y="462" font-size="16" text-anchor="middle" fill="#111">−W</text>
<rect x="172" y="406" width="76" height="76" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="210.0" y="436" font-size="14" text-anchor="middle" fill="#333">(−1, +1)</text>
<text x="210.0" y="462" font-size="16" text-anchor="middle" fill="#111">−W+1</text>
<rect x="20" y="482" width="76" height="76" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="58.0" y="512" font-size="14" text-anchor="middle" fill="#333">(0, −1)</text>
<text x="58.0" y="538" font-size="16" text-anchor="middle" fill="#111">−1</text>
<rect x="96" y="482" width="76" height="76" fill="#f2f2f2" stroke="#333" stroke-width="2.5"/>
<text x="134.0" y="525.0" font-size="16" text-anchor="middle" fill="#111">(i, j)</text>
<rect x="172" y="482" width="76" height="76" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="210.0" y="512" font-size="14" text-anchor="middle" fill="#333">(0, +1)</text>
<text x="210.0" y="538" font-size="16" text-anchor="middle" fill="#111">+1</text>
<rect x="20" y="558" width="76" height="76" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="58.0" y="588" font-size="14" text-anchor="middle" fill="#333">(+1, −1)</text>
<text x="58.0" y="614" font-size="16" text-anchor="middle" fill="#111">+W−1</text>
<rect x="96" y="558" width="76" height="76" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="134.0" y="588" font-size="14" text-anchor="middle" fill="#333">(+1, 0)</text>
<text x="134.0" y="614" font-size="16" text-anchor="middle" fill="#111">+W</text>
<rect x="172" y="558" width="76" height="76" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="210.0" y="588" font-size="14" text-anchor="middle" fill="#333">(+1, +1)</text>
<text x="210.0" y="614" font-size="16" text-anchor="middle" fill="#111">+W+1</text>
<text x="264" y="446" font-size="14" fill="#333">実線の枠：</text>
<text x="264" y="466" font-size="14" fill="#333">4 近傍</text>
<text x="264" y="516" font-size="14" fill="#333">点線の枠：斜め</text>
<text x="264" y="536" font-size="14" fill="#333">（8 近傍で足す）</text>
</svg>
