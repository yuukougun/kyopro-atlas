<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif" font-size="14">
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dbe7fb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1f4e9a" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222">列 A の区間 [1, 4) に +1 する（N = 5、0-indexed）</text>
<text x="20" y="150" fill="#222">列 A</text>
<text x="20" y="170" fill="#555" font-size="14">斜線が足した 1</text>
<rect x="158" y="138" width="44" height="52" fill="#e8e8e8" stroke="#333"/>
<text x="180.0" y="132" text-anchor="middle" fill="#222">2</text>
<text x="180.0" y="208" text-anchor="middle" fill="#555" font-size="14">i = 0</text>
<rect x="218" y="164" width="44" height="26" fill="#e8e8e8" stroke="#333"/>
<rect x="218" y="138" width="44" height="26" fill="url(#hatch)" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="240.0" y="132" text-anchor="middle" fill="#222">1→2</text>
<text x="240.0" y="208" text-anchor="middle" fill="#555" font-size="14">i = 1</text>
<rect x="278" y="112" width="44" height="78" fill="#e8e8e8" stroke="#333"/>
<rect x="278" y="86" width="44" height="26" fill="url(#hatch)" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="300.0" y="80" text-anchor="middle" fill="#222">3→4</text>
<text x="300.0" y="208" text-anchor="middle" fill="#555" font-size="14">i = 2</text>
<rect x="338" y="112" width="44" height="78" fill="#e8e8e8" stroke="#333"/>
<rect x="338" y="86" width="44" height="26" fill="url(#hatch)" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="360.0" y="80" text-anchor="middle" fill="#222">3→4</text>
<text x="360.0" y="208" text-anchor="middle" fill="#555" font-size="14">i = 3</text>
<rect x="398" y="164" width="44" height="26" fill="#e8e8e8" stroke="#333"/>
<text x="420.0" y="158" text-anchor="middle" fill="#222">1</text>
<text x="420.0" y="208" text-anchor="middle" fill="#555" font-size="14">i = 4</text>
<line x1="150" y1="190" x2="450" y2="190" stroke="#333"/>
<line x1="214" y1="220" x2="386" y2="220" stroke="#1f4e9a" stroke-width="3"/>
<text x="300.0" y="238" text-anchor="middle" fill="#1f4e9a" font-size="13">区間 [1, 4)</text>
<text x="20" y="302" fill="#222">差分列 d</text>
<rect x="124.0" y="276" width="52" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="150.0" y="302" text-anchor="middle" fill="#222">2</text>
<text x="150.0" y="334" text-anchor="middle" fill="#555" font-size="14">d_0</text>
<rect x="184.0" y="276" width="52" height="40" fill="#fde2c8" stroke="#b5520b" stroke-width="3"/>
<text x="210.0" y="302" text-anchor="middle" fill="#222">−1→0</text>
<text x="210.0" y="334" text-anchor="middle" fill="#555" font-size="14">d_1</text>
<text x="210.0" y="268" text-anchor="middle" fill="#b5520b" font-weight="bold">+1</text>
<rect x="244.0" y="276" width="52" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="270.0" y="302" text-anchor="middle" fill="#222">2</text>
<text x="270.0" y="334" text-anchor="middle" fill="#555" font-size="14">d_2</text>
<rect x="304.0" y="276" width="52" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="330.0" y="302" text-anchor="middle" fill="#222">0</text>
<text x="330.0" y="334" text-anchor="middle" fill="#555" font-size="14">d_3</text>
<rect x="364.0" y="276" width="52" height="40" fill="#fde2c8" stroke="#b5520b" stroke-width="3"/>
<text x="390.0" y="302" text-anchor="middle" fill="#222">−2→−3</text>
<text x="390.0" y="334" text-anchor="middle" fill="#555" font-size="14">d_4</text>
<text x="390.0" y="268" text-anchor="middle" fill="#b5520b" font-weight="bold">−1</text>
<rect x="424.0" y="276" width="52" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
<text x="450.0" y="302" text-anchor="middle" fill="#222">−1</text>
<text x="450.0" y="334" text-anchor="middle" fill="#555" font-size="14">d_5</text>
<text x="20" y="368" fill="#555">d_i = A_i − A_(i−1)（A_(−1) = A_5 = 0）。変わるのは d_1 と d_4 だけ</text>
</svg>
