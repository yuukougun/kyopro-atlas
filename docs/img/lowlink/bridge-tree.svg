<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="sans-serif">
<rect x="0" y="0" width="400" height="400" fill="#ffffff"/>
<text x="20" y="22" font-size="14" fill="#111111">元のグラフ（点線の枠が二重辺連結成分）</text>
<rect x="22" y="32" width="120" height="176" rx="12" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="28" y="226" font-size="14" fill="#444444">成分 A</text>
<rect x="170" y="32" width="120" height="176" rx="12" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="176" y="226" font-size="14" fill="#444444">成分 B</text>
<rect x="322" y="152" width="56" height="56" rx="12" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="328" y="226" font-size="14" fill="#444444">成分 C</text>
<line x1="50" y1="60" x2="110" y2="120" stroke="#333333" stroke-width="2"/>
<line x1="110" y1="120" x2="50" y2="180" stroke="#333333" stroke-width="2"/>
<line x1="50" y1="180" x2="50" y2="60" stroke="#333333" stroke-width="2"/>
<line x1="110" y1="120" x2="200" y2="120" stroke="#c0392b" stroke-width="6"/>
<line x1="200" y1="120" x2="260" y2="60" stroke="#333333" stroke-width="2"/>
<line x1="260" y1="60" x2="260" y2="180" stroke="#333333" stroke-width="2"/>
<line x1="260" y1="180" x2="200" y2="120" stroke="#333333" stroke-width="2"/>
<line x1="260" y1="180" x2="350" y2="180" stroke="#c0392b" stroke-width="6"/>
<circle cx="50" cy="60" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="50" y="65" font-size="15" text-anchor="middle" fill="#111111">0</text>
<circle cx="110" cy="120" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="110" y="125" font-size="15" text-anchor="middle" fill="#111111">1</text>
<circle cx="50" cy="180" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="50" y="185" font-size="15" text-anchor="middle" fill="#111111">2</text>
<circle cx="200" cy="120" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="200" y="125" font-size="15" text-anchor="middle" fill="#111111">3</text>
<circle cx="260" cy="60" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="260" y="65" font-size="15" text-anchor="middle" fill="#111111">4</text>
<circle cx="260" cy="180" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="260" y="185" font-size="15" text-anchor="middle" fill="#111111">5</text>
<circle cx="350" cy="180" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="350" y="185" font-size="15" text-anchor="middle" fill="#111111">6</text>
<text x="200" y="268" font-size="14" text-anchor="middle" fill="#111111">↓ 成分を 1 点に縮約する（残る辺は橋だけ）</text>
<line x1="80" y1="340" x2="200" y2="340" stroke="#c0392b" stroke-width="6"/><line x1="200" y1="340" x2="320" y2="340" stroke="#c0392b" stroke-width="6"/>
<text x="140" y="328" font-size="12" text-anchor="middle" fill="#c0392b">橋 1-3</text><text x="260" y="328" font-size="12" text-anchor="middle" fill="#c0392b">橋 5-6</text>
<circle cx="80" cy="340" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="80" y="345" font-size="15" text-anchor="middle" fill="#111111">A</text>
<text x="80" y="382" font-size="12" text-anchor="middle" fill="#444444">{0,1,2}</text>
<circle cx="200" cy="340" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="200" y="345" font-size="15" text-anchor="middle" fill="#111111">B</text>
<text x="200" y="382" font-size="12" text-anchor="middle" fill="#444444">{3,4,5}</text>
<circle cx="320" cy="340" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="320" y="345" font-size="15" text-anchor="middle" fill="#111111">C</text>
<text x="320" y="382" font-size="12" text-anchor="middle" fill="#444444">{6}</text>
</svg>
