<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 402" width="320" height="402" font-family="sans-serif">
<rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text x="160.0" y="22" text-anchor="middle" font-size="15" fill="#222">T を位置 p = 2 に重ねるとき、比べる</text>
<text x="160.0" y="42" text-anchor="middle" font-size="15" fill="#222">2 文字の添字の和は 4 に決まる</text>
<text x="19.0" y="76" font-size="15" fill="#222">S</text>
<rect x="19.0" y="86" width="42" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="40.0" y="110" text-anchor="middle" font-size="18" fill="#222">0</text>
<text x="40.0" y="139" text-anchor="middle" font-size="13" fill="#555">i=0</text>
<rect x="67.0" y="86" width="42" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="88.0" y="110" text-anchor="middle" font-size="18" fill="#222">1</text>
<text x="88.0" y="139" text-anchor="middle" font-size="13" fill="#555">i=1</text>
<rect x="115.0" y="86" width="42" height="36" fill="#fdebd0" stroke="#c0392b" stroke-width="3"/>
<text x="136.0" y="110" text-anchor="middle" font-size="18" fill="#222">1</text>
<text x="136.0" y="139" text-anchor="middle" font-size="13" fill="#555">i=2</text>
<rect x="163.0" y="86" width="42" height="36" fill="#fdebd0" stroke="#c0392b" stroke-width="3"/>
<text x="184.0" y="110" text-anchor="middle" font-size="18" fill="#222">0</text>
<text x="184.0" y="139" text-anchor="middle" font-size="13" fill="#555">i=3</text>
<rect x="211.0" y="86" width="42" height="36" fill="#fdebd0" stroke="#c0392b" stroke-width="3"/>
<text x="232.0" y="110" text-anchor="middle" font-size="18" fill="#222">1</text>
<text x="232.0" y="139" text-anchor="middle" font-size="13" fill="#555">i=4</text>
<rect x="259.0" y="86" width="42" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
<text x="280.0" y="110" text-anchor="middle" font-size="18" fill="#222">0</text>
<text x="280.0" y="139" text-anchor="middle" font-size="13" fill="#555">i=5</text>
<text x="19.0" y="188.0" font-size="15" fill="#222">T を位置</text>
<text x="19.0" y="206.0" font-size="15" fill="#222">2 に置く</text>
<rect x="115.0" y="164" width="42" height="36" fill="#fdebd0" stroke="#c0392b" stroke-width="3"/>
<text x="136.0" y="188" text-anchor="middle" font-size="18" fill="#222">1</text>
<text x="136.0" y="217" text-anchor="middle" font-size="13" fill="#555">j=0</text>
<rect x="163.0" y="164" width="42" height="36" fill="#fdebd0" stroke="#c0392b" stroke-width="3"/>
<text x="184.0" y="188" text-anchor="middle" font-size="18" fill="#222">0</text>
<text x="184.0" y="217" text-anchor="middle" font-size="13" fill="#555">j=1</text>
<rect x="211.0" y="164" width="42" height="36" fill="#fdebd0" stroke="#c0392b" stroke-width="3"/>
<text x="232.0" y="188" text-anchor="middle" font-size="18" fill="#222">0</text>
<text x="232.0" y="217" text-anchor="middle" font-size="13" fill="#555">j=2</text>
<line x1="136.0" y1="144" x2="136.0" y2="161" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="184.0" y1="144" x2="184.0" y2="161" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="232.0" y1="144" x2="232.0" y2="161" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
<text x="19.0" y="272" font-size="15" fill="#222">反転した T</text>
<rect x="19.0" y="282" width="42" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="40.0" y="306" text-anchor="middle" font-size="18" fill="#222">0</text>
<text x="40.0" y="335" text-anchor="middle" font-size="13" fill="#555">0 (j=2)</text>
<rect x="67.0" y="282" width="42" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="88.0" y="306" text-anchor="middle" font-size="18" fill="#222">0</text>
<text x="88.0" y="335" text-anchor="middle" font-size="13" fill="#555">1 (j=1)</text>
<rect x="115.0" y="282" width="42" height="36" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="136.0" y="306" text-anchor="middle" font-size="18" fill="#222">1</text>
<text x="136.0" y="335" text-anchor="middle" font-size="13" fill="#555">2 (j=0)</text>
<text x="167.0" y="298" font-size="13" fill="#555">S の i = 2 + j と</text>
<text x="167.0" y="316" font-size="13" fill="#555">反転した T の 2 − j</text>
<text x="167.0" y="334" font-size="13" fill="#555">の和はいつも 4</text>
<text x="10" y="370" font-size="14" fill="#222">一般に、位置 p での比べ合いは畳み込みの</text>
<text x="10" y="390" font-size="14" fill="#222">第 p + |T| − 1 項に集まる</text>
</svg>
