<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="30" fill="#222">B を 8, 3, 2 の順のまま組む：線が交差する（7 + 1 + 4）</text>
<line x1="60" y1="60" x2="600" y2="60" stroke="#bbb"/>
<text x="30" y="65" fill="#222" font-weight="bold">A</text>
<line x1="60" y1="140" x2="600" y2="140" stroke="#bbb"/>
<text x="30" y="145" fill="#222" font-weight="bold">B</text>
<line x1="360" y1="42" x2="360" y2="158" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="366" y="172" fill="#c0392b" font-size="12">x = 5 をまたぐ組：2 組</text>
<line x1="120" y1="60" x2="540" y2="140" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="7 4"/>
<line x1="300" y1="60" x2="240" y2="140" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="7 4"/>
<line x1="420" y1="60" x2="180" y2="140" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="7 4"/>
<circle cx="120" cy="60" r="13" fill="#cfe3ff" stroke="#1f4e9a"/><text x="120" y="65" text-anchor="middle" fill="#222">1</text>
<rect x="527" y="127" width="26" height="26" fill="#ffe4c4" stroke="#a0522d"/><text x="540" y="145" text-anchor="middle" fill="#222">8</text>
<circle cx="300" cy="60" r="13" fill="#cfe3ff" stroke="#1f4e9a"/><text x="300" y="65" text-anchor="middle" fill="#222">4</text>
<rect x="227" y="127" width="26" height="26" fill="#ffe4c4" stroke="#a0522d"/><text x="240" y="145" text-anchor="middle" fill="#222">3</text>
<circle cx="420" cy="60" r="13" fill="#cfe3ff" stroke="#1f4e9a"/><text x="420" y="65" text-anchor="middle" fill="#222">6</text>
<rect x="167" y="127" width="26" height="26" fill="#ffe4c4" stroke="#a0522d"/><text x="180" y="145" text-anchor="middle" fill="#222">2</text>
<text x="620" y="105" fill="#222">和 12</text>
<text x="20" y="230" fill="#222">両方ソートして順に組む：交差が消える（1 + 1 + 2）</text>
<line x1="60" y1="260" x2="600" y2="260" stroke="#bbb"/>
<text x="30" y="265" fill="#222" font-weight="bold">A</text>
<line x1="60" y1="340" x2="600" y2="340" stroke="#bbb"/>
<text x="30" y="345" fill="#222" font-weight="bold">B</text>
<line x1="360" y1="242" x2="360" y2="358" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="366" y="372" fill="#c0392b" font-size="12">x = 5 をまたぐ組：0 組</text>
<line x1="120" y1="260" x2="180" y2="340" stroke="#1f4e9a" stroke-width="2"/>
<line x1="300" y1="260" x2="240" y2="340" stroke="#1f4e9a" stroke-width="2"/>
<line x1="420" y1="260" x2="540" y2="340" stroke="#1f4e9a" stroke-width="2"/>
<circle cx="120" cy="260" r="13" fill="#cfe3ff" stroke="#1f4e9a"/><text x="120" y="265" text-anchor="middle" fill="#222">1</text>
<rect x="167" y="327" width="26" height="26" fill="#ffe4c4" stroke="#a0522d"/><text x="180" y="345" text-anchor="middle" fill="#222">2</text>
<circle cx="300" cy="260" r="13" fill="#cfe3ff" stroke="#1f4e9a"/><text x="300" y="265" text-anchor="middle" fill="#222">4</text>
<rect x="227" y="327" width="26" height="26" fill="#ffe4c4" stroke="#a0522d"/><text x="240" y="345" text-anchor="middle" fill="#222">3</text>
<circle cx="420" cy="260" r="13" fill="#cfe3ff" stroke="#1f4e9a"/><text x="420" y="265" text-anchor="middle" fill="#222">6</text>
<rect x="527" y="327" width="26" height="26" fill="#ffe4c4" stroke="#a0522d"/><text x="540" y="345" text-anchor="middle" fill="#222">8</text>
<text x="620" y="305" fill="#222">和 4</text>
</svg>
