<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="400" height="860" font-family="sans-serif" font-size="13">
  <rect x="0" y="0" width="400" height="860" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- main.cpp -->
  <text x="16" y="24" font-size="14" font-weight="bold" fill="#222222">main.cpp（手元で書く）</text>
  <rect x="16" y="34" width="270" height="132" fill="#f4f4f4" stroke="#555555"/>
  <text x="28" y="58" fill="#222222">#include &lt;bits/stdc++.h&gt;</text>
  <text x="28" y="80" fill="#222222">#include &lt;atcoder/dsu&gt;</text>
  <text x="28" y="102" fill="#0b4f9c" font-weight="bold">#include "graph.hpp"</text>
  <text x="28" y="124" fill="#222222">using namespace std;</text>
  <text x="28" y="146" fill="#222222">int main() { … }</text>

  <!-- graph.hpp -->
  <text x="16" y="198" font-size="14" font-weight="bold" fill="#222222">lib/graph.hpp（自作のヘッダ）</text>
  <rect x="16" y="208" width="270" height="70" fill="#e3eefb" stroke="#0b4f9c"/>
  <text x="28" y="230" fill="#222222">#pragma once（展開で消える）</text>
  <text x="28" y="252" fill="#222222">A：宣言・クラスの定義</text>
  <line x1="16" y1="278" x2="286" y2="278" stroke="#0b4f9c" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="28" y="298" fill="#0b4f9c" font-weight="bold">// @impl（目印）</text>
  <rect x="16" y="306" width="270" height="44" fill="#fdf0dc" stroke="#a35f00"/>
  <text x="28" y="333" fill="#222222">B：関数の定義（中身）</text>

  <!-- arrow -->
  <line x1="151" y1="362" x2="151" y2="404" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="166" y="382" fill="#333333">展開して 1 つにまとめる</text>
  <text x="166" y="400" fill="#333333">（右の注記の位置へ）</text>

  <!-- submit.cpp -->
  <text x="16" y="436" font-size="14" font-weight="bold" fill="#222222">提出する 1 ファイル</text>
  <rect x="16" y="446" width="270" height="332" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="28" y="470" fill="#222222">#include &lt;bits/stdc++.h&gt;</text>
  <text x="28" y="492" fill="#222222">#include &lt;atcoder/dsu&gt;（残す）</text>
  <rect x="22" y="504" width="258" height="58" fill="#e3eefb" stroke="#0b4f9c"/>
  <text x="32" y="526" fill="#222222">// ===== begin: graph.hpp</text>
  <text x="32" y="550" fill="#222222">A：宣言・クラスの定義</text>
  <text x="28" y="588" fill="#222222">using namespace std;</text>
  <text x="28" y="612" fill="#222222">int main() { … }</text>
  <rect x="22" y="634" width="258" height="58" fill="#fdf0dc" stroke="#a35f00" stroke-dasharray="4 3"/>
  <text x="32" y="656" fill="#222222">// ===== impl: graph.hpp</text>
  <text x="32" y="680" fill="#222222">B：関数の定義（中身）</text>
  <text x="28" y="722" fill="#555555">main が先頭近くに来て、</text>
  <text x="28" y="744" fill="#555555">提出したコードが読みやすい</text>

  <!-- notes -->
  <text x="294" y="526" fill="#0b4f9c" font-weight="bold">← A は</text>
  <text x="306" y="544" fill="#0b4f9c" font-weight="bold">include の</text>
  <text x="306" y="562" fill="#0b4f9c" font-weight="bold">位置へ</text>
  <text x="294" y="656" fill="#a35f00" font-weight="bold">← B は</text>
  <text x="306" y="674" fill="#a35f00" font-weight="bold">main の</text>
  <text x="306" y="692" fill="#a35f00" font-weight="bold">後ろへ</text>

  <text x="16" y="812" fill="#555555">#include "…"（二重引用符）だけを展開する。</text>
  <text x="16" y="834" fill="#555555">&lt;…&gt; の ACL は AtCoder にあるので残す。</text>
</svg>
