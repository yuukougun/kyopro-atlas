<line x1="304" y1="300" x2="304" y2="380" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="20" y="400" fill="#222">配列 1 本 dist[v]：k = 1, 2, 3, 4 の順に、</text>
