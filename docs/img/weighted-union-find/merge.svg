<text x="190" y="225" text-anchor="middle" fill="#c0392b">情報 4</text>
<text x="190" y="270" text-anchor="middle" fill="#555" font-size="12">根 2 の根 0 との差 ＝ 4 + 3 − 5 ＝ 2</text>
<text x="380" y="60" fill="#222">つないだ後</text>
<circle cx="500" cy="90" r="20" fill="#fde7c8" stroke="#a35c00" stroke-width="3"/>
