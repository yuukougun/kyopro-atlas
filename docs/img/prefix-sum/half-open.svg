<circle cx="280" cy="392" r="4.5" fill="#1f4e9a"/>
<text x="272" y="383" text-anchor="end" fill="#1f4e9a" font-size="14">8</text>
<text x="280" y="500" text-anchor="middle" fill="#555" font-size="13">S[3]</text>
<line x1="350" y1="480" x2="350" y2="381" stroke="#bbb" stroke-dasharray="3,3"/>
