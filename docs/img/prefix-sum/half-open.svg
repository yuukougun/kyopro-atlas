<text x="455.0" y="136" text-anchor="middle" fill="#222">2</text>
<text x="455.0" y="190" text-anchor="middle" fill="#555" font-size="13">a[5]</text>
<text x="20" y="213" fill="#222">境界の番号 k（S[k] は境界 k より左にある棒の和）</text>
