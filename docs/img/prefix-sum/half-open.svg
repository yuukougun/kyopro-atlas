<line x1="250" y1="560" x2="250" y2="472" stroke="#bbb" stroke-dasharray="3,3"/>
<circle cx="250" cy="472" r="4.5" fill="#1f4e9a"/>
<text x="242" y="463" text-anchor="end" fill="#1f4e9a" font-size="17">8</text>
<text x="250" y="584" text-anchor="middle" fill="#555" font-size="17">S[3]</text>
<line x1="320" y1="560" x2="320" y2="461" stroke="#bbb" stroke-dasharray="3,3"/>
<circle cx="320" cy="461" r="4.5" fill="#1f4e9a"/>
<text x="312" y="452" text-anchor="end" fill="#1f4e9a" font-size="17">9</text>
<text x="320" y="584" text-anchor="middle" fill="#555" font-size="17">S[4]</text>
<line x1="390" y1="560" x2="390" y2="406" stroke="#bbb" stroke-dasharray="3,3"/>
<circle cx="390" cy="406" r="4.5" fill="#1f4e9a"/>
<text x="382" y="397" text-anchor="end" fill="#1f4e9a" font-size="17">14</text>
<text x="390" y="584" text-anchor="middle" fill="#555" font-size="17">S[5]</text>
<line x1="460" y1="560" x2="460" y2="384" stroke="#bbb" stroke-dasharray="3,3"/>
<circle cx="460" cy="384" r="4.5" fill="#1f4e9a"/>
<text x="452" y="375" text-anchor="end" fill="#1f4e9a" font-size="17">16</text>
<text x="460" y="584" text-anchor="middle" fill="#555" font-size="17">S[6]</text>
<line x1="180" y1="516" x2="508" y2="516" stroke="#b03a2e" stroke-dasharray="6,4" stroke-width="1.5"/>
<line x1="390" y1="406" x2="508" y2="406" stroke="#b03a2e" stroke-dasharray="6,4" stroke-width="1.5"/>
<line x1="500" y1="513" x2="500" y2="413" stroke="#b03a2e" stroke-width="2" marker-end="url(#ar)"/>
<text x="508" y="467" fill="#b03a2e" font-weight="bold">差</text>
<text x="508" y="489" fill="#b03a2e" font-weight="bold">10</text>
</svg>
