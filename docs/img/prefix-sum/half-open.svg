<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 510" font-family="sans-serif" font-size="15">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f4e9a" stroke-width="2"/></pattern><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b03a2e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222">上：a[i]（棒）。網掛けは半開区間 [2, 5) の 3 本で、和は 4 + 1 + 5 = 10</text>
<line x1="60" y1="170" x2="500" y2="170" stroke="#333"/>
