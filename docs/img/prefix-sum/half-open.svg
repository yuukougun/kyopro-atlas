<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 600" font-family="sans-serif" font-size="18">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#1f4e9a" stroke-width="2"/></pattern><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b03a2e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="28" fill="#222">上：a[i]（棒）。網掛けは半開区間 [2, 5) の 3 本</text>
<text x="16" y="52" fill="#222">網掛けの和は 4 + 1 + 5 = 10</text>
<line x1="30" y1="200" x2="470" y2="200" stroke="#333"/>
<rect x="50" y="158" width="50" height="42" fill="#e8e8e8" stroke="#333" stroke-width="1.2"/>
<text x="75" y="151" text-anchor="middle" fill="#222">3</text>
<text x="75" y="222" text-anchor="middle" fill="#555" font-size="17">a[0]</text>
<rect x="120" y="186" width="50" height="14" fill="#e8e8e8" stroke="#333" stroke-width="1.2"/>
<text x="145" y="179" text-anchor="middle" fill="#222">1</text>
<text x="145" y="222" text-anchor="middle" fill="#555" font-size="17">a[1]</text>
<rect x="190" y="144" width="50" height="56" fill="url(#hatch)" stroke="#333" stroke-width="1.2"/>
<text x="215" y="137" text-anchor="middle" fill="#222">4</text>
<text x="215" y="222" text-anchor="middle" fill="#555" font-size="17">a[2]</text>
