<text x="285" y="179" text-anchor="middle" fill="#222">1</text>
<text x="285" y="222" text-anchor="middle" fill="#555" font-size="17">a[3]</text>
<rect x="330" y="130" width="50" height="70" fill="url(#hatch)" stroke="#333" stroke-width="1.2"/>
<text x="355" y="123" text-anchor="middle" fill="#222">5</text>
<text x="355" y="222" text-anchor="middle" fill="#555" font-size="17">a[4]</text>
<rect x="400" y="172" width="50" height="28" fill="#e8e8e8" stroke="#333" stroke-width="1.2"/>
<text x="425" y="165" text-anchor="middle" fill="#222">2</text>
<text x="425" y="222" text-anchor="middle" fill="#555" font-size="17">a[5]</text>
<text x="16" y="252" fill="#222">境界の番号 k（S[k] は境界 k より左にある棒の和）</text>
<line x1="40" y1="266" x2="460" y2="266" stroke="#333"/>
<line x1="40" y1="266" x2="40" y2="274" stroke="#333"/>
<text x="40" y="294" text-anchor="middle" fill="#222">0</text>
<line x1="110" y1="266" x2="110" y2="274" stroke="#333"/>
<text x="110" y="294" text-anchor="middle" fill="#222">1</text>
<line x1="180" y1="266" x2="180" y2="274" stroke="#333"/>
<text x="180" y="294" text-anchor="middle" fill="#222">2</text>
<line x1="250" y1="266" x2="250" y2="274" stroke="#333"/>
<text x="250" y="294" text-anchor="middle" fill="#222">3</text>
<line x1="320" y1="266" x2="320" y2="274" stroke="#333"/>
<text x="320" y="294" text-anchor="middle" fill="#222">4</text>
<line x1="390" y1="266" x2="390" y2="274" stroke="#333"/>
<text x="390" y="294" text-anchor="middle" fill="#222">5</text>
<line x1="460" y1="266" x2="460" y2="274" stroke="#333"/>
<text x="460" y="294" text-anchor="middle" fill="#222">6</text>
<text x="16" y="330" fill="#222">下：S[k]（折れ線）</text>
<text x="16" y="354" fill="#222">S[5] − S[2] = 14 − 4 = 10 が網掛けの和</text>
<line x1="30" y1="560" x2="470" y2="560" stroke="#333"/>
<polyline points="40,560 110,527 180,516 250,472 320,461 390,406 460,384" fill="none" stroke="#1f4e9a" stroke-width="2"/>
