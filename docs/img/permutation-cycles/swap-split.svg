<circle cx="280" cy="140" r="18" fill="#eeeeee" stroke="#555" stroke-width="1.5"/>
<text x="280" y="146" text-anchor="middle" fill="#222">5</text>
<text x="170" y="255" text-anchor="middle" fill="#222">巡回 2 個：最小 5 − 2 = 3 回</text>
</g>
<line x1="180" y1="268" x2="180" y2="304" stroke="#888" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="192" y="290" fill="#555" font-size="16">位置 1, 3 を swap</text>
<g transform="translate(-330,310)">
<text x="510" y="32" text-anchor="middle" fill="#222">swap 後：P = (4, 3, 2, 1, 5)</text>
<path d="M432,97 Q410,140 432,183" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#ahr)"/>
<path d="M448,183 Q470,140 448,97" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M568,97 Q590,140 568,183" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M552,183 Q530,140 552,97" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#ahr)"/>
<path d="M611,125 C590,85 650,85 629,125" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="440" cy="80" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="3"/>
<text x="440" y="86" text-anchor="middle" fill="#222">1</text>
<circle cx="560" cy="80" r="18" fill="#ffe2c4" stroke="#b35900" stroke-width="1.5"/>
