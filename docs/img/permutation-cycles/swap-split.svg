<text x="560" y="206" text-anchor="middle" fill="#222">3</text>
<circle cx="440" cy="200" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="440" y="206" text-anchor="middle" fill="#222">4</text>
<circle cx="620" cy="140" r="18" fill="#eeeeee" stroke="#555" stroke-width="1.5"/>
<text x="620" y="146" text-anchor="middle" fill="#222">5</text>
<text x="510" y="255" text-anchor="middle" fill="#222">巡回 3 個：残り 5 − 3 = 2 回</text>
