<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" font-family="sans-serif" font-size="18">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
  </marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
  </marker>
</defs>
<g transform="translate(10,0)">
<text x="170" y="32" text-anchor="middle" fill="#222">swap 前：P = (2, 3, 4, 1, 5)</text>
<line x1="118" y1="80" x2="200" y2="80" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="220" y1="98" x2="220" y2="180" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="202" y1="200" x2="120" y2="200" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="100" y1="182" x2="100" y2="100" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M271,125 C250,85 310,85 289,125" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="100" cy="80" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="3"/>
<text x="100" y="86" text-anchor="middle" fill="#222">1</text>
<circle cx="220" cy="80" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
