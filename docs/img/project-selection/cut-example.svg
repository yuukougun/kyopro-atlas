<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="420" height="540" font-family="sans-serif" font-size="16">
<rect width="420" height="540" fill="#ffffff"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<marker id="arc" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<!-- 領域 -->
<rect x="12" y="12" width="396" height="248" rx="10" fill="#eef3fb" stroke="#1f4e9a" stroke-width="1.5"/>
<rect x="12" y="282" width="396" height="246" rx="10" fill="#f6f6f6" stroke="#888" stroke-width="1.5"/>
<text x="26" y="38" fill="#1f4e9a">s 側：a・b を選ぶ</text>
<text x="26" y="516" fill="#555">t 側：c を選ばない</text>
<line x1="6" y1="271" x2="414" y2="271" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6"/>
<!-- 切れない辺 -->
<line x1="73.3" y1="131.8" x2="180.8" y2="83.6" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
<line x1="214.7" y1="88.5" x2="304.5" y2="170.8" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
<line x1="149.8" y1="442.8" x2="319.2" y2="467.0" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
<!-- 切れる辺 -->
<line x1="321.4" y1="205.0" x2="338.5" y2="449.1" stroke="#c0392b" stroke-width="4" marker-end="url(#arc)"/>
<line x1="308.1" y1="201.0" x2="142.5" y2="423.2" stroke="#c0392b" stroke-width="4" marker-end="url(#arc)"/>
<!-- 頂点 -->
<circle cx="55" cy="140" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="55" y="146" text-anchor="middle" fill="#222" font-weight="bold">s</text>
<circle cx="200" cy="75" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="200" y="81" text-anchor="middle" fill="#222">a</text>
<circle cx="320" cy="185" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="320" y="191" text-anchor="middle" fill="#222">b</text>
<circle cx="130" cy="440" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="130" y="446" text-anchor="middle" fill="#222">c</text>
<circle cx="340" cy="470" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="340" y="476" text-anchor="middle" fill="#222" font-weight="bold">t</text>
<!-- 辺の容量と意味 -->
<g fill="#222" font-size="14">
<text x="30" y="192">5：a を選ばないと</text>
<text x="30" y="210">利得 5 を失う</text>
<text x="265" y="112">∞：a なら b も</text>
<text x="348" y="322" fill="#c0392b">3：b を</text>
<text x="348" y="340" fill="#c0392b">選ぶ費用</text>
<text x="160" y="358" text-anchor="end" fill="#c0392b">1：b を選び c を</text>
<text x="160" y="376" text-anchor="end" fill="#c0392b">選ばない罰</text>
<text x="190" y="496">4：c を選ぶ費用</text>
</g>
</svg>
