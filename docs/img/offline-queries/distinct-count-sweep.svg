<text x="289.0" y="293" text-anchor="middle" font-weight="bold">1</text>
<rect x="144" y="272" width="164" height="32" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 4"/>
<text x="318" y="293" fill="#c0392b">和 = 3</text>
<text x="20" y="334" fill="#333" font-size="14">r = 3：値 1 の 1 が位置 0 から 2 へ移る</text>
<text x="20" y="354" fill="#c0392b" font-size="14">r = 4：クエリ [1, 4) の和 = 3</text>
<text x="20" y="374" fill="#333" font-size="14">r = 5：値 2 の 1 が位置 1 から 4 へ移る</text>
<text x="20" y="394" fill="#c0392b" font-size="14">r = 5：クエリ [1, 5) の和 = 3</text>
<text x="20" y="414" fill="#555" font-size="14">灰色はまだ読んでいない位置</text>
</svg>
