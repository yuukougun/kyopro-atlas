<rect x="100" y="234" width="42" height="36" fill="#ffffff" stroke="#999"/>
<text x="121.0" y="257" text-anchor="middle" fill="#888">0</text>
<rect x="142" y="234" width="42" height="36" fill="#ffffff" stroke="#999"/>
