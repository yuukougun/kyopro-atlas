<rect x="184" y="162" width="42" height="36" fill="#f2f2f2" stroke="#999"/>
<rect x="226" y="162" width="42" height="36" fill="#f2f2f2" stroke="#999"/>
<rect x="268" y="162" width="42" height="36" fill="#f2f2f2" stroke="#999"/>
<text x="90" y="221" text-anchor="end">r = 3 の後</text>
<rect x="100" y="198" width="42" height="36" fill="#ffffff" stroke="#999"/>
