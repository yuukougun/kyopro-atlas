<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" width="400" height="430" font-family="sans-serif" font-size="15">
<rect x="0" y="0" width="400" height="430" fill="#ffffff"/>
<text x="200" y="22" text-anchor="middle" font-size="15" font-weight="bold">右端を伸ばしながら、各値の</text>
<text x="200" y="42" text-anchor="middle" font-size="15" font-weight="bold">最後の出現位置だけに 1 を立てる</text>
