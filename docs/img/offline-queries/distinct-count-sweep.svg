<text x="90" y="293" text-anchor="end">r = 5 の後</text>
<rect x="100" y="270" width="42" height="36" fill="#ffffff" stroke="#999"/>
<text x="121.0" y="293" text-anchor="middle" fill="#888">0</text>
<rect x="142" y="270" width="42" height="36" fill="#ffffff" stroke="#999"/>
<text x="163.0" y="293" text-anchor="middle" fill="#888">0</text>
<rect x="184" y="270" width="42" height="36" fill="#ffffff" stroke="#999"/>
<text x="205.0" y="293" text-anchor="middle" font-weight="bold">1</text>
<rect x="226" y="270" width="42" height="36" fill="#ffffff" stroke="#999"/>
<text x="247.0" y="293" text-anchor="middle" font-weight="bold">1</text>
