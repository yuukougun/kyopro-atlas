<text x="289.0" y="103" text-anchor="middle" font-weight="bold">2</text>
<text x="90" y="149" text-anchor="end">r = 1 の後</text>
<rect x="100" y="126" width="42" height="36" fill="#ffffff" stroke="#999"/>
<text x="121.0" y="149" text-anchor="middle" font-weight="bold">1</text>
<rect x="142" y="126" width="42" height="36" fill="#f2f2f2" stroke="#999"/>
<rect x="184" y="126" width="42" height="36" fill="#f2f2f2" stroke="#999"/>
<rect x="226" y="126" width="42" height="36" fill="#f2f2f2" stroke="#999"/>
<rect x="268" y="126" width="42" height="36" fill="#f2f2f2" stroke="#999"/>
