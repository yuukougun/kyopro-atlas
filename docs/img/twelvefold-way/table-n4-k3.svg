<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 316" width="400" height="316" font-family="sans-serif">
<rect x="0" y="0" width="400" height="316" fill="#ffffff"/>
<text x="160.0" y="28" font-size="12" text-anchor="middle" fill="#222">制限なし</text>
<text x="256.0" y="28" font-size="12" text-anchor="middle" fill="#222">各箱 1 個以下</text>
<text x="352.0" y="28" font-size="12" text-anchor="middle" fill="#222">各箱 1 個以上</text>
<text x="8" y="18" font-size="11" fill="#444">n = 4, k = 3</text>
<text x="8" y="72" font-size="11" fill="#222">玉：区別する</text>
<text x="8" y="88" font-size="11" fill="#222">箱：区別する</text>
<rect x="114" y="48" width="92" height="56" fill="#ffffff" stroke="#555"/>
<text x="160.0" y="76" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">81</text>
<text x="160.0" y="95" font-size="11" text-anchor="middle" fill="#333">k<tspan baseline-shift="super" font-size="11">n</tspan></text>
<rect x="210" y="48" width="92" height="56" fill="#eeeeee" stroke="#555" stroke-dasharray="4 3"/>
<text x="256.0" y="76" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">0</text>
<text x="256.0" y="92" font-size="11" text-anchor="middle" fill="#333"><tspan baseline-shift="sub" font-size="11">k</tspan>P<tspan baseline-shift="sub" font-size="11">n</tspan></text>
<rect x="306" y="48" width="92" height="56" fill="#ffffff" stroke="#555"/>
<text x="352.0" y="76" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">36</text>
<text x="352.0" y="95" font-size="11" text-anchor="middle" fill="#333">k! S(n,k)</text>
<text x="8" y="132" font-size="11" fill="#222">玉：区別しない</text>
<text x="8" y="148" font-size="11" fill="#222">箱：区別する</text>
<rect x="114" y="108" width="92" height="56" fill="#ffffff" stroke="#555"/>
<text x="160.0" y="136" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">15</text>
<text x="160.0" y="155" font-size="11" text-anchor="middle" fill="#333">C(n+k−1, n)</text>
<rect x="210" y="108" width="92" height="56" fill="#eeeeee" stroke="#555" stroke-dasharray="4 3"/>
<text x="256.0" y="136" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">0</text>
<text x="256.0" y="155" font-size="11" text-anchor="middle" fill="#333">C(k, n)</text>
<rect x="306" y="108" width="92" height="56" fill="#ffffff" stroke="#555"/>
<text x="352.0" y="136" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="352.0" y="155" font-size="11" text-anchor="middle" fill="#333">C(n−1, k−1)</text>
<text x="8" y="192" font-size="11" fill="#222">玉：区別する</text>
<text x="8" y="208" font-size="11" fill="#222">箱：区別しない</text>
<rect x="114" y="168" width="92" height="56" fill="#ffffff" stroke="#555"/>
<text x="160.0" y="196" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">14</text>
<text x="160.0" y="215" font-size="11" text-anchor="middle" fill="#333">S(n,0)+…+S(n,k)</text>
<rect x="210" y="168" width="92" height="56" fill="#eeeeee" stroke="#555" stroke-dasharray="4 3"/>
<text x="256.0" y="196" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">0</text>
<text x="256.0" y="215" font-size="11" text-anchor="middle" fill="#333">n≤k なら 1</text>
<rect x="306" y="168" width="92" height="56" fill="#ffffff" stroke="#555"/>
<text x="352.0" y="196" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="352.0" y="215" font-size="11" text-anchor="middle" fill="#333">S(n, k)</text>
<text x="8" y="252" font-size="11" fill="#222">玉：区別しない</text>
<text x="8" y="268" font-size="11" fill="#222">箱：区別しない</text>
<rect x="114" y="228" width="92" height="56" fill="#ffffff" stroke="#555"/>
<text x="160.0" y="256" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="160.0" y="275" font-size="11" text-anchor="middle" fill="#333">p(n, k)</text>
<rect x="210" y="228" width="92" height="56" fill="#eeeeee" stroke="#555" stroke-dasharray="4 3"/>
<text x="256.0" y="256" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">0</text>
<text x="256.0" y="275" font-size="11" text-anchor="middle" fill="#333">n≤k なら 1</text>
<rect x="306" y="228" width="92" height="56" fill="#ffffff" stroke="#555"/>
<text x="352.0" y="256" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="352.0" y="275" font-size="11" text-anchor="middle" fill="#333">p(n−k, k)</text>
<text x="256.0" y="302" font-size="11" text-anchor="middle" fill="#444">n &gt; k なので 0（点線）</text>
</svg>