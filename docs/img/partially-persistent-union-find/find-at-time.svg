<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="260" fill="#ffffff"/>
  <text x="200" y="22" font-size="14" text-anchor="middle" fill="#222">今の森（辺の数字は子が根でなくなった時刻）</text>
  <!-- edges: 2-1 (t1), 3-1 (t3), 5-1 (t4), 4-3 (t2) -->
  <line x1="200" y1="70" x2="90" y2="150" stroke="#555" stroke-width="2"/>
  <line x1="200" y1="70" x2="200" y2="150" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="200" y1="70" x2="310" y2="150" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="200" y1="150" x2="200" y2="225" stroke="#c0392b" stroke-width="4"/>
  <text x="132" y="104" font-size="13" fill="#222">1</text>
  <text x="208" y="114" font-size="13" fill="#222">3</text>
  <text x="262" y="104" font-size="13" fill="#222">4</text>
  <text x="208" y="194" font-size="13" fill="#c0392b" font-weight="bold">2</text>
  <!-- nodes -->
  <circle cx="200" cy="70" r="18" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="200" y="75" font-size="15" text-anchor="middle" fill="#222">1</text>
  <circle cx="90" cy="150" r="18" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="90" y="155" font-size="15" text-anchor="middle" fill="#222">2</text>
  <circle cx="200" cy="150" r="18" fill="#fde2dd" stroke="#c0392b" stroke-width="3"/>
  <text x="200" y="155" font-size="15" text-anchor="middle" fill="#222">3</text>
  <circle cx="310" cy="150" r="18" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="310" y="155" font-size="15" text-anchor="middle" fill="#222">5</text>
  <circle cx="200" cy="225" r="18" fill="#fde2dd" stroke="#c0392b" stroke-width="3"/>
  <text x="200" y="230" font-size="15" text-anchor="middle" fill="#222">4</text>
  <!-- legend -->
  <line x1="12" y1="196" x2="40" y2="196" stroke="#c0392b" stroke-width="4"/>
  <text x="46" y="200" font-size="12" fill="#222">find(4, 2) で登る辺</text>
  <line x1="12" y1="216" x2="40" y2="216" stroke="#555" stroke-width="2"/>
  <text x="46" y="220" font-size="12" fill="#222">時刻 2 以下のほかの辺</text>
  <line x1="12" y1="236" x2="40" y2="236" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="240" font-size="12" fill="#222">時刻 3 以上の辺</text>
  <text x="250" y="222" font-size="12" fill="#222">時刻 2 の根は 3</text>
  <text x="250" y="240" font-size="12" fill="#222">（大きさ 2）</text>
</svg>
