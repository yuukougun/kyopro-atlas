<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" font-family="sans-serif" font-size="14">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c0392b" stroke-opacity="0.35" stroke-width="3"/></pattern><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker><marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f4e9a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="24" fill="#222">石取り：1 回に 1・3・4 個のどれかを取る。取れなくなった方が負け</text>
<text x="40" y="44" fill="#555" font-size="12">各マスは残りの石の数。勝＝手番の人の必勝、負＝手番の人の必敗（斜線）</text>
<rect x="40" y="130" width="50" height="44" fill="#fde2df" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
<rect x="40" y="130" width="50" height="44" fill="url(#hatch)"/>
<text x="65" y="158" text-anchor="middle" fill="#c0392b" font-weight="bold">負</text>
<text x="65" y="194" text-anchor="middle" fill="#222">0</text>
<rect x="100" y="130" width="50" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="125" y="158" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="125" y="194" text-anchor="middle" fill="#222">1</text>
<rect x="160" y="130" width="50" height="44" fill="#fde2df" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
<rect x="160" y="130" width="50" height="44" fill="url(#hatch)"/>
<text x="185" y="158" text-anchor="middle" fill="#c0392b" font-weight="bold">負</text>
<text x="185" y="194" text-anchor="middle" fill="#222">2</text>
<rect x="220" y="130" width="50" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="245" y="158" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="245" y="194" text-anchor="middle" fill="#222">3</text>
<rect x="280" y="130" width="50" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="305" y="158" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="305" y="194" text-anchor="middle" fill="#222">4</text>
<rect x="340" y="130" width="50" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="365" y="158" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="365" y="194" text-anchor="middle" fill="#222">5</text>
<rect x="400" y="130" width="50" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="425" y="158" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="425" y="194" text-anchor="middle" fill="#222">6</text>
<rect x="460" y="130" width="50" height="44" fill="#fde2df" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
<rect x="460" y="130" width="50" height="44" fill="url(#hatch)"/>
<text x="485" y="158" text-anchor="middle" fill="#c0392b" font-weight="bold">負</text>
<text x="485" y="194" text-anchor="middle" fill="#222">7</text>
<rect x="520" y="130" width="50" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="545" y="158" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="545" y="194" text-anchor="middle" fill="#222">8</text>
<path d="M479,130 Q455.0,94 431,128" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M479,130 Q395.0,66 311,128" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M479,130 Q365.0,52 251,128" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="40" y="78" fill="#222" font-size="13">7 → 6・4・3 はどれも勝</text>
<text x="40" y="96" fill="#222" font-size="13">なので 7 は負</text>
<path d="M545,202 Q515.0,236 487,204" fill="none" stroke="#1f4e9a" stroke-width="2.5" marker-end="url(#arb)"/>
<text x="565" y="242" text-anchor="end" fill="#1f4e9a" font-size="13">8 → 7（負）へ移れるので 8 は勝</text>
<text x="40" y="242" fill="#555" font-size="12">0 は動けないので負（終局）</text>
</svg>
