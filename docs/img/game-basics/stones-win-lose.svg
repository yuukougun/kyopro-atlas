<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 276" font-family="sans-serif" font-size="15">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c0392b" stroke-opacity="0.35" stroke-width="3"/></pattern><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker><marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f4e9a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222" font-weight="bold">石取り：1 回に 1・3・4 個取る。取れなくなった方が負け</text>
<rect x="20" y="112" width="46" height="44" fill="#fde2df" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
<rect x="20" y="112" width="46" height="44" fill="url(#hatch)"/>
<text x="43" y="141" text-anchor="middle" fill="#c0392b" font-weight="bold">負</text>
<text x="43" y="176" text-anchor="middle" fill="#222">0</text>
<rect x="72" y="112" width="46" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="95" y="141" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="95" y="176" text-anchor="middle" fill="#222">1</text>
<rect x="124" y="112" width="46" height="44" fill="#fde2df" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
<rect x="124" y="112" width="46" height="44" fill="url(#hatch)"/>
<text x="147" y="141" text-anchor="middle" fill="#c0392b" font-weight="bold">負</text>
<text x="147" y="176" text-anchor="middle" fill="#222">2</text>
<rect x="176" y="112" width="46" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="199" y="141" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="199" y="176" text-anchor="middle" fill="#222">3</text>
<rect x="228" y="112" width="46" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="251" y="141" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="251" y="176" text-anchor="middle" fill="#222">4</text>
<rect x="280" y="112" width="46" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="303" y="141" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="303" y="176" text-anchor="middle" fill="#222">5</text>
<rect x="332" y="112" width="46" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="355" y="141" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="355" y="176" text-anchor="middle" fill="#222">6</text>
<rect x="384" y="112" width="46" height="44" fill="#fde2df" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
<rect x="384" y="112" width="46" height="44" fill="url(#hatch)"/>
<text x="407" y="141" text-anchor="middle" fill="#c0392b" font-weight="bold">負</text>
<text x="407" y="176" text-anchor="middle" fill="#222">7</text>
<rect x="436" y="112" width="46" height="44" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="459" y="141" text-anchor="middle" fill="#1f4e9a" font-weight="bold">勝</text>
<text x="459" y="176" text-anchor="middle" fill="#222">8</text>
<path d="M403,112 Q382,80 361,110" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M403,112 Q330,52 257,110" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M403,112 Q304,40 205,110" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="20" y="56" fill="#222">7 → 6・4・3 はどれも勝</text>
<text x="20" y="76" fill="#222">なので 7 は負</text>
<path d="M459,184 Q433,218 409,186" fill="none" stroke="#1f4e9a" stroke-width="2.5" marker-end="url(#arb)"/>
<text x="480" y="238" text-anchor="end" fill="#1f4e9a">8 → 7（負）へ移れるので 8 は勝</text>
<text x="20" y="238" fill="#555">0 は終局なので負</text>
<text x="20" y="266" fill="#555">数字は残りの石の数。負のマスは斜線と破線の枠</text>
</svg>
