<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" font-family="sans-serif" font-size="14">
  <rect width="360" height="320" fill="#ffffff"/>
  <text x="180" y="24" text-anchor="middle">座標を頂点、点を辺にする</text>
  <text x="90" y="52" text-anchor="middle" font-size="13">x 座標</text>
  <text x="270" y="52" text-anchor="middle" font-size="13">y 座標</text>
  <!-- 成分 1 の囲み -->
  <rect x="40" y="66" width="280" height="118" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/>
  <rect x="40" y="194" width="280" height="54" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4"/>
  <g stroke="#333" stroke-width="2">
    <line x1="90" y1="90" x2="270" y2="90"/>
    <line x1="90" y1="90" x2="270" y2="160"/>
    <line x1="90" y1="160" x2="270" y2="160"/>
    <line x1="90" y1="221" x2="270" y2="221"/>
  </g>
  <line x1="90" y1="160" x2="270" y2="90" stroke="#333" stroke-width="2" stroke-dasharray="5,4"/>
  <g stroke="#333" stroke-width="2" fill="#ffffff">
    <circle cx="90" cy="90" r="14"/><circle cx="90" cy="160" r="14"/><circle cx="90" cy="221" r="14"/>
    <circle cx="270" cy="90" r="14"/><circle cx="270" cy="160" r="14"/><circle cx="270" cy="221" r="14"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#000">
    <text x="90" y="95">1</text><text x="90" y="165">2</text><text x="90" y="226">4</text>
    <text x="270" y="95">1</text><text x="270" y="165">3</text><text x="270" y="226">2</text>
  </g>
  <g font-size="13" fill="#000" text-anchor="middle">
    <text x="180" y="83">A</text><rect x="127" y="98" width="16" height="18" fill="#ffffff"/><text x="135" y="112">B</text><text x="180" y="176">C</text><text x="180" y="214">D</text>
    <rect x="210" y="98" width="30" height="18" fill="#ffffff"/><text x="225" y="112">足す</text>
  </g>
  <text x="180" y="276" text-anchor="middle" font-size="13">足す点 (2, 1) は x=2 と y=1 を結ぶ辺で、</text>
  <text x="180" y="298" text-anchor="middle" font-size="13">A・B・C と同じ成分の中にある</text>
</svg>
