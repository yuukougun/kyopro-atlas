<text x="16" y="422" fill="#222" font-size="16">葉を除く段の数は log₂ 8 = 3</text>
<text x="16" y="448" fill="#a33" font-size="16">転倒数 = 5 + (2 + 2) + (1 + 1 + 1 + 1) = 13</text>
