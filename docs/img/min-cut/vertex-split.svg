<text x="150" y="318" text-anchor="middle" fill="#555" font-size="13">4</text>
<text x="310" y="186" fill="#222" font-size="22">→</text>
<text x="360" y="30" fill="#222">頂点を入口と出口に分けたグラフ</text>
<path d="M345,180 L470,55 L540,55 L540,305 L470,305 Z" fill="#cfe3ff" stroke="#1f4e9a" stroke-dasharray="6 4" stroke-width="1.5"/>
<line x1="395.2" y1="168.6" x2="483.2" y2="102.6" stroke="#333" stroke-width="1.6" marker-end="url(#ark)"/>
