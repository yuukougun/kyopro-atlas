<text x="500" y="95" text-anchor="middle" fill="#222" font-size="15">1入</text>
<circle cx="640" cy="90" r="19" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
<text x="640" y="95" text-anchor="middle" fill="#222" font-size="15">1出</text>
