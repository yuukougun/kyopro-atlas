<text x="640" y="275" text-anchor="middle" fill="#222" font-size="15">2出</text>
<text x="20" y="350" fill="#555" font-size="13">赤い太線：入口→出口（容量 = 消す費用）。細い線：元の辺（容量 ∞。s の入口側と t の出口側は省いた）</text>
<text x="20" y="374" fill="#555" font-size="13">青い破線の枠が s 側。入口だけが s 側にある頂点 1・2 を消す（費用 5 + 4 = 9）</text>
</svg>
