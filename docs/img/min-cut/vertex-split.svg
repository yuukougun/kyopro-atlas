<circle cx="50" cy="180" r="19" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
<text x="50" y="185" text-anchor="middle" fill="#222" font-size="15">s</text>
<circle cx="250" cy="180" r="19" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
<text x="250" y="185" text-anchor="middle" fill="#222" font-size="15">t</text>
