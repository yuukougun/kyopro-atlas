<text x="570" y="296" text-anchor="middle" fill="#c0392b" font-weight="bold">4</text>
<text x="428" y="124" text-anchor="middle" fill="#222">∞</text>
<text x="428" y="244" text-anchor="middle" fill="#222">∞</text>
<text x="712" y="124" text-anchor="middle" fill="#222">∞</text>
<text x="712" y="244" text-anchor="middle" fill="#222">∞</text>
<text x="585" y="150" text-anchor="middle" fill="#222">∞</text>
<text x="585" y="222" text-anchor="middle" fill="#222">∞</text>
<circle cx="380" cy="180" r="19" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
<text x="380" y="185" text-anchor="middle" fill="#222" font-size="15">s</text>
<circle cx="760" cy="180" r="19" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
<text x="760" y="185" text-anchor="middle" fill="#222" font-size="15">t</text>
