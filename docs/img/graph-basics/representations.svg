<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>

  <!-- 1. グラフ -->
  <text x="100" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">グラフ</text>
  <g stroke="#555" stroke-width="2">
    <line x1="50" y1="80" x2="150" y2="80"/>
    <line x1="50" y1="80" x2="100" y2="160"/>
    <line x1="100" y1="160" x2="100" y2="240"/>
  </g>
  <line x1="150" y1="80" x2="100" y2="160" stroke="#d9480f" stroke-width="5" stroke-dasharray="9 5"/>
  <text x="140" y="132" font-weight="bold" fill="#d9480f">e</text>
  <g fill="#ffffff" stroke="#222" stroke-width="2">
    <circle cx="50" cy="80" r="17"/>
    <circle cx="150" cy="80" r="17"/>
    <circle cx="100" cy="160" r="17"/>
    <circle cx="100" cy="240" r="17"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="50" y="85">0</text>
    <text x="150" y="85">1</text>
    <text x="100" y="165">2</text>
    <text x="100" y="245">3</text>
  </g>

  <!-- 2. 隣接リスト -->
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">隣接リスト</text>
  <g fill="#222">
    <text x="232" y="85">g[0]</text>
    <text x="232" y="125">g[1]</text>
    <text x="232" y="165">g[2]</text>
    <text x="232" y="205">g[3]</text>
  </g>
  <g fill="#ffffff" stroke="#888" stroke-width="1.5">
    <rect x="280" y="64" width="30" height="28"/><rect x="316" y="64" width="30" height="28"/>
    <rect x="280" y="104" width="30" height="28"/>
    <rect x="316" y="144" width="30" height="28"/><rect x="352" y="144" width="30" height="28"/>
    <rect x="280" y="184" width="30" height="28"/>
  </g>
  <g fill="#ffe8cc" stroke="#d9480f" stroke-width="3">
    <rect x="316" y="104" width="30" height="28"/>
    <rect x="280" y="144" width="30" height="28"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="295" y="83">1</text><text x="331" y="83">2</text>
    <text x="295" y="123">0</text><text x="331" y="123" font-weight="bold">2</text>
    <text x="295" y="163" font-weight="bold">1</text><text x="331" y="163">0</text><text x="367" y="163">3</text>
    <text x="295" y="203">2</text>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="13" fill="#555">要素数の合計 2M = 8</text>

  <!-- 3. 隣接行列 -->
  <text x="560" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">隣接行列</text>
  <g text-anchor="middle" font-size="13" fill="#555">
    <text x="512" y="58">0</text><text x="544" y="58">1</text><text x="576" y="58">2</text><text x="608" y="58">3</text>
    <text x="484" y="86">0</text><text x="484" y="118">1</text><text x="484" y="150">2</text><text x="484" y="182">3</text>
  </g>
  <g fill="#ffffff" stroke="#888" stroke-width="1.5">
    <rect x="496" y="64" width="32" height="32"/><rect x="528" y="64" width="32" height="32"/><rect x="560" y="64" width="32" height="32"/><rect x="592" y="64" width="32" height="32"/>
    <rect x="496" y="96" width="32" height="32"/><rect x="528" y="96" width="32" height="32"/><rect x="592" y="96" width="32" height="32"/>
    <rect x="496" y="128" width="32" height="32"/><rect x="560" y="128" width="32" height="32"/><rect x="592" y="128" width="32" height="32"/>
    <rect x="496" y="160" width="32" height="32"/><rect x="528" y="160" width="32" height="32"/><rect x="560" y="160" width="32" height="32"/><rect x="592" y="160" width="32" height="32"/>
  </g>
  <g fill="#ffe8cc" stroke="#d9480f" stroke-width="3">
    <rect x="560" y="96" width="32" height="32"/>
    <rect x="528" y="128" width="32" height="32"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="512" y="85">0</text><text x="544" y="85">1</text><text x="576" y="85">1</text><text x="608" y="85">0</text>
    <text x="512" y="117">1</text><text x="544" y="117">0</text><text x="576" y="117" font-weight="bold">1</text><text x="608" y="117">0</text>
    <text x="512" y="149">1</text><text x="544" y="149" font-weight="bold">1</text><text x="576" y="149">0</text><text x="608" y="149">1</text>
    <text x="512" y="181">0</text><text x="544" y="181">0</text><text x="576" y="181">1</text><text x="608" y="181">0</text>
  </g>
  <text x="560" y="240" text-anchor="middle" font-size="13" fill="#555">マスの数 N² = 16</text>

  <!-- 4. 辺リスト -->
  <text x="790" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">辺リスト</text>
  <g fill="#ffffff" stroke="#888" stroke-width="1.5">
    <rect x="725" y="64" width="130" height="28"/>
    <rect x="725" y="104" width="130" height="28"/>
    <rect x="725" y="184" width="130" height="28"/>
  </g>
  <rect x="725" y="144" width="130" height="28" fill="#ffe8cc" stroke="#d9480f" stroke-width="3"/>
  <g fill="#222">
    <text x="735" y="83">0 番目：(0, 1)</text>
    <text x="735" y="123">1 番目：(0, 2)</text>
    <text x="735" y="163" font-weight="bold">2 番目：(1, 2)</text>
    <text x="735" y="203">3 番目：(2, 3)</text>
  </g>
  <text x="790" y="240" text-anchor="middle" font-size="13" fill="#555">要素数 M = 4</text>

  <!-- 凡例 -->
  <rect x="40" y="266" width="22" height="18" fill="#ffe8cc" stroke="#d9480f" stroke-width="3"/>
  <text x="72" y="281" fill="#222">太い橙の枠：辺 e = {1, 2} の現れる場所。隣接リスト・隣接行列では 2 か所、辺リストでは 1 か所</text>
</svg>
