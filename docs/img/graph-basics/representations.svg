<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 590" width="460" height="590" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="460" height="590" fill="#ffffff"/>

  <!-- 1. グラフ（左上） -->
  <text x="115" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">グラフ</text>
  <g stroke="#555" stroke-width="2">
    <line x1="65" y1="80" x2="165" y2="80"/>
    <line x1="65" y1="80" x2="115" y2="160"/>
    <line x1="115" y1="160" x2="115" y2="240"/>
  </g>
  <line x1="165" y1="80" x2="115" y2="160" stroke="#d9480f" stroke-width="5" stroke-dasharray="9 5"/>
  <text x="155" y="132" font-weight="bold" fill="#d9480f">e</text>
  <g fill="#ffffff" stroke="#222" stroke-width="2">
    <circle cx="65" cy="80" r="17"/>
    <circle cx="165" cy="80" r="17"/>
    <circle cx="115" cy="160" r="17"/>
    <circle cx="115" cy="240" r="17"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="65" y="85">0</text>
    <text x="165" y="85">1</text>
    <text x="115" y="165">2</text>
    <text x="115" y="245">3</text>
  </g>

  <!-- 2. 隣接リスト（右上） -->
  <text x="345" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">隣接リスト</text>
  <g fill="#222">
    <text x="262" y="83">g[0]</text>
    <text x="262" y="123">g[1]</text>
    <text x="262" y="163">g[2]</text>
    <text x="262" y="203">g[3]</text>
  </g>
  <g fill="#ffffff" stroke="#888" stroke-width="1.5">
    <rect x="310" y="64" width="30" height="28"/><rect x="346" y="64" width="30" height="28"/>
    <rect x="310" y="104" width="30" height="28"/>
    <rect x="310" y="144" width="30" height="28"/><rect x="382" y="144" width="30" height="28"/>
    <rect x="310" y="184" width="30" height="28"/>
  </g>
  <g fill="#ffe8cc" stroke="#d9480f" stroke-width="3">
    <rect x="346" y="104" width="30" height="28"/>
    <rect x="346" y="144" width="30" height="28"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="325" y="83">1</text><text x="361" y="83">2</text>
    <text x="325" y="123">0</text><text x="361" y="123" font-weight="bold">2</text>
    <text x="325" y="163">0</text><text x="361" y="163" font-weight="bold">1</text><text x="397" y="163">3</text>
    <text x="325" y="203">2</text>
  </g>
  <text x="345" y="240" text-anchor="middle" font-size="14" fill="#555">要素数の合計 2M = 8</text>

  <!-- 3. 隣接行列（左下） -->
  <text x="115" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">隣接行列</text>
  <g text-anchor="middle" font-size="14" fill="#555">
    <text x="67" y="328">0</text><text x="99" y="328">1</text><text x="131" y="328">2</text><text x="163" y="328">3</text>
    <text x="39" y="356">0</text><text x="39" y="388">1</text><text x="39" y="420">2</text><text x="39" y="452">3</text>
  </g>
  <g fill="#ffffff" stroke="#888" stroke-width="1.5">
    <rect x="51" y="334" width="32" height="32"/><rect x="83" y="334" width="32" height="32"/><rect x="115" y="334" width="32" height="32"/><rect x="147" y="334" width="32" height="32"/>
    <rect x="51" y="366" width="32" height="32"/><rect x="83" y="366" width="32" height="32"/><rect x="147" y="366" width="32" height="32"/>
    <rect x="51" y="398" width="32" height="32"/><rect x="115" y="398" width="32" height="32"/><rect x="147" y="398" width="32" height="32"/>
    <rect x="51" y="430" width="32" height="32"/><rect x="83" y="430" width="32" height="32"/><rect x="115" y="430" width="32" height="32"/><rect x="147" y="430" width="32" height="32"/>
  </g>
  <g fill="#ffe8cc" stroke="#d9480f" stroke-width="3">
    <rect x="115" y="366" width="32" height="32"/>
    <rect x="83" y="398" width="32" height="32"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="67" y="355">0</text><text x="99" y="355">1</text><text x="131" y="355">1</text><text x="163" y="355">0</text>
    <text x="67" y="387">1</text><text x="99" y="387">0</text><text x="131" y="387" font-weight="bold">1</text><text x="163" y="387">0</text>
    <text x="67" y="419">1</text><text x="99" y="419" font-weight="bold">1</text><text x="131" y="419">0</text><text x="163" y="419">1</text>
    <text x="67" y="451">0</text><text x="99" y="451">0</text><text x="131" y="451">1</text><text x="163" y="451">0</text>
  </g>
  <text x="115" y="500" text-anchor="middle" font-size="14" fill="#555">マスの数 N² = 16</text>

  <!-- 4. 辺リスト（右下） -->
  <text x="345" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">辺リスト</text>
  <g fill="#ffffff" stroke="#888" stroke-width="1.5">
    <rect x="280" y="334" width="130" height="28"/>
    <rect x="280" y="374" width="130" height="28"/>
    <rect x="280" y="454" width="130" height="28"/>
  </g>
  <rect x="280" y="414" width="130" height="28" fill="#ffe8cc" stroke="#d9480f" stroke-width="3"/>
  <g fill="#222">
    <text x="290" y="353">0 番目：(0, 1)</text>
    <text x="290" y="393">1 番目：(0, 2)</text>
    <text x="290" y="433" font-weight="bold">2 番目：(1, 2)</text>
    <text x="290" y="473">3 番目：(2, 3)</text>
  </g>
  <text x="345" y="500" text-anchor="middle" font-size="14" fill="#555">要素数 M = 4</text>

  <!-- 凡例（2 行） -->
  <rect x="16" y="531" width="22" height="18" fill="#ffe8cc" stroke="#d9480f" stroke-width="3"/>
  <text x="46" y="546" font-size="14" fill="#222">太い橙の枠：辺 e = {1, 2} の現れる場所</text>
  <text x="46" y="570" font-size="14" fill="#222">隣接リスト・隣接行列では 2 か所、辺リストでは 1 か所</text>
</svg>
