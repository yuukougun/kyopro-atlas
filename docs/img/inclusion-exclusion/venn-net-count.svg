<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222" font-size="15">Σ(−1)^|S| N(S) で、各領域の要素が数えられる回数</text>
<text x="20" y="46" fill="#555" font-size="12">A・B・C は条件を破るものの集合。各領域の式は左から</text>
<text x="20" y="62" fill="#555" font-size="12">N(∅)・N(1 つ)・N(2 つ)・N(3 つ) の項からの寄与</text>
<rect x="20" y="76" width="420" height="330" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="30" y="96" fill="#333" font-size="12">全体</text>
<circle cx="190" cy="185" r="95" fill="#4c78a8" fill-opacity="0.12" stroke="#4c78a8" stroke-width="2"/>
<circle cx="290" cy="185" r="95" fill="#f58518" fill-opacity="0.12" stroke="#f58518" stroke-width="2" stroke-dasharray="8 4"/>
<circle cx="240" cy="272" r="95" fill="#54a24b" fill-opacity="0.12" stroke="#54a24b" stroke-width="2" stroke-dasharray="2 4"/>
<text x="102" y="110" fill="#4c78a8" font-weight="bold">A</text>
<text x="368" y="110" fill="#f58518" font-weight="bold">B</text>
<text x="330" y="372" fill="#54a24b" font-weight="bold">C</text>
<g text-anchor="middle" font-size="12" fill="#222">
<text x="150" y="160">1 − 1</text><text x="150" y="176">= 0</text>
<text x="330" y="160">1 − 1</text><text x="330" y="176">= 0</text>
<text x="240" y="320">1 − 1</text><text x="240" y="336">= 0</text>
<text x="240" y="140">1 − 2 + 1</text><text x="240" y="156">= 0</text>
<text x="180" y="248">1 − 2 + 1</text><text x="180" y="264">= 0</text>
<text x="300" y="248">1 − 2 + 1</text><text x="300" y="264">= 0</text>
<text x="240" y="200" font-weight="bold">1−3+3−1</text><text x="240" y="216" font-weight="bold">= 0</text>
<text x="50" y="392" font-weight="bold" font-size="16">1</text>
</g>
<g font-size="13" fill="#222">
<text x="20" y="432">どれにも入らない要素だけが 1 回残る（左下の 1）。</text>
<text x="20" y="454">t 個（t ≥ 1）の集合に入る要素は Σ(−1)^j C(t, j) = 0 回。</text>
</g>
</svg>
