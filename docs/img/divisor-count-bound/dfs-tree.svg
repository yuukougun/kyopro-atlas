<text x="12" y="462" font-size="13" fill="#555">1 段下るごとに 2・3・5 の指数を決める</text>
<text x="12" y="481" font-size="13" fill="#555">（括弧は約数の個数）</text>
<text x="12" y="500" font-size="13" fill="#555">8·3² = 72 や 2·3² = 18 は作らない</text>
