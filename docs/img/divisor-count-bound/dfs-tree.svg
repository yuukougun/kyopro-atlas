<text x="290" y="320" font-size="12" fill="#555">8·3² = 72 や 2·3² = 18 は作らない</text>
<text x="290" y="340" font-size="12" fill="#555">（60 を超える、または 3 の指数が 2 の指数より大きい）</text>
<text x="16" y="385" font-size="13" fill="#222">最大は 60 = 2²·3·5 の 12 個（二重枠）。調べた数は 13 個</text>
