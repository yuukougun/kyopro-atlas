<line x1="270" y1="68" x2="300" y2="122" stroke="#666" stroke-width="1.5"/>
<line x1="270" y1="68" x2="410" y2="122" stroke="#666" stroke-width="1.5"/>
<line x1="270" y1="68" x2="510" y2="122" stroke="#666" stroke-width="1.5"/>
<line x1="50" y1="158" x2="50" y2="212" stroke="#666" stroke-width="1.5"/>
