<line x1="135" y1="248" x2="135" y2="302" stroke="#666" stroke-width="1.5"/>
<rect x="232.0" y="32" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="270" y="55" font-size="15" text-anchor="middle" fill="#111">1（1）</text>
<rect x="12.0" y="122" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="50" y="145" font-size="15" text-anchor="middle" fill="#111">2（2）</text>
<rect x="140.0" y="122" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="178" y="145" font-size="15" text-anchor="middle" fill="#111">4（3）</text>
<rect x="262.0" y="122" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="300" y="145" font-size="15" text-anchor="middle" fill="#111">8（4）</text>
<rect x="372.0" y="122" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="410" y="145" font-size="15" text-anchor="middle" fill="#111">16（5）</text>
<rect x="472.0" y="122" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="510" y="145" font-size="15" text-anchor="middle" fill="#111">32（6）</text>
<rect x="12.0" y="212" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="50" y="235" font-size="15" text-anchor="middle" fill="#111">6（4）</text>
<rect x="97.0" y="212" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="135" y="235" font-size="15" text-anchor="middle" fill="#111">12（6）</text>
<rect x="182.0" y="212" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="220" y="235" font-size="15" text-anchor="middle" fill="#111">36（9）</text>
<rect x="262.0" y="212" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="300" y="235" font-size="15" text-anchor="middle" fill="#111">24（8）</text>
<rect x="372.0" y="212" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="410" y="235" font-size="15" text-anchor="middle" fill="#111">48（10）</text>
<rect x="12.0" y="302" width="76" height="36" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
<text x="50" y="325" font-size="15" text-anchor="middle" fill="#111">30（8）</text>
<rect x="97.0" y="302" width="76" height="36" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
<rect x="93.0" y="298" width="84" height="44" rx="8" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
<text x="135" y="325" font-size="15" text-anchor="middle" fill="#111">60（12）</text>
<text x="200" y="320" font-size="13" fill="#555">8·3² = 72 や 2·3² = 18 は作らない</text>
<text x="200" y="340" font-size="13" fill="#555">（60 超え、または 3 の指数 &gt; 2 の指数）</text>
<text x="12" y="390" font-size="14" fill="#222">最大は 60 = 2²·3·5 の 12 個（二重枠）。調べた数は 13 個</text>
