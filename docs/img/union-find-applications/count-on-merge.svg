<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="15" y="24" fill="#222">木 1 −(1)− 2 −(5)− 3 −(2)− 4 の辺を、</text>
<text x="15" y="42" fill="#222">重みの昇順に足す</text>
<text x="15" y="75" fill="#222" font-weight="bold">最初</text>
<rect x="18" y="86" width="54" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="108" y="86" width="54" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="198" y="86" width="54" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="288" y="86" width="54" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<line x1="60" y1="110" x2="120" y2="110" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="90" y="102" text-anchor="middle" fill="#888" font-size="13">1</text>
<line x1="150" y1="110" x2="210" y2="110" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="180" y="102" text-anchor="middle" fill="#888" font-size="13">5</text>
<line x1="240" y1="110" x2="300" y2="110" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="270" y="102" text-anchor="middle" fill="#888" font-size="13">2</text>
<circle cx="45" cy="110" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="45" y="115" text-anchor="middle" fill="#222">1</text>
<circle cx="135" cy="110" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="135" y="115" text-anchor="middle" fill="#222">2</text>
<circle cx="225" cy="110" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="225" y="115" text-anchor="middle" fill="#222">3</text>
<circle cx="315" cy="110" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="315" y="115" text-anchor="middle" fill="#222">4</text>
<text x="15" y="155" fill="#222">成分はどれも 1 頂点</text>
<text x="15" y="180" fill="#222" font-weight="bold">w = 1 を足す</text>
<rect x="18" y="191" width="144" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="198" y="191" width="54" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="288" y="191" width="54" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<line x1="60" y1="215" x2="120" y2="215" stroke="#222" stroke-width="3"/>
<text x="90" y="207" text-anchor="middle" fill="#222" font-size="13">1</text>
<line x1="150" y1="215" x2="210" y2="215" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="180" y="207" text-anchor="middle" fill="#888" font-size="13">5</text>
<line x1="240" y1="215" x2="300" y2="215" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="270" y="207" text-anchor="middle" fill="#888" font-size="13">2</text>
<circle cx="45" cy="215" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="45" y="220" text-anchor="middle" fill="#222">1</text>
<circle cx="135" cy="215" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="135" y="220" text-anchor="middle" fill="#222">2</text>
<circle cx="225" cy="215" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="225" y="220" text-anchor="middle" fill="#222">3</text>
<circle cx="315" cy="215" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="315" y="220" text-anchor="middle" fill="#222">4</text>
<text x="15" y="260" fill="#222">1 × 1 = 1 組の最大が 1 に決まる（+1）</text>
<text x="15" y="285" fill="#222" font-weight="bold">w = 2 を足す</text>
<rect x="18" y="296" width="144" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="198" y="296" width="144" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<line x1="60" y1="320" x2="120" y2="320" stroke="#222" stroke-width="3"/>
<text x="90" y="312" text-anchor="middle" fill="#222" font-size="13">1</text>
<line x1="150" y1="320" x2="210" y2="320" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="180" y="312" text-anchor="middle" fill="#888" font-size="13">5</text>
<line x1="240" y1="320" x2="300" y2="320" stroke="#222" stroke-width="3"/>
<text x="270" y="312" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="45" cy="320" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="45" y="325" text-anchor="middle" fill="#222">1</text>
<circle cx="135" cy="320" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="135" y="325" text-anchor="middle" fill="#222">2</text>
<circle cx="225" cy="320" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="225" y="325" text-anchor="middle" fill="#222">3</text>
<circle cx="315" cy="320" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="315" y="325" text-anchor="middle" fill="#222">4</text>
<text x="15" y="365" fill="#222">1 × 1 = 1 組の最大が 2 に決まる（+2）</text>
<text x="15" y="390" fill="#222" font-weight="bold">w = 5 を足す</text>
<rect x="18" y="401" width="324" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<line x1="60" y1="425" x2="120" y2="425" stroke="#222" stroke-width="3"/>
<text x="90" y="417" text-anchor="middle" fill="#222" font-size="13">1</text>
<line x1="150" y1="425" x2="210" y2="425" stroke="#222" stroke-width="3"/>
<text x="180" y="417" text-anchor="middle" fill="#222" font-size="13">5</text>
<line x1="240" y1="425" x2="300" y2="425" stroke="#222" stroke-width="3"/>
<text x="270" y="417" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="45" cy="425" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="45" y="430" text-anchor="middle" fill="#222">1</text>
<circle cx="135" cy="425" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="135" y="430" text-anchor="middle" fill="#222">2</text>
<circle cx="225" cy="425" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="225" y="430" text-anchor="middle" fill="#222">3</text>
<circle cx="315" cy="425" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="315" y="430" text-anchor="middle" fill="#222">4</text>
<text x="15" y="470" fill="#222">2 × 2 = 4 組の最大が 5 に決まる（+20）</text>
<text x="15" y="500" fill="#555" font-size="13">太線：足した辺　点線：まだの辺　点線の枠：成分</text>
<text x="15" y="518" fill="#555" font-size="13">合計 1 + 2 + 20 = 23、組の数 1 + 1 + 4 = 6 = 4 × 3 / 2</text>
</svg>
