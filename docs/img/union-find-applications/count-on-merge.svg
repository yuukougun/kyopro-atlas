<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222">木 1 −(1)− 2 −(5)− 3 −(2)− 4 の辺を、重みの昇順に足す</text>
<text x="20" y="60" fill="#222" font-weight="bold">最初</text>
<rect x="34" y="71" width="52" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="134" y="71" width="52" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="234" y="71" width="52" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="334" y="71" width="52" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<line x1="75" y1="95" x2="145" y2="95" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="110" y="87" text-anchor="middle" fill="#999" font-size="12">1</text>
<line x1="175" y1="95" x2="245" y2="95" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="210" y="87" text-anchor="middle" fill="#999" font-size="12">5</text>
<line x1="275" y1="95" x2="345" y2="95" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="310" y="87" text-anchor="middle" fill="#999" font-size="12">2</text>
<circle cx="60" cy="95" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="100" text-anchor="middle" fill="#222">1</text>
<circle cx="160" cy="95" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="160" y="100" text-anchor="middle" fill="#222">2</text>
<circle cx="260" cy="95" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="260" y="100" text-anchor="middle" fill="#222">3</text>
<circle cx="360" cy="95" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="360" y="100" text-anchor="middle" fill="#222">4</text>
<text x="410" y="100" fill="#222">成分はどれも 1 頂点</text>
<text x="20" y="155" fill="#222" font-weight="bold">w = 1 を足す</text>
<rect x="34" y="166" width="152" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="234" y="166" width="52" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="334" y="166" width="52" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<line x1="75" y1="190" x2="145" y2="190" stroke="#222" stroke-width="3"/>
<text x="110" y="182" text-anchor="middle" fill="#222" font-size="12">1</text>
<line x1="175" y1="190" x2="245" y2="190" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="210" y="182" text-anchor="middle" fill="#999" font-size="12">5</text>
<line x1="275" y1="190" x2="345" y2="190" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="310" y="182" text-anchor="middle" fill="#999" font-size="12">2</text>
<circle cx="60" cy="190" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="195" text-anchor="middle" fill="#222">1</text>
<circle cx="160" cy="190" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="160" y="195" text-anchor="middle" fill="#222">2</text>
<circle cx="260" cy="190" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="260" y="195" text-anchor="middle" fill="#222">3</text>
<circle cx="360" cy="190" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="360" y="195" text-anchor="middle" fill="#222">4</text>
<text x="410" y="195" fill="#222">1 × 1 = 1 組の最大が 1 に決まる（+1）</text>
<text x="20" y="250" fill="#222" font-weight="bold">w = 2 を足す</text>
<rect x="34" y="261" width="152" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<rect x="234" y="261" width="152" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<line x1="75" y1="285" x2="145" y2="285" stroke="#222" stroke-width="3"/>
<text x="110" y="277" text-anchor="middle" fill="#222" font-size="12">1</text>
<line x1="175" y1="285" x2="245" y2="285" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="210" y="277" text-anchor="middle" fill="#999" font-size="12">5</text>
<line x1="275" y1="285" x2="345" y2="285" stroke="#222" stroke-width="3"/>
<text x="310" y="277" text-anchor="middle" fill="#222" font-size="12">2</text>
<circle cx="60" cy="285" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="290" text-anchor="middle" fill="#222">1</text>
<circle cx="160" cy="285" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="160" y="290" text-anchor="middle" fill="#222">2</text>
<circle cx="260" cy="285" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="260" y="290" text-anchor="middle" fill="#222">3</text>
<circle cx="360" cy="285" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="360" y="290" text-anchor="middle" fill="#222">4</text>
<text x="410" y="290" fill="#222">1 × 1 = 1 組の最大が 2 に決まる（+2）</text>
<text x="20" y="345" fill="#222" font-weight="bold">w = 5 を足す</text>
<rect x="34" y="356" width="352" height="48" rx="12" fill="#eef4ff" stroke="#1f4e9a" stroke-dasharray="5 3"/>
<line x1="75" y1="380" x2="145" y2="380" stroke="#222" stroke-width="3"/>
<text x="110" y="372" text-anchor="middle" fill="#222" font-size="12">1</text>
<line x1="175" y1="380" x2="245" y2="380" stroke="#222" stroke-width="3"/>
<text x="210" y="372" text-anchor="middle" fill="#222" font-size="12">5</text>
<line x1="275" y1="380" x2="345" y2="380" stroke="#222" stroke-width="3"/>
<text x="310" y="372" text-anchor="middle" fill="#222" font-size="12">2</text>
<circle cx="60" cy="380" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="385" text-anchor="middle" fill="#222">1</text>
<circle cx="160" cy="380" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="160" y="385" text-anchor="middle" fill="#222">2</text>
<circle cx="260" cy="380" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="260" y="385" text-anchor="middle" fill="#222">3</text>
<circle cx="360" cy="380" r="15" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="360" y="385" text-anchor="middle" fill="#222">4</text>
<text x="410" y="385" fill="#222">2 × 2 = 4 組の最大が 5 に決まる（+20）</text>
<text x="20" y="438" fill="#555" font-size="12">太線：足した辺　点線：まだ足していない辺　点線の枠：連結成分　合計 1 + 2 + 20 = 23、組の数 1 + 1 + 4 = 6 = 4 × 3 / 2</text>
</svg>
