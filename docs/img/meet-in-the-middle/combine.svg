<svg xmlns="http://www.w3.org/2000/svg" width="400" height="364" viewBox="0 0 400 364" font-family="sans-serif" font-size="15">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(0 2)">
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<text x="16" y="22" fill="#222">前半 (3, 5) の部分和 p</text>
<text x="16" y="42" fill="#222">と、相手に探す範囲</text>
<text x="270" y="22" fill="#222">後半 (8, 2)</text>
<text x="270" y="42" fill="#222">の部分和 q</text>
<text x="260" y="60" fill="#555" font-size="13">（昇順にソート済み）</text>
<rect x="16" y="76" width="180" height="36" fill="#fff3d6" stroke="#9a6b1f" stroke-width="1.5"/>
<text x="24" y="99" fill="#555" font-size="13">∅</text>
<text x="74" y="99" fill="#222">p = 0</text>
<text x="134" y="99" fill="#222">q ≤ 11</text>
<rect x="16" y="128" width="180" height="36" fill="#fff3d6" stroke="#9a6b1f" stroke-width="1.5"/>
<text x="24" y="151" fill="#555" font-size="13">{3}</text>
<text x="74" y="151" fill="#222">p = 3</text>
<text x="134" y="151" fill="#222">q ≤ 8</text>
<rect x="16" y="180" width="180" height="36" fill="#fff3d6" stroke="#9a6b1f" stroke-width="1.5"/>
<text x="24" y="203" fill="#555" font-size="13">{5}</text>
<text x="74" y="203" fill="#222">p = 5</text>
<text x="134" y="203" fill="#222">q ≤ 6</text>
<rect x="16" y="232" width="180" height="36" fill="#fff3d6" stroke="#9a6b1f" stroke-width="1.5"/>
<text x="24" y="255" fill="#555" font-size="13">{3, 5}</text>
<text x="74" y="255" fill="#222">p = 8</text>
<text x="134" y="255" fill="#222">q ≤ 3</text>
<rect x="270" y="76" width="114" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="278" y="99" fill="#555" font-size="13">∅</text>
<text x="326" y="99" fill="#222">q = 0</text>
<rect x="270" y="128" width="114" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="278" y="151" fill="#555" font-size="13">{2}</text>
<text x="326" y="151" fill="#222">q = 2</text>
<rect x="270" y="180" width="114" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="278" y="203" fill="#555" font-size="13">{8}</text>
<text x="326" y="203" fill="#222">q = 8</text>
<rect x="270" y="232" width="114" height="36" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/>
<text x="278" y="255" fill="#555" font-size="13">{8, 2}</text>
<text x="326" y="255" fill="#222">q = 10</text>
<line x1="198" y1="94" x2="267" y2="250" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<line x1="198" y1="146" x2="267" y2="198" stroke="#c0392b" stroke-width="3" marker-end="url(#ahr)"/>
<line x1="198" y1="198" x2="267" y2="146" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<line x1="198" y1="250" x2="267" y2="146" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="16" y="302" fill="#222">p + q：0 + 10 = 10、3 + 8 = 11、</text>
<text x="16" y="324" fill="#222">5 + 2 = 7、8 + 2 = 10</text>
<text x="16" y="346" fill="#222">T = 11 以下の最大は 11（太い実線の矢印）</text>
</g>
</svg>
