<text x="20" y="24" fill="#222">品物 1 個（重さ 2・価値 3）、W = 6。更新前の dp はすべて 0</text>
<text x="178.0" y="52" text-anchor="middle" fill="#555" font-size="12">j = 0</text>
<text x="234.0" y="52" text-anchor="middle" fill="#555" font-size="12">j = 1</text>
