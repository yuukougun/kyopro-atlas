<text x="151" y="139" text-anchor="middle" font-weight="bold" font-size="15" fill="#222" stroke="#fff" stroke-width="4" paint-order="stroke">A</text>
<line x1="96" y1="226" x2="134" y2="264" stroke="#666" stroke-width="1.5"/><line x1="134" y1="226" x2="96" y2="264" stroke="#666" stroke-width="1.5"/>
