<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222">p = (3, 4, 1, 2)：位置 i から値 p(i) へ線を結ぶ</text>
<text x="20" y="85" fill="#555">位置</text><text x="20" y="225" fill="#555">値</text>
<line x1="165.0" y1="55" x2="165.0" y2="245" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="165.0" y="268" text-anchor="middle" fill="#222">2 本</text>
<text x="165.0" y="288" text-anchor="middle" fill="#555">d = 1</text>
<line x1="275.0" y1="55" x2="275.0" y2="245" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="275.0" y="268" text-anchor="middle" fill="#222">4 本</text>
<text x="275.0" y="288" text-anchor="middle" fill="#555">d = 2</text>
<line x1="385.0" y1="55" x2="385.0" y2="245" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="385.0" y="268" text-anchor="middle" fill="#222">2 本</text>
<text x="385.0" y="288" text-anchor="middle" fill="#555">d = 1</text>
<line x1="110" y1="94" x2="330" y2="206" stroke="#2c6fad" stroke-width="2.5"/>
<line x1="220" y1="94" x2="440" y2="206" stroke="#2c6fad" stroke-width="2.5"/>
<line x1="330" y1="94" x2="110" y2="206" stroke="#2c6fad" stroke-width="2.5"/>
<line x1="440" y1="94" x2="220" y2="206" stroke="#2c6fad" stroke-width="2.5"/>
<circle cx="110" cy="80" r="14" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
<text x="110" y="85" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<circle cx="110" cy="220" r="14" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
<text x="110" y="225" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<circle cx="220" cy="80" r="14" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
<text x="220" y="85" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<circle cx="220" cy="220" r="14" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
<text x="220" y="225" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<circle cx="330" cy="80" r="14" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
<text x="330" y="85" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<circle cx="330" cy="220" r="14" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
<text x="330" y="225" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<circle cx="440" cy="80" r="14" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
<text x="440" y="85" text-anchor="middle" fill="#222" font-weight="bold">4</text>
<circle cx="440" cy="220" r="14" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
<text x="440" y="225" text-anchor="middle" fill="#222" font-weight="bold">4</text>
<text x="20" y="320" fill="#222">点線の隙間を横切る線の数は、相手が未定の位置 d 個と値 d 個の 2d 本</text>
<text x="20" y="342" fill="#222">横切る数の合計 2 + 4 + 2 = 8 が Σ|p(i) − i| = 2 + 2 + 2 + 2 に等しい</text>
</svg>
