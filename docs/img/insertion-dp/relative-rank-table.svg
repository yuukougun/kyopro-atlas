<svg width="340" height="412" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 412" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9cc3e6" stroke-width="4"/></pattern></defs>
<text x="8" y="22" fill="#222">条件 &lt; &gt; &lt;（N = 4）：dp[i][j] の表を</text>
<text x="8" y="42" fill="#222">左の列から順に埋める（列 i は決めた個数、</text>
<text x="8" y="62" fill="#222">行 j は順位）</text>
<text x="89" y="92" text-anchor="middle" fill="#555">i = 1</text>
<text x="161" y="92" text-anchor="middle" fill="#555">i = 2</text>
<text x="233" y="92" text-anchor="middle" fill="#555">i = 3</text>
<text x="305" y="92" text-anchor="middle" fill="#555">i = 4</text>
<text x="125" y="94" text-anchor="middle" fill="#222" font-size="20" font-weight="bold">&lt;</text>
<text x="197" y="94" text-anchor="middle" fill="#222" font-size="20" font-weight="bold">&gt;</text>
<text x="269" y="94" text-anchor="middle" fill="#222" font-size="20" font-weight="bold">&lt;</text>
<text x="8" y="130" fill="#555">j = 0</text>
<text x="8" y="170" fill="#555">j = 1</text>
<text x="8" y="210" fill="#555">j = 2</text>
<text x="8" y="250" fill="#555">j = 3</text>
<rect x="64" y="104" width="50" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="89" y="130" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="136" y="104" width="50" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="161" y="130" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<rect x="136" y="144" width="50" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="161" y="170" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="208" y="104" width="50" height="40" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
<text x="233" y="130" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="208" y="144" width="50" height="40" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
<text x="233" y="170" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="208" y="184" width="50" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="233" y="210" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<rect x="280" y="104" width="50" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="305" y="130" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<rect x="280" y="144" width="50" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="305" y="170" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="280" y="184" width="50" height="40" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
<text x="305" y="210" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<rect x="280" y="224" width="50" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="305" y="250" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<line x1="258" y1="184" x2="280" y2="204" stroke="#2c6fad" stroke-width="2" stroke-dasharray="5 3"/>
<text x="8" y="298" fill="#222">dp[4][2]（太枠）は、前の列の j &lt; 2 の範囲</text>
<text x="8" y="318" fill="#222">（斜線の帯）の和 1 + 1 = 2</text>
<text x="8" y="338" fill="#222">「&lt;」なら前の列の上側（接頭辞）、</text>
<text x="8" y="358" fill="#222">「&gt;」なら下側（接尾辞）の和になる</text>
<text x="8" y="378" fill="#222">右端の列の和 0 + 1 + 2 + 2 = 5 が答え</text>
<text x="8" y="398" fill="#222">（1 3 2 4 などの 5 通り）</text>
</svg>
