<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" font-family="sans-serif" font-size="14">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9cc3e6" stroke-width="4"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222">条件 &lt; &gt; &lt;（N = 4）：dp[i][j] の表を左の列から順に埋める</text>
<text x="20" y="76" fill="#555">列 i（決めた個数）</text>
<text x="185.0" y="76" text-anchor="middle" fill="#555">i = 1</text>
<text x="240.0" y="78" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">&lt;</text>
<text x="295.0" y="76" text-anchor="middle" fill="#555">i = 2</text>
<text x="350.0" y="78" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">&gt;</text>
<text x="405.0" y="76" text-anchor="middle" fill="#555">i = 3</text>
<text x="460.0" y="78" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">&lt;</text>
<text x="515.0" y="76" text-anchor="middle" fill="#555">i = 4</text>
<text x="20" y="116" fill="#555">順位 j = 0</text>
<text x="20" y="156" fill="#555">順位 j = 1</text>
<text x="20" y="196" fill="#555">順位 j = 2</text>
<text x="20" y="236" fill="#555">順位 j = 3</text>
<rect x="150" y="90" width="70" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="185.0" y="116" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="260" y="90" width="70" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="295.0" y="116" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<rect x="260" y="130" width="70" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="295.0" y="156" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="370" y="90" width="70" height="40" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
<text x="405.0" y="116" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="370" y="130" width="70" height="40" fill="url(#hatch)" stroke="#666" stroke-width="1.2"/>
<text x="405.0" y="156" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="370" y="170" width="70" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="405.0" y="196" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<rect x="480" y="90" width="70" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="515.0" y="116" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<rect x="480" y="130" width="70" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="515.0" y="156" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<rect x="480" y="170" width="70" height="40" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
<text x="515.0" y="196" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<rect x="480" y="210" width="70" height="40" fill="#ffffff" stroke="#666" stroke-width="1.2"/>
<text x="515.0" y="236" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<line x1="440" y1="130" x2="480" y2="190" stroke="#2c6fad" stroke-width="2" stroke-dasharray="5 3"/>
<text x="20" y="286" fill="#222">dp[4][2]（太枠）は、前の列の j &lt; 2 の範囲（斜線の帯）の和 1 + 1 = 2</text>
<text x="20" y="310" fill="#222">「&lt;」なら前の列の上側（接頭辞）、「&gt;」なら下側（接尾辞）の和になる</text>
<text x="20" y="334" fill="#222">右端の列の和 0 + 1 + 2 + 2 = 5 が答え（1 3 2 4 などの 5 通り）</text>
</svg>
