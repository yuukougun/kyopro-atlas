<text x="130" y="245" text-anchor="middle" font-size="14">(a) 奇数次数の頂点は D・E の 2 個</text>
<text x="130" y="267" text-anchor="middle" font-size="14">→ D から E へ一筆書きできる</text>
<text x="410" y="245" text-anchor="middle" font-size="14">(b) 4 頂点すべてが奇数次数</text>
<text x="410" y="267" text-anchor="middle" font-size="14">→ 一筆書きできない</text>
<circle cx="150" cy="292" r="8" fill="#fde2c8" stroke="#c0560a" stroke-width="2"/><text x="164" y="297" font-size="13">＝奇数次数の頂点（数字は次数）</text>
