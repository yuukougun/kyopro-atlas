<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="560" height="440" fill="#ffffff"/>
  <g stroke="#222222" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="82" y1="120" x2="176" y2="120"/>
    <line x1="222" y1="120" x2="316" y2="120"/>
    <line x1="362" y1="120" x2="456" y2="120"/>
    <path d="M72,101 Q200,30 328,99"/>
    <path d="M64,98 Q270,-25 476,96"/>
  </g>
  <g font-size="16" fill="#222222" text-anchor="middle">
    <text x="130" y="148">4</text>
    <text x="270" y="148" fill="#b03030">−2</text>
    <text x="410" y="148">3</text>
    <text x="200" y="86">5</text>
    <text x="270" y="28">9</text>
  </g>
  <g stroke="#222222" stroke-width="2" fill="#ffffff">
    <circle cx="60" cy="120" r="22"/>
    <circle cx="200" cy="120" r="22"/>
    <circle cx="340" cy="120" r="22"/>
    <circle cx="480" cy="120" r="22"/>
  </g>
  <g font-size="18" fill="#222222" text-anchor="middle" dominant-baseline="central">
    <text x="60" y="120">s</text>
    <text x="200" y="120">a</text>
    <text x="340" y="120">b</text>
    <text x="480" y="120">c</text>
  </g>
  <text x="280" y="182" font-size="16" fill="#222222" text-anchor="middle">1 回の反復で辺を緩和する順：b→c、a→b、s→a、s→b、s→c</text>
  <g font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">
    <text x="215.0" y="232.0" font-weight="bold">dist[s]</text>
    <text x="305.0" y="232.0" font-weight="bold">dist[a]</text>
    <text x="395.0" y="232.0" font-weight="bold">dist[b]</text>
    <text x="485.0" y="232.0" font-weight="bold">dist[c]</text>
  </g>
  <text x="160" y="266.0" font-size="16" fill="#222222" text-anchor="end" dominant-baseline="central">最初</text>
  <rect x="170" y="249" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="215.0" y="266.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="260" y="249" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="305.0" y="266.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">∞</text>
  <rect x="350" y="249" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="395.0" y="266.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">∞</text>
  <rect x="440" y="249" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="485.0" y="266.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">∞</text>
  <text x="160" y="300.0" font-size="16" fill="#222222" text-anchor="end" dominant-baseline="central">1 回目の後</text>
  <rect x="170" y="283" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="215.0" y="300.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="260" y="283" width="90" height="34" fill="#f6d5d5" stroke="#888888" stroke-width="1"/>
  <text x="305.0" y="300.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central" font-weight="bold">4</text>
  <rect x="350" y="283" width="90" height="34" fill="#f6d5d5" stroke="#888888" stroke-width="1"/>
  <text x="395.0" y="300.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central" font-weight="bold">5</text>
  <rect x="440" y="283" width="90" height="34" fill="#f6d5d5" stroke="#888888" stroke-width="1"/>
  <text x="485.0" y="300.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central" font-weight="bold">9</text>
  <text x="160" y="334.0" font-size="16" fill="#222222" text-anchor="end" dominant-baseline="central">2 回目の後</text>
  <rect x="170" y="317" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="215.0" y="334.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="260" y="317" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="305.0" y="334.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="350" y="317" width="90" height="34" fill="#f6d5d5" stroke="#888888" stroke-width="1"/>
  <text x="395.0" y="334.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central" font-weight="bold">2</text>
  <rect x="440" y="317" width="90" height="34" fill="#f6d5d5" stroke="#888888" stroke-width="1"/>
  <text x="485.0" y="334.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central" font-weight="bold">8</text>
  <text x="160" y="368.0" font-size="16" fill="#222222" text-anchor="end" dominant-baseline="central">3 回目の後</text>
  <rect x="170" y="351" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="215.0" y="368.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">0</text>
  <rect x="260" y="351" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="305.0" y="368.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="350" y="351" width="90" height="34" fill="#ffffff" stroke="#888888" stroke-width="1"/>
  <text x="395.0" y="368.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="440" y="351" width="90" height="34" fill="#f6d5d5" stroke="#888888" stroke-width="1"/>
  <text x="485.0" y="368.0" font-size="16" fill="#222222" text-anchor="middle" dominant-baseline="central" font-weight="bold">5</text>
  <text x="280" y="408" font-size="16" fill="#222222" text-anchor="middle">色付きの太字は、その回で更新された値</text>
  <text x="280" y="430" font-size="16" fill="#222222" text-anchor="middle">k 回目の後には、最短路が辺 k 本以下の頂点の距離が確定している</text>
</svg>
