<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="14">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222" font-weight="bold">操作と今の頂点</text>
<g fill="#222">
<text x="20" y="60">1. ADD 3</text><text x="130" y="60">→ 子 1 を作って移る</text>
<text x="20" y="88">2. ADD 1</text><text x="130" y="88">→ 子 2 を作って移る</text>
<text x="20" y="116">3. SAVE 7</text><text x="130" y="116">→ 名前 7 に頂点 2</text>
<text x="20" y="144">4. DELETE</text><text x="130" y="144">→ 親の頂点 1 へ</text>
<text x="20" y="172">5. ADD 4</text><text x="130" y="172">→ 子 3 を作って移る</text>
<text x="20" y="200">6. LOAD 7</text><text x="130" y="200">→ 頂点 2 へ</text>
<text x="20" y="228">7. ADD 5</text><text x="130" y="228">→ 子 4 を作って移る</text>
</g>
<text x="20" y="270" fill="#555" font-size="14">頂点の列は、根からその頂点までの値を並べたもの</text>
<text x="20" y="290" fill="#555" font-size="14">矢印は子から親への向き（par）</text>
<line x1="450" y1="74" x2="450" y2="46" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="398" y1="178" x2="442" y2="104" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="502" y1="178" x2="458" y2="104" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="390" y1="236" x2="390" y2="208" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<circle cx="450" cy="30" r="16" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="450" y="35" text-anchor="middle">0</text>
<text x="474" y="35" fill="#222">空の列（末尾 −1）</text>
<circle cx="450" cy="90" r="16" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/><text x="450" y="95" text-anchor="middle">1</text>
<text x="474" y="95" fill="#222">(3)</text>
<circle cx="390" cy="192" r="16" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/><text x="390" y="197" text-anchor="middle">2</text>
<text x="290" y="182" fill="#222">(3, 1)</text>
<rect x="276" y="192" width="88" height="22" rx="4" fill="#fff3c4" stroke="#9a7a1f"/><text x="320" y="208" text-anchor="middle" fill="#5a4500" font-size="14">名前 7</text>
<circle cx="510" cy="192" r="16" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1.5"/><text x="510" y="197" text-anchor="middle">3</text>
<text x="534" y="197" fill="#222">(3, 4)</text>
<circle cx="390" cy="252" r="16" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="4"/><text x="390" y="257" text-anchor="middle" font-weight="bold">4</text>
<text x="414" y="257" fill="#222">(3, 1, 5)</text><text x="490" y="257" fill="#1f4e9a" font-weight="bold">← 今の頂点</text>
</svg>
