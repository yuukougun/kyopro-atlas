<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="sans-serif" font-size="14">
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#b03a2e" stroke-width="1.5"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<!-- 正の三角形：O p0 p1、O p1 p2、O p2 p3 -->
<polygon points="40,300 200,260 320,180" fill="#1f4e9a" fill-opacity="0.15" stroke="#1f4e9a" stroke-width="1"/>
<polygon points="40,300 320,180 240,60" fill="#1f4e9a" fill-opacity="0.15" stroke="#1f4e9a" stroke-width="1"/>
<polygon points="40,300 240,60 120,140" fill="#1f4e9a" fill-opacity="0.15" stroke="#1f4e9a" stroke-width="1"/>
<!-- 負の三角形：O p3 p0 -->
<polygon points="40,300 120,140 200,260" fill="url(#hatch)" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="5 3"/>
<!-- 多角形 -->
<polygon points="200,260 320,180 240,60 120,140" fill="none" stroke="#222" stroke-width="3"/>
<circle cx="40" cy="300" r="4" fill="#222"/>
<text x="22" y="324" fill="#222">O（原点）</text>
<text x="196" y="282" fill="#222">p0 (4, 1)</text>
<text x="328" y="184" fill="#222">p1 (7, 3)</text>
<text x="230" y="50" fill="#222">p2 (5, 6)</text>
<text x="44" y="136" fill="#222">p3 (2, 4)</text>
<text x="370" y="60" fill="#1f4e9a">青（塗り）：正の三角形</text>
<text x="370" y="80" fill="#1f4e9a">cross(p0, p1) = 5</text>
<text x="370" y="100" fill="#1f4e9a">cross(p1, p2) = 27</text>
<text x="370" y="120" fill="#1f4e9a">cross(p2, p3) = 8</text>
<text x="370" y="150" fill="#b03a2e">赤（斜線・破線）：負の三角形</text>
<text x="370" y="170" fill="#b03a2e">cross(p3, p0) = −14</text>
<text x="370" y="210" fill="#222">合計 26 = 面積の 2 倍</text>
<text x="370" y="230" fill="#222">多角形の外側は、青と赤で</text>
<text x="370" y="250" fill="#222">1 回ずつ覆われて打ち消し合う</text>
</svg>
