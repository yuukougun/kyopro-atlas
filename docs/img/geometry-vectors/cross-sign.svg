<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="sans-serif" font-size="14">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9a"/></marker>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d98880" stroke-width="2"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<!-- 左：b が a の左にある（外積は正） -->
<text x="20" y="24" fill="#222">b が a の左（反時計回りの側）</text>
<polygon points="40,210 200,170 240,50 80,90" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="40" y1="210" x2="200" y2="170" stroke="#222" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="40" y1="210" x2="80" y2="90" stroke="#1f4e9a" stroke-width="2.5" marker-end="url(#arb)"/>
<path d="M 72,202 A 33 33 0 0 0 51,179" fill="none" stroke="#1f4e9a" stroke-width="1.5" marker-end="url(#arb)"/>
<text x="206" y="186" fill="#222">a = (4, 1)</text>
<text x="20" y="70" fill="#1f4e9a">b = (1, 3)</text>
<text x="112" y="140" fill="#1f4e9a" font-weight="bold">面積 11</text>
<text x="20" y="250" fill="#222">cross(a, b) = 4·3 − 1·1 = 11 &gt; 0</text>
<!-- 右：b が a の右にある（外積は負） -->
<text x="350" y="24" fill="#222">b が a の右（時計回りの側）</text>
<polygon points="370,110 530,70 650,150 490,190" fill="url(#hatch)" stroke="#b03a2e" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="370" y1="110" x2="530" y2="70" stroke="#222" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="370" y1="110" x2="490" y2="190" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M 402,102 A 33 33 0 0 1 397,128" fill="none" stroke="#b03a2e" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="536" y="66" fill="#222">a = (4, 1)</text>
<text x="420" y="212" fill="#b03a2e">b = (3, −2)</text>
<text x="482" y="136" fill="#b03a2e" font-weight="bold">面積 11</text>
<text x="350" y="250" fill="#222">cross(a, b) = 4·(−2) − 1·3 = −11 &lt; 0</text>
</svg>
