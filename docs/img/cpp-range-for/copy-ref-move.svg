<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 550" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="420" height="550" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- コピー -->
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#000000">コピー：auto b = a;</text>
  <text x="20" y="80" fill="#000000">a</text>
  <rect x="40" y="56" width="140" height="36" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="110" y="80" text-anchor="middle" fill="#000000">1 2 3</text>
  <text x="230" y="80" fill="#000000">b</text>
  <rect x="250" y="56" width="140" height="36" fill="#dbeafe" stroke="#1e40af" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="320" y="80" text-anchor="middle" fill="#000000">1 2 3</text>
  <text x="20" y="124" fill="#000000">箱が増える（N 個を写す）</text>
  <text x="20" y="148" fill="#000000">b を変えても a は変わらない</text>
  <line x1="10" y1="168" x2="410" y2="168" stroke="#d1d5db" stroke-width="1"/>

  <!-- 参照 -->
  <text x="20" y="200" font-size="18" font-weight="bold" fill="#000000">参照：auto&amp; r = a;</text>
  <text x="20" y="250" fill="#000000">a</text>
  <rect x="40" y="226" width="140" height="36" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="110" y="250" text-anchor="middle" fill="#000000">1 2 3</text>
  <text x="250" y="250" fill="#000000">r</text>
  <line x1="244" y1="244" x2="186" y2="244" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="20" y="294" fill="#000000">箱は 1 つのまま（名前だけ増える）</text>
  <text x="20" y="318" fill="#000000">r を変えると a が変わる</text>
  <line x1="10" y1="338" x2="410" y2="338" stroke="#d1d5db" stroke-width="1"/>

  <!-- ムーブ -->
  <text x="20" y="370" font-size="18" font-weight="bold" fill="#000000">ムーブ：auto b = move(a);</text>
  <text x="20" y="420" fill="#000000">a</text>
  <rect x="40" y="396" width="140" height="36" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="110" y="420" text-anchor="middle" fill="#6b7280">（空）</text>
  <text x="230" y="420" fill="#000000">b</text>
  <rect x="250" y="396" width="140" height="36" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="320" y="420" text-anchor="middle" fill="#000000">1 2 3</text>
  <line x1="184" y1="414" x2="224" y2="414" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="20" y="464" fill="#000000">中身の置き場所を渡すだけ（O(1)）</text>
  <text x="20" y="488" fill="#000000">a は手元では空になる</text>
  <line x1="10" y1="508" x2="410" y2="508" stroke="#d1d5db" stroke-width="1"/>

  <text x="20" y="536" fill="#333333">swap(a, b) も置き場所の交換だけで O(1)</text>
</svg>
