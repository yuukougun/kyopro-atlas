<text x="179" y="316" fill="#222">行 5</text>
<text x="179" y="333" fill="#555">帰 2</text>
<circle cx="265" cy="320" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="265" y="325" text-anchor="middle" fill="#1f4e9a" font-weight="bold">6</text>
<text x="289" y="316" fill="#222">行 6</text>
<text x="289" y="333" fill="#555">帰 3</text>
<line x1="340" y1="70" x2="380" y2="70" stroke="#1f4e9a" stroke-width="3"/>
<text x="390" y="75" fill="#222">たどった辺（DFS 木）</text>
<line x1="340" y1="100" x2="380" y2="100" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="390" y="105" fill="#222">訪問済みの頂点へ向かう辺</text>
<text x="390" y="123" fill="#555">（たどらない）</text>
<text x="340" y="175" fill="#222">行きがけ順（入った順）</text>
<text x="340" y="200" fill="#1f4e9a" font-weight="bold" font-size="17">1  2  4  5  3  6</text>
<text x="340" y="245" fill="#222">帰りがけ順（出た順）</text>
<text x="340" y="270" fill="#1f4e9a" font-weight="bold" font-size="17">4  3  6  5  2  1</text>
<text x="340" y="315" fill="#555">「行 i・帰 j」：行きがけ順で</text>
<text x="340" y="334" fill="#555">i 番目、帰りがけ順で j 番目</text>
</svg>
