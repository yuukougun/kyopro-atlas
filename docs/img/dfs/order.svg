<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222">頂点 1 から DFS（隣は番号の小さい順に調べる）</text>
<line x1="170" y1="70" x2="110" y2="150" stroke="#1f4e9a" stroke-width="3"/>
<line x1="110" y1="150" x2="55" y2="235" stroke="#1f4e9a" stroke-width="3"/>
<line x1="110" y1="150" x2="170" y2="235" stroke="#1f4e9a" stroke-width="3"/>
<line x1="170" y1="235" x2="230" y2="320" stroke="#1f4e9a" stroke-width="3"/>
<line x1="170" y1="235" x2="115" y2="320" stroke="#1f4e9a" stroke-width="3"/>
<path d="M170,70 Q300,170 230,320" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="170" cy="70" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="170" y="75" text-anchor="middle" fill="#1f4e9a" font-weight="bold">1</text>
<text x="146" y="66" text-anchor="end" fill="#222" font-size="12">行 1</text>
<text x="146" y="82" text-anchor="end" fill="#555" font-size="12">帰 6</text>
<circle cx="110" cy="150" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="110" y="155" text-anchor="middle" fill="#1f4e9a" font-weight="bold">2</text>
<text x="86" y="146" text-anchor="end" fill="#222" font-size="12">行 2</text>
<text x="86" y="162" text-anchor="end" fill="#555" font-size="12">帰 5</text>
<circle cx="55" cy="235" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="55" y="240" text-anchor="middle" fill="#1f4e9a" font-weight="bold">4</text>
<text x="31" y="231" text-anchor="end" fill="#222" font-size="12">行 3</text>
<text x="31" y="247" text-anchor="end" fill="#555" font-size="12">帰 1</text>
<circle cx="170" cy="235" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="170" y="240" text-anchor="middle" fill="#1f4e9a" font-weight="bold">5</text>
<text x="194" y="231" text-anchor="start" fill="#222" font-size="12">行 4</text>
<text x="194" y="247" text-anchor="start" fill="#555" font-size="12">帰 4</text>
<circle cx="115" cy="320" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="115" y="325" text-anchor="middle" fill="#1f4e9a" font-weight="bold">6</text>
<text x="91" y="316" text-anchor="end" fill="#222" font-size="12">行 6</text>
<text x="91" y="332" text-anchor="end" fill="#555" font-size="12">帰 3</text>
<circle cx="230" cy="320" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="230" y="325" text-anchor="middle" fill="#1f4e9a" font-weight="bold">3</text>
<text x="254" y="316" text-anchor="start" fill="#222" font-size="12">行 5</text>
<text x="254" y="332" text-anchor="start" fill="#555" font-size="12">帰 2</text>
<line x1="340" y1="70" x2="380" y2="70" stroke="#1f4e9a" stroke-width="3"/>
<text x="390" y="75" fill="#222" font-size="13">たどった辺（DFS 木）</text>
<line x1="340" y1="100" x2="380" y2="100" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="390" y="105" fill="#222" font-size="13">訪問済みの頂点へ向かう辺</text>
<text x="390" y="122" fill="#555" font-size="12">（たどらない）</text>
<text x="340" y="175" fill="#222">行きがけ順（入った順）</text>
<text x="340" y="200" fill="#1f4e9a" font-weight="bold" font-size="16">1  2  4  5  3  6</text>
<text x="340" y="245" fill="#222">帰りがけ順（出た順）</text>
<text x="340" y="270" fill="#1f4e9a" font-weight="bold" font-size="16">4  3  6  5  2  1</text>
<text x="340" y="315" fill="#555" font-size="12">「行 i・帰 j」は、その頂点が</text>
<text x="340" y="332" fill="#555" font-size="12">行きがけ順で i 番目、帰りがけ順で j 番目</text>
</svg>
