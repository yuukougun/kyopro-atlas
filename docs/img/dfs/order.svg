<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370" font-family="sans-serif" font-size="17">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" fill="#222">頂点 1 から DFS（隣は番号の小さい順に調べる）</text>
<line x1="190" y1="70" x2="130" y2="150" stroke="#1f4e9a" stroke-width="3"/>
<line x1="130" y1="150" x2="85" y2="235" stroke="#1f4e9a" stroke-width="3"/>
<line x1="130" y1="150" x2="210" y2="235" stroke="#1f4e9a" stroke-width="3"/>
<line x1="210" y1="235" x2="155" y2="320" stroke="#1f4e9a" stroke-width="3"/>
<line x1="210" y1="235" x2="265" y2="320" stroke="#1f4e9a" stroke-width="3"/>
<path d="M172,78 C0,100 0,300 137,322" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="190" cy="70" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="190" y="75" text-anchor="middle" fill="#1f4e9a" font-weight="bold">1</text>
<text x="214" y="66" fill="#222">行 1</text>
<text x="214" y="83" fill="#555">帰 6</text>
<circle cx="130" cy="150" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="130" y="155" text-anchor="middle" fill="#1f4e9a" font-weight="bold">2</text>
<text x="106" y="146" text-anchor="end" fill="#222">行 2</text>
<text x="106" y="163" text-anchor="end" fill="#555">帰 5</text>
<circle cx="85" cy="235" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="85" y="240" text-anchor="middle" fill="#1f4e9a" font-weight="bold">4</text>
<text x="109" y="231" fill="#222">行 3</text>
<text x="109" y="248" fill="#555">帰 1</text>
<circle cx="210" cy="235" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="210" y="240" text-anchor="middle" fill="#1f4e9a" font-weight="bold">5</text>
<text x="234" y="231" fill="#222">行 4</text>
<text x="234" y="248" fill="#555">帰 4</text>
<circle cx="155" cy="320" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
