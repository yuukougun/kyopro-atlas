<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- 列の見出し -->
  <text x="170" y="34" text-anchor="middle" font-weight="bold" fill="#222222">t = 0</text>
  <text x="370" y="34" text-anchor="middle" font-weight="bold" fill="#222222">t = 1（p₁ = 0.6）</text>
  <text x="570" y="34" text-anchor="middle" font-weight="bold" fill="#222222">t = 2（p₂ = 0.5）</text>
  <!-- 行の見出し -->
  <text x="20" y="95" fill="#222222">表 0 枚</text>
  <text x="20" y="175" fill="#222222">表 1 枚</text>
  <text x="20" y="255" fill="#222222">表 2 枚</text>
  <!-- t = 0 -->
  <rect x="120" y="68" width="100" height="44" rx="6" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="2"/>
  <text x="170" y="96" text-anchor="middle" fill="#111111">1</text>
  <rect x="120" y="148" width="100" height="44" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/>
  <text x="170" y="176" text-anchor="middle" fill="#888888">0</text>
  <rect x="120" y="228" width="100" height="44" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/>
  <text x="170" y="256" text-anchor="middle" fill="#888888">0</text>
  <!-- t = 1 -->
  <rect x="320" y="68" width="100" height="44" rx="6" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="2"/>
  <text x="370" y="96" text-anchor="middle" fill="#111111">0.4</text>
  <rect x="320" y="148" width="100" height="44" rx="6" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="2"/>
  <text x="370" y="176" text-anchor="middle" fill="#111111">0.6</text>
  <rect x="320" y="228" width="100" height="44" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="4 3"/>
  <text x="370" y="256" text-anchor="middle" fill="#888888">0</text>
  <!-- t = 2 -->
  <rect x="500" y="68" width="140" height="44" rx="6" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="2"/>
  <text x="570" y="96" text-anchor="middle" fill="#111111">0.2</text>
  <rect x="500" y="148" width="140" height="44" rx="6" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="2"/>
  <text x="570" y="176" text-anchor="middle" fill="#111111">0.3 + 0.2 = 0.5</text>
  <rect x="500" y="228" width="140" height="44" rx="6" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="2"/>
  <text x="570" y="256" text-anchor="middle" fill="#111111">0.3</text>
  <!-- 0 → 1：裏は実線で横、表は破線で斜め下 -->
  <line x1="220" y1="90" x2="318" y2="90" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="269" y="82" text-anchor="middle" font-size="13" fill="#333333">裏 ×0.4</text>
  <line x1="220" y1="102" x2="318" y2="160" stroke="#333333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="252" y="148" text-anchor="middle" font-size="13" fill="#333333">表 ×0.6</text>
  <!-- 1 → 2：2 枚目の確率はどの箱からも同じなので、ラベルは表 0 枚の箱から出る 1 組だけ -->
  <line x1="420" y1="90" x2="498" y2="90" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="459" y="82" text-anchor="middle" font-size="13" fill="#333333">裏 ×0.5</text>
  <line x1="420" y1="102" x2="498" y2="160" stroke="#333333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="445" y="148" text-anchor="middle" font-size="13" fill="#333333">表 ×0.5</text>
  <line x1="420" y1="176" x2="498" y2="176" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="182" x2="498" y2="240" stroke="#333333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <!-- 和 -->
  <line x1="110" y1="292" x2="640" y2="292" stroke="#bbbbbb"/>
  <text x="170" y="318" text-anchor="middle" fill="#222222">和 1</text>
  <text x="370" y="318" text-anchor="middle" fill="#222222">和 0.4 + 0.6 = 1</text>
  <text x="570" y="318" text-anchor="middle" fill="#222222">和 0.2 + 0.5 + 0.3 = 1</text>
  <text x="340" y="346" text-anchor="middle" font-size="13" fill="#555555">実線の矢印 = 裏（表の枚数はそのまま）、破線の矢印 = 表（1 枚増える）</text>
</svg>
