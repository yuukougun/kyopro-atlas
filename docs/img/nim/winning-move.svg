<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="sans-serif" font-size="15">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="175.0" y="45" text-anchor="middle" fill="#555" font-size="13">4 の位</text>
<text x="225.0" y="45" text-anchor="middle" fill="#555" font-size="13">2 の位</text>
<text x="275.0" y="45" text-anchor="middle" fill="#555" font-size="13">1 の位</text>
<rect x="203" y="58" width="44" height="174" fill="#fff3c4" stroke="#b7950b" stroke-dasharray="4 3"/>
<rect x="20" y="60" width="285" height="34" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="30" y="84" fill="#222">山 1：3</text>
<text x="175.0" y="84" text-anchor="middle" fill="#222">0</text>
<text x="225.0" y="84" text-anchor="middle" fill="#222">1</text>
<text x="275.0" y="84" text-anchor="middle" fill="#222">1</text>
<text x="30" y="124" fill="#222">山 2：4</text>
<text x="175.0" y="124" text-anchor="middle" fill="#222">1</text>
<text x="225.0" y="124" text-anchor="middle" fill="#222">0</text>
<text x="275.0" y="124" text-anchor="middle" fill="#222">0</text>
<text x="30" y="164" fill="#222">山 3：5</text>
<text x="175.0" y="164" text-anchor="middle" fill="#222">1</text>
<text x="225.0" y="164" text-anchor="middle" fill="#222">0</text>
<text x="275.0" y="164" text-anchor="middle" fill="#222">1</text>
<line x1="20" y1="182" x2="300" y2="182" stroke="#222" stroke-width="1.5"/>
<text x="30" y="212" fill="#222" font-weight="bold">XOR：2</text>
<text x="175.0" y="212" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<text x="225.0" y="212" text-anchor="middle" fill="#222" font-weight="bold">1</text>
<text x="275.0" y="212" text-anchor="middle" fill="#222" font-weight="bold">0</text>
<text x="325" y="84" fill="#c0392b">2 の位が 1 の山（実線の枠）を選ぶ</text>
<text x="325" y="108" fill="#222">3 → 3 ⊕ 2 = 1（2 個取る）</text>
<text x="325" y="144" fill="#555" font-size="13">山 2・山 3 は 2 の位が 0 なので、</text>
<text x="325" y="164" fill="#555" font-size="13">4 ⊕ 2 = 6、5 ⊕ 2 = 7 と増えてしまう</text>
<text x="325" y="212" fill="#222">XOR の最上位の 1 は 2 の位（点線）</text>
<text x="20" y="280" fill="#222">取った後は 1 ⊕ 4 ⊕ 5 = 0 で、相手に XOR が 0 の局面を渡せる</text>
</svg>
