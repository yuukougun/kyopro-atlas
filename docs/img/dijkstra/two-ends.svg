<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="600" height="230" fill="#ffffff"/>
  <path d="M80,130 C150,40 220,40 268,80" stroke="#1f4e9c" stroke-width="3" fill="none" marker-end="url(#arr2)"/>
  <path d="M302,80 C350,40 420,40 480,130" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 5" fill="none" marker-end="url(#arr2)"/>
  <g stroke="#222222" stroke-width="2" fill="#ffffff">
    <circle cx="60" cy="140" r="22"/>
    <circle cx="285" cy="95" r="22"/>
    <circle cx="500" cy="140" r="22"/>
  </g>
  <g font-size="18" fill="#222222" text-anchor="middle" dominant-baseline="central">
    <text x="60" y="140">s</text>
    <text x="285" y="95">k</text>
    <text x="500" y="140">t</text>
  </g>
  <text x="40" y="32" font-size="17" fill="#1f4e9c">dS[k]：s から k への距離</text>
  <text x="330" y="32" font-size="17" fill="#2e7d32">dT[k]：k から t への距離</text>
  <text x="300" y="192" font-size="17" fill="#222222" text-anchor="middle">k を通る最短路の長さ ＝ dS[k] ＋ dT[k]</text>
  <text x="300" y="216" font-size="17" fill="#444444" text-anchor="middle">有向グラフなら dT は逆向きのグラフで t から求める</text>
</svg>
