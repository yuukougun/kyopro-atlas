<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 530" width="460" height="530" font-family="sans-serif">
<rect width="460" height="530" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<text x="20" y="26" font-size="15" text-anchor="start" font-weight="bold" fill="#222">配列のいもす法：[1, 4) に +3</text>
