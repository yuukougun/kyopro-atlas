<text x="352" y="178" font-size="14" text-anchor="middle" font-weight="normal" fill="#222">0</text>
<text x="20" y="232" font-size="15" text-anchor="start" font-weight="bold" fill="#222">木のいもす法：部分木に加算</text>
<text x="20" y="252" font-size="13" text-anchor="start" font-weight="normal" fill="#222">頂点 2 の部分木に +10、頂点 1 の部分木に +1</text>
<text x="20" y="270" font-size="13" text-anchor="start" font-weight="normal" fill="#222">（印は部分木の根に置く）</text>
