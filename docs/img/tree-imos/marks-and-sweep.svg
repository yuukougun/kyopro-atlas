<rect x="154" y="78" width="44" height="36" fill="#fff" stroke="#444"/>
<text x="176" y="102" font-size="14" text-anchor="middle" font-weight="normal" fill="#222">+3</text>
<text x="176" y="72" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">1</text>
<rect x="198" y="78" width="44" height="36" fill="#fff" stroke="#444"/>
