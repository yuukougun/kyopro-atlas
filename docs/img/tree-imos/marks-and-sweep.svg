<text x="93" y="365" font-size="14" text-anchor="start" font-weight="normal" fill="#1f4e9a">+10</text>
<circle cx="150" cy="360" r="17" fill="#fff" stroke="#222" stroke-width="1.5" stroke-dasharray="4 3"/>
