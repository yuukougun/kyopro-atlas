<text x="308" y="102" font-size="14" text-anchor="middle" font-weight="normal" fill="#222">−3</text>
<text x="308" y="72" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">4</text>
<rect x="330" y="78" width="44" height="36" fill="#fff" stroke="#444"/>
<text x="352" y="102" font-size="14" text-anchor="middle" font-weight="normal" fill="#222">0</text>
<text x="352" y="72" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">5</text>
<line x1="242" y1="120" x2="242" y2="148" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
