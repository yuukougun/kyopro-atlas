<text x="333" y="365" font-size="14" text-anchor="start" font-weight="normal" fill="#1f4e9a">11</text>
<circle cx="390" cy="360" r="17" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="390" y="365" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">3</text>
<text x="413" y="365" font-size="14" text-anchor="start" font-weight="normal" fill="#1f4e9a">1</text>
<circle cx="280" cy="420" r="17" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="280" y="425" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">4</text>
<text x="303" y="425" font-size="14" text-anchor="start" font-weight="normal" fill="#1f4e9a">11</text>
<circle cx="340" cy="420" r="17" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="340" y="425" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">5</text>
<text x="363" y="425" font-size="14" text-anchor="start" font-weight="normal" fill="#1f4e9a">11</text>
<line x1="200" y1="332" x2="262" y2="332" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
<text x="231" y="322" font-size="13" text-anchor="middle" font-weight="normal" fill="#222">根から下へ</text>
<text x="231" y="352" font-size="13" text-anchor="middle" font-weight="normal" fill="#222">子 += 親</text>
<text x="110" y="462" font-size="13" text-anchor="middle" font-weight="normal" fill="#222">印（太い円が印のある頂点）</text>
<text x="350" y="462" font-size="13" text-anchor="middle" font-weight="normal" fill="#222">累積した後の値</text>
<text x="230" y="496" font-size="13" text-anchor="middle" font-weight="normal" fill="#222">どちらも「印を置く」→「1 回の走査で累積する」の 2 段階</text>
<text x="230" y="516" font-size="13" text-anchor="middle" font-weight="normal" fill="#222">違うのは累積の向きだけ</text>
