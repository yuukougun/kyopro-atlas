<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="26" fill="#222" font-weight="bold">一列：左から決めると、選択肢の数は前の選び方によらない</text>
<line x1="90" y1="70" x2="150" y2="70" stroke="#333" stroke-width="2"/>
<line x1="190" y1="70" x2="250" y2="70" stroke="#333" stroke-width="2"/>
<line x1="290" y1="70" x2="350" y2="70" stroke="#333" stroke-width="2"/>
<line x1="390" y1="70" x2="450" y2="70" stroke="#333" stroke-width="2"/>
<circle cx="70" cy="70" r="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="70" y="75" text-anchor="middle" fill="#222">1</text>
<text x="70" y="118" text-anchor="middle" fill="#222" font-size="17">K</text>
<circle cx="170" cy="70" r="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="170" y="75" text-anchor="middle" fill="#222">2</text>
<text x="170" y="118" text-anchor="middle" fill="#222" font-size="17">K−1</text>
<circle cx="270" cy="70" r="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="270" y="75" text-anchor="middle" fill="#222">3</text>
<text x="270" y="118" text-anchor="middle" fill="#222" font-size="17">K−1</text>
<circle cx="370" cy="70" r="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="370" y="75" text-anchor="middle" fill="#222">4</text>
<text x="370" y="118" text-anchor="middle" fill="#222" font-size="17">K−1</text>
<circle cx="470" cy="70" r="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="470" y="75" text-anchor="middle" fill="#222">5</text>
<text x="470" y="118" text-anchor="middle" fill="#222" font-size="17">K−1</text>
<text x="530" y="75" fill="#222">＝ K(K−1)<tspan dy="-6" font-size="11">4</tspan></text>
<text x="20" y="160" fill="#222" font-weight="bold">円環：5 番目は 4 番目とも 1 番目とも隣り合う</text>
<path d="M 470 200 C 470 168, 70 168, 70 200" fill="none" stroke="#b34700" stroke-width="2" stroke-dasharray="6 4"/>
<text x="530" y="196" fill="#b34700" font-size="12">破線：最後と最初</text>
<line x1="90" y1="220" x2="150" y2="220" stroke="#333" stroke-width="2"/>
<line x1="190" y1="220" x2="250" y2="220" stroke="#333" stroke-width="2"/>
<line x1="290" y1="220" x2="350" y2="220" stroke="#333" stroke-width="2"/>
<line x1="390" y1="220" x2="450" y2="220" stroke="#333" stroke-width="2"/>
<circle cx="70" cy="220" r="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="70" y="225" text-anchor="middle" fill="#222">1</text>
<text x="70" y="268" text-anchor="middle" fill="#222" font-size="17">K</text>
<circle cx="170" cy="220" r="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="170" y="225" text-anchor="middle" fill="#222">2</text>
<text x="170" y="268" text-anchor="middle" fill="#222" font-size="17">K−1</text>
<circle cx="270" cy="220" r="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="270" y="225" text-anchor="middle" fill="#222">3</text>
<text x="270" y="268" text-anchor="middle" fill="#222" font-size="17">K−1</text>
<circle cx="370" cy="220" r="20" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="370" y="225" text-anchor="middle" fill="#222">4</text>
<text x="370" y="268" text-anchor="middle" fill="#222" font-size="17">K−1</text>
<circle cx="470" cy="220" r="20" fill="#ffe0cc" stroke="#b34700" stroke-width="2"/>
<text x="470" y="225" text-anchor="middle" fill="#222">5</text>
<rect x="416" y="248" width="108" height="30" fill="none" stroke="#b34700" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="470" y="269" text-anchor="middle" fill="#b34700" font-weight="bold" font-size="17">K−1 か K−2</text>
<text x="530" y="226" fill="#b34700">→ 積にならない</text>
<text x="20" y="300" fill="#555" font-size="14">5 番目の選択肢：4 番目と 1 番目が同じ色なら K−1 通り、違う色なら K−2 通り</text>
</svg>
