<svg xmlns="http://www.w3.org/2000/svg" width="400" height="352" viewBox="0 0 400 352" font-family="sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12" y="24" fill="#222" font-weight="bold">一列：選択肢の数は前の選び方によらない</text>
<line x1="58" y1="64" x2="86" y2="64" stroke="#333" stroke-width="2"/>
<line x1="122" y1="64" x2="150" y2="64" stroke="#333" stroke-width="2"/>
<line x1="186" y1="64" x2="214" y2="64" stroke="#333" stroke-width="2"/>
<line x1="250" y1="64" x2="278" y2="64" stroke="#333" stroke-width="2"/>
<circle cx="40" cy="64" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="40" y="69" text-anchor="middle" fill="#222">1</text>
<circle cx="104" cy="64" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="104" y="69" text-anchor="middle" fill="#222">2</text>
<circle cx="168" cy="64" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="168" y="69" text-anchor="middle" fill="#222">3</text>
<circle cx="232" cy="64" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="232" y="69" text-anchor="middle" fill="#222">4</text>
<circle cx="296" cy="64" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="296" y="69" text-anchor="middle" fill="#222">5</text>
<text x="40" y="106" text-anchor="middle" fill="#222" font-size="16">K</text>
<text x="104" y="106" text-anchor="middle" fill="#222" font-size="16">K−1</text>
<text x="168" y="106" text-anchor="middle" fill="#222" font-size="16">K−1</text>
<text x="232" y="106" text-anchor="middle" fill="#222" font-size="16">K−1</text>
<text x="296" y="106" text-anchor="middle" fill="#222" font-size="16">K−1</text>
<text x="12" y="138" fill="#222">積の法則で K(K−1)<tspan dy="-6" font-size="11">4</tspan><tspan dy="6"> 通り</tspan></text>
<text x="12" y="180" fill="#222" font-weight="bold">円環：5 番目は 4 番目とも 1 番目とも隣り合う</text>
<path d="M 296 216 C 296 190, 40 190, 40 216" fill="none" stroke="#b34700" stroke-width="2" stroke-dasharray="6 4"/>
<text x="330" y="214" fill="#b34700" font-size="12">破線：</text>
<text x="330" y="230" fill="#b34700" font-size="12">最後と最初</text>
<line x1="58" y1="234" x2="86" y2="234" stroke="#333" stroke-width="2"/>
<line x1="122" y1="234" x2="150" y2="234" stroke="#333" stroke-width="2"/>
<line x1="186" y1="234" x2="214" y2="234" stroke="#333" stroke-width="2"/>
<line x1="250" y1="234" x2="278" y2="234" stroke="#333" stroke-width="2"/>
<circle cx="40" cy="234" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="40" y="239" text-anchor="middle" fill="#222">1</text>
<circle cx="104" cy="234" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="104" y="239" text-anchor="middle" fill="#222">2</text>
<circle cx="168" cy="234" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="168" y="239" text-anchor="middle" fill="#222">3</text>
<circle cx="232" cy="234" r="18" fill="#cfe3ff" stroke="#1f4e9a" stroke-width="2"/>
<text x="232" y="239" text-anchor="middle" fill="#222">4</text>
<circle cx="296" cy="234" r="18" fill="#ffe0cc" stroke="#b34700" stroke-width="2"/>
<text x="296" y="239" text-anchor="middle" fill="#222">5</text>
<text x="40" y="276" text-anchor="middle" fill="#222" font-size="16">K</text>
<text x="104" y="276" text-anchor="middle" fill="#222" font-size="16">K−1</text>
<text x="168" y="276" text-anchor="middle" fill="#222" font-size="16">K−1</text>
<text x="232" y="276" text-anchor="middle" fill="#222" font-size="16">K−1</text>
<rect x="254" y="258" width="92" height="26" fill="none" stroke="#b34700" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="300" y="276" text-anchor="middle" fill="#b34700" font-weight="bold" font-size="14">K−1 か K−2</text>
<text x="12" y="312" fill="#555" font-size="13">5 番目：4 番目と 1 番目が同じ色なら K−1 通り、</text>
<text x="12" y="332" fill="#555" font-size="13">違う色なら K−2 通りで、積にならない</text>
</svg>
